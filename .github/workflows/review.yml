# PRs targeting main: full Review on ready PRs; review-draft on draft PRs.
name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_COLOR: true
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review-draft-hk:
    if: ${{ github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Review (draft) - HK hygiene
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/setup-bun-checkout
      - name: HK hygiene (pre-commit parity)
        run: mise exec -- hk check --all --check

  review-draft-test:
    if: ${{ github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Review (draft) - Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/run-bun-test-junit
        with:
          summary_title: Test Results (draft)
          check_name: Tests (draft)
          artifact_name: report-tests-draft

  review-draft-spec:
    if: ${{ github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Review (draft) - Spec gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/setup-bun-checkout
      - name: Spec gate on touched feature dirs
        run: |
          mapfile -t dirs < <(
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" \
              | rg '^assets/specs/[0-9]{3}-[^/]+/' -o \
              | sort -u
          )
          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo "No assets/specs/NNN-* changes; skipping spec gate"
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            echo "── spec gate: ${dir} ──"
            mise run spec gate "$dir"
          done

  hk:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    name: HK - Enforces the local git-hook policy in CI so the policy doesn't depend on the honor system
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-project
        with:
          setup_mode: mise
      - name: HK hygiene (pre-commit parity)
        run: mise exec -- hk check --all --check
      - name: HK CI profile (linters, validate, HEAD commit message)
        run: mise exec -- hk check --all --profile ci --check
      - name: Write lint summary table
        if: always()
        run: |
          {
            echo "## Lint summary"
            echo
            echo "Reports are produced by the **HK CI profile** step (\`hk.pkl\` \`ci\` steps under \`tmp/reports/linters/\`). Biome also emits GitHub annotations and is not listed as a file here."
            echo
            echo "| Tool | Report |"
            echo "| ---- | ------ |"
            shopt -s nullglob
            count=0
            for f in tmp/reports/linters/*; do
              [ -f "$f" ] || continue
              count=$((count + 1))
              printf "| \`%s\` | see artifact |\n" "$(basename "$f")"
            done
            if [ "$count" -eq 0 ]; then
              echo "| _none_ | HK CI profile did not write \`tmp/reports/linters/\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-linters
          path: tmp/reports/linters
          retention-days: 7
          if-no-files-found: ignore

  test:
    if: ${{ !github.event.pull_request.draft }}
    name: Test - Runs the test suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: ./.github/actions/run-bun-test-junit
        with:
          summary_title: Test Results
          check_name: Test
          artifact_name: report-tests

  e2e-smoke:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    name: E2E Smoke - Runs the Playwright BDD smoke suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e-preview
      - name: Run e2e smoke suite
        run: |
          CI=true NODE_ENV=test mise run test e2e --smoke
          CI=true NODE_ENV=test mise run test e2e --metrics-report
      - name: Append E2E smoke summary
        if: always()
        uses: ./.github/actions/junit-summary
        with:
          xml_path: tmp/e2e/junit.xml
          title: E2E Smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-smoke
          path: |
            tmp/e2e/
            tmp/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: tmp/e2e/junit.xml
          fail_on_failure: true
          require_tests: true
          check_name: E2E Smoke

  e2e-regression:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    name: E2E Regression - Runs the Playwright BDD regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e-preview
      - name: Run e2e regression suite
        run: |
          CI=true NODE_ENV=test mise run test e2e --regression
          CI=true NODE_ENV=test mise run test e2e --metrics-report
      - name: Append E2E regression summary
        if: always()
        uses: ./.github/actions/junit-summary
        with:
          xml_path: tmp/e2e/junit.xml
          title: E2E Regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-regression
          path: |
            tmp/e2e/
            tmp/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: tmp/e2e/junit.xml
          fail_on_failure: true
          require_tests: true
          check_name: E2E Regression

  cst:
    # Skip drafts, and skip fork PRs (Docker build needs in-repo secrets/cache).
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    name: CST - Runs the Container Structure Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-project
        with:
          setup_mode: mise
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (linux/amd64, load locally)
        run: mise run docker build --platform amd64
      - name: Run Container Structure Tests
        run: |
          mkdir -p tmp/reports/cst
          mise run docker test \
            --platform amd64 \
            --skip-build \
            --junit tmp/reports/cst/junit.xml
      - name: Append CST summary
        if: always()
        uses: ./.github/actions/junit-summary
        with:
          xml_path: tmp/reports/cst/junit.xml
          title: Container Structure Tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-cst
          path: tmp/reports/cst
          retention-days: 7
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: tmp/reports/cst/junit.xml
          fail_on_failure: true
          require_tests: true
          check_name: Container Structure Tests

  build:
    # hk/cst are skipped on fork PRs; without `always()` + skipped checks, build
    # is skipped when any needed job is skipped (GitHub default success() gate).
    name: Build - Smoke build (unsigned)
    runs-on: ubuntu-24.04
    needs: [hk, test, cst]
    if: >-
      always() &&
      !github.event.pull_request.draft &&
      needs.test.result == 'success' &&
      (needs.hk.result == 'success' || needs.hk.result == 'skipped') &&
      (needs.cst.result == 'success' || needs.cst.result == 'skipped')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-project
        with:
          setup_mode: mise
      - uses: actions/cache@v4
        with:
          path: ~/.electrobun
          key: electrobun-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electrobun-${{ runner.os }}-
      - name: Ensure ElectroBun home exists
        run: mkdir -p ~/.electrobun
      - name: Compile renderer styles
        run: bash tools/scripts/compile_renderer_styles.sh
      - name: Smoke build (forced unsigned)
        env:
          ELECTROBUN_DEVELOPER_ID: ''
        run: |
          # Drop OS-specific CLI stub so electrobun.cjs fetches linux-x64 from releases.
          rm -f node_modules/electrobun/bin/electrobun
          bun run build:ci
      - uses: actions/upload-artifact@v4
        with:
          name: build-smoke-linux-x64
          path: build/
          retention-days: 3
