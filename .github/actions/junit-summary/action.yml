# .github/actions/junit-summary/action.yml
name: JUnit summary
description: Pure-bash JUnit XML → markdown table writer.

inputs:
  xml_path:
    description: Path to the JUnit XML file
    required: true
  output_path:
    description: >-
      File to append the markdown summary to. Defaults to GITHUB_STEP_SUMMARY on
      the runner when unset or empty (do not pass workflow expressions here).
    required: false
    default: ''
  title:
    description: Heading text for the summary section
    required: false
    default: Test Results

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        XML="${{ inputs.xml_path }}"
        TITLE="${{ inputs.title }}"

        OUT="${{ inputs.output_path }}"
        if [[ -z "$OUT" ]]; then
          OUT="${GITHUB_STEP_SUMMARY:-}"
        fi

        append_summary() {
          if [[ -z "${OUT:-}" ]]; then
            echo "junit-summary: no output path; skipping summary append" >&2
            return 0
          fi
          cat >>"$OUT"
        }

        if [[ ! -f "$XML" ]]; then
          {
            echo "## $TITLE"
            echo
            echo "_No JUnit report at \`$XML\`._"
          } | append_summary
          exit 0
        fi
        line="$(grep -oE '<testsuites[^>]*>' "$XML" | head -n 1 || true)"
        if [[ -z "$line" ]]; then
          line="$(grep -oE '<testsuite[^>]*>' "$XML" | head -n 1 || true)"
        fi
        # `|| true` so a missing attribute (e.g. CST junit.xml omits `skipped`)
        # doesn't tear down the script under `set -euo pipefail`.
        get() { printf '%s' "$line" | grep -oE "$1=\"[^\"]+\"" | head -n 1 | sed -E "s/^$1=\"|\"$//g" || true; }
        tests="$(get tests)"
        failures="$(get failures)"
        skipped="$(get skipped)"
        time="$(get time)"
        passed=$(( ${tests:-0} - ${failures:-0} - ${skipped:-0} ))
        {
          echo "## $TITLE"
          echo
          echo "| Tests | Passed | Failed | Skipped | Time (s) |"
          echo "| ----- | ------ | ------ | ------- | -------- |"
          printf '| %s | %s | %s | %s | %s |\n' "${tests:-0}" "$passed" "${failures:-0}" "${skipped:-0}" "${time:-0}"
        } | append_summary
