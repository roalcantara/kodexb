            - adapting component structure
          avoid:
            - bypassing project renderer conventions
      surfaces:
        claude_optional: when translating design artifacts into renderer components
        app_context_optional: Translating design artifacts into renderer components, adapted to project conventions.
  stitch-design:
    location: global
    rationale: Useful for design intake and prototypes. Production src changes still require explicit prototype approval first.
    policy:
      type: optional
      usage:
        summary: Design intake or prototypes under the prototype gate.
        when:
          load:
            - design intake
            - prototypes
            - mock UI requests
          avoid:
            - production src changes without explicit prototype approval
      surfaces:
        claude_optional: for design intake or prototypes, under the prototype gate
        app_context_optional: Design intake or prototypes, only under the prototype gate.
  using-git-worktrees:
    location: global
    rationale: Useful for isolated parallel work, but worktrees should not be created automatically in the normal desktop session.
    policy:
      type: optional
