          avoid:
            - normal single-worktree tasks
      surfaces:
        claude_optional: only when isolated parallel work is requested or approved
        app_context_optional: Isolated parallel work, only when requested or approved.
  verification-before-completion:
    location: global
    rationale: Helpful as a final reminder, but the executable authority is app-quality-gate plus the relevant project guide
