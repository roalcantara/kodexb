    policy:
      type: optional
      usage:
        summary: Final verification reminder.
        when:
          load:
            - final verification reminders
            - completion claims
          avoid:
            - replacing app-quality-gate
      surfaces:
        claude_optional: as a reminder; app-quality-gate remains the executable authority
        app_context_optional: Final reminder only; app-quality-gate is the executable authority.
  agent-electrobun:
    location: global
    rationale: Useful for inspecting a running Electrobun app, but not a replacement for project tests or gates.
