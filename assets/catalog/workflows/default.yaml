# Default kb workflow profile.
# Stage order matches detectPhase() in orchestrated_handoff.script.ts:
#   specify → plan → analyze-plan → tasks → analyze-tasks → handoff-generate → implement → review
schema_version: 009.1.0
name: default
description: "Default SDD workflow profile for kb"

execution_policy:
  allowed_prefixes:
    - "mise run"
    - "hk check"
    - "bun run"
    - "gh"

stages:
  - id: specify
    worker: primary
    evidence:
      - "mise run spec lint"
      - "mise run spec gate"
  - id: plan
    worker: primary
  - id: analyze-plan
    worker: primary
  - id: tasks
    worker: primary
  - id: analyze-tasks
    worker: primary
  - id: handoff-generate
    worker: primary
    human_gated: true
    triggers:
      post: "mise run spec handoff-generate"
  - id: implement
    worker: primary
    sandbox:
      tool_allowlist: ["mise run", "hk check", "bun run", "gh"]
      fs_scope:
        allow_roots: ["${WORKSPACE_ROOT}", "${TMP}/workflow-runs"]
        deny: ["${WORKSPACE_ROOT}/.env", "${WORKSPACE_ROOT}/.git/objects"]
      secret_handling: "redacted"
      network: "offline"
      acknowledged_unsafe: false
  - id: pr-prep
    worker: primary
    triggers:
      post: "hk check --profile pr"
  - id: review
    worker: primary
    human_gated: true
  - id: gate
    worker: primary
    evidence:
      - "mise run spec gate"
      - "bash .agents/skills/app-quality-gate/scripts/gate.sh"

transitions:
  - from: specify
    to: plan
    on: DONE
  - from: plan
    to: analyze-plan
    on: DONE
  - from: analyze-plan
    to: tasks
    on: DONE
  - from: tasks
    to: analyze-tasks
    on: DONE
  - from: analyze-tasks
    to: handoff-generate
    on: DONE
  - from: handoff-generate
    to: implement
    on: DONE
  - from: implement
    to: pr-prep
    on: DONE
  - from: pr-prep
    to: review
    on: DONE
  - from: review
    to: gate
    on: DONE

terminal:
  - gate

default_retry:
  max_attempts: 3
  backoff: exponential
  base_ms: 500
  cap_ms: 30000
  jitter: full
  reset_on_new_cause: true
  escalation_event: stage.escalated

memory:
  conflict: prompt_user
  retention:
    tmp_days: 30
    durable_days: 365

providers:
  pr_open: "gh pr create --title 'workflow: automated PR' --body 'Automated PR from orchestrator'"
  pr_update: "gh pr edit --body '_workflow-run: ${RUN_ID}_'"
  ci_status: "gh pr checks --watch --interval 10 --required"

shutdown:
  grace_ms: 10000
  signals:
    - SIGINT
    - SIGTERM
