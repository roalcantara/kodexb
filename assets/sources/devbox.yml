bookmarks:
  https://ls-lint.org:
    desc: An extremely fast directory and filename linter - Bring some structure to your project filesystem
    tags: [ devbox, lint ]
    links:
      - Installation: https://ls-lint.org/2.2/getting-started/installation.html
      - Configuration: https://ls-lint.org/2.3/configuration/the-basics.html
      - Rules: https://ls-lint.org/2.3/configuration/the-rules.html
      - CLI: https://ls-lint.org/2.3/configuration/the-command-line-interface.html
      - GitHub: https://github.com/loeffel-io/ls-lint
    notes:
      - md: | #markdown
          # LS-Lint

          LS-Lint is a blazing fast linter for file and directory names, designed to enforce naming conventions and catch issues early in the development process. It integrates seamlessly with Devbox, providing real-time feedback on naming issues as you work.

          ## KEY FACTS

          - Minimal setup with simple rules managed in one single or multiple .ls-lint.yml files
          - Works for directory and file names - all extensions supported - full unicode support
          - Incredibly fast - lints thousands of files and directories in milliseconds
          - Support for Windows, MacOS and Linux + NPM Package (opens new window)+ GitHub Action (opens new window)+ Homebrew (opens new window)+ Docker
          - Trusted by Nuxt.js (opens new window), Terser (opens new window), Renovate (opens new window)and many more
          - Almost zero third-party dependencies - only go-yaml (opens new window)and doublestar(opens new window)

          ## KEY FEATURES

          - **Speed**: LS-Lint is optimized for performance, making it suitable for large codebases without slowing down your workflow.
          - **Customizable Rules**: Define your own naming conventions and rules to fit your project's needs.
          - **Integration with Devbox**: Get instant feedback on naming issues directly within your development environment.

          ## BENEFITS

          - **Improved Code Quality**: Enforce consistent naming conventions across your codebase, making it easier to read and maintain.
          - **Early Issue Detection**: Catch naming issues early in the development process, reducing the likelihood of bugs and improving overall code quality.
          - **Enhanced Developer Experience**: With its speed and integration, LS-Lint provides a smooth and efficient linting experience for developers.
      - yml: | #yaml
          # .ls-lint.yml
          ls:
            packages/*/{src,__tests__}:
              .js: kebab-case
              .ts: camelCase | PascalCase
              .d.ts: camelCase
              .spec.ts: camelCase | PascalCase
              .mock.ts: camelCase

            components/*:
              .ts: regex:${0}
              tests:
                .*: exists:0
                .test.ts: regex:${1}

          ignore:
            - node_modules
  https://alexpasmantier.github.io/television:
    desc: Television - A fast, portable and hackable fuzzy finder for the terminal in RUST
    tags: [ devbox, term, fzf ]
    links:
      - Website: https://alexpasmantier.github.io/television
      - GitHub: https://github.com/alexpasmantier/television
      - This Tool Replaced 7 CLIs: https://youtu.be/wwJA9mDqIVc
    notes:
      - md: | #markdown
          # OVERVIEW

          - A fast, portable, and highly hackable fuzzy finder written in Rust.
          - Its unique architecture—specifically its use of `"channels"` and a `remote-controlled UI`—sets it apart as a significant productivity upgrade for terminal users
          - This is not just another alternative to `FZF`!

          ## WHAT IS TELEVISION?

          - TUI-based fuzzy picker that functions differently from traditional piping-based tools.
          - Its core design allows it to act as a remote that switches between different `"channels"` (data sources).
          - Instead of just filtering text input, it integrates pre-baked hooks for various environments like `Git`, `Docker`, `Kubernetes`, `AWS`, and `SSH` hosts.

          ## PURPOSE

          - The primary purpose of TV is to replace multiple disparate CLI utilities.
          - Is it possible to replace over seven different tools any developer workflow including:
            - Ranger (file exploration)
            - Various Kubernetes log readers
            - And custom session pickers like T-Mux Session

          ### HACKABILITY

          - It offers an easy TOML template system to build custom channels, allowing users to define their own sources, actions, and preview commands.

          ### WORKFLOW EFFICIENCY

          - It supports seamless integration with shells like Nushell/ZSH
          - Allows users to trigger actions `(like opening a file in Neovim or switching a Kubernetes context)` directly within the picker.

          ## CONSIDERATIONS

          - It's incredibly fast and offers a clean, tweakable UI with pluggable preview windows.
          - Its ability to handle complex data like logs or cloud resource metadata provides a better flow than traditional pipe-based alternatives.

          ### CHALLENGES

          #### KEY BINDINGS

          - The default key bindings are heavy on `Control` and `F-keys`, which can conflict with common tools like `Neovim`.
          - Configuring a `leader key` or a more intuitive layout is necessary for power users.

          #### CLUNKINESS

          - The tool can feel slightly unfinished in certain areas.
          - Some features—like dynamically adjusting preview sizes on the fly
          - Or executing complex commands on selected files—are not yet natively intuitive.

          #### COMPATIBILITY

          - Some pre-configured channels might encounter issues with Nushell/ZSH or non-Unix environments
          - Requiring manual tweaks to the TOML configuration files.

          ## CONFIGURATION

          - Editing `~/.config/television/config.toml`
          - Customize themes (like `Catppuccin`)
          - Remap keys to avoid conflicts

          ## MAINTENANCE

          - Run `tv update-channels` to regularly keep the tool up to date with the latest community-provided hooks

          ## CONCLUSION

          - While Television is powerful, it is not perfect.
          - Users should be prepared to spend time setting up their own custom channels to truly unlock its potential
  https://youtu.be/ztjlsmJcVnE:
    desc: Stop Overengineering Logs. Use This Instead
    tags: [ devbox, logs ]
    links:
      - https://dozzle.dev/guide/what-is-dozzle
      - https://infisical.com
    notes:
      - md: | #markdown
          # OVERVIEW

          This video advocates for simplifying log management by avoiding "observability kingdoms"—complex, multi-service setups that are often overkill for home labs and small-to-medium container environments.

          ## PRESENTED TOOLS

           ### Dozzle

           - An open-source, lightweight log viewer for Docker, Swarm, and Kubernetes.
           - It offers a user-friendly UI for real-time log streaming, resource monitoring (CPU/memory), and alerting without the heavy footprint of enterprise-grade stacks.
           - Best for home lab users or small teams needing quick debugging access without managing heavy infrastructure.

           #### Best Practices

           - Mount the Docker socket for real-time logs;
           - Use it to replace docker logs or kubectl logs for immediate visual feedback.

           ### Infisical
           - An open-source, secure secrets management tool.
           - Used to prevent hard-coded secrets from leaking into logs by replacing environment variable files with a centralized, secure vault.

           #### Best Practices
           - Integrate the Infisical CLI into your container's entry-point script to fetch secrets at runtime rather than baking them into the image or env files.

           #### Comparison with Traditional Tooling

           | Tool | Description |
           |---|---|
           | ELK/CloudWatch | Powerful and scalable, but high-friction and resource-intensive; often prone to "alert fatigue" and excessive complexity for simple projects. |
           | Dozzle | Provides immediate, local-first insights (using DuckDB for local SQL-like log analytics) without the need for complex ingestion pipelines. |

           ## Author Recommendations & Warnings

           - Recommendation: Use color-coded log levels (3:59-4:39) to make finding errors significantly faster than text-based grep/substring searches.
           - Recommendation: Utilize side-by-side pane layouts (6:41-7:00) when debugging interdependent services.
           - Warning (Alert Fatigue): Be cautious with alert configuration (7:41-8:02). If an alert is too noisy, you will eventually mute it, rendering it useless when a real crisis occurs. Ensure alerts are actionable and configured with appropriate cooling-off periods.
           - Warning (Podman): Note that Podman support in Dozzle can be inconsistent compared to pure Docker setups (1:46).

           ## Conclusion

           - For those looking for a low-friction way to manage logs, Dozzle is a highly recommended tool for immediate, centralized container visibility.
           - For securing applications, Infisical serves as a vital companion to ensure logs remain clean of sensitive secrets.
           - Enterprise solutions like ELK or Grafana Loki are often unnecessary for smaller home setups where Dozzle offers a superior, lightweight experience.
