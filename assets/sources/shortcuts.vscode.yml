shortcuts:
  vscode:
    desc: VS Code default keyboard shortcuts
    tags: [editor, vscode, development]
    bindings:
      - chord: cmd+p
        action: Go to File
        scope: local
        group: navigation
      - chord: cmd+shift+p
        action: Show All Commands
        scope: local
        group: navigation
      - chord: cmd+shift+o
        action: Go to Symbol
        scope: local
        group: navigation
      - chord: cmd+shift+f
        action: Find in Files
        scope: local
        group: search
      - chord: cmd+d
        action: Add Selection to Next Find Match
        scope: local
        group: editing
      - chord: cmd+shift+l
        action: Select All Occurrences of Find Match
        scope: local
        group: editing
      - chord: cmd+/
        action: Toggle Line Comment
        scope: local
        group: editing
      - chord: cmd+shift+7
        action: Toggle Block Comment
        scope: local
        group: editing
      - chord: cmd+b
        action: Toggle Sidebar Visibility
        scope: local
        group: view
      - chord: cmd+j
        action: Toggle Panel
        scope: local
        group: view
      - chord: cmd+shift+e
        action: Show Explorer
        scope: local
        group: view
      - chord: cmd+shift+x
        action: Show Extensions
        scope: local
        group: view
      - chord: cmd+shift+d
        action: Show Run and Debug
        scope: local
        group: debug
      - chord: f5
        action: Start Debugging
        scope: local
        group: debug
      - chord: cmd+shift+b
        action: Build Task
        scope: local
        group: tasks
      - chord: cmd+`
        action: Toggle Terminal
        scope: local
        group: terminal
      - chord: cmd+k cmd+t
        action: Select Color Theme
        scope: local
        group: preferences
      - chord: cmd+,
        action: Open Settings
        scope: local
        group: preferences
      - chord: cmd+k cmd+s
        action: Open Keyboard Shortcuts
        scope: local
        group: preferences
