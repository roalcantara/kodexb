  https://typescriptlang.org/docs/handbook/utility-types.html:
    desc: TypeScript Utility Types
    tags: [ts]
    notes:
      - md: | #markdown
          ## Utility Types in TypeScript

          TypeScript provides several built-in utility types to facilitate common type transformations. Here are some of the most commonly used utility types:

          1. **Partial<T>**: Constructs a type with all properties of T set to optional.
          2. **Required<T>**: Constructs a type with all properties of T set to required.
          3. **Readonly<T>**: Constructs a type with all properties of T set to readonly.
          4. **Record<K, T>**: Constructs an object type whose property keys are K and property values are T.
          5. **Pick<T, K>**: Constructs a type by picking a set of properties K from T.
          6. **Omit<T, K>**: Constructs a type by omitting a set of properties K from T.
          7. **Exclude<T, U>**: Constructs a type by excluding from T all union members that are assignable to U.
          8. **Extract<T, U>**: Constructs a type by extracting from T all union members that are assignable to U.
          9. **NonNullable<T>**: Constructs a type by excluding null and undefined from T.
          10. **ReturnType<T>**: Constructs a type consisting of the return type of function T.
          11. **InstanceType<T>**: Constructs a type consisting of the instance type of a constructor function T.

          These utility types help in creating more flexible and reusable types in TypeScript, enhancing code maintainability and readability.
  https://typescriptlang.org/docs/handbook/declaration-merging.html:
    desc: TypeScript Declaration Merging
    tags: [ts]
    notes:
      - md: | #markdown
          ## Declaration Merging in TypeScript

          - Declaration merging is a powerful feature in TypeScript that allows multiple declarations with the same name to be combined into a single definition.
          - This is particularly useful for extending existing types, interfaces, or modules without modifying their original definitions.

          ### Key Concepts of Declaration Merging:

          1. **Interface Merging**: When two or more interfaces with the same name are declared, TypeScript merges their properties into a single interface.
          2. **Namespace Merging**: Namespaces with the same name are merged, allowing you to add new members to an existing namespace.
          3. **Function and Class Merging**: Functions and classes can also be merged with namespaces, allowing you to add static members to a class or function.
          4. **Module Augmentation**: You can augment existing modules by declaring additional types or interfaces within the same module scope.
  https://typescriptlang.org/docs/handbook/iterators-and-generators.html:
    desc: TypeScript Iterators and Generators
    tags: [ts]
    notes:
      - md: | #markdown
          ## Iterators and Generators in TypeScript

          - Iterators are objects that define a sequence and potentially a return value upon its termination. They implement the `Iterator` interface, which has a `next()` method that returns an object with `value` and `done` properties.
          - Generators are special types of functions that can be paused and resumed, allowing them to produce a sequence of values over time. They are defined using the `function*` syntax and use the `yield` keyword to produce values.

          ### Key Concepts:

          1. **Iterator Interface**: An object that implements the `Iterator` interface must have a `next()` method that returns an object with `value` and `done` properties.
          2. **Generator Functions**: Defined using the `function*` syntax, generator functions can yield multiple values over time and maintain their state between executions.
          3. **Yielding Values**: The `yield` keyword is used within generator functions to produce a value and pause execution until the next value is requested.
          4. **Iterating Over Generators**: Generators can be iterated using loops (like `for...of`) or by manually calling the `next()` method.

          These features enable more complex data processing patterns, such as lazy evaluation and asynchronous programming, making TypeScript a powerful tool for handling sequences of data.
  https://typescriptlang.org/docs/handbook/mixins.html:
    desc: TypeScript Mixins - Quick Reference
    tags: [ts]
    notes:
      - md: | #markdown
          ### TypeScript Mixins - Quick Reference

          > 💡 Mixins let you build classes by *combining behaviors*, instead of relying only on inheritance chains.
          > TypeScript models mixins using **class expressions + generics**.

          ---

          #### TL;DR Mental Model

          • A mixin is a *function* from class → extended class.
          • Use `Constructor`/`GConstructor` to type-check base classes.
          • Constrained mixins let you enforce required behaviors.
          • Decorators ≠ mixins (types do not merge).
          • For static generics, wrap classes in factory functions.

          Mixins shine when you want small, orthogonal behaviors that snap together like LEGO pieces.
      - md: | #markdown
          #### 1. Basic Mixin Pattern

          > 💡 A mixin is a function that takes a base class and returns a new class extending it.

          ```ts
          class Sprite {
            constructor(public name: string, public x = 0, public y = 0) {}
          }

          type Constructor = new (...args: any[]) => {};

          function Scale<TBase extends Constructor>(Base: TBase) {
            return class extends Base {
              #scale = 1; // private ES2020 field

              setScale(n: number) { this.#scale = n; }
              get scale() { return this.#scale; }
            };
          }

          const EightBitSprite = Scale(Sprite);

          const bird = new EightBitSprite("Bird");
          bird.setScale(0.8);
          console.log(bird.scale);
          ```

          ---

          #### 2. Constrained Mixins

          > 💡 Add constraints when your mixin *requires* the base to implement something.
          > This ensures the mixin only applies to compatible classes.

          ```ts
          type GConstructor<T = {}> = new (...args: any[]) => T;

          type Positionable = GConstructor<{ setPos(x: number, y: number): void }>;

          function Jumpable<TBase extends Positionable>(Base: TBase) {
            return class extends Base {
              jump() {
                this.setPos(0, 20); // guaranteed safe by constraint
              }
            };
          }
          ```

          ---

          #### 3. Older "Interface-merge" Pattern (Still Useful)

          > 💡 This approach builds mixins as normal classes and merges their types afterward.

          **Pros:** flexible at runtime.
          **Cons:** compiler can't infer relationships automatically.

          ```ts
          class Jumpable { jump() {} }
          class Duckable { duck() {} }

          class Sprite {
            x = 0;
            y = 0;
          }

          interface Sprite extends Jumpable, Duckable {}
          applyMixins(Sprite, [Jumpable, Duckable]);

          function applyMixins(derived: any, bases: any[]) {
            bases.forEach(base => {
              Object.getOwnPropertyNames(base.prototype).forEach(name => {
                Object.defineProperty(
                  derived.prototype,
                  name,
                  Object.getOwnPropertyDescriptor(base.prototype, name) ?? Object.create(null)
                );
              });
            });
          }

          const player = new Sprite();
          player.jump();
          ```

          ---

          #### 4. Decorators *Don't* Create Mixin Types

          > 💡 Decorators modify runtime behavior but **don't merge types**.
          > **Workaround:** cast or create an explicit intersection type.

          ```ts
          const Pausable = (Cls: typeof Player) =>
            class extends Cls { shouldFreeze = false };

          @Pausable
          class Player { x = 0; y = 0; }

          new Player().shouldFreeze; // ❌ Type error
          ```

          ---

          #### 5. Static Property Gotcha

          > 💡 Class-expression mixins generate singleton constructors, so static properties
          >
          > don't behave generically across mixins unless you wrap them in functions.

          ```ts
          function base<T>() {
            return class { static prop: T; };
          }

          function derived<T>() {
            return class extends base<T>() { static anotherProp: T; };
          }

          class Spec extends derived<string>() {}

          Spec.prop;         // string
          Spec.anotherProp;  // string
          ```
