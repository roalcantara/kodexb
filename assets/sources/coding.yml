    links: [https://ktlint.github.io]
  ktlint 'src/**/*.kt' '!src/**/*Test.kt':
    desc: Check all '.kt' files in 'src/' directory, but ignore files ending with 'Test.kt'
    tags: [kotlin, ktlint, lint]
    links: [https://ktlint.github.io]
  ktlint generateEditorConfig ktlint_official:
    desc: Specify the code style(ktlint_official, intellij_idea or android_studio) to be used when generating the .editorconfig
