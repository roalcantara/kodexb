    https://typescriptlang.org/docs/handbook/2/functions.html:
      desc: TypeScript Functions
      tags: [ts]

      notes:
        - md: | #markdown
            ## Functions in TypeScript

            - Functions are a fundamental building block in TypeScript, allowing you to encapsulate reusable logic.
            - TypeScript enhances JavaScript functions by adding static types, enabling better type checking and IntelliSense support.

            ### Key Concepts:

            1. **Function Types**: You can define the types of function parameters and return values to ensure type safety.
            2. **Optional and Default Parameters**: TypeScript allows you to specify optional parameters using the `?` syntax and provide default values for parameters.
            3. **Rest Parameters**: You can use rest parameters to represent an indefinite number of arguments as an array.
            4. **Function Overloading**: TypeScript supports function overloading, allowing you to define multiple signatures for a single function implementation.
            5. **Arrow Functions**: TypeScript fully supports arrow functions, which provide a concise syntax and lexical `this` binding.

            These features make functions in TypeScript more robust and easier to work with, enhancing code quality and maintainability.
    https://www.typescriptlang.org/docs/handbook/2/conditional-types.html:
      desc: TypeScript Conditional Types
      tags: [ts]

      notes:
        - md: | #markdown
            ## Conditional Types in TypeScript

            - Conditional types in TypeScript allow you to express types that depend on a condition, enabling more dynamic and flexible type definitions.
            - They are defined using the syntax `T extends U ? X : Y`, where `T` is checked against `U`, and based on the result, either type `X` or type `Y` is selected.

            ### Key Concepts:

            1. **Type Relationships**: Conditional types can be used to create types that change based on the relationship between types.
            2. **Distributive Conditional Types**: When applied to union types, conditional types distribute over each member of the union.
            3. **Infer Keyword**: The `infer` keyword can be used within conditional types to extract and work with types from other types.
            4. **Utility Types**: Many built-in utility types in TypeScript, such as `ReturnType` and `InstanceType`, are implemented using conditional types.

            These features make conditional types a powerful tool for creating advanced type manipulations in TypeScript, enhancing type safety and expressiveness.
        - md: | #markdown
            ### Cheatsheet

            Conditional types allow you to express non-uniform type mappings, where the resulting type depends on a condition.

            ```ts
            T extends U ? X : Y
            ```

            - If `T` is assignable to `U`, the type resolves to `X`; otherwise, it resolves to `Y`.

            #### Example 1: Basic Conditional Type

            ```ts
            type IsString<T> = T extends string ? true : false;

            type A = IsString<string>; // true
            type B = IsString<number>; // false
            ```

            #### Example 2: Distributive Conditional Types

            ```ts
            type ToArray<T> = T extends any ? T[] : never;

            type C = ToArray<string | number>; // string[] | number[]
            ```

            #### Example 3: Using `infer`

            ```ts
            type ReturnType<T> = T extends (...args: any[]) => infer R ? R : any;

            type D = ReturnType<() => number>; // number
            type E = ReturnType<(x: string) => void>; // void
            ```

            #### Example 4: Nested Conditional Types

            ```ts
            type Flatten<T> = T extends Array<infer U> ? U : T;

            type F = Flatten<number[]>; // number
            type G = Flatten<string>; // string
            ```

            These examples illustrate how conditional types can be used to create flexible and dynamic type definitions in TypeScript.
    https://typescriptlang.org/docs/handbook/2/mapped-types.html:
      desc: TypeScript Mapped Types
      tags: [ts]

      notes:
        - md: | #markdown
            ## Mapped Types in TypeScript

            - Mapped types in TypeScript allow you to create new types by transforming existing types.
            - They are defined using the syntax `{ [P in K]: T }`, where `K` is a set of keys and `T` is the type assigned to each key.

            ### Key Concepts:

            1. **Key Remapping**: You can remap keys from an existing type to create a new type with modified keys.
            2. **Modifiers**: Mapped types support modifiers like `?` for optional properties and `readonly` for immutable properties.
            3. **Template Literal Types**: You can use template literal types within mapped types to create dynamic property names.
            4. **Combining with Other Types**: Mapped types can be combined with other type constructs, such as conditional types, to create complex type transformations.

            These features make mapped types a powerful tool for creating flexible and reusable type definitions in TypeScript, enhancing code maintainability and readability.
        - md: | #markdown
            ### Cheatsheet

            - Mapped types build on the syntax for index signatures, which are used to declare the types of properties which have not been declared ahead of time:

              ```ts
              type OnlyBoolsAndHorses = {
                [key: string]: boolean | Horse;
              };

              const conforms: OnlyBoolsAndHorses = {
                del: true,
                rodney: false,
              };
              ```

            - A mapped type is a generic type which uses a union of PropertyKeys (frequently created via a keyof) to iterate through keys to create a type:

              ```ts
              type OptionsFlags<Type> = {
                [Property in keyof Type]: boolean;
              };
              ```

            - In this example, OptionsFlags will take all the properties from the type Type and change their values to be a boolean.

              ```ts
              type Features = {
                darkMode: () => void;
                newUserProfile: () => void;
              };

              type FeatureOptions = OptionsFlags<Features>;

              type FeatureOptions = {
                  darkMode: boolean;
                  newUserProfile: boolean;
              }
              ```
  https://nx.dev/docs/technologies/typescript/guides/switch-to-workspaces-project-references#update-root-typescript-configuration:
    desc: Guide to updating root TypeScript configuration for monorepos using Nx
    tags: [ts]
    notes:
      - md: | #markdown
          ## Updating Root TypeScript Configuration for Monorepos

          - When working with monorepos, it's essential to have a well-structured TypeScript configuration to manage multiple projects effectively.
          - Nx provides tools and guidelines to help you set up and maintain your TypeScript configurations across different projects within a monorepo.

          ### Key Steps:

          1. **Create a Base tsconfig.json**:
            - Start by creating a base `tsconfig.json` file at the root of your monorepo.
            - This file should contain common compiler options that apply to all projects.

          2. **Project-Specific tsconfig Files**:
            - Each project within the monorepo should have its own `tsconfig.json` file that extends the base configuration.
            - This allows for project-specific settings while maintaining consistency.

          3. **Use Project References**:
            - Leverage TypeScript's project references feature to enable faster builds and better type-checking across projects.
            - This involves setting up `references` in each project's `tsconfig.json`.

          4. **Update Paths**:
            - Ensure that the `paths` option in the base `tsconfig.json` is correctly configured to resolve module imports across different projects.

          5. **Automate with Nx**:
            - Utilize Nx's built-in commands and generators to automate the setup and maintenance of TypeScript configurations in your monorepo.

          By following these steps, you can create a robust TypeScript configuration that supports efficient development and collaboration within a monorepo environment.
