    desc: The programming language for all AI developers.
    tags: [mojo, playground, py]
    links:
      - Getting Started: https://docs.modular.com/mojo/manual/get-started
      - Docs: https://docs.modular.com/mojo
    notes:
      - md: | #markdown
          ## Installing the Mojo CLI

          To install the Mojo CLI, run the following command:

          ```sh
          brew install modular/mojo/mojo
          ```

          ## Instaling the mojo package

          To install the Mojo package, run the following command:

          ```sh
          modular mojo install
          ```
      - md: | #markdown
          ## After installing the Mojo CLI, run the following commands:

          Mojo's Python virtual environment created at /Users/rogerioalcantara/.modular/pkg/packages.modular.com_mojo/venv

          If you are using ZSH (default on macOS), run the following commands:

          echo 'export MODULAR_HOME="/Users/rogerioalcantara/.modular"' >> ~/.zshrc
          echo 'export PATH="/Users/rogerioalcantara/.modular/pkg/packages.modular.com_mojo/bin:$PATH"' >> ~/.zshrc
          source ~/.zshrc

          If you are using bash, run the following commands:

          BASHRC=$( [ -f "$HOME/.bash_profile" ] && echo "$HOME/.bash_profile" || echo "$HOME/.bashrc" )
          echo 'export MODULAR_HOME="/Users/rogerioalcantara/.modular"' >> "$BASHRC"
          echo 'export PATH="/Users/rogerioalcantara/.modular/pkg/packages.modular.com_mojo/bin:$PATH"' >> "$BASHRC"
          source "$BASHRC"

          For tool help, enter 'mojo --help'.
          For more docs, see https://docs.modular.com/mojo.
      - md: | #markdown
          # Run code in the REPL

          Then enter 'mojo' to start the Mojo REPL.

          ```sh
          $ mojo
          Welcome to Mojo! 🔥

          Expressions are delimited by a blank line.
          Type `:quit` to exit the REPL and `:mojo help repl` for further assistance.

          1> print("Hello, world!")
          2.
          Hello, world!
          ```
      - md: | #markdown
          # Run a Mojo file

          1. Create a file named hello.mojo (or hello.🔥) and add the following code:

          ```sh
          fn main():
              print("Hello, world!")
          ```

          2. Run it with the mojo command:

          ```sh
          $ mojo hello.mojo
          # => Hello, world!
          ```
