  https://github.com/google/clasp:
    desc: Clasp is the command line tool for Google Apps Script.
    tags: [apps_script]
    links: [https://developers.google.com/apps-script/guides/clasp]
    notes:
      - sh: |
          #!/usr/bin/env bash
          set -euo pipefail

          # ──────────────────────────────────────────────────────────────────────────────
          # Apps Script CHEATSHEET (TypeScript + clasp)
          # Requirements:
          #   - Node 18+ (or 20/22)
          #   - pnpm (or npm/yarn; replace commands accordingly)
          #   - @types/google-apps-script installed locally
          #   - tsconfig.json with outDir="build" and rootDir="src"
          #   - .clasp.json with {"scriptId":"...","rootDir":"build"}
          # Tips:
          #   - Use `clasp login --no-localhost` if running headless/remote/devcontainer
          #   - For pure TS unit tests, avoid GAS globals (e.g., Logger); or mock them
          # ──────────────────────────────────────────────────────────────────────────────

          ## 0) One-time setup (first time only)

          # Install clasp globally
          pnpm add -g @google/clasp

          # Authenticate (opens browser). Use --no-localhost in containers/SSH
          clasp login

          # If you DON'T have a project yet, create one (standalone):
          clasp create --type standalone --title "Google Apps Script Demo"

          # If there is already a project, clone it
          clasp clone '<YOUR_SCRIPT_ID>'

          # Make sure .clasp.json points rootDir to compiled output (build/)
          # cat .clasp.json
          # {
          #   "scriptId": "YOUR_SCRIPT_ID",
          #   "rootDir": "build"
          # }

          # Install dev deps (run inside project folder with package.json)
          pnpm i

          ## 1) Build (TypeScript -> build/)
          tsc

          ## 2) Lint (optional but recommended)
          pnpm eslint . --fix

          ## 2.1) Format (optional but recommended)
          pnpm prettier -w .

          ## 3) Local test (pure TS only)
          # Note: Functions that call GAS services (e.g., Logger, DriveApp) cannot run locally.
          # For pure functions, add a tiny test or script. Example with ts-node/vitest (optional):
          # pnpm vitest run
          # OR quickly run a pure TS file:
          # pnpm dlx ts-node src/some-pure-func.ts
          #
          # For your current sample (uses Logger), skip local run; test via remote run below.

          ## 4) Push compiled code to Apps Script
          clasp push

          ## 5) Test remotely (execute a server function in GAS)
          # Will run on Apps Script backend and print logs to your terminal.
          # Use --nondev to target latest code, not last deployed version.
          clasp run --nondev 'generateAll'

          # View execution logs in browser (helpful for diagnostics):
          clasp logs --watch
          # (Ctrl+C to stop watching)

          ## 6) Pull (if you edited code in the online editor and want it locally)
          clasp pull

          ## 7) Create a version (immutable snapshot - good practice before deploying)
          clasp version "$(date +'%Y.%m.%d-%H%M%S')"

          ## 8) Deploy (e.g., web app or library - first time will create a deployment and return the URL (for web apps))
          clasp deploy -d "prod"

          ## 9) Update loop (daily workflow)
          #  - edit src/*.ts
          #  - build -> push -> run (remote) -> (optional) version -> deploy
          tsc && clasp push && clasp run --nondev 'generateAll'

          # 10) Logout (if needed)
          clasp logout
