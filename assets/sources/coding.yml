cheats:
  # Bun | A fast all-in-one JavaScript runtime
  Open or create a SQLite3 database in Bun:
    desc: Open or create a SQLite3 database in Bun
    tags: [bun, sqlite]
    links: [https://bun.com/docs/runtime/sqlite#database]
    notes:
      - ts: | #typescript
          import { Database } from "bun:sqlite";
          const db = new Database("/path/to/db.sqlite");
  Open SQLite database in-memory in Bun:
    desc: Open SQLite database in-memory in Bun
    tags: [bun, sqlite]
    links: [https://bun.com/docs/runtime/sqlite#database]
    notes:
      - ts: | #typescript
          import { Database } from "bun:sqlite";
          const db = new Database(":memory:");
  Open SQLite database in readonly mode in Bun:
    desc: Open in readonly mode a SQLite database in Bun
    tags: [bun, sqlite]
    links: [https://bun.com/docs/runtime/sqlite#database]
    notes:
      - ts: | #typescript
          import { Database, OpenMode } from "bun:sqlite";
          const db = new Database("mydb.sqlite", { readonly: true });
  Creating SQLite database if it does not exist in Bun:
    desc: Creating SQLite database if it does not exist
    tags: [bun, sqlite]
    links: [https://bun.com/docs/runtime/sqlite#database]
    notes:
      - ts: | #typescript
          import { Database } from "bun:sqlite";
          const db = new Database("mydb.sqlite", { create: true });
  Load SQLite database via ES module import in Bun:
    desc: Use ES module import to load a SQLite database
    tags: [bun, esmodule]
    links: [https://bun.com/docs/runtime/sqlite#database]
    notes:
      - ts: | #typescript
          import db from "./path/to/db.sqlite" with { type: "sqlite" };

          console.log(db.query("select * from users LIMIT 1").get());
  Close a database connection, but allow existing queries to finish in Bun:
    desc: Close a database connection, but allow existing queries to finish, call close()
    tags: [bun, sqlite]
    links: [https://bun.com/docs/runtime/sqlite#database]
    notes:
      - ts: | #typescript
          import { Database } from "bun:sqlite";
          const db = new Database("mydb.sqlite");
          // ... perform database operations ...
          db.close(false);
  Close the database and throw an error if there are pending queries in Bun:
    desc: To close the database and throw an error if there are any pending queries, call .close(true)
    tags: [bun, sqlite]
    links: [https://bun.com/docs/runtime/sqlite#database]
    notes:
      - ts: | #typescript
          import { Database } from "bun:sqlite";
          const db = new Database("mydb.sqlite");
          // ... perform database operations ...
          db.close(true);
    Use `using` to auto-close database connection in bun:
      desc: Use the using statement to ensure that a database connection is closed when the using block is exited in bun
      tags: [bun, sqlite]
      links: [https://bun.com/docs/runtime/sqlite#database]
      notes:
        - ts: | #typescript
            import { Database } from "bun:sqlite";

            {
              using db = new Database("mydb.sqlite");
              using query = db.query("select 'Hello world' as message;");
              console.log(query.get());
            }
            // db is automatically closed here
    Use .get() to run a query and get back the first result as an object in bun:
      desc: Use .get() to run a query and get back the first result as an object in bun
      tags: [bun, sqlite]
      links: [https://bun.com/docs/runtime/sqlite#query]
      notes:
        - ts: | #typescript
            import { Database } from "bun:sqlite";
            const db = new Database("mydb.sqlite");
            const user = db.query("SELECT * FROM users WHERE id = ?", [1]).get();
            console.log(user);
  Use MySQL in Bun:
    desc: Use MySQL in Bun
    tags: [bun, mysql]
    links: [https://bun.com/docs/runtime/mysql]
    notes:
      - ts: | #typescript
          import { createPool } from "bun:mysql";

          const pool = createPool({
            host: "localhost",
            user: "root",
            password: "password",
            database: "testdb",
            connectionLimit: 10,
          });

          const [rows] = await pool.query("SELECT * FROM users WHERE id = ?", [1]);
          console.log(rows);
    Built-in Redis Client in Bun:
      desc: Built-in Redis Client in Bun
      tags: [bun, redis]
      links: [https://bun.com/docs/runtime/redis]
      notes:
        - ts: | #typescript
            import { redis, RedisClient } from "bun";

            // Connects to process.env.REDIS_URL or localhost:6379 if not set.
            await redis.set("foo", "bar");
            const value = await redis.get("foo");
            console.log(value); // "bar"

            console.log(await redis.ttl("foo")); // -1 (no expiration set)
    Redis Pub/Sub messaging is fully supported in Bun:
      desc: Redis Pub/Sub messaging is fully supported in Bun
      tags: [bun, redis]
      links: [https://bun.com/docs/runtime/redis#pubsub]
      notes:
        - ts: | #typescript
            import { RedisClient } from "bun";

            // You can create your own client instead of using `redis`.
            const myRedis = new RedisClient("redis://localhost:6379");

            // Subscribers can't publish, so duplicate the connection.
            const publisher = await myRedis.duplicate();

            await myRedis.subscribe("notifications", (message, channel) => {
              console.log("Received:", message);
            });

            await publisher.publish("notifications", "Hello from Bun!");
