          ## ⚠️ CRITICAL RULES DURING THE ASSESSMENT

          **THE TEXT YOU SHARED IS SERIOUS:**
          - ❌ DO NOT copy or paste content
          - ❌ DO NOT take screenshots or use print screen
          - ❌ DO NOT navigate away from the assessment screen
          - ❌ DO NOT receive external assistance (people or tools)

          **YOUR BROWSER USAGE IS MONITORED:**
          - If you use the print screen functionality, your session will be terminated and you will be blocked.

          ## 💡 INTERVIEWEE INSIGHTS

          Candidates report that the process is very challenging and focuses less on technical skills and more on HOW you answer questions related to the leadership principles.

          An important tip: `"You know much less than you think you know"` - be prepared for questions that dive deep even into concepts you believe you have mastered.

          ## 🎯 BEFORE THE ASSESSMENT

          1. **Today/Tomorrow:** Read and internalize the 16 Leadership Principles
          2. **This Week:** Prepare 2 STAR stories for each principle (32 stories in total)
          3. **Review technical concepts:** Especially basic AWS services (EC2, S3, RDS, Lambda, VPC)
          4. **Practice scenarios:** Think about how you would solve real customer problems

          ## 📊 WHAT HAPPENS NEXT

          - Candidates with a good score advance to a round of interviews and then take an additional technical test specific to the role.
          - With an average score, you will need to go through an additional phone interview with an AWS employee to determine if you should advance.
