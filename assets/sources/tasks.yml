  Evaluate DuckDB to analyze KodexB data:
    desc: Evaluate DuckDB to analyze KodexB data
    tags: [dev, data, analytics]
    priority: high
    status: doing
    notes:
      - md: |
          # Evaluate DuckDB to analyze data

          ## Onde DuckDB faria sentido no kodexb:

          A parte interessante seria se você quiser fazer análise sobre sua própria base de conhecimento. Perguntas do tipo:
            - "quais tags eu mais uso junto?"
            - "quais tópicos eu adicionei mais nos últimos 3 meses?"
            - "existe overlap semântico entre esses dois grupos de snippets?"
            - "quais comandos eu salvei mas nunca revisei?"

          Esse tipo de query analítica onde você varre tudo e agrega é onde DuckDB brilha.

          ## O QUE KODEXB PODERIA TE DIZER SOBRE VOCÊ MESMO?

          ### Higiene da base — "O que está podre?"

          ### 🏷️ Decay
          **Conhecimento velho não revisado**
          - Itens com mais de N meses sem acesso ou atualização.
          - Bookmarks que provavelmente já morreram.
          - Comandos de ferramentas que você não usa mais.
          - **Exemplo de consulta:**
            ```sql
            SELECT * WHERE last_accessed < now() - INTERVAL 180 DAY
            ```

          ### 👻 Orphans
          **Itens sem tag ou mal classificados**
          - Entradas que escaparam da sua taxonomia.
          - Tags únicas que provavelmente deveriam ser merged.
          - Snippets sem exemplo.
          - **Condição:** `tags.count = 0` OR tags raramente co-ocorrem.

          ### 👯 Duplicates
          **Sobreposição semântica**
          - Dois snippets que fazem a mesma coisa com nomes diferentes.
          - Bookmarks duplicados em categorias distintas.
          - É onde DuckDB com full-text brilha.
          - **Condição:** similaridade de título/conteúdo > threshold.

          ## Padrões de aprendizado — "Como você aprende?"

          ### Temporal
          **Picos de atividade por tópico**
          - Quando você entrou em modo intenso de aprendizado de Bun, TypeScript, DocuSign? Correlaciona com o que estava acontecendo no trabalho.
          - **Métrica:** inserts por tag por semana → timeline.

          ### Breadth
          **Profundidade vs. amplitude**
          - Tags com muitos itens = áreas de foco. Tags com poucos itens = exploração superficial. Qual a proporção entre as duas?
          - **Métrica:** tag_count distribution histogram.

          ### Velocity
          **Ritmo de captura**
          - Você captura conhecimento de forma consistente ou em rajadas? Saber isso ajuda a entender seus ciclos de aprendizado.
          - **Métrica:** inserts por dia/semana ao longo do tempo.

          ## Grafo de conhecimento — "O que se conecta?"

          ### Graph
          **Co-ocorrência de tags**
          - Quais tags sempre aparecem juntas? Isso revela clusters de conhecimento não óbvios — ex: "bun + sqlite + drizzle" sempre juntos sugere um domínio consolidado.
          - **Métrica:** tag_pairs ranked by co-occurrence.

          ### Bridge
          **Tags ponte**
          - Tags que conectam clusters diferentes — ex: "typescript" pode ligar "backend" e "cli" e "testing". Esses são seus conhecimentos transversais.
          - **Métrica:** betweenness centrality em grafo de tags.

          ### Gap
          **Gaps óbvios**
          - Clusters vizinhos com pouquíssimas conexões entre si. Pode indicar áreas onde vale aprofundar para conectar o que você já sabe.
          - **Métrica:** clusters isolados no grafo de tags.

          ## Utilidade real — "O que você de fato usa?"

          ### 💡 Usage
          **O que você busca vs. o que você salva**
          - Se você salva muito sobre X mas nunca busca X, talvez você já internalizou — ou nunca precisou de fato. Diferença entre "achei interessante" e "uso no dia a dia".
          - **Métrica:** `search_log vs insert_log por tag`

          ### 💰 ROI
          **Retorno por tipo de item**
          - Bookmarks vs. snippets vs. comandos vs. cheatsheets — qual tipo você acessa mais? Vale a pena continuar salvando todos esses tipos?
          - **Métrica:** `access_count GROUP BY item_type`

          ## Onde DuckDB entra de verdade
          As queries de co-ocorrência de tags e grafo de conhecimento são exatamente o tipo de coisa que SQLite sofre e DuckDB resolve com elegância — você faz self-joins em tabelas grandes, calcula distribuições, agrega por janelas temporais. Tudo isso lendo o SQLite diretamente, sem migrar nada. O resto (higiene, usage) SQLite resolve bem.

          ## Priorização para uma v1 de analytics
          O que priorizaria para uma v1 de analytics: **decay (itens velhos)** + **co-ocorrência de tags**. São as duas queries com maior utilidade prática e menor complexidade de implementação. E revelam coisas sobre a base que você não consegue ver olhando item por item.
