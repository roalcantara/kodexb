  https://serverless.com:
    desc: The Serverless Framework is an open-source platform for building serverless applications.
    tags: [devop, iac]
    notes:
      - md: |
          ### Serverless Framework Overview

          - The Serverless Framework is an IaC tool that simplifies deploying serverless applications to AWS Lambda (and other cloud providers).
          - It uses YAML configuration to define functions, events, and infrastructure, abstracting away CloudFormation complexity.
          - While powerful for rapid prototyping, it becomes challenging at scale with multiple services and complex dependency management

          #### The Plugins

          ##### serverless-latest-layer-version
          - Automatically references the latest version of Lambda Layers without hardcoding version numbers.
          - Useful when you have shared code/dependencies packaged as layers across multiple functions.
          - **Best practice:**
            - Use this when layers get frequently updated
            - Consider versioning strategy to avoid unexpected breaking changes.

          ##### serverless-middleware
          - Enables middleware patterns (like Express.js) for Lambda handlers, allowing you to compose cross-cutting concerns (auth, logging, validation) before reaching your business logic.
          - **Best practice:**
            - Great for DRY principles
            - Adds abstraction layers
            - Use judiciously to maintain handler clarity.

          ##### serverless-offline
          - Local emulation of Lambda and API Gateway for development without AWS calls.
          - Essential for rapid iteration and CI/CD pipelines.
          - **Best practice:**
            - Keep your offline config in sync with actual AWS setup
            - Differences between local and deployed behavior are a common pain point.

          ##### serverless-plugin-lambda-insights
          - Integrates CloudWatch Lambda Insights for detailed function monitoring (duration, memory, throttles, errors).
          - **Best practice:**
            - Enable in all environments
            - The overhead is minimal and visibility is worth it.

          ##### serverless-plugin-warmup
          - Periodically invokes Lambda functions to prevent cold starts, critical for latency-sensitive workloads.
          - **Best practice:**
            - Use sparingly
            - Unnecessary warmup increases costs
            - Only for functions with real cold-start problems.

          ##### serverless-webpack
          - Bundles Lambda functions using Webpack for optimized package sizes and tree-shaking.
          - **Best practice:**
            - Essential for TypeScript projects and large dependency trees
            - Adds build complexity
            - Consider what you're actually optimizing for.

