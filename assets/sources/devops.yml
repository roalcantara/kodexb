  Top Most-Used Deployment Strategies:
    desc: Rolling x Big Bang x Feature x Blue-Green x Canary
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: |
          | **Strategy**              | **Key Characteristics**                         | **Focus**                                             |
          | ------------------------- | ----------------------------------------------- | ----------------------------------------------------- |
          | **Rolling**               | Minimizes downtime, gradual rollout             | Stability and minimal user impact                     |
          | **Big Bang**              | Immediate switch, higher risk                   | Less complex or small-scale applications              |
          | **Feature Toggles/Flags** | Dynamic feature management, flexible deployment | Flexibility in feature release and rollback           |
          | **Blue-Green**            | Zero downtime, high resource requirement        | High availability and immediate rollback              |
          | **Canary**                | User feedback-oriented, phased release          | Testing in real-world conditions and gradual exposure |
      - mermaid: |
          graph TD
            A[Application Type] -->|Critical with High Availability| B[Blue-Green]
            A -->|Large Scale with Direct User Feedback| C[Canary]
            A -->|Ongoing Development, Continuous Delivery| D[Feature Toggles/Flags]
            A -->|Smaller or Less Critical Updates| E[Big Bang]
            A -->|Critical Applications, Minimized Downtime| F[Rolling]
