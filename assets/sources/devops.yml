  Rolling Deployment:
    desc: Gradual rollout to minimize downtime and risk
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: |
          # Rolling Deployment

          > Focuses on stability and minimal user impact

          This strategy updates one server at a time instead of all at once
          - Minimizes downtime
          - Gradual exposure of new version to users
          - If issues arise, only a portion of users are affected

          ## Advantages
          - Reduces risk of widespread failure
          - Easier to rollback if problems occur
          - Less impact on user experience

          ## Challenges
          - Longer overall deployment time
          - Temporary inconsistency between servers

          ## Usage
          - **Ideal for critical applications where reliability is a priority**
          - When downtime needs to be minimized
          - For large-scale applications with many users
  Big Bang Deployment:
    desc: All-at-once approach for immediate switch over
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: |
          # Big Bang Deployment

          > Suited for less complex or small-scale applications

          Complete and simultaneous update of all servers and components
          - Immediate switch to the new version
          - Synchronous update across all systems

          ## Advantages
          - Immediate results
          - Quick implementation

          ## Challenges
          - High risk of failure
          - Difficult to rollback
          - Potential significant downtime

          ## Usage
          - **When updates are small or non-critical**
          - When a system can afford downtime
          - For smaller or less complex applications
  Feature Toggles/Flags:
    desc: Enabling/disabling features dynamically at runtime
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: |
          # Feature Toggles/Flags

          > Flexibility in feature release and rollback

          Allows features to be turned on/off without deploying new code
          - Flexibility in releasing features
          - Facilitates A/B testing and canary releases

          ## Advantages
          - Allows for incremental development
          - Reduces need for multiple deployments
          - Helps in managing feature rollouts and rollbacks

          ## Challenges
          - Potential technical debt
          - Complexity in managing toggles

          ## Usage
          - **For large applications with ongoing development**
          - When continuous delivery is in place
          - For testing features with specific user segments
  Blue/Green (or Red/black) Deployment:
    desc: Reduces downtime and risk by running two identical environments
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: |
          # Blue/Green (or Red/black) Deployment

          > High availability and immediate rollback

          Switch between active (Blue) and idle (Green) environments
          - Zero downtime deployments
          - Immediate rollback capability
          - Only one is active at any given moment
          - Router or load balancer aids in traffic control

          ## Advantages
          - High availability during deployments
          - Instantaneous switch over and rollback

          ## Challenges
          - Complexity in synchronization and data migration
          - Resource intensive (requires double the environment)

          ## Usage
          - **For applications where downtime is unacceptable**
          - In environments with critical 24/7 operations
          - When testing in near-production conditions is needed
  Canary Deployment:
    desc: Gradual release to a subset of users
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: |
          # Canary Deployment

          > Spotting possible issues before they affect all consumers

          Starts with a small group of users, increases gradually
          - Minimizes impact of bugs
          - Allows for user feedback
          - One of the main enablers of **Continuous Deployments**

          ## Advantages
          - Feedback-oriented approach
          - Risk mitigation by affecting a small user base initially

          ## Challenges
          - Complexity in traffic routing
          - Longer time to full deployment

          ## Usage
          - **For user-centric applications with direct user feedback**
          - When new features need to be tested in the real world
          - In large-scale systems with diverse user groups
  DevSecOps checklist:
    desc: Checklist for DevSecOps
    tags: [pattern, deployment]
    links: [https://gitguardian.com/glossary/devsecops-checklist]
    notes:
      - md: |
          ### DevSecOps checklist

          **Know Your Dependencies**:
            - Map all software components and their security risks

          **Automate Security Testing**:
            - Integrate SAST, DAST, and secrets detection into CI/CD pipelines

          **Shift left**: _(Test Early, Test Often)_
            - Scan for vulnerabilities before code commits

          **Maintain Compliance**:
            - Continuously track and document security threats

          **Secure Cloud-Native Apps**:
            - Use CI/CD platforms that meet security standards

          **Manage Secrets Properly**:
            - Implement dedicated tools and training for credential security

          **Make Security Everyone's Job**:
            - Train developers and embed security specialists in teams
  Using BAUS to replace apt, flatpak, snap:
    desc: Using BAUS (Unified Linux Package Manager) to replace apt, flatpak, snap
    tags: [devop]
    links:
      - https://github.com/vinifmor/bauh
      - https://blog.crafteo.io/2025/01/10/flox-novops-development-packages-secrets-and-multi-environment-management-all-in-one
      - https://youtu.be/-BsNc4oe3O0
    notes:
      - md: |
          ### TL;DR: BAUH - Unified Linux Package Manager

          > WHAT IS BAUH?
          > Bauh is a graphical (and CLI) interface for managing Linux applications across
          > multiple package formats. It unifies APT (Debian), Flatpak, Snap, AppImage,
          > AUR, and Web applications under a single interface.

          #### PURPOSE:
          - Stop juggling multiple package managers (apt, flatpak, snap, etc).
          - Install, update, remove, and manage all your packages from one place.

          #### PRIMARY USERS:
          - Linux system administrators managing mixed package sources
          - Power users who need both native and containerized applications
          - DevOps engineers automating system setup scripts
          - Desktop users wanting a unified software center

          #### SUPPORTED PACKAGE FORMATS:
          - APT (Debian/Ubuntu repositories)
          - Flatpak (containerized applications)
          - Snap (containerized applications)
          - AppImage (portable executables)
          - AUR (Arch Linux User Repository - if on Arch)
          - Web applications (Electron-based, installable as apps)

          #### MAIN FEATURES

          1. UNIFIED INTERFACE
          - One command to search, install, upgrade, remove packages from any source
          - No need to remember apt install vs snap install vs flatpak install

          2. PACKAGE PRIORITY MANAGEMENT
          - Choose which package source to prioritize (e.g., prefer native APT over Snap)
          - Automatically resolves package conflicts and dependencies

          3. TRAY MODE & NOTIFICATIONS
          - Runs in system tray, notifies you of available updates
          - Can auto-update packages on schedule

          4. SYSTEM BACKUP INTEGRATION
          - Integrates with Timeshift for safe snapshots before major changes
          - Rollback capability if something breaks

          5. CUSTOM THEMES & CONFIGURATION
          - Customizable UI appearance via ~/.config/bauh/config.json
          - Per-package-type configuration files

          6. CLI MODE (bauh-cli)
          - Command-line interface for scripting and automation
          - Perfect for install scripts and CI/CD pipelines

          #### MIGRATION FROM INDIVIDUAL PACKAGE MANAGERS

          1. **OLD APPROACH - Multiple commands:**
          - `sudo apt install vim``
          - `flatpak install flatseal``
          - `snap install telegram``

          2. **NEW APPROACH - Single tool:**
          - `bauh-cli install vim`              _(APT automatically)_
          - `bauh-cli install flatseal`         _(Flatpak automatically)_
          - `bauh-cli install telegram`         _(Snap automatically)_

          3. **Or all at once:**
          - `bauh-cli install vim flatseal telegram`

          #### MAIN USES IN PRACTICE

          1. INSTALL SCRIPTS / AUTOMATION
          - Use `bauh-cli` in your setup scripts instead of multiple package managers
          - Single point of error handling and logging

          2. DESKTOP ENVIRONMENT SETUP
          - Install mix of native and containerized apps in one go
          - Example: native code editor + `snap` messaging app + `flatpak` video player

          3. DEPENDENCY MANAGEMENT
          - Specify dependencies without worrying about which package manager provides them
          - **Bauh** finds the best source automatically

          4. SYSTEM MAINTENANCE
          - Single command to check for all updates across all package types
          - Batch update everything at once

          5. PACKAGE CLEANUP
          - Remove unused dependencies across all package managers
          - Clean caches from APT, Flatpak, and Snap simultaneously
          - No need to remember `apt install` vs `snap install` vs `flatpak install`

          #### CLI VS GUI MODE

          1. **GUI MODE:** `bauh`
            - Interactive graphical interface
            - Best for users browsing/exploring packages
            - Better for discovering new applications
            - Good for one-off installs

          2. **CLI MODE:** `bauh-cli`
            - Headless, scriptable
            - Perfect for automation and install scripts
            - Better for CI/CD pipelines
            - Can be piped to other commands
            - Non-interactive (good for cron jobs)

          3. **TRAY MODE:** `bauh-tray`
            - Runs in system tray
            - Monitors for updates
            - Sends desktop notifications
            - Useful for background monitoring

          #### TROUBLESHOOTING

          1. **ISSUE:** "Command not found: bauh-cli"
            - **SOLUTION:** Ensure **Bauh** is installed and in `PATH`
            - `which bauh-cli`
            - `export PATH="$PATH:~/.local/bin"`  _(add if needed)_

          2. **ISSUE:** Permission denied errors
            - **SOLUTION:** Some operations need sudo
            - `sudo bauh-cli update-db`
            - `sudo bauh-cli upgrade --all`

          3. **ISSUE:** Dependency conflicts between package managers
            - **SOLUTION:** Check `~/.config/bauh/config.json` provider_order
            - Adjust priority to prefer one source over another

          4. **ISSUE:** Package not found
            - **SOLUTION:** Make sure all package sources are enabled
            - `nano ~/.config/bauh/config.json`
            - Set `enable_apt`, `enable_flatpak`, `enable_snap` to true

          5. **ISSUE:** Updates not detected
            - **SOLUTION:** Manually update package databases
            - `bauh-cli update-db`

          6. **ISSUE:** Verbose output for debugging
            - **SOLUTION:** Check logs at `~/.cache/bauh/` or `/tmp/bauh/logs`
      - sh: |
          #!/bin/bash

          ################################################################################
          ## QUICKSTART - INSTALLATION
          ################################################################################

          # Option 1: Install via AppImage (universal, no dependencies)
          mkdir -p ~/bin
          cd ~/bin
          wget https://github.com/vinifmor/bauh/releases/download/latest/bauh-x86_64.AppImage
          chmod +x bauh-x86_64.AppImage
          ./bauh-x86_64.AppImage

          # Option 2: Install via APT (if available in your distro repos)
          sudo apt install bauh

          # Option 3: Install via AUR (Arch Linux)
          yay -S bauh
          # or
          paru -S bauh

          # Option 4: Install via Python pip
          pip install bauh
          # or with uv
          uv pip install bauh

          # Option 5: Install via Flox (if using Flox)
          flox install bauh

          # Verify installation
          bauh --version
          bauh-cli --version
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          ## 1. LIST ALL AVAILABLE UPDATES ACROSS ALL SOURCES
          # Output shows updates from APT, Flatpak, Snap, etc. all in one list
          bauh-cli updates

          ## 2. SEARCH FOR A PACKAGE (returns all available sources)
          # Returns: Firefox from APT, Snap, Flatpak (multiple options)
          bauh-cli search firefox
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          ## 3. INSTALL PACKAGE (bauh decides best source or you can specify)

          # Simple install (bauh picks the best provider)
          bauh-cli install vlc

          # Install from specific source
          bauh-cli install --from flatpak vlc
          bauh-cli install --from snap telegram
          bauh-cli install --from apt vim

          # Install multiple packages at once
          bauh-cli install firefox thunderbird vlc
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          ## 4. INSTALL WITH PACKAGE MANAGER PREFERENCE
          # Configure in `~/.config/bauh/config.json` which sources to prioritize
          # Example: prefer native APT over Snap
          - `cat ~/.config/bauh/config.json | grep -A5 "provider_order"`
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          ## 5. UPDATE/UPGRADE PACKAGES

          # Update specific package
          bauh-cli upgrade vlc

          # Update all packages from all sources
          bauh-cli upgrade --all

          # Update only from specific source
          bauh-cli upgrade --from flatpak --all
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          # 6. REMOVE/UNINSTALL PACKAGE
          bauh-cli remove vlc

          # Remove with confirmation
          bauh-cli remove --confirm vlc
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          # 7. SHOW PACKAGE INFORMATION
          # Shows: version, source (APT/Snap/Flatpak), size, description, etc.
          bauh-cli show firefox
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          # 8. LIST ALL INSTALLED PACKAGES
          # List all installed across all sources
          bauh-cli list

          # Filter by source
          bauh-cli list --from flatpak
          bauh-cli list --from snap
          bauh-cli list --from apt
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          # 9. CLEAN UP & MAINTENANCE

          # Clean caches from all sources
          bauh-cli clean

          # Remove unused dependencies (APT)
          bauh-cli autoremove
      - sh: |
          #!/bin/bash
          ## COMMON WORKFLOWS - USING BAUH-CLI FOR SCRIPTS

          # 10. CONFIGURE PACKAGE SOURCES
          # Edit configuration file
          - `nano ~/.config/bauh/config.json`

          # KEY SETTINGS:
          # - "check_interval": how often to check for updates
          # - "suggest_uninstall_updates": prompt to remove old versions
          # - "enable_aur": enable/disable AUR support (Arch only)
          # - "enable_appimage": enable/disable AppImage support
          # - "check_for_bauh_updates": check if bauh itself has updates
      - jsonc: |
          // ~/.config/bauh/config.json
          {
            "check_interval": 3600,
            "suggest_uninstall_updates": true,
            "enable_aur": false,
            "enable_appimage": true,
            "enable_flatpak": true,
            "enable_snap": true,
            "enable_apt": true,
            "provider_order": [
              "apt",
              "flatpak",
              "snap",
              "appimage"
            ],
            "install_dir": "/opt",
            "logs_dir": "/tmp/bauh/logs"
          }
      - sh: |
          #!/bin/bash
          set -e

          ################################################################################
          ## SAMPLE INSTALL SCRIPT USING BAUH
          ################################################################################

          echo "=== System Setup with Bauh ==="

          # Step 1: Bootstrap - install bauh first (native method)
          if ! command -v bauh-cli &> /dev/null; then
              echo "Installing bauh bootstrap..."
              DEBIAN_FRONTEND=noninteractive sudo apt update
              DEBIAN_FRONTEND=noninteractive sudo apt install -y bauh
              # or: wget AppImage and run
          fi

          # Step 2: Update package databases
          echo "Updating package sources..."
          bauh-cli update-db

          # Step 3: Install development tools (from APT)
          echo "Installing development packages..."
          bauh-cli install --from apt \
              build-essential \
              git \
              curl \
              wget \
              python3 \
              python3-pip

          # Step 4: Install containerized applications (prefer Flatpak)
          echo "Installing containerized applications..."
          bauh-cli install --from flatpak \
              org.gnome.gedit \
              org.gnome.Files

          # Step 5: Install communication apps (prefer Snap for these)
          echo "Installing communication tools..."
          bauh-cli install --from snap \
              telegram-desktop \
              slack

          # Step 6: Install everything else (let bauh choose best source)
          echo "Installing remaining packages..."
          bauh-cli install \
              vlc \
              firefox

          # Step 7: Update everything
          echo "Updating all packages..."
          bauh-cli upgrade --all

          # Step 8: Cleanup
          echo "Cleaning up..."
          bauh-cli clean

          echo "=== Setup Complete ==="
      - jsonc: |
          // SAMPLE CONFIGURATION - ~/.config/bauh/config.json
          {
            "check_interval": 3600,                    # Check for updates every hour
            "check_for_bauh_updates": true,            # Notify when bauh updates available
            "enable_aur": false,                       # Disable AUR (if not on Arch)
            "enable_appimage": true,                   # Enable AppImage support
            "enable_flatpak": true,                    # Enable Flatpak support
            "enable_snap": true,                       # Enable Snap support
            "enable_apt": true,                        # Enable APT support
            "provider_order": [                        # Package source priority
              "apt",
              "flatpak",
              "snap",
              "appimage"
            ],
            "install_dir": "/opt",                     # Where to install AppImages
            "suggest_uninstall_updates": true,         # Remove old versions after update
            "logs_dir": "/tmp/bauh/logs"               # Where to store logs
          }

          // PER-SOURCE CONFIG FILES:
          // ~/.config/bauh/apt.yml
          // ~/.config/bauh/flatpak.yml
          // ~/.config/bauh/snap.yml
      - sh: |
          #!/bin/bash

          ################################################################################
          ## PACKAGE PRIORITY / SOURCE PREFERENCE
          ################################################################################

          # BEST PRACTICE: Define which package source to use for specific packages

          # Example: Some packages work better as Flatpak (sandboxed):
          # - Firefox
          # - VLC
          # - Blender

          # Example: Some packages better as native APT (better integration):
          # - Build tools (gcc, make, cmake)
          # - System utilities (curl, wget, git)
          # - Development libraries

          # Example: Snap is useful for:
          # - Proprietary software (Slack, Telegram)
          # - Software with frequent updates
          # - Isolated applications

          # Configure this in ~/.config/bauh/config.json under "provider_order"
      - sh: |
          #!/bin/bash

          ################################################################################
          ## QUICK REFERENCE - COMMON COMMANDS
          ################################################################################

          # SEARCH & INFO
          bauh-cli search <package>              # Search for package
          bauh-cli show <package>                # Show package info

          # INSTALL
          bauh-cli install <package>             # Install with auto-detection
          bauh-cli install --from <source> pkg   # Install from specific source

          # UPDATE
          bauh-cli upgrade <package>             # Upgrade single package
          bauh-cli upgrade --all                 # Upgrade everything
          bauh-cli updates                       # List available updates

          # REMOVE
          bauh-cli remove <package>              # Uninstall package
          bauh-cli autoremove                    # Remove unused dependencies

          # LIST
          bauh-cli list                          # List all installed packages
          bauh-cli list --from <source>          # List from specific source

          # MAINTENANCE
          bauh-cli update-db                     # Update package databases
          bauh-cli clean                         # Clean all caches
          bauh-cli clean --from <source>         # Clean specific source cache
      - sh: |
          #!/bin/bash

          ################################################################################
          ## REAL-WORLD EXAMPLE: DESKTOP DEVELOPER SETUP
          ## Install a complete dev environment using bauh
          ################################################################################

          # Native development tools (APT)
          bauh-cli install --from apt \
              git \
              python3 \
              python3-pip \
              nodejs \
              npm \
              docker.io \
              build-essential

          # Code editors & IDEs (Flatpak for sandboxing)
          bauh-cli install --from flatpak \
              com.visualstudio.code \
              io.github.bragefuglseth.Frogmouth

          # Communication (Snap for frequent updates)
          bauh-cli install --from snap \
              slack \
              discord

          # Multimedia tools (best source varies)
          bauh-cli install \
              vlc \
              audacity \
              blender

          # Update everything
          bauh-cli upgrade --all

          # Cleanup
          bauh-cli clean

          echo "Developer environment ready!"
  CI/CD on GitHub Actions:
    desc: CI/CD on GitHub Actions
    tags: [devop, github, actions]
    links: [https://docs.github.com/en/actions]
    notes:
      - md: | #markdown
          # CI/CD on GitHub Actions

          A basic CI/CD Pipeline can be done on GitHub Actions with a few steps:

          1. REVIREW: 
            - When a non-draft pull request is opened, created, or updated, the review workflow will run
            - It will lint, test, and send a preview version to DockerHub
          2. RELEASE: 
            - When a the branch main is updated, the release workflow will run
            - It will create a release and publish the code to DockerHub
          3. PUBLISH: 
            - When a new release is created, the publish workflow will run
            - It will build and upload self-contained binaries (`linux-x64`, `linux-arm64`, `darwin-arm64`) to the GitHub Release,
            - Then it will generate and upload checksums with install notes, 
            - Then it will publish a multi-arch Docker image to DockerHub with versioned tags
            - Then it will update the production environment URL
            - Finallt, it will set the GitHub Release to public
      - md: | #markdown
          # Best practices for publishing immutable releases

          We recommend you use the following workflow for publishing an immutable release.

          1. Create the release as a draft.
          2. Attach all associated assets to the draft release.
          3. Publish the draft release.
          This ensures that all assets are in place before the release becomes immutable, preventing the need to work around immutability restrictions.
  Provenance, Attestations, and SLSA:
    desc: Provenance attestation is a tamper-proof receipt, signed by GitHub's infrastructure, proving that a specific binary was built from a specific commit by a specific workflow — and anyone can verify it independently.
    tags: [devop, github, actions]
    links: [https://docs.github.com/en/actions/security-for-github-actions/security-provenance-for-your-workflows]
    notes:
      - md: | #markdown
          # Provenance, Attestations, and SLSA

          ## The core problem it solves

          - When you download a binary from the internet, how do you know it actually came from the source code you can read on GitHub?
          - How do you know it wasn't tampered with between the build and the download?
          - This is called the supply chain problem — the chain between "source code" and "artifact you run" can be compromised at any step.

          ## The three concepts
            
          ### Provenance
          - is simply a record of where something came from and how it was built. 
          - Like a certificate of origin on a product. 
          - For a GitHub Actions build it answers: which repo, which commit, which workflow, which runner, at what time produced this artifact.

          ### Attestation
          - is a signed statement asserting that provenance is true. 
          - The signature proves the statement was made by a specific identity (in this case, GitHub's own OIDC identity for the Actions runner) and hasn't been tampered with since. 
          - Without the signature it's just a text file anyone could fake.

          ### SLSA
          - (Supply-chain Levels for Software Artifacts, pronounced "salsa") is a security framework that defines levels of trustworthiness for how software is built. 
          - Provenance attestations are what gets you to SLSA Level 2 and above.

          ## HOW IT WORKS

          1. Collects metadata about the build — repo, commit SHA, workflow file, runner environment, timestamp
          2. Signs that metadata using the runner's OIDC token, which is a short-lived cryptographic identity GitHub issues specifically for that job
          3. Publishes the signed attestation to GitHub's Sigstore transparency log — a public, append-only, tamper-evident ledger

          The result is a publicly verifiable record that says: 

          > "This specific binary was produced by this specific workflow at this specific commit, and GitHub's infrastructure signed this statement."

          And anyone can then verify it:

          ```sh #shell
          gh attestation verify dist/kb --repo roalcantara/kb
          ```

          ## WHY USE IT?

          ### For users

          — Can cryptographically verify that the binary they downloaded matches what was built from the public source code.
          - No blind trust required.

          ### For you

          — It proves you didn't build it on your laptop and sneak something in.
          - The build happened in a controlled, auditable environment.

          ### For compliance

          — Some organisations (government, finance, healthcare) are starting to require SLSA provenance for any software they run.
          - Having it now future-proofs your project.

          ### For the ecosystem

          — Raises the bar for everyone.
          - Supply chain attacks (like the famous XZ Utils attack in 2024) become much harder to pull off undetected when provenance is the norm.

          ## WHEN TO AVOID IT OR SKIP IT

          ### Private repos where the transparency log is a concern

          — attestations are published to a public ledger.
          - This means the fact that your repo produced a build at a given commit becomes public record, even if the repo itself is private. Usually not a problem for open source, but worth knowing.

          ### Very simple personal projects

          — for a tool only you use, the overhead isn't worth much.
          - But for something you distribute to others (like kb if it grows), it starts to matter.

          ### When you don't control the artifact

          — if you're just re-packaging someone else's binary, attesting it is misleading because the provenance stops at your repackaging step, not at the original source.

          ## HOW IT RELATES TO SBOM: TRUE AND PROVENANCE: FALSE IN DOCKERFILES?

          - You already have `sbom: true` in your Docker build steps
             — that generates a Software Bill of Materials, which is a manifest of every package and dependency inside the image. 
             - It's related but different: SBOM tells you what's in the artifact, provenance tells you how it was built.
          - The `provenance: false` flag in Dockerfiles is the Docker-specific provenance flag (OCI image provenance), which you may have disabled because it was causing issues with some registries. 
            - That's separate from `actions/attest-build-provenance`, which works at the GitHub level rather than the Docker level.

