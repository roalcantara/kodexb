  test/unit:
    desc: The test/unit framework in Ruby is a standard library for writing and executing unit tests
    tags: [rb]
    notes:
      - md: | #markdown
          > It provides a way to define test cases and various assertions to check for expected outcomes

          ## Basic Test Case

          ```ruby
          require 'test/unit'

          class MyTest < Test::Unit::TestCase
            def test_addition
              result = 2 + 2
              assert_equal(4, result)
            end
          end
          ```

          ## Testing for Exceptions:

          ```ruby
          class ExceptionTest < Test::Unit::TestCase
            def test_exception
              assert_raise(RuntimeError) do
                raise 'Error'
              end
            end
          end
          ```

          ## Common Assertion Methods

          ```ruby
          assert(test, [msg]):
          # Ensures the test is true. msg is the message to display if the assertion fails.

          assert_equal(expected, actual, [msg]):
          # Asserts that expected and actual are equal.

          assert_not_equal(expected, actual, [msg]):
          # Asserts that expected and actual are not equal.

          assert_same(expected, actual, [msg]):
          # Asserts that expected and actual are the same object.

          assert_not_same(expected, actual, [msg]):
          # Asserts that expected and actual are not the same object.

          assert_nil(obj, [msg]):
          # Asserts that obj is nil.

          assert_not_nil(obj, [msg]):
          # Asserts that obj is not nil.

          assert_raise(exception1, exception2, ...) { block }:
          # Asserts that the given block raises one of the specified exceptions.

          assert_nothing_raised(exception1, exception2, ...) { block }:
          # Asserts that the given block does not raise any of the specified exceptions.

          assert_respond_to(obj, method, [msg]):
          # Asserts that obj responds to method.
          ```
  str.chars.sort.join:
    desc: Sort a string alphabetically
    tags: [rb]
    notes:
      md: | #markdown
        ## Sort a string alphabetically

        ```ruby
        str = "hello"
        sorted = str.chars.sort.join

        p sorted # "ehllo"
        ```

        ## Sorting Case-Insensitive

        ```ruby
        str = "HELLO"
        sorted = str.chars.sort_by(&:downcase).join

        p sorted # "ehllo"
        ```
  Set.new:
    desc: A collection of unordered values with no duplicates
    tags: [rb]
    notes:
      md: | #markdown
        > A collection of unordered values with no duplicates.
        > It's part of the standard library, so you need to require 'set' before using it.

        ## Creating a New Set

        Create a new set with an array of elements. The set will automatically remove duplicate elements.

        ```ruby
        require 'set'

        my_set = Set.new([1, 2, 2, 3, 4])
        puts my_set.inspect  # Output: #<Set: {1, 2, 3, 4}>
        ```

        ## Adding and Removing Elements

        Add elements to a set using the add or << method

        ```ruby
        require 'set'

        my_set = Set.new
        my_set.add("apple")
        my_set << "banana"
        my_set << "apple"  # Duplicate, won't be added

        puts my_set.inspect  # Output: #<Set: {"apple", "banana"}>
        ```

        ## Checking for an Element

        Use the include? method to check if an element is present in the set

        ```ruby
        require 'set'

        my_set = Set.new([1, 2, 3, 4])
        puts my_set.include?(3)  # Output: true
        puts my_set.include?(5)  # Output: false
        ```

        ## Advanced Features of Set

        ### 1. Set Union, Intersection, and Difference

        Sets support union `|`, intersection `&`, and difference `-` operations.

        ```ruby
        require 'set'

        set1 = Set.new([1, 2, 3])
        set2 = Set.new([3, 4, 5])

        union = set1 | set2
        intersection = set1 & set2
        difference = set1 - set2

        puts union.inspect         # Output: #<Set: {1, 2, 3, 4, 5}>
        puts intersection.inspect  # Output: #<Set: {3}>
        puts difference.inspect    # Output: #<Set: {1, 2}>
        ````

        ### 2. Subset and Superset Checking

        Check if a set is a subset or superset of another set

        ```ruby
        require 'set'

        set1 = Set.new([1, 2])
        set2 = Set.new([1, 2, 3, 4])

        puts set1.subset?(set2)    # Output: true
        puts set2.superset?(set1)  # Output: true
        ```

        ### 3. Set Equality

        Check if two sets are equal

        ```ruby
        require 'set'

        set1 = Set.new([1, 2, 3])
        set2 = Set.new([3, 2, 1])

        puts set1 == set2  # Output: true
        ```

        ### 4. Set Iteration

        Iterate over the elements of a set

        ```ruby
        require 'set'

        my_set = Set.new([1, 2, 3])

        my_set.each do |element|
          puts element
        end
        ```

        ### 5. Set Conversion

        Convert a set to an array or vice versa

        ```ruby
        require 'set'

        my_set = Set.new([1, 2, 3])

        array = my_set.to_a
        set = array.to_set
        ```
  Installing Ruby On Rails on Apple Silicon:
    desc: Install Ruby On Rails on macOS 14 Sonoma (Apple Silicon, M1, M2)
    tags: [rb]
    links: [https://gorails.com/setup/macos/14-sonoma]
    notes:
      - md: |
          ## Install Ruby On Rails on macOS 14 Sonoma (Apple Silicon, M1, M2)

          ### 1. Install Homebrew
          ```bash
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          ```

          ### 2. Install Ruby
          ```bash
          brew install rbenv
          rbenv init
          echo 'eval "$(rbenv init -)"' >> ~/.zshrc
          source ~/.zshrc
          rbenv install 3.1.0
          rbenv global 3.1.0
          ```

          ### 3. Install Rails
          ```bash
          gem install rails
          ```

          ### 4. Verify Installation
          ```bash
          ruby -v
          rails -v
          ```

          ### 5. Create a new Rails app
          ```bash
          rails new myapp
          cd myapp
          rails server
          ```

          ### 6. Open your browser and visit `http://localhost:3000` to see your new Rails app.

          ### 7. You're all set! 🎉

          ### 8. If you face any issues, please refer to the official [Ruby on Rails installation guide](https://guides.rubyonrails.org/getting_started.html).

          ### 9. If you're using zsh, you might need to add the following to your `~/.zshrc` file:
          ```bash
          export PATH="$HOME/.rbenv/bin:$PATH"
          eval "$(rbenv init - zsh)"
          ```

          ### 10. Restart your terminal and you're good to go!

          ### 11. If you're using bash, you might need to add the following to your `~/.bash_profile` file:
          ```bash
          export PATH="$HOME/.rbenv/bin:$PATH"
          eval "$(rbenv init -)"
          ```

          ### 12. Restart your terminal and you're good to go!

          ### 13. That's it! You've successfully installed Ruby on Rails on macOS 14 Sonoma (Apple Silicon, M1, M2).

          ### 14. Enjoy coding! 🚀
