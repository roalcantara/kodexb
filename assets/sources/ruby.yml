  Ruby Classes | Overview:
    desc: Ruby classes are the blueprints. In creating a custom class, you are creating a new data type
    tags: [rb]
    links:
      - Learn Ruby in Y Minutes: https://learnxinyminutes.com/docs/ruby
      - The Pragmatic Programmer's Guide: https://ruby-doc.com/docs/ProgrammingRuby/html/classes.html
      - Ruby Classes, Objects & Methods: https://medium.com/codex/ruby-classes-objects-methods-4568b9f443d7
    notes:
      - ruby: |
          class Human

            # Class variable are shared by all class' instances
            @@species = 'H. sapiens'

            # Ctor
            def initialize(name, age = 0)
              # Assigns instance variable
              @name = name
              @age = age
            end

            # Basic setter method
            def name=(name)
              @name = name
            end

            # Basic getter method
            def name
              @name
            end

            # Which can be encapsulated as follows
            attr_accessor :name

            # Getter/setter as well
            attr_reader :name
            attr_writer :name

            # Class methods cannot be called by instances
            def self.say(msg)
              puts msg
            end

            def species
              @@species
            end
          end

          # Instantiating of a class
          jim = Human.new('Jim Halpert')
          dwight = Human.new('Dwight K. Schrute')

          # Calling object's methods
          jim.species #=> "H. sapiens"
          jim.name #=> "Jim Halpert"
          jim.name = "Jim Halpert II" #=> "Jim Halpert II"
          jim.name #=> "Jim Halpert II"
          dwight.species #=> "H. sapiens"
          dwight.name #=> "Dwight K. Schrute"

          # Calling class's methods
          Human.say('Hi') #=> "Hi"
      - ruby: |
          class Book
            attr_accessor :title, :author, :description, :rating

            #define change_author method to accept arguments:
            def change_author(obj, new_author)
              obj.author = new_author
            end
          end

          #create new Book object and assign to first_book variable:
          first_book = Book.new()
          first_book.title = "Really Great Book"
          first_book.author = "Denali Balser"
          first_book.description "best book ever"
          first_book.rating = 100

          #call change_author method on first_book object with obj and new_author arguments:
          first_book.change_author(first_book, "J. R. R. Tolkien")

          #display the author of first_book object in console:
          puts first_book.author #=> J. R. R. Tolkien
  Ruby's (start..stop).each do |i|:
    desc: creates a range that includes both start and stop values. It's an inclusive range.
    tags: [rb]
    notes:
      - md: |
          ## Ruby uses (start..stop) range object directly in loops and iterates over each value within the range, including both ends.

          ```ruby
          (1..5).each do |i|
              puts i
          end
          # Output: 1, 2, 3, 4, 5
          # Notice that 5 is included in the output.
          ```
