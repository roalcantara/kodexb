  Ruby Project Setup Guide (No Rails):
    desc: A guide to setting up a Ruby project
    tags: [rb]
    notes:
      - md: |
          # Ruby Project Setup Guide (No Rails)

          ## Prerequisites
          - Mise installed (`curl https://mise.jdx.dev/install.sh | sh`)
          - Git installed

          ## Step-by-Step Setup

          ### 1. Create and navigate to project directory
          ```bash
          mkdir -p ~/Work/ruby/demo && cd ~/Work/ruby/demo
          ```

          ### 2. Setup Ruby with Mise
          ```bash
          mise use ruby@latest
          mise install
          ```

          ### 3. Initialize Git repository
          ```bash
          git init && git branch -M main
          ```

          ### 4. Create project structure
          ```bash
          mkdir -p lib/demo test bin
          ```

          ### 5. Create Gemfile
          ```bash
          cat > Gemfile << 'EOF'
          # frozen_string_literal: true

          source 'https://rubygems.org'

          ruby '>= 3.3.0'

          gem 'minitest', '~> 5.0'
          gem 'minitest-reporters', '~> 1.6'

          group :development do
            gem 'rubocop', '~> 1.50', require: false
            gem 'rubocop-minitest', '~> 0.30', require: false
            gem 'rubocop-performance', '~> 1.15', require: false
          end

          group :test do
            gem 'simplecov', '~> 0.21', require: false
          end
          EOF
          ```

          ### 6. Create .ruby-version file
          ```bash
          echo "3.3.0" > .ruby-version
          ```

          ### 7. Create .gitignore
          ```bash
          cat > .gitignore << 'EOF'
          # Dependencies
          vendor/
          .bundle/
          Gemfile.lock

          # Coverage reports
          coverage/

          # Logs
          *.log

          # OS generated files
          .DS_Store
          .DS_Store?
          ._*
          .Spotlight-V100
          .Trashes
          ehthumbs.db
          Thumbs.db

          # IDE files
          .vscode/
          .idea/
          *.swp
          *.swo
          *~

          # Temporary files
          tmp/
          *.tmp
          *.bak
          EOF
          ```

          ### 8. Install gems
          ```bash
          bundle install
          ```

          ### 9. Create main library file
          ```bash
          cat > lib/demo.rb << 'EOF'
          # frozen_string_literal: true

          require_relative 'demo/version'

          module Demo
            class Error < StandardError; end

            def self.hello(name = 'World')
              "Hello, #{name}!"
            end
          end
          EOF
          ```

          ### 10. Create version file
          ```bash
          cat > lib/demo/version.rb << 'EOF'
          # frozen_string_literal: true

          module Demo
            VERSION = '0.1.0'
          end
          EOF
          ```

          ### 11. Create test helper
          ```bash
          cat > test/test_helper.rb << 'EOF'
          # frozen_string_literal: true

          require 'simplecov'
          SimpleCov.start

          $LOAD_PATH.unshift File.expand_path('../lib', __dir__)
          require 'demo'

          require 'minitest/autorun'
          require 'minitest/reporters'

          Minitest::Reporters.use! [Minitest::Reporters::DefaultReporter.new(color: true)]
          EOF
          ```

          ### 12. Create sample test
          ```bash
          cat > test/demo_test.rb << 'EOF'
          # frozen_string_literal: true

          require 'test_helper'

          class DemoTest < Minitest::Test
            def test_hello_with_default
              assert_equal 'Hello, World!', Demo.hello
            end

            def test_hello_with_name
              assert_equal 'Hello, Ruby!', Demo.hello('Ruby')
            end

            def test_version_exists
              refute_nil Demo::VERSION
            end
          end
          EOF
          ```

          ### 13. Create RuboCop configuration
          ```bash
          cat > .rubocop.yml << 'EOF'
          require:
            - rubocop-minitest
            - rubocop-performance

          AllCops:
            TargetRubyVersion: 3.3
            NewCops: enable
            Exclude:
              - 'vendor/**/*'
              - 'tmp/**/*'

          Style/Documentation:
            Enabled: false

          Style/FrozenStringLiteralComment:
            Enabled: true

          Layout/LineLength:
            Max: 120

          Metrics/MethodLength:
            Max: 15

          Metrics/BlockLength:
            Exclude:
              - 'test/**/*'
          EOF
          ```

          ### 14. Create Rakefile for common tasks
          ```bash
          cat > Rakefile << 'EOF'
          # frozen_string_literal: true

          require 'rake/testtask'
          require 'rubocop/rake_task'

          Rake::TestTask.new(:test) do |t|
            t.libs << 'test'
            t.libs << 'lib'
            t.test_files = FileList['test/**/*_test.rb']
          end

          RuboCop::RakeTask.new

          task default: %i[test rubocop]
          EOF
          ```

          ### 15. Create executable file (optional)
          ```bash
          cat > bin/demo << 'EOF'
          #!/usr/bin/env ruby
          # frozen_string_literal: true

          require_relative '../lib/demo'

          puts Demo.hello(ARGV[0])
          EOF

          chmod +x bin/demo
          ```

          ### 16. Run tests to verify setup
          ```bash
          bundle exec rake test
          ```

          ### 17. Run RuboCop to check code style
          ```bash
          bundle exec rubocop
          ```

          ### 18. Initial Git commit
          ```bash
          git add .
          git commit -m "Initial commit: Ruby project setup with Mise, Minitest, and RuboCop"
          ```

          ## Usage Examples

          ### Run tests
          ```bash
          bundle exec rake test
          # or
          bundle exec ruby -Ilib:test test/demo_test.rb
          ```

          ### Run RuboCop
          ```bash
          bundle exec rubocop
          bundle exec rubocop -a  # Auto-correct
          ```

          ### Run all checks
          ```bash
          bundle exec rake  # Runs both tests and RuboCop
          ```

          ### Use the executable
          ```bash
          ./bin/demo
          ./bin/demo "Ruby Developer"
          ```

          ## Project Structure
          ```
          demo/
          ├── .mise.toml
          ├── .ruby-version
          ├── .gitignore
          ├── .rubocop.yml
          ├── Gemfile
          ├── Gemfile.lock
          ├── Rakefile
          ├── bin/
          │   └── demo
          ├── lib/
          │   ├── demo.rb
          │   └── demo/
          │       └── version.rb
          └── test/
              ├── test_helper.rb
              └── demo_test.rb
          ```
  Ruby Project Setup with `bundle gem`:
    desc: A guide to setting up a Ruby project with `bundle gem`
    tags: [rb]
    notes:
      - md: |
          # Ruby Project Setup with `bundle gem`

          ## Prerequisites
          - Mise installed (`curl https://mise.jdx.dev/install.sh | sh`)
          - Ruby and Bundler installed

          ## Step-by-Step Setup

          ### 1. Navigate to your workspace
          ```bash
          cd ~/Work/ruby
          ```

          ### 2. Create project with bundle gem
          ```bash
          bundle gem demo --test=minitest --ci=github --linter=rubocop --changelog --mit
          cd demo
          ```

          ### 3. Setup Ruby version with Mise
          ```bash
          mise use ruby@latest
          mise install
          ```

          ### 4. Update .ruby-version file
          ```bash
          echo "3.4.6" > .ruby-version
          ```

          ### 5. Update Gemfile for better development experience
          ```bash
          cat > Gemfile << 'EOF'
          # frozen_string_literal: true

          source "https://rubygems.org"

          # Specify your gem's dependencies in demo.gemspec
          gemspec

          group :development do
            gem "irb"
            gem "rake", "~> 13.0"
            gem "rubocop", "~> 1.21"
            gem 'minitest-reporters', '~> 1.6'
          end

          group :test do
            gem "minitest", "~> 5.16"
            gem 'simplecov', '~> 0.21', require: false
          end
          EOF
          ```

          ### 6. Update test helper for better output
          ```bash
          cat > test/test_helper.rb << 'EOF'
          # frozen_string_literal: true

          require 'simplecov'
          SimpleCov.start

          $LOAD_PATH.unshift File.expand_path('../lib', __dir__)
          require 'demo'

          require 'minitest/autorun'
          require 'minitest/reporters'

          Minitest::Reporters.use! [Minitest::Reporters::DefaultReporter.new(color: true)]
          EOF
          ```

          ### 7. Install dependencies
          ```bash
          bundle install
          ```

          ### 8. Update the main test file
          ```bash
          cat > test/test_demo.rb << 'EOF'
          # frozen_string_literal: true

          require 'test_helper'

          class TestDemo < Minitest::Test
            def test_that_it_has_a_version_number
              refute_nil ::Demo::VERSION
            end

            def test_hello_method
              assert_equal 'Hello, World!', Demo.hello
            end

            def test_hello_with_name
              assert_equal 'Hello, Ruby!', Demo.hello('Ruby')
            end
          end
          EOF
          ```

          ### 9. Add a simple method to the main module
          ```bash
          cat > lib/demo.rb << 'EOF'
          # frozen_string_literal: true

          require_relative 'demo/version'

          module Demo
            class Error < StandardError; end

            def self.hello(name = 'World')
              "Hello, #{name}!"
            end
          end
          EOF
          ```

          ### 10. Update RuboCop configuration (optional)
          ```bash
          cat >> .rubocop.yml << 'EOF'

          Layout/LineLength:
            Max: 120

          Metrics/MethodLength:
            Max: 15

          Style/Documentation:
            Enabled: false
          EOF
          ```

          ### 11. Run tests to verify setup
          ```bash
          bundle exec rake test
          ```

          ### 12. Run RuboCop to check code style
          ```bash
          bundle exec rubocop
          ```

          ### 13. Commit the initial setup
          ```bash
          git add .
          git commit -m "Update project setup with Mise, enhanced testing, and sample code"
          ```

          ## Usage Examples

          ### Run tests
          ```bash
          bundle exec rake test
          bundle exec rake  # Runs all default tasks
          ```

          ### Run RuboCop with auto-fix
          ```bash
          bundle exec rubocop -a
          ```

          ### Build and install gem locally
          ```bash
          bundle exec rake build
          bundle exec rake install
          ```

          ### Release gem (when ready)
          ```bash
          bundle exec rake release
          ```

          ## What `bundle gem` Created

          ```
          demo/
          ├── .github/
          │   └── workflows/
          │       └── main.yml         # CI setup
          ├── .gitignore              # Comprehensive gitignore
          ├── .rubocop.yml           # RuboCop configuration
          ├── .ruby-version          # Ruby version file
          ├── CHANGELOG.md           # Changelog template
          ├── CODE_OF_CONDUCT.md     # Code of conduct
          ├── Gemfile                # Dependencies
          ├── LICENSE.txt            # MIT license
          ├── README.md              # Project documentation
          ├── Rakefile               # Build tasks
          ├── bin/
          │   ├── console            # Interactive console
          │   └── setup              # Setup script
          ├── demo.gemspec           # Gem specification
          ├── lib/
          │   ├── demo.rb            # Main module
          │   └── demo/
          │       └── version.rb     # Version file
          └── test/
              ├── test_helper.rb     # Test configuration
              └── test_demo.rb       # Sample tests
          ```

          ## Key Benefits of This Approach

          - **Instant setup**: `bundle gem` creates everything you need
          - **Best practices**: Follows Ruby gem conventions
          - **CI ready**: GitHub Actions workflow included
          - **Professional structure**: LICENSE, CODE_OF_CONDUCT, proper documentation
          - **Gem distribution ready**: Can publish to RubyGems.org when ready
          - **Version management**: Proper Ruby version pinning with Mise
