bookmarks:
  # Google Docs
  https://youtu.be/NUrmh7VVArM:
    desc: The option "Format > Line Spacing > Keep with next" prevents a paragraph (or heading) from being separated from the paragraph that immediately follows it when text is moved to a new page. This is particularly useful for keeping a heading and its associated text together, ensuring a heading doesn't end up alone at the bottom of a page while its content starts on the next | Google Docs.
    tags: [gdoc]
    links:
      - https://support.google.com/docs/answer/1663349


      - https://support.google.com/docs/thread/143259822/how-to-have-keep-with-next-on-by-default?hl=en

  https://youtu.be/8e_qob4Ci0g:
    desc: Select a text, go to "Format > Line & paragraph spacing > Keep lines together" to ensure the entire paragraph stays on a single page. This option prevents a paragraph from splitting across pages, but requires your document to be in "pages" format, not "pageless" format | Google Docs.
    tags: [gdoc]
    links: [https://support.google.com/docs/answer/1663349]


cheats:
  GCP/AWS/Azure Service Correlations:
    desc: Main cloud service descriptions, correlations, differences & similarities
    tags: [gcp, aws, azure]
    notes:
      - md: | #markdown
          | **GCP/FIREBASE**                  | **AWS**                              | **AZURE**                                     | **DESCRIPTION**                                                                                |
          | --------------------------------- | ------------------------------------ | --------------------------------------------- | ---------------------------------------------------------------------------------------------- |
          | Identity Platform (IAM)           | IAM                                  | Azure Active Directory (Entra ID)             | Identity and access management (foundational for all other services)                           |
          | App Check                         | AWS WAF / Cognito Advanced Security  | Azure App Service Authentication / Defender   | App attestation, anti-abuse, and threat protection (requires IAM for config)                   |
          | Authentication                    | Cognito                              | Azure AD B2C / Azure AD                       | User authentication and authorization (relies on IAM)                                          |
          | Regions/Zones                     | Regions/AZs                          | Regions/Availability Zones                    | Global infrastructure for high availability and latency control                                |
          | Projects                          | Accounts                             | Subscriptions                                 | Top-level resource containers                                                                  |
          | Tenants/Talent Solution           | Organizations                        | Management Groups / Tenants                   | Multi-tenant isolation and management (GCP: job search, AWS: org/account governance & billing) |
          |                                   | Organizations                        | Management Groups                             | Multi-account governance, billing, and policy management                                       |
          |                                   | Control Tower                        | Azure Landing Zones                           | Automated landing zone and multi-account governance                                            |
          | App Hosting                       | Amplify Hosting / S3 + CloudFront    | Azure Static Web Apps / Blob + CDN            | Managed static and web app hosting                                                             |
          | Hosting                           | Amplify Hosting / S3 + CloudFront    | Azure App Service / Static Web Apps           | Managed static and web app hosting                                                             |
          | Cloud Storage                     | S3                                   | Azure Blob Storage                            | Object storage for files and blobs                                                             |
          | Macie                             | Macie                                | Azure Purview / Microsoft Defender for Cloud  | Data security and privacy for S3/Blob                                                          |
          | Cloud SQL                         | RDS                                  | Azure SQL Database                            | Managed relational database service                                                            |
          | Cloud Spanner                     | Aurora/Neptune                       | Azure Cosmos DB / Azure SQL Hyperscale        | Globally distributed SQL/NoSQL database                                                        |
          | Firestore                         | DynamoDB                             | Azure Cosmos DB (NoSQL API)                   | NoSQL, fully managed, scalable database                                                        |
          | Realtime Database                 | AppSync / DynamoDB Streams           | Azure SignalR Service / Cosmos DB Change Feed | Real-time data sync and pub/sub                                                                |
          | BigQuery                          | Redshift                             | Azure Synapse Analytics                       | Managed data warehouse/analytics                                                               |
          | Data Connect                      | AppFlow / Glue Data Catalog          | Azure Data Factory / Purview                  | Data integration and ETL pipelines                                                             |
          | Dataflow                          | Glue/Kinesis Data Analytics          | Azure Data Factory / Stream Analytics         | Managed data processing pipelines                                                              |
          | Lake Formation                    | Lake Formation                       | Azure Data Lake / Purview                     | Centralized data lake governance and security                                                  |
          | Cloud Functions                   | Lambda                               | Azure Functions                               | Event-driven serverless compute                                                                |
          | Firebase Functions                | Lambda                               | Azure Functions                               | Serverless compute for event-driven code execution                                             |
          | Cloud Run                         | ECS Fargate/Lambda                   | Azure Container Apps / Azure Functions        | Serverless containers (ECS Fargate) or serverless functions                                    |
          | Kubernetes Engine (GKE)           | Elastic Kubernetes Service (EKS)     | Azure Kubernetes Service (AKS)                | Managed Kubernetes container orchestration                                                     |
          | Elastic/Opensearch                | OpenSearch Service (Elasticsearch)   | Azure Cognitive Search / Azure Managed ES     | Managed Elasticsearch/OpenSearch for search and analytics                                      |
          | Extensions                        | AWS Lambda Extensions / Marketplace  | Azure Marketplace / Logic Apps Connectors     | Prebuilt integrations and add-ons                                                              |
          | Step Functions                    | Step Functions                       | Azure Durable Functions / Logic Apps          | Serverless workflow orchestration                                                              |
          | Cloud Pub/Sub                     | SNS/SQS                              | Azure Service Bus / Event Grid / Queue        | Messaging and eventing services (pub/sub, queue)                                               |
          | In-App Messaging                  | Pinpoint / SNS / Lambda              | Azure Notification Hubs / Event Grid          | Targeted in-app messaging and user engagement                                                  |
          | Remote Config                     | AppConfig                            | Azure App Configuration                       | Remote feature flagging, dynamic config, and rollout management                                |
          | CodePipeline/CodeBuild/CodeDeploy | CodePipeline/CodeBuild/CodeDeploy    | Azure DevOps Pipelines / GitHub Actions       | Fully managed CI/CD pipeline suite                                                             |
          | CloudFormation                    | CloudFormation                       | Azure Resource Manager (ARM) / Bicep          | Infrastructure as Code (IaC) for resources                                                     |
          | Service Catalog                   | Service Catalog                      | Azure Managed Applications / Marketplace      | Centralized management of approved IT services                                                 |
          | Inspector                         | Inspector                            | Microsoft Defender for Cloud                  | Automated security assessment                                                                  |
          | Trusted Advisor                   | Trusted Advisor                      | Azure Advisor                                 | Automated best practice checks and cost optimization                                           |
          | Outposts                          | Outposts                             | Azure Stack                                   | Hybrid cloud with hardware on-premises                                                         |
          | Snow Family                       | Snow Family                          | Azure Data Box                                | Edge computing and data transfer appliances                                                    |
          | Test Lab                          | Device Farm                          | Azure App Center Test / Device Testing        | App testing on real devices in the cloud                                                       |
          | App Distribution                  | Device Farm / CodeDeploy             | Azure App Center / DevOps Pipelines           | Beta app distribution and deployment pipelines                                                 |
          | Firebase AI Logic client SDKs     | Bedrock / SageMaker                  | Azure AI Studio / Azure Machine Learning      | Client SDKs for AI/ML inference and logic                                                      |
          | Genkit                            | Bedrock / SageMaker                  | Azure AI Studio / Azure Machine Learning      | Generative AI and ML development                                                               |
          | Firebase ML                       | SageMaker / Rekognition / Comprehend | Azure Machine Learning / Cognitive Services   | Machine learning, vision, and NLP services                                                     |
