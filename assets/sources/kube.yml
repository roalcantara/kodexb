cheats:
  Kubernetes + Novo Serviço no RDS on AWS - Complete Setup Script:
    desc: Kubernetes + Novo Serviço no RDS on AWS - Complete Setup Script
    tags: [aws]
    notes:
      - sh: | #shell
          #!/bin/bash

          # ============================================================================
          # Validação de Endpoint - Users API
          # ============================================================================

          API_NAMESPACE="api"
          REGION="us-east-1"

          # ============================================================================
          # 1. Get LoadBalancer URL
          # ============================================================================
          echo "🔧 [1/5] Obtendo LoadBalancer URL..."

          LB_HOSTNAME=$(kubectl get svc users-api-service -n $API_NAMESPACE \
            --query 'status.loadBalancer.ingress[0].hostname' --output text)

          LB_IP=$(kubectl get svc users-api-service -n $API_NAMESPACE \
            --query 'status.loadBalancer.ingress[0].ip' --output text)

          if [ "$LB_HOSTNAME" != "None" ] && [ -n "$LB_HOSTNAME" ]; then
            API_URL="http://$LB_HOSTNAME"
          elif [ "$LB_IP" != "None" ] && [ -n "$LB_IP" ]; then
            API_URL="http://$LB_IP"
          else
            echo "❌ LoadBalancer ainda não tem IP/Hostname!"
            echo "ℹ️ Aguarde alguns minutos e execute novamente"
            echo "kubectl get svc -n $API_NAMESPACE"
            exit 1
          fi

          echo "✅ API URL: $API_URL"

          # ============================================================================
          # 2. Health Check Básico
          # ============================================================================
          echo ""
          echo "🔧 [2/5] Health Check..."

