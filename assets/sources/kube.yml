  Kubernetes + RDS Existente on AWS - Complete Setup Script Usando eksctl:
    desc: eksctl abstrai a complexidade do AWS CLI, mas exige controle total sobre segurança (Security Groups) e deployment
    tags: [kubernete, aws, rds]
    links: [https://docs.aws.amazon.com/eks/latest/eksctl/installation.html]
    notes:
      - sh: | #shell
          #!/bin/bash
          # ============================================================================
          # SETUP INICIAL - Configure essas variáveis
          # ============================================================================

          # 🔴 CUSTOMIZE COM SEUS DADOS
          export RDS_ENDPOINT="seu-db.c9akciq32.us-east-1.rds.amazonaws.com"
          export DB_USER="admin"
          export DB_PASSWORD="SuaSenha123!"
          export DB_NAME="postgres"
          export REGION="us-east-1"
          export CLUSTER_NAME="my-cluster"
          export API_IMAGE="seu-registry/users-api:latest"

          # ============================================================================
          # PASSO 1: Validar Conectividade AWS
          # ============================================================================
          # Por que? Confirma que você tem credenciais AWS válidas
          # O que faz? Mostra qual usuário/role está executando os comandos
          # Recurso: AWS STS (Security Token Service)

          echo "=== PASSO 1: Validar Credenciais AWS ==="
          aws sts get-caller-identity
          # Esperado output:
          # {
          #     "UserId": "AIDAI...",
          #     "Account": "123456789012",
          #     "Arn": "arn:aws:iam::123456789012:user/seu-user"
          # }

          # ============================================================================
          # PASSO 2: Validar que RDS Existe
          # ============================================================================
          # Por que? Confirma que seu banco de dados RDS já está disponível
          # O que faz? Query na AWS a instância RDS pelo endpoint
          # Recurso: AWS RDS (Relational Database Service)

          echo "=== PASSO 2: Validar RDS Existente ==="
          aws rds describe-db-instances \
            --region $REGION \
            --query "DBInstances[?Endpoint.Address=='$RDS_ENDPOINT'].[DBInstanceIdentifier,Engine,DBInstanceStatus,Endpoint.Address]" \
            --output table
          # Esperado output:
          # |  DBInstanceIdentifier  |  Engine  |  DBInstanceStatus  |  Endpoint.Address  |
          # |  my-postgres           |  postgres|  available         |  seu-db.c9...     |

          # ============================================================================
          # PASSO 3: Instalar eksctl (se ainda não instalado)
          # ============================================================================
          # Por que? eksctl é a ferramenta mais simples para provisionar EKS
          # O que é? Wrapper da AWS que abstrai complexidade de IAM, VPC, Auto Scaling
          # Por que usamos? Reduz 30 passos para ~3, mas mantém controle

          echo "=== PASSO 3: Verificar eksctl ==="
          if ! command -v eksctl &> /dev/null; then
            echo "eksctl não encontrado. Instalando..."
            curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
            sudo mv /tmp/eksctl /usr/local/bin
            echo "✅ eksctl instalado"
          else
            eksctl version
            echo "✅ eksctl já está instalado"
          fi

          # ============================================================================
          # PASSO 4: Criar EKS Cluster com eksctl (TUDO EM 1 COMANDO!)
          # ============================================================================
          # Por que? Creates: VPC, Subnets, IAM roles, Control plane, Node group
          # O que é? EKS = Elastic Kubernetes Service (managed Kubernetes da AWS)
          # O que faz eksctl? Cria automaticamente:
          #   - IAM roles para service e nodes
          #   - Security groups com regras corretas
          #   - VPC e subnets (ou usa existentes)
          #   - Auto Scaling group para nodes
          #   - Configura kubeconfig automaticamente
          # Tempo? ~15 minutos

          echo "=== PASSO 4: Criar EKS Cluster com eksctl ==="
          eksctl create cluster \
            --name $CLUSTER_NAME \
            --region $REGION \
            --nodes 2 \
            --node-type t3.medium \
            --managed \
            --with-oidc
          # Flags explicadas:
          #   --name: Nome do cluster (deve ser único por região)
          #   --region: Região AWS
          #   --nodes: Quantidade inicial de nodes (máquinas EC2)
          #   --node-type: Tipo de EC2 (t3.medium = 1 vCPU, 1GB RAM, barato)
          #   --managed: AWS gerencia auto-scaling (recomendado)
          #   --with-oidc: Habilita IRSA (IAM roles para service accounts)

          # Esperado output (primeiros 30 seg):
          # [ℹ]  eksctl version 0.168.0
          # [ℹ]  using region us-east-1
          # [ℹ]  subnets and nodes will be created in us-east-1...
          # ...
          # [✔]  EKS cluster "my-cluster" in "us-east-1" is ready

          # ============================================================================
          # PASSO 5: Validar Cluster e Nodes
          # ============================================================================
          # Por que? Confirma que cluster e nodes estão prontos para receber workloads
          # O que faz? List nodes - se estão em estado "Ready"
          # Recurso: kubectl (CLI do Kubernetes)

          echo "=== PASSO 5: Validar Cluster e Nodes ==="
          kubectl get nodes -o wide
          # Esperado output:
          # NAME                                       STATUS   ROLES    AGE   VERSION
          # ip-172-31-12-34.ec2.internal               Ready    <none>   5m    v1.28.1
          # ip-172-31-12-35.ec2.internal               Ready    <none>   5m    v1.28.1

          # ============================================================================
          # PASSO 6: Pegar VPC Subnets (necessário para Security Group)
          # ============================================================================
          # Por que? Vamos usar essas subnets para encontrar os security groups dos nodes
          # O que é? Subnet = divisão lógica da VPC onde EC2s são lançados
          # Para quê? Precisamos saber qual SG usar para liberar acesso ao RDS

          echo "=== PASSO 6: Pegar VPC Subnets ==="
          export SUBNETS=$(aws ec2 describe-subnets \
            --region $REGION \
            --query 'Subnets[0:2].SubnetId' \
            --output text)
          echo "Subnets: $SUBNETS"

          # ============================================================================
          # PASSO 7: Pegar Security Group do RDS
          # ============================================================================
          # Por que? Precisa saber qual SG controla acesso ao banco
          # O que é? SG = firewall virtual da AWS (permite/bloqueia tráfego)
          # Para quê? Vamos adicionar regra de entrada para os nodes

          echo "=== PASSO 7: Pegar Security Group do RDS ==="
          export RDS_SG=$(aws rds describe-db-instances \
            --region $REGION \
            --query "DBInstances[?Endpoint.Address=='$RDS_ENDPOINT'].VpcSecurityGroups[0].VpcSecurityGroupId" \
            --output text)
          echo "RDS Security Group: $RDS_SG"
          # Esperado output:
          # RDS Security Group: sg-12345abc

          # ============================================================================
          # PASSO 8: Pegar Security Group dos Nodes
          # ============================================================================
          # Por que? Esse SG é aplicado a todos os nodes do cluster
          # Para quê? Vamos liberar saída desse SG para a porta 5432 do RDS SG
          # Como eksctl nomeou? Pattern: eks-<cluster-name>-nodegroup-sg

          echo "=== PASSO 8: Pegar Security Group dos Nodes ==="
          export NODE_SG=$(aws ec2 describe-security-groups \
            --region $REGION \
            --filters "Name=tag:aws:cloudformation:logical-id,Values=NodeSecurityGroup" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null)

          if [ -z "$NODE_SG" ] || [ "$NODE_SG" == "None" ]; then
            # Tenta padrão alternativo
            export NODE_SG=$(aws ec2 describe-security-groups \
              --region $REGION \
              --filters "Name=group-name,Values=eks-*-nodegroup-sg" \
              --query 'SecurityGroups[0].GroupId' \
              --output text 2>/dev/null)
          fi

          echo "Node Security Group: $NODE_SG"
          # Esperado output:
          # Node Security Group: sg-67890def

          # ============================================================================
          # PASSO 9: Liberar Acesso do Nodes ao RDS (Port 5432)
          # ============================================================================
          # Por que? Sem isso, containers NÃO conseguem conectar ao banco RDS
          # O que faz? Adiciona regra de ingress no RDS SG:
          #   - Protocolo: TCP
          #   - Porta: 5432 (PostgreSQL)
          #   - Origem: Security group dos nodes
          # Resultado? Tráfego de nodes → RDS é permitido

          echo "=== PASSO 9: Liberar Acesso ao RDS ==="
          aws ec2 authorize-security-group-ingress \
            --group-id $RDS_SG \
            --protocol tcp \
            --port 5432 \
            --source-security-group-id $NODE_SG \
            --region $REGION 2>/dev/null || echo "✅ Rule já existe"
          echo "✅ Security Group rule adicionada"

          # ============================================================================
          # PASSO 10: Criar Namespace no Kubernetes
          # ============================================================================
          # Por que? Namespace isola recursos - melhor que colocar tudo em "default"
          # O que é? Namespace = folder virtual no K8s para organizar deploys
          # Benefício? Você pode ter "api", "monitoring", "ingress" sem conflitar

          echo "=== PASSO 10: Criar Namespace ==="
          kubectl create namespace api 2>/dev/null || echo "✅ Namespace já existe"
          # Esperado output:
          # namespace/api created
          # ou: ✅ Namespace já existe

          # ============================================================================
          # PASSO 11: Criar Secret com Credenciais RDS
          # ============================================================================
          # Por que? Containers precisam de credenciais para conectar ao banco
          # O que é? Secret = dados sensíveis criptografados no etcd do K8s
          # Como funciona? Você faz reference no Deployment, K8s injeta via env vars
          # Benefício? Credenciais não ficam hardcoded no git/Docker image

          echo "=== PASSO 11: Criar Secret RDS ==="
          kubectl create secret generic rds-credentials \
            --from-literal=host=$RDS_ENDPOINT \
            --from-literal=user=$DB_USER \
            --from-literal=password=$DB_PASSWORD \
            --from-literal=database=$DB_NAME \
            -n api \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Secret criado/atualizado"

          # ============================================================================
          # PASSO 12: Validar Secret
          # ============================================================================
          # Por que? Confirma que secret foi criado com as 4 chaves corretas
          # O que faz? List secrets - mostra tipo (Opaque) e quantidade de chaves (4)

          echo "=== PASSO 12: Validar Secret ==="
          kubectl get secrets -n api rds-credentials -o wide
          # Esperado output:
          # NAME               TYPE     DATA   AGE
          # rds-credentials    Opaque   4      10s

          # ============================================================================
          # PASSO 13: Fazer Deploy da API no Kubernetes
          # ============================================================================
          # Por que? Isso executa sua aplicação Node.js nos nodes
          # O que é Deployment? Arquivo YAML que define:
          #   - Quantos replicas (2 pods)
          #   - Qual imagem Docker
          #   - Quais env vars
          #   - Port mapeado (3000 → container)
          # O que é Service? Expõe deployment:
          #   - type: LoadBalancer = AWS cria ELB automaticamente
          #   - Porta 80 (entrada) → 3000 (container)
          # Resultado? ELB com URL pública acessível

          echo "=== PASSO 13: Deploy API ==="

          # kube.yaml file content:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: users-api
            namespace: api
            labels:
              app: users-api
          spec:
            replicas: 2
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            selector:
              matchLabels:
                app: users-api
            template:
              metadata:
                labels:
                  app: users-api
              spec:
                # Affinity: distribui pods em diferentes nodes
                affinity:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        labelSelector:
                          matchExpressions:
                          - key: app
                            operator: In
                            values:
                            - users-api
                        topologyKey: kubernetes.io/hostname
                containers:
                - name: api
                  image: $API_IMAGE
                  imagePullPolicy: IfNotPresent
                  ports:
                  - containerPort: 3000
                    name: http
                  # Env vars injetadas do Secret
                  env:
                  - name: DB_HOST
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: host
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: user
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: password
                  - name: DB_NAME
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: database
                  - name: DB_PORT
                    value: "5432"
                  - name: NODE_ENV
                    value: "production"
                  # Health checks
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 3000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 3000
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  # Recursos solicitados
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: users-api-service
            namespace: api
            labels:
              app: users-api
          spec:
            type: LoadBalancer
            selector:
              app: users-api
            ports:
            - protocol: TCP
              port: 80
              targetPort: 3000
              name: http
            # Opção: usar Network Load Balancer em vez de Classic LB
            # externalTrafficPolicy: Local

          kubectl apply -f kube.yaml
          echo "✅ Deployment e Service criados"

          # ============================================================================
          # PASSO 14: Validar Deployment
          # ============================================================================
          # Por que? Ver status - quantos replicas estão rodando?
          # O que faz? Show Deployment - target: 2, atual: ?

          echo "=== PASSO 14: Validar Deployment ==="
          kubectl get deployments -n api
          # Esperado output:
          # NAME        READY   UP-TO-DATE   AVAILABLE   AGE
          # users-api   2/2     2            2           45s

          # ============================================================================
          # PASSO 15: Ver Pods em Detalhe
          # ============================================================================
          # Por que? Pods são as instâncias reais do container rodando
          # O que faz? List pods - mostra nome, status (Running/Pending), IPs

          echo "=== PASSO 15: Ver Pods ==="
          kubectl get pods -n api -o wide
          # Esperado output:
          # NAME                        READY   STATUS    RESTARTS   AGE   IP
          # users-api-5f7d9b6c8-abc12   1/1     Running   0          45s   10.0.1.45
          # users-api-5f7d9b6c8-def45   1/1     Running   0          45s   10.0.2.78

          # ============================================================================
          # PASSO 16: Ver Logs de um Pod (Debug)
          # ============================================================================
          # Por que? Debugar erros de startup, conexão com RDS, etc
          # O que faz? Mostra stdout/stderr do container
          # Dica? Se pod está em CrashLoopBackOff, logs mostram o porquê

          echo "=== PASSO 16: Ver Logs de um Pod ==="
          kubectl logs -n api -l app=users-api --tail=50 --all-containers=true
          # Esperado output (exemplo):
          # 2024-01-15 10:30:45 INFO: Connecting to RDS...
          # 2024-01-15 10:30:46 INFO: Connected to database
          # 2024-01-15 10:30:46 INFO: Server running on port 3000

          # ============================================================================
          # PASSO 17: Aguardar LoadBalancer URL
          # ============================================================================
          # Por que? ELB leva tempo para provisionar (AWS precisa alocar IP/hostname)
          # O que é LoadBalancer? Serviço AWS que distribui tráfego entre múltiplos targets
          # Tempo? 2-5 minutos

          echo "=== PASSO 17: Aguardar LoadBalancer URL ==="
          echo "⏳ Aguardando 40 segundos para ELB provisionar..."
          sleep 40

          # ============================================================================
          # PASSO 18: Obter LoadBalancer URL
          # ============================================================================
          # Por que? Essa é a URL pública para acessar sua API
          # O que é? AWS fornece hostname do ELB (ou IP em alguns casos)
          # Formato? Algo como: a1b2c3d4-123456.elb.us-east-1.amazonaws.com

          echo "=== PASSO 18: Obter LoadBalancer URL ==="
          kubectl get svc users-api-service -n api
          # Esperado output:
          # NAME                 TYPE          CLUSTER-IP     EXTERNAL-IP
          # users-api-service    LoadBalancer  10.100.0.123   a12b3c45-123456.elb.us-east-1.amazonaws.com

          export LB_URL=$(kubectl get svc users-api-service -n api \
            --query 'status.loadBalancer.ingress[0].hostname' \
            --output text)

          echo "✅ LoadBalancer URL: $LB_URL"

          # ============================================================================
          # PASSO 19: Health Check Básico
          # ============================================================================
          # Por que? Validar que a app está respondendo antes de testes mais complexos
          # O que faz? GET para / ou /health - se retorna 200 OK, está vivo
          # Esperado? HTTP 200

          echo "=== PASSO 19: Health Check ==="
          curl -s -I http://$LB_URL/ -w "Status: %{http_code}\n" | head -5
          # Esperado output:
          # HTTP/1.1 200 OK
          # ...
          # Status: 200

          # ============================================================================
          # PASSO 20: GET /users - Listar Todos os Usuários
          # ============================================================================
          # Por que? Validar que API consegue conectar ao RDS e retornar dados
          # O que faz? Query na tabela users do RDS via sua aplicação
          # Resultado? Array JSON com todos os usuários
          # Esperado? HTTP 200 + JSON com data

          echo "=== PASSO 20: GET /users (Listar Usuários) ==="
          echo "Comando: curl -X GET http://$LB_URL/users -H 'Content-Type: application/json'"
          curl -X GET "http://$LB_URL/users" \
            -H "Content-Type: application/json" \
            -w "\nStatus: %{http_code}\n" 2>/dev/null | jq '.' 2>/dev/null || echo "(Resposta pode não ser JSON)"
          # Esperado output (exemplo):
          # [
          #   {"id": 1, "name": "João Silva", "email": "joao@example.com"},
          #   {"id": 2, "name": "Maria Santos", "email": "maria@example.com"}
          # ]
          # Status: 200

          # ============================================================================
          # PASSO 21: GET /users?page=1&limit=10 - Com Paginação
          # ============================================================================
          # Por que? Testar query parameters - importante para grande volume de dados
          # O que faz? Retorna página 1 com 10 resultados por página
          # Caso de uso? Quando tabela tem milhões de registros

          echo "=== PASSO 21: GET /users?page=1&limit=10 (Com Paginação) ==="
          echo "Comando: curl -X GET 'http://$LB_URL/users?page=1&limit=10' ..."
          curl -X GET "http://$LB_URL/users?page=1&limit=10" \
            -H "Content-Type: application/json" \
            -w "\nStatus: %{http_code}\n" 2>/dev/null | jq '.' 2>/dev/null || echo "(Resposta pode não ser JSON)"

          # ============================================================================
          # PASSO 22: GET /users/{id} - Usuário Específico
          # ============================================================================
          # Por que? Validar que pode buscar um registro específico
          # O que faz? Query WHERE id=1

          echo "=== PASSO 22: GET /users/1 (Usuário Específico) ==="
          echo "Comando: curl -X GET http://$LB_URL/users/1 ..."
          curl -X GET "http://$LB_URL/users/1" \
            -H "Content-Type: application/json" \
            -w "\nStatus: %{http_code}\n" 2>/dev/null | jq '.' 2>/dev/null || echo "(ID pode não existir)"

          # ============================================================================
          # PASSO 23: POST /users - Criar Novo Usuário
          # ============================================================================
          # Por que? Validar que a app consegue ESCREVER no RDS (INSERT)
          # O que faz? Cria novo registro na tabela users
          # Esperado? HTTP 201 Created + dados do novo usuário com ID gerado

          echo "=== PASSO 23: POST /users (Criar Novo Usuário) ==="
          echo "Comando: curl -X POST http://$LB_URL/users ..."
          curl -X POST "http://$LB_URL/users" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Teste ExternalLB",
              "email": "teste.eks@example.com"
            }' \
            -w "\nStatus: %{http_code}\n" 2>/dev/null | jq '.' 2>/dev/null || echo "(Erro ou resposta não-JSON)"
          # Esperado output:
          # {"id": 3, "name": "Teste ExternalLB", "email": "teste.eks@example.com", "createdAt": "2024-01-15T10:45:30Z"}
          # Status: 201

          # ============================================================================
          # PASSO 24: Validar Persistência - Listar Novamente
          # ============================================================================
          # Por que? Confirmar que dados foram persisted no RDS (não perdido ao restart)
          # O que faz? GET /users novamente - novo registro deve aparecer

          echo "=== PASSO 24: Validar Persistência (Listar Novamente) ==="
          echo "Comando: curl -X GET http://$LB_URL/users ..."
          curl -X GET "http://$LB_URL/users" \
            -H "Content-Type: application/json" \
            -s 2>/dev/null | jq '.[] | {id, name, email}' 2>/dev/null || echo "(Erro)"

          # ============================================================================
          # PASSO 25: Dashboard Final - Status Completo
          # ============================================================================
          # Por que? Resumo de tudo que foi provisionado e como acessar

          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║              ✅ SETUP COMPLETO - RESUMO                    ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📋 AWS EKS Cluster:"
          echo "   Name: $CLUSTER_NAME"
          echo "   Region: $REGION"
          kubectl cluster-info | grep 'Kubernetes master'
          echo ""
          echo "📊 RDS Database (Existente):"
          echo "   Endpoint: $RDS_ENDPOINT"
          echo "   User: $DB_USER"
          echo "   Database: $DB_NAME"
          echo ""
          echo "🌐 API Service:"
          echo "   URL: http://$LB_URL"
          echo "   Users Endpoint: http://$LB_URL/users"
          echo ""
          echo "⚙️ Kubernetes Resources:"
