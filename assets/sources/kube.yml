          echo "   Region: $REGION"
          echo "   API Endpoint: https://$(kubectl cluster-info | grep -oP '(?<=server: ).*')"
          echo ""
          echo "📊 RDS Database (Existente):"
          echo "   Endpoint: $RDS_ENDPOINT"
          echo "   User: $DB_USER"
          echo "   Database: $DB_NAME"
          echo ""
