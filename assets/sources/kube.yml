          echo "curl -X GET \"$API_URL/users?page=1&limit=10\" \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  -w '\nStatus: %{http_code}\n'"
          echo ""

          echo "--- Response ---"
          curl -X GET "$API_URL/users?page=1&limit=10" \
            -H 'Content-Type: application/json' \
            -w '\nStatus: %{http_code}\n' 2>/dev/null | jq '.' 2>/dev/null || curl -X GET "$API_URL/users?page=1&limit=10" -H 'Content-Type: application/json' -w '\nStatus: %{http_code}\n'

          # ============================================================================
          # 5. Testes Adicionais (se implementado)
          # ============================================================================
          echo ""
          echo "🔧 [5/5] Testes Adicionais..."

          echo ""
          echo "--- GET /users/{id} ---"
          echo "curl -X GET \"$API_URL/users/1\" \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  -w '\nStatus: %{http_code}\n'"
          echo ""

          echo "--- POST /users (Criar novo usuário) ---"
          echo "curl -X POST \"$API_URL/users\" \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  -d '{\"name\": \"João Silva\", \"email\": \"joao@example.com\"}' \\"
          echo "  -w '\nStatus: %{http_code}\n'"
          echo ""

          # ============================================================================
          # Debug Info
          # ============================================================================
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                  📊 Debug Information                       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""

          echo "Pod Status:"
          kubectl get pods -n $API_NAMESPACE -l app=users-api

          echo ""
          echo "Pod Logs:"
          kubectl logs -n $API_NAMESPACE -l app=users-api --tail=20

          echo ""
          echo "Service Status:"
          kubectl get svc -n $API_NAMESPACE

          echo ""
          echo "RDS Connection Test (dentro do pod):"
          echo "kubectl exec -it -n $API_NAMESPACE \$(kubectl get pod -n $API_NAMESPACE -l app=users-api -o jsonpath='{.items[0].metadata.name}') -- sh -c 'echo \"RDS_HOST: \$DB_HOST, RDS_USER: \$DB_USER\"'"

          echo ""
  The Easiest Approach - Amazon EKS with eksctl:
    desc: The Easiest Approach - Amazon EKS with eksctl
    tags: [kubernete, aws, rds]
    notes:
      - md: | #markdown
          ## The Easiest Way to Setup Kubernetes on AWS

          1. Create the EKS Cluster

          - The simplest way is to use eksctl, a command-line utility that automates the creation of Amazon EKS clusters:

          ```sh
          # Install eksctl, kubectl, and AWS CLI first
          # Then create your cluster
          eksctl create cluster --name my-api-cluster --region us-west-2 --nodegroup-name standard-workers --node-type m5.large --nodes 2
          ```

          This single command creates:

          The EKS cluster with managed control plane
          Worker nodes (EC2 instances)
          All necessary networking (VPC, subnets, security groups)
          IAM roles and policies
          2. Database Options For your database, you have several AWS-managed options:

          Amazon RDS (PostgreSQL, MySQL, etc.) - Traditional relational database
          Amazon Aurora - High-performance, cloud-native database
          Amazon DynamoDB - NoSQL option for simpler use cases
          3. Database Connectivity The easiest approach is to deploy both your EKS cluster and database in the same VPC. This allows direct connectivity between your Kubernetes pods and the database. You'll need to:

          Configure security groups to allow traffic from EKS worker nodes to the database
          Use database connection pooling (like Amazon RDS Proxy) for better performance
          Store database credentials in AWS Secrets Manager and access them from your pods
          4. Sample API Application Architecture Your Kubernetes deployment would include:

          A Deployment with your API application (e.g., Node.js, Python Flask, or Java Spring Boot)
          A Service to expose your API within the cluster
          An Ingress or LoadBalancer service to expose your API externally
          ConfigMaps and Secrets for configuration and database credentials
          5. Simple Example Structure

          # Your API pod connects to RDS/Aurora
          # API endpoint: GET /api/data
          # Logic: SELECT TOP 100 * FROM your_table
          # Returns: JSON response with the data

          Key Benefits of This Approach:

          Fully managed: AWS handles the Kubernetes control plane
          Automated setup: eksctl creates everything you need
          Scalable: Can easily scale both the cluster and database
          Secure: Built-in security features and IAM integration
          Cost-effective: Pay only for what you use
          Next Steps:

          Set up your AWS CLI and install eksctl
          Create the EKS cluster using the command above
          Set up your database (RDS or Aurora)
          Deploy your API application to the cluster
          Configure networking and security groups for database access
          This approach gives you a production-ready Kubernetes environment on AWS with minimal manual configuration, making it the easiest path to get your API and database solution running.
  Kubernetes + Serviço existente no RDS on AWS - Complete Setup Script:
    desc: Kubernetes + Serviço existente no RDS on AWS - Complete Setup Script
    tags: [aws]
    notes:
      - sh: | #shell
          #!/bin/bash
          # ============================================================================
          # SETUP INICIAL - Configure essas variáveis
          # ============================================================================

          # 🔴 CUSTOMIZE COM SEUS DADOS
          export RDS_ENDPOINT="cs-dev.cluster-ro-czcr94cvltso.us-east-1.rds.amazonaws.com"
          export DB_USER="admin"
          export DB_PASSWORD="SuaSenha123!"
          export DB_NAME="postgres"
          export REGION="us-east-1"
          export CLUSTER_NAME="my-cluster"
          export API_IMAGE="seu-registry/users-api:latest"

          # ============================================================================
          # PASSO 1: Validar Conectividade AWS
          # ============================================================================
          # Por que? Confirma que você tem credenciais AWS válidas e pode executar comandos
          # O que esperamos? Seu usuário/role AWS será exibido

          echo "=== PASSO 1: Validar Credenciais AWS ==="
          aws sts get-caller-identity
          # Esperado output:
          # {
          #     "UserId": "AIDAI...",
          #     "Account": "123456789012",
          #     "Arn": "arn:aws:iam::123456789012:user/seu-user"
          # }

          # ============================================================================
          # PASSO 2: Validar que RDS Existe e é Acessível
          # ============================================================================
          # Por que? Confirma que seu banco de dados RDS já existe e está disponível
          # O que esperamos? Informações sobre a instância RDS

          echo "=== PASSO 2: Validar RDS Existente ==="
          aws rds describe-db-instances \
            --region $REGION \
            --query "DBInstances[?Endpoint.Address=='$RDS_ENDPOINT'].[DBInstanceIdentifier,Engine,DBInstanceStatus,Endpoint.Address]" \
            --output table
            --profile consorciei-dev
          # Esperado output:
          # |  DBInstanceIdentifier  |  Engine  |  DBInstanceStatus  |  Endpoint.Address  |
          # |  my-postgres           |  postgres|  available         |  seu-db.c9...     |

          # ============================================================================
          # PASSO 3: Pegar VPC Subnets
          # ============================================================================
          # Por que? Kubernetes precisa saber em quais subnets criar seus recursos
          # O que esperamos? IDs de subnets (pelo menos 2)

          echo "=== PASSO 3: Pegar VPC Subnets ==="
          export SUBNETS=$(aws ec2 describe-subnets \
            --region $REGION \
            --query 'Subnets[0:2].SubnetId' \
            --output text)
          echo "Subnets selecionadas: $SUBNETS"
          # Esperado output:
          # Subnets selecionadas: subnet-12345abc subnet-67890def

          # ============================================================================
          # PASSO 4: Criar IAM Role para EKS Service
          # ============================================================================
          # Por que? EKS precisa de permissões para criar e gerenciar o cluster
          # O que esperamos? ARN da role criada

          echo "=== PASSO 4: Criar EKS Service Role ==="
          TRUST_POLICY='{
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Service": "eks.amazonaws.com"},
              "Action": "sts:AssumeRole"
            }]
          }'

          export EKS_ROLE_ARN=$(aws iam create-role \
            --role-name eks-service-role-$(date +%s) \
            --assume-role-policy-document "$TRUST_POLICY" \
            --region $REGION \
            --query 'Role.Arn' \
            --output text 2>/dev/null || echo "Role pode já existir")

          echo "EKS Service Role: $EKS_ROLE_ARN"
          # Esperado output:
          # EKS Service Role: arn:aws:iam::123456789012:role/eks-service-role-1702345678

          # ============================================================================
          # PASSO 5: Anexar Policy ao EKS Service Role
          # ============================================================================
          # Por que? A role precisa de permissões específicas para gerenciar EKS
          # O que esperamos? Sem erro, a policy foi anexada

          echo "=== PASSO 5: Anexar Policy ao EKS Service Role ==="
          EKS_ROLE_NAME=$(echo $EKS_ROLE_ARN | rev | cut -d'/' -f1 | rev)
          aws iam attach-role-policy \
            --role-name $EKS_ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/AmazonEKSServiceRolePolicy \
            --region $REGION
          echo "✅ Policy anexada"

          # ============================================================================
          # PASSO 6: Criar EKS Cluster
          # ============================================================================
          # Por que? O cluster EKS é a base para rodar Kubernetes na AWS
          # O que é? É um managed Kubernetes - a AWS cuida do control plane
          # O que esperamos? Cluster em estado "CREATING" → "ACTIVE" (leva ~10-15 min)

          echo "=== PASSO 6: Criar EKS Cluster ==="
          aws eks create-cluster \
            --name $CLUSTER_NAME \
            --version 1.28 \
            --role-arn $EKS_ROLE_ARN \
            --resources-vpc-config subnetIds="$SUBNETS" \
            --region $REGION
          echo "⏳ Cluster em criação... aguarde ~15 minutos"

          # ============================================================================
          # PASSO 7: Aguardar Cluster Ficar Ativo
          # ============================================================================
          # Por que? Não podemos criar node groups até o cluster estar pronto
          # O que esperamos? Comando termina quando cluster = ACTIVE

          echo "=== PASSO 7: Aguardar Cluster Ficar Ativo ==="
          aws eks wait cluster-active \
            --name $CLUSTER_NAME \
            --region $REGION
          echo "✅ Cluster ativo!"

          # ============================================================================
          # PASSO 8: Obter Kubeconfig
          # ============================================================================
          # Por que? Kubeconfig permite que kubectl se conecte ao seu cluster
          # O que é? É um arquivo de configuração que autentica você com o cluster
          # O que esperamos? Arquivo ~/.kube/config atualizado

          echo "=== PASSO 8: Obter Kubeconfig ==="
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region $REGION
          echo "✅ Kubeconfig atualizado em ~/.kube/config"

          # ============================================================================
          # PASSO 9: Validar Conectividade com Cluster
          # ============================================================================
          # Por que? Confirma que kubectl consegue se comunicar com o cluster
          # O que esperamos? Lista de nós (ainda vazia porque não criamos node group)

          echo "=== PASSO 9: Validar Conectividade com Cluster ==="
          kubectl get nodes
          # Esperado output:
          # NAME                                       STATUS   ROLES    AGE   VERSION
          # (vazio no começo)

          # ============================================================================
          # PASSO 10: Criar IAM Role para Node Group
          # ============================================================================
          # Por que? Os nodes (máquinas EC2) precisam de permissões para funcionar
          # O que é? Nodes são máquinas EC2 que rodam os containers

          echo "=== PASSO 10: Criar Node IAM Role ==="
          NODE_TRUST_POLICY='{
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Service": "ec2.amazonaws.com"},
              "Action": "sts:AssumeRole"
            }]
          }'

          export NODE_ROLE_ARN=$(aws iam create-role \
            --role-name eks-node-role-$(date +%s) \
            --assume-role-policy-document "$NODE_TRUST_POLICY" \
            --region $REGION \
            --query 'Role.Arn' \
            --output text 2>/dev/null || echo "Role pode já existir")

          echo "Node Role: $NODE_ROLE_ARN"

          # ============================================================================
          # PASSO 11: Anexar Policies ao Node Role
          # ============================================================================
          # Por que? Nodes precisam de permissões específicas para CNI (networking) e worker

          echo "=== PASSO 11: Anexar Policies ao Node Role ==="
          NODE_ROLE_NAME=$(echo $NODE_ROLE_ARN | rev | cut -d'/' -f1 | rev)
          aws iam attach-role-policy \
            --role-name $NODE_ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy \
            --region $REGION

          aws iam attach-role-policy \
            --role-name $NODE_ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy \
            --region $REGION
          echo "✅ Policies anexadas"

          # ============================================================================
          # PASSO 12: Criar Node Group
          # ============================================================================
          # Por que? Node Group são os workers que rodam seus containers
          # O que é? Você especifica: quantos nodes, qual tipo (t3.medium, etc), autoscaling
          # O que esperamos? Node group em estado "CREATING" → "ACTIVE" (leva ~5-10 min)

          echo "=== PASSO 12: Criar Node Group ==="
          aws eks create-nodegroup \
            --cluster-name $CLUSTER_NAME \
            --nodegroup-name "$CLUSTER_NAME-nodes" \
            --node-role $NODE_ROLE_ARN \
            --subnets $SUBNETS \
            --scaling-config minSize=2,maxSize=4,desiredSize=2 \
            --instance-types t3.medium \
            --region $REGION
          echo "⏳ Node Group em criação... aguarde ~10 minutos"

          # ============================================================================
          # PASSO 13: Aguardar Node Group Ficar Ativo
          # ============================================================================
          # Por que? Não podemos fazer deploy até nodes estarem prontos

          echo "=== PASSO 13: Aguardar Node Group Ativo ==="
          aws eks wait nodegroup-active \
            --cluster-name $CLUSTER_NAME \
            --nodegroup-name "$CLUSTER_NAME-nodes" \
            --region $REGION
          echo "✅ Nodes prontos!"

          # ============================================================================
          # PASSO 14: Validar Nodes
          # ============================================================================
          # Por que? Confirma que nodes estão prontos para receber pods
          # O que esperamos? 2 nós em estado "Ready"

          echo "=== PASSO 14: Validar Nodes ==="
          kubectl get nodes
          # Esperado output:
          # NAME                                       STATUS   ROLES    AGE   VERSION
          # ip-172-31-12-34.ec2.internal               Ready    <none>   5m    v1.28.1
          # ip-172-31-12-35.ec2.internal               Ready    <none>   5m    v1.28.1

          # ============================================================================
          # PASSO 15: Pegar Security Group do RDS
          # ============================================================================
          # Por que? Precisamos permitir que os nodes (EC2) se conectem ao RDS
          # O que é? SG = firewall da AWS, controla tráfego de entrada/saída

          echo "=== PASSO 15: Pegar Security Group do RDS ==="
          export RDS_SG=$(aws rds describe-db-instances \
            --region $REGION \
            --query "DBInstances[?Endpoint.Address=='$RDS_ENDPOINT'].VpcSecurityGroups[0].VpcSecurityGroupId" \
            --output text)
          echo "RDS Security Group: $RDS_SG"
          # Esperado output:
          # RDS Security Group: sg-12345abc

          # ============================================================================
          # PASSO 16: Pegar Security Group dos Nodes
          # ============================================================================
          # Por que? Vamos usar isso para liberar acesso ao RDS

          echo "=== PASSO 16: Pegar Security Group dos Nodes ==="
          export NODE_SG=$(aws ec2 describe-security-groups \
            --region $REGION \
            --filters "Name=group-name,Values=eks-cluster-sg-*" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "sg-12345def")
          echo "Node Security Group: $NODE_SG"

          # ============================================================================
          # PASSO 17: Liberar Acesso do Nodes ao RDS (Port 5432)
          # ============================================================================
          # Por que? Sem isso, os containers NÃO conseguem se conectar ao banco RDS
          # O que faz? Permite tráfego TCP na porta 5432 (PostgreSQL)

          echo "=== PASSO 17: Liberar Acesso ao RDS ==="
          aws ec2 authorize-security-group-ingress \
            --group-id $RDS_SG \
            --protocol tcp \
            --port 5432 \
            --source-security-group-id $NODE_SG \
            --region $REGION 2>/dev/null || echo "ℹ️ Rule já existe ou erro menor"
          echo "✅ Security Group rule adicionada"

          # ============================================================================
          # PASSO 18: Criar Namespace no Kubernetes
          # ============================================================================
          # Por que? Namespace isola recursos e facilita gerenciamento
          # O que é? É como um "pasta" no Kubernetes para organizar deployments

          echo "=== PASSO 18: Criar Namespace ==="
          kubectl create namespace api
          # Esperado output:
          # namespace/api created
          # (ou já existe)

          # ============================================================================
          # PASSO 19: Criar Secret com Credenciais RDS
          # ============================================================================
          # Por que? Containers precisam das credenciais para conectar ao RDS
          # O que é? Secret = dados sensíveis criptografados no Kubernetes
          # Vantagem? Credenciais não ficam hardcoded no código

          echo "=== PASSO 19: Criar Secret RDS ==="
          kubectl create secret generic rds-credentials \
            --from-literal=host=$RDS_ENDPOINT \
            --from-literal=user=$DB_USER \
            --from-literal=password=$DB_PASSWORD \
            --from-literal=database=$DB_NAME \
            -n api \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Secret criado"

          # ============================================================================
          # PASSO 20: Validar Secret
          # ============================================================================
          # Por que? Confirma que secret foi criado corretamente

          echo "=== PASSO 20: Validar Secret ==="
          kubectl get secrets -n api
          # Esperado output:
          # NAME               TYPE     DATA   AGE
          # rds-credentials    Opaque   4      10s

          # ============================================================================
          # PASSO 21: Fazer Deploy da API
          # ============================================================================
          # Por que? Fazer o deploy do seu aplicativo no Kubernetes
          # O que é? Deployment = arquivo YAML que define como rodar sua app

          echo "=== PASSO 21: Deploy API ==="

          # kube.yaml file content:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: users-api
            namespace: api
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: users-api
            template:
              metadata:
                labels:
                  app: users-api
              spec:
                containers:
                - name: api
                  image: $API_IMAGE
                  imagePullPolicy: IfNotPresent
                  ports:
                  - containerPort: 3000
                  env:
                  - name: DB_HOST
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: host
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: user
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: password
                  - name: DB_NAME
                    valueFrom:
                      secretKeyRef:
                        name: rds-credentials
                        key: database
                  - name: DB_PORT
                    value: "5432"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: users-api-service
            namespace: api
          spec:
            type: LoadBalancer
            selector:
              app: users-api
            ports:
            - protocol: TCP
              port: 80
              targetPort: 3000

          kubectl apply -f kube.yaml
          echo "✅ Deployment criado"

          # ============================================================================
          # PASSO 22: Validar Deployment
          # ============================================================================
          # Por que? Ver status dos pods, se estão rodando ou falhando
          # O que esperamos? 2 pods em estado "Running"

          echo "=== PASSO 22: Validar Deployment ==="
          kubectl get deployments -n api
          # Esperado output:
          # NAME        READY   UP-TO-DATE   AVAILABLE   AGE
          # users-api   2/2     2            2           30s

          # ============================================================================
          # PASSO 23: Ver Pods
          # ============================================================================
          # Por que? Cada Deployment cria 1+ Pods (instâncias de container)

          echo "=== PASSO 23: Ver Pods ==="
          kubectl get pods -n api
          # Esperado output:
          # NAME                        READY   STATUS    RESTARTS   AGE
          # users-api-5f7d9b6c8-abc12   1/1     Running   0          45s
          # users-api-5f7d9b6c8-def45   1/1     Running   0          45s

          # ============================================================================
          # PASSO 24: Ver Logs de um Pod
          # ============================================================================
          # Por que? Debugar se a app não inicia, erros de conexão com RDS, etc
          # O que faz? Mostra stdout/stderr do container

          echo "=== PASSO 24: Ver Logs ==="
          kubectl logs -n api -l app=users-api --tail=50
          # Esperado output (se conectou ao RDS):
          # 2024-01-15 10:30:45 INFO: Connected to database
          # 2024-01-15 10:30:45 INFO: Server running on port 3000

          # ============================================================================
          # PASSO 25: Aguardar LoadBalancer
          # ============================================================================
          # Por que? LoadBalancer gera uma URL pública para acessar a API
          # O que é? AWS provisiona um ELB (Elastic Load Balancer) automaticamente
          # Pode levar? 2-3 minutos

          echo "=== PASSO 25: Aguardar LoadBalancer URL ==="
          echo "⏳ Aguardando 30 segundos para LoadBalancer provisionar..."
          sleep 30

          # ============================================================================
          # PASSO 26: Obter LoadBalancer URL
          # ============================================================================
          # Por que? Essa é a URL pública onde podemos acessar a API
          # O que é? AWS fornece um hostname (ou IP) para acessar a app

          echo "=== PASSO 26: Obter LoadBalancer URL ==="
          kubectl get svc users-api-service -n api
          # Esperado output:
          # NAME                 TYPE          CLUSTER-IP     EXTERNAL-IP
          # users-api-service    LoadBalancer  10.100.0.123   a12b3c45-123456.elb.us-east-1.amazonaws.com

          export LB_URL=$(kubectl get svc users-api-service -n api \
            --query 'status.loadBalancer.ingress[0].hostname' \
            --output text)

          echo "✅ LoadBalancer URL: $LB_URL"

          # ============================================================================
          # PASSO 27: Teste Básico - Health Check
          # ============================================================================
          # Por que? Confirma que a API está respondendo
          # O que faz? Faz um GET na raiz para ver se está alive

          echo "=== PASSO 27: Health Check ==="
          echo "Testando: curl http://$LB_URL/"
          curl -s http://$LB_URL/ -w "\nStatus: %{http_code}\n"
          # Esperado output:
          # Status: 200
          # (ou conteúdo HTML/JSON dependendo da app)

          # ============================================================================
          # PASSO 28: Teste GET /users - Listar Todos
          # ============================================================================
          # Por que? Validar que API consegue acessar RDS e retornar dados
          # O que faz? GET request para /users que deve queryar a tabela users do RDS

          echo "=== PASSO 28: GET /users (Listar Usuários) ==="
          echo "Testando: curl -X GET http://$LB_URL/users -H 'Content-Type: application/json'"
          curl -X GET "http://$LB_URL/users" \
            -H "Content-Type: application/json" \
            -w "\nStatus: %{http_code}\n" | jq '.' 2>/dev/null || echo "(Resposta pode não ser JSON)"
          # Esperado output (exemplo):
          # [
          #   {"id": 1, "name": "João Silva", "email": "joao@example.com"},
          #   {"id": 2, "name": "Maria Santos", "email": "maria@example.com"}
          # ]
          # Status: 200

          # ============================================================================
          # PASSO 29: Teste GET /users?page=1&limit=10 - Com Paginação
          # ============================================================================
          # Por que? Validar que query parameters funcionam

          echo "=== PASSO 29: GET /users?page=1&limit=10 ==="
          echo "Testando: curl -X GET 'http://$LB_URL/users?page=1&limit=10' ..."
          curl -X GET "http://$LB_URL/users?page=1&limit=10" \
            -H "Content-Type: application/json" \
            -w "\nStatus: %{http_code}\n"

          # ============================================================================
          # PASSO 30: Teste GET /users/{id} - Usuário Específico
          # ============================================================================
          # Por que? Validar acesso a dados específicos

          echo "=== PASSO 30: GET /users/1 (Usuário específico) ==="
          echo "Testando: curl -X GET http://$LB_URL/users/1 ..."
          curl -X GET "http://$LB_URL/users/1" \
            -H "Content-Type: application/json" \
            -w "\nStatus: %{http_code}\n"

          # ============================================================================
          # PASSO 31: Teste POST - Criar Novo Usuário
          # ============================================================================
          # Por que? Validar que a app consegue ESCREVER no RDS

          echo "=== PASSO 31: POST /users (Criar Novo) ==="
          echo "Testando: curl -X POST http://$LB_URL/users ..."
          curl -X POST "http://$LB_URL/users" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Teste User",
              "email": "teste@example.com"
            }' \
            -w "\nStatus: %{http_code}\n"
          # Esperado output:
          # {"id": 3, "name": "Teste User", "email": "teste@example.com"}
          # Status: 201

          # ============================================================================
          # PASSO 32: Verificar Novo Usuário
          # ============================================================================
          # Por que? Confirmar que dado foi persisted no RDS

          echo "=== PASSO 32: Verificar dados salvos ==="
          echo "Testando: curl -X GET http://$LB_URL/users ..."
          curl -X GET "http://$LB_URL/users" \
