  https://k3d.io:
    tags: [coding]
    desc: k3d - Run k3s in Docker - A lightweight wrapper to run k3s (Rancher's minimal Kubernetes distribution) in Docker containers.
    links:
      - https://medium.com/@ddcmaia/k3d-uma-abordagem-simples-de-k8s-acd15cc4c38a
      - https://marketplace.visualstudio.com/items?itemName=inercia.vscode-k3d
    notes:
      - sh: | #shell
          #!/bin/bash

          # Install via homebrew
          brew install k3d

          # Install via flox
          flox install kube3d
      - md: | #markdown
          ## OVERVIEW

          - **To learn:** Kubernetes can feel heavy at first. k3d lowers the entry barrier by wrapping k3s in Docker.
          - **To experiment:** you can quickly create clusters with multiple servers and test different versions.
          - **To simplify IoT/Edge work:** since k3s is optimized for small environments, it even runs on devices like Raspberry Pi.
          - **To save time:** setup is faster than most tutorials you'll read.

          ## HOW IT WORKS

          - k3d runs a full k3s cluster inside Docker containers.
          - After installation, it automatically updates your kubeconfig, so you can use kubectl right away.
      - sh: | #shell
          #!/bin/bas
          ## USAGE
          # Create a cluster with 2 servers
          k3d cluster create test-cluster --servers 2
          # Alternatively, Get the new cluster's connection details merged into your default kubeconfig
          # (usually specified using the KUBECONFIG environment variable or the default path $HOME/.kube/config) and directly switch to the new context
          k3d kubeconfig merge mycluster --kubeconfig-switch-context
          # List clusters and nodes
          k3d cluster list
          # List nodes
          k3d node list
          # Now you can see all resources up and running as if you were on any standard Kubernetes cluster
          kubectl get pods --all-namespaces
