            echo "✅ API respondendo (HTTP $RESPONSE)"
          else
            echo "⚠️ API respondeu com status $RESPONSE"
          fi

          # ============================================================================
          # 3. GET /users - Sem Filtros
          # ============================================================================
          echo ""
          echo "🔧 [3/5] GET /users - Listar todos os usuários..."

          echo ""
          echo "--- Comando ---"
          echo "curl -X GET \"$API_URL/users\" \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  -w '\nStatus: %{http_code}\n'"
          echo ""

          echo "--- Response ---"
          curl -X GET "$API_URL/users" \
            -H 'Content-Type: application/json' \
            -w '\nStatus: %{http_code}\n' 2>/dev/null | jq '.' 2>/dev/null || curl -X GET "$API_URL/users" -H 'Content-Type: application/json' -w '\nStatus: %{http_code}\n'

          # ============================================================================
          # 4. GET /users?page=1&limit=10 - Com Paginação
          # ============================================================================
