          - Useful for screen operations and command buffer helpers.
      - zsh: | #zsh
          # .zshrc

          # Keep current buffer while clearing screen
          clear-keep-buffer() {
            zle clear-screen
          }
          zle -N clear-keep-buffer
          bindkey '^Xl' clear-keep-buffer

          # Copy current command buffer to clipboard
          copy-command-buffer() {
            echo -n $BUFFER | pbcopy
            zle -M "Command buffer copied to clipboard"
          }
          zle -N copy-command-buffer
          bindkey '^Xc' copy-command-buffer
  Using `Hotkey Insertions` to insert predefined command text:
    desc: Insert command templates with key bindings
    tags: [ zsh, zle, shortcuts ]
    links:
      - 10 Zsh hacks I wish I knew about sooner: https://youtu.be/3fVAtaGhUyU
      - gist: https://gist.github.com/elliottminns/09a598082d77f795c88e93f7f73dba61
    notes:
      - md: |
          ## Inserting command boilerplate with key bindings

          - `bindkey -s` injects predefined text into the buffer.
          - Great for repetitive templates with cursor positioning.
      - zsh: | #zsh
          # .zshrc

          # Insert: git commit -m ""
          # \C-b moves cursor one character left (inside quotes)
          bindkey -s '^Xgc' 'git commit -m ""\C-b'

