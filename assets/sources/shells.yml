  Overview of ZLE BUFERS, LBUFFERS, RBUFFERS:
    desc: ZLE buffers and their usage in ZSH
    tags: [ shell ]
    notes:
      - md: |
          ## ZLE BUFFERS

          ### Overview

          > ZLE (Zsh Line Editor) provides several buffers to manipulate the command line content during editing.

          - **BUFFER:** Contains the entire command line content being edited
          - **LBUFFER:** Contains the part of the command line to the left of the cursor
          - **RBUFFER:** Contains the part of the command line to the right of the cursor

          ### PROTIP

          > Remember that after modifying these buffers:

          - `$#BUFFER` gives you the total length
          - `CURSOR` can be set to control cursor position
          - Changes take effect immediately in the active prompt

          ### USAGE

          ```sh
          echo hello world
              ^
              cursor here
          ```

          - **BUFFER:** `echo hello world`
          - **LBUFFER:** `echo hello`
          - **RBUFFER:** ` world`
      - md: |
          ## For creating ZLE widgets, here are some practical examples

          1. **Add quotes around the current word**

              ```sh
              autoload -U select-word-style
              select-word-style bash

              zle-quote-word() {
                  BUFFER="${LBUFFER}\"${WORD}\"${RBUFFER}"
                  CURSOR=$#LBUFFER
              }
              zle -N zle-quote-word
              bindkey '^Xq' zle-quote-word
              ```

          2. **Convert the current word to uppercase**

              ```sh
              autoload -U select-word-style
              select-word-style bash

              zle-uppercase-word() {
                  BUFFER="${LBUFFER}${(U)WORD}${RBUFFER}"
                  CURSOR=$#LBUFFER
              }
              zle -N zle-uppercase-word
              bindkey '^Xu' zle-uppercase-word
              ```

          3. **Insert timestamp at cursor position**

              ```sh
              autoload -U select-word-style
              select-word-style bash

              zle-insert-timestamp() {
                  LBUFFER+="$(date '+%Y-%m-%d %H:%M:%S')"
              }
              zle -N zle-insert-timestamp
              bindkey '^Xt' zle-insert-timestamp
              ```

          4. You can modify BUFFER directly or use LBUFFER/RBUFFER for more precise control:

              ```sh
              # # Fill prompt with a template
              zle-template() {
                  BUFFER="kubectl get pods -n "
                  CURSOR=$#BUFFER  # Move cursor to end
              }
              zle -N zle-template
              bindkey '^Xk' zle-template
              ```
  Case Statement Pattern Matching Guide:
    desc: Comprehensive guide for ZSH case statement pattern matching syntax and best practices
    tags: [ shell, conditional ]
    notes:
      - md: |
          ## Overview

          The ZSH case statement provides powerful pattern matching capabilities for conditional branching in shell scripts.

          ### Key Concepts

          - Pattern Lists: Multiple patterns can be separated by | (pipe)
          - Wildcards: * matches any string, ? matches any character
          - Extended Globs: Additional pattern matching using #, ##, ?, ??, and more
          - Parentheses: Group patterns using ()
          - Termination: Each pattern block must end with ;;

          ### Pattern Matching Operators

          * `*` - Match any string
          * `?` - Match any single character
          * `[...]` - Match any character within brackets
          * `[^...]` - Match any character not in brackets
          * `##` - Match one or more occurrences
          * `#` - Match zero or more occurrences
          * `|` - Separate multiple patterns

          ## Summary

          - Case statements provide structured pattern matching
          - Each case block must end with ;;
          - The *) pattern serves as a catch-all default
          - Extended glob patterns offer regex-like functionality
          - Case-insensitive matching using ${var:l} modifier
          - Multiple patterns can be combined using |
          - Pattern blocks can contain multiple commands
    links:
      - http://zsh.sourceforge.net/Doc/Release/Conditional-Expressions.html
      - http://zsh.sourceforge.net/Doc/Release/Pattern-Matching.html
  Scripting conditionals:
    desc: Shell script conditionals
    tags: [ shell, conditional ]
    notes:
      - sh: |
          #!/bin/bash

          # if file exists
          if [ -e /path/to/file ]; then
            echo "File exists."
          fi

          # if file does not exist
          if [ ! -e /path/to/file ]; then
            echo "File does not exist."
          fi

          # if file is a regular file
          if [ -f /path/to/file ]; then
            echo "File is a regular file."
          fi

          # if directory exists
          if [ -d /path/to/dir ]; then
            echo "Directory exists."
          fi

          # if file is readable
          if [ -r /path/to/file ]; then
            echo "File is readable."
          fi

          # if file is writable
          if [ -w /path/to/file ]; then
            echo "File is writable."
          fi

          # if file is executable
          if [ -x /path/to/file ]; then
            echo "File is executable."
          fi

          # if file is not empty
          if [ -s /path/to/file ]; then
            echo "File is not empty."
          fi

          # if string is not empty
          if [ -n "$string" ]; then
            echo "String is not empty."
          fi

          # if string is empty
          if [ -z "$string" ]; then
            echo "String is empty."
          fi

          # if strings are equal
          if [ "$string1" = "$string2" ]; then
            echo "Strings are equal."
          fi

          # if strings are not equal
          if [ "$string1" != "$string2" ]; then
            echo "Strings are not equal."
          fi

          # if numbers are equal
          if [ "$num1" -eq "$num2" ]; then
            echo "Numbers are equal."
          fi

          # if numbers are not equal
          if [ "$num1" -ne "$num2" ]; then
            echo "Numbers are not equal."
          fi

          # if first number is greater
          if [ "$num1" -gt "$num2" ]; then
            echo "First number is greater."
          fi

          # if first number is greater or equal
          if [ "$num1" -ge "$num2" ]; then
            echo "First number is greater or equal."
          fi

          # if first number is less
          if [ "$num1" -lt "$num2" ]; then
            echo "First number is less."
          fi

          # if first number is less or equal
          if [ "$num1" -le "$num2" ]; then
            echo "First number is less or equal."
          fi
