cheats:
  zle accept-and-hold:
    desc: Executes the current command but keeps it in the prompt
    tags: [ zsh, zle ]
    notes: |
      # Widget that runs 'git status' but keeps it in prompt
      git-status-and-hold() {
        BUFFER="git status"
        zle accept-and-hold
      }
      zle -N git-status-and-hold
      bindkey '^Gs' git-status-and-hold
  zle accept-and-infer-next-history:
    desc: Executes command and shows next logical history entry
    tags: [ zsh, zle ]
    notes: |
      # Widget that adds files and suggests commit
      git-add-and-commit() {
        BUFFER="git add ."
        zle accept-and-infer-next-history
      }
      zle -N git-add-and-commit
      bindkey '^Ga' git-add-and-commit
  zle accept-and-menu-complete:
    desc: Accepts current completion and shows menu for next completion
    tags: [ zsh, zle ]
    notes: |
      # Widget for nested directory completion
      deep-complete() {
        BUFFER="cd "
        zle accept-and-menu-complete
      }
      zle -N deep-complete
      bindkey '^Gd' deep-complete
  zle accept-line:
    desc: Basic Enter key behavior - executes the current line
    tags: [ zsh, zle ]
    notes: |
      # Widget that adds timestamp before executing
      timestamp-and-execute() {
        BUFFER="# $(date '+%H:%M:%S') | $BUFFER"
        zle accept-line
      }
      zle -N timestamp-and-execute
      bindkey '^Xt' timestamp-and-execute
  zle accept-line-and-down-history:
    desc: Executes command and moves to next history entry
    tags: [ zsh, zle ]
    notes: |
      # Widget that runs command and shows next related command
      run-and-next() {
        BUFFER="$BUFFER"
        zle accept-line-and-down-history
      }
      zle -N run-and-next
      bindkey '^Xn' run-and-next
  zle accept-search:
    desc: Accepts current history search result
    tags: [ zsh, zle ]
    notes: |
      # Widget that searches and accepts git commands
      search-git-commands() {
        BUFFER="git "
        zle history-incremental-search-backward
        zle accept-search
      }
      zle -N search-git-commands
      bindkey '^Gh' search-git-commands
  zle zle-line-init:
    desc: Called when starting a new command line
    tags: [ zsh, zle ]
    notes: |
      # Widget that sets up custom prompt on line init
      zle-line-init() {
        PROMPT="%F{blue}%~%f > "
        zle reset-prompt
      }
      zle -N zle-line-init
  zle zle-line-finish:
    desc: Called after executing a command line
    tags: [ zsh, zle ]
    notes: |
      # Widget that logs completed commands
      zle-line-finish() {
        echo "$BUFFER" >> ~/.zsh_command_log
      }
      zle -N zle-line-finish
  zle zle-line-pre-redraw:
    desc: Called before redrawing command line
    tags: [ zsh, zle ]
    notes: |
      # Widget that updates prompt with git info
      zle-line-pre-redraw() {
        RPROMPT="$(git branch 2>/dev/null | grep '*' | sed 's/* //')"
        zle reset-prompt
      }
      zle -N zle-line-pre-redraw
  zle execute-last-named-cmd:
    desc: Executes the last command run with execute-named-cmd
    tags: [ zsh, zle ]
    notes: |
      # Widget that repeats last git command
      repeat-git-cmd() {
        BUFFER="git "
        zle execute-last-named-cmd
      }
      zle -N repeat-git-cmd
      bindkey '^Gr' repeat-git-cmd
  zle execute-named-cmd:
    desc: Prompts for and executes a command by name
    tags: [ zsh, zle ]
    notes: |
      # Widget that runs git commands by name
      git-named-cmd() {
        BUFFER="git-"
        zle execute-named-cmd
      }
      zle -N git-named-cmd
      bindkey '^Gx' git-named-cmd
  zle expand-cmd-path:
    desc: Expands command to full path
    tags: [ zsh, zle ]
    notes: |
      # Widget that expands python command path
      expand-python-cmd() {
        BUFFER="python"
        zle expand-cmd-path
      }
      zle -N expand-python-cmd
      bindkey '^Xp' expand-python-cmd
  zle expand-history:
    desc: Expands history references
    tags: [ zsh, zle ]
    notes: |
      # Widget that expands last git command
      expand-last-git() {
        BUFFER="!git"
        zle expand-history
      }
      zle -N expand-last-git
      bindkey '^Ge' expand-last-git
  zle expand-or-complete:
    desc: Standard tab completion
    tags: [ zsh, zle ]
    notes: |
      # Widget that starts directory completion
      start-dir-complete() {
        BUFFER="cd "
        zle expand-or-complete
      }
      zle -N start-dir-complete
      bindkey '^Xd' start-dir-complete
  zle read-command:
    desc: Reads a command name for execution
    tags: [ zsh, zle ]
    notes: |
      # Widget that reads and executes git commands
      read-git-command() {
        BUFFER="git-"
        zle read-command
      }
      zle -N read-git-command
      bindkey '^Xg' read-git-command
  zle redisplay:
    desc: Redraws the command line
    tags: [ zsh, zle ]
    notes: |
      # Widget that cleans and redraws prompt
      clean-and-redraw() {
        clear
        zle redisplay
      }
      zle -N clean-and-redraw
      bindkey '^Xl' clean-and-redraw
  zle redo:
    desc: Redoes the last undone edit
    tags: [ zsh, zle ]
    notes: |
      # Widget that combines undo and redo
      smart-redo() {
        if [[ $LASTWIDGET == "undo" ]]; then
          zle redo
        else
          zle undo
        fi
      }
      zle -N smart-redo
      bindkey '^Xr' smart-redo
  zle reset-prompt:
    desc: Forces prompt redraw
    tags: [ zsh, zle ]
    notes: |
      # Widget that updates git status in prompt
      update-git-prompt() {
        RPROMPT="$(git status -s)"
        zle reset-prompt
      }
      zle -N update-git-prompt
      bindkey '^Xu' update-git-prompt
  zle reverse-menu-complete:
    desc: Like tab completion but backwards
    tags: [ zsh, zle ]
    notes: |
      # Widget that cycles completions backwards
      cycle-back-complete() {
        BUFFER="$BUFFER"
        zle reverse-menu-complete
      }
      zle -N cycle-back-complete
      bindkey '^X^H' cycle-back-complete
  zle scroll-and-clear-screen:
    desc: Clears screen and scrolls current line to top
    tags: [ zsh, zle ]
    notes: |
      # Widget that clears screen and adds timestamp
      clear-with-timestamp() {
        zle scroll-and-clear-screen
        BUFFER="# $(date '+%H:%M:%S') | $BUFFER"
      }
      zle -N clear-with-timestamp
      bindkey '^X^L' clear-with-timestamp
  zle complete-word:
    desc: Complete word at cursor position
    tags: [ zsh, zle, completion ]
    notes: |
      # Complete git branch names when typing git checkout
      git-branch-complete() {
        if [[ $BUFFER == "git checkout "* ]]; then
          zle complete-word
        else
          BUFFER="git checkout "
          CURSOR=$#BUFFER
          zle complete-word
        fi
      }
      zle -N git-branch-complete
      bindkey '^Gb' git-branch-complete
  zle expand-or-complete-prefix:
    desc: Like expand-or-complete but only for prefix
    tags: [ zsh, zle, completion ]
    notes: |
      # Autocomplete only npm run script prefixes
      npm-script-complete() {
        if [[ $BUFFER == "npm run "* ]]; then
          zle expand-or-complete-prefix
        else
          BUFFER="npm run "
          CURSOR=$#BUFFER
          zle expand-or-complete-prefix
        fi
      }
      zle -N npm-script-complete
      bindkey '^Xn' npm-script-complete
  zle list-choices:
    desc: List possible completions
    tags: [ zsh, zle ]
    notes: |
      # List available docker containers
      docker-container-list() {
        if [[ $BUFFER == "docker exec "* ]]; then
          zle list-choices
        else
          BUFFER="docker exec "
          CURSOR=$#BUFFER
          zle list-choices
        fi
      }
      zle -N docker-container-list
      bindkey '^Xd' docker-container-list
  zle menu-complete:
    desc: Complete word from menu
    tags: [ zsh, zle ]
    notes: |
      # Interactive cd navigation
      cd-menu-complete() {
        if [[ $BUFFER == "cd "* ]]; then
          zle menu-complete
        else
          BUFFER="cd "
          CURSOR=$#BUFFER
          zle menu-complete
        fi
      }
      zle -N cd-menu-complete
      bindkey '^Xc' cd-menu-complete
  zle menu-expand-or-complete:
    desc: Show menu of completions
    tags: [ zsh, zle ]
    notes: |
      # Show kill command completions with process list
      kill-menu-complete() {
        if [[ $BUFFER == "kill "* ]]; then
          zle menu-expand-or-complete
        else
          BUFFER="kill "
          CURSOR=$#BUFFER
          zle menu-expand-or-complete
        fi
      }
      zle -N kill-menu-complete
      bindkey '^Xk' kill-menu-complete
  zle end-of-list:
    desc: End menu selection
    tags: [ zsh, zle ]
    notes: |
      # Exit completion menu and append semicolon
      complete-and-semicolon() {
        zle end-of-list
        BUFFER="$BUFFER;"
        CURSOR=$#BUFFER
      }
      zle -N complete-and-semicolon
      bindkey '^X;' complete-and-semicolon
  zle send-break:
    desc: Exit menu selection
    tags: [ zsh, zle, completion ]
    notes: |
      # Cancel completion and clear line
      cancel-and-clear() {
        zle send-break
        BUFFER=""
        CURSOR=0
      }
      zle -N cancel-and-clear
      bindkey '^Xx' cancel-and-clear
  zle recursive-edit:
    desc: Allows creating a new editing context within current one, useful for complex inputs
    tags: [ zsh, zle ]
    notes:
      - md: |
          ```sh
          # Widget that prompts for git commit message with template
          git-commit-with-template() {
            # Save original buffer
            local original_buffer=$BUFFER

            # Start new editing context with template
            BUFFER="# Commit type: feat|fix|docs|style|refactor|test|chore
            #
            # Write commit message below:
            "
            # Move cursor to end
            CURSOR=$#BUFFER

            # Enter recursive editing mode
            zle recursive-edit

            # If user didn't cancel (Ctrl-C)
            if [[ $? -eq 0 ]]; then
              # Get commit message, remove comments
              local commit_msg=$(echo $BUFFER | grep -v '^#')

              # Restore original buffer and append git commit command
              BUFFER="git commit -m \"${commit_msg}\""

              # Execute the command
              zle accept-line
            else
              # If cancelled, restore original buffer
              BUFFER=$original_buffer
              zle reset-prompt
            fi
          }
          zle -N git-commit-with-template
          bindkey '^Xg' git-commit-with-template
          ```

          ## USAGE

          When pressing ^Xg:

           1. Opens template:
              # Commit type: feat|fix|docs|style|refactor|test|chore
              #
              # Write commit message below:

           2. User types:
              feat: add new user authentication

           3. User presses Enter (or Ctrl-C to cancel)

           4. Command becomes:
              git commit -m "feat: add new user authentication"

           5. Command executes automatically

          ### NOTES

            - **BUFFER:** Content of edit buffer
            - **CURSOR:** Cursor position
            - **recursive-edit return:** 0 for success, 1 for cancel
  Options Overview:
    desc: Set options with `setopt`, unset with `unsetopt`.
    tags: [ shell, zsh ]
    notes:
      - md: |
          ## Zsh Options

          - Set options with `setopt`, unset with `unsetopt`.
          - Options can take a `NO_` prefix as well (eg: `setopt NO_BEEP` is the same as `unsetopt BEEP`).
          - You can view set options via the `set -o` command.
          - You can see only enabled options with `set -o | grep 'on$'`.
          - Asterisk (\*) indicates the option is on by default for native zsh.
    links:
      - ZSH Options [16.2.1] Changing-Directories: https://zsh.sourceforge.io/Doc/Release/Options.html#Changing-Directories
      - ZSH Options [16.2.2] Completion-4: https://zsh.sourceforge.io/Doc/Release/Options.html#Completion-4
      - ZSH Options [16.2.3] Expansion-and-Globbing: https://zsh.sourceforge.io/Doc/Release/Options.html#Expansion-and-Globbing
      - ZSH Options [16.2.4] History: https://zsh.sourceforge.io/Doc/Release/Options.html#History
      - ZSH Options [16.2.5] Initialisation: https://zsh.sourceforge.io/Doc/Release/Options.html#Initialisation
  Changing Directories Options:
    desc: 16.2.1 Changing Directories
    tags: [ shell, zsh, option ]
    links:
      - ZSH Options [16.2.1] Changing-Directories: https://zsh.sourceforge.io/Doc/Release/Options.html#Changing-Directories
    notes:
      - md: |
          ## CHANGING DIRECTORIES

          | Option            | Short Description                           |
          |-------------------|---------------------------------------------|
          | AUTO_CD           | If a command is dir name, `cd` to it        |
          | AUTO_PUSHD        | `cd` pushes to directory stack              |
          | CDABLE_VARS       | `cd var` works if `$var` is directory       |
          | CD_SILENT         | Don't print the dir after `cd`              |
          | CHASE_DOTS        | Resolve symlinks when `..` in `cd`          |
          | CHASE_LINKS       | Resolve symlinks in `cd`                    |
          | POSIX_CD          | Change behavior of `cd`, `chdir`, & `pushd` |
          | PUSHD_IGNORE_DUPS | Don`t push duplicate dirs onto stack        |
          | PUSHD_MINUS       | Reverse meanings of `-` and `+` in `pushd`  |
          | PUSHD_SILENT      | Don't print the dir stack after `pushd`     |
          | PUSHD_TO_HOME     | `pushd` with no argument goes to `~`        |
  Completion Options:
    desc: 16.2.2 Completion
    tags: [ shell, zsh, option ]
    links:
      - ZSH Options [16.2.2] Completion: https://zsh.sourceforge.io/Doc/Release/Options.html#Completion-4
    notes:
      - md: |
          ## COMPLETION

          | Option               | Short Description                  |
          |----------------------|------------------------------------|
          | ALWAYS_LAST_PROMPT\* | Completion lists after prompt      |
          | ALWAYS_TO_END        | On completion go to end of word    |
          | AUTO_LIST\*          | List ambiguous completions         |
          | AUTO_MENU\*          | Menu complete after two tabs       |
          | AUTO_NAME_DIRS       | Variables always can be %~ abbrevs |
          | AUTO_PARAM_KEYS\*    | Magic completion for parameters    |
          | AUTO_PARAM_SLASH\*   | `$dirname` completes with `/`      |
          | AUTO_REMOVE_SLASH\*  | Trailing `/` in completion removed |
          | BASH_AUTO_LIST       | List completions on second tab     |
          | COMPLETE_ALIASES     | Completion uses unexpanded aliases |
          | COMPLETE_IN_WORD     | Completion works inside words      |
          | GLOB_COMPLETE        | Patterns are active in completion  |
          | HASH_LIST_ALL\*      | Store all on first completion      |
          | LIST_AMBIGUOUS\*     | List completions when ambiguous    |
          | LIST_BEEP\*          | Beep on ambiguous completion       |
          | LIST_PACKED          | More compact completion lists      |
          | LIST_ROWS_FIRST      | List completions across            |
          | LIST_TYPES\*         | File types listed in completion    |
          | MENU_COMPLETE        | Cycle through ambiguous matches    |
          | REC_EXACT            | Exact completion matches are used  |

          ### AUTO_PARAM_KEYS

          Controls the automatic handling of key parameters in command-line editing.

          Here's how it works:

          ```sh
          # First, you need to enable it
          setopt AUTO_PARAM_KEYS

          # Basic behavior examples:
          dict[ke<TAB>   # If 'key' exists, completes to dict[key]
          array[2<TAB>   # Completes array index

          # With nested structures
          nested[outer][inn<TAB>  # Completes nested[outer][inner]

          # Real-world examples:
          declare -A fruits
          fruits[apple]="red"
          fruits[banana]="yellow"

          # When you type:
          echo $fruits[a<TAB>     # Completes to $fruits[apple]
          ```

          #### Key behaviors:

          - It automatically adds the closing bracket ] when you press TAB
          - It works with both associative arrays and regular arrays
          - It helps complete parameter names inside brackets
          - It understands nested parameter references

          ### ALWAYS_LAST_PROMPT

          Controls how the shell handles the display of prompts when using history navigation or completions.
          Here's how it works:

          ```sh
          # You can enable/disable it with:
          setopt ALWAYS_LAST_PROMPT   # Enable
          unsetopt ALWAYS_LAST_PROMPT # Disable
          ```

          #### Key behaviors:

          1. With `ALWAYS_LAST_PROMPT` set:

          ```sh
          $ long_command with many parameters<CURSOR_HERE>
          # Press Up-Arrow for history
          # The current line remains visible below the history entry

          # with completions the cursor stays on original line
          $ git checkout feat/<TAB>
          feature/add-login      feature/fix-bug
          feature/update-docs    feature/new-api
          ```

          2. Without ALWAYS_LAST_PROMPT:

          ```sh
          $ long_command with many parameters<CURSOR_HERE>
          # Press Up-Arrow for history
          # The current line is replaced by the history entry

          # with completions the cursor moves to the completion list
          $ git checkout feat/<TAB>
          feature/add-login      feature/fix-bug
          feature/update-docs    feature/new-api
          ```
  Expansion and Globbing Options:
    desc: 16.2.3 Expansion and Globbing
    tags: [ shell, zsh, option ]
    links:
      - ZSH Options [16.2.3] Expansion-and-Globbing: https://zsh.sourceforge.io/Doc/Release/Options.html#Expansion-and-Globbing
    notes:
      - md: |
          ## EXPANSION AND GLOBBING

          | Option              | Short Description                              |
          |---------------------|------------------------------------------------|
          | BAD_PATTERN\*       | Errors on pattern syntax; else literal         |
          | BARE_GLOB_QUAL\*    | Glob qualifiers with bare parens               |
          | BRACE_CCL           | `X{ab}` expands to `Xa` `Xb`                   |
          | CASE_GLOB\*         | Make globbing case-sensitive                   |
          | CASE_MATCH          | Make regex case-sensitive                      |
          | CASE_PATHS          | Make paths case-sensitive                      |
          | CSH_NULL_GLOB       | One glob must succeed, failed globs ignored    |
          | EQUALS\*            | Expand `=cmd` to `/path/to/cmd`                |
          | EXTENDED_GLOB       | Expand globbing syntax                         |
          | FORCE_FLOAT         | Treat numbers as floats when doing arithmetic  |
          | GLOB\*              | Enable globbing                                |
          | GLOB_ASSIGN         | `var=*` expands, assigns array                 |
          | GLOB_DOTS           | Patterns may match leading dots                |
          | GLOB_STAR_SHORT     | Allow `**`,`***` shorthand for `**/*`,`***/*`  |
          | GLOB_SUBST          | Substituted characters may glob                |
          | HIST_SUBST_PATTERN  | History modifiers match by pattern, not string |
          | IGNORE_BRACES       | Don`t use `{a,b}` expansions                   |
          | IGNORE_CLOSE_BRACES | Do not perform brace expansion                 |
          | KSH_GLOB            | Globbing matches KornShell                     |
          | MAGIC_EQUAL_SUBST   | Special expansion after all `=`                |
          | MARK_DIRS           | Append `/` to globbed directories              |
          | MULTIBYTE           | Respect multibyte characters in strings        |
          | NOMATCH\*           | Error if glob fails to match                   |
          | NULL_GLOB           | Failed globs are removed from line             |
          | NUMERIC_GLOB_SORT   | Numbers in globs sorted numerically            |
          | RC_EXPAND_PARAM     | `X$array` gives `Xelt1` `Xelt2` etc.           |
          | REMATCH_PCRE        | Use Perl-compatible regex syntax for `=~`      |
          | SH_GLOB             | Disables non-extended zsh globs                |
          | UNSET\*             | Unset variables OK, treat as empty             |
          | WARN_CREATE_GLOBAL  | Warn when a function makes a global var        |
          | WARN_NESTED_VAR     | Warn when a nested function var violates scope |
  History Options:
    desc: 16.2.4 History
    tags: [ shell, zsh, option ]
    links:
      - ZSH Options [16.2.4] History: https://zsh.sourceforge.io/Doc/Release/Options.html#History
    notes:
      - md: |
          ## HISTORY

          | Option                  | Short Description                                |
          |-------------------------|--------------------------------------------------|
          | APPEND_HISTORY\*        | History appends to existing file                 |
