  Using `chpwd` hook to execute commands whenever you change directories:
    desc: Run automatic actions on directory change
    tags: [ zsh, hooks, automation ]
    links:
      - 10 Zsh hacks I wish I knew about sooner: https://youtu.be/3fVAtaGhUyU
      - gist: https://gist.github.com/elliottminns/09a598082d77f795c88e93f7f73dba61
    notes:
      - md: |
          ## Using `chpwd` for directory-aware automation

          - Triggers custom logic each time you `cd` into a different directory.
          - Useful for tasks like listing files, activating Python venvs, and loading Node versions.
      - zsh: | #zsh
          # .zshrc

          # Run a command whenever directory changes
          chpwd() {
            ls
          }

          # Auto activate/deactivate Python virtual environments
          chpwd() {
            if [[ -d .venv ]]; then
              source .venv/bin/activate
            elif [[ -d venv ]]; then
              source venv/bin/activate
            elif [[ -n "$VIRTUAL_ENV" ]]; then
              deactivate
            fi
          }

          # Use nvm when .nvmrc exists
          chpwd() {
            if [[ -f .nvmrc ]]; then
              nvm use
            fi
          }
      - zsh: | #zsh
          # Prefer one composed chpwd
          chpwd() {
            hook_python
            hook_nix
            ls
          }

          # Or register multiple hooks
          autoload -Uz add-zsh-hook
          add-zsh-hook chpwd hook_python
          add-zsh-hook chpwd hook_nix
