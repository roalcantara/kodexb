commmands:
  brew install --cask google-chrome@beta:
    desc: Beta version. updated weekly. Good balance between stability and new features. Ideal for Devs testing upcoming release
    links: [https://google.com/chrome/beta, https://developer.chrome.com, https://chromium.org/chromium-projects]
    tags: [browser]
    notes:
      - md: | #markdown
          #### Google Chrome Main Differences

          | **CHANNEL**                               | **UPDATES**   | **STABILITY**   | **AUDIENCE**                    |
          | ----------------------------------------- | ------------- | --------------- | ------------------------------  |
          | brew install --cask google-chrome         | ~4 weeks      | ✅ Most stable  | End-users, general dev          |
          | brew install --cask google-chrome@beta    | Weekly        | ⚖️ Quite stable | Devs testing upcoming release   |
          | brew install --cask google-chrome@dev     | 1-2x/week     | ❗ Can be buggy | Web/platform developers         |
          | brew install --cask google-chrome@canary  | Nightly       | 🚨 Least stable | Early adopters, feature testers |

  brew install --cask google-chrome@dev:
    desc: Dev version. Updated roughly once or twice a week. Less stable, may contain bugs. Designed for developers who want to test upcoming changes early. Ideal for Web/platform developers.
    links: [https://google.com/chrome/dev, https://developer.chrome.com, https://chromium.org/chromium-projects]
    tags: [browser]
    notes:
      - md: | #markdown
          #### Google Chrome Main Differences

          | **CHANNEL**                               | **UPDATES**    | **STABILITY**   | **AUDIENCE**                    |
          | ----------------------------------------- | -------------- | --------------- | ------------------------------  |
          | brew install --cask google-chrome         | ~4 weeks       | ✅ Most stable  | End-users, general dev          |
          | brew install --cask google-chrome@beta    | Weekly         | ⚖️ Quite stable | Devs testing upcoming release   |
          | brew install --cask google-chrome@dev     | 1-2x/week      | ❗ Can be buggy | Web/platform developers         |
          | brew install --cask google-chrome@canary  | Nightly        | 🚨 Least stable | Early adopters, feature testers |

  brew install --cask google-chrome@canary:
    desc: Canary version. Updated nightly. Less stable. Very experimental - may be unstable or break unexpectedly. Usually installed side-by-side with stable Chrome. Ideal for Early adopters, feature testers.
    links: [https://google.com/chrome/canary, https://developer.chrome.com, https://chromium.org/chromium-projects]
    tags: [browser]
    notes:
      - md: | #markdown
          #### Google Chrome Main Differences

          | **CHANNEL**                               | **UPDATES**      | **STABILITY**   | **AUDIENCE**                    |
          | ----------------------------------------- | ---------------- | --------------- | ------------------------------  |
          | brew install --cask google-chrome         | ~4 weeks         | ✅ Most stable  | End-users, general dev          |
          | brew install --cask google-chrome@beta    | Weekly           | ⚖️ Quite stable | Devs testing upcoming release   |
          | brew install --cask google-chrome@dev     | 1-2x/week        | ❗ Can be buggy | Web/platform developers         |
          | brew install --cask google-chrome@canary  | Nightly          | 🚨 Least stable | Early adopters, feature testers |
