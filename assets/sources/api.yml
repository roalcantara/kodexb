cheats:
  Common Architecture Styles | API:
    desc: Architecture styles define how different components of an application programming interface (API) interact with one another
    tags: [ api ]
    links:
      - API Architecture Styles: https://bytebytego.com
    notes:
      - md: | #markdown
          ### Common API Architecture Styles

          > Architecture styles define how different components of an application programming interface (API) interact with one another.
          > As a result, they ensure efficiency, reliability, and ease of integration with other systems by providing a standard approach to designing and building APIs

          ![API architecture styles](https://media.licdn.com/dms/image/D4E22AQGzTBIey-eSSw/feedshare-shrink_1280/0/1717049951626?e=1720656000&v=beta&t=igyJM0-tr_kfpkUKUfRdk7BZNLMwqX-H8lEv52SQQhI "The most used styles")

          ### SOAP
          - Mature, comprehensive, XML-based
          - Best for enterprise applications

          ### RESTful
          - Popular, easy-to-implement, HTTP methods
          - Ideal for web services

          ### GraphQL
          - Query language, request specific data
          - Reduces network overhead, faster responses

          ### gRPC
          - Modern, high-performance, Protocol Buffers
          - Suitable for microservices architectures

          ### WebSocket
          - Real-time, bidirectional, persistent connections
          - Perfect for low-latency data exchange

          ### Webhook
          - Event-driven, HTTP callbacks, asynchronous
          - Notifies systems when events occur
  # JWT Authentication
  What is the JSON Object Signing and Encryption (JOSE)? | JWT:
    desc: JSON Object Signing and Encryption (JOSE) is a framework that provides a method to sign and encrypt JSON data. It is used to secure the data in JSON format.
    tags: [ jwt ]
    notes:
      - md: | #markdown
          ## JSON Object Signing and Encryption (JOSE)

          JSON Object Signing and Encryption (JOSE) is a framework that provides a method to sign and encrypt JSON data. It is used to secure the data in JSON format.

          JOSE consists of the following specifications:

          - **JSON Web Token (JWT):** A method for representing claims securely between two parties.
          - **JSON Web Signature (JWS):** A method for signing JSON data. (A assinatura to Token)
          - **JSON Web Encryption (JWE):** A method for encrypting JSON data. (A criptografia do Token)
          - **JSON Web Key (JWK):** A method for representing cryptographic keys in JSON format. (A chave do Token)
          - **JSON Web Key Set (JWKS):** A method for representing a set of JWKs in JSON format. (O conjunto de chaves do Token)
          - **JSON Web Algorithms (JWA):** A method for defining cryptographic algorithms and identifiers. (Os algoritmos para a assinatura do Token)

          JOSE is widely used in the industry to secure data in JSON format.

          JOSE is an open standard that is maintained by the Internet Engineering Task Force (IETF).
          It is widely used in the industry to secure data in JSON format.
  How does JWT Auth really work? | JWT:
    desc: JWTs are compact, URL-safe tokens used to securely transmit claims between parties, often for authentication and authorization.
    tags: [ auth ]
    notes:
      - md: | #markdown
          # How does JWT Authentication Works?

          JWTs are compact, URL-safe tokens used to securely transmit claims between parties, often for authentication and authorization.

          ## What is Authentication?

          - **Purpose**: Verify a user's identity through a login process.
          - **Goal**: Ensure the user is who they claim to be for access control.

          ## What is Authorization?

          - **Purpose**: Grant a user permission to access specific resources or functions.
          - **Goal**: Improve security by limiting access to resources.

          ## What is JWT (JSON Web Tokens)?

          > Open, industry-standard (RFC 7519) method for securely representing claims between two parties.
          > JWTs consist of 3 parts: `Header.Payload.Signature` like `xxxxx.yyyyy.zzzzz`

          ### 1. Header

          Contains two parts: the token type (JWT) and the signing algorithm (e.g., HMAC SHA256 or RSA).

          ```json
          {
            "alg": "HS256",
            "typ": "JWT"
          }
          ```

          ### 2. Payload

          Contains claims about an entity (user) and additional data. Claims are classified into three types:

          - **Registered Claims**: Recommended claims providing useful information.

            - Examples: `iat` (issued at), `iss` (issuer), `exp` (expiration time), `sub` (subject), `aud` (audience).

          - **Public Claims**: Custom claims defined by users, avoiding collisions by registering with [IANA JSON Web Token Registry](https://iana.org/assignments/jwt/jwt.xhtml) or using a URI.

          - **Private Claims**: Custom claims shared between parties.

          ```json
          {
            "iss": "https://myapp.com",
            "sub": "1234567890",
            "name": "John Doe",
            "admin": true
          }
          ```

          ### 3. Signature

          Verifies the token's integrity and authenticity. Created using the encoded header, encoded payload, a secret/private key, and the algorithm specified in the header.

          For HMAC SHA256:

          ```plaintext
          HMACSHA256(
            base64UrlEncode(header) + "." + base64UrlEncode(payload),
            secret
          )
          ```

          ### EXAMPLE

          The result is three Base64-URL strings separated by dots, easily passed in HTML and HTTP environments

          ```plaintext
          eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.
          eyJzdWIiOiIxMjMONTY30DkwIiwibmFtZSI6IkpvaG4
          gRG91IiwiaXNTb2NpYWwiOnRydWV9.
          4pcPyMD09o1PSyXnrXCjTwXyr4BsezdI1AVTmud2fU4
          ```

          ## Authentication Flows

          ### Session-Based Authentication

          1. User logs in with credentials.
          2. Server verifies credentials and creates a session.
          3. Server sends a session ID to the client.
          4. Client stores session ID in a cookie.
          5. Client sends the cookie with each request.
          6. Server verifies session ID and grants access.

          **Key Points**:

          - Server looks up the session for each request.
          - Stateful: Server tracks sessions.
          - Easy to invalidate by deleting the session.
          - Vulnerable to CSRF attacks.

          ### (JWT - JSON Web Token) Token-Based Authentication

          1. User logs in with credentials.
          2. Server validates credentials and creates a token (SECRET/PRIVATE KEY).
          3. Server sends the token to the client.
          4. Client stores the token (localStorage, sessionStorage, etc.).
          5. Client sends the token with each request.
          6. Server verifies the token (SECRET/PRIVATE KEY) to grants access.

          **Key Points**:

          - Stateless: No need to track sessions.
          - Harder to invalidate without a blacklist.
          - Data is public and can be read/decoded by anyone.
          - Vulnerable to XSS attacks.

          ### JWT Refresh Tokens

          1. User logs in with credentials.
          2. Server validates credentials and creates a JWT and a refresh token.
          3. Server sends both tokens to the client.
          4. Client stores the JWT and refresh token.
          5. Client sends the JWT with each request.
          6. Server verifies the JWT and grants access.
          7. If JWT expires, client sends refresh token.
          8. Server verifies refresh token and issues a new JWT (and refresh token if using rotation).

          **Key Points**:

          - Refresh Tokens help avoid re-authentication.
          - Secure refresh tokens with short expiration, rotation, blacklisting, and whitelisting.

          ### JWT Best Practices

          - Keep tokens small (< 10KB).
          - Do not store sensitive data in the token.
          - Use short expiration times (15 mins to 1 hour) and refresh tokens.
          - Always set and check `iss`, `aud`, `exp`, `sub`, `nbf`, `iat`, `jti`, `alg`, `kid`, `typ`, `cty`, `crit`, `x5t`, `x5u`, `x5c`, `x5t#S256` claims.
          - Use HTTPS.
          - Do not use JWT for session management.
          - Validate tokens properly.

          ## SUMMARY

          By following these guidelines and understanding the mechanisms, you can effectively use JWTs for secure and efficient authentication.
  Common Web Applications Authentication Flows | JWT:
    desc: Session-Based Authentication, Token-Based Authentication, JWT Authentication, and JWT Refresh Tokens are common authentication flows used to secure web applications.
    tags: [ auth, security ]
    notes:
      - md: | #markdown
          ### JWT Best Practices

          - Use HTTPS.
          - Validate tokens properly.
          - Keep tokens small (< 10KB).
          - Do not store sensitive data in the token.
          - Use short expiration times (15 mins to 1 hour) and use Refresh Tokens.
          - Always set and check `iss`, `aud`, `exp`, `sub`, `nbf`, `iat`, `jti`, `alg`, `kid`, `typ`, `cty`, `crit`, `x5t`, `x5u`, `x5c`, `x5t#S256` claims.
          - Do not use JWT for session management.

          #### SUMMARY

          By following these guidelines and understanding the mechanisms, you can effectively use JWTs for secure and efficient authentication.
      - md: | #markdown
          ### Session-Based Authentication (STATEFUL / Common)

          1. User logs in with credentials.
          2. Server verifies credentials and creates a session (usually in a DB).
          3. Server sends a session ID to the client.
          4. Client stores session ID in a cookie.
          5. Client sends the cookie with each request.
          6. Server verifies session ID (in the DB) to grants access.

          #### Key Points

          - Server looks up the session for each request in the DB.
          - STATEFUL: Server tracks sessions.
          - Easy to invalidate by deleting the session.
          - Vulnerable to CSRF attacks.
      - md: | #markdown
          ### (JWT - JSON Web Token) Token-Based Authentication (STATELESS / Modern)

          1. User logs in with credentials.
          2. Server validates credentials and creates a token (SECRET/PRIVATE KEY).
          3. Server sends the token to the client.
          4. Client stores the token (localStorage, sessionStorage, etc.).
          5. Client sends the token with each request.
          6. Server verifies the token (SECRET/PRIVATE KEY) to grants access.

          #### Key Points

          - STATELESS: No need to track sessions.
          - Harder to invalidate without a blacklist.
          - Data is public and can be read/decoded by anyone.
          - Vulnerable to XSS attacks.
      - md: | #markdown
          ### JWT Refresh Tokens (STATELESS / Modern)

          1. User logs in with credentials.
          2. Server validates credentials and creates a JWT and a refresh token.
          3. Server sends both tokens to the client.
          4. Client stores the JWT and refresh token.
          5. Client sends the JWT with each request.
          6. Server verifies the JWT and grants access.
          7. If JWT expires, client sends refresh token.
          8. Server verifies refresh token and issues a new JWT (and refresh token if using rotation).

          #### Key Points

          - Refresh tokens help avoid re-authentication.
          - Secure refresh tokens with short expiration, rotation, blacklisting, and whitelisting.
