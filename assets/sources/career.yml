cheats:
  Google Professional Cloud Architect:
    desc: Professional Cloud Architects enable organizations to leverage Google Cloud technologies. With a thorough understanding of cloud architecture and Google Cloud, they design, develop, and manage robust, secure, scalable, highly available, and dynamic solutions to drive business objectives.
    tags: [career, cloud, architect]
    notes:
      - md: | #markdown
          ### The Professional Cloud Architect certification exam assesses your ability to:

          - Design and plan a cloud solution architecture
          - Manage and provision the cloud solution infrastructure
          - Design for security and compliance
          - Analyze and optimize technical and business processes
          - Manage implementations of cloud architecture
          - Ensure solution and operations reliability
      - md: | #markdown
          ### About this certification exam

          - **Length:** 2 hours
          - **Registration fee:** $200 (plus tax where applicable)
          - **Languages:** English, Japanese
          - **Exam format:** 50-60 multiple choice and multiple select questions
          - **Case studies:** Each exam includes 2 case studies that describe fictitious business and solution concepts. Case study questions make up 20-30% of the exam and assess your ability to apply your knowledge to a realistic business situation. You can view the case studies on a split screen during the exam. See the Exam Guide for the 4 available case studies.

          #### Exam delivery method:

          - a. Take the online-proctored exam from a remote location
          - b. Take the onsite-proctored exam at a testing center

          - Prerequisites: None

          #### Recommended experience

          3+ years of industry experience including 1+ years designing and managing solutions using Google Cloud

          #### Certification Renewal / Recertification

          Candidates must recertify in order to maintain their certification status. Unless explicitly stated in the detailed exam descriptions, all Google Cloud certifications are valid for two years from the date of certification. Recertification is accomplished by retaking the exam during the recertification eligibility time period and achieving a passing score. You may attempt recertification starting 60 days prior to your certification expiration date.
      - md: | #markdown
          ### Exam Guide

          - [Professional Cloud Architect Exam Guide](https://cloud.google.com/certification/guides/cloud-architect/)
  Cloud Architect Learning Path:
    desc: | #markdown
      This learning path is designed to help you prepare for the Google Professional Cloud Architect exam. Even if you don't plan to take the exam, these courses and hands-on labs will help you get started on your way to becoming a cloud architect.
    tags: [career, cloud, architect]
    notes:
      - md: | #markdown
          A Cloud Architect designs, develops, and manages robust, secure, scalable, and dynamic solutions (16 activities)

          A Cloud Architect designs, develops, and manages robust, secure, scalable, and dynamic solutions.
          This learning path guides you through a curated collection of on-demand courses, labs, and skill badges that provide you with real-world, hands-on experience using Google Cloud technologies essential to the Cloud Architect role.
          Once you complete the path, check out the Google Cloud Professional Cloud Architect certification to take the next steps in your professional journey.

          ### Learning Path

          1. [A Tour of Google Cloud Hands-on Labs](https://www.cloudskillsboost.google/focuses/2794?parent=catalog&path=12)
          2. [Preparing for your Professional Cloud Architect Journey](https://www.cloudskillsboost.google/paths/12/course_templates/78)
          3. [Google Cloud Fundamentals: Core Infrastructure](https://www.cloudskillsboost.google/paths/12/course_templates/60)
          4. [Essential Google Cloud Infrastructure: Foundation](https://www.cloudskillsboost.google/paths/12/course_templates/50)
          5. [Essential Google Cloud Infrastructure: Core Services](https://www.cloudskillsboost.google/paths/12/course_templates/49)
          6. [Elastic Google Cloud Infrastructure: Scaling and Automation](https://www.cloudskillsboost.google/paths/12/course_templates/178)
          7. [Reliable Google Cloud Infrastructure: Design and Process](https://www.cloudskillsboost.google/paths/12/course_templates/41)
          8. [Getting Started with Google Kubernetes Engine](https://www.cloudskillsboost.google/paths/12/course_templates/2)
          9. [Logging and Monitoring in Google Cloud](https://www.cloudskillsboost.google/paths/12/course_templates/99)
          10. [Implement Load Balancing on Compute Engine](https://www.cloudskillsboost.google/paths/12/course_templates/648)
          11. [Set Up an App Dev Environment on Google Cloud](https://www.cloudskillsboost.google/paths/12/course_templates/637)
          12. [Develop your Google Cloud Network](https://www.cloudskillsboost.google/paths/12/course_templates/625)
          13. [Build Infrastructure with Terraform on Google Cloud](https://www.cloudskillsboost.google/paths/12/course_templates/636)
          14. [Set Up a Google Cloud Network](https://www.cloudskillsboost.google/paths/12/course_templates/641)
          15. [Optimize Costs for Google Kubernetes Engine](https://www.cloudskillsboost.google/paths/12/course_templates/655)
          16. [Cloud Architecture: Design, Implement, and Manage](https://www.cloudskillsboost.google/paths/12/course_templates/640)
