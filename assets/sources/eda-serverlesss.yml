            D -->|M1, M3| E[Receiver]

            A -->|M2, M3| F[Green channel]
            F -->|M2, M3| G[Receiver]

            A -->|M1| H[Purple channel]
            H -->|M1| I[Receiver]
      - md: |
          > In this diagram, the sender sends multiple messages (M1, M2, M3) to different channels (Pink, Blue, Green, and Purple).
          > Each channel forwards the messages to its respective receiver, with some channels handling multiple messages and others handling a single message.
