  https://openapis.org:
    desc: Primarily designed for RESTful APIs. It is well-suited for request-response interactions where a client sends an HTTP request and receives a response. This makes it ideal for synchronous, stateless services such as typical web APIs.
    tags: [api]
    notes: "## Communication Style\n\n  Focuses on synchronous communication (client-server model).\n  It defines endpoints (paths) and methods (GET, POST, etc.), where the client initiates requests and the server responds.\n\n## Core Concepts\n\n  Centers around paths, operations, and responses.\n\n  •\t**Paths:** Define available endpoints.\n  •\t**Operations:** Specify HTTP methods and their respective responses and parameters.\n  •\t**Components:** Includes schemas, security, and other reusable elements.\n\n## Schemas and Messages\n\n  Uses schemas within the components section for defining request and response bodies, query parameters, headers, and more.\n  It specifies HTTP status codes and response schemas.\n\n## Protocols Supported\n\n  Primarily supports HTTP/HTTPS\n\n## Specification Elements\n\n  Paths and operations: Define API endpoints and HTTP methods.\n\n  •\t**Responses:** Specify expected HTTP responses for each operation.\n  •\t**Security:** Define authentication and authorization schemes (OAuth, API keys, etc.).\n\nDocumenting Patterns and Workflow\n\n  Primarily documents API operations and endpoints, with limited support for event-driven workflows.\n"
  https://asyncapi.com:
    desc: Designed for event-driven and asynchronous APIs, such as message-driven architectures using protocols like MQTT, AMQP, WebSockets, or AWS SQS. It is tailored for asynchronous communication where services exchange messages without a direct request-response pattern.
    tags: [serverles, aws, eda]
    notes: "## Communication Style\n\nFocuses on asynchronous communication, supporting pub/sub, message queues, and event streaming.\nIt defines channels where messages are published or subscribed to, facilitating patterns like broadcasting or queue-based processing.\n\n## Core Concepts\n\n> Centers around channels, messages, and operations (publish/subscribe).\n\n•\t**Channels:** Represent the topics or queues for message exchanges.\n•\t**Messages:** Define the data payload structure exchanged through channels.\n•\t**Servers:** Define connections for multiple protocols and environments (e.g., MQTT broker or WebSocket server).\n\n## Schemas and Messages\n\n  Uses messages as a primary unit, where each message has a payload that describes the content structure.\n  It also uses components to define reusable schemas and message definitions but focuses on asynchronous payload content rather than HTTP responses.\n\n## Protocols Supported\n\n  Supports multiple asynchronous protocols like AMQP, MQTT, WebSocket, Kafka, HTTP (for long polling), and even cloud-specific options like AWS SQS and Azure Service Bus.\n\n## Specification Elements\n\n  > Represent communication topics or queues.\n\n  •\t**Servers:** Describe the connection details (host, port, protocol).\n  •\t**Messages:** Define the payload structure for messages exchanged over channels.\n  •\t**Security:** Supports a wider range of security schemes relevant to message brokers and other protocols.\n\n## Documenting Patterns and Workflow\n\n  Directly supports event-driven workflows, allowing documentation of pub/sub mechanisms and complex message flows between services in distributed systems.\n"
