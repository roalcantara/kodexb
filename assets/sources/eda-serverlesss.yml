  What is an Event?:
    desc: An event is a significant change in state that occurs in a system or application.
    tags: [eda, definition]
    links: [https://en.wikipedia.org/wiki/Event_(computing)]
    notes:
      - md: |
          ## What is an Event?

          > A significant change in state that occurs in a system or application.
          > Events can be triggered by user actions, system processes, or external factors, and they are used to signal that something important has happened.

          ### Properties

          - **Events are signals that a system's state has changed:** They are used to notify other parts of the system that something has happened.
          - **Events occur in the past (e.g., ChannelCreated):** They represent something that has already happened and are used to trigger actions in response.
          - **Events cannot be changed (immutable):** Once an event has occurred, it cannot be altered or undone.
          - **Decrease coupling by restricting information to key data:** Events should contain only the necessary information to trigger the desired action.

          ### Key Concepts of Events

          - **Asynchronous:** Events are typically asynchronous, meaning they can happen at any time and don't require immediate processing.
          - **State Change:** Events represent a change in state, such as a user clicking a button, a file being uploaded, or a system error occurring.
          - **Notification:** Events are used to notify other parts of the system that something has happened, allowing them to react accordingly.
          - **Payload:** Events can carry additional information, known as a payload, that provides context about the event.

          ### Examples of Events

          - **User Interaction:** Clicking a button, submitting a form, or scrolling a page can trigger events in a web application.
          - **System Events:** A file being created, a database record being updated, or a server error occurring can trigger events in a backend system.
          - **External Events:** Weather data changing, stock prices fluctuating, or social media posts being published can trigger events in an external system.

          Events are a fundamental concept in event-driven architecture, where systems are designed to respond to events and communicate through event streams.
      - jsonc: |
          // Example of an Event
          {
            "source": "com.flix",
            "detail-type": "ChannelCreated",
            "detail": {
              "metadata": {
                "¡dempotency-key": "837uy4erje"
              },
              "data": {
                "channel-id": "983u4ejrhewio9039oi4kerj",
                "created-at": "2021-11-2616:05:09-04:00",
                "name": "noPineappleOnPizza",
