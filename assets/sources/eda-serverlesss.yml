    desc: Captures and processes changes in data (such as inserts, updates, and deletes) in real-time from a source system to ensure that downstream systems remain synchronized.
    tags: [eda, structural, pattern]
    links: [https://youtu.be/KXR17uwLEC8, https://refactoring.guru/design-patterns/adapter]
    notes:
      - md: | #markdown
          ## What Problem Does CDC Solve?

          In modern systems, data often lives in different places.
          Keeping all this data up-to-date and consistent can be a big challenge, especially when you need changes to happen in real-time.
          Traditional methods, like running batch jobs to sync everything, are slow and can lead to problems if data changes frequently.

          This is where Change Data Capture (CDC) comes in.
          CDC tracks changes in a database as they happen and sends those changes to other systems.
          This means everyone always has the latest information, without having to wait for a batch job to run.

          A structural design pattern that allows objects with incompatible interfaces to collaborate.

          ### Key Concepts of CDC

          #### CDC Producer (Source)

          This is the part of the system that keeps an eye on the database for any changes.
          When something changes-like a new record being added, updated, or deleted-the CDC Producer captures that change and turns it into an event.

          What It Does: Watches the database and creates events for any changes.
          Examples: AWS Database Migration Service (DMS), Apache Debezium.

          #### CDC Consumers (Sinks)

          These are the systems that listen for the CDC events.
          When they get an event, they do something with it-like update their own database, trigger a workflow, or process the data in some way.

          What They Do: React to the events by updating data, starting processes, etc. They can also move events from producer to other consumers.
          Examples: Data warehouses like Redshift, microservices that need consistent data, real-time analytics systems, message brokers (Kafka, Amazon SNS/SQS, RabbitMQ...)

          ### Where CDC is Used

          In event-driven systems, you want things to happen automatically in response to data changes.
          CDC makes this easy by turning database changes into events that can trigger actions elsewhere.
          For example, when inventory levels change, CDC can trigger a reorder or notify other systems to take action.

          CDC also helps with keeping your data consistent across your microservices.
          In a setup where different services handle different parts of your data, keeping everything consistent can be tricky.
          CDC helps by making sure that when one service updates its data, all other related services get that update immediately.
          For example, if a customer updates their profile, CDC ensures that the order service and any other relevant services are instantly aware of that change.
      - md: | #markdown
          ## Example

          Let's say you're tracking inventory updates. Here's a simplified way to describe how CDC would work using AsyncAPI:

          ### Producer (Source)

          ```yaml
          asyncapi: '3.0.0'
          info:
            title: Inventory Management CDC API
            version: '1.0.0'
            description: 'API for handling CDC events related to inventory updates.'

          servers:
            production:
              host: broker.example.com:9092
              protocol: kafka
              description: 'Kafka broker for production'

          channels:
            InventoryCdcUpdates:
              address: inventory.cdc.updates
              messages:
                InventoryUpdateEvent:
                  $ref: '#/components/messages/InventoryUpdateEvent'
              description: 'Channel for inventory update events'

          operations:
            receiveInventoryUpdates:
              action: receive
              channel:
                $ref: '#/channels/InventoryCdcUpdates'
              messages:
                - $ref: '#/channels/InventoryCdcUpdates/messages/InventoryUpdateEvent'

          components:
            messages:
              InventoryUpdateEvent:
                name: InventoryUpdateEvent
                title: 'Inventory Update Event'
                summary: 'Represents an inventory update in the system'
                contentType: application/json
                payload:
                  type: object
                  properties:
                    eventType:
                      type: string
                      enum:
                        - INSERT
                        - UPDATE
                        - DELETE
                    entity:
                      type: string
                      example: 'Inventory'
                    state:
                      type: object
                      description: 'The state of the inventory item after the change'
                      properties:
                        productId:
                          type: string
                          description: 'Unique identifier for the product'
                        stockLevel:
                          type: integer
                          description: 'Current stock level after the update'
                        lastModified:
                          type: string
                          format: date-time
                          description: 'Timestamp when the inventory was last modified'
          ```
  Syncronous request-response model:
    desc: A design pattern that allows objects with incompatible interfaces to collaborate.
    tags: [eda, structural]
    links: [https://youtu.be/KXR17uwLEC8]
    notes:
      - md: |
          ## Syncronous request-response model

          > Allows objects with incompatible interfaces to collaborate.

          ## Advantages

          - **Low Latency:** CDC can capture changes in real-time, so you always have the latest data.
          - **Simple:** CDC is easy to set up and use, especially compared to traditional batch jobs.
          - **Fail Fast:** If something goes wrong, you know about it right away, so you can fix it quickly.

          ## Disadvantages

          - **Receiver Failure:** If the CDC Producer can't send events to the CDC Consumer, you can lose data.
          - **Receiver throttling:** If the CDC Consumer can't keep up with the events, it can fall behind and miss updates.
      - mermaid: |
          graph LR
            A[Sender] -->|Request| B[Receiver]
            B -->|Response| A
      - md: |
          This replicates the flow where the sender initiates a request and the receiver sends a response back to the sender.
  Ascyronous point-to-point model (queue):
    desc: A design pattern that allows objects with incompatible interfaces to collaborate.
    tags: [eda, structural]
    links: [https://youtu.be/KXR17uwLEC8]
    notes:
      - md: |
          ## Ascyronous point-to-point model (queue)

          > Allows objects with incompatible interfaces to collaborate.

          ## Advantages

          - **Decreases _temporal coupling_:** The sender and receiver don't need to be online at the same time.
          - **Resilient to receiver failure:** If the receiver goes down, the messages can be stored in the queue until it comes back up.
          - **Receiver controls consumption rate:** The receiver can process messages at its own pace, so it won't get overwhelmed.
          - **Dead-letter queue:** If a message can't be processed, it can be moved to a dead-letter queue for later inspection.
          - **Only one receiver gets the message:** In a point-to-point model, only one receiver gets the message, which can be useful for load balancing or ensuring that a message is only processed once.

          ## Disadvantages

          - **Response correlation:** It can be challenging to correlate responses with requests in a point-to-point model.
          - **Backlog recovery time:** If the receiver falls behind, it can take time to catch up on the backlog.
          - **Fairness in multi-tenant systems:** In a multi-tenant system, it can be challenging to ensure that each tenant gets a fair share of the messages.
      - mermaid: |
          graph LR
              A[Sender] -->|M1, M2| B[Queue]
              B -->|M1, M2| C[Receiver]
              C -->|Ack| B
              B -->|Ack| A
      - md: |
          - This represents a message queuing system where the sender sends messages (M1, M2) to a queue,
          - the receiver retrieves the messages, and acknowledgments (Ack) are exchanged between the components.
      - mermaid: |
          graph LR
              A[Sender] -->|M1, M2| B[Queue]
              B -->|M1, M2| C[Receiver]
              C -->|Ack| B
              B -->|Ack| A
              C -->|M1| D[DLQ]
      - md: |
          - This represents a message queuing system where the sender sends messages (M1, M2) to a queue.
          - If M1 fails or is not processed, it is sent to the Dead Letter Queue (DLQ), while acknowledgments (Ack) are exchanged between the components.
      - mermaid: |
          graph LR
              A[Sender] -->|M1, M2| B[Queue]
              B -->|M1| C[Receiver1]
              C -->|Ack| B
              B -->|M2| D[Receiver2]
              D -->|Ack| B
              B -->|Ack| A
      - md: |
          - This diagram shows a message queuing system where messages M1 and M2 are sent from the sender to the queue.
          - The queue distributes M1 to one receiver (Receiver1) and M2 to another receiver (Receiver2).
          - Acknowledgments (Ack) are sent from both receivers back to the queue, and from the queue back to the sender.
  Amazon SQS:
    desc: A fully managed message queuing service that makes it easy to decouple and scale microservices, distributed systems, and serverless applications.
    tags: [messaging, queue, aws]
    links: [https://aws.amazon.com/sqs]
    notes:
      - md: |
          ## Amazon SQS (Simple Queue Service)

          > A fully managed message queuing service that makes it easy to decouple and scale microservices, distributed systems, and serverless applications.

          ### Key Features

          - **Fully Managed:** SQS handles all the infrastructure management, so you don't have to worry about provisioning, scaling, or monitoring.
          - **Durable and Scalable:** Messages are stored redundantly across multiple availability zones, making SQS highly available and durable.
          - **Simple:** SQS provides a simple API for sending, receiving, and deleting messages, making it easy to integrate with your applications.
          - **DLQ (Dead Letter Queue) support:** SQS allows you to configure a DLQ to capture messages that can't be processed successfully.
          - **Standard and FIFO options:** SQS offers both standard and FIFO (First-In-First-Out) queues to support different messaging patterns.

          ### Use Cases

          - **Decoupling Microservices:** SQS allows you to decouple the components of your microservices architecture, making it easier to scale and maintain.
          - **Asynchronous Processing:** SQS enables asynchronous communication between different parts of your application, improving performance and reliability.
          - **Batch Processing:** SQS supports batch operations, allowing you to process multiple messages in a single request.
          - **Serverless Applications:** SQS integrates seamlessly with AWS Lambda, enabling you to build serverless applications that scale automatically.

          ### Example

          Here's an example of how you might use SQS in a microservices architecture:

          1. A user submits an order on your e-commerce website.
          2. The front-end service sends a message to an SQS queue containing the order details.
          3. A back-end service reads the message from the queue, processes the order, and updates the database.
          4. Once the order is processed, the back-end service sends a confirmation message to another SQS queue.
          5. A notification service reads the confirmation message and sends an email to the user.

          This architecture allows each component to operate independently, improving fault tolerance and scalability.
  Ascyronous broadcast model (topic):
    desc: A design pattern that allows objects with incompatible interfaces to collaborate.
    tags: [eda, structural, aws]
    links: [https://youtu.be/KXR17uwLEC8]
    notes:
      - md: |
          ## Ascyronous broadcast model (topic)

          > Allows objects with incompatible interfaces to collaborate.

          ## Advantages

          - **Decreases _temporal coupling_:** Subscribers can receive messages at their own pace.
          - **Resilient to receiver failure:** If a subscriber goes down, it won't affect other subscribers.
          - **Subscriber controls notification:** Subscribers can choose which messages they want to receive.
          - **Each subscriber is notified:** In a publish-subscribe model, each subscriber gets a copy of the message, which can be useful for broadcasting information.
          - **Multiple protocols:** Topics can support multiple protocols, such as HTTP, AMQP, MQTT, etc.

          ## Disadvantages

          - **Complexity:** Managing multiple subscribers and topics can add complexity to the system.
          - **Message filtering:** Subscribers may need to filter messages to receive only the ones they are interested in.
          - **Message ordering:** Ensuring message ordering across multiple subscribers can be challenging.
      - mermaid: |
          graph LR
              A[Sender] -->|M1, M2| B[Topic]
              B -->|M1, M2| C[Subscriber1]
              B -->|M1, M2| D[Subscriber2]
              B -->|M1, M2| E[Subscriber3]
              A -->|Ack| A
      - md: |
          - This represents a publish-subscribe pattern where the sender sends messages M1 and M2 to a topic.
          - The topic distributes these messages to multiple subscribers (Subscriber1, Subscriber2, Subscriber3).
          - The sender receives an acknowledgment (Ack) once the messages are published to the topic.
      - mermaid: |
          graph LR
              A[Sender] --> B[Topic]
              B --> C[Email]
              B --> D[SMS]
              B --> E[HTTP]
              B --> F[Lambda]
      - md: |
          - This represents a publish-subscribe pattern where a sender sends messages to a topic,
          - And the topic distributes these messages to various endpoints,
          - Including Email, SMS, HTTP, and Lambda.
  Amazon SNS:
    desc: A fully managed pub/sub messaging service that makes it easy to decouple and scale microservices, distributed systems, and serverless applications.
    tags: [pubsub, aws]
    links: [https://aws.amazon.com/sns]
    notes:
      - md: |
          ## Amazon SNS (Simple Notification Service)

          > A fully managed pub/sub messaging service that makes it easy to decouple and scale microservices, distributed systems, and serverless applications.

          ### Key Features

          - **Fully managed pub/sub service for A2A and A2P messaging:** SNS allows you to send messages to a large number of subscribers using a variety of protocols.
          - **Standard topics support a nearly unlimited number of messages per second:**  SNS can handle high-throughput messaging scenarios.
          - **Each topic supports up to 12.5 million subscriptions:** Each topic can support a large number of subscribers, making it easy to scale.
          - **FIFO topics:** When strict ordering is required

          ### Use Cases

          - **Event Notifications:** SNS can be used to send event notifications to subscribers, such as new order alerts, system health checks, or application status updates.
          - **Fanout Messaging:** SNS enables fanout messaging, where a single message can be sent to multiple subscribers simultaneously.
          - **Mobile Push Notifications:** SNS supports mobile push notifications, allowing you to send messages to iOS, Android, and other mobile devices.
          - **Application Integration:** SNS can be used to integrate different parts of your application, such as triggering Lambda functions, sending emails, or updating databases.

          ### Example

          Here's an example of how you might use SNS in a serverless application:

          1. An event occurs in your application, such as a new user signing up.
          2. Your application publishes a message to an SNS topic containing the user details.
          3. Subscribers to the topic, such as a Lambda function, an email service, and a database update service, receive the message.
          4. The Lambda function processes the user details, sends a welcome email, and updates the database.
          5. The email service sends a confirmation email to the user.
  Ascyronous point-to-point model (router):
    desc: A design pattern that allows objects with incompatible interfaces to collaborate.
    tags: [eda, structural]
    links: [https://youtu.be/KXR17uwLEC8]
    notes:
      - md: |
          ## Ascyronous point-to-point model (router)

          > Allows objects with incompatible interfaces to collaborate.

          ## DISADVANTAGES

          - **Increases location coupling:** The sender needs to know the location of the receiver.
          - **Sender maintains routing logic:** The sender needs to know how to route messages to the correct receiver.
          - **Sender complexity increases with time:** As more receivers are added, the sender's logic can become more complex.
