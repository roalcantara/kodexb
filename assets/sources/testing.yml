  https://specmatic.io:
    desc: Specmatic | Contract Testing and Service Virtualization made easy
    tags: [bdd, api]
    links: [https://specmatic.io/docs/getting-started/overview]
    notes:
      - md: | #markdown
          ### OVERVIEW

          - An open-source tool for contract testing that uses Gherkin syntax (the same language as Cucumber/BDD frameworks) to define API contracts.
          - It bridges the gap between business-readable specs and automated testing.

          #### KEY FEATURES

          **Gherkin-based contracts:**

            - Write contracts in plain English using Given-When-Then syntax, which makes them readable to non-technical stakeholders:

              ```gherkin
              Scenario: Get user by ID
                Given a user exists with id 123
                When I GET /users/123
                Then the response status is 200
                And the response body has a user with name "John"
              ```

          **Provider and Consumer testing:**

            - Like Pact, it tests both sides—providers ensure they implement the contract, consumers verify they use it correctly.

          **OpenAPI support:**

            - Can work with OpenAPI specs in addition to Gherkin, giving flexibility in how you define contracts.

          **Multiple protocols:**

            - Supports HTTP/REST APIs, not limited to one approach.

          **Language agnostic:**

            - Works across different tech stacks.

          **Advantages over Pact:**

            - Gherkin syntax is more human-readable and business-friendly
            - No need to learn a specific DSL (like Pact's JSON format)
            - Can bridge technical and non-technical stakeholders
            - Simpler learning curve if your team already uses Cucumber/BDD

          **Disadvantages:**

            - Smaller community and ecosystem than Pact
            - Less mature tooling
            - Fewer integrations and extensions
            - Less battle-tested in large-scale production systems

          **Best for:**

            - Teams already using BDD/Cucumber
            - Organizations where business stakeholders need to understand/validate contracts alongside engineers.
