  https://share.google/aimode/HkXPmxEQxI8AVwu0c:
    desc: Consumer-Driven Contract Testing | CDC
    tags: [cdc, testing, api]
    links: [https://pact.io]
    notes:
      - md: | #markdown
          ### Consumer-Driven Contract Testing (CDC)

          - Consumers (clients) define contracts that specify what they expect from providers (services).
          - Tests verify both sides honor the contract, preventing integration failures.

          **Usage:**
            - Instead of providers defining APIs unilaterally, consumers explicitly state their requirements.
            - These contracts become the source of truth for testing both consumer and provider in isolation.

          **Key use cases:**
            - Microservices that need independent deployment without breaking each other
            - Teams working on different services that need confidence in integrations
            - Catching breaking changes early before they reach production
            - Enabling parallel development across teams

          **Best for:**
            - Systems with multiple independent consumers of the same service
            - Organizations practicing continuous deployment
            - Preventing the "integration testing nightmare" where you discover incompatibilities late
            - Teams wanting fast feedback on API compatibility without spinning up full integration environments

          **Main benefit:**
            - Catches breaking changes at development time, not production time.
            - Consumers and providers can deploy independently without coordination overhead or downtime.

          **Popular tool:**
            - **Pact** - the de facto standard for CDC, available for multiple languages.

          **Trade-off:**

            - Requires discipline and maintenance of contracts
            - Adds some development overhead upfront
            - But saves significant pain later.
  https://share.google/aimode/LdtqmwARZ4Xh6xUct:
    desc: Kafka Schema Registry
    tags: [cdc, testing, api]
    notes:
      - md: | #markdown
          ### OVERVIEW

          - Centralized repository for managing data schemas (like Avro, JSON Schema, Protobuf) used with Apache Kafka
          - Acting as a data contract between loosely coupled producers and consumers to ensure data quality, consistency, and compatibility as schemas evolve.
          - Producers register schemas, get unique IDs, serialize data with the schema, and send the ID + data to Kafka;
          - Consumers use the ID from Kafka to fetch the correct schema from the Registry to deserialize the message, preventing downstream applications from breaking due to unexpected data changes.

          #### Key Functions

          - **Centralized Schema Management:**

            Stores and manages data blueprints (schemas) in one place.

          - **Data Contract Enforcement:**

            Ensures producers and consumers agree on data structure.

          - **Schema Evolution:**

            Supports rules (backward, forward, full compatibility) to manage schema changes without breaking existing applications.

          - **Serialization/Deserialization:**

            Producers serialize data using the schema, and consumers deserialize using the schema ID from the registry.

          - **Data Governance:**

            Provides visibility, lineage, and auditability for data formats.

          #### HOW IT WORKS

          1. **Producer:** Before sending data, the producer checks with the Schema Registry to register or retrieve the schema's unique ID.
          2. **Serialization:** The producer serializes the message data (e.g., to Avro binary) and prepends the Schema ID.
          3. **Kafka:** The ID and serialized data are sent to the Kafka topic.
          4. **Consumer:** The consumer reads the message, extracts the Schema ID, and requests the corresponding schema from the Registry to deserialize the data.

          #### BENEFITS

          - **Decoupling:** Allows producers and consumers to evolve independently.
          - **Robustness:** Prevents consumers from failing due to unexpected data format changes.
          - **Scalability:** Centralizes schema logic, improving overall data pipeline efficiency.
