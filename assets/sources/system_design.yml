cheats:
  10 examples of complex system designs in the market, including use cases and the real companies that utilize them:
    desc: These systems exemplify the complexity and scale of system design solutions used by major companies to efficiently and reliably manage their operations and services
    tags: [architecture, system_design, use_case]
    notes:
      - md: "## 1.\tNetflix Microservices Architecture\n  •\tUse Case: Video streaming.\n  •\tCompany: Netflix.\n  •\tDetails:\n    - Netflix uses a microservices architecture to manage the scalability and availability of its streaming service.\n    - Each functionality, such as movie recommendations, user management, and video streaming, is a separate service that communicates via APIs.\n\n## PayPal Payment System:\n  •\tUse Case: Online payment processing.\n  •\tCompany: PayPal.\n  •\tDetails:\n    - PayPal uses a microservices-based architecture to securely process billions of transactions every day.\n    - The system handles various payment methods, different currencies, and international regulations.\n\n## Facebook Advertising Platform\n  •\tUse Case: Targeted advertising.\n  •\tCompany: Meta (Facebook).\n  •\tDetails:\n    - Facebook`s advertising platform uses machine learning to personalize ads for billions of users.\n    - It processes vast amounts of data in real time to deliver the most relevant ads.\n\n## Amazon Recommendation System\n  •\tUse Case: Product recommendation.\n  •\tCompany: Amazon.\n  •\tDetails:\n    - Amazon utilizes a recommendation system that analyzes user purchase and browsing behavior to suggest relevant products.\n    - This involves large volumes of data and complex machine learning algorithms.\n\n## Google Cloud Infrastructure\n  •\tUse Case: Cloud computing and scalable services.\n  •\tCompany: Google.\n  •\tDetails:\n    - Google Cloud offers a wide range of cloud computing, storage, and data analysis services.\n    - The architecture is highly distributed and scalable, supporting mission-critical applications worldwide.\n\n## Walmart Supply Chain Management System\n  •\tUse Case: Inventory and logistics management.\n  •\tCompany: Walmart.\n  •\tDetails:\n    - Walmart uses a sophisticated supply chain management system to monitor and optimize inventory across thousands of stores globally.\n    - The system integrates sales, logistics, and inventory data in real time.\n\n## Airbnb Hosting Platform\n  •\tUse Case: Accommodation marketplace.\n  •\tCompany: Airbnb.\n  •\tDetails:\n    - Airbnb uses a microservices architecture to manage bookings, payments, reviews, and communication between hosts and guests.\n    - The system must be highly available and secure to support global transactions.\n\n## New York Stock Exchange (NYSE) Transaction System\n  •\tUse Case: Financial transaction processing.\n  •\tCompany: NYSE.\n  •\tDetails:\n    - The NYSE uses high-performance, low-latency systems to process millions of financial transactions in fractions of a second.\n    - Reliability and security are crucial to maintaining market integrity.\n\n## Zoom Video Conferencing Platform\n  •\tUse Case: Communication and video conferencing.\n  •\tCompany: Zoom.\n  •\tDetails:\n    - Zoom uses a distributed infrastructure to support high-definition video conferences with thousands of participants simultaneously.\n    - The system needs to ensure low latency and high availability.\n\n## FedEx Logistics System\n  •\tUse Case: Delivery and logistics management.\n  •\tCompany: FedEx.\n  •\tDetails:\n    - FedEx operates a complex logistics system that integrates package tracking, delivery routing, and fleet management.\n    - The system must be highly efficient to ensure fast and accurate deliveries on a global scale.\n"

