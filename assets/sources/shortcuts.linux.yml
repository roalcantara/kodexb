shortcuts:
  linux:
    desc: Common Linux desktop keyboard shortcuts
    tags: [linux, desktop]
    platform: linux
    bindings:
      - chord: alt+f2
        action: Run Command
        scope: global
      - chord: alt+tab
        action: Switch Between Apps
        scope: global
      - chord: alt+shift+tab
        action: Switch Between Apps (Reverse)
        scope: global
      - chord: ctrl+alt+arrowUp
        action: Switch Workspace Up
        scope: global
      - chord: ctrl+alt+arrowDown
        action: Switch Workspace Down
        scope: global
      - chord: ctrl+alt+arrowLeft
        action: Switch Workspace Left
        scope: global
      - chord: ctrl+alt+arrowRight
        action: Switch Workspace Right
        scope: global
      - chord: super
        action: Show Activities Overview
        scope: global
      - chord: super+1
        action: Switch to Workspace 1
        scope: global
      - chord: super+2
        action: Switch to Workspace 2
        scope: global
      - chord: super+3
        action: Switch to Workspace 3
        scope: global
      - chord: super+4
        action: Switch to Workspace 4
        scope: global
      - chord: prtsc
        action: Capture Full Screen
        scope: global
      - chord: alt+prtsc
        action: Capture Window
        scope: global
      - chord: shift+prtsc
        action: Capture Selection
        scope: global
