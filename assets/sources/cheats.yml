  Azure DevOps:
    desc: Principais features
    tags: [azure_devop]
    notes:
      - md: |
          ## 1. Boards

            - Rastreamento de trabalho com quadros Kanban.
            - Backlogs de sprint e produto.
            - Ferramentas de planejamento e rastreamento de projetos.
            - Integração com GitHub.

          ## 2. Repos

            - Repositórios Git ilimitados.
            - Revisões de código com pull requests.
            - Integração contínua com políticas de ramificação e build.
            - Suporte a TFVC (Team Foundation Version Control).

          ## 3. Pipelines

            - Integração contínua (CI) e entrega contínua (CD).
            - Suporte para qualquer linguagem e plataforma.
            - Implantação em múltiplos ambientes, incluindo cloud, on-premises e dispositivos móveis.
            - Integração com contêineres e Kubernetes.

          ## 4. Test Plans

            - Planejamento, rastreamento e avaliação de testes.
            - Testes manuais e exploratórios.
            - Testes automatizados em desktops e dispositivos móveis.
            - Integração com ferramentas de CI/CD.

          ## 5. Artifacts

            - Hospedagem de pacotes NuGet, npm e Maven.
            - Integração com CI/CD para publicação automática de pacotes.
            - Suporte a feeds privados para controle de acesso.

          ## 6. Extensibilidade e Integração

            - Marketplace com extensões e integrações.
            - APIs REST para integração com outras ferramentas e serviços.
            - Suporte a webhooks e integração com serviços de terceiros.

          ## 7. Wiki

            - Documentação e compartilhamento de conhecimento.
            - Suporte a markdown.
            - Integração com repositórios e rastreamento de trabalho.

          ## 8. Controle de Acesso e Segurança

            - Autenticação multifatorial.
            - Controles de acesso baseados em funções.
            - Políticas de segurança e conformidade.

          ## 9. Dashboards e Relatórios

            - Painéis personalizáveis.
            - Widgets e gráficos para monitoramento em tempo real.
            - Relatórios analíticos para insights profundos.

          ## 10. Ambiente de Desenvolvimento Integrado

            - Integração com Visual Studio e outras IDEs.
            - Suporte a Git e TFVC diretamente das IDEs.
            - Ferramentas de depuração e diagnóstico.
  Google Spreadsheet Charts Explained with Simple Examples:
    desc: Breakdown of each chart available, along with a simple example. Choosing the right chart depends on your data and how you want to present it
    tags: [sheet]
    notes:
      - markdown: | #markdown
          **Line Chart:**
          * **Use:** Show the change in values over time.
          * **Example:** Sales of a product across several months.
          | Month | Sales |
          |---|---|
          | January | 100 |
          | February | 200 |
          | March | 300 |
          | April | 400 |
          | May | 500 |
          | June | 600 |
      - markdown: |

          **Area Chart:**
          * **Use:** Similar to line charts, but highlights differences between values.
          * **Example:** Sales and expenses over time.

          | Month | Sales | Expenses |
          |---|---|---|
          | January | 100 | 50 |
          | February | 200 | 100 |
          | March | 300 | 150 |
          | April | 400 | 200 |
          | May | 500 | 250 |
          | June | 600 | 300 |

      - markdown: |

          **Column Chart:**
          * **Use:** Compare values between categories.
          * **Example:** Sales of different products.

          | Product | Sales |
          |---|---|
          | Product A | 100 |
          | Product B | 200 |
          | Product C | 300 |

      - markdown: |

          **Bar Chart:**
          * **Use:** Similar to column charts, but with horizontal bars.
          * **Example:** Population of different countries.

          | Country | Population |
          |---|---|
          | Brazil | 212 million |
          | China | 1.4 billion |
          | USA | 332 million |

      - markdown: |

          **Pie Chart:**
          * **Use:** Show the proportion of values within a total.
          * **Example:** Sales percentage of different products.

          | Product | Percentage |
          |---|---|
          | Product A | 25% |
          | Product B | 50% |
          | Product C | 25% |

      - markdown: |

          **Scatter Chart:**
          * **Use:** Show the relationship between two variables.
          * **Example:** Salary vs. experience of employees.

          | Salary | Experience |
          |---|---|
          | 10,000 | 1 year |
          | 20,000 | 2 years |
          | 30,000 | 3 years |
          | 40,000 | 4 years |
          | 50,000 | 5 years |

      - markdown: |

          **Histogram:**
          * **Use:** Show the distribution of values in a data series.
          * **Example:** Distribution of grades in an exam.

          | Grade | Quantity |
          |---|---|
          | 0 to 5 | 10 |
          | 6 to 10 | 20 |
          | 11 to 15 | 30 |
          | 16 to 20 | 40 |

      - markdown: |

          **Radar Chart:**
          * **Use:** Compare values between categories across multiple dimensions.
          * **Example:** Skills comparison of different football players.

          | Player | Dribbling | Passing | Shooting | Marking | Speed |
          |---|---|---|---|---|---|
          | Player A | 10 | 9 | 8 | 7 | 6 |
          | Player B | 9 | 8 | 7 | 6 | 5 |
          | Player C | 8 | 7 | 6 | 5 | 4 |
    links:
      - COUNTIF: https://support.google.com/docs/answer/3093480
      - COUNTIF with examples: https://ablebits.com/office-addins-blog/countif-google-sheets
  UTC - Tempo Universal Coordenado:
    desc: Tempo Universal Coordenado é uma escala de tempo atômica, baseada em definições precisas de segundo (o padrão de tempo atômico)
    tags: [time, utc]
    notes:
      md: |
        # UTC:

        Tempo Universal Coordenado é uma escala de tempo atômica, baseada em definições precisas de segundo (o padrão de tempo atômico).
        UTC é mantido usando relógios atômicos altamente precisos e, ocasionalmente, segundos bissextos são adicionados para compensar a desaceleração da rotação da Terra.

        ## Precisão e Uso
        É o padrão de tempo mais utilizado no mundo para regulamentações civis, comerciais e legais. É mais preciso que o GMT por ser baseado em relógios atômicos.

        ## Segundos Bissextos
        Inclui segundos bissextos para garantir que o tempo civil permaneça alinhado com a rotação da Terra.

        ## Fuso Horário
        O UTC não é um fuso horário, mas um padrão de tempo que é o sucessor do GMT (Greenwich Mean Time).

        ## Uso Atual
        É o padrão para o tempo mundial e é utilizado em quase todos os contextos onde é necessária alta precisão, incluindo internet, aviação, e comunicação global.

        ## UTC e GTM
        Em resumo, enquanto o GMT tem sua base na astronomia solar e tem menos precisão, o UTC é baseado em padrões de tempo atômico e é ajustado com segundos bissextos para manter a precisão com a rotação da Terra.
  GMT - Greenwich Mean Time:
    desc: Greenwich Mean Time é o fuso horário no Observatório Real de Greenwich, em Londres, que tem uma longitude de 0°
    tags: [gmt]
    notes:
      md: |
        # GMT:

        Greenwich Mean Time é o fuso horário no Observatório Real de Greenwich, em Londres, que tem uma longitude de 0°.
        O GMT é o padrão de tempo civil utilizado no Reino Unido durante o inverno e é o ponto de referência para todos os outros fusos horários do mundo.

        ## Precisão e Uso

        O GMT é um padrão de tempo civil, que é o sucessor do Greenwich Mean Time.
        É baseado na rotação da Terra e não é tão preciso quanto o UTC (Tempo Universal Coordenado), que é baseado em relógios atômicos.

        ## Segundos Bissextos
        Não inclui segundos bissextos, o que significa que o tempo civil não está alinhado com a rotação da Terra.

        ## Fuso Horário
        O GMT não é um fuso horário, mas um padrão de tempo que é o sucessor do GMT (Greenwich Mean Time).

        ## Uso Atual
        O GMT é o padrão de tempo civil utilizado no Reino Unido durante o inverno e é o ponto de referência para todos os outros fusos horários do mundo.

        ## GMT e UTC
        Em resumo, enquanto o GMT tem sua base na astronomia solar e tem menos precisão, o UTC é baseado em padrões de tempo atômico e é ajustado com segundos bissextos para manter a precisão com a rotação da Terra.
  Representação do UTC e GMT em Node.js:
    desc: em Node.js, você geralmente não precisa se preocupar com a diferença entre GMT e UTC, pois ambos são tratados da mesma maneira na maioria dos casos
    tags: [node, time]
    notes:
      - markdown: |
          Em Node.js, tanto o UTC (Tempo Universal Coordenado) quanto o GMT (Greenwich Mean Time) são tratados de forma bastante similar, já que, na prática, eles representam a mesma hora.

          A diferença entre UTC e GMT é mais uma questão técnica e histórica do que uma diferença prática no tempo.

          ## UTC:
          Em JavaScript e, por extensão, em Node.js, as datas são armazenadas internamente em UTC.
          Quando você cria um novo objeto Date, ele é baseado em milissegundos desde a Era Unix (1 de janeiro de 1970, 00:00:00 UTC).
          Para trabalhar com o UTC, você geralmente usaria métodos específicos do objeto Date que terminam em UTC. Por exemplo, getUTCHours(), getUTCMinutes(), etc.

          ## GMT:
          No contexto de Node.js, GMT é geralmente considerado equivalente ao UTC. Não existe uma distinção específica entre GMT e UTC na API Date do JavaScript.
          Quando você vê uma hora expressa em GMT em JavaScript, está, na prática, vendo uma hora em UTC.

          ## Diferença:

          ### Prática:
          No uso diário e na maioria das aplicações, UTC e GMT são considerados iguais.
          A diferença técnica entre eles (baseada em relógios atômicos para UTC e observação solar para GMT) não impacta a forma como as datas e horas são representadas em JavaScript/Node.js.

          ### Técnica:
          A distinção real entre GMT e UTC está em como eles são medidos e ajustados (como segundos bissextos em UTC), mas essa distinção não afeta a API de datas em JavaScript.

          ## Takeaways:
          Em resumo, em Node.js, você geralmente não precisa se preocupar com a diferença entre GMT e UTC, pois ambos são tratados da mesma maneira na maioria dos casos.
      - javascript: |
          const now = new Date();

          console.log("UTC Date and Time:");
          console.log(now.toUTCString()); // Representa a data e hora em formato UTC

          console.log("Local Date and Time:");
          console.log(now.toString()); // Representa a data e hora local

          console.log("UTC Components:");
          console.log(`Hours: ${now.getUTCHours()}`); // Hora em UTC
          console.log(`Minutes: ${now.getUTCMinutes()}`); // Minutos em UTC
  _.indexBy(list, iteratee, [context]):
    desc: Converts a object array to a map with keys returned by an iteratee function. Keys are unique.
    notes:
      - js: |
          _.indexBy([
            {name: 'moe', age: 40},
            {name: 'larry', age: 50}
          ], 'age')

          // => {
          //   "40": {name: 'moe', age: 40},
          //   "50": {name: 'larry', age: 50}
          // }
    tags: [js, underscore]
    links:
      - _.indexBy: https://underscorejs.org/#indexBy
  _.groupBy(list, iteratee, [context]):
    desc: Splits a collection into sets, grouped by the result of running each value through iteratee.
    notes:
      - js: |
          _.groupBy([1.3, 2.1, 2.4], function(num){ return Math.floor(num); });

          // => {1: [1.3], 2: [2.1, 2.4]}
    tags: [js, underscore]
    links:
      - _.groupBy: https://underscorejs.org/#groupBy
  GitFlow:
    desc: Ideal para projetos com lançamentos periódicos e que precisam de um processo de revisão mais formal
    tags: [git, workflow]
    notes:
      md: |
        ## Overview
        - Fluxo de trabalho baseado em duas branches principais: `master` e `develop`
        - Todas as features são criadas a partir da branch `develop` e mescladas de volta a ela após revisão por meio de pull requests
        - As releases são criadas a partir da branch `develop` e mescladas de volta a ela e a `master` após revisão por meio de pull requests

        ## Usage
        - Projetos que empregam lançamentos periódicos
        - Requerem um processo de revisão mais formal
        - Equipes que buscam um fluxo de trabalho mais estruturado e formal
        - Projetos onde a integração contínua não é uma prática central
  GitHub Flow:
    desc: Simplicity and agility with a single branch. Ideal for CI/CD and quick releases!
    tags: [git, workflow]
    notes: |
      Simplicity and agility with a single branch. Ideal for CI/CD and quick releases!

      > "Anything in the main branch is deployable."

      ![GitHub Flow](https://user-images.githubusercontent.com/6351798/48032310-63842400-e114-11e8-8db0-06dc0504dcb5.png?raycast-height=250)

      ## Advantages

        1. **Simplicity:** Fewer branches to manage
        2. **Rapid Releases:** Features and fixes can go live faster
        3. **Immediate Feedback:** Continuous deployment ensures swift iterations and improvements
        4. **Less Merge Conflicts:** Due to fewer branches

      ## Challenges

        1. **Needs Thorough Testing:** Continuous Deployment could deploy unstable code if not tested properly
        2. **Less Structured:** Lacks the structured approach needed for larger, parallel projects.
        3. **Over-reliance on main:** Could be a vulnerability if not carefully managed.

      ## How To

        1. Create descriptive feat branches off of main
        2. Push to named branches constantly
        3. Open a pull request (draft)
        4. On pull request's ready, request a review
        4. On pull request's approval, update main and delete the feat branch
        5. On main update, create a release (version bump, tag, changelog)
        6. On release, deploy immediately

      ### Hotfix

        1. Create a descriptive hotfix branch off of main
        2. Fix the defect on the hotfix branch and push to it constantly
        3. Open a pull request (draft)
        4. On pull request's ready, request a review
        5. On pull request's approval, update main and delete the hotfix branch
        6. On main update, create a release (version bump, tag, changelog)
        7. On release, deploy immediately

      ## Usage

        - Smaller teams
        - Simplicity and speed are a priority.
        - Emphasize frequent releases are a priority.
        - **Continuous Integration** is a central practice.
        - **Continuous Delivery** is a central practice.
    links:
      - The GitHub Flow - GitHub Universe 2016: https://youtu.be/juLIxo42A_s
      - Supercharge your GitHub Flow: https://youtu.be/cP0I9w2coGU
      - Follow GitHub flow to collaborate on projects: https://guides.github.com/introduction/flow
      - GITHUB FLOW VS. GIT FLOW - WHAT's THE DIFFERENCE?: https://split.io/blog/github-flow-vs-git-flow-whats-the-difference
  GitLab Flow:
    desc: O equilíbrio entre controle e flexibilidade. Controle de acesso e CI/CD integrado no seu Git workflow
    tags: [git]
    notes:
      - yaml: |
          Fluxo:
            - master: Branch principal para o desenvolvimento contínuo.
            - production, staging: Branches de ambiente para estados de pré-produção e produção.
            - Feature branches: Baseadas em master para novas funcionalidades.
            - Merge requests: Para revisões antes de mesclar com master.
            - Promote to environments: Avanço do código através de ambientes até produção.
          Características:
            - Uma combinação de aspectos do GitFlow e GitHub Flow, adaptando-se bem a ambientes com deploy contínuo e com controle de acesso.
            - Utiliza branches de ambiente, como production, staging, e master.
          Vantagens:
            - Permite um controle de acesso mais refinado e o uso de ambientes de teste antes da produção.
            - Flexível e adaptável a diferentes tipos de projetos.
          Quando Usar:
            - Ambientes que utilizam GitLab como plataforma central de desenvolvimento.
            - Projetos que necessitam de pipelines de CI/CD integrados e controle de acesso detalhado.
            - Equipes que desejam combinar a flexibilidade do GitFlow com a simplicidade do GitHub Flow.
  Feature Branch Workflow:
    desc: Isolamento e foco para desenvolvimento de funcionalidades, perfeito para revisões detalhadas de código
    tags: [git, workflow]
    notes:
      - yaml: |
          Fluxo:
            - main/master: Branch principal estável.
            - Feature branches: Separadas para cada nova funcionalidade.
            - Pull requests: Iniciados para discussão e revisão da funcionalidade.
            - Code review: Requisito antes da mesclagem.
            - Merge: Funcionalidades revisadas são mescladas para main.
          Características:
            - Cada nova funcionalidade é desenvolvida em uma branch separada e depois mesclada à branch principal.
          Vantagens:
            - Isolamento do trabalho em novas funcionalidades, permitindo testes independentes antes da integração.
            - Flexível e fácil de entender, adequado para equipes pequenas
          Quando Usar:
            - Projetos que não têm requisitos rigorosos para deploy contínuo e preferem isolar o desenvolvimento de funcionalidades.
            - Equipes menores que podem não ter a infraestrutura para suportar CI/CD completo.
            - Projetos onde a revisão de código é essencial antes da integração de novas funcionalidades.
  Release Flow (Adopted by Microsoft):
    desc: A abordagem da Microsoft para gerenciamento robusto de releases em grandes projetos. Estrutura e controle são as chaves.
    tags: [git, workflow]
    notes:
      - yaml: |
          Fluxo:
            - main: Branch para o desenvolvimento principal e base para novas features.
            - Release branches: Branches específicas para cada lançamento.
            - Feature freeze: Congelamento de funcionalidades para testes de release.
            - Validation: Testes e ajustes finais na branch de release.
            - Launch: Lançamento da versão estável para produção.
          Características:
            - Similar ao GitFlow, mas com ênfase em branches de release frequentes e independentes da branch develop.
          Vantagens:
            - Gerenciamento de releases mais robusto, permitindo um ciclo de revisão e preparação mais detalhado antes do lançamento.
            - Focado em grandes equipes e projetos complexos, onde as releases precisam ser minuciosamente gerenciadas.
          Quando Usar:
            - Grandes equipes trabalhando em projetos complexos com muitos colaboradores.
            - Projetos que exigem uma fase dedicada de "hardening" antes do lançamento de uma versão.
            - Organizações que necessitam de um controle rigoroso sobre o que é lançado e quando é lançado.
  Top Git Workflows:
    desc: GitFlow x GitHub Flow x GitLab Flow x Trunk-Based x Feature Branch x Release Flow
