  3 Motivation Styles determined by Personality:
    desc: 3 Motivation Styles determined by Personality
    tags: [personality]
    notes:
      - md: | #markdown
          # 3 Motivation Styles determined by Personality

          ## 1. Wind Type (dynamic)

          Some minds are kind like the wind: highly dynamic, always changing, and hard to predict. (ADHD)
          Able to work for long periods of time, as long as they focus on different things to work on.

          - Reccomendations:

            Rotate what you do, and when you do it. (e.g. 1 hour of work, 1 hour of rest, 1 hour of work, 1 hour of rest, etc)
            Let your mind wonder and come back to the task at hand later.
            Take breaks often and do multiple things per day.
            Organize your task list as sprint, not as a marathon.
            Recognize that your mind has the capacity do see more problems than it actually exists.

          - Pitfalls:

            You may feel like you are not making progress, because you are not working on the same thing for long periods of time.
            You may feel like you are not working hard enough, because you are not working on the same thing for long periods of time.

          ## 2. Fire Type (driven)

          Stedy, it burns in a constant way. (prererable by the western society - traditional)

          - Reccomendations:

            Organize your task list as a marathon, not as a sprint.
            Do not take breaks often, and do not do multiple things per day.
            Be careful at burnout. "The brightest flame burns twice as fast."
            Whach out for the "I'll do it later" trap. (procrastination)

          ## 3. Earth Type (resilient)

          Slow, but steady. It doesnt move much, but it is very stable. (prererable by the eastern society)

          - Reccomendations:

            Starts slow, but once it starts, it is hard to stop.
            Give yourself time to start.
            Regconize that you are not lazy, you just need time to start.
            Regconize that you might need a few days/weeks to get into the flow.

          - Pitfalls:

            Self critical and prone to depression.
            Likely to give up when just they are about to succeed.
