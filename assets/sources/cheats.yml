  Logaritmo é o inverso da exponenciação:
    desc: O logaritmo é o inverso da exponenciação. Se `b` elevado a `y` é igual a `x`, então o logaritmo de `x` na base `b` é igual a `y`.
    tags: [math]
    notes:
      - md: |
          ### TL;DR Logaritmo

          A função matemática logarítmica, ou simplesmente "log", é o inverso da exponenciação.

          Ela responde à pergunta "a que potência devemos elevar a base para obter um determinado número?".

          ## Exemplos:

          ### Log base 2 de 8:

          log2(8)=3

          Para resolver isso, perguntamos: "2 elevado a qual potência dá 8?".
          A resposta é 3, porque 2^3=8.

          ### Log base 5 de 25:

          log5(25)=2

          Para resolver isso, perguntamos: "5 elevado a qual potência dá 25?".
          A resposta é 2, porque 5^2=25.
  Cynefin Framework:
    desc: Navigating complexity in decision-making. Simple for clear problems, Complicated for expert-solved issues, Complex for adaptive challenges, Chaotic for urgent crises, and Disorder when the path is unclear. A guide to understanding context and response in business.
    tags: [decision_making]
    links:
      - Cynefin Framework: https://en.wikipedia.org/wiki/Cynefin_framework
      - Cynefin Framework: https://youtube.com/watch?v=N7oz366X0-8
    notes:
      - md: |
          # Cynefin Framework

          The Cynefin framework is a conceptual framework used to aid decision-making.

          ## Overview

          Created in 1999 by Dave Snowden when he worked for IBM Global Services, it has been used in a variety of contexts, including healthcare, government, and the military.

          The framework provides a typology of contexts that guides what sort of explanations or solutions might apply.

          The Cynefin framework is based on the premise that different situations require different approaches and that leaders need to be able to identify situations and effectively apply the right approach.

          ## The framework is broken into five domains:

          ### Simple

          - The simple domain is characterized by clear cause and effect relationships.
          - The approach is to sense, categorize, and respond.
          - The leader's role is to sense what is happening, categorize things, and respond accordingly.
          - **Example:** Implementing a standard feature that has been done in several previous projects.

          ### Complicated

          - The complicated domain is characterized by clear cause and effect relationships, but the relationships are not immediately apparent.
          - The approach is to sense, analyze, and respond.
          - The leader's role is to sense what is happening, analyze things, and respond accordingly.
          - **Example:** Integrating different systems or technologies where specialized knowledge is needed to ensure compatibility and efficiency.

          ### Complex

          - The complex domain is characterized by no clear cause and effect relationships.
          - The approach is to probe, sense, and respond.
          - The leader's role is to probe the situation, sense what is happening, and respond accordingly.
          - **Example:** Developing an innovative product where user reactions and preferences are still uncertain.

          ### Chaotic

          - The chaotic domain is characterized by no clear cause and effect relationships and is often the result of a crisis.
          - The approach is to act, sense, and respond.
          - The leader's role is to act, sense what is happening, and respond accordingly.
          - **Example:** Dealing with a severe security breach that exposes sensitive customer data.

          ### Disorder

          - The disorder domain is characterized by uncertainty about which of the other four domains the situation is in.
          - The leader's role is to break the situation down and move it into one of the other domains.
          - **Example:** Facing a problem where it's unclear whether it's a technical issue, a communication problem with the client, or a combination of both.

          The framework is used to help leaders understand the context in which they are operating and to help them make decisions based on that context.
      - md: |
          Software estimation faces unique challenges in each domain of the Cynefin Framework. Here's a breakdown:

          ### Simple (Obvious):
          #### Challenge: Complacency and Overconfidence
          Estimations in this domain can lead to an underestimation of time and resources due to over-familiarity with tasks.
          There's a risk of overlooking potential variations or minor complexities.
          #### Key to Address
          Standardize tasks and use historical data to make informed estimations, but always include buffers for unexpected variations.

          ### Complicated:
          #### Challenge: Expertise Reliance
          Estimations rely heavily on expert opinions, which can vary.
          The complexity of the problem may lead to underestimating the effort needed for analysis and integration.
          #### Key to Address
          Involve multiple experts to get a rounded view and use systematic approaches like breakdown structures to estimate more accurately.

          ### Complex:
          #### Challenge: Uncertainty and Adaptability
          requirements and solutions evolve through experimentation, making initial estimations highly uncertain.
          #### Key to Address
          Use iterative and incremental estimation methods, like agile methodologies, to revise estimates as the project progresses and more information becomes available.

          ### Chaotic:
          #### Challenge: Crisis Management
          In chaotic situations, the focus is on immediate action rather than accurate estimation, which can lead to resource strain and scope creep.
          #### Key to Address
          Implement rapid response teams with the authority to make quick decisions. Post-crisis, review and adjust estimations for ongoing work.

          ### Disorder:
          #### Challenge: Lack of Clarity
          When it's unclear which domain a problem falls into, making accurate estimations is challenging due to the absence of a clear approach or understanding.
          #### Key to Address
          Spend time analyzing the problem to classify it into the appropriate domain before attempting estimation.
          Use a combination of estimation techniques tailored to each identified domain.

          In all domains, a key to better software estimation is recognizing the nature of the problem space and choosing estimation techniques that are best suited for that domain's challenges.
