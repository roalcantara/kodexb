  Keyboard Shortcuts writting order and best practices:
    desc: Keyboard Shortcuts writting order and best practices
    tags: [keyboard, shortcuts]
    notes:
      - md: |
          ## Conventional order that's typically followed

          This order not only helps maintain consistency but also makes it easier for users to understand and remember the shortcuts.

          Here's the general order:

          | Key | Description | Description |
          | --- | ----------- | ----------- |
          | ⌃   | Control     | If the shortcut involves the Control key, it usually comes first |
          | ⌥   | Option      | Next is the Option (or Alt) key |
          | ⇧   | Shift       | The Shift key typically follows |
          | ⌘   | Command     | The Command key usually comes last |
          | A.. | Other Keys  | Finally, the actual key that completes the shortcut is listed |

          # Use Upper Case for Single Letter Keys:

          When the shortcut involves a single letter key, it is common to use upper case, regardless of whether the Shift key (⇧) is part of the shortcut.

          **Example:** `⌘C` instead of `⌘c`, even though pressing ⌘ and C together does not require the Shift key.
