  HTTP Status Codes:
    desc: Common HTTP status codes and their meanings (table)
    tags: [status_code]
    notes:
      - md: |
          # HTTP Status Codes

          > Common HTTP status codes and their meanings

          | Code | Name | Description |
          | ---- | ---- | ----------- |
          | 200 | OK | The request was successful |
          | 201 | Created | The request has been fulfilled and a new resource has been created |
          | 202 | Accepted | The request has been accepted for processing, but the processing has not been completed |
          | 203 | Non-Authoritative Information | The server successfully processed the request but is returning information from another source |
          | 204 | No Content | The server successfully processed the request but is not returning any content |
          | 205 | Reset Content | The server successfully processed the request but is instructing the client to reset the document from which the request was initiated |
          | 206 | Partial Content | The server is delivering only part of the resource due to a range header sent by the client |
          | 207 | Multi-Status | The message body that follows is an XML message and can contain a number of separate response codes, depending on how many sub-requests were made |
          | 208 | Already Reported | The members of a DAV binding have already been enumerated in a previous reply to this request, and are not being included again |

          | 300 | Multiple Choices | The requested resource has multiple representations, each with its own specific location |
          | 301 | Moved Permanently | The requested resource has been assigned a new permanent URI and any future references to this resource should use one of the returned URIs |
          | 302 | Found | The requested resource resides temporarily under a different URI |
          | 303 | See Other | The response to the request can be found under another URI using a GET method |
          | 304 | Not Modified | Indicates that the resource has not been modified since the version specified by the request headers If-Modified-Since or If-None-Match |
          | 305 | Use Proxy | The requested resource must be accessed through the proxy given by the Location field |
          | 307 | Temporary Redirect | The requested resource resides temporarily under a different URI |
          | 308 | Permanent Redirect | The target resource has been assigned a new permanent URI and any future references to this resource ought to use one of the enclosed URIs |

          | 400 | Bad Request | The server cannot process the request due to a client error |
          | 401 | Unauthorized | The client must authenticate itself to get the requested response |

          | 402 | Payment Required | Reserved for future use |
          | 403 | Forbidden | The client does not have permission to access the requested resource |
          | 404 | Not Found | The server cannot find the requested resource |
          | 405 | Method Not Allowed | The method specified in the request is not allowed |
          | 406 | Not Acceptable | The server can only generate a response that is not accepted by the client |
          | 407 | Proxy Authentication Required | The client must authenticate itself with the proxy |
          | 408 | Request Timeout | The server timed out waiting for the request |
          | 409 | Conflict | The request could not be completed because of a conflict in the request |
          | 410 | Gone | The requested page is no longer available |
          | 411 | Length Required | The "Content-Length" is not defined. The server will not accept the request without it |
          | 412 | Precondition Failed | The precondition given in the request evaluated to false by the server |
          | 413 | Payload Too Large | The server will not accept the request, because the payload is too large |
          | 414 | URI Too Long | The server will not accept the request, because the URL is too long |
          | 415 | Unsupported Media Type | The server will not accept the request, because the media type is not supported |
          | 416 | Range Not Satisfiable | The client has asked for a portion of the file, but the server cannot supply that portion |

          | 417 | Expectation Failed | The server cannot meet the requirements of the Expect request-header field |
          | 418 | I'm a Teapot | The server refuses the attempt to brew coffee with a teapot |
          | 421 | Misdirected Request | The request was directed at a server that is not able to produce a response |
          | 422 | Unprocessable Entity | The server understands the content type of the request entity but was unable to process the contained instructions |
          | 423 | Locked | The source or destination resource of a method is locked |
          | 424 | Failed Dependency | The method could not be performed on the resource because the requested action depended on another action and that action failed |
          | 425 | Too Early | Indicates that the server is unwilling to risk processing a request that might be replayed |
          | 426 | Upgrade Required | The client should switch to a different protocol such as TLS/1.0 |
          | 428 | Precondition Required | The origin server requires the request to be conditional |
          | 429 | Too Many Requests | The user has sent too many requests in a given amount of time |
          | 431 | Request Header Fields Too Large | The server is unwilling to process the request because either an individual header field or all the header fields collectively are too large |
          | 451 | Unavailable For Legal Reasons | The server is denying access to the resource as a consequence of a legal demand |

          | 500 | Internal Server Error | The server has encountered a situation it doesn't know how to handle |
          | 501 | Not Implemented | The request method is not supported by the server and cannot be handled |
          | 502 | Bad Gateway | The server, while acting as a gateway or proxy, received an invalid response from the upstream server it accessed in attempting to fulfill the request |
          | 503 | Service Unavailable | The server is not ready to handle the request |
          | 504 | Gateway Timeout | The server, while acting as a gateway or proxy, did not receive a timely response from the upstream server specified by the URI |
          | 505 | HTTP Version Not Supported | The server does not support the HTTP protocol version used in the request |
          | 506 | Variant Also Negotiates | Transparent content negotiation for the request results in a circular reference |
          | 507 | Insufficient Storage | The server is unable to store the representation needed to complete the request |
          | 508 | Loop Detected | The server detected an infinite loop while processing the request |
          | 510 | Not Extended | Further extensions to the request are required for the server to fulfill it |
          | 511 | Network Authentication Required | The client needs to authenticate to gain network access |

          ## References

          - [HTTP Status Codes](https://developer.mozilla.org/en-US/docs/Web/HTTP/Status)
          - [HTTP Status Codes](https://restapitutorial.com/httpstatuscodes.html)
          - [HTTP Status Codes](https://en.wikipedia.org/wiki/List_of_HTTP_status_codes)
  The 7 Basic Characteristics for Autism Diagnosis | NEW DSM-5:
    desc: The 7 Basic Characteristics for Autism Diagnosis [NEW DSM-5]
    tags: [dsm_5]
    notes:
      - md: |
          ### The 7 Basic Characteristics for Autism Diagnosis [NEW DSM-5]

          #### A) Persistent Deficits in Social Communication and Social Interaction Across Multiple Contexts

            > Currently or by historical evidence, as indicated by at least two of the following:

            1. Deficits in socio-emotional reciprocity:

              Ranging from abnormal social approach to failure in participating in back-and-forth conversations.

            2. Deficits in non-verbal communicative behaviors used for social interaction:

              Ranging from poor eye contact and body language to lack of facial expressions and non-verbal communication.

            3. Deficits in developing, maintaining, and understanding relationships:

              Ranging from difficulties in adjusting behavior to suit various social contexts to problems in sharing imaginative play, interests, and emotions.

          #### B) Restricted and Repetitive Patterns of Behavior, Interests, or Activities

            > Currently or by historical evidence, as indicated by at least one of the following:

            1. Stereotyped or repetitive motor movements, use of objects, or speech:

              Examples include lining up toys or flipping objects.

            2. Insistence on sameness:

              Inflexible adherence to routines or ritualized patterns of verbal or non-verbal behavior.

            3. Highly restricted, fixated interests:

              Abnormal in intensity or focus.

            4. Hyper- or hypo-reactivity to sensory input or unusual interest in sensory aspects of the environment.

          #### C) Symptoms must be present in the early developmental period but may not become fully manifest until social demands exceed limited capacities.

          #### D) Symptoms cause clinically significant impairment in social, occupational, or other important areas of current functioning.

          #### E) These deficits are not better explained by intellectual disability (intellectual developmental disorder) or global developmental delay.

          #### F) The disturbance is not better explained by another specific mental or behavioral disorder.

          #### G) The disturbance is not due to general medical or genetic conditions.
  Interceptors | NestJS:
    desc: Classes that can manipulate requests/responses, add extra logic before/after method execution, and modify method return values
    tags: [nestjs, interceptor]
    notes:
      - md: |
          ### Interceptors in NestJS

          > **Interceptors** are classes that can process requests before they reach the route handler and responses before they are sent back to the client.
          > They can be used for logging, error handling, and other cross-cutting concerns.

          #### Advantages

          1. Can be applied globally or to specific routes/controllers.

          2. **Granular Control**:
            - Allows logging the execution time of requests.
            - Can log both incoming requests and outgoing responses.

          3. **Consistency**:
            - Ensures logging behavior is consistent across various parts of the application.

          4. **Error Handling**:
            - Can catch and log errors before they reach the global exception filter.

          #### Disadvantages

          1. **Complexity**:
            - Slightly more complex to implement compared to middleware.

          2. **Overhead**:
            - Might add some overhead if not implemented efficiently, especially with heavy logging operations.

          #### Creating an Interceptor

          ```typescript
          import { Injectable, NestInterceptor, ExecutionContext, CallHandler } from '@nestjs/common';
          import { Observable } from 'rxjs';

          @Injectable()
          export class LoggingInterceptor implements NestInterceptor {
            intercept(context: ExecutionContext, next: CallHandler): Observable<any> {
              console.log('Before...');
              const now = Date.now();
              return next.handle().pipe(tap(() => console.log(`After... ${Date.now() - now}ms`)));
            }
          }
          ```

          #### Applying Interceptors

          You can apply interceptors at the controller level, method level, or globally in your NestJS application.

          - **Global Level**: Apply an interceptor to all routes in the entire application.
          - **Controller Level**: Apply an interceptor to all routes in a controller.
          - **Method Level**: Apply an interceptor to a specific route handler method.

          #### Conclusion

          - Interceptors in NestJS provide a powerful mechanism for processing requests and responses in a flexible and reusable way.
          - They are a key feature of the framework that enables you to implement cross-cutting concerns and improve the overall structure of your application.
  Middlewares | NestJS:
    desc: Function called before the route handler and can be used to modify the request/response objects, end the request-response cycle, or call the next middleware
    tags: [nestjs]
    notes:
      - md: | #markdown
          ### Middlewares in NestJS

          > **Middlewares** are functions that can process requests before they reach the route handler and responses before they are sent back to the client.
          > They can be used for logging, error handling, and other cross-cutting concerns.

          #### Advantages

          1. **Simplicity**:
            - Easier to set up and understand, especially for simple logging needs.

          2. **Early Execution**:
            - Logs requests as soon as they arrive at the server, before any route handling.

          #### Disadvantages

          1. **Less Granular Control**:
            - Limited in logging responses or measuring the time taken for request processing.

          2. **No Error Logging**:
            - Cannot catch and log errors that occur during route handling or in subsequent middleware/interceptors.

          #### Creating a Middleware

          ```typescript
          import { Injectable, NestMiddleware } from '@nestjs/common';
          import { Request, Response } from 'express';

          @Injectable()
          export class LoggerMiddleware implements NestMiddleware {
            use(req: Request, res: Response, next: Function) {
              console.log('Request...');
              next();
            }
          }
          ```

          #### Applying Middlewares

          You can apply middlewares at the controller level, method level, or globally in your NestJS application.

          - **Controller Level**: Apply a middleware to all routes in a controller.
          - **Method Level**: Apply a middleware to a specific route handler method.
          - **Global Level**: Apply a middleware to all routes in the entire application.

          #### Conclusion

          - Middlewares in NestJS provide a powerful mechanism for processing requests and responses in a flexible and reusable way.
          - They are a key feature of the framework that enables you to implement cross-cutting concerns and improve the overall structure of your application.
  LoggingInterceptor vs LoggerMiddleware | NestJS:
    desc: LoggingInterceptor and LoggerMiddleware are two ways to log requests and responses in NestJS. LoggingInterceptor is a class-based interceptor, while LoggerMiddleware is a function-based middleware.
    tags: [nestjs]
    notes:
      - md: |
          ### Overview

          #### Interceptors

            - Manipulate requests/responses
            - Add extra logic before/after method execution
            - Modify method return values

          #### Middleware

            - Execute logic before/after route handler
            - Access to request/response objects
            - No direct access to method return values

          ### Choosing the Right Approach

          #### 1. Use **LoggingInterceptor** if:

          - You need to log the execution time of requests.
          - You want to log responses or errors.
          - You need logging scoped to specific routes or controllers.
          - You require consistent logging behavior across different parts of the application.

          #### 2. Use **LoggerMiddleware** if:

          - You need simple logging of incoming requests.
          - You want to log requests as soon as they hit the server.
          - You prefer a simpler setup for basic logging needs.

          #### 3. Combining Both Approaches:

          - You can also use both middleware and interceptors to leverage their respective strengths.
          - For instance, use middleware for logging incoming requests and interceptors for logging execution times and responses.
          - Combining both can give you a comprehensive logging solution, providing insights into request processing at different stages of the lifecycle.
          - Example
            - **LoggerMiddleware** for basic request logging.
            - **LoggingInterceptor** for detailed execution time and response logging.
  CEFR [Common European Framework of Reference for Languages] Levels:
    desc: The Common European Framework of Reference for Languages (CEFR) is an international standard for describing language ability. It describes language ability on a six-point scale, from A1 for beginners, up to C2 for those who have mastered a language.
    tags: [lang, cefr]
    notes:
      - md: |
          > Language proficiency is commonly categorized using the Common European Framework of Reference for Languages (CEFR), which is a widely accepted standard for describing language ability.
          >
          > It divides learners into six levels, from complete beginners to advanced language users.
          >
          > Here's a brief overview of each level and what B1 and B2 specifically denote:

          ## CEFR Levels

          ### A1 (Beginner)

          - At this level, users can understand and use familiar everyday expressions and very basic phrases aimed at the satisfaction of needs of a concrete type.
          - They can introduce themselves and others and can ask and answer questions about personal details such as where they live, people they know, and things they have.

          ### A2 (Elementary)

          - Users can understand sentences and frequently used expressions related to areas of most immediate relevance (e.g., very basic personal and family information, shopping, local geography, employment).
          - They can communicate in simple and routine tasks requiring a simple and direct exchange of information on familiar and routine matters.

          ### B1 (Intermediate)

          - At this level, users can understand the main points of clear standard input on familiar matters regularly encountered in work, school, leisure, etc.
          - They can deal with most situations likely to arise while traveling in an area where the language is spoken.
          - They can produce simple connected text on topics that are familiar or of personal interest.

          ### B2 (Upper Intermediate)

          - Users can understand the main ideas of complex text on both concrete and abstract topics, including technical discussions in their field of specialization.
          - They can interact with a degree of fluency and spontaneity that makes regular interaction with native speakers quite possible without strain for either party.
          - They can produce clear, detailed text on a wide range of subjects and explain a viewpoint on a topical issue giving the advantages and disadvantages of various options.

          ### C1 (Advanced)

          - At this level, users can understand a wide range of demanding, longer texts, and recognize implicit meaning.
          - They can express ideas fluently and spontaneously without much obvious searching for expressions.
          - They can use language flexibly and effectively for social, academic, and professional purposes.
          - They can produce clear, well-structured, detailed text on complex subjects, showing controlled use of organizational patterns, connectors, and cohesive devices.

          ### C2 (Proficiency)

          - Users can understand with ease virtually everything heard or read.
          - They can summarize information from different spoken and written sources, reconstructing arguments and accounts coherently.
          - They can express themselves spontaneously, very fluently, and precisely, differentiating finer shades of meaning even in more complex situations.

          ## Fluency

          ### B2

          Is often considered the threshold for being able to interact with a degree of fluency and spontaneity with native speakers, making it a significant milestone for many learners aiming for fluency.

          ### C1 and C2

          Are where users demonstrate advanced skills and fluency in the language, capable of using the language in complex and professional contexts.

          ## Summary

          In summary, while B2 is seen as a level where users can effectively communicate and interact in a variety of situations, C1 and C2 levels are generally associated with a high degree of fluency and comprehension, allowing for nuanced understanding and expression in the language.
