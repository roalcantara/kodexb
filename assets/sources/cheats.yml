  PII - Personally Identifiable Information:
    desc: Informações que podem ser usadas para identificar, contatar ou localizar uma única pessoa
    tags: [pii]
    notes:
      - md: | #markdown
          # PII:

          Informações que podem ser usadas para identificar, contatar ou localizar uma única pessoa, ou para identificar um indivíduo no contexto.
          As informações que podem ser usadas para identificar uma pessoa incluem, mas não estão limitadas a, nome, sobrenome, endereço de e-mail, endereço físico, número de telefone, número de cartão de crédito, número de seguro social ou número de identificação de contribuinte.

          ## Exemplos:

          - Nome completo
          - Endereço de e-mail
          - Endereço físico
          - Número de telefone
          - Número de cartão de crédito
          - Número de seguro social
          - Número de identificação de contribuinte

          ## Não PII:

          Informações que não podem ser usadas para identificar, contatar ou localizar uma única pessoa, ou para identificar um indivíduo no contexto.
          As informações que não podem ser usadas para identificar uma pessoa incluem, mas não estão limitadas a, código postal (exceto quando usado para identificar uma área geográfica pequena o suficiente para justificar preocupações de privacidade), código postal e código de área quando não combinado com outros PII, e informações demográficas anônimas, informações de navegação na web, informações de pesquisa de internet, informações de interação com anúncios e respostas a promoções.

          ## Exemplos:

          - Código postal
          - Código postal e código de área
          - Informações demográficas anônimas
          - Informações de navegação na web
          - Informações de pesquisa de internet
          - Informações de interação com anúncios
          - Respostas a promoções
  Trunk-Based Development:
    desc: Ideal para equipes que vivem na vanguarda da integração contínua e entregas frequentes
    tags: [git, workflow]
    notes:
      - yaml: |
          Fluxo:
            trunk/main: Branch principal onde todos os desenvolvimentos ocorrem.
            Short-lived feature branches: Branches de vida curta para funcionalidades específicas.
            Pull requests: Pequenos e frequentes para revisão rápida.
            Continuous integration: Testes automáticos com cada commit.
            Regular merges: Frequente mesclagem para trunk, mantendo-o como base atualizada.
          Características:
            Desenvolvedores trabalham em pequenas mudanças: diretamente na branch principal (trunk).
            Branches de feature são de curta duração: mescladas frequentemente.
          Vantagens:
            Minimiza: complexidade do gerenciamento de branches.
            Encoraja: integração e testes contínuos.
          Ideal para:
            Equipes que valorizam e praticam integração contínua e entrega contínua (CI/CD).
            Projetos que requerem que o código esteja sempre em um estado lançável.
            Ambientes onde pequenas mudanças são preferidas e merges frequentes são a norma.
