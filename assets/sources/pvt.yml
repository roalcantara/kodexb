  That on the explanation:
    desc: Message template for explaining something in a elegant way
    tags: [pvt]
    notes:
      - md: |
          Yeah!
          The issue is that these docs don't just serve as documentation — they've also proven to be very effective at guiding agents down the right path. The Acceptance Criteria, with their clear and invariant outputs, help prevent drifting, while the tasks.md provides step-by-step instructions with very little room for interpretation.
          I've had a few not-so-great experiences in the past when instructions left too much room for ambiguity or misinterpretation.
          That said, if you're confident that handoff.md is sufficient, I'm happy to give it a try! 🙂

commands:
  flux install bun:
    desc: Install bun in the current environment
    tags: [flox]
  cd ~/.config/fabric/patterns; for folder in ../custom/*/; do ln -sf "$folder" "$(basename "$folder")"; done:
    desc: Symlink custom patterns to fabric patterns folder
    tags: [symlink]
  for file in ~/.config/*; do ln -sf "$file" "$(basename "$file")"; done:
    desc: Symlink each file from ~/.config to current folder
    tags: [symlink]
  cd ~/.config/kodexb/scripts && bun src/maintenance/export-kb-to-sqlite.ts --db:
    desc: Migrate to KnowledgeBase Files to SQLite
    tags: [kb, bun]
  cd ~/.config/kodexb/scripts && bun src/maintenance/export-kb-to-sqlite.ts --assets:
    desc: Extract missing KB assets from the DB item tags
    tags: [kb, bun]
  cd ~/Work/dots && mise run build --nocache --local --user 'vscode' --group 'vscode' --tag 'latest':
    desc: Build Dotfiles Docker image with Mise tagged 'latest'
    tags: [mise, docker]
  cd ~/Work/dots && mise run start --tag 'latest':
    desc: Start Dotfiles Docker Container tagged 'latest' with Mise
    tags: [mise, docker]
