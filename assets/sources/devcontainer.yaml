bookmarks:
  https://youtu.be/SDa3v4Quj7Y:
    desc: My Favorite Way To Handle Dev Environments | VS Code Devcontainers
    tags: [devenv, vscode]
commands:
  mise use devcontainer@latest:
    desc: Install the latest version of devcontainer using mise
    tags: [devcontainer, devenv]
  flox install devcontainer:
    desc: Install the latest version of devcontainer using flox
    tags: [devcontainer, devenv]
  brew install devcontainer:
    desc: Install the latest version of devcontainer using brew
    tags: [devcontainer, devenv]
  devcontainer up:
    desc: Create and run dev container
    tags: [devcontainer, devenv]
  devcontainer set-up:
    desc: Set up an existing container as a dev container
    tags: [devcontainer, devenv]
  devcontainer run-user-commands:
    desc: Run user commands
    tags: [devcontainer, devenv]
  devcontainer read-configuration:
    desc: Read configuration
    tags: [devcontainer, devenv]
  devcontainer outdated:
    desc: Show current and available versions
    tags: [devcontainer, devenv]
  devcontainer upgrade:
    desc: Upgrade lockfile
    tags: [devcontainer, devenv]
  devcontainer features:
    desc: Features commands
    tags: [devcontainer, devenv]
  devcontainer templates:
    desc: Templates commands
    tags: [devcontainer, devenv]
  devcontainer exec <cmd> [args..]:
    desc: Execute a command on a running dev container
    tags: [devcontainer, devenv]
  devcontainer build [path]:
    desc: Build a dev container image
    tags: [devcontainer, devenv]
  devcontainer build --image-name roalcantara/kb:latest --platform "linux/arm64" --workspace-folder .:
    desc: Build a dev container image with a specific image name and platform and push it to the registry
    tags: [devcontainer, devenv]
  devcontainer build --image-name roalcantara/kb:latest --platform "linux/arm64,linux/amd64" --push true --workspace-folder .:
    desc: Build a dev container image with a specific image name and platforms and push it to the registry
    tags: [devcontainer, devenv]
