    notes:
      - md: |
          ## Overview

          This video features a collection of 11 terminal CLI tools that enhance productivity and workflow. Here is a summary of the tools showcased:

          1. **Atuin**:

            - A robust tool for managing shell command history.
            - Highly recommended for its searchable features and cross-machine syncing capabilities.

          2. **Branchlet**:

            - An NPM-based tool for managing Git work trees directly in the terminal.
            - Extremely useful for Git-heavy workflows.

          3. **Superfile**:
            - A terminal-based file manager.
            - Appreciates its ease of use and clean UI, noting it as a passionate open-source project.

          4. **Pastel**:
            - A versatile command-line tool for color manipulation (hex, RGB, HSL, gradients).
            - Described as a "no-brainer" for terminal users working with colors.

          5. **Taproom**:
            - A GUI-style Homebrew package manager for the terminal.
            - It allows users to search, update, and manage packages visually.

          6. **Na'vi**:
            - An interactive cheat sheet tool that lets you execute one-liners.
            - Uses it to quickly run predefined scripts and commands.

          7. **Tealdeer**:
            - A community-driven alternative to man pages.
            - Quick, concise usage examples of complex commands.

          8. **Cargo-seek**:
            - A manager for Cargo crates.
            - Helps in browsing, installing, and managing Rust packages directly from the terminal.

          9. **Stormy**:
            - Simple terminal-based weather utility that pulls data via an API.

          10. **Hygg**:
            - Tool for reading PDFs and e-books in the terminal with support for Vim-like motions.

          11. **Smassh**:
            - Terminal-based typing speed test tool, described as a "monkeytype clone" for your command line.
