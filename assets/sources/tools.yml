  https://youtu.be/JWfNLF_g_V0:
    desc: Turn ANY Website into LLM Knowledge in SECONDS
    tags: [ cli, llm, scrap ]
    links:
      - Crawl4AI: https://github.com/unclecode/crawl4ai
    notes:
      - md: |
          # Crawl4AI - Turn ANY Website into LLM Knowledge in SECONDS

          - How to efficiently scrape website data to create knowledge bases for Retrieval-Augmented Generation (RAG) systems using an open-source tool called Crawl4AI.
          - It is a superior approach for helping LLMs (like the Pydantic AI framework) become experts on specific, up-to-date documentation.
          - Highly recommended for its speed, intuitive setup, and memory efficiency.

          ## USAGE

          Unlike traditional, resource-intensive scrapers, this tool:

            - Converts HTML to Markdown: It cleans raw, messy HTML into a clean, human- and LLM-readable markdown format, reducing the risk of model hallucinations (0:03:17).
            - Handles Complexity: It manages sessions, proxies, and browser instances under the hood using Playwright (0:03:51).
            - Filters Content: It automatically removes irrelevant script tags and noise (0:04:26).

          ## WORKFLOW

            - Basic Crawl:
              - After a simple pip install and setup extract markdown from any single URL with minimal code.

            - Scalable Crawling (Sitemaps):
              - Using sitemap.xml to automatically discover all pages on a site rather than manually listing URLs.

            - Parallel/Batch Processing:
              - To handle large sites efficiently, the tool supports parallel crawling.
              - By setting a batch size (e.g., 10 pages at a time), it maintains a low memory footprint while significantly increasing speed.

          ## ETHICS

          - The author emphasizes that scraping should be ethical.
          - Always check a website's robots.txt file before crawling to ensure you are following the site's rules and restrictions.

          ## RAG INTEGRATION

          - **Pydantic AI**
             - An expert agent built using this workflow to provide accurate answers from documentation
             - It is integrated with a vector database (PGVector with Supabase) to store the knowledge base.
  https://youtu.be/b4dqb_KV-_M:
    desc: Viewing and scraping website content directly within a terminal
    tags: [ cli, html, scrap, term ]
    links:
      - wget: https://www.gnu.org/software/wget/
      - curl: https://curl.se/
      - sed: https://www.gnu.org/software/sed/
      - recode: https://github.com/rrthomas/recode
      - w3m: https://w3m.sourceforge.net/
      - html2text: https://github.com/aaroneiche/html2text
      - HTMLView: https://github.com/MacPython/htmlview
    notes:
      - md: |
          # HOW TO VIEW AND SCRAPE WEBSITE CONTENT DIRECTLY IN THE TERMINAL

          The author demonstrates various methods to fetch, clean, and format HTML output, moving from raw source code to readable text.

          ## TOOLS AND COMMANDS

          ### 1. wget

          - **PURPOSE:** Downloads the raw HTML of a webpage to the terminal.
          - **USAGE:** Useful for basic retrieval, but the resulting output is messy and contains raw HTML tags.
          - **EXAMPLE:**

              ```bash
              wget -qO- "http://filmsbykris.com/scripts"
              # similar in functionality using curl
              curl -s "http://filmsbykris.com/scripts"
              ```

          ### 2. sed

          - **PURPOSE:** Used to strip HTML tags from the output.
          - **USAGE:** Effective for removing tags, but can leave behind encoded special characters and often destroys the original formatting/spacing.
          - **EXAMPLE:**

              ```bash
              # 1. remove HTML tags
              wget -qO- "http://filmsbykris.com/scripts" | sed -e 's/<[^>]*>//g'

              # 2. remove special characters
              wget -qO- "http://filmsbykris.com/scripts" | sed -e 's/&[^;]*;/ /g'
              ```

          ### 3. recode

          - **PURPOSE:** Converts HTML special characters (like &) into readable text.
          - **USAGE:** Good for fixing encoding issues, though it may require specific configuration (e.g., avoiding forced ASCII conversion) depending on the environment.
          - **EXAMPLE:**

            ```bash
            # 0. Install recode in linux/debian
            sudo apt-get install recode

            # 0. Install recode in macos
            brew install recode

            # 1. remove HTML tags and convert HTML special characters (like &) into readable text (ASCII)
            wget -qO- "http://filmsbykris.com/scripts" | sed -e 's/<[^>]*>//g' | recode html..ascii

            # 2. remove HTML tags and convert HTML special characters (like &) into readable text (UTF-8)
            wget -qO- "http://filmsbykris.com/scripts" | sed -e 's/<[^>]*>//g' | recode html..utf8

            # 3. remove HTML tags and convert HTML special characters (like &) into readable text (HTML entities)
            wget -qO- "http://filmsbykris.com/scripts" | sed -e 's/<[^>]*>//g' | recode html..html

            # 4. remove HTML tags and convert HTML special characters (like &) into readable plain text
            wget -qO- "http://filmsbykris.com/scripts" | sed -e 's/<[^>]*>//g' | recode html
            ```

          ### 4. w3m

          - **PURPOSE:** A shell-based web browser used to display formatted, human-readable text from a URL or pipe input.
          - **USAGE:** Highly recommended; it does a great job of converting visual elements (like directory icons) into readable text and preserving layout structure.
          - **EXAMPLE:**
            ```bash
            # 0. Install w3m
            sudo apt install w3m
            brew install w3m

            # 1. display the HTML of a webpage
            w3m -dump "http://filmsbykris.com/scripts"

            # 2. display the HTML of a webpage and save it to a file
            w3m -dump "http://filmsbykris.com/scripts" > output.

            # 3. Using along with wget
            wget -qO- "http://filmsbykris.com/scripts" | w3m -dump -T text/html
            ```

          ### 5. html2text

          - **PURPOSE:** Converts HTML into plain text with a specific formatting style.
          - **USAGE:** A good, straightforward alternative to full browsers, though its formatting style (like using extra brackets) may vary.
          - **EXAMPLE:**

              ```sh
              # 0. Install html2text
              sudo apt install html2text
              brew install html2text

              # 1. convert the HTML of a webpage to plain text
              html2text "http://filmsbykris.com/scripts"

              # 2. convert the HTML of a webpage to plain text with forwarding links
              wget -qO- "http://filmsbykris.com/scripts" | html2text
              ```
