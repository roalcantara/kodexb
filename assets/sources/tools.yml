  https://youtu.be/3fVAtaGhUyU:
    desc: 10 Zsh hacks I wish I knew about sooner
    tags: [ cli, zsh ]
    links:
      - gist: https://gist.github.com/elliottminns/09a598082d77f795c88e93f7f73dba61
    notes:
      - md: | #markdown
          # 10 Zsh hacks I wish I knew about sooner

          The author presents 10 Zsh hacks designed to streamline terminal workflows and improve efficiency

          ## HACKS
      - md: | #markdown
          0. Bind `Ctrl+w` to delete the previous block of text
            - Deletes the previous block of text, preceding the current cursor position.
            - **EXAMPLES**
                - **EXAMPLE 0:** Setup `Ctrl+w` to delete the previous block of text

                  ```zsh
                  # .zshrc

                  # Bind `Ctrl+w` to delete the previous block of text
                  bindkey '^W' delete-backward-word
                  ```

                ```sh
                # Delete the previous block of text, preceding the current cursor position
                Ctrl + w
                ```

            - **NOTE:**
              - This is a more powerful version of `Ctrl + w` that deletes the previous word, preceding the current cursor position.
              - It is useful for deleting complex, multi-line long commands errors.
      - md: | #markdown
          1. Binding `Ctrl+X, e` to `edit-command-line` widget to edit the current command buffer in $EDITOR:
            - Allows you to use `Ctrl+X, e` to open the current command in your configured text `$EDITOR` (like Neovim).
            - Ideal for fixing complex, multi-line long commands errors using familiar editor keybindings.
            - **EXAMPLE:**

                - **EXAMPLE 0:** Setup `Ctrl+X, e` to `edit-command-line` widget to edit the current command buffer in $EDITOR

                    ```zsh
                    # .zshrc

                    # Open buffer line in editor pressing `Ctrl + X` then `E`
                    autoload -Uz edit-command-line
                    zle -N edit-command-line
                    bindkey '^Xe' edit-command-line
                    ```

                - **EXAMPLE 1:** Use `Ctrl+X, e` to edit the current command buffer in $EDITOR

                  ```zsh
                  # 1. Given a complex, multi-line long command error at the end of the first line
                  $ transcriber transcribe
                  --input 000-rough-cut-a-roll.mov.wav \
                  --output transcript-000.md \
                  --model whisper-large-v3.en \
                  --high-accuracy

                  # 2. Use `Ctrl+X, e` to edit the current command buffer in $EDITOR
                  # use $EDITOR to edit the command buffer save it and exit the editor
                  # the changes will be applied to the command buffer
                  Ctrl + X, e
                  ```
      - md: | #markdown
          2. Using `Ctrl + _` to undo the last action:
            - Using `Ctrl + _` triggers an undo action.
            - This is necessary when accidental commands (like deleting too much text with `Ctrl + w`) cause mistakes in your input buffer.
      - md: | #markdown
          3. Binding `Space` to `magic-space` widget to expand the previous command: (instead of just `sudo !!`):
            - Instead of `sudo !!`, using `magic-space`, allow to type `sudo <Space>` to expand the previous command and show exactly what will execute
            - This prevents errors from executing hidden command histories.
            - **EXAMPLE:**

                ```zsh
                # .zshrc

                # Expand the previous command pressing `Space`
                bindkey ' ' magic-space
                ```

           - `magic-space` widget can also expand commands by index:

                ```zsh
                $ !5001 <Space>
                ```

            - `magic-space` widget can also expand arguments from a previous command:

                ```zsh
                $ npm !* <Space>
                ```

            - `magic-space` widget can also allow to search the last command that contains a specific string:

                ```zsh
                $ !?docker? <Space>
                ```
      - md: | #markdown
          4. Using `chpwd` hook to execute specific commands whenever you change directories:
            - It is useful for auto-loading Nix environments, Python virtual environments, or specific Node.js versions based on project files.
            - **EXAMPLES:**

                ```zsh
                # .zshrc

                # 1. List the contents of the current directory whenever you change directories
                chpwd() {
                  ls
                }

                # 2. Print the current directory whenever you change directories
                chpwd() {
                  pwd
                }

                # 3. Activate/deactivate Python virtual environment whenever you change directories
                chpwd() {
                  if [[ -d .venv ]]; then
                    source. venv/bin/activate
                  elif [[ -d venv ]]; then
                    source venv/bin/activate
                  elif [[ -n "$VIRTUAL_ENV" ]]; then
                    deactivate
                  fi
                }

                # 4. Setup node using nvm whenever you change directories
                chpwd() {
                  if [[ -f .nvmrc ]]; then
                    nvm use
                  fi
                }

                # 5. You must place all commands inside a single chpwd function, not multiple chpwd functions
                chpwd() {
                  hook_python
                  hook_nix
                  ls
                }

                # 6. Alternatively, use add-zsh-hook to add the hook to the chpwd function
                autoload -Uz add-zsh-hook
                add-zsh-hook chpwd hook_python
                add-zsh-hook chpwd hook_nix
                add-zsh-hook chpwd function() {
                  ls
                }
                ```
      - md: | #markdown
          5. Using `Suffix Aliases` to automatically open files with specific extensions using a specific application:
            - This removes the need to type out an application command before every filename.
            - **1. SETUP:**

                ```zsh
                # .zshrc

                ## Setup Suffix Aliases
                alias -s json=jless                      # Open JSON files using jless
                alias -s yaml=yq                         # Open YAML files using yq
                alias -s go='$EDITOR'                    # Open GO files using $EDITOR
                alias -s ts='$EDITOR'                    # Open TS files using $EDITOR
                alias -s js='$EDITOR'                    # Open JS files using $EDITOR
                alias -s md=bat                          # Open MD files using bat
                alias -s aac="open"                      # Open AAC files using open
                alias -s docx="open"                     # Open DOCX files using open
                alias -s flac="open"                     # Open FLAC files using open
                alias -s gif="open"                      # Open GIF files using open
                alias -s jpeg="open"                     # Open JPEG files using open
                alias -s jpg="open"                      # Open JPG files using open
                alias -s m4a="open"                      # Open M4A files using open
                alias -s m4v="open"                      # Open M4V files using open
                alias -s mov="open"                      # Open MOV files using open
                alias -s mp3="open"                      # Open MP3 files using open
                alias -s mp4="open"                      # Open MP4 files using open
                alias -s pdf="open"                      # Open PDF files using open
                alias -s png="open"                      # Open PNG files using open
                alias -s svg="open"                      # Open SVG files using open
                alias -s wav="open"                      # Open WAV files using open
                alias -s webp="open"                     # Open WEBP files using open
                alias -s wma="open"                      # Open WMA files using open
                ```

            - **2. USAGE:**

                ```zsh
                # instead of typing `jless file.json` just type the filename
                $ file.json

                # instead of typing `yq file.yaml` just type the filename
                $ file.yaml

                # instead of typing `nvim file.go` just type the filename
                $ file.go

                # instead of typing `bat file.md` just type the filename
                $ file.md
                ```
      - md: | #markdown
          6. Using `Global Aliases` to drop into a larger command:
            - Unlike standard aliases, these can be used anywhere in a command string.
            - They are perfect for common snippets like piping output to `/dev/null` using a short alias like `NE`.
            - **EXAMPLE:**

               - **1. SETUP**
                ```zsh
                # .zshrc

                # Pipe output to /dev/null using a short alias like `NE`
                alias -g NE='2> /dev/null'        # Redirect stderr to /dev/null
                alias -g DN='> /dev/null'         # Redirect stdout to /dev/null
                alias -g DE='2>&1'                # Redirect stderr to stdout
                alias -g NULL='> /dev/null 2>&1'  # Redirect stdout and stderr to /dev/null
                alias -g CP='| pbcopy'            # Pipe output to clipboard
                alias -g S='| sort'                # Pipe output to sort
                alias -g U='| uniq'                # Pipe output to uniq
                alias -g H='| head'                # Pipe output to head
                alias -g T='| tail'                # Pipe output to tail
                alias -g L='| less'                # Pipe output to less
                alias -g M='| more'                # Pipe output to more
                alias -g X='| xargs'               # Pipe output to xargs
                alias -g FZ='| fzf'                # Pipe output to fzf
                alias -g RG='| rg'                 # Pipe output to ripgrep
                alias -g GP='| grep'               # Pipe output to grep
                alias -g EG='| egrep'              # Pipe output to egrep
                alias -g PY='| python'             # Pipe output to python
                alias -g JQ='| jq'                 # Pipe output to jq
                alias -g YQ='| yq'                 # Pipe output to yq
                ```

               - **2. USAGE:**

                ```zsh
                # instead of typing `du -hd1 / 2> /dev/null` just
                $ du -hd1 / NE
                ```
      - md: | #markdown
          7. Using `zmv` to rename/move files in bulk:
            - An advanced file renaming/moving tool.
            - It uses pattern matching and capture groups, enabling batch operations that are much faster and safer than writing custom loops.
            - **EXAMPLES:**

                - **EXAMPLE 0:** Setup `zmv` plugin

                  ```zsh
                  # .zshrc

                  # Load `zmv` plugin
                  autoload -Uz zmv
                  ```

               - **EXAMPLE 1:** Use `zmv` to rename a bunch of .log files to .txt

                  ```zsh
                  $ ls
                  # => file1.log file2.log file3.log

                  $ autoload zmv

                  $ zmv '(*).log' '$1.txt'

                  $ ls
                  # => file1.txt file2.txt file3.txt
                  ```

               - **EXAMPLE 2:** Use `zmv -W` to rename a bunch of .log files to .txt

                  ```zsh
                  $ ls
                  # => file1.log file2.log file3.log

                  $ autoload zmv

                  $ zmv -W '*.log' '*.txt'

                  $ ls
                  # => file1.txt file2.txt file3.txt
                  ```

               - **EXAMPLE 3:** Use `zmv -n -W` to DRY RUN the renaming of a bunch of .log files to .txt

                  ```zsh
                  $ ls
                  # => file1.log file2.log file3.log

                  $ autoload zmv

                  $ zmv -n -W '*.log' '*.txt'
                  # => file1.txt file2.txt file3.txt

                  $ ls
                  # => file1.log file2.log file3.log
                  ```

               - **EXAMPLE 4:** Use `zmv -i -W` to interactively rename a bunch of .log files to .txt

                  ```zsh
                  $ ls
                  # => file1.log file2.log file3.log

                  $ autoload zmv

                  $ zmv -i -W '*.log' '*.txt'
                  # => Execute? (y/n/a) y -- file1.log to file1.txt
                  # => Execute? (y/n/a) n -- file2.log to file2.txt
                  # => Execute? (y/n/a) y -- file3.log to file3.txt

                  $ ls
                  # => file1.txt file2.log file3.txt
                  ```
      - md: | #markdown
          8. Using `Named Directories` to bookmark folders:
            - Allows you to bookmark folders (e.g., `~YT` for YouTube projects).
            - This simplifies navigation and referencing long directory paths in CLI commands.
            - **EXAMPLES:**

                - **EXAMPLE 0:** Setup `~YT` alias to bookmark the YouTube folder

                  ```zsh
                  # .zshrc

                  # Bookmark the YouTube folder
                  hash -d kb='~/Work/bun/kb'
                  hash -d dots='~/Work/dots'
                  ```

                - **EXAMPLE 1:** Use `~kb` bookmark to navigate to the KB project folder
                  ```zsh
                  $ cd ~kb
                  $ pwd
                  # => ~/Work/bun/kb
                  ```

                - **EXAMPLE 2:** Use `~dots` bookmark list the contents of the dots project folder
                  ```zsh
                  $ ls ~dots
                  # => README.md .env ..
                  ```

                - **EXAMPLE 3:** Use `~dots` bookmark open the dots project folder in the default file manager
                  ```zsh
                  $ open ~dots
                  ```
      - md: | #markdown
          9. Using `Custom Widgets` to perform actions on the command line buffer:
            - These are essentially functions that perform actions on the command line buffer
            - They can automate complex tasks, such as clearing history while keeping the current buffer or copying text to the system clipboard.
            - **EXAMPLES:**

                - **EXAMPLE 0:** Use `CTRL+X, L` to run the `clear-keep-buffer` Custom Widget to clear the zshell history keeping the current command buffer

                  ```zsh
                  # .zshrc

                  # `CTRL+X, L` runs `clear-screen` the Custom Widget to clear the zshell history keeping the current command buffer
                  clear-keep-buffer() {
                    zle clear-screen
                  }
                  zle -N clear-keep-buffer
                  bindkey '^Xl' clear-keep-buffer

                  # `CTRL+x, c` runs copy-command-buffer` Custom Widget to copy the current command buffer to the system clipboard
                  copy-command-buffer() {
                    echo -n $BUFFER | pbcopy
                    zle -M "Command buffer copied to clipboard"
                  }
                  zle -N copy-command-buffer
                  bindkey '^Xc' copy-command-buffer
                  ```
      - md: | #markdown
          10. Using `Hotkey Insertions` to insert text into the command line buffer:
            - Allows you to bind key combinations to insert text into the buffer.
            - This is a massive time-saver for repetitive command boilerplate, such as inserting a `git commit -m ""` string with the cursor pre-positioned inside the quotes.
            - **EXAMPLES:**

                - **EXAMPLE 0:** Use `CTRL+X, gc` to insert a `git commit -m ""` string with the cursor pre-positioned inside the quotes
                  ```zsh
                  # .zshrc

                  # Bind `CTRL+X, gc` to insert a `git commit -m ""` string with the cursor pre-positioned inside the quotes
                  bindkey -s '^Xgc' 'git commit -m ""\C-b'              # `\C-b` (CTRL+B) moves the cursor back one position
                  ```
