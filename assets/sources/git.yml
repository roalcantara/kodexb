cheats:
  Conventional Commits Examples:
    desc: Conventional Commits Examples
    tags: [git]
    links:
      - https://conventionalcommits.org
      - https://jorisroovers.com/gitlint
      - https://pre-commit.com
    notes:
      - md: |
          ## Examples

          ### Commit message with description and breaking change footer

          ```plaintext
          feat: Allow provided config object to extend other configs

          BREAKING CHANGE: `extends` key in config file is now used for extending other config files
          ```

          ---

          ### Commit message with `!` to draw attention to breaking change

          ```plaintext
          feat!: Send an email to the customer when a product is shipped
          ```

          ---

          ### Commit message with scope and `!` to draw attention to breaking change

          ```plaintext
          feat(api)!: Send an email to the customer when a product is shipped
          ```

          ---

          ### Commit message with both `!` and breaking change footer

          ```plaintext
          chore!: Drop support for Node 6

          BREAKING CHANGE: use JavaScript features not available in Node 6.
          ```

          ---

          ### Commit message with multi-paragraph body and multiple footers

          ```plaintext
          fix: Prevent racing of requests

          Introduce a request id and a reference to latest request. Dismiss incoming responses other than from latest request.

          Remove timeouts which were used to mitigate the racing issue but are obsolete now.

          Reviewed-by: Z
          Refs: #123
          ```
  Git Worktree:
    desc: Git Worktree
    tags: [git]
    links:
      - https://git-scm.com/docs/git-worktree
    notes:
      - md: |
          ## Git Worktree

          Git Worktree is a feature that allows you to create a new branch from a specific commit.
          It is useful for creating a new branch from a specific commit without creating a new commit.
          It is also useful for creating a new branch from a specific commit without creating a new commit.

      - sh: | #shell
          #!/bin/bash

          # Assuming the "main" repo is at ~/Work/consorciei/projects/coreservices and you want to create the worktree at ~/Work/consorciei/projects/coreservices-wt/CONT-106.

          # 1) Update the main repo and find out the name of the remote branch
          cd ~/Work/consorciei/projects/coreservices
          git fetch origin --prune
          git branch -a | rg "CONT-106"

          # You will probably see something like remotes/origin/cont/CONT-106 or remotes/origin/CONT-106 (depending on your team's naming convention).

          # 2) Create the worktree (which will also create a local branch tracking the remote)
          # Replace origin/<EXACT_REMOTE_BRANCH_NAME> with what showed up in the previous step:

          git worktree add -b CONT-106 ../coreservices-wt/CONT-106 origin/<EXACT_REMOTE_BRANCH_NAME>
          # Example (if the remote is origin/cont/CONT-106):

          git worktree add -b CONT-106 ../coreservices-wt/CONT-106 origin/cont/CONT-106

          # 3) "Enter" the worktree (access it)
          cd ~/Work/consorciei/projects/coreservices-wt/CONT-106
          git status -sb

          # 4) Rebase the branch on top of master
          # I recommend rebasing directly onto origin/master (so you don't depend on your local master being up to date):
          git fetch origin --prune
          git rebase origin/master

          # 5) If there are conflicts (the usual flow)
          git status

          # edit/resolve files in conflict
          git add <resolved_files>
          git rebase --continue

          # If you need to abort:
          git rebase --abort

          # 6) Push to remote after the rebase
          # Since rebase rewrites history, the push generally needs to be forced:
          git push --force-with-lease origin HEAD:<EXACT_REMOTE_BRANCH_NAME>

          # Example:
          git push --force-with-lease origin HEAD:cont/CONT-106

          # If you tell me the exact name that showed up in git branch -a | rg "CONT-106" (the remotes/origin/... line), I can give you the ready-to-copy commands with the correct path/branch.
