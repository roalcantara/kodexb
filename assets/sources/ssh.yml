cheats:
  Setup dev environment for Bitbucket SSH access:
    desc: Setup dev environment for Bitbucket SSH access on Debian-based Linux
    tags: [ssh, bitbucket, dev]
    links:
      - https://support.atlassian.com/bitbucket-cloud/docs/set-up-personal-ssh-keys-on-linux
      - https://support.atlassian.com/bitbucket-cloud/docs/configure-ssh-and-two-step-verification
    notes:
      - md: | #markdown
          ### Setup dev environment for Bitbucket SSH access

          - Update environment and install required packages:
            sudo apt update && sudo apt upgrade -y && sudo apt install -y openssh-client xclip

          - Check OpenSSH installation:
            ssh -V

          - Check if OpenSSH agent is already running:
            ps -ax | grep ssh-agent

          - If not, start the OpenSSH agent:
            eval $(ssh-agent)

          - Command to restart the SSH Agent on terminal:
            eval "$(ssh-agent -s)"

          - Add this command to your shell configuration file:
              - ~/.bashrc: echo 'eval $(ssh-agent)' >> ~/.bashrc
              - ~/.zshrc: echo 'eval $(ssh-agent)' >> ~/.zshrc
              - ~/.profile: echo 'eval $(ssh-agent)' >> ~/.profile

          - Create SSH Key Pair to use with Bitbucket:
              cd ~ && ssh-keygen -t ed25519 -b 4096 -C "username@consorciei.com.br" -f ~/.ssh/id_ed25519_bitbucket_work

          - Add the created Private Key to the SSH agent:
              ssh-add ~/.ssh/id_ed25519_bitbucket_work
              ssh-add --apple-use-keychain ~/.ssh/id_ed25519_bitbucket_work

          - Setup SSH configuration file:
              - Create if not exists:
                touch ~/.ssh/config

              - Add/Append to ~/.ssh/config: |
                  Host bitbucket.org
                      AddKeysToAgent yes
                      IdentityFile ~/.ssh/id_ed25519_bitbucket_work

          - Add SSH Public Key to your Bitbucket user account:
              - cat ~/.ssh/id_ed25519_bitbucket_work.pub | xclip -selection clipboard
              - cat ~/.ssh/id_ed25519_bitbucket_work.pub | pbcopy
              - open https://bitbucket.org/account/settings/ssh-keys
              - Paste key from clipboard into the Key field; labeled as "username@consorciei.com.br"

          - Test SSH connection:
              - ssh -T git@bitbucket.org
              - You should see a message like "authenticated via ssh key."
  OpenSSH Public and Private Keys Name Scheme:
    desc: Naming convention for OpenSSH keys
    tags: [ssh, naming]
    links: [https://superuser.com/a/1261644]
    notes:
      - md: | #markdown
          ### OpenSSH Public and Private Keys Name Scheme

          - A recommended naming convention for SSH key files is:

            ```txt
            id_<key_algorithm>_<servername>_<purpose>.<format_information>
            ```

          - With the following rules:

            - If it's not for a specific server, remove <servername>
            - If it's not for a specific purpose, remove <purpose>
            - At least one of the information (<purpose> or <servername>) has to be contained in the name

          - Examples:

            | Key Type        | File Name Example                 | Description                                      |
            |-----------------|-----------------------------------|--------------------------------------------------|
            | Private Key     | id_ed25519_github                 | Private key for GitHub using Ed25519 algorithm   |


          - When creating SSH key pairs, it's important to follow a consistent naming convention for better organization and identification. Here is a recommended scheme:

          | Key Type        | File Name Example                  | Description                                      |
          |-----------------|-----------------------------------|--------------------------------------------------|
          | Private Key     | id_ed25519_github                 | Private key for GitHub using Ed25519 algorithm   |
          | Public Key      | id_ed25519_github.pub             | Corresponding public key for GitHub               |
          | Private Key     | id_rsa_work                       | Private key for work-related SSH access using RSA |
          | Public Key      | id_rsa_work.pub                   | Corresponding public key for work                 |

          - Use descriptive names that indicate the purpose or service associated with the key (e.g., github, bitbucket, work).
          - Include the algorithm type (e.g., ed25519, rsa) in the file name for clarity.
          - Always keep your private keys secure and never share them publicly.
  Summarize SSH config attributes:
    desc: Summary of SSH config attributes
    tags: [ssh, config]
    notes:
      - md: | #markdown
          ### Summarize SSH config attributes

          | Attribute             | Description                                                         |
          | --------------------- | ------------------------------------------------------------------- |
          | Host                  | Specifies the hostname or alias for the SSH connection              |
          | HostName              | The actual hostname or IP address of the remote server              |
          | User                  | The username to log in as on the remote server                      |
          | Port                  | The port number to connect to on the remote server                  |
          | IdentityFile          | The path to the private key file for authentication                 |
          | ForwardAgent          | Enables forwarding of the authentication agent connection           |
          | ProxyJump             | Specifies a jump host for connecting through an intermediary        |
          | StrictHostKeyChecking | Controls whether to automatically add new host keys to known_hosts  |
          | ServerAliveInterval   | Sets a timeout interval to send keepalive messages                  |

          - These attributes can be combined in the SSH config file (~/.ssh/config) to create customized connection settings for different hosts.
      - md: | #markdown
          ## SSH CONFIG CHEATSHEET

          ### BASIC CONNECTION
          Host myserver
            HostName example.com
            User ubuntu
            Port 22


          ### KEY MANAGEMENT

          # Specify which key to use
          IdentityFile ~/.ssh/id_ed25519.key

          # Only use explicitly specified keys (don't try agent keys)
          IdentitiesOnly yes

          # Add key to agent automatically when connecting
          AddKeysToAgent yes

          # Store passphrase in macOS Keychain
          UseKeychain yes


          ### AUTHENTICATION

          # Prefer publickey auth (fail fast if key doesn't work)
          PreferredAuthentications publickey

          # Try multiple auth methods in order
          PreferredAuthentications publickey,password


          ### TUNNELS & FORWARDING

          # Local port forward (like SSH tunnel for databases)
          LocalForward 3306 remote-db.example.com:3306

          # Remote port forward (expose local service to remote)
          RemoteForward 8080 localhost:3000

          # SOCKS proxy (full tunnel)
          DynamicForward 1080


          ### PERFORMANCE & SAFETY

          # Keep connection alive
          ServerAliveInterval 60
          ServerAliveCountMax 10

          # Don't prompt about unknown hosts
          StrictHostKeyChecking accept-new

          # Disable strict host key checking (risky!)
          StrictHostKeyChecking no


          ### EXAMPLE COMPLETE CONFIG

          Host ec2-tunnel
            HostName 44.200.148.49
            User ec2-user
            IdentityFile ~/.ssh/aws-dev.key
            IdentitiesOnly yes
            AddKeysToAgent yes
            PreferredAuthentications publickey
            ServerAliveInterval 60


          ### KEY QUESTIONS ANSWERED

          # PreferredAuthentications publickey
          # WHY: Tells SSH to use key auth first. Fails fast if key doesn't work
          #      (instead of falling back to password and asking repeatedly)
          # WHEN: Always use this for automated scripts/CI. Also good for security
          #       (forces key auth, no passwords accepted)

          # IdentitiesOnly yes
          # WHY: Only use the keys you explicitly specify with IdentityFile
          #      (don't let SSH agent try every key it has)
          # WHEN: Use when you have many keys in agent and want to be explicit
          #       Also good to prevent auth failures from trying wrong keys
          #       Improves security by limiting key exposure

commands:
  # SSH KEYS: GENERATE
  # SSH KEYS: ADD TO AGENT
  # SSH KEYS: COPY TO REMOTE SERVER
  # SSH KEYS: COPY TO REMOTE SERVER
  # SSH KEYS: COPY PUBLIC KEY TO CLIPBOARD
  # SSH KEYS: START SSH AGENT
  # SSH KEYS: TEST CONNECTIONS
  'ssh-agent -c | lines | first 2 | parse "setenv {name} {value};" | transpose -i -r -d | load-env':
    desc: Manage SSH passphrases
    tags: [nu]
  ssh-add -l:
    desc: List fingerprints of all identities currently represented by the agent
    tags: [ssh]
  ssh-add -D:
    desc: Delete all identities from the agent
    tags: [ssh]

  ssh-keygen -t ed25519 -C "rogerio.alcantara@gmail.com" -f ~/.ssh/keys/id_ed25519.key:
    desc: Create an SSH key pair id_ed25519 using the Ed25519 algorithm
    tags: [ssh, keygen]
    links: [https://docs.github.com/en/github/authenticating-to-github/about-ssh]
  ssh-keygen -t rsa -b 4096 -C "rogerio.alcantara@gmail.com" -f ~/.ssh/keys/id_rsa.key:
    desc: Create an SSH key pair id_rsa using the RSA algorithm
    tags: [ssh, keygen]
    links: [https://docs.github.com/en/github/authenticating-to-github/about-ssh]
  ssh-keygen -lf ~/.ssh/public_key.pub:
    desc: Show fingerprint from public key
    tags: [ssh, fingerprint]
  ssh-keygen -lv -f ~/.ssh/public_key.pub:
    desc: Show details of public key
    tags: [ssh, fingerprint]

  ssh-add --apple-use-keychain ~/.ssh/keys/id_ed25519_github.key:
    desc: Add id_ed25519_github key to the SSH agent
    tags: [keychain, macos]
    links: [https://freecodecamp.org/news/git-clone-branch-how-to-clone-a-specific-branch]
  ssh-add --apple-use-keychain ~/.ssh/keys/id_ed25519_github.key && ssh-add -l:
    desc: Add multiple SSH keys to the SSH agent
    tags: [keychain, macos]
    links: [https://freecodecamp.org/news/git-clone-branch-how-to-clone-a-specific-branch, https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AccessingInstancesLinux.html#AccessingInstancesLinuxSSHClient]
  ssh-copy-id $SSH_ID:
    desc: Copy SSH key to remote server
    tags: [ssh, copy]
    links: [https://ssh.com/ssh/copy-id, https://docs.github.com/en/github/authenticating-to-github/about-ssh]

  cat ~/.ssh/id_rsa.pub | ssh rogerio@44.200.148.49 "mkdir -p ~/.ssh && cat >> ~/.ssh/authorized_keys":
    desc: Copy SSH public key to remote server
    tags: [ssh, copy]
    links: [https://digitalocean.com/community/tutorials/how-to-create-ssh-keys-with-openssh-on-macos-or-linux#copying-your-public-key-using-ssh]
  ssh -i /path/to/key.pem -L 3306:cs-dev.cluster-czcr94cvltso.us-east-1.rds.amazonaws.com:3306 ec2-user@44.200.148.49:
    desc: Create an SSH tunnel to access a remote database securely
    links: [https://ssh.com/academy/ssh/tunneling, https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AccessingInstancesLinux.html#AccessingInstancesLinuxSSHClient]
    tags: [ssh, tunnel]
    notes:
      - md: | #markdown
          ### SSH Tunnel for Remote Database Access

          - This command establishes an SSH tunnel to securely connect to a remote database.
          - It forwards local port `3306` to the remote database endpoint through the specified EC2 instance.

          #### WHERE

          | PARTS OF THE COMMAND      | DESCRIPTION                                             |
          |-------------------------- | --------------------------------------------------------|
          | `ssh`                     | Command to initiate an SSH connection                   |
          | `-i /path/to/key.pem`     | Specifies the SSH private key file for authentication   |
          | `-L 3306`                 | Local port                                              |
          | `cs-dev.cluster-czcr94cvltso.us-east-1.rds.amazonaws.com:3306` | Remote database endpoint and port            |
          | `ec2-user@44.200.148.49`  | Specifies the user and IP address of the EC2 instance   |

          - `-L 3306`:... = porta local 3306 encaminha para host (cs-dev.cluster-czcr94cvltso.us-east-1.rds.amazonaws.com) e porta remota (3306)
          - Replace `/path/to/key.pem` with the path to your SSH private key file.
          - Replace `cs-dev.cluster-czcr94cvltso.us-east-1.rds.amazonaws.com:3306` with your actual database endpoint and port.
          - Replace `ec2-user@44.200.148.49` with your actual EC2 instance user and IP address.

          cs-dev.cluster-czcr94cvltso.us-east-1.rds.amazonaws.com:3306 =
          Via ec2-user@44.200.148.49 = através deste host SSH

          Depois de conectar, você pode usar seu cliente MariaDB localmente:

          ```sh
          mysql -h 127.0.0.1 -P 3306 -u seu_usuario -p
          ```

    # SSH PERMISSIONS
  chmod 700 ~/.ssh:
    desc: Set permissions for SSH directory
    tags: [ssh, permissions]
  chmod 600 ~/.ssh/config:
    desc: Set permissions for SSH config file
    tags: [ssh, permissions]
  chmod 600 ~/.ssh/id_ed25519* ~/.ssh/*.pem:
    desc: Set permissions for SSH private keys (ed25519 and pem files)
    tags: [ssh, permissions]
  chmod 644 ~/.ssh/*.pub:
    desc: Set permissions for SSH public key
    tags: [ssh, permissions]
  find ~/.ssh/*.pub | fzf --ansi | xargs cat | tr -d "\n" | pbcopy && echo "=> Public key copied to clipboard.":
    desc: Copy public key to clipboard
    tags: [ssh]

  eval "$(ssh-agent -s)":
    desc: Start the SSH agent
    tags: [ssh, agent]
  ssh -T git@bitbucket.org:
    desc: Test SSH connection to Bitbucket
    tags: [ssh, bitbucket]
  ssh -T git@github.com:
    desc: Test SSH connection to GitHub
    tags: [ssh, github]
