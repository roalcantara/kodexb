cheats:
  go vet *.go:
    desc: Report likely mistakes on all go files
    tags: [go]
  go vet:
    desc: Report likely mistakes on files in current dir
    tags: [go]
  go vet ./..:
    desc: Report likely mistakes on files in current dir recursively
    tags: [go]
  go vet -printf=true ./..:
    desc: Report likely mistakes only the 'printf' check
    tags: [go]
  go tool vet help:
    desc: List available checks
    tags: [go]
  go list:
    desc: List packages or modules
    tags: [go]
  go list -m -u all:
    desc: Check for updates to deps and subdeps
    tags: [go]
  go mod tidy:
    desc: Clean up unused deps or adds missing ones
    tags: [go]
  go clean -modcache:
    desc: Clear the module cache for all projects
    tags: [go]
  go mod download:
    desc: Download modules to the local cache
    tags: [go]
  go mod vendor:
    desc: Copy 3rd-party deps to a vendor folder in your project root
    tags: [go]
  go mod graph:
    desc: Print module requirement graph
    tags: [go]
  go mod verify:
    desc: Check deps have expected content
    tags: [go]
  go mod why:
    desc: Explain why packages or modules are neede
    tags: [go]
  go mod edit:
    desc: Replace a dependency in your 'go.mod' file with a local or forked version
    tags: [go]
  go run *.go:
    desc: Run all go files in current directory
    tags: [go]
  go build:
    desc: Produce bin to current arch in dir
    tags: [go]
  gofmt *.go:
    desc: Format source files recursively
    tags: [go]
  gofmt *.go -w:
    desc: Format and overwrite source files recursively
    tags: [go]
  goimports *.go:
    desc: Fix imports and formats the code of all go files
    tags: [go]


commands:
  go vet -printf=false ./..:
    desc: Report likely mistakes except 'printf'
    tags: [go]
  go list github.com/<PACKAGE>:
    desc: Find information about package
    tags: [go]
  "go list -f'{{ .Name }}' <PACKAGE>":
    desc: List packages or modules using the '-f' flag
    tags: [go]
  "go list -f'{{ .Imports }}' <PACKAGE>":
    desc: Print package's deps
    tags: [go]
  "go list -f'{{ .Deps  }}' <PACKAGE>":
    desc: List package's transitive deps
    tags: [go]
  go list -m -u <PACKAGE>:
    desc: Check for updates to a specific dep of package
    tags: [go]
  go get github.com/<PACKAGE>:
    desc: Download a package
    tags: [go]
  go get github.com/<PACKAGE>@<VERSION>:
    desc: Download package from a specific version
    tags: [go]
  go get github.com/<PACKAGE>@<COMMIT>:
    desc: Download package from a specific commit
    tags: [go]
  go get -u github.com/spf13/cobra@latest && go install github.com/spf13/cobra-cli@latest:
    desc: Get cobra
    tags: [go]
  go mod init github.com/roalcantara/<NAME>:
    desc: Initialize new go module in current director
    tags: [go]
  ls $GOPATH/pkg/mod:
    desc: List cached deps
    tags: [go]
  go run <FILE=main>.go:
    desc: Run go program
    tags: [go]
  go run <FILE1>.go <FILE2.go> <FILE3.go>:
    desc: Run many files at once
    tags: [go]
  go run ./<DIR>:
    desc: Run package in dir
    tags: [go]
  go install <PACKAGE>:
    desc: Produce a bin in GOPATH/bin
    tags: [go]
  go install <PACKAGE>@<VERSION>:
    desc: Produce a bin in GOPATH/bin from a specific version
    tags: [go]
  go install <PACKAGE>@<COMMIT>:
    desc: Produce a bin in GOPATH/bin from a specific commit
    tags: [go]
  ls $GOPATH/bin:
    desc: List executable bins from GOPATH/bin
    tags: [go]
