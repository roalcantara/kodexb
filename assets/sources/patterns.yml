  SOLID | Liskov Substitution Principle (with example):
    desc: Subclasses should be replaceable with their parent class
    tags: [bp, oop, solid]
    links:
      - The S.O.L.I.D Principles in Pictures: https://medium.com/backticks-tildes/the-s-o-l-i-d-principles-in-pictures-b34ce2f1e898
      - SOLID - The First 5 Principles of O.O. Design: https://digitalocean.com/community/conceptual-articles/s-o-l-i-d-the-first-five-principles-of-object-oriented-design
      - SOLID Principle in Programming - Understand With Real Life Examples: https://geeksforgeeks.org/solid-principle-in-programming-understand-with-real-life-examples
    notes:
      - ts: |
          // Base class
          abstract class Shape {
            abstract area(): number;
          }

          // BAD: Violates LSP
          class BadRectangle extends Shape {
            constructor(private width: number, private height: number) { super(); }
            area() { return this.width * this.height; }

            // This method makes substitution problematic
            setDimensions(w: number, h: number) {
              if (w <= 0 || h <= 0) throw new Error("Invalid dimensions");
            }
          }

          class BadSquare extends BadRectangle {
            setDimensions(w: number, h: number) {
              // Violates LSP - changes expected behavior
              if (w !== h) throw new Error("Square must have equal sides");
              super.setDimensions(w, h);
            }
          }

          // GOOD: Follows LSP
          class Rectangle extends Shape {
            constructor(private width: number, private height: number) { super(); }
            area() { return this.width * this.height; }
          }

          class Circle extends Shape {
            constructor(private radius: number) { super(); }
            area() { return Math.PI * this.radius * this.radius; }
          }

          // Both can be substituted without breaking functionality
          const shapes: Shape[] = [new Rectangle(5, 3), new Circle(2)];
          shapes.forEach(shape => console.log(shape.area())); // Works perfectly
