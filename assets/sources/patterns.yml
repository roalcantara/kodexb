    notes:
      - ts: |
          // BAD: High-level depends on low-level (concrete class)
          class MySQLDatabase {
            save(data: string) {
              console.log("Saving to MySQL:", data);
            }
          }

          class OrderService {
            private db = new MySQLDatabase(); // Tightly coupled!

            processOrder(order: string) {
              this.db.save(order);
            }
          }

          // GOOD: Both depend on abstraction
          interface Database {
            save(data: string): void;
          }

          class MySQLDatabase implements Database {
            save(data: string) {
              console.log("Saving to MySQL:", data);
            }
          }

          class MongoDatabase implements Database {
            save(data: string) {
              console.log("Saving to MongoDB:", data);
            }
          }

          class OrderService {
            constructor(private db: Database) {} // Depends on abstraction!

            processOrder(order: string) {
              this.db.save(order);
            }
          }

          // Can use any database implementation
          const service1 = new OrderService(new MySQLDatabase());
          const service2 = new OrderService(new MongoDatabase());

    # CLIENT ARCHITECTURE PATTERNS
  MVC | Model-View-Controller:
    desc: Separates App logic into three interconnected components
    tags: [architecture, pattern]
    notes:
      md: |
        # MVC: Model-View-Controller

        > Separates App logic into three interconnected components

        One of the earliest (1979) and most adopted patterns
        - **M**odel manages data and logic
        - **V**iew displays the information
        - **C**ontroller connects the Model and View, handling user input

        ## Advantages
        - Facilitates easier testing
        - Simplifies code organization
        - Promotes separation of concerns

        ## Challenges
        - Can lead to bloated controllers
        - Separation between view & model can be tricky

        ## Usage
        - **Perfect for smaller projects, where simplicity is key**
        - Traditional server-side rendered pages
        - Clear separation between data handling and UI

        ## Examples
        Ruby on Rails, Django (Python), Laravel (PHP)

        ## Flow
      mermaid: |
        sequenceDiagram
            participant User
            participant View
            participant Controller
            participant Model

            User ->>+ View: interacts with
            View ->>+ Controller: notify
            Controller ->>+ Model: get data
            Model -->>- View: update
            View -->>- User: display
    links:
      - Martin Fowler's on UI Archs: https://martinfowler.com/eaaDev/uiArchs.html#ModelViewController
      - Client Arch patterns: https://newsletter.techworld-with-milan.com/p/what-is-the-difference-between-mvc
      - Everything You NEED to Know About Client Architecture Patterns: https://youtu.be/I5c7fBgvkNY
  MVP | Model-View-Presenter:
    desc: Enhances MVC by introducing a Presenter in event-driven environments
    tags: [architecture, pattern]
    notes:
      md: |
        # MVP | Model-View-Presenter

        > Enhances MVC by introducing a presenter to handle UI logic

        Decouples View from Model using Presenter as middleman
        - **M**odel manages data
        - **V**iews display data, and sends user commands to Presenter
        - **Presenter** Handle UI logic & user inputs, transforms the Model, coordinates Model and View Updates

        ## Advantages
        - Improved testability of UI logic
        - Clearer separation of concerns than MVC

        ## Challenges
        - More complex than MVC
        - Requires careful management to avoid complex presenters

        ## Usage
        - **When you need more testability**
        - When view's code needs extensive unit testing
        - When logic needs to be decoupled from the view

        ## Examples
        Android apps with complex interactions & UI logic

        ## Flow
      mermaid: |
        sequenceDiagram
            participant User
            participant View
            participant Presenter
            participant Model

            User ->>+ View: interacts with
            View ->>+ Presenter: notify
            Presenter ->>+ Model: update
            Model -->>- Presenter: get data
            Presenter -->>- View: update
            View -->>- User: display
