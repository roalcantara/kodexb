    desc: Clients should not be forced to depend on methods they do not use
    tags: [bp, oop, solid]
    links:
      - The S.O.L.I.D Principles in Pictures: https://medium.com/backticks-tildes/the-s-o-l-i-d-principles-in-pictures-b34ce2f1e898
