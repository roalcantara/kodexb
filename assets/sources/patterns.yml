  Space-based Architecture:
    desc: Eliminates the need for a relational database
    tags: [pattern, architecture]
    notes:
      md: |
        # Space-based Architecture

        > Scales out by using distributed in-memory data grids

        Avoids database bottlenecks by keeping data in RAM and using replication and partitioning techniques.
        - Highly scalable
        - Good for handling unpredictable loads

        ## Advantages
        - Reduces database load
        - Suitable for applications with unpredictable spikes

        ## Challenges
        - Complexity in data management and consistency
        - Significant memory requirements

        ## Usage
        - **For high traffic applications like e-commerce sites**
        - In situations where database performance is a bottleneck
        - For real-time analytics and large-scale transactions

        ## Diagram
      mermaid: |
        graph TD
          A[Component 1] -->|Interacts with| B[Component 2]
          A -->|Interacts with| C[Component 3]
          B -->|Interacts with| C
          C -->|Interacts with| A
