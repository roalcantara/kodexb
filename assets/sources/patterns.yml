  CQRS | Command-Query Responsibility Segregation Architecture:
    desc: Separates read and write operations
    tags: [pattern, architecture]
    notes:
      md: |
        # Command-Query Responsibility Segregation Architecture (CQRS)

        > Distinct separation of command (write) and query (read) responsibilities

        This pattern divides the system into two parts - the command side and the query side.
        - Improves performance, scalability, and security
        - Allows for optimized data schemas on both sides

        ## Advantages
        - Scalability and performance optimization
        - Separation can simplify complex domains

        ## Challenges
        - Complexity in synchronization
        - Increased effort in maintenance

        ## Usage
        - **For complex systems where performance is critical**
        - In systems where read/write operations have significantly different requirements
        - When scalability is a priority

        ## Diagram
      mermaid: |
        graph TD
          A[Command Side] -->|Interacts with| B[Query Side]
          A -->|Interacts with| C[Query Side]
          B -->|Interacts with| C
          C -->|Interacts with| A
