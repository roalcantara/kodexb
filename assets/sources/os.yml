  Fix permissions for global npm installs:
    desc: Fix permissions for global npm installs
    tags: [ linux, macos, npm ]
    notes:
      - sh: |
          #!/bin/bash

          # Fix npm permissions
          sudo chown -R $(whoami) $(npm config get prefix)/{lib/node_modules,bin,share}

          # Or use npm prefix
          mkdir ~/.npm-global
          npm config set prefix '~/.npm-global'
          echo 'export PATH=~/.npm-global/bin:$PATH' >> ~/.profile
          source ~/.profile
    # Debian
  sudo apt update && sudo apt upgrade -y:
    desc: Update the package list and upgrade the system
    tags: [ linux, debian ]
  usermod -aG sudo vscode:
    desc: Add vscode:sudo (user vscode is in the sudo group)
    tags: [ linux, debian ]
  sudo apt update && sudo apt upgrade -y && sudo apt install -y zsh git && useradd -m -s /bin/zsh -G users vscode && passwd vscode && usermod -aG sudo vscode && su - vscode:
    desc: Update the package list and upgrade the system, install zsh and git, add a user vscode to the system, set the password for the user vscode, add vscode:sudo (user vscode is in the sudo group) and switch to the user vscode
    tags: [ linux, debian ]
  useradd -m -s /bin/zsh -G users vscode && usermod -aG sudo vscode && echo "vscode ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers && su - vscode:
    desc: Add a passwordless sudo user vscode to the system, add vscode:sudo (user vscode is in the sudo group) and switch to the user vscode
    tags: [ linux, debian ]
  sudo apt update && sudo apt upgrade -y && sudo apt install -y zsh git && useradd -m -s /bin/zsh -G users vscode && usermod -aG sudo vscode && echo "vscode ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers && su - vscode:
    desc: Setup Debian/Ubuntu, add zsh, git and user vscode:vscode as sudo and switch to the user vscode
    tags: [ linux, debian ]
  useradd -m -s /bin/zsh -G users vscode && usermod -aG sudo vscode && echo "vscode ALL=(ALL) NOPASSWD:ALL" | EDITOR='tee -a' visudo && su - vscode:
    desc: (SAFER) Add a passwordless sudo user vscode to the system, add vscode:sudo (user vscode is in the sudo group) and switch to the user vscode using VISUDO
    tags: [ linux, debian ]
  useradd -m -s /bin/zsh -G users vscode && passwd -d vscode && usermod -aG sudo vscode && echo "vscode ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers && su - vscode:
    desc: (SAFER) Add a user vscode to the system, set the password for the user vscode to empty, add vscode:sudo (user vscode is in the sudo group) and switch to the user vscode
    tags: [ linux, debian ]
  useradd -m -s /bin/zsh -G users vscode && passwd -d vscode && usermod -aG sudo vscode && echo "vscode ALL=(ALL) NOPASSWD:ALL" | EDITOR='tee -a' visudo && su - vscode:
    desc: (SAFER) Add a user vscode to the system, set the password for the user vscode to empty, add vscode:sudo (user vscode is in the sudo group) and switch to the user vscode using VISUDO
    tags: [ linux, debian ]
