bookmarks:
  https://nixos.org:
    tags: [nix]
    desc: NixOS - The Linux distribution for developers
    links: [https://nixos.org/download, https://nix.dev/tutorials/first-steps]
  https://nix.dev/tutorials/first-steps:
    desc: First Steps with Nix
    tags: [nix]
    links: [https://nixos.org/download]

cheats:
  nix show-derivation --recursive /run/current-system:
    desc: Show derivation graph - if available - that produced your NixOS system
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search nixpkgs:
    desc: Show packages in the nixpkgs flake
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search:
    desc: Show packages in the flake in the current dir
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store --gc:
    desc: Delete unreachable paths
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix show-config:
    desc: Show Nix configuration
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-env -iA nixpkgs.dive:
    desc: Install dive
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]

commands:
  sh <(curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install):
    desc: Install Nix package manager
    tags: [nix]
    links: [https://nixos.org/download, https://nix.dev/tutorials/first-steps]
  docker run -it nixos/nix:
    desc: Run a Nix shell in a Docker container
    tags: [nix]
    links: [https://nixos.org/download/#nix-install-docker, https://nix.dev/tutorials/first-steps]
  git clone --depth=1 https://github.com/NixOS/nixpkgs.git && docker run -it -v $(pwd)/nixpkgs:/nixpkgs nixos/nix:
    desc: Clone nixpkgs and run a Nix shell in a Docker container with it mounted
    tags: [nix]
    links: [https://nixos.org/download/#nix-install-docker, https://nix.dev/tutorials/first-steps]
  nix show-derivation nixpkgs#<derivation>:
    desc: Show contents of a store derivation
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix path-info --derivation nixpkgs#<PACKAGE>:
    desc: Print the path of the store derivation produced by package
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix realisation info nixpkgs#<PACKAGE> --json:
    desc: Show some information about the realisation of package
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix path-info nixpkgs#<PACKAGE>:
    desc: Print the store path produced by package
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix path-info -rsSh nixpkgs#<PACKAGE>:
    desc: Show readable package size and all deps
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix path-info -r $(nix-store -qR $(which <PACKAGE>)) --store https://cache.nixos.org/:
    desc: Check the existence of a path in a bin cache for package
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search nixpkgs <TERM>:
    desc: Show packages in the nixpkgs flake containing term in its name or description
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search nixpkgs#<TERM> <PACKAGE>:
    desc: Search for package underneath term's attribute
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search nixpkgs'<PACKAGE>|<library>':
    desc: Search for package or library
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search nixpkgs <PACKAGE>'<keyword1>|<keyword2>':
    desc: Search for package including excluding keywords
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search nixpkgs <PACKAGE> -e'<keyword1>|<keyword2>':
    desc: Search for package except excluding keywords
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix search nixpkgs <PACKAGE> -e'<keyword1>' -e'<keyword2>':
    desc: Search for package except excluding keywords (ALT)
    tags: [nix]
  "nix path-info --json --all | jq -r'sort_by(.registrationTime)[-11:-1][].path'":
    desc: Print the 10 most recently added paths
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix path-info --json --all | jq'map(.narSize) | add':
    desc: Show size of the entire Nix store
    tags: [nix]
  "nix path-info --json --all -S | jq'map(select(.closureSize > 1e9)) | sort_by(.closureSize) | map([.path, .closureSize])'":
    desc: Show every path whose closure is bigger than 1 GB, sorted by closure sizes
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-collect-garbage -d && nix-store --gc:
    desc: Clean nix store
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store -q --graph ~/.nix-profile | dot -Tps > graph.ps && gv graph.ps:
    desc: Make a picture of the dep graph of the current environment
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store --gc --max-freed $((100 * 1024 * 1024)):
    desc: Delete at least 100 MiBs of unreachable paths
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store --print-env $(nix-instantiate'<nixpkgs>' -package):
    desc: Print out the environment of a derivation in a format that can be evaluated by a shell
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store --verify-path $(nix-store -qR $(which <PACKAGE>)):
    desc: Check integrity of package and its deps
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store --query --requisites /run/current-system | cut -d- -f2- | sort | uniq:
    desc: Print installed packages
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store -qR $(nix-store -qd $(which <PACKAGE>)):
    desc: Print the build-time deps of a package
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store -q --tree $(nix-store -qd $(which <PACKAGE>)):
    desc: Show build-time deps as a tree
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store -q --referrers $(nix-store -q --binding <lib> $(nix-store -qd $(which <PACKAGE>))):
    desc: Show paths that depend on the same lib as package
    tags: [nix]
  "nix-store -q --referrers-closure $(ldd $(which <PACKAGE>) | grep /libc.so | awk'{print $3}')":
    desc: Show paths that directly or indirectly depend on the Glibc - C library - used by package
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store -q --roots $(which <PACKAGE>):
    desc: Show every gc root pointing to a store path depending on package
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store --repair-path $(nix-store -qR $(which <PACKAGE>)):
    desc: Try to repair package and its dependencies
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
  nix-store -qR $(which <PACKAGE>):
    desc: Print the closure (runtime deps) of package program in the current user environment
    tags: [nix]
    links: [https://nixos.org, https://nix.dev/tutorials/first-steps]
