    desc: Setup flox in a Debian (container)
    tags: [flox]
    notes:
      - md: | #markdown
          !#/bin/bash

          # 1. in the host, start a container:
          # docker run -it --rm -v $PWD:/app --entrypoint=zsh mcr.microsoft.com/devcontainers/base:debian

          # 2. in the container, run:
          apt-get update && apt-get install -y --no-install-recommends sudo xclip xsel git zsh curl

          rm -rf /home/vscode/.config /home/vscode/.bash_logout /home/vscode/.bash_profile /home/vscode/.bashrc /home/vscode/.profile /home/vscode/.zshrc /home/vscode/.zprofile /home/vscode/.zshenv /home/vscode/.gitconfig /home/vscode/.oh-my-zsh
          rm -rf /root/.config /root/.bash_logout /root/.bash_profile /root/.bashrc /root/.profile /root/.zshrc /root/.zprofile /root/.zshenv /root/.gitconfig /root/.oh-my-zsh /root/.zcompdump* /root/.zsh_*
          mkdir -p /home/vscode/.local/share
          cp -R /app /home/vscode/.local/share/dots

          curl -L https://downloads.flox.dev/by-env/stable/deb/flox-1.11.0.aarch64-linux.deb -o /tmp/flox.deb && sudo dpkg -i /tmp/flox.deb && rm /tmp/flox.deb && flox --version
          flox init --name 'default' --dir /home/vscode/.config/flox
          echo 'eval "$(flox activate --dir /home/vscode/.config/flox -m run)"' >> /home/vscode/.bashrc && source /home/vscode/.bashrc
          echo 'eval "$(flox activate --dir /home/vscode/.config/flox -m run)"' >> /home/vscode/.zshrc && source /home/vscode/.zshrc
          flox install --dir /home/vscode/.config/flox nodejs python313Full ripgrep bat delta eza fd fzf starship zoxide gum pre-commit tree-sitter gitlint ruby neovim
          flox list --dir /home/vscode/.config/flox
          flox envs
          eval "$(FLOX_SHELL=/usr/bin/zsh flox activate --dir /home/vscode/.config/flox)"
          flox list
          flox envs
  Complete environment setup with flox:
    desc: Complete environment setup with flox
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
    notes:
      - md: | #markdown
          ## THE MENTAL MODEL

          - **Base:** Your portable comfort zone (containers, remote servers)
          - **Default:** Your local machine essentials (auto-activated, always there)
          - **Dev:** Your project-specific power tools (activated when needed, layered on top)
      - sh: | #shell
          #!/usr/bin/env bash
          # ============================================================================
          # FLOX ENVIRONMENTS - SETUP & USAGE CHEAT SHEET
          # ============================================================================

          # ============================================================================
          # PART 1: CREATING THE ENVIRONMENTS
          # ============================================================================

          # --- 1. Create BASE environment (portable comfort zone) ---
          flox init --name base
          cd base

          # Create the manifest
          cat > .flox/env/manifest.toml << 'EOF'
          [options]
          allow.unfree = true
          systems = ["aarch64-linux","x86_64-linux","aarch64-darwin","x86_64-darwin"]

          [install]
          # File viewers & navigation
          delta.pkg-path = "delta"
          bat.pkg-path = "bat"
          eza.pkg-path = "eza"
          fd.pkg-path = "fd"
          fzf.pkg-path = "fzf"
          jq.pkg-path = "jq"
          ripgrep.pkg-path = "ripgrep"

          # Core utilities
          gnugrep.pkg-path = "gnugrep"
          gnumake.pkg-path = "gnumake"
          coreutils.pkg-path = "coreutils"
          findutils.pkg-path = "findutils"
          gawk.pkg-path = "gawk"
          less.pkg-path = "less"
          lesspipe.pkg-path = "lesspipe"

          # Git & pre-commit
          gitlint.pkg-path = "gitlint"
          gum.pkg-path = "gum"
          pre-commit.pkg-path = "pre-commit"

          # Security & secrets
          age.pkg-path = "age"
          sops.pkg-path = "sops"

          # Misc utilities
          sqlite.pkg-path = "sqlite"
          wakatime-cli.pkg-path = "wakatime-cli"
          glow.pkg-path = "glow"

          # Shell experience (your "feel like home" tools)
          zoxide.pkg-path = "zoxide"
          starship.pkg-path = "starship"
          neovim.pkg-path = "neovim"
          tree-sitter.pkg-path = "tree-sitter"
          EOF

          cd ~ && flox init --name default

          # --- 2. Create DEFAULT environment (daily driver - auto-activated!) ---
          # The default environment is special - it activates automatically in your shell!
          flox init

          # This creates the default environment in ~/.local/share/flox/environments/default
          # Edit the manifest:
          flox edit

          # Add this content:
          cat > ~/.local/share/flox/environments/default/.flox/env/manifest.toml << 'EOF'
          [include]
          environments = [
              { dir = "~/flox-envs/base" }  # Adjust path to where your base env lives
          ]

          [install]
          # Version control essentials
          git.pkg-path = "git"
          gh.pkg-path = "gh"
          git-lfs.pkg-path = "git-lfs"
          git-extras.pkg-path = "git-extras"
          git-credential-manager.pkg-path = "git-credential-manager"

          # Shell
          zsh.pkg-path = "zsh"

          # Runtime version manager
          mise.pkg-path = "mise"

          # Certificates
          cacert.pkg-path = "cacert"

          # Desktop apps (Linux only)
          whatsapp-for-linux.pkg-path = "whatsapp-for-linux"
          whatsapp-for-linux.systems = ["aarch64-linux","x86_64-linux"]

          # Pinentry (macOS only)
          pinentry_mac.pkg-path = "pinentry_mac"
          pinentry_mac.systems = ["aarch64-darwin","x86_64-darwin"]

          [hook]
          on-activate = '''
            echo "🚀 Default environment activated! Welcome home."
          '''
          EOF

          # --- 3. Create DEV environment (project/task-specific tools) ---
          flox init --name dev
          cd dev

          cat > .flox/env/manifest.toml << 'EOF'
          [install]
          # Development servers & testing
          http-server.pkg-path = "http-server"
          hyperfine.pkg-path = "hyperfine"
          oha.pkg-path = "oha"

          # System utilities
          fastfetch.pkg-path = "fastfetch"
          grc.pkg-path = "grc"
          ncdu.pkg-path = "ncdu"
          parallel.pkg-path = "parallel"

          # File managers & shell tools
          yazi.pkg-path = "yazi"
          zx.pkg-path = "zx"
          zf.pkg-path = "zf"

          # Data processing
          yq.pkg-path = "yq"
          websocat.pkg-path = "websocat"

          # Container & Docker tools
          hadolint.pkg-path = "hadolint"
          devcontainer.pkg-path = "devcontainer"
          container-structure-test.pkg-path = "container-structure-test"

          # CI/CD & GitHub Actions
          act.pkg-path = "act"
          actionlint.pkg-path = "actionlint"
          hub.pkg-path = "hub"

          # Linters & code quality
          checkmake.pkg-path = "checkmake"
          ast-grep.pkg-path = "ast-grep"

          # Automation
          watchexec.pkg-path = "watchexec"

          # Cloud & infrastructure
          awscli.pkg-path = "awscli"
          code-server.pkg-path = "code-server"
          EOF

          cd ..

          echo "✅ All environments created!"

          # ============================================================================
          # PART 2: DAILY USAGE PATTERNS
          # ============================================================================

          # --- Scenario 1: Starting your workday on your local machine ---

          # Just open a new terminal! 🎉
          # Your default environment activates automatically!

          # You immediately have:
          # - All your shell niceties (starship, zoxide, neovim) from base
          # - Git with all tools (gh, git-lfs, etc.)
          # - mise for managing language versions

          # Your daily workflow:
          cd ~/projects/my-app
          git pull
          mise install  # Install project-specific runtimes
          nvim .        # Edit with neovim

          # No need to run `flox activate` - it just works!


          # --- Scenario 2: Working in a devcontainer ---

          # In your devcontainer setup script (.devcontainer/Dockerfile or postCreateCommand):
          # Install flox, then pull base environment
          cat > .devcontainer/setup.sh << 'EOF'
          #!/bin/bash
          # Install flox
          curl -fsSL https://downloads.flox.dev/by-env/stable/install | bash

          # Activate base environment (gives you starship, zoxide, neovim, etc.)
          flox activate -r /path/to/base
          EOF

          # Inside the container, you'll have your comfortable shell experience
          # but not the default-specific stuff (whatsapp, git-credential-manager, etc.)


          # --- Scenario 3: SSH into a remote server ---

          # Copy your base environment to the server
          scp -r ~/flox-envs/base user@server:~/
          ssh user@server

          # On the remote server:
          cd ~/base
          flox activate

          # Now you have your comfortable shell with starship, zoxide, neovim, etc.
          # Perfect for quick edits or investigations


          # ============================================================================
          # PART 3: USING THE DEV ENVIRONMENT - REAL EXAMPLES
          # ============================================================================

          # The beauty: Your default environment is ALWAYS active!
          # When you need dev tools, just layer them on top:

          # --- Example 1: Testing GitHub Actions locally ---

          cd ~/projects/my-app

          # Layer dev tools on top of your default environment
          flox activate -r dev

          # Test your GitHub Actions workflow locally
          act push  # Runs your CI pipeline locally

          # Lint your workflow files
          actionlint .github/workflows/*.yml

          # Exit dev environment when done
          exit  # Returns to your default environment


          # --- Example 2: Benchmarking an API endpoint ---

          # Layer in dev environment
          flox activate -r dev

          # Start a local server for testing
          http-server ./dist -p 8080 &

          # Benchmark it with oha (like apache bench but better)
          oha -z 30s http://localhost:8080/api/users

          # Or use hyperfine for comparing different approaches
          hyperfine \
            'curl -s http://localhost:8080/api/v1/users' \
            'curl -s http://localhost:8080/api/v2/users'

          # Done? Just exit
          exit


          # --- Example 3: Docker/Container workflow ---

          # You're building a Dockerfile
          cd ~/projects/my-app

          # Activate dev tools
          flox activate -r dev

          # Lint your Dockerfile
          hadolint Dockerfile

          # Build and test the container structure
          docker build -t myapp:test .
          container-structure-test test \
            --image myapp:test \
            --config container-tests.yaml

          # Run GitHub Actions in the container locally
          act -P ubuntu-latest=myapp:test


          # --- Example 4: AWS deployment workflow ---

          # Deploying to AWS
          flox activate -r dev

          # Configure AWS CLI (only needed once)
          aws configure

          # Deploy using your deployment script
          aws s3 sync ./dist s3://my-bucket
          aws cloudfront create-invalidation \
            --distribution-id E123456 \
            --paths "/*"

          # Watch for changes and auto-deploy
          watchexec -w src -- './build.sh && aws s3 sync ./dist s3://my-bucket'


          # --- Example 5: Working with YAML/JSON configs ---

          # Processing configuration files
          flox activate -r dev

          # Query and modify YAML
          yq '.services.web.ports' docker-compose.yml
          yq -i '.services.web.ports = ["3000:3000"]' docker-compose.yml

          # Connect to WebSocket for testing
          websocat ws://localhost:8080/ws


          # --- Example 6: Code quality & linting sweep ---

          # Run all linters before committing
          flox activate -r dev

          # Lint Makefiles
          checkmake Makefile

          # Lint GitHub Actions
          actionlint .github/workflows/*.yml

          # Lint Dockerfile
          hadolint Dockerfile

          # Search/refactor code with ast-grep
          ast-grep --pattern 'console.log($$$)' --lang javascript


          # --- Example 7: Quick one-off dev command (without entering subshell) ---

          # Run a single command with dev environment, then return to default
          flox activate -r dev -- act push

          # Or
          flox activate -r dev -- hadolint Dockerfile

          # This is great for quick checks without changing your shell context!


          # ============================================================================
          # PART 4: UNDERSTANDING THE ENVIRONMENT STACK
          # ============================================================================

          # When you open a terminal:
          # [default environment] - ALWAYS active (includes base)
          #   ↳ Contains: git, gh, mise, zsh + all base tools

          # When you run `flox activate -r dev`:
          # [default environment] - Still active
          #   ↳ [dev environment] - Layered on top
          #       ↳ Contains: act, hadolint, awscli, etc.

          # This means you have EVERYTHING available:
          # - Your comfortable shell (base)
          # - Git, zsh, mise (default)
          # - All dev tools (dev)


          # ============================================================================
          # PART 5: QUICK REFERENCE
          # ============================================================================

          # Your default environment is ALWAYS active - no command needed!

          # Layer dev tools on top
          flox activate -r dev

          # Run a single command with dev tools (doesn't persist)
          flox activate -r dev -- act push

          # Edit your default environment
          flox edit

          # Update default environment's packages
          flox update

          # Add a new package to default environment
          flox install <package-name>

          # Search for packages
          flox search <package-name>

          # Show what's installed in current environment
          flox list

          # Show all environments
          flox list --all


          # ============================================================================
          # PART 6: SHELL INTEGRATION (AUTOMATIC!)
          # ============================================================================

          # Flox automatically integrates with your shell!
          # When you install flox, it adds this to your ~/.zshrc (or ~/.bashrc):

          # eval "$(flox activate)"

          # This means your default environment is ALWAYS ready when you open a terminal.
          # No manual activation needed! 🎉


          # ============================================================================
          # TIPS & TRICKS
          # ============================================================================

          # TIP 1: Add custom initialization to your default environment
          flox edit
          # Then add in the [hook] section:
          # [hook]
          # on-activate = '''
          #   export AWS_PROFILE=my-profile
          #   export EDITOR=nvim
          #   echo "🚀 Ready to code!"
          # '''

          # TIP 2: Create shell aliases for common dev activations
          echo 'alias devmode="flox activate -r dev"' >> ~/.zshrc
          echo 'alias devrun="flox activate -r dev --"' >> ~/.zshrc

          # Then use like:
          # devmode          # Enters dev subshell
          # devrun act push  # Runs one command with dev tools

          # TIP 3: Project-specific dev environment activation
          # Add to your project's .envrc (if using direnv):
          # flox activate -r dev

          # TIP 4: Check what environment you're in
          flox list --all  # Shows all active environments

          # TIP 5: Temporarily disable default environment (rare, but useful)
          # Just deactivate flox in your shell session:
          # Remove from PATH manually or start a clean shell with: env -i bash

          echo "🎉 You're all set! Your default environment activates automatically!"
          echo "Just open a terminal and start coding!"
  Reusing, combining and updating environments:
    desc: Create reusable developer envs once, share across projects, and automatically propagate improvements
    tags: [flox]
    links:
      - https://flox.dev/docs/tutorials/multi-arch-environments

      - https://flox.dev/docs/tutorials/composition
    notes:
      - md: | #markdown
          ## TL;DR: COMPOSITION CONCEPT

          > 💡 Reuse developer envs across projects: create once, share everywhere, update automatically and spend less time setting up, more time coding

          ### Key Concepts

          - **Template:** A reusable environment with common tools (e.g., Python + Poetry) that you create once and reuse
          - **FloxHub:** Cloud registry where you push/pull environments (like Docker Hub for dev environments)
          - **Manifest:** Configuration file (`.flox/env/manifest.toml`) that defines packages and settings
          - **Composition:** Layering environments - include a template and add project-specific packages on top
          - **Copy vs Sync:** Copy creates independent snapshot; Sync stays connected to template for updates

          ### Three Ways to Use Templates

          1. **Copy (--copy):** Independent snapshot, no updates from template
          2. **Direct use:** Stays connected, run `flox pull` to get template updates
          3. **Composition:** Include template + add project-specific packages, run `flox include upgrade` to sync

      - sh: | #shell
          #!/usr/bin/env bash

          # ============================================================================
          # CASE: CREATE A TEMPLATE PROJECT
          # WHY: Having a project containing common tools to be reused in similar projects.
          # HOW: Create a project, add common/minimal tools; push it to FloxHub.
          # ============================================================================
          flox init -d /app/python_env
          flox install -d /app/python_env python312 poetry
          flox push -d /app/python_env

      - sh: | #shell
          #!/usr/bin/env bash

          # ============================================================================
          # CASE: USE THE TEMPLATE
          # WHY: Use the template as a base for a new projects; This allow to update and receive updates from the template.
          # HOW: Crete a new project; Include the template in the manifest; The new poroject uses the template as starting point.
          # ============================================================================
          flox pull -d /app/new_project lois/python_env

      - sh: | #shell
          #!/usr/bin/env bash

          # ============================================================================
          # CASE: USE A COPY OF THE TEMPLATE
          # WHY: For temporary projects or quick testing; tools disconnected from template updates
          # HOW: Creates an independent snapshot based on the template; changes to the template won't affect this copy.
          # ============================================================================
          flox pull -d /app/new_project --copy lois/python_env

      - sh: | #shell
          #!/usr/bin/env bash

          # ============================================================================
          # WHAT: COMPOSE (Template + Project-Specific Packages)
          # WHY: Need template tools PLUS project-specific packages (best of both worlds)
          # HOW: Create new env, include template in manifest, add project deps, upgrade to sync
          # ============================================================================
          flox init -d /app/composed_python_project
          flox edit -d /app/composed_python_project  # Add to manifest: { remote = "lois/python_env" }
          flox install -d /app/composed_python_project python312Packages.pytest
          flox include upgrade -d /app/composed_python_project  # Get template updates
  Flox useful commands and workflows:
    desc: Useful commands and workflows for Flox
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/multi-arch-environments]
    notes:
      - sh: | #shell
          #!/usr/bin/env bash

          # Create and push an environment
          flox init -d /app/python_base
          flox install -d /app/python_base python312Packages.pytest
          flox push -d /app/python_base

          # Create a new project based on a existing project on FloxHub
          flox pull -d /app/first_project lois/python_base
          flox edit -d /app/first_project
          flox list -d -c /app/first_project
          flox install -d /app/first_project python312Packages.pytest
          flox include upgrade -d /app/first_project
          flox edit -d /app/first_project

          # Create a ephemeral project based on a existing project on FloxHub using a copy
          flox pull -d /app/second_project --copy lois/python_base
          flox edit -d /app/second_project
          flox list -d -c /app/second_project
          flox include upgrade -d /app/second_project
          flox edit -d /app/second_project
          # Add environments 'remote = "lois/python_base"' to the [include] section
          flox include upgrade -d /app/second_project
          flox list -d /app/second_project
          flox list -d -c /app/second_project

          # Useful commands
          flox envs
          flox envs -a
          flox update
          flox include upgrade

commands:
  curl -fL https://downloads.flox.dev/by-env/stable/osx/flox-1.11.0.aarch64-darwin.pkg -o /tmp/flox.pkg && sudo installer -pkg /tmp/flox.pkg -target /usr/local/bin && rm /tmp/flox.pkg && flox --version:
    desc: Download and install/update Flox in a Mac (Arm64) using curl
    tags: [flox]
    links: [https://flox.dev/docs/install-flox/install/#__tabbed_1_3]
  wget -O /tmp/flox.deb https://downloads.flox.dev/by-env/stable/deb/flox-1.11.0.aarch64-linux.deb && sudo dpkg -i /tmp/flox.deb && rm /tmp/flox.deb && flox --version:
    desc: Download and install Flox in a Debian (Arm64) using wget
    tags: [flox]
    links: [https://flox.dev/docs/install-flox/install/#__tabbed_1_3]
  sudo apt update && sudo apt --only-upgrade install flox && flox --version:
    desc: Upgrade existing Flox installation Debian/Ubuntu using apt
    tags: [flox]
    links: [https://flox.dev/docs/install-flox/install/#__tabbed_1_3]
  sudo apt-get purge flox && sudo apt-get autoremove:
    desc: Uninstall Flox in a Debian/Ubuntu using apt and remove unused dependencies
    tags: [flox]
    links: [https://flox.dev/docs/install-flox/uninstall/#__tabbed_1_3]
  cd ~ && flox init:
    desc: Create a Flox Default Environment at the home directory
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  echo 'eval "$(flox activate -d ~ -m run)"' >> ~/.bashrc:
    desc: Add the Flox Default Environment to the ~/.bashrc file
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  echo 'eval "$(flox activate -d ~ -m run)"' >> ~/.bashrc && source ~/.bashrc:
    desc: Add the Flox Default Environment to the ~/.bashrc file and source it
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  echo 'eval "$(flox activate -d ~ -m run)"' >> ~/.bashrc && sudo flox activate -d "$HOME":
    desc: Add the Flox Default Environment to the ~/.bashrc file and activate it at the home directory
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  echo 'eval "$(flox activate -d ~ -m run)"' >> ~/.zshrc:
    desc: Add the Flox Default Environment to the ~/.zshrc file
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  echo 'eval "$(flox activate -d ~ -m run)"' >> ~/.zshrc && source ~/.zshrc:
    desc: Add the Flox Default Environment to the ~/.zshrc file and source it
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  echo 'eval "$(flox activate -d ~ -m run)"' >> ~/.zshrc && sudo flox activate -d "$HOME":
    desc: Add the Flox Default Environment to the ~/.zshrc file and activate it at the home directory
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  flox activate -d "$HOME":
    desc: Activate the Flox Default Environment at the home directory
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment]
  flox install curl gitFull gnupg inetutils tree neovim:
    desc: Install curl, gitFull, gnupg, inetutils, tree and neovim at once in the current environment
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment/#installing-packages]
  flox install -d ~ curl gitFull gnupg inetutils tree neovim:
    desc: Install curl, gitFull, gnupg, inetutils, tree and neovim at once to the default environment
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/layering-multiple-environments/#install-packages]
  cd ~ && flox pull roalcantara/default:
    desc: Pull the default environment from FloxHub keeping it in sync with the upstream (linking the two machines). This means that if a package is installed on the upstream, it will also be installed on this machine.
    tags: [flox]
    links: [https://flox.dev/docs/tutorials/default-environment/#sharing]
  cd ~ && flox pull --copy roalcantara/default:
    desc: Pull the default environment from FloxHub using it as a starting point (without linking the two machines). This allows you to install/uninstall packages all you like and it won't affect any other machine.
    tags: [flox]
