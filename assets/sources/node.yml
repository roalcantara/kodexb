    tags: [nx]
    links: [https://nx.dev/nx-api/js/generators/convert-to-swc]
  npx nx generate @nx/workspace:convert-to-nx-project --project <PROJECT>:
    desc: Use project.json instead of workspace.json
    tags: [nx]
  npx nx generate @nx/workspace:convert-to-nx-project --all:
    desc: Split workspace.json into project.jsons
    tags: [nx]
  npx nx generate @nx/workspace:library <NAME>:
    desc: Add library to workspace
    tags: [nx]
  npx nx generate @nx/workspace:library <NAME> --buildable:
    desc: Add buildable library to workspace
    tags: [nx]
