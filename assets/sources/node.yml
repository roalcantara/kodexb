bookmarks:
  https://nodejs.org:
    desc: Node.js® is a JavaScript runtime built on Chrome's V8 JavaScript engine
    tags: [node]
    links: [https://nodejs.org/en/download]
    notes:
      - sh: |
          #! /bin/bash
          # Download and install nvm:
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash

          # in lieu of restarting the shell
          \. "$HOME/.nvm/nvm.sh"

          # Download and install Node.js:
          nvm install 22

          # Verify the Node.js version:
          node -v # Should print "v22.18.0".
          nvm current # Should print "v22.18.0".

          # Verify npm version:
          npm -v # Should print "10.9.3".
      - dockerfile: |
          FROM node:22
          WORKDIR /app
          COPY package*.json ./
          RUN npm install
          COPY . .
          CMD ["npm", "start"]
  https://nodejs.org/en/download:
    desc: Download Node.js® LTS | JavaScript runtime built on Chrome's V8 JavaScript engine
    tags: [node]
  https://npmjs.com:
    desc: The package manager for JavaScript
    tags: [node, npm]
  https://yarnpkg.com:
    desc: Fast, reliable, and secure dependency management
    tags: [node, yarn]
  https://pnpm.io:
    desc: Fast, disk space efficient package manager
    tags: [node, pnpm]
    links:
      - https://pnpm.io/motivation
      - https://pnpm.io/catalogs
      - https://pnpm.io/pnpm-cli
  https://pnpm.io/catalogs:
    desc: Catalogs are a workspace feature for defining dependency version ranges as reusable constants. Constants defined in catalogs can later be referenced in package.json files.
    tags: [node, pnpm]
    links: [https://youtu.be/PuRUk4mV2jc]
  https://digitalocean.com/community/tutorials/how-to-use-multithreading-in-node-js:
    desc: How to Use Multithreading in Node.js
    tags: [node]
    notes:
      - md: | #markdown
          ### KEY TAKEAWAYS

          - Worker Threads in Node.js v20+ provide true parallelism for CPU-heavy tasks without blocking the event loop
          - Production workloads require pooling (Piscina, Poolifier), resource limits, observability, and lifecycle controls to remain reliable
          - Queue-backed APIs, structured error handling, and container resource quotas keep multithreaded workloads stable at scale
          - Monitoring thread utilization, heap growth, and queue depth is essential before shipping to production

          ### CORE CONCEPTS:

          - **Main thread safety:** Keep request handling, logging, and orchestration in the main event loop
          - **Worker communication:** Use structured cloning via postMessage/on('message') or MessageChannel
          - **SharedArrayBuffer and Atomics:** Enable zero-copy synchronization when you need shared state
          - **resourceLimits:** Bound heap and stack usage per worker to prevent denial-of-service attacks
  https://digitalocean.com/community/tutorials/understanding-the-event-loop-callbacks-promises-and-async-await-in-javascript:
    desc: Understanding the Event Loop, Callbacks, Promises, and Async/Await in JavaScript
    tags: [node]
    notes:
      - md: | #markdown
          ### KEY TAKEAWAYS

          - Worker Threads in Node.js v20+ provide true parallelism for CPU-heavy tasks without blocking the event loop
          - Production workloads require pooling (Piscina, Poolifier), resource limits, observability, and lifecycle controls to remain reliable
          - Queue-backed APIs, structured error handling, and container resource quotas keep multithreaded workloads stable at scale
          - Monitoring thread utilization, heap growth, and queue depth is essential before shipping to production

          ### CORE CONCEPTS:

          - **Main thread safety:** Keep request handling, logging, and orchestration in the main event loop
          - **Worker communication:** Use structured cloning via postMessage/on('message') or MessageChannel
          - **SharedArrayBuffer and Atomics:** Enable zero-copy synchronization when you need shared state
          - **resourceLimits:** Bound heap and stack usage per worker to prevent denial-of-service attacks
cheats:
  Nx Environment Variables:
    desc: Environment variables for Nx
    tags: [nx]
    notes:
      - yaml: | #yaml
          # Nx Environment Variables for Production (npx nx build @org/project --prod)
          production:
            NX_CLI_SET: 'true',
            NX_LOAD_DOT_ENV_FILES: 'true',
            NX_TASK_TARGET_TARGET: 'build',
            NX_TASK_HASH: '12495952746629250605',
            NX_TASK_TARGET_PROJECT: '@org/project',
            NX_WORKSPACE_ROOT: '${HOME}/Work/node/project',
            NX_TUI: 'false',
            NX_VERBOSE_LOGGING: 'false',
            NX_PSEUDO_TERMINAL_EXEC_ARGV: '',
            NX_TASK_TARGET_CONFIGURATION: 'production',
            NX_FORKED_TASK_EXECUTOR: 'true',
            NODE_ENV: 'production'

          # Nx Environment Variables for Development (npx nx build @org/project --dev)
          development:
            NX_CLI_SET: 'true',
            NX_LOAD_DOT_ENV_FILES: 'true',
            NX_TASK_TARGET_TARGET: 'build',
            NX_TASK_HASH: '9014668638238143481',
            NX_TASK_TARGET_PROJECT: '@org/project',
            NX_WORKSPACE_ROOT: '${HOME}/Work/node/project',
            NX_TUI: 'false',
            NX_VERBOSE_LOGGING: 'false',
            NX_PSEUDO_TERMINAL_EXEC_ARGV: '',
            NX_TASK_TARGET_CONFIGURATION: 'development',
            NX_FORKED_TASK_EXECUTOR: 'true',
            NODE_ENV: 'development'
commands:
  npm init -y:
    desc: Initialize a new npm project
    tags: [npm]
  # NPM CONFIG COMMANDS
  npm config ls -l:
    desc: List set of configuration parameters that are internal to npm, and are defaults if nothing else is specified
    tags: [npm]
  npm config edit:
    desc: Opens the config file in an editor
    tags: [npm]
  npm config edit --global:
    desc: Opens the global config file in an editor
    tags: [npm]
  npm config list --json:
    desc: List all config settings [JSON]
    tags: [npm, config]
  npm config set init-author-name'Rogério R. Alcântara' && npm config set init-author-email'rogerio.alcantara@gmail.com' && npm config set init-author-url'http://github.com/roalcantara' && npm config set init-license'MIT':
    desc: Sets Default npm init Properties
    tags: [npm, config]
  npm prefix -g:
    desc: Print the local prefix to standard output
    tags: [npm, config]
  npm config get prefix:
    desc: Get npm prefix. This is the closest parent directory to contain a package.json file or node_modules directory
    tags: [npm, config]
  npm config set prefix <PATH=/usr/local>:
    desc: Set npm prefix. This is the closest parent directory to contain a package.json file or node_modules directory
    tags: [npm, config]
  npm prefix:
    desc: Print the local prefix to standard output. This is the closest parent directory to contain a package.json file or node_modules directory
    tags: [npm, config]
