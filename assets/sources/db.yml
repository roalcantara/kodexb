          Relationships are not as inherent. Often uses embedded documents and arrays to represent relationships.

          ### ACID Properties
          May prioritize performance and scalability over strict adherence to ACID properties, though some modern document databases also support ACID transactions.

          ### Examples
            - Amazon Timestream
            - Amazon DynamoDB
            - Amazon ElastiCache
            - Redis
            - Memcached
  libsql CLI vs sqlite3 CLI:
    desc: Differences between libsql CLI and sqlite3 CLI
    tags: [db]
    links: [https://turso.tech/libsql, https://sqlite.org]
    notes:
      - md: | #markdown
          ## libSQL Advantages for Development

          ### 1. Feature Parity with Production

          If you deploy to Turso, using libsql locally ensures exact same behavior:

          ```sh
          # Local development with libsql
          libsql moviedb.sqlite

          # Production with Turso
          # Same SQL dialect, same features, same behavior
          ```

          ### 2. WebAssembly User-Defined Functions

          1. Only works with libsql, not sqlite3

              ```sql
              CREATE FUNCTION hello(name TEXT)
              LANGUAGE wasm
              AS '/path/to/hello.wasm';

              SELECT hello('World'); -- Returns: Hello, World!
              ```

          2. Example WASM function (Rust):

              ```rust
              // hello.rs
              #[no_mangle]
              pub extern "C" fn hello(name: *const u8, len: usize) -> *const u8 {
                  // Custom logic
                  format!("Hello, {}!", name).as_ptr()
              }
              ```

          ### 3. Randomized ROWID

          ```sql
          -- libsql: ROWIDs are randomized by default
          -- Better security (no sequential ID guessing)
          CREATE TABLE users (
            id INTEGER PRIMARY KEY, -- Random instead of sequential
            name TEXT
          );

          -- sqlite3: ROWIDs are sequential (1, 2, 3...)
          -- Potential security issue if exposed
          ```

          ### 4. Vector Search Extensions

          ```sql
          -- libsql supports vector embeddings (useful for AI features)
          CREATE VIRTUAL TABLE movie_embeddings USING vec0(
            embedding FLOAT[384]
          );

          -- Search for similar movies
          SELECT * FROM movie_embeddings
          WHERE embedding MATCH vector('[0.1, 0.2, ...]')
          ORDER BY distance
          LIMIT 10;
          ```

          ### 5. Better JSON Support

          ```sql
          -- libsql has enhanced JSON functions
          -- Same as SQLite but with additional operators:

          --- Example: Extracting data from JSON
          CREATE TABLE movies (id INTEGER PRIMARY KEY, metadata JSON);
          INSERT INTO movies (metadata) VALUES ('{"title": "Inception", "director": "Nolan"}');
          SELECT json_extract(metadata, '$.director') FROM movies;

          -- More JSON functions available in libsql
          SELECT json_set(metadata, '$.year', 2010) FROM movies;
          ```

          ### 6. Improved CLI Experience

          ```sh
          # libsql CLI has additional features
          libsql mydb.sqlite
          .help  -- More commands available
          .mode json  -- Output results as JSON
          .schema  -- View database schema
          .exit  -- Exit the CLI
          ```
      - md: | #markdown
          ### Practical Comparison

          #### Using sqlite3 CLI

          ```sh
          $ sqlite3 moviedb.sqlite

          SQLite version 3.43.0
          sqlite> .tables
          movies  cast  crew

          sqlite> SELECT title FROM movies LIMIT 3;
          Inception
          The Dark Knight
          Interstellar

          sqlite> .exit
          ```

          #### Using libsql CLI

          ```sh
          $ libsql moviedb.sqlite

          libSQL version 0.2.1 (based on SQLite 3.43.0)
          libsql> .tables
          movies  cast  crew

          libsql> SELECT title FROM movies LIMIT 3;
          Inception
          The Dark Knight
          Interstellar

          # Same commands, same experience
          libsql> .exit
          ```
  Trino, a query engine that runs at ludicrous speed:
    desc: Distributed SQL query engine designed to query large data sets distributed over one or more heterogeneous data sources
    tags: [db, sql]
    links: [https://trino.io/docs/current/client/cli.html, https://trino.io/docs/current/glossary.html, https://youtu.be/SnvSBYhRZLg, https://starburst.io]
    notes:
      - sh: | #shell
          #!/bin/bash

          # TRINO's CHEATSHEET
          # Distributed SQL query engine designed to query large data sets distributed over one or more heterogeneous data sources

          # 1. Run trinodb container with a default configuration (containing some catalogs to explore) mounted at /etc/trino
          docker run --rm -i --name trino -d -p 8080:8080 trinodb/trino

          # 2. The default server URL in the CLI matches the port used in the command to start the container (-p 8080:8080)
          open http://localhost:8080

          # 3. Execute queries in the existing Trino server container
          docker exec -it trino trino

          # 4. After starting the client, type and execute a query example data
          # trino>
          select count(*) from tpch.sf1.nation;
          # _col0
          # -------
          #     25
          # (1 row)
          #
          # Query 20250908_195801_00000_3enfm, FINISHED, 1 node
          # Splits: 13 total, 13 done (100.00%)
          # 1.27 [25 rows, 0B] [19 rows/s, 0B/s]

          # 5. When you are done with your exploration enter the quit command
          # trino>
          quit;

          # CONTAINER CONFIGURATIONS

          # 6. To customise the configuration files (rather than using the image's defaults) mounts /etc/trino
          docker run --name trino -d -p 8080:8080 --volume $PWD/etc:/etc/trino trinodb/trino

          # 7. To keep the default configuration and only configure catalogs, mounts /etc/trino/catalog - or individual catalog property files in it
          docker run --name trino -d -p 8080:8080 --volume $PWD/etc/catalog:/etc/trino/catalog trinodb/trino

          # 8. To use additional plugins mounts /usr/lib/trino/plugin
          docker run --name trino -d -p 8080:8080 --volume $PWD/plugins:/usr/lib/trino/plugin trinodb/trino

          # 14. Stop the trinodb container
          docker stop trino

          # 15. To start trinodb container
          docker start trino

          # 16. To remove a stopped trinodb container
          docker rm trino
      - sh: | #shell
          #!/bin/bash

          # TRINO's DYNAMIC CATALOG CHEATSHEET
          # Distributed SQL query engine designed to query large data sets distributed over one or more heterogeneous data sources

          # 1. To avoid having to create catalog files and mount them in the container enable dynamic catalog management
          docker run --name trino -d -p 8080:8080 -e CATALOG_MANAGEMENT=dynamic trinodb/trino

          # 2. To make dynamic catalog changes persistent across container restarts mounts /etc/trino/catalog
          docker run --name trino -d -p 8080:8080 -e CATALOG_MANAGEMENT=dynamic --volume $PWD/etc/catalog:/etc/trino/catalog trinodb/trino

          # 3. Execute queries in the existing Trino server container
          docker exec -it trino trino

          # 4. To create dynamic catalogs run
          # trino>
          CREATE CATALOG my_catalog WITH (
              connector = 'hive',
              hive.metastore.uri = 'thrift://localhost:9083'
          );

          # 5. After creating the dynamic catalog, you can use it in your queries
          # trino>
          SELECT * FROM my_catalog.my_table;

          # 6. To drop dynamic catalogs run
          # trino>
          DROP CATALOG my_catalog;

          # 7. When you are done with your exploration enter the quit command
          # trino>
          quit;

          # 8. Stop the trinodb container
          docker stop trino

          # 8. To remove a stopped trinodb container
          docker rm trino
  Top Database Types | SUMMARY:
    desc: Relational x NoSQL x Key-Value x In-memory x Wide-column x Graph x Time-series
    tags: [db]
    links:
      - Cloud Databases Cheat Sheet: https://github.com/milanm/Cloud-Product-Mapping?tab=readme-ov-file#bonus-2-cloud-databases
    notes:
      - md: | #markdown
          ![Database Types](https://github.com/milanm/Cloud-Product-Mapping/blob/main/Cloud-Databases.png?raw=true?raycast-height=250)

          | **Database Type** | **Use Cases/Ideal for**                                                                        |
          | ----------------- | ---------------------------------------------------------------------------------------------- |
          | **Relational**    | Complex queries and data integrity in structured data scenarios (financial systems)            |
          | **NoSQL**         | Apps requiring agile development, flexible schema, and working with JSON, (CMS, mobile apps)   |
          | **Key-Value**     | Simple data models and high scalability                                                        |
          | **In-memory**     | Caching, session management, gaming leaderboards, geospatial apps                              |
          | **Wide-column**   | High-scale industrial apps for equipment maintenance, fleet management, and route optimization |
          | **Graph**         | Social networking, fraud detection, recommendation engines, knowledge graphs                   |
          | **Time-series**   | Apps requiring high ingest rates and time-series analysis                                      |
  NoSQL | Document Databases:
    desc: Content management, catalogs, user profiles.
    tags: [db, nosql]
    links:
      - Cloud Databases Cheat Sheet: https://github.com/milanm/Cloud-Product-Mapping?tab=readme-ov-file#bonus-2-cloud-databases
    notes:
      - md: | #markdown
          ## Document

          > Content management, catalogs, user profiles.

          ### Use Cases
          Ideal for applications requiring agile development, flexible schema, and working with JSON data, like content management systems and mobile apps.

          ### Data Structure
          Stores data in documents (often JSON, BSON), which are more flexible and can contain nested structures.

          ### Schema
          Schema-less, allowing for varied and dynamic data structures within documents. Easier to evolve with changing data requirements.

          ### Query Language
          Uses JSON-based query languages or JavaScript-like syntax, depending on the specific database.

          ### Scaling
          Often designed for horizontal scaling (distribution across multiple servers).

          ### Relationships
          Relationships are not as inherent. Often uses embedded documents and arrays to represent relationships.

          ### ACID Properties
          May prioritize performance and scalability over strict adherence to ACID properties, though some modern document databases also support ACID transactions.

          ### Examples
            - Amazon DocumentDB
            - MongoDB
            - Amazon DynamoDB
            - Amazon ElastiCache
            - Amazon Neptune
