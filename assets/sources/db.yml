  https://trino.io:
    desc: Ludicrous fast, open source, distributed, massively parallel processing, SQL query engine to query large data sets
    tags: [db, analytic]
    links: [https://trino.io/docs/current/client/cli.html, https://trino.io/docs/current/glossary.html, https://youtu.be/SnvSBYhRZLg, https://starburst.io]
    notes:
      - md: | #markdown
          ### OVERVIEW
          Trino is a ludicrous fast, open source, distributed, massively parallel processing, SQL query engine to query large data sets across one or more heterogeneous data sources.
      - sh: | #shell
          #!/bin/bash
          brew install trino
      - md: | #markdown
          ### Glossary
          The glossary contains a list of key Trino terms and definitions

          - **Catalog:**
            - Catalogs define and name a configuration for connecting to a data source, allowing users to query the connected data.
            - Each catalog's configuration specifies a connector to define which data source the catalog connects to.
            - For more information about catalogs, see [Catalog](https://trino.io/docs/current/overview/concepts.html#trino-concept-catalog).

          - **Certificate:**
            - A public key certificate issued by a CA, sometimes abbreviated as cert, that verifies the ownership of a server's private keys.
            - Certificate format is specified in the [X.509](https://wikipedia.org/wiki/X.509) standard.

          - **Certificate Authority (CA):**
            - A trusted organization that signs and issues certificates.
            - Its signatures can be used to verify the validity of [certificates](https://trino.io/docs/current/glossary.html#glosscert).

          - **Cluster:**
            - A Trino cluster provides the resources to run queries against numerous data sources.
            - Clusters define the number of nodes, the configuration for the JVM runtime, configured data sources, and others aspects.
            - For more information, see [Cluster](https://trino.io/docs/current/overview/concepts.html#trino-concept-cluster).

          - **Connector:**
            - Translates data from a data source into Trino schemas, tables, columns, rows, and data types.
            - A connector is specific to a data source, and is used in catalog configurations to define what data source the catalog connects to.
            - A connector is one of many types of [plugins](https://trino.io/docs/current/glossary.html#glossplugin)

          - **Container:**
            - A lightweight virtual package of software that contains libraries, binaries, code, configuration files, and other dependencies needed to deploy an application.
            - A running container does not include an operating system, instead using the operating system of the host machine.
            - To learn more, read about [containers](https://kubernetes.io/docs/concepts/containers) in the Kubernetes documentation.

          - **Data source:**
            - A system from which data is retrieved - for example, PostgreSQL or Iceberg on S3 data.
            - In Trino, users query data sources with catalogs that connect to each source.
            - See [Data source](https://trino.io/docs/current/overview/concepts.html#trino-concept-data-source) for more information.

          - **Data virtualization:**
            - [Data virtualization](https://wikipedia.org/wiki/Data_virtualization) is a method of abstracting an interaction with multiple heterogeneous data sources, without needing to know the distributed nature of the data, its format, or any other technical details involved in presenting the data.

          - **gzip:**
            - [gzip](https://wikipedia.org/wiki/Gzip) is a compression format and software that compresses and decompresses files.
            - This format is used several ways in Trino, including deployment and compressing files in object storage.
            - The most common extension for gzip-compressed files is .gz.

          - **HDFS:**
            - [Hadoop Distributed Filesystem (HDFS)](https://wikipedia.org/wiki/Apache_Hadoop#HDFS) is a scalable open source filesystem that was one of the earliest distributed big data systems created to store large amounts of data for the Hadoop ecosystem.

          - **Java KeyStore (JKS):**
            - The system of public key cryptography supported as one part of the Java security APIs.
            - The legacy JKS system recognizes keys and certificates stored in keystore files, typically with the .jks extension, and by default relies on a system-level list of CAs in truststore files installed as part of the current Java installation.

          - **Key:**
            - A cryptographic key specified as a pair of public and private strings generally used in the context of TLS to secure public network traffic.

          - **Load Balancer (LB):**
            - Software or a hardware device that sits on a network edge and accepts network connections on behalf of servers behind that wall, distributing traffic across network and server infrastructure to balance the load on networked services.

          - **Object storage:**
            - [Object storage](https://en.wikipedia.org/wiki/Object_storage) is a file storage mechanism.
            - Examples of compatible object stores include the following:
              - [Amazon S3](https://aws.amazon.com/s3)
              - [Google Cloud Storage](https://cloud.google.com/storage)
              - [Azure Blob Storage](https://azure.microsoft.com/en-us/products/storage/blobs)
              - [MinIO](https://min.io) and other S3-compatible stores
              - [HDFS](https://trino.io/docs/current/glossary.html#glosshdfs)

          - **Open-source:**
            - Typically refers to open-source software. which is software that has the source code made available for others to see, use, and contribute to.
            - Allowed usage varies depending on the license that the software is licensed under.
            - Trino is licensed under the Apache license, and is therefore maintained by a community of contributors from all across the globe.

          - **PEM file format:**
            - A format for storing and sending cryptographic keys and certificates.
            - PEM format can contain both a key and its certificate, plus the chain of certificates from authorities back to the root CA, or back to a CA vendor's intermediate CA.

          - **PKCS #12:**
            - A binary archive used to store keys and certificates or certificate chains that validate a key.
            - PKCS #12 files have .p12 or .pfx extensions.
            - This format is a less popular alternative to PEM.

          - **Plugin:**
            - A bundle of code implementing the Trino Service Provider Interface (SPI). that is used to add new functionality.
            - More information is available in [Plugins](https://trino.io/docs/current/installation/plugins.html).

          - **Presto and PrestoSQL:**
            The old name for Trino. To learn more about the name change to Trino, read the history.

          - **Query federation:**
            - A type of data virtualization that provides a common access point and data model across two or more heterogeneous data sources.
            - A popular data model used by many query federation engines is translating different data sources to SQL tables.

          - **Secure Sockets Layer (SSL):**
            - Now superseded by [TLS](https://trino.io/docs/current/glossary.html#glosstls), but still recognized as the term for what TLS does.

          - **Structured Query Language (SQL):**
            - The standard language used with relational databases.
            - For more information, see SQL.

          - **Tarball:**
            - A common abbreviation for [TAR file](https://wikipedia.org/wiki/Tar_(computing)), which is a common software distribution mechanism.
            - This file format is a collection of multiple files distributed as a single file, commonly compressed using gzip compression.

          - **Transport Layer Security (TLS):**
            - TLS is a security protocol designed to provide secure communications over a network.
            - It is the successor to SSL, and used in many applications like HTTPS, email, and Trino.
            - These security topics use the term TLS to refer to both TLS and SSL.
  https://surrealdb.com:
    desc: Native, open-source, multi-model database that lets you store and manage data across relational, document, graph, time-series, vector & search, and geospatial models—all in one place.
    tags: [db, nosql, graph, vector]
    links: [https://youtu.be/TyX45cyZ-W0]
    notes:
      - md: | #markdown
          ## Overview

          - Native, open-source, multi-model database within a single database system
          - Store and manage data across various models including;
            - relational
            - document
            - graph
            - time-series
            - vector & search
            - geospatial

          ### Key Features

          - **Native multi-model:**

            - combines document, graph, time-series, relational,
            - geospatial and key-value data models natively into SurrealQL,
            - without workarounds or added complexity.

          - **AI native data layer:**

            - purpose-built for AI and context-aware applications
            - with integrated search and retrieval (vector, full-text, hybrid)
            - blending semantic, graph, and relational intelligence.

          - **Real-time and event-driven:**

            - built-in real-time subscriptions, event triggers, and streaming updates power reactive, real-time experiences
            - no need for Kafka, WebSockets, or extra layers.

          - **Powerful developer experience:**

            - SurrealQL is intuitive and combines the best ideas from SQL,
            - NoSQL and graph within a single native syntax.
            - Start schemaless and go schemafull.

          - **Rust-powered performance:**

            - high efficiency, memory safety
            - compliance with government security standards
            - with a single Rust binary.

          - **Native ACID compliance:**

            - guarantees strong data consistency natively
            - without additional workarounds.

          - **Deployment flexibility:**

              - Single Rust binary and storage/compute separation allow SurrealDB to run in a single node or in a highly-scalable distributed cluster:
                - embedded (in-app),
                - in the browser (via WebAssembly)
                - as a traditional back-end.

          - **Secure by design:**

              - keep data protected by default:
                - built-in security with RBAC
                - record-level permissions,
                - fine-grained access controls,
                - JWT authentication,
                - multi-tenant isolation built-in compliance (SOC 2, ISO 27001)
      - sh: | #shell
          #!/bin/bash
          # Install both the command-line tools, and the SurrealDB server as a single executable.
          brew install surrealdb/tap/surreal
      - sh: | #shell
          #!/bin/bash
          # Install on Linux
          curl -sSf https://install.surrealdb.com | sh
      - sh: | #shell
          #!/bin/bash
          # Install on Docker
          docker run --rm --pull always -p 8000:8000 surrealdb/surrealdb:latest start
