          - You need to control the consumption of resources.
          - Problems involve rate limiting or throttling.
          - You want to solve problems involving controlling the flow of data or requests.
      - md: |

          ### Python

          ```python
          class LeakyBucket:
              def __init__(self, capacity, refill_rate):
                  self.capacity = capacity
                  self.bucket_level = 0
                  self.refill_rate = refill_rate
                  self.last_refill_time = time.time()

              def consume(self, tokens):
                  if tokens <= self.capacity - self.bucket_level:
                      self.bucket_level += tokens
                      return True
                  return False

              def refill(self):
                  now = time.time()
                  tokens_to_add = (now - self.last_refill_time) * self.refill_rate
                  self.bucket_level = max(0, self.bucket_level - tokens_to_add)
                  self.last_refill_time = now
          ```
