      - md: |
          ## Fast & Slow Pointers

          It uses two pointers to solve a problem.
          Useful when dealing with linked lists and the constraint is to find a cycle in the list or determine the middle of the list.

          ### How It Works

          1. Start by defining two pointers, slow and fast, that point to the head of the linked list.
          2. While the fast pointer is not None and the next node of the fast pointer is not None, proceed as follows:
            1. Move the slow pointer one step forward.
            2. Move the fast pointer two steps forward.
            3. If the slow pointer is equal to the fast pointer, a cycle is detected.
          3. If the fast pointer reaches the end of the list, the slow pointer is at the middle of the list.

          ### Key Indicators

          - You need to find a cycle in a linked list.
          - Problems involve checking for palindromes in linked lists.
          - You want to find the middle of a linked list.
          - You need to detect the presence of a loop in a linked list.

      - md: |

          ### Python

          ```python
          def has_cycle(head):
              slow = head
              fast = head
              while fast and fast.next:
                  slow = slow.next
                  fast = fast.next.next
                  if slow == fast:
                      return True
              return False
