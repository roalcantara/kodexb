          # 150. Evaluate Reverse Polish Notation

          You are given an array of strings tokens that represents an arithmetic expression in a Reverse Polish Notation.

          Evaluate the expression. Return an integer that represents the value of the expression.

          Note that:

              * The valid operators are '+', '-', '*', and '/'.
              * Each operand may be an integer or another expression.
              * The division between two integers always truncates toward zero.
              * There will not be any division by zero.
              * The input represents a valid arithmetic expression in a reverse polish notation.
              * The answer and all the intermediate calculations can be represented in a 32-bit integer.

          ## CONSTRAINTS

              * 1 <= tokens.length <= 104
              * tokens[i] is either an operator: "+", "-", "*", or "/", or an integer in the range [-200, 200].

          ## HOW-TO

              1. Create a stack to store the numbers.
              2. Iterate over the tokens.
              3. If the token is a number, push it to the stack.
              4. If the token is an operator, pop two numbers from the stack, apply the operator and push the result back to the stack.
              5. The result will be the only element in the stack.

          ## COMPLEXITY

              - **Time Complexity**: O(n)
              - **Space Complexity**: O(n)
      - md: |
          ## Python

          ```python
          from typing import List
          from operator import add, mul


          def evaluate_reverse_polish_notation(tokens: List[str]) -> int:
              def divide(one, other) -> int:
                  return int(other / one)

              def subtract(one, other) -> int:
                  return other - one

              op = {"+": add, "-": subtract, "*": mul, "/": divide}
              stack = []

              for c in tokens:
                  if c in op:
                      stack.append(op[c](stack.pop(), stack.pop()))
                  else:
                      stack.append(int(c))

              return stack[0]
          ```
      - md: |
          ## Ruby

          ```ruby
          def evaluate_reverse_polish_notation(tokens)
            op = {
              '+': ->(one, other) { one + other },
              '-': ->(one, other) { other - one },
              '*': ->(one, other) { one * other },
              '/': ->(one, other) { (other.to_f / one).to_i }
            }
            stack = []

            tokens.each do |c|
              if op.key?(c.to_sym)
                stack.push(op[c.to_sym].call(stack.pop, stack.pop))
              else
                stack.push(c.to_i)
              end
            end

            stack[0]
          end
          ```
      - md: |
          ## Kotlin

          ```kotlin
          fun evaluate_reverse_polish_notation(tokens: Array<String>): Int {
              val stack = mutableListOf<Int>()
              val op = mapOf(
                  "+" to { one: Int, other: Int -> one + other },
                  "-" to { one: Int, other: Int -> other - one },
                  "*" to { one: Int, other: Int -> one * other },
                  "/" to { one: Int, other: Int -> (other.toFloat() / one).toInt() }
              )

              for (c in tokens) {
                  if (c in op) {
                      stack.add(op[c]!!.invoke(stack.last(), stack.last()))
                  } else {
                      stack.add(c.toInt())
                  }
              }

              return stack.last()
          }
          ```
