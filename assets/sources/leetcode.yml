          42. Trapping Rain Water

          Given n non-negative integers representing an elevation map where the width of each bar is 1,
          compute how much water it can trap after raining.

          [rainwatertrap](https://assets.leetcode.com/uploads/2018/10/22/rainwatertrap.png)

          ## CONSTRAINTS

            * n == height.length      (N is the length of the input array)
            * 1 <= n <= 2 * 10^4      (N is less than or equal to 20000)
            * 0 <= height[i] <= 10^5  (each element is less than or equal to 100000)

          ## HOW-TO

            1. Use two pointers, left and right, to traverse the array.
            2. Left pointer starts at 0 and right pointer starts at the end of the array.
            3. Keep track of the max height from the left and right.
            4. If the max height from the left is less than the max height from the right, move the left pointer.
            5. If the max height from the right is less than the max height from the left, move the right pointer.
            6. Calculate the trapped water.
            7. Return the total trapped water.

          ## COMPLEXITY

            - **Time Complexity**: O(n)
            - **Space Complexity**: O(1)
      - md: |

          ## Python

          ```python
          from typing import List

          def trap(height: List[int]):
            left, r = 0, len(height) - 1
            max_left = height[left]
            max_right = height[r]
            res = 0

            while left < r:
                if max_left < max_right:
                    left += 1
                    max_left = max(max_left, height[left])
                    res += max_left - height[left]
                else:
                    r -= 1
                    max_right = max(max_right, height[r])
                    res += max_right - height[r]

            return res
          ```
