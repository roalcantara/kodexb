      - md: |
          # 981. Time Based Key-Value Store

          Design a time-based key-value data structure that can store multiple values
          for the same key at different time stamps and retrieve the key's value at a certain timestamp.

          Implement the TimeMap class:

          - TimeMap() Initializes the object of the data structure.
          - void set(String key, String value, int timestamp) Stores the key key with the value value at the given time timestamp.
          - String get(String key, int timestamp) Returns a value such that set was called previously, with timestamp_prev <= timestamp.
            If there are multiple such values, it returns the value associated with the largest timestamp_prev. If there are no values, it returns "".

          ## CONSTRAINTS

              * 1 <= key.length, value.length <= 100
              * key and value consist of lowercase English letters and digits.
              * 1 <= timestamp <= 107
              * All the timestamps timestamp of set are strictly increasing.
              * At most 2 * 105 calls will be made to set and get.

          ## HOW-TO

              1. Initialize an empty dictionary, values, to store the key-value pairs.
              2. Implement the set method to store the key, value, and timestamp in the values dictionary.
              3. Implement the get method to retrieve the value associated with the key at the given timestamp.
                  - Retrieve the list of values associated with the key from the values dictionary.
                  - Perform a binary search on the list of values to find the value with the largest timestamp
                    less than or equal to the given timestamp.
                  - Return the value found or an empty string if no value is found.

          ## COMPLEXITY

              - **Time Complexity**: O(log n) for the get method.
              - **Space Complexity**: O(n) for the values dictionary.
      - md: |
          ## Python

          ```python
          class TimeMap:
              values = {}

              def __init__(self):
                  self.values = {}

              def set(self, key: str, value: str, timestamp: int) -> None:
                  if key not in self.values:
                      self.values[key] = []

                  self.values[key].append([value, timestamp])

              def get(self, key: str, timestamp: int) -> str:
                  values = self.values.get(key, [])

                  l, r = 0, len(values) - 1
                  res = ""
                  while l <= r:
                      m = (l + r) // 2

                      if values[m][1] <= timestamp:
                          res = values[m][0]
                          l = m + 1
                      else:
                          r = m - 1

                  return res
          ```
