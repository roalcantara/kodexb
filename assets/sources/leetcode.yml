    notes:
      - md: |
          ## K-way Merge

          Merge K sorted arrays.
          Useful when dealing with problems that involve merging K sorted arrays.

          > K sorted arrays are K arrays that are sorted individually but not merged together.
          > i.e.: [1, 3, 5], [2, 4, 6], [0, 7, 8]

          ### How It Works

          1. Start by defining a heap to store the elements of the K sorted arrays.
          2. While the heap is not empty, proceed as follows:
            1. Pop the smallest element from the heap and add it to the result.
            2. If the array from which the element was popped has more elements, add the next element to the heap.
          3. Return the merged arrays.

          ### Key Indicators

          - You need to merge K sorted arrays.
          - Problems involve merging K sorted lists or arrays.
          - You want to solve problems involving K-way merging.

      - md: |

          ### Python

          ```python
          import heapq

          def k_way_merge(arrays):
              heap = []
              result = []
              for i, array in enumerate(arrays):
                  if array:
                      heapq.heappush(heap, (array[0], i, 0))
              while heap:
                  val, i, j = heapq.heappop(heap)
                  result.append(val)
                  if j + 1 < len(arrays[i]):
                      heapq.heappush(heap, (arrays[i][j + 1], i, j + 1))
              return result
          ```
