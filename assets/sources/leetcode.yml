      - md: |
          # 22. Generate Parentheses

          Given n pairs of parentheses, write a function to generate all combinations of well-formed parentheses.

          ## CONSTRAINTS

              * 1 <= n <= 8

          ## HOW-TO

              1. Create a stack and an empty list to store the results.
              2. Create a recursive function to backtrack through the possible combinations.
              3. If the number of open and close parentheses is equal to n, add the combination to the results.
              4. If the number of open parentheses is less than n, add an open parenthesis and call the function recursively.
              5. If close parentheses is less than the open parentheses, add a close parenthesis and call the function recursively.
              6. Return the results.

          ## COMPLEXITY

              - **Time Complexity**: O(4^n / sqrt(n)) -
                  For each of the 2n steps, we can add either an open or close parenthesis, giving us 2^2n = 4^n steps.
                  Then, we have to validate each of the 4^n sequences, which takes O(n) time.

              - **Space Complexity**: O(4^n / sqrt(n)) - as described above.
      - md: |
          ## Python

          ```python
          from typing import List


          def generate_parentheses(n: int) -> List[str]:
              stack = []
              res = []

              def backtrack(openN, closeN):
                  if openN == closeN == n:
                      res.append("".join(stack))
                      return

                  if openN < n:
                      stack.append("(")
                      backtrack(openN + 1, closeN)
                      stack.pop()

                  if closeN < openN:
                      stack.append(")")
                      backtrack(openN, closeN + 1)
                      stack.pop()

              backtrack(0, 0)

              return res
          ```
      - md: |
          ## Ruby

          ```ruby
          def generate_parentheses(n)
            stack = []
            res = []
            backtrack = lambda do |open_n, close_n|
              if open_n == close_n && close_n == n
                res.push(stack.join)
                return
              end

              if open_n < n
                stack.push('(')
                backtrack.call(open_n + 1, close_n)
                stack.pop
              end

              if close_n < open_n
                stack.append(')')
                backtrack.call(open_n, close_n + 1)
                stack.pop
              end
            end

            backtrack.call(0, 0)
            res
          end
          ```
      - md: |
          ## Kotlin

          ```kotlin
          fun generate_parentheses(n: Int): List<String> {
              val stack = mutableListOf<String>()
              val res = mutableListOf<String>()

              fun backtrack(openN: Int, closeN: Int) {
                  if (openN == closeN && openN == n) {
                      res.add(stack.joinToString(""))
                      return
                  }

                  if (openN < n) {
                      stack.add("(")
                      backtrack(openN + 1, closeN)
                      stack.removeAt(stack.lastIndex)
                  }

                  if (closeN < openN) {
                      stack.add(")")
                      backtrack(openN, closeN + 1)
                      stack.removeAt(stack.lastIndex)
                  }
              }

              backtrack(0, 0)

              return res
          }
          ```
