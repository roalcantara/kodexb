    notes:
      - md: |
          ## Knuth-Morris-Pratt (KMP)

          A string searching algorithm that finds all occurrences of a pattern in a string.
          Useful when dealing with problems that involve string matching and searching.

          ### How It Works

          1. Start by defining a prefix table to store the length of the longest proper prefix that is also a proper suffix for each index in the pattern.
          2. While searching for the pattern in the string, proceed as follows:
            1. If the current characters of the pattern and string match, increment the indices.
            2. If the characters do not match, update the indices based on the prefix table.
          3. Return the indices of the pattern in the string.

          ### Key Indicators

          - You need to find all occurrences of a pattern in a string.
          - Problems involve string matching and searching.
          - You want to solve problems involving substring matching and searching.
      - md: |

          ### Python

          ```python
          def kmp_search(text, pattern):
              i, j = 0, 0
              prefix = [0] * len(pattern)
              while i < len(text):
                  if text[i] == pattern[j]:
                      i += 1
                      j += 1
                      if j == len(pattern):
                          return i - j
                  else:
                      if j != 0:
                          j = prefix[j - 1]
                      else:
                          i += 1
                  if i < len(text) and text[i] == pattern[j]:
                      prefix[i] = j + 1
                  else:
                      prefix[i] = 0
              return -1
          ```
  Rabin-Karp | Coding Pattern:
    desc: A string searching algorithm that finds all occurrences of a pattern in a string
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## Rabin-Karp

          A string searching algorithm that finds all occurrences of a pattern in a string.
          Useful when dealing with problems that involve string matching and searching.

          ### How It Works

          1. Start by defining a hash function to calculate the hash value of the pattern and the first window of the string.
          2. While searching for the pattern in the string, proceed as follows:
            1. If the hash values match, compare the pattern and the current window of the string.
            2. If the hash values do not match, update the hash value of the next window.
          3. Return the indices of the pattern in the string.

          ### Key Indicators

          - You need to find all occurrences of a pattern in a string.
          - Problems involve string matching and searching.
          - You want to solve problems involving substring matching and searching.
      - md: |

          ### Python

          ```python
          def rabin_karp_search(text, pattern):
              n, m = len(text), len(pattern)
              if n < m:
                  return -1
              base, mod = 26, 2**31
              hpattern, htext = 0, 0
              for i in range(m):
                  hpattern = (hpattern * base + ord(pattern[i])) % mod
                  htext = (htext * base + ord(text[i])) % mod
              if hpattern == htext:
                  return 0
              base_m = pow(base, m, mod)
              for i in range(1, n - m + 1):
                  htext = (htext * base - ord(text[i - 1]) * base_m + ord(text[i + m - 1])) % mod
                  if hpattern == htext:
                      return i
              return -1
          ```
  Z-algorithm | Coding Pattern:
    desc: A string searching algorithm that finds all occurrences of a pattern in a string
    tags: [leetcode, coding_pattern]
    links:
