          ## Backtracking

          The Backtracking pattern is a technique used to solve problems by trying all possible options and backtracking from choices that don't work.
          It's useful when dealing with problems that involve making a sequence of decisions to reach a solution.

          ### How It Works

          1. Start by defining a recursive function to explore all possible options.
          2. While exploring the options, proceed as follows:
            1. Make a choice and explore the next options.
            2. If the current choice leads to a dead end, backtrack and try another option.
          3. Return the solution when the base case is reached.

          ### Key Indicators

          - The problem involves making a sequence of decisions to reach a solution.
          - You need to explore all possible options to find a solution.
          - Problems involve finding all possible permutations or combinations.
          - You want to solve problems involving constraints or conditions.
          - The problem involves exploring multiple possibilities incrementally.
          - There are decision points or constraints that necessitate trying out different options.
          - You need to find all possible solutions or satisfy specific conditions through an exhaustive search.

          ### Applications

          - Solving puzzles like Sudoku and N-Queens.
          - Generating permutations and combinations.
          - Searching for paths in graphs and trees.
          - Constraint satisfaction problems (e.g., the traveling salesman problem).
          - Game-playing algorithms (e.g., chess AI).
      - md: |

          ### Python (Template)

          ```python
          def backtrack(curr, OTHER_ARGUMENTS...):
              if BASE_CASE:
                  # Modify the answer according to the problem's requirements
                  return

              ans = 0
              for ITERATE_OVER_INPUT:
                  # Modify the current state according to the problem's requirements
                  ans += backtrack(curr, OTHER_ARGUMENTS...)
                  # Undo the modification of the current state (backtrack)

              return ans
