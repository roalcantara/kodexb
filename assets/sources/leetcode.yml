    notes:
      - md: |
          ## Depth-First Search (DFS)

          The Depth-First Search (DFS) pattern uses a stack to solve a problem.
          It's useful when dealing with a tree or graph and the constraint is to traverse the structure as deeply as possible.

          ### How It Works

          1. Start by defining a stack to store the nodes of the tree or graph.
          2. While the stack is not empty, proceed as follows:
            1. Pop the top node from the stack and process it.
            2. Add the children of the processed node to the stack.
          3. Return the processed nodes.

          ### Key Indicators

          - Dealing with tree structures and need to explore specific traversal orders.
          - To check if a path exists between two nodes.
          - To find all possible paths in a graph or tree.
          - To find the connected components in a graph.
          - To find the shortest path in a weighted graph.
          - To traverse a tree or graph as deeply as possible.
          - Problems involve finding paths, calculating depth, or performing pre-order/in-order/post-order traversal.
      - md: |

          ### Python

          ```python
          def dfs(graph, start):
              stack = [start]
              visited = set()
              while stack:
                  node = stack.pop()
                  if node not in visited:
                      visited.add(node)
                      stack.extend(graph[node] - visited)
              return visited
          ```
      - md: |

          ### Using Recursion

          ```python
          def dfs(root, target):
              if root is None:  # Base case: Check if the current node is None
                  return None
              if root.val == target:  # Base case: Check if the current node value matches the target
                  return root
              left = dfs(root.left, target)  # Recursively search the left subtree
              if left is not None:  # If the target is found in the left subtree, return the result
                  return left
              return dfs(root.right, target)  # Recursively search the right subtree
          ```
