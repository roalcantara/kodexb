      - md: |
          ## Two Heaps

          The Two Heaps pattern uses two heaps to solve a problem.
          It's useful for maintaining a balanced structure.

          ### How It Works

          1. Start by defining two heaps, a max-heap and a min-heap.
          2. While iterating through the elements, proceed as follows:
            1. Add the current element to the max-heap.
            2. If the size of the max-heap exceeds the size of the min-heap, remove the largest element from the max-heap and add it to the min-heap.
            3. If the size of the min-heap exceeds the size of the max-heap, remove the smallest element from the min-heap and add it to the max-heap.
          3. Return the median or the top or bottom 'K' elements from the heaps.

          ### Key Indicators

          - To maintain a balanced structure for efficient median finding.
          - Handling sliding window problems with dynamic medians.
          - Prioritize elements in a collection based on their values.

      - md: |

          ### Python

          ```python
          import heapq

          class MedianFinder:
              def __init__(self):
                  self.max_heap = []
                  self.min_heap = []

              def add_num(self, num):
                  heapq.heappush(self.max_heap, -num)
                  heapq.heappush(self.min_heap, -heapq.heappop(self.max_heap))
                  if len(self.min_heap) > len(self.max_heap):
                      heapq.heappush(self.max_heap, -heapq.heappop(self.min_heap))

              def find_median(self):
                  if len(self.max_heap) == len(self.min_heap):
                      return (-self.max_heap[0] + self.min_heap[0]) / 2
                  return -self.max_heap[0]
          ```
      - md: |

          ### Python

          ```python
          import heapq

          class TwoHeaps:
              def __init__(self):
                  self.min_heap = []  # Right heap to store larger half
                  self.max_heap = []  # Left heap to store smaller half

              def add_num(self, num):
                  if not self.max_heap or num <= -self.max_heap[0]:
                      heapq.heappush(self.max_heap, -num)
                  else:
                      heapq.heappush(self.min_heap, num)

                  # Balance the heaps if necessary
                  if len(self.max_heap) > len(self.min_heap) + 1:
                      heapq.heappush(self.min_heap, -heapq.heappop(self.max_heap))
                  elif len(self.min_heap) > len(self.max_heap):
                      heapq.heappush(self.max_heap, -heapq.heappop(self.min_heap))

              def find_median(self):
                  if len(self.max_heap) == len(self.min_heap):
                      return (-self.max_heap[0] + self.min_heap[0]) / 2.0
                  else:
                      return -self.max_heap[0]

          # Usage:
          two_heaps = TwoHeaps()
          two_heaps.add_num(1)
          two_heaps.add_num(2)
          median = two_heaps.find_median()
          print("Median:", median)
          ```
