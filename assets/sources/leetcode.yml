  Union Find (Disjoint-Set Union/ DSU) | Coding Pattern:
    desc: Efficiently manage and solve problems involving disjoint sets or connected components
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## Union Find (Disjoint-Set Union/ DSU)

          The Union Find pattern uses a disjoint-set data structure to solve a problem.
          It's efficient for managing and solving problems involving disjoint sets or connected components.

          ### How It Works

          1. **Initialization:**
          Start with a collection of elements, each considered as a separate disjoint set.
          Assign a unique representative (often the element itself) to each set.

          2. **Union Operation:**
          To merge two sets, perform the union operation.
          Choose the representative of one set (often based on some criteria, like rank or size) and make it the parent of the representative of the other set.
          This effectively connects the two sets.

          3. **Find Operation:**
          When you need to determine the set to which an element belongs, use the find operation.
          Starting with the element in question, traverse the tree upwards to find the root node (representative) of its set.
          The path compression technique can be applied here to optimize future find operations by making the elements along the path directly point to the root.

          4. **Cycle Detection:**
          Union-Find is often used to detect cycles in graphs.
          When performing the union operation, if both elements belong to the same set (i.e., they have the same representative), it indicates the addition of an edge between nodes would create a cycle in the graph.

          5. **Optimization:**
          Various optimization techniques can be applied to improve the efficiency of Union-Find operations,
          such as union by rank and path compression.

          ### Key Indicators

          - To determine if two elements are connected.
          - To find the connected components in a graph.
          - To find the number of connected components in a graph.
          - To find the number of islands in a matrix.
      - md: |

          ### Python

          ```python
          class UnionFind:
              def __init__(self):
                  self.id = {}

              def find(self, x):
                  y = self.id.get(x, x)
                  if y != x:
                      self.id[x] = y = self.find(y)
                  return y

              def union(self, x, y):
                  self.id[self.find(x)] = self.find(y)
          ```
  Topological Sort (Graph) | Coding Pattern:
    desc: Arranging the nodes of a directed acyclic graph (DAG) in a linear order, often used in problems involving scheduling or ordering tasks with dependencies
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## Topological Sort

          > A directed acyclic graph (DAG) is a directed graph with no directed cycles.

          The Topological Sort pattern uses a directed acyclic graph (DAG) to solve a problem.
          It's useful for arranging the nodes of a directed acyclic graph (DAG) in a linear order, where each node appears before its successors.

          ### How It Works

          1. Start by defining a directed acyclic graph (DAG) to represent the dependencies between tasks.
          2. While there are nodes in the graph, proceed as follows:
            1. Find the nodes with no incoming edges (i.e., no dependencies) and add them to the result.
            2. Remove the edges from the graph that are associated with the processed nodes.
          3. Return the result.

          ### Key Indicators

          - The problem involves scheduling or ordering tasks with dependencies.
          - You're working with a directed acyclic graph (DAG).
          - Tasks need to be executed in a specific order while adhering to their dependencies.
      - md: |

          ### Python

          ```python
          def topological_sort(graph):
              in_degree = {node: 0 for node in graph}
              for node in graph:
                  for neighbor in graph[node]:
                      in_degree[neighbor] += 1

              queue = [node for node in in_degree if in_degree[node] == 0]
              result = []
              while queue:
                  node = queue.pop(0)
                  result.append(node)
                  for neighbor in graph[node]:
                      in_degree[neighbor] -= 1
                      if in_degree[neighbor] == 0:
                          queue.append(neighbor)

              if len(result) != len(graph):
                  return []

              return result
          ```
  Tries (Prefix-Tree) | Coding Pattern:
    desc: A tree-like data structure used for efficient string matching and storage of words
    tags: [leetcode, coding_pattern]
