    notes:
      - md: |
          ## Tries (Prefix-Tree)

          A Trie, also known as a Prefix Tree, is a tree-like data structure used for efficient string matching and storage of words.
          It's useful when you need to store and search for strings with common prefixes.

          ### How It Works

          1. Start by defining a TrieNode class to represent the nodes of the Trie.
          2. While inserting a word into the Trie, proceed as follows:
            1. Start from the root node and iterate through the characters of the word.
            2. For each character, check if the current node has a child node with the character.
            3. If the child node does not exist, create a new node and add it to the current node.
            4. Move to the child node and repeat the process for the next character.
          3. While searching for a word in the Trie, proceed as follows:
            1. Start from the root node and iterate through the characters of the word.
            2. For each character, check if the current node has a child node with the character.
            3. If the child node does not exist, return False.
            4. Move to the child node and repeat the process for the next character.
          4. Return True if the word is found in the Trie.

          ### Key Indicators

          - You're dealing with strings and need efficient string matching.
          - Problems involve autocomplete suggestions, spell checkers, or searching for words with common prefixes.
          - You want to store and search for words efficiently.
      - md: |

          ### Python

          ```python
          class TrieNode:
              def __init__(self, value):
                  self.value = value
                  self.children = {}
              def insert(self, s, idx):
                  # idx: index of the current character in s
                  if idx != len(s):
                      self.children.setdefault(s[idx], TrieNode(s[idx]))
                      self.children.get(s[idx]).insert(s, idx + 1)
          ```
  Dynamic Programming | Coding Pattern:
    desc: Valuable when a problem can be broken down into simpler subproblems, and the solutions to these subproblems can be combined to solve the overall problem.
    tags: [leetcode, coding_pattern]
    links:
