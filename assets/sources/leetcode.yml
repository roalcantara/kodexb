      - md: |
          Given a sorted list of numbers, the goal is to remove the duplicates in-place,
          such that each unique element appears only once.

          The function should return the new length of the list after duplicates have been removed.
          No extra memory should be used beyond the input list itself.

          ## CONSTRAINTS

              - The list may contain negative, zero, or positive numbers.
              - The list's length will not exceed 10^4.

          ## COMPLEXITY

              - **Time Complexity**: O(n), where n is the length of the list. Each element is checked once.
              - **Space Complexity**: O(1), as the operation is performed in-place with no additional storage.

          ## HOW-TO

              1. Initialize two pointers, `i` (slow-runner) and `j` (fast-runner).
              2. Iterate through the list using `j`.
              3. If the current element (`nums[j]`) is not equal to `nums[i]`, increment `i`, and copy `nums[j]` to `nums[i]`.
              5. After the loop, returns i + 1 which is the length of the list without duplicates

          ## WHEN TO USE

              With problems that can be solved in-place with O(1) extra memory.
              To remove duplicates from a sorted list of numbers and return the new length.
      - md: |

          ## Python

          ```python
          from typing import List

          def remove_duplicates(nums: List[int]) -> int:
              if not nums:
                  return 0

              i = 0
              for j in range(1, len(nums)):
                  if nums[j] != nums[i]:
                      i += 1
                      nums[i] = nums[j]

              return i + 1
          ```
      - md: |

          ## Ruby

          ```ruby
          def remove_duplicates(nums)
            return 0 if nums.empty?

            i = 0
            (1...nums.length).each do |j|
              if nums[j] != nums[i]
                i += 1
                nums[i] = nums[j]
              end
            end

            i + 1
          end
          ```
