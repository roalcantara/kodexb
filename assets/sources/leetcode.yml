      - md: |

          # 155. Min Stack

          Design a stack that supports push, pop, top, and retrieving the minimum element in constant time.

          Implement the MinStack class:

              - MinStack() initializes the stack object.
              - void push(int val) pushes the element val onto the stack.
              - void pop() removes the element on the top of the stack.
              - int top() gets the top element of the stack.
              - int getMin() retrieves the minimum element in the stack.

          You must implement a solution with O(1) time complexity for each function.

          ## CONSTRAINTS

              * -2^31 <= val <= 2^31 - 1
              * Methods pop, top and getMin operations will always be called on non-empty stacks.
              * At most 3 * 104 calls will be made to push, pop, top, and getMin.

          ## HOW-TO

              1. We can use two stacks to solve this problem.
              2. The first stack will hold the actual values.
              3. The second stack will hold the minimum values.
              4. When we push a value, we will also push the minimum value of the stack.
              5. When we pop a value, we will also pop the minimum value of the stack.
              6. When we want to get the minimum value, we will just return the top of the minimum stack.

          ## COMPLEXITY

              - **Time Complexity**: O(1) for all operations.
              - **Space Complexity**: O(n) where n is the number of elements in the stack.
      - md: |

          ## Python

          ```python
          class MinStack:
              def __init__(self):
                  self.stack = []
                  self.min_stack = []

              def push(self, val: int) -> None:
                  self.stack.append(val)
                  val = min(val, self.min_stack[-1] if self.min_stack else val)
                  self.min_stack.append(val)

              def pop(self) -> None:
                  self.stack.pop()
                  self.min_stack.pop()

              def top(self) -> int:
                  return self.stack[-1]

              def getMin(self) -> int:
                  return self.min_stack[-1]
          ```
      - md: |

          ## Ruby

          ```ruby
          class MinStack
            def initialize
              @stack = []
              @min_stack = []
            end

            # pushes the element val onto the stack.
            def push(val)
              @stack.push(val)
              min_val = @min_stack.empty? ? val : [@min_stack.last, val].min
              @min_stack.push(min_val)
            end

            # removes the element on the top of the stack.
            def pop
              @stack.pop
              @min_stack.pop
            end

            # gets the top element of the stack.
            def top
              @stack.last
            end

            # retrieves the minimum element in the stack.
            def min
              @min_stack.last
            end
          end
          ```
