          # 74. Search a 2D Matrix

              You are given an m x n integer matrix matrix with the following two properties:

              - Each row is sorted in non-decreasing order.
              - The first integer of each row is greater than the last integer of the previous row.

              Given an integer target, return true if target is in matrix or false otherwise.

              You must write a solution in O(log(m * n)) time complexity.

          ## CONSTRAINTS

              * m == matrix.length
              * n == matrix[i].length
              * 1 <= m, n <= 100
              * -10^4 <= matrix[i][j], target <= 10^4

          ## HOW-TO

              1. Find the row where the target could be.
              2. Find the target in the row.
              3. Return True if found, False otherwise.

          ## COMPLEXITY

              - **Time Complexity**: O(log(m * n))
              - **Space Complexity**: O(1)
      - md: |
          ## Python

          ```python
          def search_a_2d_matrix(matrix, target):
              ROWS, COLS = len(matrix), len(matrix[0])

              row, top, bot = 0, 0, ROWS - 1
              while top <= bot:
                  row = (top + bot) // 2
                  if target > matrix[row][-1]:
                      top = row + 1
                  elif target < matrix[row][0]:
                      bot = row - 1
                  else:
                      break

              if not top <= bot:
                  return False

              left, r = 0, COLS - 1
              while left <= r:
                  m = (left + r) // 2
                  if target > matrix[row][m]:
                      left = m + 1
                  elif target < matrix[row][m]:
                      r = m - 1
                  else:
                      return True

              return False
          ```
      - md: |
          ## Ruby

          ```ruby
          def search_a_2d_matrix(matrix, target)
            rows, cols = matrix.length, matrix[0].length

            row, top, bot = 0, 0, rows - 1
            while top <= bot
              row = (bot + top) / 2
              if target > matrix[row].last
                top = row + 1
              elsif target < matrix[row].first
                bot = row - 1
              else
                break
              end
            end

            return false unless top <= bot

            left, right = 0, cols - 1
            while left <= right
              m = (left + right) / 2
              if target > matrix[row][m]
                left = m + 1
              elsif target < matrix[row][m]
                right = m - 1
              else
                return true
              end
            end

            false
          end
          ```
