      - md: |
          ## Radix Sort

          A sorting algorithm that sorts elements based on their digits.
          Useful when dealing with problems that involve sorting an array or list.

          ### How It Works

          1. Start by defining a count array to store the frequency of each digit in the input array.
          2. While iterating through the input array, proceed as follows:
            1. Increment the count of each digit in the count array.
          3. Return the sorted array.

          ### Key Indicators

          - You need to sort an array or list.
          - Problems involve sorting elements in ascending or descending order.
          - You want to solve problems involving sorting algorithms.
      - md: |

          ### Python

          ```python
          def counting_sort(arr, exp):
              n = len(arr)
              count = [0] * 10
              result = [0] * n
              for num in arr:
                  count[(num // exp) % 10] += 1
              for i in range(1, 10):
                  count[i] += count[i - 1]
              for i in range(n - 1, -1, -1):
                  result[count[(arr[i] // exp) % 10] - 1] = arr[i]
                  count[(arr[i] // exp) % 10] -= 1
              for i in range(n):
                  arr[i] = result[i]
          def radix_sort(arr):
              max_val = max(arr)
              exp = 1
              while max_val // exp > 0:
                  counting_sort(arr, exp)
                  exp *= 10
              return arr
          ```
