          ## 3Sum

          Given an integer array `nums`, return all the triplets `[nums[i], nums[j], nums[k]]` such that `i != j`, `i != k`, and `j != k`, and `nums[i] + nums[j] + nums[k] == 0`.

          Notice that the solution set must not contain duplicate triplets.

          ### Constraints

          - 0 <= nums.length <= 3000
          - -10^5 <= nums[i] <= 10^5

          ### Complexity

          | Time | Space |
          | ---- | ----- |
          | O(n^2) | O(1)  |

          ## 💡 Hints

          - Use two pointers to compare the sum of the left and right elements
          - If the sum is greater than the target, move the right pointer to the left
          - If the sum is less than the target, move the left pointer to the right
          - Return the indices of the left and right pointers
      - md: |

          ### Python

          ```python
          def three_sum(nums: List[int]) -> List[List[int]]:
              res = []
              nums.sort()

              for i, n in enumerate(nums):
                  if i > 0 and n == nums[i - 1]:
                      continue

                  l, r = i + 1, len(nums) - 1
                  while l < r:
                      treeSum = n + nums[l] + nums[r]
                      if treeSum > 0:
                          r -= 1
                      elif treeSum < 0:
                          l += 1
                      else:
                          res.append([n, nums[l], nums[r]])
                          l += 1
                          while nums[l] == nums[l - 1] and l < r:
                              l += 1
              return res
          ```
      - md: |

          ## Ruby

          ```ruby
          def tree_sum(nums)
            res = []
            nums.sort!

            nums.each_with_index do |n, i|
              next if i > 0 && n == nums[i - 1] # Skip duplicate elements to avoid duplicate triplets

              l = i + 1
              r = nums.length - 1
              while l < r
                three_sum = n + nums[l] + nums[r]
                if three_sum > 0
                  r -= 1
                elsif three_sum < 0
                  l += 1
                else
                  res << [n, nums[l], nums[r]]
                  l += 1
                  l += 1 while nums[l] == nums[l - 1] && l < r # Skip duplicate elements to ensure all triplets are unique
                end
              end
            end

            res
          end
          ```
