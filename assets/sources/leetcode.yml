  In-place Reversal of a LinkedList | Coding Pattern:
    desc: Changing the direction of pointers in a linked list to reverse the order of elements
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## In-place Reversal of a LinkedList

          Linked List Reversal involves changing the direction of pointers in a linked list to reverse the order of elements.
          It's a fundamental operation in data structures, and it often requires careful manipulation of node references.
          This is useful when dealing with a linked list and the constraint is to reverse it in place.

          ### How It Works

          1. Start by defining three variables: current, previous, and next. Set current as the head of the linked list, and initialize previous and next as None.
          2. While the current variable is not None, proceed as follows:
            1. Store the next node in a temporary variable.
            2. Reverse the current node's pointer to point to the previous node.
            3. Update previous to be the current node and current to be the next node.
          3. Finally, set the head of the reversed list to the last node reached, which is stored in the previous variable.

          ### Key Indicators

          - You need to reverse the order of elements in a linked list.
          - Problems involve checking for palindromes in linked lists.
          - You want to reverse the order of elements in a specific sublist within the list.

      - md: |

          ### Python

          ```python
          def reverse_linked_list(head):
              curr = head
              prev = None
              while curr:
                  next_node = curr.next
                  curr.next = prev
                  prev = curr
                  curr = next_node

              return prev
          ```
      - md: |

          ### Ruby

          ```ruby
          def reverse_linked_list(head)
              curr = head
              prev = nil
              while curr
                next_node = curr.next
                curr.next = prev
                prev = curr
                curr = next_node
              end
              prev
          end
          ```
      - md: |

          ### JavaScript

          ```javascript
          function reverseLinkedList(head) {
              let curr = head;
              let prev = null;
              while (curr) {
                  let next = curr.next;
                  curr.next = prev;
                  prev = curr;
                  curr = next;
              }
              return prev;
          }
          ```
  Modified Binary Search | Coding Pattern:
    desc: A binary search algorithm that is modified to solve a specific problem
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## Modified Binary Search

          A Modified Binary Search is a binary search algorithm that is modified to solve a specific problem.
          It's useful when dealing with a sorted array or list and the constraint is to find a specific element or condition.

          ### How It Works

          1. Start by defining the search space, which is the range of indices where the target element is located.
          2. While the search space is not empty, proceed as follows:
            1. Calculate the middle index of the search space.
            2. If the middle element is the target, return its index.
            3. If the middle element is less than the target, update the search space to the right half of the middle index.
            4. If the middle element is greater than the target, update the search space to the left half of the middle index.
          3. If the target element is not found, return -1.

          ### Key Indicators

          - You're working with a sorted data structure (array, linked list, or matrix)
          - Find the smallest or largest element in a sorted array.
          - Find specific elements, boundaries, or pivot points efficiently.
          - Searching in rotated sorted arrays.
      - md: |

          ### Python

          ```python
          def binary_search(arr, key):
              start, end = 0, len(arr) - 1
              while start <= end:
                  mid = start + (end - start) // 2
                  if arr[mid] == key:
                      return mid
                  if arr[mid] < key:
                      start = mid + 1
                  else:
                      end = mid - 1
              return -1
          ```
      - md: |

          ### Ruby

          ```ruby
          def binary_search(arr, key)
            start, end_ = 0, arr.length - 1
            while start <= end_
              mid = start + (end_ - start) / 2
              if arr[mid]
                return mid
              end
              if arr[mid] < key
                start = mid + 1
              else
                end_ = mid - 1
              end
            end
            -1
          end
          ```
  Two Pointers | Coding Pattern:
    desc: Uses two pointers to solve a problem
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## Two Pointers

          The Two Pointers pattern uses two pointers to solve a problem.
          It's useful when dealing with a sorted array or list and the constraint is to find a set of elements that fulfill certain constraints.

          ### How It Works

          1. Start by defining two pointers, left and right, that point to the start and end of the array or list.
          2. While the left pointer is less than or equal to the right pointer, proceed as follows:
            1. If the sum of the elements at the left and right pointers is equal to the target, return the indices of the elements.
            2. If the sum of the elements at the left and right pointers is less than the target, move the left pointer to the right.
            3. If the sum of the elements at the left and right pointers is greater than the target, move the right pointer to the left.
          3. If the target elements are not found, return -1.

          ### Key Indicators

          - You need to compare or operate on elements at different positions.
          - Problems require searching for pairs of elements in a sorted array.
          - You want to remove duplicates from a sorted array efficiently.
          - When dealing with linear data structures (arrays, strings, or linked lists) and facing a quadratic time complexity (O(n^2) brute force solution), consider employing Two Pointers.

      - md: |

          ### Python for "opposite direction" variation

          ```python
          def two_pointers_opposite(arr):
              left = 0
              right = len(arr) - 1
              ans = 0
              while left < right:
                  # Perform logic using the left and right pointers
                  if CONDITION:
                      left += 1
                  else:
                      right -= 1
              return ans
          ```
  Sliding Window | Coding Pattern:
    desc: Uses a window to solve a problem
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## Sliding Window

          The Sliding Window pattern uses a window to solve a problem.
          It's useful when dealing with an array, string, or list and the constraint is to find a subset of elements that fulfill certain constraints.

          ### How It Works

          1. Start by defining two pointers, left and right, that point to the start and end of the array or list.
          2. While the right pointer is less than the length of the array or list, proceed as follows:
            1. Expand the window to the right by adding the element at the right pointer to the window.
            2. While the window size is greater than the desired size, shrink the window from the left by removing the element at the left pointer from the window.
            3. Update the maximum or minimum value of the window as needed.
          3. Return the maximum or minimum value of the window.

          ### Key Indicators

          - You need to analyze contiguous or non-contiguous subarrays or substrings.
          - Problems involve tracking variable-length sequences within a larger dataset.
          - You want to find the maximum sum subarray of fixed length.
          - The problem input is a linear data structure such as an array, linked list, or string.

      - md: |

          ### Python

          ```python
          def slidingWindow(nums):
              # Initialize necessary variables
              left = 0
              window = []  # Initialize the window
              ans = 0  # Initialize the answer variable
              for right in range(len(nums)):
                  window.append(nums[right])  # Expand the window to the right
                  while invalid(window):  # Condition to shrink the window from the left until it is valid again
                      window.pop(0)  # Remove the left element from the window
                      left += 1
                  ans = max(ans, len(window))  # Update the answer, can vary on your implementation
              return ans
          ```
  Top 'K' Elements | Coding Pattern:
    desc: Uses a heap to solve a problem
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## Top 'K' Elements

          The Top 'K' Elements pattern uses a heap to solve a problem.
          It's useful when selecting a subset of elements based on their value or frequency.

          ### How It Works

          1. Start by defining a heap, which can be a min-heap or max-heap, depending on the problem.
          2. While iterating through the elements, proceed as follows:
            1. Add the current element to the heap.
            2. If the size of the heap exceeds 'K', remove the smallest or largest element from the heap.
          3. Return the top or bottom 'K' elements from the heap.

          ### Key Indicators

          - You need to find the 'K' largest or smallest elements in a set.
          - Problems involve finding the top K frequent elements in a dataset.
          - You want to find the 'K' closest elements to a specific value.
          - Find the top or bottom 'K' elements that satisfy a specific condition.
          - Ranking elements based on certain criteria.

      - md: |

          ### Python

          ```python
          import heapq

          def top_k_elements(arr, k):
              heap = []
              for num in arr:
                  # Define your own criteria and logic to push elements onto the heap
                  # For example, if you want to find the top k largest elements, push (-num, num) onto the heap
                  heapq.heappush(heap, (-CRITERIA, num))
                  if len(heap) > k:
                      heapq.heappop(heap)

              return [num for _, num in heap]
          ```
