      - md: |
          # 704. Binary Search

          Given an array of integers nums which is sorted in ascending order,
          and an integer target, write a function to search target in nums.
          If target exists, then return its index. Otherwise, return -1.

          You must write an algorithm with O(log n) runtime complexity.

          ## CONSTRAINTS

              * 1 <= nums.length <= 104
              * -104 < nums[i], target < 104
              * all the integers in nums are unique.
              * nums is sorted in ascending order.

          ## HOW-TO

              Finding an item from a sorted list of items.

              It works by repeatedly dividing in half the portion of the list
              that could contain the item,
              until the possible location is narrowed down to just one element.

              1. Initialize two pointers to indicate the start and end of the list.

                The start pointer (l) is set to the first index of the list (0),
                and the end pointer (r) is set to the last index (length of the list minus one).

              2. Check if the search range is valid:

                  Before each iteration,
                  verify that the start pointer is not greater than the end pointer.
                  This check ensures that there are elements left to examine.
                  If the start pointer exceeds the end pointer,
                  it indicates that the target is not present in the list.

              3. Calculate the middle index of the current search range.

                  This is done by adding the start pointer to half the difference between the end pointer and the start pointer.
                  This calculation finds the middle index without risking overflow.

              4. Compare the target value with the middle element in the current search range:

                  a. If the target is less than the middle element, narrow the search range to the left half of the current range.
                    This is done by updating the end pointer to one less than the middle index.

                  b. If the target is greater than the middle element, narrow the search range to the right half of the current range.
                    This is done by updating the start pointer to one more than the middle index.

                  c. If the target is equal to the middle element, the search is successful,
                    and the position of the target in the list (the middle index) is returned.

              5. Repeat the process until the target is found or the search range is exhausted

                (i.e., the start pointer exceeds the end pointer).
                If the search range is exhausted without finding the target,
                conclude that the target is not present in the list.

              6. Return the result:

                  If the target was found, return the index where it was found.
                  If the target was not found, return a value indicating that the search was unsuccessful
                  (typically -1).

          ## COMPLEXITY

              - **Time Complexity**: O(log n)
              - **Space Complexity**: O(1)
      - md: |
          ## Python

          ```python
          def binary_search(nums, target):
              left, r = 0, len(nums) - 1

              while left <= r:
                  m = left + ((r - left) // 2)
                  if nums[m] > target:
                      r = m - 1
                  elif nums[m] < target:
                      left = m + 1
                  else:
                      return m

              return -1
          ```
      - md: |
          ## Ruby

          ```ruby
          def binary_search(nums, target)
            l, r = 0, nums.length - 1
            while l <= r
              m = l + ((r - l) / 2)
              if nums[m] > target
                r = m - 1
              elsif nums[m] < target
                l = m + 1
              else
                return m
              end
            end
            -1
          end
          ```
