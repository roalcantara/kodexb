    notes:
      - md: |
          ## Tree Breadth First Search

          Traverse a tree level by level.
          Useful when dealing with a tree and the constraint is to traverse the tree level by level.

          ### How It Works

          1. Start by defining a queue to store the nodes of the tree.
          2. While the queue is not empty, proceed as follows:
            1. Dequeue the front node from the queue and process it.
            2. Enqueue the children of the processed node to the queue.
          3. Return the processed nodes.

          ### Key Indicators

          - You need to traverse a tree level by level.
          - Find the shortest path in a tree.
          - To explore a tree in a breadth-first manner.
          - Problems involve finding the minimum depth of a tree.
          - You want to find the level order traversal of a tree.

      - md: |

          ### Python

          ```python
          def bfs(root):
              queue = [root]
              result = []
              while queue:
                  level = []
                  for _ in range(len(queue)):
                      node = queue.pop(0)
                      level.append(node.val)
                      if node.left:
                          queue.append(node.left)
                      if node.right:
                          queue.append(node.right)
                  result.append(level)
              return result
          ```
