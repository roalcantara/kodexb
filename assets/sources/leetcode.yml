          # 853. Car Fleet

          N cars are going to the same destination along a one-lane road.
          The destination is target miles away.

          Each car i has a constant speed speed[i] (in miles per hour),
          and initial position position[i] miles towards the target along the road.

          A car can never pass another car ahead of it, but it can catch up to it,
          and drive bumper to bumper at the same speed.

          The distance between these two cars is ignored - they are assumed to have the same position.

          A car fleet is some non-empty set of cars driving at the same position and same speed.

          Note that a single car is also a car fleet.

          If a car catches up to a car fleet right at the destination point, it will still be considered as one car fleet.

          Return the number of car fleets.

          ## CONSTRAINTS

              * n == position.length == speed.length
              * 1 <= n <= 10^5
              * 0 < target <= 10^6
              * 0 <= position[i] < target
              * All the values of position are unique.
              * 0 < speed[i] <= 10^6

          ## HOW-TO

              1. Sort the cars by their position in reverse order.
              2. Calculate the time it takes for each car to reach the target.
              3. If the time is greater than the time of the car in front of it, it becomes a fleet.
              4. Return the number of fleets.

          ## COMPLEXITY

              - **Time Complexity**: O(n log n)
              - **Space Complexity**: O(n)
      - md: |
          ## Python

          ```python
          from typing import List


          def car_fleet(target: int, position: List[int], speed: List[int]) -> int:
              stack = []

              for p, s in sorted(zip(position, speed), reverse=True):  # reverse sorted order
                  time = (target - p) / s
                  if not stack or time > stack[-1]:
                      stack.append(time)

              return len(stack)
          ```
      - md: |
          ## Ruby

          ```ruby
          def car_fleet(target, position, speed)
            stack = []

            position.zip(speed).reverse.each do |p, s|
              time = (target - p) / s
              stack.push(time) if stack.empty? || time > stack.last
            end

            stack.length
          end
          ```
