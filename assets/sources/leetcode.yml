      - md: |
          # 11. Container With Most Water

          You are given an integer array height of length n.
          There are n vertical lines drawn
          such that the two endpoints of the ith line are (i, 0) and (i, height[i]).

          Find two lines that together with the x-axis form a container,
          such that the container contains the most water.

          Return the maximum amount of water a container can store.
          Notice that you may not slant the container.

          ## CONSTRAINTS

              - n == height.length
              - 2 <= n <= 10^5
              - 0 <= height[i] <= 10^4

          ## HOW-TO

              1. Use two pointers, left and right, to traverse the array.
              2. Calculate the area between the two pointers.
              3. Move the pointer with the smallest height.
              4. Keep track of the max area.
              5. Return the max area.

          ## COMPLEXITY

              - **Time Complexity**: O(n)
              - **Space Complexity**: O(1)
      - md: |

          ## Python

          ```python
          from typing import List


          def max_area(height: List[int]) -> int:
              res = 0
              left, right = 0, len(height) - 1

              while left < right:
                  area = (right - left) * min(height[left], height[right])
                  res = max(res, area)

                  if height[left] < height[right]:
                      left += 1
                  else:
                      right -= 1

              return res
          ```
      - md: |

          ## Ruby

          ```ruby
          def max_area(height)
            res = 0

            left, right = 0, height.length - 1

            while left < right
              area = (right - left) * [height[left], height[right]].min
              res = [res, area].max

              if height[left] < height[right]
                left += 1
              else
                right -= 1
              end
            end

            res
          end
          ```
