    notes:
      - md: |

          ## Token Bucket

          A rate limiting algorithm that can be used to control the consumption of resources.
          Useful when dealing with problems that involve rate limiting or controlling the consumption of resources.

          ### How It Works

          1. Start by defining a token bucket with a maximum capacity and a refill rate.
          2. While consuming resources, proceed as follows:
            1. If the token bucket has enough tokens, consume the resources and update the token count.
            2. If the token bucket does not have enough tokens, wait until the bucket is refilled.
          3. Return the consumed resources.

          ### Key Indicators

          - You need to control the consumption of resources.
          - Problems involve rate limiting or throttling.
          - You want to solve problems involving controlling the flow of data or requests.
      - md: |

          ### Python

          ```python
          class TokenBucket:
              def __init__(self, capacity, refill_rate):
                  self.capacity = capacity
                  self.tokens = capacity
                  self.refill_rate = refill_rate
                  self.last_refill_time = time.time()

              def consume(self, tokens):
                  if tokens <= self.tokens:
                      self.tokens -= tokens
                      return True
                  return False

              def refill(self):
                  now = time.time()
                  tokens_to_add = (now - self.last_refill_time) * self.refill_rate
                  self.tokens = min(self.capacity, self.tokens + tokens_to_add)
                  self.last_refill_time = now
          ```
