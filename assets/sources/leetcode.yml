  Top Coding Patterns:
    desc: Top Coding Patterns that you need to know to answer any coding question
    tags: [leetcode, coding_pattern]
    links:
      - Embracing Coding Patterns: https://hackernoon.com/coding-patterns-a-smarter-approach-to-coding-interview-prep
    notes:
      - md: |
          ## In-place Reversal of a LinkedList

          - Changing the direction of pointers in a linked list to reverse the order of elements.
          - Useful when dealing with a linked list and the constraint is to reverse it in place.

          ### Key Indicators

          - Reverse the order of elements in a linked list.
          - Checking for palindromes in linked lists.
          - Reverse the order of elements in a specific sublist within the list.

          ## Modified Binary Search

          - A binary search algorithm that is modified to solve a specific problem.
          - Useful when dealing with a sorted array or list and the constraint is to find a specific element or condition.

          ### Key Indicators

          - You're working with a sorted data structure (array, linked list, or matrix)
          - Find the smallest or largest element in a sorted array.
          - Find specific elements, boundaries, or pivot points efficiently.
          - Searching in rotated sorted arrays.

          ## Two Pointers

          - Uses two pointers to solve a problem.
          - Useful when dealing with a sorted array or list and the constraint is to find a set of elements that fulfill certain constraints.

          ### Key Indicators

          - You're working with a sorted data structure (array, linked list, or matrix)
          - Find a set of elements that fulfill certain constraints.
          - Find a subarray or a list of elements that makes a specific sum, closest to a target, or meets a specific condition.
          - Optimized when requires comparison between elements at different positions.

          ## Sliding Window

          - Uses a window to solve a problem.
          - Useful when dealing with an array, string, or list and the constraint is to find a subset of elements that fulfill certain constraints.

          ### Key Indicators

          - To analyze contiguous or non-contiguous subarrays or substrings.
          - PTracking variable-length sequences within a larger dataset.
          - YFind the maximum sum subarray of fixed length.
          - The input is a linear data structure such as an array, linked list, or string.

          ## Top 'K' Elements

          - Uses a heap to solve a problem.
          - Useful when dealing with a set of elements and the constraint is to find the top or bottom 'K' elements.

          ### Key Indicators

          - Find the 'K' largest or smallest elements in a set.
          - Find the top K frequent elements in a dataset.
          - Find the 'K' closest elements to a specific value.
          - Find the top or bottom 'K' elements that satisfy a specific condition.
          - Ranking elements based on certain criteria.

          ## Two Heaps

          - Uses two heaps to solve a problem.
          - Useful for maintaining a balanced structure

          ### Key Indicators

          - To maintain a balanced structure for efficient median finding.
          - Handling sliding window problems with dynamic medians.
          - Prioritize elements in a collection based on their values.

          ## Monotonic Stack

          - Uses a stack to solve a problem.
          - Often used for finding the nearest smaller/greater elements in an array

          ### Key Indicators

          - Find the nearest smaller or greater element.
          - To maintain elements in non-increasing or non-decreasing order.
          - To optimize stack-based operations while preserving order.

          ## Depth-First Search (DFS)

          - Uses a stack to solve a problem.
          - Useful when dealing with a tree or graph and the constraint is to traverse the structure as deeply as possible.

          ### Key Indicators

          - Dealing with tree structures and need to explore specific traversal orders.
          - To check if a path exists between two nodes.
          - To find all possible paths in a graph or tree.
          - To find the connected components in a graph.
          - To find the shortest path in a weighted graph.
          - To traverse a tree or graph as deeply as possible.
          - Problems involve finding paths, calculating depth, or performing pre-order/in-order/post-order traversal.

          ## Breadth-First Search (BFS)

          - Uses a queue to solve a problem.
          - Useful when dealing with a tree or graph that explores all nodes at the current depth before moving to the next level.

          ### Key Indicators

          - You need to traverse a tree level by level.
          - Find the shortest path in unweighted graphs.
          - To explore a tree or graph in a breadth-first manner.

          ## Union Find (Disjoint-Set Union/ DSU)

          - Uses a disjoint-set data structure to solve a problem.
          - Efficiently manage and solve problems involving disjoint sets or connected components

          ### Key Indicators

          - To determine if two elements are connected.
          - To find the connected components in a graph.
          - To find the number of connected components in a graph.
          - To find the number of islands in a matrix.

          ## Topological Sort

          - Uses a directed acyclic graph (DAG) to solve a problem.
          - Useful for arranging the nodes of a directed acyclic graph (DAG) in a linear order, where each node appears before its successors
          - Crucial for tasks like scheduling dependencies, compiling code, and analyzing the precedence of tasks in various applications.

          ### Key Indicators

          - The problem involves scheduling or ordering tasks with dependencies.
          - You're working with a directed acyclic graph (DAG).
          - Tasks need to be executed in a specific order while adhering to their dependencies.

          ## Tries (Prefix-Tree)

          - A tree-like data structure used for efficient string matching and storage of words.
          - Useful you need to store and search for strings with common prefixes.

          ### Key Indicators:

          - You're dealing with strings and need efficient string matching.
          - Problems involve autocomplete suggestions, spell checkers, or searching for words with common prefixes.
          - You want to store and search for words efficiently.

          ## Dynamic Programming

          - Uses a table to solve a problem.
          - Useful when dealing with problems that have overlapping subproblems and optimal substructure.
          - Useful when a problem can be broken down into simpler subproblems, and the solutions to these subproblems can be combined to solve the overall problem.

          ### Key Indicators

          - The problem can be broken down into smaller overlapping subproblems.
          - There's a need to optimize by storing and reusing solutions to subproblems.
          - You want to solve problems involving optimization or counting.

          ## Backtracking

          - Technique for solving problems incrementally by trying out different possibilities and undoing them if they don't lead to a solution.
          - Useful when an exhaustive search is required.

          ### Key Indicators:

          - The problem involves exploring multiple possibilities incrementally.
          - There are decision points or constraints that necessitate trying out different options.
          - Find all possible solutions or satisfy specific conditions through an exhaustive search.

          ## Merge Intervals

          - Combining overlapping or adjacent intervals into a consolidated set, often used in problems involving time intervals or scheduling.
          - Useful when simplifying interval-based operations.

          ### Key Indicators:

          - You're dealing with intervals or time-based data.
          - Problems involve merging overlapping or adjacent intervals.
          - You want to simplify interval-based operations or optimize event scheduling.

          ## Fast & Slow Pointers

          - A technique that uses two pointers to solve a problem.
          - Useful when dealing with a linked list and the constraint is to find a specific element or condition.

          ### Key Indicators

          - You need to find the middle of a linked list.
          - Problems involve detecting a cycle in a linked list.
          - You want to find the start of a cycle in a linked list.
          - You need to determine the length of a linked list.

          ## Cyclic Sort

          - A sorting algorithm that sorts an array by placing each element in its correct position, often used in problems involving arrays with distinct numbers.
          - Useful when sorting an array of numbers from 1 to n.

          ### Key Indicators

          - You're working with an array of distinct numbers.
          - Problems involve sorting an array of numbers from 1 to n.
          - You want to find the missing or duplicate number in an array.

          ## Tree Breadth First Search

          - Traversing a tree level by level, often used in problems involving tree structures.

          ### Key Indicators

          - You need to traverse a tree level by level.
          - Problems involve finding the minimum depth of a tree.
          - You want to find the maximum depth of a tree.
          - You need to find the level order traversal of a tree.

          ## Tree Depth First Search

          - Traversing a tree as deeply as possible, often used in problems involving tree structures.

          ### Key Indicators

          - You need to traverse a tree as deeply as possible.
          - Problems involve finding paths, calculating depth, or performing pre-order/in-order/post-order traversal.
          - You want to check if a path exists between two nodes in a tree.

          ## Subsets

          - Finding all possible subsets of a set, often used in problems involving combinations or permutations.

          ### Key Indicators

          - You need to find all possible subsets of a set.
          - Problems involve combinations or permutations.
          - You want to find all possible combinations that meet specific conditions.

          ## K-way Merge

          - Merging multiple sorted arrays into a single sorted array, often used in problems involving multiple sorted lists.

          ### Key Indicators

          - You need to merge multiple sorted arrays into a single sorted array.
          - Problems involve multiple sorted lists.
          - You want to find the smallest range that includes at least one number from each of the sorted lists.

          ## Minimize Heap

          - Finding the smallest range that includes at least one number from each of the sorted lists, often used in problems involving multiple sorted lists.

          ### Key Indicators

          - You need to find the smallest range that includes at least one number from each of the sorted lists.
          - Problems involve multiple sorted lists.
          - You want to merge multiple sorted arrays into a single sorted array.
      - md: |
          ## Categories based on their common characteristics or underlying principles

          ### 1. Data Structure Specific Algorithms

          - **LinkedList Operations:** In-place Reversal of a LinkedList, Fast & Slow Pointers.
          - **Tree Traversals and Operations:** Tree Breadth First Search, Tree Depth First Search.
          - **Heap Operations:** Minimize Heap, Two Heaps.
          - **Graph/Data Structure Design:** Tries (Prefix-Tree), Union Find (Disjoint-Set Union/DSU).

          ### 2. Searching and Sorting

          - **Search Algorithms:** Modified Binary Search, Binary Tree Searches (DFS, BFS).
          - **Sorting Algorithms:** Bubble Sort, Counting Sort, Radix Sort, Cyclic Sort.
          - **Pattern Searching in Strings:** Knuth-Morris-Pratt (KMP), Rabin-Karp, Z-algorithm.

          ### 3. Algorithmic Design Paradigms

          - **Divide and Conquer:** Merge Intervals, K-way Merge.
          - **Greedy Algorithms:** Top 'K' Elements (often implemented using heaps), some instances of Sliding Window.
          - **Dynamic Programming:** Used in some Subsets problems, also in certain types of string manipulation problems.
          - **Backtracking:** Often used in Subsets, and other combinatorial problems.

          ### 4. Graph Algorithms

          - **Traversal Techniques:** Depth-First Search (DFS), Breadth-First Search (BFS).
          - **Ordering Algorithms:** Topological Sort.

          ### 5. Problem Solving Patterns/Techniques

          - **Two Pointers:** General Two Pointers, Sliding Window, Fast & Slow Pointers.
          - **Stack/Queue Utilization:** Monotonic Stack.
          - **Rate Limiting Algorithms:** Token Bucket, Leaky Bucket.

          ### 6. Miscellaneous

          - **Subsets/Combinations:** Problems involving generating all possible subsets or combinations of a set.
          - **String Manipulation:** This includes various string matching algorithms and can overlap with dynamic programming and greedy algorithms.
      - md: |
          ## Learning Path

          Creating an optimal learning path from easier to harder concepts in algorithms and data structures can significantly enhance understanding and skill development.
          Here's a suggested order to learn and practice these algorithms.

          ### 1. Fundamentals of Data Structures

          - **Start with basic data structures:** Arrays, Linked Lists, Stacks, and Queues.
          - Understanding these is crucial as they form the foundation for more complex algorithms.

          ### 2. Basic Sorting and Searching

          - Learn simple sorting algorithms like Bubble Sort, but more emphasis should be on understanding Quick Sort and Merge Sort.
          - Practice basic searching algorithms, particularly Binary Search, including its variations.

          ### 3. Efficient Collection Usage

          - Understand the implementation and usage of efficient collections like:
          - Hash Tables (used in many interview problems for quick lookups),
          - Heaps (for priority queue implementation)
          - and Trees (especially Binary Search Trees)

          ### 4. Core Algorithm Techniques:

          - **Two Pointers & Fast & Slow Pointers:** Start with these as they are often used in array and linked list problems.
          - **Sliding Window:** Essential for solving subarray/string problems.
          - **DFS** and **BFS:** Fundamental for tree and graph traversal.
          - **Backtracking:** Key for solving combinatorial problems.
          - **Dynamic Programming:** Crucial for optimization problems; start with easier problems and gradually increase difficulty.
          - **Greedy Algorithms:** Important for certain optimization problems.

          ### 5. Graph Algorithms:

          After mastering basic DFS and BFS, move to problems involving Graphs, like detecting cycles, finding shortest paths (Dijkstra's, Bellman-Ford), and minimum spanning trees (Kruskal's, Prim's).

          ### 6. Advanced Data Structures:

          - **Tries (Prefix Trees):** Useful for word-based problems.
          - **Union Find:** Good for understanding disjoint set operations, often used in network connectivity problems.
          - **Segment Trees and Binary Indexed Trees:** These are more advanced and are generally used in range query problems.

          ### 7. String Processing Algorithms:

          - Basic string manipulation techniques should be learned early.
          - Advanced algorithms like KMP, Rabin-Karp are less frequently asked but good to know.

          ### 8. System Design and Scalability Concepts:

          - Basic understanding of system design principles, especially if interviewing for roles that involve architecture design.

          ### 9. Specialized Algorithms:

          - **Divide and Conquer:** As applied in Merge Sort, Quick Sort.
          - **Topological Sort:** For dependency resolution problems.
          - **Bit Manipulation:** Basic operations can be useful in some problems.

          The revised list focuses on the breadth of topics and depth where necessary, aiming to cover most types of questions commonly encountered in coding interviews.
          The sequence is still from simpler to more complex topics, ensuring a smooth learning curve.
