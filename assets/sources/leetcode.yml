              * 30 <= temperatures[i] <= 100

          ## HOW-TO

              1. Create a stack and an empty list to store the results.
              2. Iterate through the temperatures array.
              3. While the stack is not empty and the current temperature is greater than the temperature at the top of the stack,
                  - Pop the top temperature and calculate the difference between the current index and the index of the top temperature.
                  - Store the difference in the results array at the index of the top temperature.
              4. Push the current temperature and its index to the stack.
              5. Return the results.

          ## COMPLEXITY

              - **Time Complexity**: O(n) - We iterate through the temperatures array once.
              - **Space Complexity**: O(n) - We use a stack to store the temperatures and their indexes.
