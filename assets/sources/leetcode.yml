    notes:
      - md: |
          ## Monotonic Stack

          The Monotonic Stack pattern uses a stack to solve a problem.
          It's often used for finding the nearest smaller/greater elements in an array.

          ### How It Works

          1. Start by defining a stack to store the indices of the elements.
          2. While iterating through the elements, proceed as follows:
            1. If the current element is greater than the element at the top of the stack, add the current element's index to the stack.
            2. If the current element is less than the element at the top of the stack, pop the top element from the stack and calculate the difference between the current element's index and the top element's index.
          3. Return the calculated differences.

          ### Key Indicators

          - Find the nearest smaller or greater element.
          - To maintain elements in non-increasing or non-decreasing order.
          - To optimize stack-based operations while preserving order.

      - md: |

          ### Python

          ```python
          def next_greater_elements(nums):
              stack = []
              result = [-1] * len(nums)
              for i in range(2 * len(nums)):
                  while stack and nums[i % len(nums)] > nums[stack[-1]]:
                      result[stack.pop()] = nums[i % len(nums)]
                  stack.append(i % len(nums))
              return result

          def next_smaller_elements(nums):
              stack = []
              result = [-1] * len(nums)
              for i in range(2 * len(nums)):
                  while stack and nums[i % len(nums)] < nums[stack[-1]]:
                      result[stack.pop()] = nums[i % len(nums)]
                  stack.append(i % len(nums))
              return result
          ```
