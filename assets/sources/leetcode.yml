          ## Subsets

          Generate all possible subsets of a set.
          Useful when dealing with problems that involve generating all possible subsets of a set.

          ### How It Works

          1. Start by defining an empty list to store the subsets.
          2. While iterating through the elements of the set, proceed as follows:
            1. Add the current element to the subsets.
            2. Recursively generate the subsets for the remaining elements.
            3. Remove the current element from the subsets.
          3. Return the subsets.

          ### Key Indicators

          - You need to generate all possible subsets of a set.
          - Problems involve finding all possible combinations of a set.
          - You want to solve problems involving permutations and combinations.
          - The problem involves generating all possible combinations of a set.

      - md: |

          ### Python

          ```python
          def subsets(nums):
              def backtrack(start, path):
                  result.append(path[:])
                  for i in range(start, len(nums)):
                      path.append(nums[i])
                      backtrack(i + 1, path)
                      path.pop()
              result = []
              backtrack(0, [])
              return result
          ```
  K-way Merge | Coding Pattern:
    desc: Merge K sorted arrays
    tags: [leetcode, coding_pattern]
    links:
