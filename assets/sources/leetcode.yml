          ## Breadth-First Search (BFS)

          The Breadth-First Search (BFS) pattern uses a queue to solve a problem.
          It's useful when dealing with a tree or graph that explores all nodes at the current depth before moving to the next level.

          ### How It Works

          1. Start by defining a queue to store the nodes of the tree or graph.
          2. While the queue is not empty, proceed as follows:
            1. Dequeue the front node from the queue and process it.
            2. Enqueue the children of the processed node to the queue.
          3. Return the processed nodes.

          ### Key Indicators

          - You need to traverse a tree level by level.
          - Find the shortest path in unweighted graphs.
          - To explore a tree or graph in a breadth-first manner.
      - md: |

          ### Python

          ```python
          def bfs(graph, start):
              queue = [start]
              visited = set()
              while queue:
                  node = queue.pop(0)
                  if node not in visited:
                      visited.add(node)
                      queue.extend(graph[node] - visited)
              return visited
          ```

      - md: |

          ### Python Template

