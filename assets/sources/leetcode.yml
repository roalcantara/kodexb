  Two-Pointers | Tech Interview Pattern:
    desc: The two-pointer technique is a simple and effective way to solve a wide range of problems.
    tags: [leetcode, two_pointer]
    links:
      - Valid Palindrome - Leetcode 125 - Python: https://youtu.be/jJXJ16kPFWg
      - Two Pointers Technique: https://youtu.be/xZ4AfXHQ1VQ
      - Tech Interview Pattern | Two Pointers Introduction: https://algo.monster/problems/two_pointers_intro
    notes:
      - md: |
          # OVEWVIEW

          The two-pointer technique is a simple and effective way to solve a wide range of problems.
          It is a technique that uses two pointers to solve problems that involve searching for a pair of elements that satisfy a certain condition.
          The two-pointer technique is a powerful tool that can be used to solve a wide range of problems, including problems that involve searching for a pair of elements that satisfy a certain condition.
          It does not have to be physically using two pointers.
          As long as the other pointer can be easily calculated from existing values, such as the index of the other pointer, it counts as a two pointer question.

          ## Generally speaking, a two pointer algorithm has these characteristics:

          1. Two moving pointers, regardless of directions, moving dependently or independently;
          2. A function that utilizes the entries referenced by the two pointers, which relates to the answer in a way;
          3. An easy way of deciding which pointer to move;
          4. A way to process the array when the pointers are moved.

          ## Why Use Two Pointers?

          Two pointers are helpful because it often offers a more efficient solution than the naive solution.
          In a naive solution use could two (or more) loops to iterate through the array, the time complexity is often O(n^2), which is often not enough.
          If we use two pointers for this type of problem, we are often only passing through the array once with the two pointers, which means that the time complexity is often O(n).

          ## Classifications
      - md: |
          ### Same Directions

          The two pointers move in the same direction.

          #### WHEN TO USE

          To remove duplicates from a sorted list of numbers and return the new length.

          #### HOW IT WORKS:

          1. Set two pointers, i and j.
          2. Iterate through the list using j.
          3. If the number at j is != from the number at i
            Increment i
            Set the number at i to the number at j
          4. Continue until we reach the end
          5. Returns i + 1 which is the new length of the list without duplicates

          #### Example: Remove Duplicates from Sorted Array

          ##### Python

          ```python
          """
          Given a sorted list of numbers, remove duplicates and return the new length.
          You must do this in-place and without using extra memory.
          Input: [0, 0, 1, 1, 1, 2, 2].
          Output: 3.
          Your function should modify the list in place so the first 3 elements becomes 0, 1, 2.
          Return 3 because the new length is 3.
          """
          def remove_duplicates(nums):
              if not nums:
                  return 0

              i = 0
              for j in range(1, len(nums)):
                  if nums[j] != nums[i]:
                      i += 1
                      nums[i] = nums[j]

              return i + 1
          ```

          ##### Ruby

          ```ruby
          """
          Given a sorted list of numbers, remove duplicates and return the new length.
          You must do this in-place and without using extra memory.
          Input: [0, 0, 1, 1, 1, 2, 2].
          Output: 3.
          Your function should modify the list in place so the first 3 elements becomes 0, 1, 2.
          Return 3 because the new length is 3.
          """
          def remove_duplicates(nums)
              return 0 if nums.empty?

              i = 0
              (1...nums.length).each do |j|
                  if nums[j] != nums[i]
                      i += 1
                      nums[i] = nums[j]
                  end
              end

              i + 1
          end
          ```
      - md: |
          ### Opposite Directions

          The two pointers move in opposite directions.

          #### Example: Two Sum II - Input Array Is Sorted

          Given an array of integers numbers that is already sorted in non-decreasing order, find two numbers such that they add up to a specific target number.

          Input: numbers = [2, 7, 11, 15], target = 9.

          Output: [1, 2].

          You may assume that each input would have exactly one solution and you may not use the same element twice.

          ##### Python

          ```python
          def two_sum(numbers, target):
              l, r = 0, len(numbers) - 1
              while l < r:
                  total = numbers[l] + numbers[r]
                  if total == target:
                      return [l + 1, r + 1]
                  elif total < target:
                      l += 1
                  else:
                      r -= 1
          ```

          ##### Ruby

          ```ruby
          def two_sum(numbers, target)
              l, r = 0, numbers.length - 1
              while l < r
                  total = numbers[l] + numbers[r]
                  return [l + 1, r + 1] if total == target
                  total < target ? l += 1 : r -= 1
              end
          end
          ```
      - md: |
          ### Non-array Applications

          The two pointers are not used to iterate through an array.

          #### Example: Happy Number

          A "Happy Number" is defined as a number that after finite number of "steps" - where we sum the square of each digit each time - the result is a 1.
          Given a number n, determine whether it is a happy number.

          As a challenge, complete this question under constant space.

          Parameters
          n: The number to check.
          Result
          true or false, depending on whether this number is a happy number.

          Examples
          Example 1
          Input: n = 19

          Output: true

          Explanation:

          1^2 + 9^2 = 82
          8^2 + 2^2 = 68
          6^2 + 8^2 = 100
          1^2 + 0^2 + 0^2 = 1
          Example 2
          Input: n = 2

          Output: false

          Explanation:

          2^2 = 4
          4^2 = 16
          1^2 + 6^2 = 37
          3^2 + 7^2 = 58
          5^2 + 8^2 = 89
          8^2 + 9^2 = 145
          1^2 + 4^2 + 5^2 = 42
          4^2 + 2^2 = 20
          2^2 + 0^2 = 4
          ...
          Constraints
          1 <= n < 2^31

          ##### Python

          ```python
          def is_happy(n):
              def get_next(n):
                  total_sum = 0
                  while n > 0:
                      n, digit = divmod(n, 10)
                      total_sum += digit ** 2
                  return total_sum

              seen = set()
              while n != 1 and n not in seen:
                  seen.add(n)
                  n = get_next(n)

              return n == 1
          ```

          ##### Ruby

          ```ruby
          def is_happy(n)
              get_next = ->(n) {
                  total_sum = 0
                  while n > 0
                      n, digit = n.divmod(10)
                      total_sum += digit ** 2
                  end
                  total_sum
              }

              seen = Set.new
              while n != 1 && !seen.include?(n)
                  seen.add(n)
                  n = get_next.call(n)
              end

              n == 1
          end
          ```
  What Does A Software Architect Do? | Career:
    desc: A Software Architect plays a critical role in the field of software development, acting as a key decision-maker and strategist in the creation and evolution of software systems.
    tags: [software_architect, career]
    links:
      - What Does A Software Architect Do? | Career: https://www.careerexplorer.com/careers/software-architect/
    notes:
      - md: |
          A Software Architect plays a critical role in the field of software development, acting as a key decision-maker and strategist in the creation and evolution of software systems.

          Their responsibilities encompass a wide range of activities:

          ## 1. Defining System Architecture
          - They design the overall structure of the software system, selecting the appropriate technology stack and defining how different components of the system will interact.
          - This involves making high-level choices in software design and coding standards, platforms, tools, and technical standards.

          ## 2. Ensuring Technical Standards
          - Software Architects are responsible for setting and maintaining coding standards, tools, and platforms.
          - They ensure that the software development process adheres to best practices and industry standards, aiming for high-quality, maintainable, and scalable solutions.

          ## 3. Analyzing and Integrating Business Requirements
          - They work closely with stakeholders, including clients, managers, and other team members, to understand and translate business requirements into technical specifications.
          - They must balance technical constraints with business needs and user requirements.

          ## 4. Risk Management
          - Identifying potential risks related to the system architecture and proposing mitigation strategies is a key part of their role.
          - This includes considering aspects like scalability, security, and performance.

          ## 5. Technical Leadership and Guidance
          - Software Architects often mentor and guide developers, providing technical leadership and direction.
          - They may be involved in code reviews, problem-solving, and decision-making processes, helping to resolve technical disputes and ensuring alignment with the architectural vision.

          ## 6. Prototyping and Research
          - They may develop prototypes to explore new technologies or demonstrate the feasibility of various approaches.
          - Researching emerging technologies and continuously updating technical knowledge and skills is crucial.

          ## 7. Communication and Collaboration
          - Effective communication with both technical and non-technical stakeholders is essential.
          - They must be able to articulate complex technical issues in a way that business stakeholders can understand and make informed decisions.

          ## 8. Overseeing Development Process
          - While not directly involved in day-to-day coding, they oversee the development process, ensuring that the team adheres to the architectural plan and adjusts as necessary.

          ## 9. Documenting the Architecture
          - Creating and maintaining documentation for the software architecture, including architectural diagrams, design decisions, and policies, is an important part of their job.

          ## 10. Quality Assurance and Review
          - They ensure that the software meets quality standards and functional requirements, often being involved in the testing and validation processes.

          ## 11. Handling Non-Functional Requirements
          - Software Architects are particularly focused on non-functional requirements like system reliability, scalability, performance, and maintainability.

          In summary, a Software Architect's role is multifaceted, blending technical expertise with strategic thinking.
          They are essential in ensuring that software systems are well-designed, efficient, and aligned with business goals.
          Their role often evolves with the lifecycle of the software project, requiring them to adapt to new challenges and changes in technology and business environments.
