    desc: LeetCode Cheatsheet
    tags: [leetcode]
    links:
      - LEETCODE CHEAT SHEET: https://piratekingdom.com/leetcode/cheat-sheet
      - Sliding Window: https://piratekingdom.com/leetcode/templates/sliding-window
      - Binary Search: https://piratekingdom.com/leetcode/templates/binary-search
      - Binary Tree Traversals: https://piratekingdom.com/leetcode/templates/binary-tree-traversals
      - Graph Traversals: https://piratekingdom.com/leetcode/templates/graph-traversals
      - String Builder: https://piratekingdom.com/leetcode/templates/string-builder
      - Linked List: https://piratekingdom.com/leetcode/templates/linked-list
      - Trie: https://piratekingdom.com/leetcode/templates/trie
      - Sort: https://piratekingdom.com/leetcode/templates/category/Sort
      - Merge Sort: https://piratekingdom.com/leetcode/templates/merge-sort
      - Quick Sort: https://piratekingdom.com/leetcode/templates/quick-sort
      - Quick Select: https://piratekingdom.com/leetcode/templates/quick-select
      - Deque: https://piratekingdom.com/leetcode/templates/deque
    notes: |
      ## LEETCODE CHEAT SHEET

      > Big-O notations indicate the algorithm's general time complexity
      > n indicates the total number of elements in the input

      ### [Maximum Continuous Subarray](https://piratekingdom.com/leetcode/templates/sliding-window)
      - **Sliding Window:** O(n)

      ### [Input Array is Sorted](https://piratekingdom.com/leetcode/templates/binary-search)
      - **Binary Search:** O(log n)
      - **Two Pointers:** O(n)

      ### [Input is a Binary Tree](https://piratekingdom.com/leetcode/templates/binary-tree-traversals)
      - **DFS (Preorder, Inorder, Postorder):** O(n)
      - **BFS (Level Order):** O(n)

      ### [Input is a Binary Search Tree](https://piratekingdom.com/leetcode/templates/binary-tree-traversals)
      - **Left < Cur < Right:** O(log n)
      - **Inorder Traversal visits the nodes in ascending (sorted) order:** O(n)

      ### [Input is a Matrix/Graph](https://piratekingdom.com/leetcode/templates/graph-traversals)
      - **DFS (Recursion, Stack):** O(n)
      - **BFS (Queue):** O(n)

      ### Find the Shortest/Nearest Path/Distance in a Tree/Matrix/Graph
      - **BFS (non-weighted):** O(n)
      - **Dijkstra (weighted):** O(E log V)

      ### [String Concatenation](https://piratekingdom.com/leetcode/templates/string-builder)
      - **StringBuilder:** O(n) (Java, C#, etc.)
      - **String.join():** O(n) (Python)

      ### [Input is a Linked List](https://www.piratekingdom.com/leetcode/templates/linked-list)
      - Dummy Node
      - Two Pointers: O(n)
      - Fast & Slow Pointers: O(n)

      ### Recomputing the Same Input
      - Memoization

      ### Recursion is Banned
      - Stack

      ### Permutations/Combinations/Subsets
      - Backtracking

      ### [Find the Top/Least Kth element](https://piratekingdom.com/leetcode/templates/quick-select)
      - **QuickSelect:** O(n) average, O(n²) worst
      - **Heap:** O(n log k)

      ### [Common Strings](https://piratekingdom.com/leetcode/templates/trie)
      - Map
      - Trie

      ### [Sort](https://piratekingdom.com/leetcode/templates/category/Sort)
      - **Quick Sort:** O(n log n) average, O(n²) worst
      - **Merge Sort:** O(n log n)
      - **Built-in sorts:** O(n log n)

      ### Find the Smallest/Largest/Median in a Stream
      - Two Heaps

      ### Must Solve In-Place
      - Swap corresponding values
      - Store different values in the same pointer

      ### Maximum/Minimum Subarray/Subset/Options
      - Dynamic Programming

      ### Map/Set
      - **Time:** O(1)
      - **Space:** O(n)

      ### [Deque](https://piratekingdom.com/leetcode/templates/deque)
      - Replaces Stack, Queue, and LinkedList

