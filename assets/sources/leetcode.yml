    notes:
      - md: |
          ## Valid Palindrome

          Given a string `s`, determine if it is a palindrome, considering only alphanumeric characters and ignoring cases.

          ### Constraints

          - 1 <= s.length <= 2 * 10^5
          - s consists only of printable ASCII characters.

          ### Complexity

          | Time | Space |
          | ---- | ----- |
          | O(n) | O(1)  |


          ### 💡 Hints

          - Use two pointers to compare the characters from the l[eft] and the r[right] of the string
          - If the character it not alphanumeric, move the pointer to the next character
          - When there is a l and r alphanumeric chars, compare them
          - Return false if the lowercased l char is different from the lowercased r char
          - Return true otherwise
      - md: |

          ## Python (w/ isalnum shorter!)

          ```python
          def is_palindrome(s: str) -> bool:
              s = ''.join(filter(str.isalnum, s)).lower()
              return s == s[::-1]
          ```
      - md: |

          ## Python (w/ isalnum)

          ```python
          def is_palindrome(s: str) -> bool:
              s = ''.join(filter(str.isalnum, s)).lower()
              l, r = 0, len(s) - 1
              while l < r:
                  if s[l] != s[r]:
                      return False
                  l += 1
                  r -= 1
              return True
