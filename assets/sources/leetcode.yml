      - md: |
          # 153. Find Minimum in Rotated Sorted Array

          Suppose an array of length n sorted in ascending order is rotated between 1 and n times.

          For example, the array nums = [0,1,2,4,5,6,7] might become:

          - [4,5,6,7,0,1,2] if it was rotated 4 times.
          - [0,1,2,4,5,6,7] if it was rotated 7 times.

          Notice that an array       [a[0], a[1], a[2], ..., a[n-1]]
          rotating 1 time results in [a[n-1], a[0], a[1], a[2], ..., a[n-2]].

          Given the sorted rotated array nums of unique elements,
          return the minimum element of this array.

          You must write an algorithm that runs in O(log n) time.

          ## CONSTRAINTS

              * n == nums.length
              * 1 <= n <= 5000
              * -5000 <= nums[i] <= 5000
              * All the integers of nums are unique.
              * nums is sorted and rotated between 1 and n times.

          ## HOW-TO

              This algorithm employs a binary search technique to find the minimum value in a rotated sorted array efficiently.
              It works by iteratively narrowing down the search range based on comparisons of the middle element with
              the boundary elements of the current range.
              If the subarray being considered is already sorted, the algorithm updates the potential minimum value and stops;
              otherwise, it decides which half to explore next, based on the relative values of the middle and left boundary.

              1. Initialize two pointers, l and r, to the first and last indices of the input array, respectively.
              2. Initialize a variable, res, to the first element of the array.
              3. While l <= r:
                  - If the left boundary is less than the right boundary, update the potential minimum value and break.
                  - Calculate the middle index, m, as the average of l and r.
                  - Update the potential minimum value with the minimum of the current value and the value at the middle index.
                  - If the value at the middle index is greater than or equal to the value at the left boundary, update l to m + 1.
                  - Otherwise, update r to m - 1.
              4. Return the potential minimum value.

          ## COMPLEXITY

              - **Time Complexity**: O(log n)
              - **Space Complexity**: O(1)
      - md: |
          ## Python

          ```python
          def find_minimum_in_rotated_sorted_array(nums):
              l, r = 0, len(nums) - 1
              res = nums[0]

              while l <= r:
                  # If the left boundary is less than the right boundary
                  if nums[l] < nums[r]:
                      # update the potential minimum value and break.
                      res = min(res, nums[l])
                      break

                  # Calculate the middle index
                  m = (l + r) // 2

                  # Update the potential minimum value
                  res = min(res, nums[m])

                  # If the value at the middle index is greater than or equal to the value at the left boundary
                  if nums[m] >= nums[l]:
                      # search in the right half
                      l = m + 1
                  else:
                      # search in the left half
                      r = m - 1

              return res
          ```
      - md: |
          ## Ruby

          ```ruby
          def find_minimum_in_rotated_sorted_array(nums)
            l, r = 0, nums.length - 1
            res = nums[0]

            while l <= r
              if nums[l] < nums[r]
                res = [res, nums[l]].min
                break
              end

              m = ((l + r) / 2).to_f
              res = [res, nums[m]].min

              if nums[m] >= nums[l]
                l = m + 1
              else
                r = m - 1
              end
            end

            res
          end
          ```
