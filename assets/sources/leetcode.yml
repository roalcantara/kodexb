      - md: |
          # 875. Koko Eating Bananas

          Koko loves to eat bananas.
          There are n piles of bananas, the ith pile has piles[i] bananas.
          The guards have gone and will come back in h hours.

          Koko can decide her bananas-per-hour eating speed of k.
          Each hour, she chooses some pile of bananas and eats k bananas from that pile.
          If the pile has less than k bananas, she eats all of them instead and will not eat any more bananas during this hour.

          Koko likes to eat slowly but still wants to finish eating all the bananas before the guards return.

          Return the minimum integer k such that she can eat all the bananas within h hours.

          ## CONSTRAINTS

              * 1 <= piles.length <= 10^4     (piles' length is between 1 and 10^4)
              * piles.length <= h <= 10^9     (h is between piles' length and 10^9)
              * 1 <= piles[i] <= 10^9         (each pile has between 1 and 10^9 bananas)

          ## HOW-TO

              This function figures out the slowest speed at which Koko can eat all her bananas in time
              by trying out different speeds in a smart, efficient way until it finds the minimum speed that works.

              1. Initialize the left and right pointers to 1 and the maximum pile size, respectively.
              2. Initialize the minimum speed to the maximum pile size.
              3. While the left pointer is less than or equal to the right pointer:
                  1. Calculate the middle speed.
                  2. Initialize the hours to 0.
                  3. For each pile:
                      1. Calculate the hours it would take to eat the pile.
                      2. Add the hours to the total hours.
                  4. If the total hours are less than or equal to the time limit:
                      1. Update the minimum speed to the minimum of the current minimum speed and the middle speed.
                      2. Move the right pointer to the middle speed minus 1.
                  5. Otherwise:
                      1. Move the left pointer to the middle speed plus 1.
              4. Return the minimum speed.

          ## COMPLEXITY

              - **Time Complexity**: O(n * log m)
              - **Space Complexity**: O(1)
      - md: |
          ## Python

          ```python
          import math


          def koko_eating_bananas(piles, h):
              l, r = 1, max(piles)
              k = r

              while l <= r:
                  m = (l + r) // 2
                  hours = 0
                  for p in piles:
                      hours += math.ceil(p / m)

                  if hours <= h:
                      k = min(k, m)
                      r = m - 1
                  else:
                      l = m + 1

              return k
          ```
      - md: |
          ## Ruby

          ```ruby
          def koko_eating_bananas(piles, h)
            l, r = 1, piles.max
            k = r

            while l <= r
              m = (l + r) / 2
              hours = 0
              piles.each do |p|
                hours += (p.to_f / m).ceil
              end

              if hours <= h
                k = [k, m].min
                r = m - 1
              else
                l = m + 1
              end
            end

            k
          end
          ```
