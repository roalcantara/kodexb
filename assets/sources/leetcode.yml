      - md: |
          # 84. Largest Rectangle in Histogram

          Given an array of integers heights representing the histogram's bar height where the width of each bar is 1,
          return the area of the largest rectangle in the histogram.

          ## CONSTRAINTS

          * 1 <= heights.length <= 105
          * 0 <= heights[i] <= 104

          ## HOW-TO

          The algorithm efficiently finds the largest rectangle
          by using a stack to keep track of potential rectangles as it scans through the bars in the histogram.
          It ensures that rectangles are calculated and maximized for each bar,
          taking into account both the heights and the widths of the rectangles.

          1. **Initialize a stack** to keep track of the indices of bars and their heights in the histogram that are potential boundaries for rectangles.

              Also, initialize a variable to track the maximum area of rectangles found so far.

          2. **Iterate over each bar** in the histogram using their index and height.

              For each bar:

                a. Set the current index as the potential start of a new rectangle.

                b. While the stack is not empty and the height of the current bar is less than the height of the bar at the top of the stack:

                    - Pop the top of the stack. This represents the end of a potential rectangle that was started earlier.

                    - Calculate the area of this rectangle using the height of the popped bar and the distance between the current index and the index of the popped bar.
                      Update the maximum area if this new area is larger.

                    - Update the potential start of the new rectangle to the index of the popped bar, since this bar could potentially extend the rectangle started by the popped bar.

                c. Push the current bar onto the stack along with the updated start index for future rectangle calculations.

          3. After iterating through all bars, there may still be bars on the stack that have not been processed.

              These bars represent rectangles that extend to the end of the histogram.

              For each remaining bar in the stack:

                a. Calculate the area of the rectangle that can be formed using the height of the bar and extending to the end of the histogram.

                b. Update the maximum area if this new area is larger.

          4. Return the maximum area found during the algorithm.

             This value represents the largest rectangular area that can be formed within the histogram.

          ## COMPLEXITY

              - **Time Complexity**: O(n)
              - **Space Complexity**: O(n)
      - md: |
          ## Python

          ```python
          def largest_rectangle_in_histogram(heights):
              stack = []
              max_area = 0

              for i, h in enumerate(heights):
                  start = i
                  while stack and stack[-1][1] > h:
                      index, height = stack.pop()
                      max_area = max(max_area, height * (i - index))
                      start = index
                  stack.append([start, h])

              for i, h in stack:
                  max_area = max(max_area, h * (len(heights) - i))

              return max_area
          ```
      - md: |
          ## Ruby

          ```
          def largest_rectangle_in_histogram(heights)
            stack = []
            max_area = 0

            heights.each_with_index do |h, i|
              start = i
              while stack.any? && stack.last[1] > h
                index, height = stack.pop
                max_area = [max_area, height * (i - index)].max
                start = index
              end
              stack.push([start, h])
            end

            stack.each do |i, h|
              max_area = [max_area, h * (heights.length - i)].max
            end

            max_area
          end
          ```

