commands:
  # clang-format: Format code according to style rules
  # https://clang.llvm.org/docs/ClangFormat.html
  brew install clang-format:
    desc: Install clang-format using HomeBrew
    tags: [make]
  clang-format:
    desc: Format code according to style rules
    tags: [make]
  clang-format -i file.mk:
    desc: Format a Makefile in-place (modifies the file) | Basic formatting commands
    tags: [make]
  clang-format file.mk:
    desc: Output formatted content to stdout without modifying the file | Basic formatting commands
    tags: [make]
  clang-format -style=file file.mk:
    desc: Use style from .clang-format file in the nearest parent directory | Style configuration
    tags: [make]
  'clang-format -style="{IndentWidth: 4}" file.mk':
    desc: Apply custom style inline for quick formatting | Style configuration
    tags: [make]
  'clang-format -style="{Language: Makefile}" file.mk':
    desc: Explicitly specify Makefile language for formatting | Makefile-specific formatting
    tags: [make]
  'clang-format -style="{IndentWidth: 4, UseTabs: true}" file.mk':
    desc: Use tabs for indentation (common in Makefiles) | Makefile-specific formatting
    tags: [make]
  clang-format -i *.mk:
    desc: Format all Makefiles in current directory | Multiple files handling
    tags: [make]
  find . -name "*.mk" -exec clang-format -i {} +:
    desc: Recursively format all Makefiles in current directory and subdirectories | Multiple files handling
    tags: [make]
  clang-format -dump-config:
    desc: Output current configuration in YAML format | Dump configuration
    tags: [make]
  clang-format -style=llvm -dump-config:
    desc: Output LLVM style configuration (useful as starting point) | Dump configuration
    tags: [make]
  clang-format -lines=10:20 file.mk:
    desc: Only format lines 10-20 in the file | Format specific lines
    tags: [make]
  clang-format --version:
    desc: Display version information | Version and diagnostics
    tags: [make]
  clang-format -cursor=123 file.mk:
    desc: Format file and output cursor position for editor integration | Integration with editors
    tags: [make]
  'clang-format -style="{BasedOnStyle: llvm, IndentWidth: 4, AlignConsecutiveMacros: true}" file.mk':
    desc: Use LLVM style as base with custom macro alignment for Makefiles | Advanced configuration examples
    tags: [make]
  'clang-format -style="{IndentWidth: 4, ContinuationIndentWidth: 8}" file.mk':
    desc: Set different indentation for continued lines in Makefiles | Advanced configuration examples
    tags: [make]
  clang-format --dry-run -i file.mk:
    desc: Check if file needs formatting without modifying it | Dry run and verification
    tags: [make]
  clang-format -output-replacements-xml file.mk:
    desc: Output formatting changes in XML format (useful for tooling) | Dry run and verification
    tags: [make]
  git ls-files "*.mk" | xargs clang-format -i:
    desc: Format all tracked Makefiles in git repository | Git integration
    tags: [make, git]
  'clang-format -style="{IndentWidth: 4, AlignConsecutiveAssignments: true}" file.mk':
    desc: Align consecutive variable assignments in Makefiles | Common Makefile style configurations
    tags: [make]
  'clang-format -style="{IndentWidth: 4, AlignConsecutiveDeclarations: true}" file.mk':
    desc: Align consecutive variable declarations in Makefiles | Common Makefile style configurations
    tags: [make]
  clang-format -assume-filename=Makefile file.mk:
    desc: Force Makefile formatting rules even if filename is different | Handling special cases
    tags: [make]
  'clang-format -style="{SortIncludes: false}" file.mk':
    desc: Prevent sorting of include directives in Makefiles | Handling special cases
    tags: [make]
