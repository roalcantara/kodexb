      - md: | #markdown
          # FLOCI SERVICES OVERVIEW

          - Floci emulates 34 AWS services on a single port (`4566`). 
          - All services use the real AWS wire protocol, your existing AWS CLI commands and SDK clients work without modification.

          ## SERVICE MATRIX

          - Operation counts are exact.
          - For dispatch-table services (Query and JSON 1.1) each count reflects one case per AWS action in the handler.
          - For REST-based services (S3, Lambda, API Gateway v1) the count reflects distinct AWS SDK operations, collapsing routes where one JAX-RS handler fans out via query-string or header markers
            e.g. `PUT /{bucket}/{key}` → `PutObject`, `PutObjectTagging`, `PutObjectAcl`, etc.

          | **SERVICE**                                                               | **ENDPOINT**                                                                                                                  | **PROTOCOL**                | **SUPPORTED OPERATIONS**        |
          | ------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------- | --------------------------- | ------------------------------- |
          | [SSM](https://floci.io/floci/services/ssm)                                | `POST /` + `X-Amz-Target: AmazonSSM.*`                                                                                        | JSON 1.1                    | 12                              |
          | [SQS](https://floci.io/floci/services/sqs)                                | `POST /` with `Action=` param                                                                                                 | Query / JSON                | 20                              |
          | [SNS](https://floci.io/floci/services/sns)                                | `POST /` with `Action=` param                                                                                                 | Query / JSON                | 17                              |
          | [S3](https://floci.io/floci/services/s3)                                  | `/{bucket}/{key}                                                                                                              | REST XML                    | 58                              |
          | [DynamoDB](https://floci.io/floci/services/dynamodb)                      | `POST /` + `X-Amz-Target: DynamoDB\_20120810.*`                                                                               | JSON 1.1                    | 20                              |
          | [DynamoDB Streams](https://floci.io/floci/services/dynamodb/#streams)     | `POST /` + `X-Amz-Target: DynamoDBStreams\_20120810.*`                                                                        | JSON 1.1                    | 4                               |
          | [Lambda](https://floci.io/floci/services/lambda)                          | `/2015-03-31/functions/...`                                                                                                   | REST JSON                   | 30                              |
          | [API Gateway v1](https://floci.io/floci/services/api-gateway)             | `/restapis/...`                                                                                                               | REST JSON                   | 62                              |
          | [API Gateway v2](https://floci.io/floci/services/api-gateway/#v2)         | `/v2/apis/...`                                                                                                                | REST JSON                   | 21                              |
          | [IAM](https://floci.io/floci/services/iam)                                | `POST /` with `Action=` param                                                                                                 | Query                       | 68                              |
          | [STS](https://floci.io/floci/services/sts)                                | `POST /` with `Action=` param                                                                                                 | Query                       | 7                               |
          | [Cognito](https://floci.io/floci/services/cognito)                        | `POST /` + `X-Amz-Target: AWSCognitoIdentityProviderService.*`                                                                | JSON 1.1                    | 40                              |
          | [KMS](https://floci.io/floci/services/kms)                                | `POST /` + `X-Amz-Target: TrentService.*`                                                                                     | JSON 1.1                    | 23                              |
          | [Kinesis](https://floci.io/floci/services/kinesis)                        | `POST /` + `X-Amz-Target: Kinesis_20131202.*`                                                                                 | JSON 1.1                    | 24                              |
          | [Secrets Manager](https://floci.io/floci/services/secrets-manager)        | `POST /` + `X-Amz-Target: secretsmanager.*`                                                                                   | JSON 1.1                    | 16                              |
          | [Step Functions](https://floci.io/floci/services/step-functions)          | `POST /` + `X-Amz-Target: AmazonStatesService.*`                                                                              | JSON 1.1                    | 18                              |
          | [CloudFormation](https://floci.io/floci/services/cloudformation)          | `POST /` with `Action=` param                                                                                                 | Query                       | 18                              |
          | [EventBridge](https://floci.io/floci/services/eventbridge)                | `POST /` + `X-Amz-Target: AmazonEventBridge.*`                                                                                | JSON 1.1                    | 16                              |
          | [EventBridge Scheduler](https://floci.io/floci/services/scheduler)        | `/schedules/*`, `/schedule-groups/*`                                                                                          | REST JSON                   | 9                               |
          | [CloudWatch Logs](https://floci.io/floci/services/cloudwatch)             | `POST /` + `X-Amz-Target: Logs.*`                                                                                             | JSON 1.1                    | 17                              |
          | [CloudWatch Metrics](https://floci.io/floci/services/cloudwatch/#metrics) | `POST /` with `Action=` or JSON 1.1                                                                                           | Query / JSON                | 11                              |
          | [ElastiCache](https://floci.io/floci/services/elasticache)                | `POST /` with `Action=` param + TCP proxy                                                                                     | Query + RESP                | 8                               |
          | [RDS](https://floci.io/floci/services/rds)                                | `POST /` with `Action=` param + TCP proxy                                                                                     | Query + wire                | 14                              |
          | [ECS](https://floci.io/floci/services/ecs)                                | `POST /` + `X-Amz-Target: AmazonEC2ContainerServiceV20141113.*`                                                               | JSON 1.1                    | 58                              |
          | [EC2](https://floci.io/floci/services/ec2)                                | `POST /` with `Action=` param                                                                                                 | EC2 Query                   | 61                              |
          | [ACM](https://floci.io/floci/services/acm)                                | `POST /` + `X-Amz-Target: CertificateManager.*`                                                                               | JSON 1.1                    | 12                              |
          | [ECR](https://floci.io/floci/services/ecr)                                | `POST /` + `X-Amz-Target: AmazonEC2ContainerRegistry_V20150921.*` (control plane) and `/v2/...` (data plane via `registry:2`) | JSON 1.1 + OCI Distribution | 17                              |
          | [SES](https://floci.io/floci/services/ses)                                | `POST /` with `Action=` param                                                                                                 | Query                       | 16                              |
          | [SES v2](https://floci.io/floci/services/ses/#v2)                         | `/v2/email/*`                                                                                                                 | REST JSON                   | 9                               |
          | [OpenSearch](https://floci.io/floci/services/opensearch)                  | `/2021-01-01/opensearch/...`                                                                                                  | REST JSON                   | 24                              |
          | [AppConfig](https://floci.io/floci/services/appconfig)                    | `/applications/...`, `/deploymentstrategies/...`                                                                              | REST JSON                   | 16                              |
          | [AppConfigData](https://floci.io/floci/services/appconfig/#data-plane)    | `/configurationsessions`, `/configuration`                                                                                    | REST JSON                   | 2                               |
          | [Bedrock Runtime](https://floci.io/floci/services/bedrock-runtime)        | `/model/{modelId}/converse`, `/model/{modelId}/invoke`                                                                        | REST JSON                   | 2 (stub; streaming returns 501) |
          | [EKS](https://floci.io/floci/services/eks)                                | `/clusters`, `/clusters/{name}`, `/tags/{resourceArn}`                                                                        | REST JSON                   | 7                               |

          - **Lambda, ElastiCache, RDS, MSK, ECS, EKS, and OpenSearch** spin up real Docker containers and support IAM authentication and SigV4 request signing, the same auth flow as production AWS.

          - **ECR** runs a shared `registry:2` container so the stock `docker` client can push and pull image bytes against repositories returned by the AWS-shaped control plane. **EKS** (real mode) starts a k3s container per cluster and exposes the Kubernetes API server on a host port. **OpenSearch** (real mode) starts an `opensearchproject/opensearch` container per domain and exposes the data-plane REST API on a host port.

          ## COMMON SETUP

          Before calling any service, configure your AWS client to point to Floci:

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566
          export AWS_DEFAULT_REGION=us-east-1
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          ```

          - `AWS_ENDPOINT_URL` is the standard env var recognised by the AWS CLI v2 and AWS SDKs v2+, so no `--endpoint-url` flag is needed on each command.
      - md: | #markdown
          # QUICK START

          ## Step 1 — Start Floci

          ```dockercompose
          services:
            floci:
              name: Lambda + ElastiCache + RDS
              container_name: floci
              image: hectorvent/floci:latest
              ports:
                - "4566:4566"
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - ./data:/app/data
              environment:
                FLOCI_STORAGE_MODE: hybrid
                FLOCI_SERVICES_DOCKER_NETWORK: myapp_default
          ```

          Run the following command to start Floci:

          ```sh
          docker compose up -d
          ```

          ## Step 2 — Configure AWS CLI

          Floci accepts any dummy credentials — no real AWS account needed.
          Add these to your shell profile (.bashrc / .zshrc) so they persist across sessions:

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566
          export AWS_DEFAULT_REGION=us-east-1
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test          
          ```

          ## Step 3 — Verify the Setup

          Run a few quick smoke tests to verify the setup. You should see successful responses for all commands:

          ```sh
          # S3 — create a bucket and upload a file
          aws s3 mb s3://my-bucket --endpoint-url $AWS_ENDPOINT_URL
          echo "hello floci" | aws s3 cp - s3://my-bucket/hello.txt --endpoint-url $AWS_ENDPOINT_URL
          aws s3 ls s3://my-bucket --endpoint-url $AWS_ENDPOINT_URL

          # SQS — create a queue and send a message
          aws sqs create-queue --queue-name orders --endpoint-url $AWS_ENDPOINT_URL
          aws sqs send-message \
            --queue-url $AWS_ENDPOINT_URL/000000000000/orders \
            --message-body '{"event":"order.placed"}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # DynamoDB — create a table
          aws dynamodb create-table \
            --table-name Users \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url $AWS_ENDPOINT_URL
          ```

          ## Step 4 — Use in Your Application

          Point your AWS SDK to Floci the same way you would to AWS:

          - Python:

              ```python
              import boto3

              s3 = boto3.client(
                  "s3",
                  endpoint_url="http://localhost:4566",
                  region_name="us-east-1",
                  aws_access_key_id="test",
                  aws_secret_access_key="test",
              )
              ```

          - Node.js:

              ```js
              import { S3Client } from "@aws-sdk/client-s3";

              const s3 = new S3Client({
                endpoint: "http://localhost:4566",
                region: "us-east-1",
                credentials: { accessKeyId: "test", secretAccessKey: "test" },
                forcePathStyle: true,
              });
              ```

          - GO:
              
              ```go
              cfg, _ := config.LoadDefaultConfig(context.TODO(),
                  config.WithRegion("us-east-1"),
                  config.WithEndpointResolverWithOptions(
                      aws.EndpointResolverWithOptionsFunc(func(service, region string, opts ...interface{}) (aws.Endpoint, error) {
                          return aws.Endpoint{URL: "http://localhost:4566"}, nil
                      }),
                  ),
              )
              client := s3.NewFromConfig(cfg)
              ```

          ## Step 5 — (Optional) Push and pull a container image to emulated ECR

          - Floci emulates ECR with a real OCI registry behind it, so the stock docker client works against repositories you create through the AWS CLI.
          - No daemon configuration needed — Floci returns repository URIs that resolve to loopback, which docker auto-trusts as insecure.

          ```sh
          # Create the repository (lazy-starts the backing registry container)
          aws ecr create-repository --repository-name floci-it/app --endpoint-url $AWS_ENDPOINT

          # Authenticate
          aws ecr get-login-password --endpoint-url $AWS_ENDPOINT \
            | docker login --username AWS --password-stdin \
                  000000000000.dkr.ecr.us-east-1.localhost:5000

          # Push
          docker pull alpine:3.19
          docker tag  alpine:3.19 000000000000.dkr.ecr.us-east-1.localhost:5000/floci-it/app:v1
          docker push             000000000000.dkr.ecr.us-east-1.localhost:5000/floci-it/app:v1

          # Pull from a clean local image store
          docker rmi  000000000000.dkr.ecr.us-east-1.localhost:5000/floci-it/app:v1
          docker pull 000000000000.dkr.ecr.us-east-1.localhost:5000/floci-it/app:v1
          ```
  https://floci.io/floci/services/ssm:
    desc: Floci emulates AWS Systems Manager (SSM) - services for managing parameters, secrets, and other configuration settings.
    tags: [ floci, aws, ssm ]
    links:
      - AWS SSM Documentation: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html
    notes:
      - md: | #markdown
          # SSM Parameter Store

          - **Protocol:** JSON 1.1 (`X-Amz-Target: AmazonSSM.*`)
          - **Endpoint:** `POST http://localhost:4566/`

          ## SUPPORTED ACTIONS

          | Action                 | Description                            |
          | ---------------------- | -------------------------------------- |
          | PutParameter           | Create or update a parameter           |
          | GetParameter           | Get a single parameter by name         |
          | GetParameters          | Get multiple parameters by name        |
          | GetParametersByPath    | Get all parameters under a path prefix |
          | DeleteParameter        | Delete a parameter                     |
          | DeleteParameters       | Delete multiple parameters             |
          | GetParameterHistory    | List all versions of a parameter       |
          | DescribeParameters     | List parameters with optional filters  |
          | LabelParameterVersion  | Attach a label to a specific version   |
          | AddTagsToResource      | Tag a parameter                        |
          | ListTagsForResource    | List tags on a parameter               |
          | RemoveTagsFromResource | Remove tags from a parameter           |

          ## CONFIGURATION

          ```dockercompose
          floci:
            services:
              ssm:
                enabled: true
                max-parameter-history: 5   # Versions retained per parameter
                storage:
                  services:
                    ssm:
                      mode: memory
                      flush-interval-ms: 5000
          ```

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Store parameters
          aws ssm put-parameter --endpoint-url $AWS_ENDPOINT_URL \
            --name /app/db/host --value "localhost" --type String

          aws ssm put-parameter --endpoint-url $AWS_ENDPOINT_URL \
            --name /app/db/password --value "secret" --type SecureString

          # Retrieve
          aws ssm get-parameter --endpoint-url $AWS_ENDPOINT_URL \
            --name /app/db/host

          aws ssm get-parameters-by-path --endpoint-url $AWS_ENDPOINT_URL \
            --path /app/ --recursive

          # Delete
          aws ssm delete-parameter --endpoint-url $AWS_ENDPOINT_URL \
            --name /app/db/host
          ```

          ## PARAMETER TYPES

          - All AWS parameter types are accepted: `String`, `StringList`, `SecureString`.

          > 💡 **NOTE**
          >
          > `SecureString` parameters are stored as-is without actual KMS encryption in Floci.
          > The type is preserved and returned correctly, but the value is not encrypted at rest.
  https://floci.io/floci/services/sqs/:
    desc: Floci emulates AWS SQS — local emulator docs mirrored from https://floci.io/floci/services/sqs/.
    tags: [ floci, aws, sqs ]
    links:
      - AWS SQS Documentation: https://docs.aws.amazon.com/sqs/index.html
    notes:
      - md: | #markdown
          # SQS

          - **Protocol:** Query (XML) and JSON 1.0 (both supported)
          - **Endpoint:** `POST http://localhost:4566/`

          ## SUPPORTED ACTIONS

          | Action | Description |
          |----|----|
          | `CreateQueue` | Create a standard or FIFO queue |
          | `DeleteQueue` | Delete a queue |
          | `ListQueues` | List all queues |
          | `GetQueueUrl` | Look up a queue URL by name |
          | `GetQueueAttributes` | Get queue configuration attributes |
          | `SetQueueAttributes` | Update queue configuration |
          | `SendMessage` | Send a message to a queue |
          | `SendMessageBatch` | Send up to 10 messages in one call |
          | `ReceiveMessage` | Poll for messages |
          | `DeleteMessage` | Acknowledge and delete a message |
          | `DeleteMessageBatch` | Delete multiple messages at once |
          | `ChangeMessageVisibility` | Extend or reset a message's visibility timeout |
          | `ChangeMessageVisibilityBatch` | Change visibility for multiple messages |
          | `PurgeQueue` | Delete all messages in a queue |
          | `TagQueue` | Add tags to a queue |
          | `UntagQueue` | Remove tags from a queue |
          | `ListQueueTags` | List tags on a queue |
          | `ListDeadLetterSourceQueues` | Find queues that use this queue as DLQ |
          | `StartMessageMoveTask` | Start a DLQ redrive task |
          | `ListMessageMoveTasks` | List DLQ redrive tasks |

          ## CONFIGURATION

          ```dockercompose
          floci:
            services:
              sqs:
                enabled: true
                default-visibility-timeout: 30  # Seconds
                max-message-size: 262144        # 256 KB
          ```

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create a standard queue
          aws sqs create-queue --queue-name orders --endpoint-url $AWS_ENDPOINT_URL

          # Create a FIFO queue
          aws sqs create-queue \
            --queue-name orders.fifo \
            --attributes FifoQueue=true \
            --endpoint-url $AWS_ENDPOINT_URL

          # Send a message
          QUEUE_URL="$AWS_ENDPOINT_URL/000000000000/orders"
          aws sqs send-message \
            --queue-url $QUEUE_URL \
            --message-body '{"event":"order.placed","id":"abc123"}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # Receive messages
          aws sqs receive-message \
            --queue-url $QUEUE_URL \
            --max-number-of-messages 10 \
            --endpoint-url $AWS_ENDPOINT_URL

          # Delete a message (replace RECEIPT_HANDLE with the value from ReceiveMessage)
          aws sqs delete-message \
            --queue-url $QUEUE_URL \
            --receipt-handle "RECEIPT_HANDLE" \
            --endpoint-url $AWS_ENDPOINT_URL

          # Set up a dead-letter queue
          DLQ_ARN=$(aws sqs get-queue-attributes \
            --queue-url $AWS_ENDPOINT_URL/000000000000/orders-dlq \
            --attribute-names QueueArn \
            --query Attributes.QueueArn \
            --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          aws sqs set-queue-attributes \
            --queue-url $QUEUE_URL \
            --attributes "{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$DLQ_ARN\\\",\\\"maxReceiveCount\\\":3}\"}" \
            --endpoint-url $AWS_ENDPOINT_URL
          ```

          ## QUEUE URL FORMAT

          ```sh
          open http://localhost:4566/000000000000/<queue-name>
          ```
  https://floci.io/floci/services/sns:
    desc: Floci emulates AWS SNS — local emulator docs mirrored from https://floci.io/floci/services/sns.
    tags: [ floci, aws, sns ]
    links:
      - AWS SNS Documentation: https://docs.aws.amazon.com/sns/index.html
    notes:
      - md: | #markdown
          # SNS

          - **Protocol:** Query (XML) and JSON 1.0 (both supported) 
          - **Endpoint:** `POST http://localhost:4566/`

          ## SUPPORTED ACTIONS

          | Action | Description |
          |----|----|
          | `CreateTopic` | Create a topic |
          | `DeleteTopic` | Delete a topic |
          | `ListTopics` | List all topics |
          | `GetTopicAttributes` | Get topic configuration |
          | `SetTopicAttributes` | Update topic configuration |
          | `Subscribe` | Subscribe an endpoint (SQS, HTTP, Lambda, email) |
          | `Unsubscribe` | Remove a subscription |
          | `ListSubscriptions` | List all subscriptions |
          | `ListSubscriptionsByTopic` | List subscriptions for a specific topic |
          | `GetSubscriptionAttributes` | Get subscription settings |
          | `SetSubscriptionAttributes` | Update subscription settings |
          | `ConfirmSubscription` | Confirm a pending subscription |
          | `Publish` | Publish a message to a topic |
          | `PublishBatch` | Publish up to 10 messages in one call |
          | `TagResource` | Tag a topic |
          | `UntagResource` | Remove tags from a topic |
          | `ListTagsForResource` | List tags on a topic |

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create a topic
          TOPIC_ARN=$(aws sns create-topic --name notifications \
            --query TopicArn --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Subscribe an SQS queue
          QUEUE_ARN=$(aws sqs get-queue-attributes \
            --queue-url $AWS_ENDPOINT_URL/000000000000/orders \
            --attribute-names QueueArn \
            --query Attributes.QueueArn --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          aws sns subscribe \
            --topic-arn $TOPIC_ARN \
            --protocol sqs \
            --notification-endpoint $QUEUE_ARN \
            --endpoint-url $AWS_ENDPOINT_URL

          # Publish a message
          aws sns publish \
            --topic-arn $TOPIC_ARN \
            --message '{"event":"user.registered"}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # Fan-out: publish and verify the SQS queue received the message
          aws sqs receive-message \
            --queue-url $AWS_ENDPOINT_URL/000000000000/orders \
            --endpoint-url $AWS_ENDPOINT_URL
          ```

          ## SNS → SQS Fan-Out

          - Floci supports real SNS → SQS fan-out. 
          - When you publish to a topic, all SQS-subscribed queues receive the message immediately.

          - **Supported subscription protocols:** 
            - `sqs` delivers to a Floci SQS queue 
            - `lambda` invokes a Floci Lambda function
            - `http` / `https` posts to an HTTP endpoint
  https://floci.io/floci/services/s3:
    desc: Floci emulates AWS S3 — object storage service that provides storage for objects.
    tags: [ floci, aws, s3 ]
    links:
      - AWS S3 Documentation: https://docs.aws.amazon.com/s3/index.html
    notes:
      - md: | #markdown
          # AWS S3

          - **Protocol:** REST XML
          - **Endpoint:** `http://localhost:4566/{bucket}/{key}`

          ## SUPPORTED OPERATIONS

          ### BUCKETS

          | Action | Description |
          |----|----|
          | `ListBuckets` | List all buckets |
          | `CreateBucket` | Create a new bucket |
          | `HeadBucket` | Get bucket metadata |
          | `DeleteBucket` | Delete a bucket |
          | `GetBucketLocation` | Get bucket location |

          ### OBJECTS

          | Action | Description |
          |----|----|
          | `PutObject` | Upload an object |
          | `GetObject` | Download an object |
          | `GetObjectAttributes` | Get object metadata |
          | `HeadObject` | Get object metadata |
          | `DeleteObject` | Delete an object |
          | `DeleteObjects` | Delete multiple objects |
          | `CopyObject` | Copy an object |

          ### LISTING

          | Action | Description |
          |----|----|
          | `ListObjects` | List objects |
          | `ListObjectsV2` | List objects |
          | `ListObjectVersions` | List object versions |

          ### MULTIPART

          | Action | Description |
          |----|----|
          | `CreateMultipartUpload` | Create a multipart upload |
          | `UploadPart` | Upload a part |
          | `CompleteMultipartUpload` | Complete a multipart upload |
          | `AbortMultipartUpload` | Abort a multipart upload |
          | `ListMultipartUploads` | List multipart uploads |

          ### VERSIONING

          | Action | Description |
          |----|----|
          | `PutBucketVersioning` | Put bucket versioning |
          | `GetBucketVersioning` | Get bucket versioning |

          ### TAGGING

          | Action | Description |
          |----|----|
          | `PutBucketTagging` | Put bucket tagging |
          | `GetBucketTagging` | Get bucket tagging |
          | `PutObjectTagging` | Put object tagging |
          | `GetObjectTagging` | Get object tagging |
          | `DeleteObjectTagging` | Delete object tagging |

          ### POLICY

          | Action | Description |
          |----|----|
          | `PutBucketPolicy` | Put bucket policy |
          | `GetBucketPolicy` | Get bucket policy |
          | `DeleteBucketPolicy` | Delete bucket policy |

          ### CORS

          | Action | Description |
          |----|----|
          | `PutBucketCors` | Put bucket CORS |
          | `GetBucketCors` | Get bucket CORS |
          | `DeleteBucketCors` | Delete bucket CORS |

          ### LIFECYCLE

          | Action | Description |
          |----|----|
          | `PutBucketLifecycle` | Put bucket lifecycle |
          | `GetBucketLifecycle` | Get bucket lifecycle |
          | `DeleteBucketLifecycle` | Delete bucket lifecycle |

          ### ACL

          | Action | Description |
          |----|----|
          | `PutBucketAcl` | Put bucket ACL |
          | `GetBucketAcl` | Get bucket ACL |
          | `DeleteBucketAcl` | Delete bucket ACL |
          | `PutObjectAcl` | Put object ACL |
          | `GetObjectAcl` | Get object ACL |
          | `DeleteObjectAcl` | Delete object ACL |

          ### ENCRYPTION

          | Action | Description |
          |----|----|
          | `PutBucketEncryption` | Put bucket encryption |
          | `GetBucketEncryption` | Get bucket encryption |
          | `DeleteBucketEncryption` | Delete bucket encryption |

          ### NOTIFICATIONS

          | Action | Description |
          |----|----|
          | `PutBucketNotification` | Put bucket notification |
          | `GetBucketNotification` | Get bucket notification |

          ### OBJECT LOCK

          | Action | Description |
          |----|----|
          | `PutObjectLockConfiguration` | Put object lock configuration |
          | `GetObjectLockConfiguration` | Get object lock configuration |
          | `PutObjectRetention` | Put object retention |
          | `GetObjectRetention` | Get object retention |
          | `PutObjectLegalHold` | Put object legal hold |
          | `GetObjectLegalHold` | Get object legal hold |

          ### PRE-SIGNED URLs

          | Action | Description |
          |----|----|
          | `GeneratePresignedUrl` | Generates and validates pre-signed GET/PUT URLs |

          ### S3 SELECT

          | Action | Description |
          |----|----|
          | `SelectObjectContent` | Select object content |

          ### PUBLIC ACCESS BLOCK

          | Action | Description |
          |----|----|
          | `PutPublicAccessBlock` | Put public access block |
          | `GetPublicAccessBlock` | Get public access block |
          | `DeletePublicAccessBlock` | Delete public access block |

          ### RestoreObject

          Is accepted but stubbed: Floci validates the request and returns `202 Accepted`, but no restore state machine runs.

          ## NOT IMPLEMENTED

          These AWS S3 features have no handler in Floci. Calls will return an error (typically `404` or `NoSuchBucket`-style):

          - Replication (`PutBucketReplication`, `GetBucketReplication`, `DeleteBucketReplication`)
          - Website hosting (`PutBucketWebsite`, `GetBucketWebsite`, `DeleteBucketWebsite`)
          - Access logging (`PutBucketLogging`, `GetBucketLogging`)
          - Request payment (`PutBucketRequestPayment`, `GetBucketRequestPayment`)
          - Intelligent-Tiering configurations
          - Inventory configurations
          - Metrics and Analytics configurations

          ## CONFIGURATION

          ```dockercompose
          floci:
            services:
              s3:
                enabled: true
                default-presign-expiry-seconds: 3600
            auth:
              presign-secret: local-emulator-secret
          ```

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create bucket
          aws s3 mb s3://my-bucket --endpoint-url $AWS_ENDPOINT_URL

          # Upload a file
          aws s3 cp ./report.pdf s3://my-bucket/reports/report.pdf --endpoint-url $AWS_ENDPOINT_URL

          # Upload inline content
          echo '{"hello":"world"}' | aws s3 cp - s3://my-bucket/data.json --endpoint-url $AWS_ENDPOINT_URL

          # Download
          aws s3 cp s3://my-bucket/data.json ./data.json --endpoint-url $AWS_ENDPOINT_URL

          # Inspect object attributes without downloading the body
          aws s3api get-object-attributes \
            --bucket my-bucket \
            --key data.json \
            --object-attributes ETag ObjectSize StorageClass \
            --endpoint-url $AWS_ENDPOINT_URL

          # List
          aws s3 ls s3://my-bucket --endpoint-url $AWS_ENDPOINT_URL

          # Delete
          aws s3 rm s3://my-bucket/data.json --endpoint-url $AWS_ENDPOINT_URL

          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket my-bucket \
            --versioning-configuration Status=Enabled \
            --endpoint-url $AWS_ENDPOINT_URL

          # Generate a pre-signed URL (valid for 1 hour)
          aws s3 presign s3://my-bucket/report.pdf \
            --expires-in 3600 \
            --endpoint-url $AWS_ENDPOINT_URL
          ```

          ## PATH-STYLE URLs

          Floci uses path-style URLs:

          ```sh
          http://localhost:4566/my-bucket/my-key
          ```

          When using the AWS SDK, enable path-style mode:

          - NODE.JS:

              ```js
              const s3 = new S3Client({
                endpoint: "http://localhost:4566",
                forcePathStyle: true,
              });
              ```

          - PYTHON:

              ```py
              s3 = boto3.client("s3",
                  endpoint_url="http://localhost:4566",
                  config=Config(s3={"addressing_style": "path"}))
              ```

          ## OBJECT ATTRIBUTE NOTES

          Floci now persists and returns the following object attribute state on S3 object APIs:

          - user metadata from `x-amz-meta-*`
          - storage class from `x-amz-storage-class`
          - checksum metadata for object reads and `GetObjectAttributes`
          - multipart part manifests for `GetObjectAttributes(ObjectParts)`
          - canned object ACLs from `x-amz-acl` on `PutObject`, `CopyObject`, and multipart initiation
          - explicit object SSE headers from `x-amz-server-side-encryption` on `PutObject`, `CopyObject`, and multipart initiation, replayed on `GetObject` and `HeadObject`

          ### CURRENT LIMITATIONS

          - checksum responses focus on SHA-1 and SHA-256
          - copy-based metadata updates support `x-amz-metadata-directive: REPLACE` for user metadata and content type, but do not yet cover every AWS copy header
          - explicit ACL grant headers such as `x-amz-grant-read` and `x-amz-grant-full-control` are not modeled yet
          - cross-account canned ACL variants collapse to the emulator's single synthetic owner where Floci does not model a distinct second principal
          - `aws-exec-read` is accepted for compatibility, but Floci does not yet model a distinct EC2 bundle-reader grantee in `GetObjectAcl`
  https://floci.io/floci/services/dynamodb:
    desc: Floci emulates AWS DynamoDB — NoSQL database service that provides storage for items.
    tags: [ floci, aws, dynamodb ]
    links:
      - AWS DynamoDB Documentation: https://docs.aws.amazon.com/dynamodb/index.html
    notes:
      - md: | #markdown
          # AWS DynamoDB

          - **Protocol:** JSON 1.1 (`X-Amz-Target: DynamoDB_20120810.*`)
          - **Endpoint:** `POST http://localhost:4566/`

          ## SUPPORTED ACTIONS

          | Action               | Description                                 |
          |----------------------|---------------------------------------------|
          | `CreateTable`        | Create a table with indexes                 |
          | `DeleteTable`        | Delete a table                              |
          | `DescribeTable`      | Get table metadata                          |
          | `ListTables`         | List all tables                             |
          | `UpdateTable`        | Update throughput, indexes, streams         |
          | `PutItem`            | Write an item                               |
          | `GetItem`            | Read an item by primary key                 |
          | `DeleteItem`         | Delete an item                              |
          | `UpdateItem`         | Partially update an item                    |
          | `Query`              | Query by partition key with optional filter |
          | `Scan`               | Full table scan with optional filter        |
          | `BatchWriteItem`     | Write/delete up to 25 items across tables   |
          | `BatchGetItem`       | Read up to 100 items across tables          |
          | `TransactWriteItems` | ACID write transaction                      |
          | `TransactGetItems`   | ACID read transaction                       |
          | `DescribeTimeToLive` | Get TTL configuration                       |
          | `UpdateTimeToLive`   | Enable/disable TTL on a table               |
          | `TagResource`        | Tag a table                                 |
          | `UntagResource`      | Remove tags                                 |
          | `ListTagsOfResource` | List tags                                   |

          ## STREAMS

          DynamoDB Streams are supported via a separate target (`DynamoDBStreams_20120810`):

          | Action             | Description                      |
          |--------------------|----------------------------------|
          | `ListStreams`      | List all streams                 |
          | `DescribeStream`   | Get stream and shard info        |
          | `GetShardIterator` | Get a shard iterator             |
          | `GetRecords`       | Read stream records from a shard |

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create a table
          aws dynamodb create-table \
            --table-name Users \
            --attribute-definitions \
              AttributeName=userId,AttributeType=S \
            --key-schema \
              AttributeName=userId,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url $AWS_ENDPOINT_URL

          # Put an item
          aws dynamodb put-item \
            --table-name Users \
            --item '{"userId":{"S":"u1"},"name":{"S":"Alice"},"age":{"N":"30"}}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # Get an item
          aws dynamodb get-item \
            --table-name Users \
            --key '{"userId":{"S":"u1"}}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # Query (partition key)
          aws dynamodb query \
            --table-name Users \
            --key-condition-expression "userId = :id" \
            --expression-attribute-values '{":id":{"S":"u1"}}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # Scan with filter
          aws dynamodb scan \
            --table-name Users \
            --filter-expression "age > :min" \
            --expression-attribute-values '{":min":{"N":"25"}}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # Enable TTL
          aws dynamodb update-time-to-live \
            --table-name Users \
            --time-to-live-specification Enabled=true,AttributeName=expiresAt \
            --endpoint-url $AWS_ENDPOINT_URL

          # Enable Streams
          aws dynamodb update-table \
            --table-name Users \
            --stream-specification StreamEnabled=true,StreamViewType=NEW_AND_OLD_IMAGES \
            --endpoint-url $AWS_ENDPOINT_URL
          ```

          ## GLOBAL SECONDARY INDEXES

          ```sh
          aws dynamodb create-table \
            --table-name Orders \
            --attribute-definitions \
              AttributeName=orderId,AttributeType=S \
              AttributeName=customerId,AttributeType=S \
            --key-schema AttributeName=orderId,KeyType=HASH \
            --global-secondary-indexes '[{
              "IndexName": "CustomerIndex",
              "KeySchema": [{"AttributeName":"customerId","KeyType":"HASH"}],
              "Projection": {"ProjectionType":"ALL"}
            }]' \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url $AWS_ENDPOINT_URL
          ```
  https://floci.io/floci/services/lambda:
    desc: Floci emulates AWS Lambda - serverless compute service that lets you run code without provisioning or managing servers.
    tags: [ floci, aws, lambda ]
    links:
      - AWS Lambda Documentation: https://docs.aws.amazon.com/lambda/index.html
    notes:
      - md: | #markdown
          # AWS Lambda

          AWS Lambda runs your function code inside real Docker containers — the same way real AWS Lambda does.

          - **Protocol:** REST JSON
          - **Endpoint:** `http://localhost:4566/2015-03-31/functions/...`

          ## SUPPORTED OPERATIONS

          | Operation | Description |
          |----|----|
          | `CreateFunction` | Deploy a Lambda function |
          | `GetFunction` | Get function details and download URL |
          | `GetFunctionConfiguration` | Get runtime configuration |
          | `ListFunctions` | List all functions |
          | `UpdateFunctionCode` | Upload new code |
          | `UpdateFunctionConfiguration` | Update runtime, handler, memory, timeout, environment, architectures, tracing, layers, and more |
          | `DeleteFunction` | Remove a function |
          | `Invoke` | Invoke a function synchronously or asynchronously |
          | `CreateEventSourceMapping` | Connect SQS / Kinesis / DynamoDB Streams to a function |
          | `GetEventSourceMapping` | Get event source mapping details |
          | `ListEventSourceMappings` | List all event source mappings |
          | `UpdateEventSourceMapping` | Update a mapping |
          | `DeleteEventSourceMapping` | Remove a mapping |
          | `PublishVersion` | Publish an immutable version |
          | `ListVersionsByFunction` | List all published versions of a function |
          | `CreateAlias` | Create a named alias pointing to a version |
          | `GetAlias` | Get alias details |
          | `ListAliases` | List all aliases for a function |
          | `UpdateAlias` | Update an alias |
          | `DeleteAlias` | Delete an alias |
          | `AddPermission` | Add a resource-policy statement |
          | `GetPolicy` | Get the function resource policy |
          | `RemovePermission` | Remove a resource-policy statement |
          | `GetFunctionCodeSigningConfig` | Return code-signing config (always empty) |
          | `CreateFunctionUrlConfig` | Provision a function URL |
          | `GetFunctionUrlConfig` | Read function URL config |
          | `UpdateFunctionUrlConfig` | Update function URL config |
          | `DeleteFunctionUrlConfig` | Delete function URL config |
          | `ListTags` | List tags on a function |
          | `TagResource` | Tag a function |
          | `UntagResource` | Untag a function |
          | `PutFunctionConcurrency` | Set reserved concurrent executions |
          | `GetFunctionConcurrency` | Get reserved concurrent executions |
          | `DeleteFunctionConcurrency` | Clear reserved concurrent executions |

          ## HOT-RELOADING VIA REACTIVE S3 SYNC

          - Floci supports an automatic hot-reloading mechanism when functions are deployed via S3. 
          - This follows the standard AWS behavior where S3 and Lambda interact, but is optimized for a seamless local development experience.
          - When a Lambda function is created using an S3 bucket and key, Floci maintains a link between the function and its source object. 
          - Any subsequent update to that S3 object (e.g., via `s3:PutObject`) automatically triggers a reactive synchronization:

              1.  **Detection**: Floci detects the S3 update via an internal event system.
              2.  **Synchronization**: The new code is automatically re-extracted to the local code storage.
              3.  **Invalidation**: Any active "warm" containers for that function are proactively drained.
              4.  **Reload**: The very next invocation starts a fresh container with the updated code.

          This allows you to update your Lambda code by simply re-uploading your ZIP to S3, without having to manually call `UpdateFunctionCode` or restart any containers.

          ### EXAMPLE

          ```sh
          # 1. Create a function linked to S3
          aws lambda create-function \
            --function-name my-function \
            --code S3Bucket=my-bucket,S3Key=function.zip \
            ...

          # 2. Invoke (starts a warm container)
          aws lambda invoke --function-name my-function out.json

          # 3. Update the code in S3 (Triggers Reactive Sync)
          aws s3 cp updated-function.zip s3://my-bucket/function.zip

          # 4. Invoke again (automatically picks up the new code)
          aws lambda invoke --function-name my-function out.json
          ```

          > 💡 **STANDARD BEHAVIOR**
          >
          > This mechanism requires no custom configuration or non-standard magic strings.
          >
          > It works with standard AWS SDKs and CLI tools, providing a "live" development feel while staying within the AWS API contract.

          > 💡 **CONCURRENCY ENFORCEMENT**
          >
          > Reserved concurrency is enforced: invocations beyond the reserved value return `TooManyRequestsException` (HTTP 429).
          >
          > Functions without a reserved value share a **per-region** pool 
          >
          >   — AWS Lambda's "account-level" limit is in fact a per-account-per-region quota, and Floci mirrors that by partitioning counters on the ARN's region segment. 
          >   - The pool size (default 1000) is configurable via `floci.services.lambda.region-concurrency-limit` and applies independently to each region. 
          >   - `PutFunctionConcurrency` validates that the requested value leaves at least `floci.services.lambda.unreserved-concurrency-min` (default 100) available for unreserved functions in that region. 
          >   - `PutProvisionedConcurrencyConfig` and related provisioned-concurrency operations remain unimplemented.
          >
          > Reducing or clearing a function's reserved value does not kill invocations that are already in flight 
          >
          >   — this matches AWS, which applies changes only to new invocations. 
          >   - As a consequence, during the drain window `Σreserved-inflight + unreserved-inflight` can briefly exceed `region-concurrency-limit`.

          ### FUNCTION URLS

          - Function URLs are also reachable directly on `/{proxy:.*}` under the Lambda URL controller, which routes the request into the normal `Invoke` path.
          - **Stubbed:** `ListLayers` and `ListLayerVersions` return empty arrays. No layer storage exists.

          ## NOT IMPLEMENTED

          - These AWS Lambda operations have no handler in Floci. Calls will return `404` or an error:

            - Layers (`PublishLayerVersion`, `DeleteLayerVersion`, `GetLayerVersion`, `GetLayerVersionByArn`, `AddLayerVersionPermission`, `RemoveLayerVersionPermission`, `GetLayerVersionPolicy`)
            - Provisioned concurrency (`PutProvisionedConcurrencyConfig`, `GetProvisionedConcurrencyConfig`, `ListProvisionedConcurrencyConfigs`, `DeleteProvisionedConcurrencyConfig`)
            - Dead-letter, async invoke config, and event invoke config operations
            - `InvokeWithResponseStream`
            - Code signing management (only `GetFunctionCodeSigningConfig` is wired; there is no `PutFunctionCodeSigningConfig` or `CreateCodeSigningConfig`)
            - Account and regional settings (`GetAccountSettings`)

          ## CONFIGURATION

          ```dockercompose
          floci:
            services:
              lambda:
                enabled: true
                ephemeral: false                     # Remove container after each invocation
                default-memory-mb: 128
                default-timeout-seconds: 3
                runtime-api-base-port: 9200
                runtime-api-max-port: 9299
                code-path: ./data/lambda-code        # ZIP storage location
                poll-interval-ms: 1000
                container-idle-timeout-seconds: 300  # Idle container cleanup
                region-concurrency-limit: 1000       # Concurrent executions ceiling per region
                unreserved-concurrency-min: 100      # Min unreserved capacity PutFunctionConcurrency must leave
          ```

          ### DOCKER SOCKET REQUIREMENT

          - Lambda requires the Docker socket. Mount it in your compose file:

              ```dockercompose
              floci:
                services:
                  floci:
                    volumes:
                      - /var/run/docker.sock:/var/run/docker.sock
              ```

          ### PRIVATE REGISTRY AUTHENTICATION

          - Container image functions (`"PackageType": "Image"`) that pull from private registries need Docker credentials.
          - See [Docker Configuration → Private Registry Authentication](https://floci.io/floci/configuration/docker/#private-registry-authentication) for the full guide.

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Package a simple Node.js function
          cat > index.mjs << 'EOF'
          export const handler = async (event) => {
            console.log("Event:", JSON.stringify(event));
            return { statusCode: 200, body: JSON.stringify({ hello: "world" }) };
          };
          EOF
          zip function.zip index.mjs

          # Deploy the function
          aws lambda create-function \
            --function-name my-function \
            --runtime nodejs22.x \
            --role arn:aws:iam::000000000000:role/lambda-role \
            --handler index.handler \
            --zip-file fileb://function.zip \
            --endpoint-url $AWS_ENDPOINT_URL

          # Invoke synchronously
          aws lambda invoke \
            --function-name my-function \
            --payload '{"key":"value"}' \
            --cli-binary-format raw-in-base64-out \
            response.json \
            --endpoint-url $AWS_ENDPOINT_URL

          cat response.json

          # Invoke asynchronously
          aws lambda invoke \
            --function-name my-function \
            --invocation-type Event \
            --payload '{"key":"value"}' \
            --cli-binary-format raw-in-base64-out \
            /dev/null \
            --endpoint-url $AWS_ENDPOINT_URL

          # Update code
          zip function.zip index.mjs
          aws lambda update-function-code \
            --function-name my-function \
            --zip-file fileb://function.zip \
            --endpoint-url $AWS_ENDPOINT_URL
          ```

          ## EVENT SOURCE MAPPINGS

          - Connect Lambda to SQS, Kinesis, or DynamoDB Streams:

              ```sh
              # SQS trigger
              QUEUE_ARN=$(aws sqs get-queue-attributes \
                --queue-url $AWS_ENDPOINT_URL/000000000000/orders \
                --attribute-names QueueArn \
                --query Attributes.QueueArn --output text \
                --endpoint-url $AWS_ENDPOINT_URL)

              aws lambda create-event-source-mapping \
                --function-name my-function \
                --event-source-arn $QUEUE_ARN \
                --batch-size 10 \
                --endpoint-url $AWS_ENDPOINT_URL
              ```

          ### SCALINGCONFIG (SQS ONLY)

          - `CreateEventSourceMapping` and `UpdateEventSourceMapping` accept a `ScalingConfig.MaximumConcurrency` integer between 2 and 1000 on SQS event sources, matching the AWS wire format.
          - `GetEventSourceMapping` and `ListEventSourceMappings` echo the value back when set; responses omit the `ScalingConfig` field entirely when no cap is configured.

              ```sh
              aws lambda create-event-source-mapping \
                --function-name my-function \
                --event-source-arn $QUEUE_ARN \
                --scaling-config MaximumConcurrency=5 \
                --endpoint-url $AWS_ENDPOINT_URL
              ```

          - **Validation mirrors AWS:** values outside 2-1000 are rejected with `InvalidParameterValueException`, and `ScalingConfig` on a non-SQS event source (Kinesis / DynamoDB Streams) is also rejected
          - those services use `ParallelizationFactor` instead, which is a separate field.

          > 💡 **ENFORCEMENT STATUS**
          >
          >   - The configured `MaximumConcurrency` is persisted and returned on the wire, but the SQS poller does not yet cap concurrent invocations at this value (the poller today serializes invocations per ESM to one at a time regardless). 
          >   - Real parallel dispatch capped by `MaximumConcurrency` is tracked as a follow-up.

          ## SUPPORTED RUNTIMES

          - Any runtime that has an official AWS Lambda container image works with Floci:
            - `nodejs22.x`
            - `python3.13`
            - `java21`
            - `go1.x`
            - `provided.al2023`
  https://floci.io/floci/services/api-gateway:
    desc: Floci emulates AWS API Gateway - a fully managed service that allows you to create, publish, maintain, and secure APIs at any scale.
    tags: [ floci, aws, api-gateway ]
    links:
      - AWS API Gateway Documentation: https://docs.aws.amazon.com/apigateway/index.html
      - AWS API Gateway V1 Documentation: https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api.html
      - AWS API Gateway V2 Documentation: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api.html
    notes:
      - md: | #markdown
          # API GATEWAY

          Floci supports both API Gateway v1 (REST APIs) and API Gateway v2 (HTTP APIs).

          ## API GATEWAY V1 (REST APIs)

          - **Protocol:** REST JSON
          - **Endpoint:** `http://localhost:4566/restapis/...`

          ### SUPPORTED OPERATIONS

          #### APIs

          | Operation | Description |
          |----|----|
          | `CreateRestApi` | Create a REST API |
          | `ImportRestApi` | Import a REST API |
          | `PutRestApi` | Update a REST API |
          | `GetRestApi` | Get a REST API |
          | `GetRestApis` | Get all REST APIs |
          | `UpdateRestApi` | Update a REST API |
          | `DeleteRestApi` | Delete a REST API |

          #### RESOURCES

          | Operation | Description |
          |----|----|
          | `CreateResource` | Create a resource |
          | `GetResource` | Get a resource |
          | `GetResources` | Get all resources |
          | `UpdateResource` | Update a resource |
          | `DeleteResource` | Delete a resource |

          #### METHODS

          | Operation | Description |
          |----|----|
          | `PutMethod` | Put a method |
          | `GetMethod` | Get a method |
          | `UpdateMethod` | Update a method |
          | `DeleteMethod` | Delete a method |

          #### METHOD RESPONSES

          | Operation | Description |
          |----|----|
          | `PutMethodResponse` | Put a method response |
          | `GetMethodResponse` | Get a method response |

          #### INTEGRATIONS

          | Operation | Description |
          |----|----|
          | `PutIntegration` | Put an integration |
          | `GetIntegration` | Get an integration |
          | `UpdateIntegration` | Update an integration |
          | `DeleteIntegration` | Delete an integration |

          #### Integration Responses** | Put an integration response |

          | Operation | Description |
          |----|----|
          | `PutIntegrationResponse` | Put an integration response |
          | `GetIntegrationResponse` | Get an integration response |

          #### DEPLOYMENTS

          | Operation | Description |
          |----|----|
          | `CreateDeployment` | Create a deployment |
          | `GetDeployments` | Get deployments |

          #### STAGES

          | Operation | Description |
          |----|----|
          | `CreateStage` | Create a stage |
          | `GetStage` | Get a stage |
          | `GetStages` | Get all stages |
          | `UpdateStage` | Update a stage |
          | `DeleteStage` | Delete a stage |

          #### AUTHORIZERS

          | Operation | Description |
          |----|----|
          | `CreateAuthorizer` | Create an authorizer |
          | `GetAuthorizer` | Get an authorizer |
          | `GetAuthorizers` | Get all authorizers |

          #### API KEYs

          | Operation | Description |
          |----|----|
          | `CreateApiKey` | Create an API key |
          | `GetApiKeys` | Get API keys |

          #### USAGE PLANS

          | Operation | Description |
          |----|----|
          | `CreateUsagePlan` | Create a usage plan |
          | `GetUsagePlans` | Get usage plans |
          | `DeleteUsagePlan` | Delete a usage plan |

          #### USAGE PLAN KEYS

          | Operation | Description |
          |----|----|
          | `CreateUsagePlanKey` | Create a usage plan key |
          | `GetUsagePlanKey` | Get a usage plan key |
          | `GetUsagePlanKeys` | Get usage plan keys |
          | `DeleteUsagePlanKey` | Delete a usage plan key |

          #### REQUEST VALIDATORS

          | Operation | Description |
          |----|----|
          | `CreateRequestValidator` | Create a request validator |
          | `GetRequestValidator` | Get a request validator |
          | `GetRequestValidators` | Get request validators |
          | `DeleteRequestValidator` | Delete a request validator |

          #### MODELS

          | Operation | Description |
          |----|----|
          | `CreateModel` | Create a model |
          | `GetModel` | Get a model |
          | `GetModels` | Get models |
          | `DeleteModel` | Delete a model |

          #### DOMAIN NAMES

          | Operation | Description |
          |----|----|
          | `CreateDomainName` | Create a domain name |
          | `GetDomainName` | Get a domain name |
          | `GetDomainNames` | Get domain names |
          | `DeleteDomainName` | Delete a domain name |

          #### BASE PATH MAPPINGS

          | Operation | Description |
          |----|----|
          | `CreateBasePathMapping` | Create a base path mapping |
          | `GetBasePathMapping` | Get a base path mapping |
          | `GetBasePathMappings` | Get base path mappings |
          | `DeleteBasePathMapping` | Delete a base path mapping |

          #### Tags

          | Operation | Description |
          |----|----|
          | `TagResource` | Tag a resource |
          | `UntagResource` | Untag a resource |
          | `GetTags` `ListTagsForResource` | List tags for a resource |

          ### NOT IMPLEMENTED

          - These management-plane operations have no handler in v1. Calls will return `404` or an error:

            - Deployment detail and lifecycle: `GetDeployment`, `UpdateDeployment`, `DeleteDeployment`
            - Authorizer lifecycle: `UpdateAuthorizer`, `DeleteAuthorizer`, `TestInvokeAuthorizer`
            - API key detail: `GetApiKey`, `UpdateApiKey`, `DeleteApiKey`, `ImportApiKeys`
            - Usage plan detail: `GetUsagePlan`, `UpdateUsagePlan`
            - Model updates and templates: `UpdateModel`, `GetModelTemplate`
            - Gateway Responses (the entire family: `PutGatewayResponse`, `GetGatewayResponse`, etc.)
            - Documentation parts and versions (the entire family, 10 operations)
            - VPC Links (5 operations)
            - Client Certificates (5 operations)
            - Account: `GetAccount`, `UpdateAccount`
            - `GetExport` / `ImportDocumentationParts`

          The execute plane (actual proxied HTTP traffic via `/restapis/{id}/{stage}/_user_request_/…`) is implemented separately and is not counted as management-plane operations.

          ### EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create a REST API
          API_ID=$(aws apigateway create-rest-api \
            --name "My API" \
            --query id --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Get the root resource
          ROOT_ID=$(aws apigateway get-resources \
            --rest-api-id $API_ID \
            --query 'items[?path==`/`].id' --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Create a resource
          RESOURCE_ID=$(aws apigateway create-resource \
            --rest-api-id $API_ID \
            --parent-id $ROOT_ID \
            --path-part users \
            --query id --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Add a GET method
          aws apigateway put-method \
            --rest-api-id $API_ID \
            --resource-id $RESOURCE_ID \
            --http-method GET \
            --authorization-type NONE \
            --endpoint-url $AWS_ENDPOINT_URL

          # Add a Lambda integration
          aws apigateway put-integration \
            --rest-api-id $API_ID \
            --resource-id $RESOURCE_ID \
            --http-method GET \
            --type AWS_PROXY \
            --integration-http-method POST \
            --uri "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:000000000000:function:my-function/invocations" \
            --endpoint-url $AWS_ENDPOINT_URL

          # Deploy to a stage
          aws apigateway create-deployment \
            --rest-api-id $API_ID \
            --stage-name dev \
            --endpoint-url $AWS_ENDPOINT_URL

          # Call the deployed API
          curl http://localhost:4566/restapis/$API_ID/dev/_user_request_/users
          ```

          ---

          ## API GATEWAY V2 (HTTP APIs)

          - **Protocol:** REST JSON
          - **Endpoint:** `http://localhost:4566/v2/apis/...`

          ### SUPPORTED OPERATIONS

          #### APIs

          | Operation | Description |
          |----|----|
          | `CreateApi` | Create an API |
          | `GetApi` | Get an API |
          | `GetApis` | Get APIs |
          | `DeleteApi` | Delete an API |

          #### ROUTES

          | Operation | Description |
          |----|----|
          | `CreateRoute` | Create a route |
          | `GetRoute` | Get a route |
          | `GetRoutes` | Get routes |
          | `DeleteRoute` | Delete a route |

          #### INTEGRATIONS

          | Operation | Description |
          |----|----|          
          | `CreateIntegration` | Create an integration |
          | `GetIntegration` | Get an integration |
          | `GetIntegrations` | Get integrations |

          #### AUTHORIZERS

          | Operation | Description |
          |----|----|
          | `CreateAuthorizer` | Create an authorizer |
          | `GetAuthorizer` | Get an authorizer |
          | `GetAuthorizers` | Get authorizers |
          | `DeleteAuthorizer` | Delete an authorizer |

          #### STAGES

          | Operation | Description |
          |----|----|
          | `CreateStage` | Create a stage |
          | `GetStage` | Get a stage |
          | `GetStages` | Get stages |
          | `DeleteStage` | Delete a stage |

          #### DEPLOYMENTS

          | Operation | Description |
          |----|----|
          | `CreateDeployment` | Create a deployment |
          | `GetDeployments` | Get deployments |

          ### EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create an HTTP API
          API_ID=$(aws apigatewayv2 create-api \
            --name "My HTTP API" \
            --protocol-type HTTP \
            --query ApiId --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Create a Lambda integration
          INTEGRATION_ID=$(aws apigatewayv2 create-integration \
            --api-id $API_ID \
            --integration-type AWS_PROXY \
            --integration-uri "arn:aws:lambda:us-east-1:000000000000:function:my-function" \
            --payload-format-version 2.0 \
            --query IntegrationId --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Create a route
          aws apigatewayv2 create-route \
            --api-id $API_ID \
            --route-key "GET /users" \
            --target "integrations/$INTEGRATION_ID" \
            --endpoint-url $AWS_ENDPOINT_URL

          # Deploy
          aws apigatewayv2 create-stage \
            --api-id $API_ID \
            --stage-name dev \
            --auto-deploy \
            --endpoint-url $AWS_ENDPOINT_URL
          ```
  https://floci.io/floci/services/cognito:
    desc: Floci emulates AWS Cognito - a fully managed service that allows you to create, configure, and manage user pools for your applications.
    tags: [ floci, aws, cognito ]
    links:
      - AWS Cognito Documentation: https://docs.aws.amazon.com/cognito/index.html
    notes:
      - md: | #markdown
          # COGNITO

          Floci serves pool-specific discovery and JWKS endpoints, plus a relaxed OAuth token endpoint, so local clients can mint and validate Cognito-like access tokens against `RS256` signing keys.

          - **Protocol:** JSON 1.1 (`X-Amz-Target: AWSCognitoIdentityProviderService.*`)
          - **Endpoint:** `POST http://localhost:4566/`

          ## SUPPORTED ACTIONS

          ### USER POOLS

          | Operation | Description |
          |----|----|
          | `CreateUserPool` | Create a user pool |
          | `DescribeUserPool` | Get a user pool |
          | `ListUserPools` | List user pools |
          | `DeleteUserPool` | Delete a user pool |

          ### USER POOL CLIENTS

          | Operation | Description |
          |----|----|
          | `CreateUserPoolClient` | Create a user pool client |
          | `DescribeUserPoolClient` | Get a user pool client |
          | `ListUserPoolClients` | List user pool clients |
          | `DeleteUserPoolClient` | Delete a user pool client |

          ### RESOURCE SERVERS

          | Operation | Description |
          |----|----|
          | `CreateResourceServer` | Create a resource server |
          | `DescribeResourceServer` | Get a resource server |
          | `ListResourceServers` | List resource servers |
          | `DeleteResourceServer` | Delete a resource server |

          ### ADMIN USER MANAGEMENT

          | Operation | Description |
          |----|----|
          | `AdminCreateUser` | Create a user |
          | `AdminGetUser` | Get a user |
          | `AdminDeleteUser` | Delete a user |
          | `AdminSetUserPassword` | Set a user password |
          | `AdminUpdateUserAttributes` | Update a user attributes |

          ### USER OPERATIONS

          | Operation | Description |
          |----|----|
          | `SignUp` | Sign up a user |
          | `ConfirmSignUp` | Confirm a sign up |
          | `GetUser` | Get a user |
          | `UpdateUserAttributes` | Update user attributes |
          | `ChangePassword` | Change a user password |

          ### AUTHENTICATION

          | Operation | Description |
          |----|----|
          | `InitiateAuth` | Initiate an authentication |
          | `AdminInitiateAuth` | Initiate an authentication for an admin |
          | `RespondToAuthChallenge` (supports USER_PASSWORD_AUTH, USER_SRP_AUTH, ADMIN_USER_SRP_AUTH) | Respond to an authentication challenge |

          ### USER LISTING

          | Operation | Description |
          |----|----|
          | `ListUsers` | List users |

          ### GROUPS

          | Operation | Description |
          |----|----|
          | `CreateGroup` | Create a group |
          | `GetGroup` | Get a group |
          | `ListGroups` | List groups |
          | `DeleteGroup` | Delete a group |
          | `AdminAddUserToGroup` | Add a user to a group |
          | `AdminRemoveUserFromGroup` | Remove a user from a group |
          | `AdminListGroupsForUser` | List groups for a user |

          ## WELL-KNOWN AND OAUTH ENDPOINTS

          | Endpoint | Description |
          |----|----|
          | `GET /{userPoolId}/.well-known/openid-configuration` | OpenID discovery document |
          | `GET /{userPoolId}/.well-known/jwks.json` | JSON Web Key Set for JWT validation |
          | `POST /cognito-idp/oauth2/token` | Relaxed OAuth token endpoint for `grant_type=client_credentials` |

          - `POST /cognito-idp/oauth2/token` is intentionally emulator-friendly rather than full Cognito parity:
            - It requires an existing `client_id`.
            - It accepts `client_id` and `client_secret` from the form body or Basic auth.
            - It requires a confidential app client created with `GenerateSecret=true`.
            - It requires `AllowedOAuthFlowsUserPoolClient=true` and `AllowedOAuthFlows=["client_credentials"]`.
            - It doesn't require a Cognito domain.
            - It returns only `access_token`, `token_type`, and `expires_in`.
            - It validates requested OAuth scopes against the app client's `AllowedOAuthScopes` and the pool's registered resource-server scopes.
            - It advertises the prefixed token endpoint in `/{userPoolId}/.well-known/openid-configuration`.

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create a user pool
          POOL_ID=$(aws cognito-idp create-user-pool \
            --pool-name MyApp \
            --query UserPool.Id --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Create an app client
          CLIENT_ID=$(aws cognito-idp create-user-pool-client \
            --user-pool-id $POOL_ID \
            --client-name my-client \
            --generate-secret \
            --allowed-o-auth-flows-user-pool-client \
            --allowed-o-auth-flows client_credentials \
            --allowed-o-auth-scopes notes/read notes/write \
            --query UserPoolClient.ClientId --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Retrieve the generated client secret
          CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id $POOL_ID \
            --client-id $CLIENT_ID \
            --query UserPoolClient.ClientSecret --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Register a resource server and scopes
          aws cognito-idp create-resource-server \
            --user-pool-id $POOL_ID \
            --identifier notes \
            --name "Notes API" \
            --scopes ScopeName=read,ScopeDescription="Read notes" ScopeName=write,ScopeDescription="Write notes" \
            --endpoint-url $AWS_ENDPOINT_URL

          # Create a user
          aws cognito-idp admin-create-user \
            --user-pool-id $POOL_ID \
            --username alice@example.com \
            --temporary-password Temp1234! \
            --endpoint-url $AWS_ENDPOINT_URL

          # Set a permanent password
          aws cognito-idp admin-set-user-password \
            --user-pool-id $POOL_ID \
            --username alice@example.com \
            --password Perm1234! \
            --permanent \
            --endpoint-url $AWS_ENDPOINT_URL

          # Authenticate
          aws cognito-idp initiate-auth \
            --auth-flow USER_PASSWORD_AUTH \
            --client-id $CLIENT_ID \
            --auth-parameters USERNAME=alice@example.com,PASSWORD=Perm1234! \
            --endpoint-url $AWS_ENDPOINT_URL

          # Create a group
          aws cognito-idp create-group \
            --user-pool-id $POOL_ID \
            --group-name admin \
            --description "Admin group" \
            --endpoint-url $AWS_ENDPOINT_URL

          # Add user to group
          aws cognito-idp admin-add-user-to-group \
            --user-pool-id $POOL_ID \
            --group-name admin \
            --username alice@example.com \
            --endpoint-url $AWS_ENDPOINT_URL

          # List groups for user
          aws cognito-idp admin-list-groups-for-user \
            --user-pool-id $POOL_ID \
            --username alice@example.com \
            --endpoint-url $AWS_ENDPOINT_URL

          # Fetch the pool discovery document
          curl -s "$AWS_ENDPOINT_URL/$POOL_ID/.well-known/openid-configuration"

          # Get a machine access token from the OAuth endpoint
          curl -s \
            -X POST "$AWS_ENDPOINT_URL/cognito-idp/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "$CLIENT_ID:$CLIENT_SECRET" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "scope=notes/read notes/write"
          ```

          ## JWT VALIDATION

          Tokens issued by Floci can be validated using the discovery and JWKS endpoints:

          ```sh
          open http://localhost:4566/$POOL_ID/.well-known/openid-configuration
          open http://localhost:4566/$POOL_ID/.well-known/jwks.json
          ```

          - Tokens include the `cognito:groups` claim as a JSON array when the authenticated user belongs to one or more groups.
          - Tokens issued by Cognito auth flows and the OAuth token endpoint use the emulator base URL plus the pool id:

          ```sh
          open http://localhost:4566/$POOL_ID
          ```

          - This keeps the issuer, discovery document, JWKS URL, and token endpoint internally consistent for local JWT validation while supporting LocalStack-style confidential clients and resource-server-backed scopes.
  https://floci.io/floci/services/kms:
    desc: Floci emulates AWS KMS - a fully managed service that allows you to create, configure, and manage cryptographic keys for your applications.
    tags: [ floci, aws, kms ]
    links:
      - AWS KMS Documentation: https://docs.aws.amazon.com/kms/index.html
    notes:
      - md: | #markdown
          # KMS (KEY MANAGEMENT SERVICE)

          - **Protocol:** JSON 1.1 (`X-Amz-Target: TrentService.*`)
          - **Endpoint:** `POST http://localhost:4566/`

          ## SUPPORTED ACTIONS

          | Action | Description |
          |----|----|
          | `CreateKey` | Create a new KMS key |
          | `DescribeKey` | Get key metadata |
          | `ListKeys` | List all keys |
          | `Encrypt` | Encrypt plaintext with a key |
          | `Decrypt` | Decrypt ciphertext |
          | `ReEncrypt` | Re-encrypt under a different key |
          | `GenerateDataKey` | Generate a data key (plaintext + encrypted) |
          | `GenerateDataKeyWithoutPlaintext` | Generate only the encrypted data key |
          | `Sign` | Sign a message with an asymmetric key |
          | `Verify` | Verify a signature |
          | `CreateAlias` | Create a friendly name for a key |
          | `DeleteAlias` | Remove an alias |
          | `ListAliases` | List all aliases |
          | `ScheduleKeyDeletion` | Mark a key for deletion |
          | `CancelKeyDeletion` | Cancel pending deletion |
          | `TagResource` | Tag a key |
          | `UntagResource` | Remove tags |
          | `ListResourceTags` | List tags |
          | `GetKeyPolicy` | Get a key's resource policy |
          | `PutKeyPolicy` | Update a key's resource policy |
          | `GetKeyRotationStatus` | Check if automatic key rotation is enabled |
          | `EnableKeyRotation` | Enable automatic key rotation (symmetric keys only) |
          | `DisableKeyRotation` | Disable automatic key rotation |

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create a symmetric key
          KEY_ID=$(aws kms create-key \
            --description "My encryption key" \
            --query KeyMetadata.KeyId --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Create an alias
          aws kms create-alias \
            --alias-name alias/my-key \
            --target-key-id $KEY_ID \
            --endpoint-url $AWS_ENDPOINT_URL

          # Encrypt
          CIPHER=$(aws kms encrypt \
            --key-id alias/my-key \
            --plaintext "Hello, World!" \
            --query CiphertextBlob --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Decrypt
          aws kms decrypt \
            --ciphertext-blob $CIPHER \
            --query Plaintext --output text \
            --endpoint-url $AWS_ENDPOINT_URL | base64 --decode

          # Generate a data key (envelope encryption)
          aws kms generate-data-key \
            --key-id alias/my-key \
            --key-spec AES_256 \
            --endpoint-url $AWS_ENDPOINT_URL
          ```
  https://floci.io/floci/services/kinesis:
    desc: Floci emulates AWS Kinesis - a fully managed service that allows you to build scalable, real-time data processing applications.
    tags: [ floci, aws, kinesis ]
    links:
      - AWS Kinesis Documentation: https://docs.aws.amazon.com/kinesis/index.html
    notes:
      - md: | #markdown
          # KINESIS (DATA STREAMING SERVICE)

          - **Protocol:** JSON 1.1 (`X-Amz-Target: Kinesis_20131202.*`)
          - **Endpoint:** `POST http://localhost:4566/`

          ## SUPPORTED ACTIONS

          | Action | Description |
          |----|----|
          | `CreateStream` | Create a stream |
          | `DeleteStream` | Delete a stream |
          | `ListStreams` | List all streams |
          | `DescribeStream` | Get stream details and shard info |
          | `DescribeStreamSummary` | Lightweight stream description |
          | `RegisterStreamConsumer` | Register an enhanced fan-out consumer |
          | `DeregisterStreamConsumer` | Remove a consumer |
          | `DescribeStreamConsumer` | Get consumer details |
          | `ListStreamConsumers` | List consumers for a stream |
          | `SubscribeToShard` | Subscribe to a shard for enhanced fan-out |
          | `PutRecord` | Write a single record |
          | `PutRecords` | Write up to 500 records |
          | `GetShardIterator` | Get an iterator for reading |
          | `GetRecords` | Read records from a shard |
          | `SplitShard` | Split a shard into two |
          | `MergeShards` | Merge two adjacent shards |
          | `AddTagsToStream` | Tag a stream |
          | `RemoveTagsFromStream` | Remove tags |
          | `ListTagsForStream` | List tags |
          | `IncreaseStreamRetentionPeriod` | Increase retention up to 8760 hours (365 days) |
          | `DecreaseStreamRetentionPeriod` | Decrease retention down to 24 hours |
          | `StartStreamEncryption` | Enable KMS encryption |
          | `StopStreamEncryption` | Disable encryption |

          ## STREAM ADDRESSING

          - Most actions accept either `StreamName` or `StreamARN` to identify a stream. When both are provided, `StreamName` takes precedence. `CreateStream` only accepts `StreamName`.

              ```sh
              # By name
              aws kinesis describe-stream --stream-name events --endpoint-url $AWS_ENDPOINT_URL

              # By ARN
              aws kinesis describe-stream --stream-arn arn:aws:kinesis:us-east-1:000000000000:stream/events --endpoint-url $AWS_ENDPOINT_URL
              ```

          ## EXAMPLES

          ```sh
          export AWS_ENDPOINT_URL=http://localhost:4566

          # Create a stream
          aws kinesis create-stream \
            --stream-name events \
            --shard-count 2 \
            --endpoint-url $AWS_ENDPOINT_URL

          # Put a record
          aws kinesis put-record \
            --stream-name events \
            --partition-key "user-123" \
            --data '{"event":"page_view","page":"/home"}' \
            --endpoint-url $AWS_ENDPOINT_URL

          # Get a shard iterator
          SHARD_ID=$(aws kinesis describe-stream \
            --stream-name events \
            --query 'StreamDescription.Shards[0].ShardId' --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          ITERATOR=$(aws kinesis get-shard-iterator \
            --stream-name events \
            --shard-id $SHARD_ID \
            --shard-iterator-type TRIM_HORIZON \
            --query ShardIterator --output text \
            --endpoint-url $AWS_ENDPOINT_URL)

          # Read records
          aws kinesis get-records \
            --shard-iterator $ITERATOR \
            --endpoint-url $AWS_ENDPOINT_URL
          ```
