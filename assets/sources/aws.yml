          | `TagRole`                | Tag a role                              |

          ### POLICIES

          | Action                   | Description                             |
          |--------------------------|-----------------------------------------|
          | `CreatePolicy`           | Create a new policy                     |
          | `GetPolicy`              | Get policy information                  |
          | `DeletePolicy`           | Delete a policy                         |
          | `ListPolicies`           | List all policies                       |
          | `CreatePolicyVersion`    | Create a new policy version             |
          | `GetPolicyVersion`       | Get policy version information          |
