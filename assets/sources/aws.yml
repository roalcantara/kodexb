          ### POLICY ATTACHMENTS

          | Action                   | Description                             |
          |--------------------------|-----------------------------------------|
          | `AttachUserPolicy`       | Attach a policy to a user               |
          | `DetachUserPolicy`       | Detach a policy from a user             |
          | `ListAttachedUserPolicies` | List attached policies for a user       |
          | `AttachGroupPolicy`      | Attach a policy to a group               |
          | `DetachGroupPolicy`      | Detach a policy from a group             |
          | `ListAttachedGroupPolicies` | List attached policies for a group       |
          | `AttachRolePolicy`       | Attach a policy to a role                 |

          ### INLINE POLICIES

          | Action                   | Description                             |
          |--------------------------|-----------------------------------------|
          | `PutUserPolicy`          | Put a user policy                        |
          | `GetUserPolicy`          | Get a user policy                        |
          | `DeleteUserPolicy`       | Delete a user policy                     |
          | `ListUserPolicies`       | List user policies                       |
          | `PutGroupPolicy`         | Put a group policy                       |
          | `GetGroupPolicy`         | Get a group policy                       |
          | `DeleteGroupPolicy`      | Delete a group policy                    |
          | `ListGroupPolicies`      | List group policies                       |
          | `PutRolePolicy`          | Put a role policy                        |
          | `GetRolePolicy`          | Get a role policy                        |
          | `DeleteRolePolicy`       | Delete a role policy                     |
          | `ListRolePolicies`       | List role policies                       |

          ### INSTANCE PROFILES

          | Action                   | Description                             |
          |--------------------------|-----------------------------------------|
          | `CreateInstanceProfile`  | Create an instance profile               |
          | `GetInstanceProfile`     | Get an instance profile                  |
          | `DeleteInstanceProfile`  | Delete an instance profile               |
          | `ListInstanceProfiles`   | List instance profiles                   |
          | `AddRoleToInstanceProfile` | Add a role to an instance profile         |
          | `RemoveRoleFromInstanceProfile` | Remove a role from an instance profile   |
