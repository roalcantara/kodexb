          ### PERMISSION BOUNDARIES

          | Action                   | Description                             |
          |--------------------------|-----------------------------------------|
          | `PutUserPermissionsBoundary` | Put a user permissions boundary         |
          | `DeleteUserPermissionsBoundary` | Delete a user permissions boundary     |
          | `PutRolePermissionsBoundary` | Put a role permissions boundary         |
