cheats:
  Encryption Providers:
    desc: Store encrypted secrets that are safe to commit to version control
    tags: [pass]
    links: [https://fnox.jdx.dev/providers/overview.html]
    notes:
      - md: | #markdown
          ### Encryption Providers

          | **PROVIDER**  | **DESCRIPTION**                          | **BEST FOR**                              |
          | ------------- | ---------------------------------------- | ----------------------------------------- |
          | **age**       | Modern encryption (works with SSH keys!) | Development secrets, open source projects |
          | **AWS KMS**   | AWS Key Management Service               | AWS-based projects requiring IAM control  |
          | **Azure KMS** | Azure Key Vault encryption               | Azure-based projects                      |
          | **GCP KMS**   | Google Cloud KMS                         | GCP-based projects                        |
  Cloud Secret Storage Providers:
    desc: Store secrets remotely in cloud providers
    tags: [pass]
    links: [https://fnox.jdx.dev/providers/overview.html]
    notes:
      - md: | #markdown
          ### Cloud Secret Storage Providers

          | **PROVIDER**                | **DESCRIPTION**          | **BEST FOR**                   |
          | --------------------------- | ------------------------ | ------------------------------ |
          | **AWS Parameter Store**     | AWS SSM Parameter Store  | Config values, simple secrets  |
          | **AWS Secrets Manager**     | AWS centralized secrets  | Production AWS workloads       |
          | **Azure Key Vault Secrets** | Azure secret storage     | Production Azure workloads     |
          | **GCP Secret Manager**      | Google Cloud secrets     | Production GCP workloads       |
          | **HashiCorp Vault**         | Self-hosted or HCP Vault | Multi-cloud, advanced features |
  Password Managers & Secret Services:
    desc: Integrate with password managers and secret services you already use.
    tags: [pass]
    links: [https://fnox.jdx.dev/providers/overview.html]
    notes:
      - md: | #markdown
          ### Password Managers & Secret Services

          | **PROVIDER**    | **DESCRIPTION**           | **BEST FOR**                          |
          | --------------- | ------------------------- | ------------------------------------- |
          | **1Password**   | 1Password CLI integration | Teams already using 1Password         |
          | **Bitwarden**   | Bitwarden/Vaultwarden     | Open source preference, self-hosting  |
          | **Infisical**   | Infisical secrets         | Modern secret management, open source |
          | **LastPass**    | LastPass CLI integration  | Teams already using LastPass          |
          | **NordPass**    | NordPass CLI integration  | Teams already using NordPass          |
          | **Vaultwarden** | Self-hosted Bitwarden     | Self-hosting, open source preference  |
          | **Vaulty**      | Vaulty secrets            | Modern secret management              |
          | **GoPass**      | GoPass password manager   | CLI users, git-based sync             |
          | **Pass**        | Pass password manager     | CLI users, git-based sync             |
  Local Storage Providers:
    desc: Store secrets locally on your machine
    tags: [pass]
    links: [https://fnox.jdx.dev/providers/overview.html]
    notes:
      - md: | #markdown
          ### Local Storage Providers

          | **PROVIDER**       | **DESCRIPTION**                       | **BEST FOR**                            |
          | ------------------ | ------------------------------------- | --------------------------------------- |
          | **OS Keychain**    | macOS/Windows/Linux credential stores | Local development, personal projects    |
          | **KeePass**        | KeePass database files (.kdbx)        | Offline use, KeePassXC users            |
          | **password-store** | GPG-encrypted local password store    | CLI users, git-based sync, Unix systems |
          | **Plain**          | Plaintext (default values only)       | Non-sensitive defaults                  |
