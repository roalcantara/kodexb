  https://github.com/muesli/duf:
    desc: Disk Usage/Free Utility - a better 'df' alternative
    tags: [ tools, tui, disk ]
    notes:
      - sh: | #shell
          #!/bin/sh
          # INSTALLATION
          brew install duf
          flox install duf

          # USAGE

          # start duf without arguments
          duf
          # specific devices & mount points
          duf /home /some/file
          # list everything (including pseudo, duplicate, inaccessible file systems)
          duf --all
          # show specific tables
          duf --only local,network,fuse,special,loops,binds
          # hide specific tables
          duf --hide local,network,fuse,special,loops,binds

          # Sort the output by:
          # size, used, avail, usage, inodes, inodes_used, inodes_avail, inodes_usage, type, filesystem
          duf --sort size
