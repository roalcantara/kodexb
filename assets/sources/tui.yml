  https://github.com/mattrobenolt/appify:
    desc: Turn TUI apps into real macOS applications
    tags: [ tools, tui, launcher ]
    notes:
      - sh: | #shell
          #!/bin/sh
          ### INSTALLATION
          brew install --cask mattrobenolt/stuff/appify

          ### USAGE

          # Simple usage
          appify btop

          # With custom name and icon
          appify btop --name "System Monitor" --icon ./monitor.icns

          # Full customization
          appify weechat --name "WeeChat" --bundle-id "com.matt.weechat" --output ~/Applications

          # Pass arguments to the command
          appify nvim -u init.vim
          appify --name "WeeChat" -- weechat --dir ~/irc

          # Shell features
          appify --shell 'cd /dir && ./run'
  https://rezitui.dev:
    desc: TypeScript TUI Near-Native Performance
    tags: [ tools, tui, rust ]
