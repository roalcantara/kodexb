          > https://gh-dash.dev/getting-started/keybindings

          | **SCOPE**    | **KEYBINDING** | **ACTION**                  |
          | ------------ | :------------: | --------------------------- |
          | GLOBAL       |       ?        | Toggle Help                 |
          | GLOBAL       |       /        | Search                      |
          | GLOBAL       |       r        | Refresh Current Section     |
          | GLOBAL       |       R        | Refresh All Sections        |
          | GLOBAL       |       s        | Switch View                 |
          | GLOBAL       |       q        | Quit                        |
          | NAVIGATION   |      ↑/k       | Move Up                     |
          | NAVIGATION   |      ↓/j       | Move Down                   |
          | NAVIGATION   |      ←/h       | Previous Section            |
          | NAVIGATION   |      →/l       | Next Section                |
          | NAVIGATION   |     g/home     | First Item                  |
          | NAVIGATION   |     G/end      | Last Item                   |
          | PREVIEW PANE |       p        | Toggle Preview Pane         |
