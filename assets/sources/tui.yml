          | ISSUE        |       c        | Comment on Issue            |
          | ISSUE        |       x        | Close Issue                 |
          | ISSUE        |       X        | Reopen Issue                |
          | SELECTION    |       o        | Open in GitHub              |
          | SELECTION    |       y        | Copy Number                 |
          | SELECTION    |       Y        | Copy URL                    |
          | SELECTED PR  |       a        | Assign PR                   |
