  https://opentui.com:
    desc: OpenTUI is a native terminal UI core written in Zig with TypeScript bindings
    tags: [ tools, tui ]
    links: [ https://opentui.com/docs/getting-started, https://opentui.com/docs/plugins/core, https://opentui.com/docs/bindings/solid ]
    notes:
      - sh: | #shell
          #!/bin/sh
          # INSTALLATION

          # OpenTUI is currently Bun exclusive
          mkdir my-tui && cd my-tui
          bun init -y
          bun add @opentui/core

          # run it and press Ctrl+C to exit
          bun index.ts
      - ts: | #typescript
          // hello.ts
          import { createCliRenderer, Text } from "@opentui/core"

          const renderer = await createCliRenderer()

          renderer.root.add(
            Text({
              content: "Hello, OpenTUI!",
              fg: "#00FF00",
            })
          )
      - ts: | #typescript
          // input.ts
          import { createCliRenderer, Input } from "@opentui/core"

          const renderer = await createCliRenderer()

          const input = Input({
            placeholder: "Type something...",
            width: 30,
          })

          input.focus()
          renderer.root.add(input)
      - ts: | #typescript
          // layout.ts
          import { createCliRenderer, Box, Text } from "@opentui/core"

          const renderer = await createCliRenderer()

          renderer.root.add(
            Box(
              { width: "100%", height: "100%", flexDirection: "row", gap: 2 },
              Box(
                { flexGrow: 1, backgroundColor: "#1a1b26" },
                Text({ content: "Sidebar", fg: "#bb9af7" })
              ),
              Box({ flexGrow: 3, backgroundColor: "#24283b" }, Text({ content: "Main" }))
            )
          )
