  # FIREBASE HOSTING
  npx firebase hosting:channel:list:
    desc: List channels - including 'live' - from default Hosting
    tags: [firebase]
  npx firebase hosting:channel:create <ID>:
    desc: Create prev channel ID
    tags: [firebase]
  npx firebase hosting:channel:open <ID>:
    desc: Open or returns channel ID URL
    tags: [firebase]
  npx firebase hosting:channel:deploy <ID>:
    desc: Deploy prev channel to HOST - expires in 7d
    tags: [firebase]
  npx firebase hosting:channel:delete <ID>:
    desc: Delete prev channel
    tags: [firebase]
  # FIREBASE FUNCTIONS SECRETS
  npx firebase functions:secrets:set SECRET_NAME:
    desc: Firebase CLI command to create a secret for use in Cloud Functions
    tags: [firebase, secrets]
    links: [https://firebase.google.com/docs/functions/1st-gen/config-env-1st#managing_secrets]
    notes:
      - sh: | #shell
          # to make `southamerica-east1` the default region for `gcloud run services describe`, run
          gcloud config set run/region southamerica-east1

          # Get the function service account
          gcloud run services describe docusignWebhook \
            --region=southamerica-east1 \
            --project=$(gcloud config get-value project) \
            --format="value(spec.template.spec.serviceAccountName)"

          # Add IAM policy binding to the secret (name only; never paste values in repo)
          gcloud secrets add-iam-policy-binding DOCUSIGN_CONNECT_HMAC_SECRET \
            --member="serviceAccount:829496193240-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" \
            --project=$(gcloud config get-value project)
  npx firebase functions:secrets:access SECRET_NAME:
    desc: View the value of a secret
    tags: [firebase, secrets]
    links: [https://firebase.google.com/docs/functions/1st-gen/config-env-1st#managing_secrets]
  npx firebase functions:secrets:destroy SECRET_NAME:
    desc: Destroy a secret
    tags: [firebase, secrets]
    links: [https://firebase.google.com/docs/functions/1st-gen/config-env-1st#managing_secrets]
  npx firebase functions:secrets:get SECRET_NAME:
    desc: View all secret versions and their state
    tags: [firebase, secrets]
    links: [https://firebase.google.com/docs/functions/1st-gen/config-env-1st#managing_secrets]
  npx firebase functions:secrets:prune:
    desc: Automatically clean up all secrets that aren't referenced by any of your functions
    tags: [firebase, secrets]
    links: [https://firebase.google.com/docs/functions/1st-gen/config-env-1st#managing_secrets]
  npx firebase apphosting:secrets:set SECRET_NAME:
    desc: The Firebase CLI command to create a secret for use in App Hosting
    tags: [firebase, secrets]
  # FIREBASE EMULATOR SUITE
  curl -sL https://firebase.tools | bash:
