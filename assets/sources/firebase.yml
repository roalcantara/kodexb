commands:
  npx degit TeXmeijin/vite-react-ts-tailwind-firebase-starter <app> && cd <app> && npm install && npm run dev:
    desc: Create app 'vite-react-ts-tailwind-firebase-starter'
    tags: [vite]
    links:
      - https://vite.dev/guide/#community-templates
      - https://github.com/vitejs/awesome-vite#templates
      - https://github.com/Rich-Harris/degit
  npm i firebase-admin firebase-functions firebase-tools -D:
    desc: Add firebase dev deps
    tags: [firebase]
  npm i firebase:
    desc: Add firebase web deps
    tags: [firebase]
  npm install -g firebase-tools:
    desc: Install the Firebase CLI globally
    tags: [firebase]
  npx firebase login:
    desc: Log into Firebase - current Google account
    tags: [firebase]
  npx firebase login:ci:
    desc: Store token CI system as env var FIREBASE_TOKEN
    tags: [firebase]
  npx firebase projects:list:
    desc: List Firebase projects - current Google account
    tags: [firebase]
  npx firebase init:
    desc: Initialize a Firebase project
    tags: [firebase]
  npx firebase use --add <ALIAS>:
    desc: Add project ALIAS to .firebaserc
    tags: [firebase]
  npx firebase use:
    desc: List aliases for current project
    tags: [firebase]
  npx firebase use <ALIAS>:
    desc: Setup Firebase to use a project
    tags: [firebase]
  npx firebase use --clear:
    desc: Clear active project
    tags: [firebase]
  npx firebase init hosting:
    desc: Setup Firebase Hosting
    tags: [firebase]
