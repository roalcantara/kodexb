    links:
      - Firebase Local Emulator Suite: https://docs.cloud.google.com/datastore/docs/emulator?#cli-flag

  curl -v -X DELETE "http://localhost:8080/emulator/v1/projects/consorciei-p2p/databases/(default)/documents":
    desc: Delete all documents in Firestore Emulator
    tags: [firebase, firestore]
    links:
      - Firebase Local Emulator Suite: https://firebase.google.com/docs/emulator-suite/connect_firestore#node.js-admin-sdk

  curl -s http://localhost:8080/v1/projects/consorciei-p2p/databases/(default)/documents/clients/rodobens" | jq:
    desc: Get document with id 'rodobens' from 'clients' collection in Firestore Emulator
    tags: [firebase, firestore]
    links:
      - Firebase Local Emulator Suite: https://firebase.google.com/docs/emulator-suite/connect_firestore#node.js-admin-sdk

  curl -s "http://localhost:8080/emulator/v1/projects/consorciei-p2p:ruleCoverage" | jq:
    desc: Get test coverage for Firestore Emulator security rules
    tags: [firebase, firestore]
    links:
      - Firebase Local Emulator Suite: https://firebase.google.com/docs/emulator-suite/connect_firestore#node.js-admin-sdk

  gsutil cp my-file.txt gs://consorciei-p2p.appspot.com/clients/rodobens/shares_upload:
    desc: Upload a local file named my-file.txt to a bucket named consorciei-p2p.appspot.com
    tags: [gcloud, datastore]

  gsutil ls gs://://consorciei-p2p.appspot.com:
    desc: List files in a bucket named consorciei-p2p.appspot.com
    tags: [gcloud, datastore]

  gsutil cp gs://://consorciei-p2p.appspot.com my-downloaded-file.txt:
    desc: Download a file named my-file.txt from a bucket named consorciei-p2p.appspot.com to the local machine with the name my-downloaded-file.txt
    tags: [gcloud, datastore]
cheats:
  firestore/queries/OR:
    desc: Firestore Query OR
    links: [https://firebase.blog/posts/2023/05/whats-new-at-google-io]
    tags: [firebase, coding]
    notes:
      - js: |
          const carsRef = collection(db, 'cars');
          const q = query(carsRef,
            or (
              where('make', '==', 'tesla'),
              where('miles', '<=', 50_000),
              where('ev', '==', true)
            ) ,
            orderBy('miles', 'desc')
          );

          const snapshot = firestore.collection("hotels").where(
            or (
              Filter.inArray("neighborhood", list0f("Chelsea", "SoHo"))
              Filter.greaterThanOrEqualTo("stars", 4)
            )
          ).orderBy("stars", Direction.DESCENDING).get();
  firestore/queries/IN:
    desc: Firestore Query OR
    tags: [firebase, coding]
    links: [https://firebase.blog/posts/2023/05/whats-new-at-google-io]
    notes:
      - js: |
          const citiesRef = db.collection("cities");
          const cityList = ["USA", "Japan", "Argentina", "Brazil", "Chile", "Bolivia", "Paraguay", "Uruguay", "UK", "Canada", "Mexico", "Mozambique"];
          const cities = citiesRef.where("country", whereIn: cityList);
