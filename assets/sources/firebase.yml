  curl localhost:4400/emulators:
    desc: List running emulators
    tags: [firebase]
    links:
      - Firebase Local Emulator Suite: https://firebase.google.com/docs/emulator-suite/install_and_configure

  curl -X PUT localhost:4400/functions/disableBackgroundTriggers:
    desc: Disable background triggers (e.g. pub/sub, firestore, auth) in Emulator Suite
    tags: [firebase, pub-sub, firestore, auth]
    links:
