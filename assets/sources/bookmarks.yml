  https://dock.io/post/web3-identity:
    tags: [coding]
    desc: Web3 Identity | Beginner's Guide 2023
    notes:
      - md: |
          # TL;DR

          - Web3 is a decentralized web that gives users more control over their data and is the third generation of the internet

          - Web3 identity is a system that allows users to manage their online identities in a more secure and efficient way without relying on a central authority

          - Decentralized identifiers (DIDs) are globally unique identifiers that can be stored on a blockchain and play an essential role in creating users' Web3 identity

          - Web3 identity provides many benefits to organizations and individuals over traditional identity management systems

          - There are a growing number of Web3 identity use cases including age verification for entertainment sites and proof of ownership without revealing a crypto wallet's details
  https://dock.io/post/web3-authentication:
    desc: Web3 Authentication | Complete Guide 2023
    tags: [auth]
    notes:
      - md: |
          # TL;DR

          - Current authentication systems have several problems including the risk of data breaches and users have little to no control over how their information is collected, used, and shared with other parties

          - Web3 authentication is a login process that verifies the identity of a website and app user with their public key

          - Benefits for organizations: Web3 authentication verifies users securely, helps them stay compliant with data regulations, and speeds up the customer onboarding process

          - Benefits for individuals: Web3 authentication enhances the user experience, privacy, and security

          - Developers and organizations can integrate Dock's Web3 ID on their sites or apps to provide passwordless user authentication, prevent user tracking and avoid data collection
  https://dock.io/post/blockchain-identity-management:
    desc: Blockchain Identity Management | Complete Guide 2023
    tags: [web3]
    notes:
      - md: |
          # TL;DR

          - Identity management encompasses the processes, policies, and technologies to ensure that only authorized people have access to the technology resources.

          - Many of the current digital identity management systems have downsides, including the risk of data breaches, a bad user experience with people having to manage so many accounts, and lack of control of user data.

          - Benefits of blockchain identity management include faster verification processes, reduced verification costs, and enhanced data privacy and security.

          - Blockchain identity management can be applied to a growing number of use cases across a variety of industries and sectors including financial services, education, and workforce.

          - No personal identifiable information (PII) is stored on the blockchain.
