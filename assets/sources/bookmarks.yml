    desc: Chrome | Read Anything
    tags: [flag]
  Yarn Workspaces:
    desc: Workspaces are a new way to set up your package architecture
    tags: [yarn]
    links:
      - Docs: https://yarnpkg.com/features/workspaces
      - Using Yarn Workspaces to Create a Monorepo: https://medium.com/tribalscale/using-yarn-workspaces-to-create-a-monorepo-33203152d0c6
      - How to use yarn workspaces with Create React App and Create React Native App (Expo) to share common code across: https://medium.com/viewstools/how-to-use-yarn-workspaces-with-create-react-app-and-create-react-native-app-expo-to-share-common-ea27bc4bad62
    notes:
      - json: |
          # root/package.json
          {
            "private": true,
            "workspaces": ["workspace-a", "workspace-b"]
          }
      - json: |
          # root/workspace-a/package.json
          {
            "name": "workspace-a",
            "version": "1.0.0",

            "dependencies": {
              "cross-env": "5.0.5"
            }
          }
      - json: |
          # root/workspace-b/package.json
          {
            "name": "workspace-b",
            "version": "1.0.0",

            "dependencies": {
              "cross-env": "5.0.5",
              "workspace-a": "1.0.0"
            }
          }
      - sh: |
          # Finally, run yarn install somewhere, ideally inside the workspace root. If everything works well, you should now have a similar file hierarchy:

          /package.json
          /yarn.lock

          /node_modules
          /node_modules/cross-env
          /node_modules/workspace-a -> /workspace-a

          /workspace-a/package.json
          /workspace-b/package.json
  GitHub Actions - Skipping Workflow runs with [skip ci]:
    desc: Skip pull request and push workflows
    tags: [github, action]
    links:
      - Skipping Workflow runs: https://docs.github.com/en/actions/managing-workflow-runs/skipping-workflow-runs
      - Skip pull request and push workflows with [skip ci]: https://github.blog/changelog/2021-02-08-github-actions-skip-pull-request-and-push-workflows-with-skip-ci
    notes:
      - md: |
          ### Skip pull request and push workflows with [skip ci]

          If any commit message in your push or the HEAD commit of your PR contains the strings [skip ci], [ci skip], [no ci], [skip actions], or [actions skip] workflows triggered on the push or pull_request events will be skipped.
  motivation and clear mind:
