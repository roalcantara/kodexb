  https://youtu.be/Oj5lA7FfUkI:
    desc: I Watch Your Videos But Never Change My Life | HealthyGamerGG
    tags: [motivation, psy]
    notes:
      - md: |
          ## Key insights

          💪 Personal transformation often occurs when individuals reach a breaking point and make a firm decision to change their behavior permanently.
          🤔 Challenging assumptions and understanding one's own thought process is key to initiating change in one's life.
          🕒 Resolving ambivalence is the first step towards taking action and making a change in one's life.
          🤔 Watching videos alone doesn't lead to change; learning and incorporating the concepts from the videos is what brings about real transformation.
          💡 Mastery is achieved through experimentation, suggesting that actively applying and testing the knowledge gained from videos can lead to deeper understanding and skill development.
          🧠 The more we actively recall and engage with information, the more it solidifies into learning and leads to personal transformation.
          🤔 The role of a coach is to guide individuals in challenging their assumptions and exploring new possibilities, ultimately leading to personal growth and transformation.
          🤝 Impatience can lead to failure and decreased hope, so it's important to be patient with yourself and take the necessary time and energy to achieve your goals.
  https://youtu.be/oWf_v_sSPuw:
    desc: Let's Talk About Anxiety in Today's World | HealthyGamerGG
    tags: [motivation, psy]
    notes:
      - md: |
          ## Understanding and Addressing the Root Causes of Anxiety

          😰 Anxiety is becoming increasingly worse at an alarming rate, highlighting the urgent need for understanding and addressing this issue.
          😱 Recent research shows that anxiety is not localized to the mind, but can be influenced by what's going on in our brain and body, which may explain why anxiety is getting worse despite increased investment in research and therapy.
          🧠 Inflammation in the gut can trigger a holistic response from the body, similar to how it responds to infections like the flu, leading to widespread inflammation and potential mental health effects.
          🧠 Exposure therapy, where individuals are placed in anxiety-inducing situations without being able to control or escape them, can help build tolerance for anxiety and promote emotional resilience.
          🧠 Understanding and acknowledging our anxiety can help us sit with it and navigate through it.
          😬 Learning to tolerate negative emotions can help reduce anxiety and allow for engagement with the world around us.
          🧘 Meditative and spiritual practices can aid in developing detachment and reducing anxiety.

          ## The Impact of Childhood Experiences on Anxiety

          🧠 Most people with anxiety have negative experiences in childhood that teach them to be worried, making anxiety a survival strategy or adaptation.
          🧠 Anxiety is confusing because it stems from strategies that our brains developed when we were young and lacked the power and abilities to handle situations effectively.
          🧠 The anxious brain tends to focus on perceived threats and overthink problems, leading to a cycle of anxiety and inaction.
          🧠 Understanding the wiring of our brains and the emotional energy from our past can help us identify and address the root causes of anxiety.
          🧠 Traumatic experiences in childhood can shape our brains and influence our behaviors and fears in the present day.
          😰 Anxiety often stems from the fear of not being liked or accepted by others, leading to a constant need to shape and control their perceptions of us, which can result in becoming a doormat and tolerating abusive behavior.
  https://youtu.be/YNOQzE1XTdU:
    desc: This is Why You're Indecisive | HealthyGamerGG
    tags: [motivation, psy]
    notes:
      - md: |
          ## Key insights

          💪 Decisive people are confident and live life without struggling with indecision.
          😰 Indecisiveness stems from the fear of making the wrong decision, which prevents us from taking action and living life to the fullest.
          💡 Decisions are not permanent, so even if we make the wrong choice, we have the ability to make a different decision in the future.
          😕 People who are more decisive seem to have fewer regrets and make fewer mistakes in their lives, which raises the question of how they are able to make decisions without extensive research.
          💪 It's not the initial decision that determines success or failure, but rather what you do after the decision that truly impacts the outcome.
          💡 Embracing inefficiency and being open to making mistakes can actually lead to more decisive and successful decision-making.
          🤔 The paradox of decision-making is that it's not about making the right choice, but rather committing to a choice and being willing to pivot if necessary.
          🤔 Recognize that the source of your indecisiveness is not the choice itself, but rather your mindset and perception of the outcome.
  https://youtu.be/mVhdgZMLOjg:
    desc: Why Time is Always Your Enemy | HealthyGamerGG
    tags: [motivation, psy]
    notes:
      - md: |
          ## Key Ideas:

          > Time perception can be our enemy when we get stuck dwelling on past regrets or future anxieties, leading to depression and mental health issues, but we can combat this through behavioral activation and present-focused action rather than waiting for hope to motivate us.

          🧠 **The Time Paradox**
          - Humans' unique ability to conceptualize time helped us dominate as a species (like developing agriculture vs. squirrels just instinctively burying nuts)
          - But this same ability can trap us in negative thought patterns about past regrets or future anxieties

          💭 **The Burden of Past and Future:**
          - Depressed people tend to either fixate on past regrets ("I peaked in high school") or project hopelessness into the future
          - Unlike animals, humans can become suicidal because we can imagine a hopeless future
          - Technology addiction often serves as an escape by pulling us into the present moment

          🔄 **Escaping the Trap - Action Before Hope:**
          - Traditional thinking suggests we need hope before taking action
          - Research shows the opposite: taking action generates hope
          - Behavioral activation therapy focuses on getting people to do something, anything, regardless of how they feel

          📝 **Mindfulness and Self-Awareness Practices:**
          - Understanding our relationship with time and where our thoughts typically reside (past, present, or future)
          - Recognizing how dwelling in past/future affects our mood
          - Taking action in the present moment, even small steps, while being prepared for negative thoughts that might arise
          - Focus on the present action rather than getting overwhelmed by past regrets or future worries

          The core message emphasizes that action in the present moment, rather than waiting for hope or dwelling in past/future thoughts, is key to breaking out of negative mental patterns.
