  https://hasura.io/events/webinar/get-started-with-hasura:
    desc: Get started with Hasura
    tags: [webinar]
    notes:
      - md: |
          ## Get started with Hasura

          Learn how to get started with Hasura in this webinar.

          - **Date:** 15th March 2022
          - **Time:** 10:00 AM (PST)
          - **Duration:** 1 hour

          Register [here](https://hasura.io/events/webinar/get-started-with-hasura)
      - md: |
          ## To make access to data "selfe-serve"

          Hasura collapses 3 layers of the traditional stack into one, making app development faster and more efficient.

          ### Before

          ```mermaid
            graph LR
                A[Databases] --> B[ORM]
                B --> C[App Server]
                C --> D[API Gateway]
                D --> E[Consumers]

                subgraph Backend
                    B
                    C
                    D
                end
          ````

          ### After

          ```mermaid
            graph LR
              A[Databases] -->|Event driven stateless business logic| B[Hasura]

              B --> C[Consumers]

              subgraph Backend
                  D[Hasura ORM]
                  E[Hasura App Server]
                  F[Hasura API Gateway]
                  B --> D
                  B --> E
                  B --> F
              end

              subgraph Hasura ORM
                  D1[N+1 query compilation]
                  D2[Connection pooling]
                  D3[Failover / HA database connections]
                  D --> D1
                  D --> D2
                  D --> D3
              end

              subgraph Hasura App Server
                  E1[Authorization]
                  E2[Caching]
                  E3[Business logic sent to event handlers]
                  E --> E1
                  E --> E2
                  E --> E3
              end

              subgraph Hasura API Gateway
                  F1[Load-balancing]
                  F2[Security]
                  F3[Rate-limiting]
                  F --> F1
                  F --> F2
                  F --> F3
              end
          ````
      - md: |
          # API Reference

          > The Hasura GraphQL Engine is essentially an HTTP service that exposes multiple APIs with which you can use to interact with it.
          > The Hasura Console and Hasura CLI and any other tool which interacts with the Hasura Engine will use these APIs to query data and manage it's setup.

          Let's go through some of the APIs which are exposed.

          - The GraphQL API: the endpoint you will use for your day-to-day client GraphQL queries, mutations and subscriptions.
          - The Metadata API: the endpoint that allows you to configure the Hasura engine set up via its metadata.
          - The Schema API: allows direct execution of SQL on the underlying database.
          - The REST API: grants access to the saved GraphQL operations, which have been configured as RESTified endpoints.

          Then there are also the Version, Health Check, PG dump, Config, and Explain APIs, which you can read more about in this section of documentation.
