          - Increased the limit of static rulesets: from 10 to 50 simultaneously enabled, and from 50 to 100 total rulesets in Chrome 120.
          - Dynamic rules limit increased for safer actions (block, allow, etc.) from 5,000 to 30,000 in Chrome 121, while maintaining the original limit for other rules.
