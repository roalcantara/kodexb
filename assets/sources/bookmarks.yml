  How to Completely Uninstall VS Code on Mac:
    desc: How to Completely Uninstall VS Code on Mac (Ultimate Guide) | SpyHunter
    tags: [vscode]
    links: [https://spyhunter.com/shm/uninstall-vs-code-mac]
    notes:
      - sh: |
          brew cask uninstall visual-studio-code
          rm -rf '~/Library/{Application\ Support/Code,Preferences/com.microsoft.VSCode.helper.plist,Preferences/com.microsoft.VSCode.(*|N),Saved\ Application\ State/com.microsoft.VSCode.(*|N),Logs/Code,Caches/Code,Cookies/com.microsoft.VSCode.(*|N)}'

          brew autoremove && brew update && brew upgrade && brew upgrade --cask && brew cleanup && brew doctor

commands:
  robots.txt | Disallow crawling of the entire site:
    desc: Disallow crawling of the entire site
    tags: [seo, robot]
    links: [https://developers.google.com/search/docs/advanced/robots/create-robots-txt#disallow-crawling-of-the-entire-site]
    notes:
      - sh: |
          User-agent: *
          Disallow: /
  robots.txt | Disallow crawling of a directory and its contents:
    desc: Append a forward slash to the directory name to disallow crawling of a whole directory
    tags: [seo, robot]
    links: [https://developers.google.com/search/docs/advanced/robots/create-robots-txt#disallow-crawling-of-a-directory-and-its-contents]
    notes:
      - sh: |
          User-agent: *
          Disallow: /calendar/
          Disallow: /junk/
          Disallow: /books/fiction/contemporary/
  robots.txt | Allow access to a single crawler:
    desc: Only googlebot-news may crawl the whole site
    tags: [seo, robot]
    links: [https://developers.google.com/search/docs/advanced/robots/create-robots-txt#allow-access-to-a-single-crawler]
    notes:
      - sh: |
          User-agent: Googlebot-news
          Allow: /

          User-agent: *
          Disallow: /
  robots.txt | Disallow crawling of a single web page:
    desc: Disallow the useless_file.html page located at https://example.com/useless_file.html, and other_useless_file.html in the junk directory.
    tags: [seo, robot]
    links: [https://developers.google.com/search/docs/advanced/robots/create-robots-txt#disallow-crawling-of-a-single-web-page]
    notes:
      - sh: |
          User-agent: *
          Disallow: /useless_file.html
          Disallow: /junk/other_useless_file.html
