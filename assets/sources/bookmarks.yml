    desc: Why You Are Physically Exhausted All The Time… | HealthyGamerGG
    tags: [motivation, psy]
    notes:
      - md: |
          ## Sleep and Circadian Rhythm

          ⏰ Circadian tiredness is not necessarily related to energy levels or metabolism, but rather influenced by sleep patterns and cycles.
          ⏰ Circadian rhythm disorders can contribute to feeling physically exhausted all the time, affecting the activity level throughout the day.
          ⏰ Having a circadian rhythm disorder doesn't mean you have less energy than others, but rather that your body's internal clock is out of sync with societal norms, causing you to feel jet-lagged and exhausted.
          🏥 Medical care, such as using continuous positive airway pressure (CPAP) machines, can be a solution for sleep apnea.
          🌙 There are specific times of the day when you are naturally better at certain tasks due to your circadian rhythm.
          🌍 Many religious traditions have a practice of waking up early in the morning, suggesting that cognitive activity during the early hours can be highly productive.
          ⏰ Sleep cycles are an important factor to consider when discussing circadian rhythm and its impact on our energy levels.
          ⏰ The longer you sleep, the more your brain changes and cycles through the different stages of sleep.
          ⏰ Waking up in the middle of a sleep cycle and not getting enough sleep progression throughout the night can contribute to feeling tired from a circadian standpoint.

          ## Physiological and Metabolic Influences

          😴 Tiredness is not just a mental feeling, but also a physiological response related to energy levels.
          💤 The key to managing tiredness and energy levels is not just about sleep, but also about what you put into your body and how it responds to it.
          💤 People with sleep apnea can experience multiple apnic episodes per night, resulting in a physically ragged body upon waking up.
          🧠 High levels of adenosine indicate high energy levels in our cells.
          😴 People with sleep apnea may feel tired in the morning and rely on caffeine to wake up, which can further deplete their energy levels.
          💪 Exercise affects insulin and sugar metabolism in a positive way, helping to fix cravings and increase energy levels.
          😴 Feeling tired is a complex combination of mental and physiological signals, including insulin, leptin, ghrelin, inflammation, glycogen stores, fat stores, circadian rhythm, and brain activity.

          ## Factors Affecting Energy Levels

          🤔 When working with individuals, it is important to consider a variety of solutions and factors such as eliminating gluten, dairy, or eggs, practicing different forms of exercise, and incorporating specific supplements into one's diet to address fatigue.
