  https://atuin.sh:
    tags: [coding]
    desc: Sync, fuzzy search and backup shell history
    links:
      - https://docs.atuin.sh
      - https://github.com/atuinsh/atuin
    notes:
      - md: |
          ## Installation
          > brew install atuin

          ### Installing the shell plugin

          ```sh
          echo 'eval "$(atuin init zsh --disable-up-arrow)"' >> ~/.zshrc
          ```

          ### Installing the shell plugin (sheldon)

          ```toml
          # Improved shell history for zsh, bash, fish and nushell
          # https://docs.atuin.sh/configuration/key-binding/#disable-up-arrow
          [plugins.atuin]
            inline='smartcache eval atuin init zsh --disable-up-arrow'
          ```

          ## Import existing history

          ```sh
          atuin import zsh # etc
          ```

          ## Shell completions

          ```sh
          # https://docs.atuin.sh/reference/gen-completions
          atuin gen-completions --shell zsh --out-dir $HOME/.config/zsh/opt/completions
          ```

          ## Config

          Atuin maintains two configuration files, stored in `~/.config/atuin/`
          We store data in `~/.local/share/atuin` (unless overridden by XDG_*).
          The full path to the config file would be `~/.config/atuin/config.toml`
          The config location can be overridden with `ATUIN_CONFIG_DIR`
          Example:

            ```toml
              # Improved shell history for zsh, bash, fish and nushell
              # https://docs.atuin.sh/configuration/config/
              style = "compact"
            ```

          ## Usage

          1. ctrl-r
          2. ArrowUp to navigate up
          3. ArrowDown to navigate down
          4. TAB to paste the selected command into the shell
          5. ENTER to execute the command
          6. ctrl-c to cancel the search
      - md: |
          ## Shortcuts

          | Shortcut                                      | Action                                                                    |
          |-----------------------------------------------|-------------------------------------------------------------------------- |
          | enter                                         | Execute selected item                                                     |
          | tab                                           | Select item and edit                                                      |
          | ctrl + r                                      | Cycle through filter modes                                                |
          | ctrl + s                                      | Cycle through search modes                                                |
          | alt + 1 to alt + 9                            | Select item by the number located near it                                 |
          | ctrl + c / ctrl + d / ctrl + g / esc          | Return original                                                           |
          | ctrl + y                                      | Copy selected item to clipboard                                           |
          | ctrl + ⬅ / alt + b                           | Move the cursor to the previous word                                      |
          | ctrl + ➡️ / alt + f                            | Move the cursor to the next word                                          |
          | ctrl + b / ⬅                                 | Move the cursor to the left                                               |
          | ctrl + f / ➡️                                  | Move the cursor to the right                                              |
          | ctrl + a / home                               | Move the cursor to the start of the line                                  |
          | ctrl + e / end                                | Move the cursor to the end of the line                                    |
          | ctrl + backspace / ctrl + alt + backspace     | Remove the previous word / remove the word just before the cursor         |
          | ctrl + delete / ctrl + alt + delete           | Remove the next word or the word just after the cursor                    |
          | ctrl + w                                      | Remove the word before the cursor even if it spans across word boundaries |
          | ctrl + u                                      | Clear the current line                                                    |
          | ctrl + n / ctrl + j / ⬇                      | Select the next item on the list                                           |
          | ctrl + p / ctrl + k / ⬆                      | Select the previous item on the list                                       |
          | ctrl + o                                      | Open the inspector                                                         |
          | page down                                     | Scroll search results one page down                                        |
          | page up                                       | Scroll search results one page up                                          |
          | ⬇ (with no entry selected)                   | Return original or return query depending on settings                      |
          | ⬆                                            | Select the next item on the list                                           |
