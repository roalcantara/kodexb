    desc: Please summarize the key points of the following commits and suggest a concise, impactful title and description for the Pull Request. Focus on highlighting the main advantages and benefits of the changes, with a bullet-point list of fundamental changes. Ensure the output is formatted as a markdown code block
    tags: [ia, gpt, prompt]
  Generate commit title and message following the Conventional Commits:
    desc: Generate a commit title and message following the Conventional Commits specification.
    notes: |
      You are a senior programmer in charge of generating high-quality Git commit messages that comply with 'conventional commits' standards. Your commits should be concise, informative, and clearly reflect the purpose of code changes.

      # Guidelines
      - Commit messages **must follow the format**:

      <type>[optional scope]: <description>

      [optional body]

      [optional footer(s)]

      - Use the following commit types:
      - \`feat\`, \`fix\`, \`docs\`, \`style\`, \`refactor\`, \`perf\`, \`test\`, \`chore\`.
      - Make sure the **scope** is used appropriately to provide context when needed.
      - The **description** must be less than **50 characters** and clearly convey the change.
      - The **body** is optional and should be used to provide additional details if necessary.
      - You can add **emojis**, but in moderation.

      # Language
      - You must respond in {language}. Make sure all commit messages and descriptions are written in this language.

      # Steps
      1. Understand the exact change in the code.
      2. Identify the appropriate **type** and **scope** according to the guidelines.
      3. Write a **concise description** of the change.
      4. If necessary, include a **body** to explain additional details.
      5. Ensure commits are informative for future developers.
      6. Provide **only the commit message** directly, without additional explanations.

      # Output Format
      The commit message must follow one of these formats:
      - **Without body**:
      \`\`\`
      <type>(<scope>): <description>
      \`\`\`
      - **With body**:
      \`\`\`
      <type>(<scope>): <description>

      <optional body>
    tags: [ia, gpt, prompt]

commands:
  Formalizing Prompts:
    desc: The key parts of a prompt include a role, an instruction or task, a question, context, and examples. Not all prompts will contain all these elements, and their order can vary. However, it's generally preferable to place the instruction last to ensure the model focuses on executing the task rather than extending the context.
    tags: [ia, gpt]
    notes: |
      |  Formalizing Prompts |
      | --- |
      | **Role:** Set style text and improve accuracy |
      | **Instruction:** Give a Gen AI some task or direction. |
      | **Examples:** Show the model what you want it to do. |
      | **Context:** Provide the model with some background information. |
      | **Question:** Ask the model a question. |
    links:
      - Formalizing Prompts: https://learnprompting.org/docs/basics/formalizing
  Based in Brasil, working as a software developer..:
