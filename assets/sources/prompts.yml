  Use few-shot prompting to structure outputs:
    desc: Showing the model a few examples (also called "shots") of what you want it to do. Few shot prompts allows the AI to learn from these few examples.
    tags: [ia, gpt]
    notes: |
      # Showing Examples

      Few-shot prompting is an effective strategy that can guide the model to generate accurate and appropriately structured responses.

      By providing multiple examples, few-shot prompting allows the model to understand the desired output format and respond accordingly, making it a preferred method over zero-shot and one-shot prompting in most scenariosc.

      ## Zero-Shot Prompting
      Add 2+2:

      ## One-Shot Prompting
      Add 3+3: 6
      Add 2+2:

      ## Few-Shot Prompting
      Add 3+3: 6
      Add 5+5: 10
      Add 2+2:
    links:
      - Prompting With ChatGPT: https://learnprompting.org/docs/basics/prompting
  Combining Role and Instruction Prompting:
    desc: Role and instruction prompting can also be combined to create more complex prompts. For example, you could instruct the AI to assume the role of a historian and then provide instructions for a specific task.
    notes: You are a historian specializing in the American Civil War. Write a brief summary of the key events and outcomes of the war.
    tags: [gpt]
    links:
      - Combining Techniques: https://learnprompting.org/docs/basics/combining_techniques
  Combining Context, Instruction, and Few Shot Prompting:
    desc: |
      Combining different prompting strategies can lead to more powerful and effective prompts. Almost all prompts you write will combine multiple strategies.
    notes: |
      Twitter is a social media platform where users can post short messages called "tweets".
      Tweets can be positive or negative, and we would like to be able to classify tweets as positive or negative.
      Here are some examples of positive and negative tweets.
       Make sure to classify the last tweet correctly.

      Q: Tweet: "What a beautiful day!"
      Is this tweet positive or negative?

      A: positive

      Q: Tweet: "I hate this class"
      Is this tweet positive or negative?

      A: negative

      Q: Tweet: "I love pockets on jeans"

      A:
    tags: [ia, gpt, prompt]
    links:
      - Combining Techniques: https://learnprompting.org/docs/basics/combining_techniques
  Google Prompting Essential at Coursera:
    desc: Google Prompting Essential at Coursera
    tags: [ia, prompt, xp]
    links:
      - https://coursera.org/learn/google-prompting-essential
      - https://coursera.org/learn/google-start-writing-prompts-like-a-pro/supplement/tn0VT/course-overview
    notes:
      - md: | #markdown
          ### OVERVIEW

          Google Prompting Essentials has four courses:

          1. Start writing prompts like a pro
          2. Design prompts for everyday work tasks
          3. Speed up data analysis and presentation building
          4. Use AI as a creative or expert partner
      - md: | #markdown
          ## USE THE 5-STEP PROMPT FRAMEWORK

          ### 1. A good prompt follows a simple framework
          - Task _(or Thoughtfully)_
          - Context _(or Create)_
          - References _(or Really)_
          - Evaluate _(or Excellent)_
          - Iterate _(or Inputs)_

          - **Task**
            **WHAT** Describe the task you want the AI to help you with.
            **HOW**
            - **Persona** are the roles you want the AI to play. IE: "a food critic" or "a detective" or "a journalist"
            - **Format** are the output you want the AI to produce. IE: "a review" or "a report" or "an article"

          - **Context**
            **WHAT** is the background information you want the AI to use to complete the task. IE: "the user is a food critic" or "the user is a detective" or "the user is a journalist"
            **HOW**
            - **Background** What background information you want the AI to use to complete the task. IE: "the user is a food critic" or "the user is a detective" or "the user is a journalist"
            - **Information** is the information you want the AI to use to complete the task. IE: "the user is a food critic" or "the user is a detective" or "the user is a journalist"
          - **References**
            **WHAT** What external information you want the AI to use to complete the task. IE: "the user is a food critic" or "the user is a detective" or "the user is a journalist"
            **HOW**
            - **Examples** Give some ideas of what the output should look like. Examples of what the output should look like or what you have done in the past would be helpful.
          - **Evaluate**
            **WHAT** Ask yourself if the input you provided gave you the output you needed.
            **HOW**
            - **Criteria** IE: "did the AI provide a review of the pizza place?" or "did the AI provide a report on the crime scene?" or "did the AI provide an article about the latest news?"
          - **Iterate**
            **WHAT** If you evaluate your output and determine that you're not getting what you need, you can try again by adding more information or tweaking your prompt.
  Convert Inline Links to Reference-Style Links:
    desc: Convert Inline Links to Reference-Style Links
    tags: [ia, gpt, prompt]
    notes:
      - md: | #markdown
          Convert all inline markdown links `[text](URL)` in the provided markdown file to reference-style links format.

          REFERENCE-STYLE LINK FORMAT:
          - In document body: Replace `[text](URL)` with `[text][N]` where N is a sequential number
          - At end of file: Add reference definitions as `[N]: URL 'Title'` (one per line)

          PROCESS:
          1. Scan entire file for inline links `[text](URL)` or `[text](URL "title")` - EXCLUDE links in code blocks (```) or inline code (`)
          2. For each unique URL, assign sequential reference number starting from 0 (or continue from existing if file already has reference-style links)
          3. Replace `[text](URL)` with `[text][N]` throughout document body
          4. Add reference definitions section at end: `[N]: URL 'Title'` (use existing title if present, else generate descriptive title from URL)
          5. Preserve all original text, formatting, structure - ONLY change link syntax

          RULES:
          - Reuse same reference number for duplicate URLs
          - Preserve original link text exactly (including capitalization and formatting)
          - Generate descriptive titles from URL domain/path if title missing (e.g., "AWS SAM developer guide" from aws.amazon.com URL)
          - Order references numerically (0, 1, 2, ...)
          - Skip links already in reference format `[text][N]`
          - Only convert http/https URLs (not relative file paths like `./file.md`)
          - Place reference definitions at very end of file, after all content

          OUTPUT: Complete transformed markdown file with all links converted to reference-style format.

          ### Example Before the Transformation (inline links)

          ```md
          See the [AWS SAM developer guide](https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/what-is-sam.html) for more information.
          Install [Docker Desktop](https://hub.docker.com/search/?type=edition&offering=community).
          ```

          ### Example After the Transformation (reference-style links)

          ```md
          See the [AWS SAM developer guide][0] for more information.
          Install [Docker Desktop][1].

          [0]: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/what-is-sam.html 'AWS SAM developer guide'
          [1]: https://hub.docker.com/search/?type=edition&offering=community 'Docker Desktop'
          ```

