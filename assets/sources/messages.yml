cheats:
  Event/Message Systems:
    desc: Overview of popular event and message systems.
    tags: [event, message, overview]
    notes:
      - md: | #markdown
          ### Overview

          | **Attribute**            | **RabbitMQ**               | **SQS + SNS**                  | **EventBridge**      | **Kafka (MSK)**              |
          | ------------------------ | -------------------------- | ------------------------------ | -------------------- | ---------------------------- |
          | **Architecture**         | Message broker             | Queue + Pub/Sub                | Event router         | Distributed log              |
          | **Message Model**        | Point-to-point, Pub/Sub    | Queue (FIFO/standard), Fan-out | Event routing rules  | Event streams                |
          | **Throughput**           | 50K-1M msgs/sec            | 300K msgs/sec (batched)        | 100K+ events/sec     | 1M+ msgs/sec                 |
          | **Latency**              | <1ms                       | 10-100ms (polling)             | <1sec                | <10ms                        |
          | **Data Retention**       | Transient (ack-delete)     | 15 min - 14 days               | 1 hour - 24 hours    | Configurable (days to years) |
          | **Message Ordering**     | Per queue                  | FIFO queues only               | Per rule             | Per partition                |
          | **Deduplication**        | Not built-in               | SQS FIFO only                  | EventBridge rules    | Consumer-side                |
          | **Management**           | Self-managed/Docker        | Fully managed                  | Fully managed        | Managed via MSK              |
          | **Infrastructure**       | EC2 or container           | AWS service                    | AWS service          | AWS service                  |
          | **Scaling**              | Manual/auto-scaling        | Automatic                      | Automatic            | Manual partition scaling     |
          | **Cost Model**           | Instance-based (always on) | Per request                    | Per event            | Instance-based               |
          | **AWS Integration**      | Plugin-based               | Native                         | Native (Rule engine) | Native                       |
          | **Lambda-Friendly**      | Works, adds complexity     | Excellent                      | Excellent (best)     | Works, more complex          |
          | **Event Replay**         | No                         | No (SQS)                       | No (1 hour max)      | Yes (entire stream)          |
          | **Learning Curve**       | Medium                     | Easy                           | Easy                 | Hard                         |
          | **Operational Overhead** | High                       | None                           | None                 | Medium                       |
          | **Ecosystem**            | Mature, widely supported   | AWS-only                       | AWS-only             | Very mature, cross-platform  |
          | **Multi-tenancy**        | Single instance/cluster    | Built-in isolation             | Built-in isolation   | Per cluster                  |
          | **Connection Model**     | TCP/AMQP                   | HTTP, AWS SDK                  | HTTP, AWS SDK        | TCP/Zookeeper                |
          | **Failure Handling**     | Ack-based                  | Visibility timeout             | Retry policy         | Consumer offset tracking     |
          | **Use Case**             | Task queues, workflows     | Async messaging                | Event-driven systems | Streaming, data pipelines    |

          ---

          ---

          ## Concrete Example: Domain Events in Ink

          ### With EventBridge (Recommended)
          ```typescript
          // domain/events/user-verified.event.ts
          export class UserVerified {
            constructor(
              public userId: UserId,
              public timestamp: Date,
            ) {}
          }

          // apps/web/api/src/auth/handlers/approve-user.command-handler.ts
          @injectable()
          export class ApproveUserCommandHandler {
            constructor(
              @inject('IEventBus') private eventBus: IEventBus,
            ) {}

            async execute(): Promise<void> {
              // ... logic ...

              // Publish event to EventBridge
              await this.eventBus.publish(
                new UserVerified(userId, new Date())
              );
              // EventBridge automatically routes to:
              // - Advertiser context (check eligibility)
              // - Notification service (send email)
              // - Analytics (track verification)
            }
          }

          // EventBridge rule routes event:
          ```
          ```yaml
          # template.yaml (SAM)
          Resources:
            UserVerifiedRule:
              Type: AWS::Events::Rule
              Properties:
                EventBusName: default
                EventPattern:
                  source:
                    - ink.user-identity
                  detail-type:
                    - UserVerified
                State: ENABLED
                Targets:
                  - Arn: !GetAtt AdvertiserEligibilityFunction.Arn
                    RoleArn: !GetAtt EventBridgeRole.Arn
                  - Arn: !GetAtt NotificationFunction.Arn
                    RoleArn: !GetAtt EventBridgeRole.Arn
                  - Arn: !GetAtt AnalyticsFunction.Arn
                    RoleArn: !GetAtt EventBridgeRole.Arn
          ```

          **Benefits**:
          - ✅ Native AWS integration
          - ✅ Declarative routing (rules in SAM)
          - ✅ Auto-scaling
          - ✅ No server to manage
          - ✅ Cheap (~$0.40/million events)

          ---

          ## Migration Path (Future)

          If Ink grows to need Kafka later:
