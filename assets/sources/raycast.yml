# RAYCAST SNIPPETS
# Used to insert the values at anything (Fild, Text Field, etc.)
#
# 💡 NOTE: Keywords must be unique; only the first match is triggered. Meaning:
# ==> GIVEN two snippet keywords: ::pass and ::password
# ==> WHEN typing ::pass
# ==> THEN only the ::pass snippet is triggered, never ::password
#
# 💡 IMPORTATION
# 1. Delete the current Raycast Snippets
# 2. Run the Raycast Script Command: Extract Raycast Snippets
# 3. Import ~/.config/raycast/snippets.json into Raycast
snippets:
  # PERSONAL
