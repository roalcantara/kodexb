              Olá!
              Sou Rogério, engenheiro(a) com sólida experiência em desenvolvimento e DevOps/SRE, atuando há mais de 15 anos em ambientes de alta escalabilidade e automação.
              Tenho histórico em arquitetura de sistemas serverless, pipelines CI/CD, automação de infraestrutura e práticas de observabilidade, sempre focando em entregar ambientes confiáveis e produtivos para os times de engenharia.
              Meu diferencial é unir visão de desenvolvimento com práticas modernas de infraestrutura, criando soluções que empoderam desenvolvedores e aceleram entregas.
              Estou à disposição para contribuir com soluções escaláveis e inovadoras.
          ::msglead:
            name: MSGS/Generic Tech Lead/Liderança Intro (pt-BR)
            text: |
              Prezados,
              Com mais de 15 anos de experiência em desenvolvimento de software e liderança técnica, tenho atuado como Tech Lead em projetos de tecnologia.
              Minha trajetória inclui arquitetura de sistemas escaláveis, implementação de práticas ágeis, mentoria de equipes e entrega de soluções robustas alinhadas aos objetivos do negócio.
              Busco sempre promover ambientes colaborativos, melhoria contínua e excelência técnica.
              Estou animado para contribuir com minha experiência em liderança e tecnologia para impulsionar os resultados da equipe.
          ::msgagil:
            name: MSGS/Generic Agile/Scrum Master Intro (pt-BR)
            text: |
              Prezados,
              Atuo há mais de {anos} anos com desenvolvimento ágil, facilitando cerimônias Scrum, implementando Kanban e promovendo cultura de melhoria contínua em equipes multidisciplinares.
              Tenho experiência em automação de processos, CI/CD, testes automatizados e infraestrutura como código, apoiando times tanto na entrega técnica quanto na evolução dos processos.
              Meu foco é alinhar tecnologia e estratégia de negócio, promovendo ambientes de alta performance e geração de valor.
              Estou à disposição para contribuir com a evolução ágil da equipe e da empresa.

            # PROMPT
          ::pimp:
            name: PROMPT/Improve Text
            text: Improve/clariry/simplify/shorten this text
          ::passes:
            name: PROMPT/Resume Assessement
            text: Given the attached resume, how would you assess the candidate's fit for the {clipboard} role?
          ::pjob:
            name: PROMPT/Job Description Analysis
            text: 'Please analyse and provide your insights on how my resume aligns with the following Job Description:'
          ::pcar:
            name: PROMPT/Carta de Apresentação
            text: |-
              Dado o currículo anexado

              Qual seria um rascunho bacana para uma Carta de Apresentação que responda a
              pergunta de um recrutador: `The company wants to know more about you! Tell
              us about yourself and your professional journey, explaining how you can help
              the company with the challenge described in the job posting.` (Pt-BR, até
              1400 caracteres) focado na seguinte oportunidade:
          ::pcov:
            name: PROMPT/Create a Professional Cover Letter
            text: |-
              # Create a Professional Cover Letter Based on My Resume and the Job
              Description\n\n

              I need you to create a personalized cover letter for a job application.
              Please follow these specific guidelines:

              ## Input Requirements

              - Use my resume information (attached/pasted below) to highlight relevant
              qualifications

              - Reference the specific job description (attached/pasted below) to tailor
              the content

              - If any information is missing, please ask me for the specific details you
              need

              ## Cover Letter Format

              1. **Header**: Include my contact information and date

              2. **Greeting**: Address the hiring manager by name if available, otherwise
              use an appropriate professional greeting

              3. **Introduction**: Engaging opening paragraph stating the position I'm
              applying for and how I discovered it

              4. **Body Paragraphs**:
                - Highlight 2-3 specific qualifications from my resume that directly match key requirements in the job description
                - Include concrete examples of achievements with measurable results when possible
                - Explain why I'm interested in this specific company and position
              5. **Closing Paragraph**: Express enthusiasm, request an interview, and
              thank them for their consideration

              6. **Professional sign-off**: With my full name

              ## Tone and Style

              - Professional but conversational

              - Confident without being arrogant

              - Concise (keep to approximately 300-400 words)

              - Free of clichés and generic statements

              Please create a cover letter that showcases my unique qualifications for
              this specific position while demonstrating my understanding of the company's
              needs and values.
          ::pboo:
            name: PROMPT/Boost my thing
            text: Is there a better way to improve this?
          ::pmsgfull:
            name: PROMPT/Generic Full-Stack Intro (pt-BR)
            text: |
              Dado a seguinte Job Opportunity:

              ```
              {clipoboard}
              ```

              Qual seria um rascunho bacana para uma mensagem de apresentação (curta, clara, que atenda os requisitos da oportunidade, e que tenha um tom alinhado ao tom presente na oportunidade) semelhante (mas melhor) ao exemplo a seguir:

              ```
              Olá!
              Sou Rogério, profissional com mais de 15 anos de experiência em desenvolvimento de software, atuando em projetos de tecnologia.
              Tenho sólida experiência em TypeScript/Node.js, React/Next.js, AWS, Docker, CI/CD, observabilidade, e já liderei iniciativas que resultaram em 1M+ usuários com 99,9% de disponibilidade.
              Minha trajetória inclui atuação em startups, empresas de tecnologia, e empresas de consultoria, sempre priorizando qualidade, automação e melhoria contínua.
              Estou entusiasmado para contribuir com minha experiência e ajudar a impulsionar os resultados da equipe/empresa.
              Atenciosamente,
              Rogério
              ```
