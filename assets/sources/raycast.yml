    notes:
      - md: | #markdown
          ## Raycast Snippets

          - You can import snippets from a JSON file using Import Snippets command (available in Raycast 1.37.0+).

          ### JSON Format
          - **Root object** - Array of snippets
          - **Snippet object**
            - **name** - Snippet title. _Type: String (required)_
            - **text** - Snippet content. _Type: String (required)_
            - **keyword** - Auto-expansion keyword. _Type: String (optional)_

          ### SCHEMA (Example)

          ```json
          [
            {
              "name": "Personal Email",
              "text": "sherlock@gmail.com",
              "keyword": "@@"
            },
            {
              "name": "Home Address",
              "text": "221B Baker St., London"
            },
            {
              "name": "Catchphrase 1",
              "text": "Elementary, my dear Watson",
              "keyword": "!elementary"
            }
          ]
          ```
