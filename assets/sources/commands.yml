  airport -I:
    desc: Check if you're connected to a 2.4 GHz or 5 GHz Wi-Fi network via the command line interface (CLI) on macOS
    tags: [ wifi, wireles, airport ]
    notes:
      - md: |
          The `airport` command, which is a tool for configuring and querying airport wireless devices

          1. Can create a symbolic link to make the command more accessible

          ```sh
          sudo ln -s /System/Library/PrivateFrameworks/Apple80211.framework/Versions/Current/Resources/airport /usr/local/bin/airport
          ```

          2. Run the command to get the wireless device information

          ```sh
          airport -I
          ```

          3. Check the Wi-Fi Details:

          After running `airport -I`, look for the channel information in the output.

          This will tell you which channel your Wi-Fi is connected to.

            - Channels 1-14 indicate a **2.4 GHz** network.
            - Channels above 14 indicate a **5 GHz** network.
