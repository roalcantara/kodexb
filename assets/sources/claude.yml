  Hooks (Lesson 11) | Claude Code 101:
    desc: Lifecycle hooks for safety and automation
    tags: [ ai, claude-code, xp ]
    links:
      - Lesson 11 > Hooks: https://anthropic.skilljar.com/claude-code-101/469798
      - (Youtube) Hooks in Claude Code: https://youtu.be/IkaPHiMDazM
    notes:
      - md: |
          # Hooks

          Run scripts (or block actions) at predictable lifecycle points—before/after tool use, when you submit a prompt, on stop, or on notifications—so formatting, logging, and guardrails happen automatically.

          ## KEY TAKEAWAYS

          - **Config**:
            - `.claude/settings.json` file
            - or configure through the `/hooks` UI
          - **Triggers**:
            - `PreToolUse`: runs before a tool call
            - `PostToolUse`: runs after a tool call completes
            - `UserPromptSubmit`: runs when you submit a prompt, before Claude processes it
            - `Stop`: runs when Claude finishes responding
            - `Notification`: runs when Claude sends a notification
          - **Teams**:
            - Commit project-level hooks; reference files via `CLAUDE_PROJECT_DIR` for stable paths

          ## EXAMPLES

          - **Auto-format**:
            - Use `PostToolUse` hook to auto-format the code after edits
          - **Structured logging**:
            - Use `PostToolUse` hook to log the code changes
          - **Block dangerous commands**:
            - Use `PreToolUse` hook to block dangerous commands (for example `rm -rf`)

          ## COMMANDS

          - `/hooks`: configure and inspect hook entries in the product UI

          > 💡 **PROTIP**: Keep hooks **fast and deterministic**—slow hooks train people to disable the safety net.
