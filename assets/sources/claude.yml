      - (Youtube) What are subagents?: https://youtu.be/jKErNxuxPXg
      - Introduction to Subagents: https://anthropic.skilljar.com/introduction-to-subagents
    notes:
      - md: |
          # What Are Subagents?

          Parallel workers with their own context budget: you delegate research, reviews, or spikes, and only the **final artifact** (summary, patch proposal, verdict) returns—keeping your main session uncluttered.

          ## KEY TAKEAWAYS

          - **Format**:
            - Markdown + YAML specs describe role, tools, and preloaded `Skills`
          - **Isolation**:
            - Separate context per subagent so exploration does not flood the main thread
          - **Memory**:
            - Each agent can carry focused instructions and examples
          - **Main session**:
            - Receives condensed output, not the full scratch work

          ## COMMANDS

          - `/agents`: create and manage subagent definitions

          > 💡 **PROTIP**: Give subagents a **narrow mission** (“diff these two modules”, “audit tests for flakiness”) to maximize signal returned to main.
