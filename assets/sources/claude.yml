    notes:
      - md: | #markdown
          # Claude Code 101

          ## Overview

          A practical guide to installing, configuring, and using Claude Code—from basics to advanced customization—to boost your daily coding workflow.

          ### Learning Objectives

          - Understand what an AI coding agent is and how Claude Code differs from chat-based AI tools
          - Learn how the agentic loop, context window, tools, and permissions work together
          - Install and set up Claude Code in the terminal, VS Code, JetBrains, Claude Desktop, or on the web
          - Write better prompts using approval, auto-accept, and plan modes
          - Apply the Explore → Plan → Code → Commit workflow to any feature or task
          - Manage context using `/compact`, `/clear`, and `/context` for productivity
          - Use a `CLAUDE.md` file for persistent project memory
          - Create subagents to delegate tasks and keep your main context clean
          - Connect external tools and data sources using MCP servers
          - Write hooks for automated formatting, command blocking, and notifications

          ## [1](https://anthropic.skilljar.com/claude-code-101/469788) What is Claude Code?

          AI coding agent in your repo: reads code, edits files, runs shell, ties into your toolchain.

          **Key Takeaways**
          - [Claude Code](https://anthropic.skilljar.com/claude-code-101/469788): agentic coding assistant—**not** chat-only
            - `Capabilities`: read/edit files, run shell commands
            - `Approvals`: asks before changes unless you change defaults
            - `Context` (working memory): `/compact`, `/clear`, `/context`
            - You review diffs; watch for mistakes

          ## [2](https://anthropic.skilljar.com/claude-code-101/469789) How Claude Code Works

          Agentic loop—gather context, act, verify—with tools and permissions for safer automation.

          ```mermaid
          %%{init: {
            "theme": "dark",
            "flowchart": { "curve": "basis", "padding": 14 },
            "themeVariables": {
              "background": "#0f172a",
              "primaryTextColor": "#e2e8f0",
              "lineColor": "#717486",
              "clusterBkg": "#313549",
              "clusterBorder": "#94a3b8"
            }
          }}%%
          flowchart LR
            classDef pillStart fill:#f8fafc,stroke:#64748b,color:#0f172a
            classDef pillEnd fill:#86efac,stroke:#166534,color:#14532d
            classDef step fill:#93c5fd,stroke:#1d4ed8,color:#0f172a
            classDef interrupt fill:#fdba74,stroke:#c2410c,color:#0f172a
            classDef iterate fill:#374151,stroke:#9ca3af,color:#f3f4f6

            P(["''Your prompt''"]):::pillStart
            I["''You interrupt, steer or add context''"]:::interrupt

            subgraph AGENTIC["Agentic Loop"]
              direction LR
              GC["Gather context"]:::step
              TA["Take action"]:::step
              VR["Verify results"]:::step
              IT[["iterate"]]:::iterate
              GC --> TA
              TA --> VR
              VR -.-> IT
              IT -.-> GC
            end

            D(["Done"]):::pillEnd

            P --> AGENTIC
            I --> AGENTIC
            AGENTIC --> D
          ```

          **Key Takeaways**
          - [How it works](https://anthropic.skilljar.com/claude-code-101/469789): loop = gather → act → verify → iterate until done
            - `Context`: summarize/compact when the window fills
            - `Tools`: edits, search, and other non-chat actions
            - `Permissions`: gate risky work before it runs
            - `Model`: code agent, not a passive chat UI

          ## [3](https://anthropic.skilljar.com/claude-code-101/469791) Your First Claude Code Prompt

          Choose a `mode` for how much you steer vs how much it runs on its own.

          **Key Takeaways**
          - `Shift + Tab`: switch modes anytime
            - `Approval mode`: confirm **every** action
            - `Auto-accept mode`: auto-approve **file edits**; commands still need approval
            - `Plan mode`: plan first, then execute after you're happy
          - Short, specific prompts → better results

          ## [4](https://anthropic.skilljar.com/claude-code-101/469792) The Explore → Plan → Code → Commit Workflow

          Repeatable pipeline: explore → plan → implement → ship—safer for you and reviewers.

          **Key Takeaways**
          - `Explore`: read code, search docs, clarify unknowns
          - `Plan`: proposed steps for your review/revision
          - `Code`: implement, run tests, explain changes
          - `Commit`: review subagent → commit message → push
            - `Skill`: `/commit-push-pr` → commit, push, open PR

          ## [5](https://anthropic.skilljar.com/claude-code-101/469793) Context Management

          The `context window` is finite—treat it like RAM for the session.

          **Key Takeaways**
          - `Prompts`: concise + specific to save tokens
          - `Subagents`: parallel/research without bloating main context
          - `Commands`:
            - `/mcp`: MCP servers/tools; disable unused to save context
            - `/compact`: summarize context, keep essentials
            - `/clear`: reset for a new topic/session
            - `/context`: usage breakdown

          ## [6](https://anthropic.skilljar.com/claude-code-101/469794) Code Reviews

          Subagents + PR workflow so review stays structured and resumable.

          **Key Takeaways**
          - `Subagent`: dedicated reviewer; save configs for the team
          - `gh pr create`: link the session to a PR
            - `Skill`: `/commit-push-pr` (commit, push, PR)
            - `CLI`: `claude --from-pr <PR_NUMBER>` — resume PR-linked work

          ## [7](https://anthropic.skilljar.com/claude-code-101/469795) The CLAUDE.md File

          Long-lived instructions so the agent matches your repo's rules and stack.

          **Key Takeaways**
          - `Paths`:
            - `CLAUDE.md`: project root (team/project memory)
            - `~/CLAUDE.md`: personal defaults
          - `Content`: commands, conventions, stack, doc pointers (`@filepath`)
          - `Commands`:
            - `/init`: scaffold a starter `CLAUDE.md`
          - Revisit after big corrections or new non-negotiables

          ## [8](https://anthropic.skilljar.com/claude-code-101/469796) What Are Subagents?

          Parallel workers with **isolated** context—only the result returns to the main session.

          **Key Takeaways**
          - [Subagents](https://anthropic.skilljar.com/introduction-to-subagents): research, reviews, experiments off the hot path
            - `/agents`: define agents (Markdown + YAML)
            - `Memory` + preloaded `skills` per agent
            - `Main context`: gets the **final** answer, not the full subagent trace

          ## [9](https://anthropic.skilljar.com/claude-code-101/469848) What Are Skills?

          Optional, load-when-relevant playbooks—usually cheaper than giant always-on `CLAUDE.md`.

          **Key Takeaways**
          - [Skills](https://anthropic.skilljar.com/introduction-to-agent-skills): Markdown + YAML instructions for repeatable tasks
            - `Paths`:
              - `~/.claude/skills`: personal
              - `.claude/skills`: project
            - `Invocation`: auto when the prompt matches the skill
          - Prefer `skills` (+ CLI tools) over stuffing everything into always-on context

          ## [10](https://anthropic.skilljar.com/claude-code-101/469797) MCP

          Wire in external APIs and local processes as tools.

          **Key Takeaways**
          - [MCP](https://anthropic.skilljar.com/mcp-in-claude-code): extra tools/data beyond built-ins
            - `MCP Types`:
              - `HTTP` (cloud): remote/web APIs
              - `STDIO`: local scripts / processes
            - `MCP Scopes` (typical; confirm in product docs):
              - `.mcp.json`: project (repo root, shareable)
              - `~/.claude.json`: user + local overrides (precedence: local → project → user)
          - `Commands`:
            - `/mcp`: add/list/configure MCP servers and tools
          - `CLI commands`:
            - `claude mcp list`: what's registered and from which scope
            - `claude mcp add <NAME>`: register a server
            - `claude mcp disable <NAME>`: turn off unused MCPs (saves context)
          - Default to `CLI tools` (e.g. `gh`, `aws`) + `skills` before adding MCP surface area

          ## [11](https://anthropic.skilljar.com/claude-code-101/469798) Hooks

          Lifecycle hooks: run commands or block actions automatically.

          **Key Takeaways**
          - [Hooks](https://anthropic.skilljar.com/claude-code-101/469798): always-on scripts on agent events
            - `Config`: `.claude/settings.json` or `/hooks` UI
            - `Triggers`: `PreToolUse`, `PostToolUse`, `UserPromptSubmit`, `Stop`, `Notification`
            - `Uses`: format-after-edit, audit logs, block dangerous commands (e.g. `rm -rf`)
            - `Exit codes`: `0` proceed · `2` block · `1` error (not blocked)
            - `Teams`: commit project hooks; use `CLAUDE_PROJECT_DIR` for stable paths
  What is Claude Code? (Lesson 01) | Claude Code 101:
    desc: Agent in your repo—reads, edits, runs shell, uses your toolchain
    tags: [ ai, claude-code, xp ]
    links:
      - Lesson 1 > What is Claude Code: https://anthropic.skilljar.com/claude-code-101/469788
      - (Youtube) What is Claude Code?: https://youtu.be/fl1DSmwQKKY
    notes:
      - md: |
          # What is Claude Code?

          AI coding agent that understands your codebase, edits files, runs terminal commands, and connects to your development tools so you can ship faster—with explicit approval boundaries instead of a passive chat-only assistant.

          ## KEY TAKEAWAYS

          - **Role**:
            - Works **in** the repository (not just answering in a chat pane)
          - **Capabilities**:
            - Reads and edits code, runs shell commands, uses configured tools
          - **Approvals**:
            - Seeks confirmation before changes unless you change defaults
          - **Context**:
            - Uses a finite context window as working memory

          ## COMMANDS

          - `/compact`: summarize context while keeping essentials
          - `/clear`: reset for a new topic or session
          - `/context`: inspect usage and breakdown

          > 💡 **PROTIP**: Always review diffs and watch for mistakes—treat the agent as a fast collaborator, not an infallible author.
  How Claude Code Works? (Lesson 02) | Claude Code 101:
    desc: Gather → act → verify loop, plus tools and permissions
    tags: [ ai, claude-code, xp ]
    links:
      - Lesson 2 > How Claude Code Works?: https://anthropic.skilljar.com/claude-code-101/469789
      - (Youtube) How Claude Code Works?: https://youtu.be/6bs5b4FltCU
    notes:
      - md: |
          # How Claude Code Works

          The **agentic loop**: it gathers context about your repo and intent, takes actions through tools (edits, search, shell, and more), verifies outcomes, and iterates until the task is done—while **permissions** decide when it must pause for your approval.

          ```mermaid
          %%{init: {
            "theme": "dark",
            "flowchart": { "curve": "basis", "padding": 14 },
            "themeVariables": {
              "background": "#0f172a",
              "primaryTextColor": "#e2e8f0",
              "lineColor": "#717486",
              "clusterBkg": "#313549",
              "clusterBorder": "#94a3b8"
            }
          }}%%
          flowchart LR
            classDef pillStart fill:#f8fafc,stroke:#64748b,color:#0f172a
            classDef pillEnd fill:#86efac,stroke:#166534,color:#14532d
            classDef step fill:#93c5fd,stroke:#1d4ed8,color:#0f172a
            classDef interrupt fill:#fdba74,stroke:#c2410c,color:#0f172a
            classDef iterate fill:#374151,stroke:#9ca3af,color:#f3f4f6

            P(["''Your prompt''"]):::pillStart
            I["''You interrupt, steer or add context''"]:::interrupt

            subgraph AGENTIC["Agentic Loop"]
              direction LR
              GC["Gather context"]:::step
              TA["Take action"]:::step
              VR["Verify results"]:::step
              IT[["iterate"]]:::iterate
              GC --> TA
              TA --> VR
              VR -.-> IT
              IT -.-> GC
            end

            D(["Done"]):::pillEnd

            P --> AGENTIC
            I --> AGENTIC
            AGENTIC --> D
          ```

          ## KEY TAKEAWAYS

          - **Agentic Loop**:
            - `Prompt` → `gather context` → `take action` → `verify` → `iterate` until done
          - **Context**:
            - Summarize or compact when the context window fills so the model keeps signal, not noise
          - **Tools**:
            - File edits, search, shell, and other actions beyond plain chat text
          - **Permissions**:
            - Gate risky or irreversible work before it runs
          - **Model**:
            - Behaves as a **code agent**, not a passive Q&A UI
  Your First Claude Code Prompt (Lesson 03) | Claude Code 101:
    desc: Modes balance your control vs execution speed
    tags: [ ai, claude-code, xp ]
    links:
      - Lesson 3 > Your First Claude Code Prompt: https://anthropic.skilljar.com/claude-code-101/469791
      - (Youtube) Your First Claude Code Prompt: https://youtu.be/gbetp6D7J_Q
    notes:
      - md: |
          # Your First Claude Code Prompt

          Your first sessions go smoother when you pick a **mode** that matches how closely you want to supervise the agent: full manual approval, faster edits with guardrails, or plan-first execution after you sign off on the steps.

          ## KEY TAKEAWAYS

          - **Prompting**:
            - Short, specific instructions beat vague one-liners
          - **Modes**:
            - `Approval mode`: confirm **every** action
            - `Auto-accept mode`: auto-approve **file edits**; shell/commands still need approval
            - `Plan mode`: present a plan first, then implement after you accept it

          ## SHORTCUTS

          - `Shift + Tab`: switch modes anytime

          > 💡 **PROTIP**: Start in **Approval** or **Plan** until you trust the workflow for your repo; tighten prompts once you see where it drifts.
  Agentic Loop (Lesson 04) | Claude Code 101:
    desc: Explore, plan, implement, then ship with review
    tags: [ ai, claude-code, xp ]
    links:
      - Lesson 4 > The Explore → Plan → Code → Commit Workflow: https://anthropic.skilljar.com/claude-code-101/469792
      - (Youtube) The Explore → Plan → Code → Commit Workflow: https://youtu.be/xJQuF02NAK8
    notes:
      - md: |
          # The Explore → Plan → Code → Commit Workflow

          This workflow is a deliberate cadence—**explore** the problem space, **plan** before expensive edits, **code** with tests and explanations, then **commit** through review—so changes stay reviewable, reversible, and team-friendly.

          ## KEY TAKEAWAYS

          - **Explore**:
            - Read code, search docs, ask clarifying questions before big edits
          - **Plan**:
            - Propose steps; you revise before execution
          - **Code**:
            - Implement, run tests, explain what changed and why
          - **Commit**:
            - Use a review pass, craft the commit message, push when green

          ## COMMANDS

          - `/commit-push-pr`: automate commit, push, and PR creation (when you use that skill)

          ## CLI COMMANDS

          - `gh pr create`: link work on a branch to a pull request for review

          > 💡 **PROTIP**: Do not skip **Plan** on unfamiliar codepaths—the cheap step is the outline; the expensive step is the wrong refactor.
  Contexts (Lesson 05) | Claude Code 101:
    desc: Keep the context window lean for accuracy
