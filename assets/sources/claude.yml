    notes:
      - md: | #markdown
          # CLAUDE API OVERVIEW

          The Claude API is a RESTful API at `https://api.anthropic.com` that provides programmatic access to Claude models and Claude Managed Agents.

          > **NOTE:** New to Claude?
          >
          >   - For direct model access
          >     - Start with [Get started](https://platform.claude.com/docs/en/get-started)
          >     - See [Working with Messages](https://platform.claude.com/docs/en/build-with-claude/working-with-messages)
          >   - For managed agent infrastructure
          >     - See [Claude Managed Agents quickstart](https://platform.claude.com/docs/en/managed-agents/quickstart)

          ### PRE-REQUISITES

          You'll need:

          - [Claude Console account](https://platform.claude.com)
          - [API key](https://platform.claude.com/docs/en/get-started)

          See [Get started](https://platform.claude.com/docs/en/get-started) for step-by-step setup instructions

          ### AVAILABLE APIs

          The Claude API includes the following APIs:

          **GENERAL AVAILABILITY:**

            - **[Messages API](https://platform.claude.com/docs/en/api/messages/create)**:
              Use `POST /v1/messages` to send messages to Claude for conversational interactions
            - **[Message Batches API](https://platform.claude.com/docs/en/api/creating-message-batches)**:
              Use `POST /v1/messages/batches` to process large volumes of Messages requests asynchronously with 50% cost reduction
            - **[Token Counting API](https://platform.claude.com/docs/en/api/messages-count-tokens)**:
              Use `POST /v1/messages/count_tokens` to count tokens in a message before sending to manage costs and rate limits
            - **[Models API](https://platform.claude.com/docs/en/api/models-list)**:
              Use `GET /v1/models` to list available Claude models and their details

          **BETA:**

            - **[Files API](https://platform.claude.com/docs/en/api/files-create)**:
              Use `POST /v1/files` and `GET /v1/files` to upload and manage files for use across multiple API calls
            - **[Skills API](https://platform.claude.com/docs/en/api/skills/create-skill)**:
              Use `POST /v1/skills` and `GET /v1/skills` to create and manage custom agent skills
            - **[Agents API](https://platform.claude.com/docs/en/managed-agents/agent-setup)**:
              Use `POST /v1/agents` and `GET /v1/agents` to define reusable, versioned agent configurations for Claude Managed Agents
            - **[Sessions API](https://platform.claude.com/docs/en/managed-agents/sessions)**:
              Use `POST /v1/sessions` and `GET /v1/sessions/{id}/stream` to run stateful agent sessions in managed cloud containers
            - **[Environments API](https://platform.claude.com/docs/en/managed-agents/environments)**:
              Use `POST /v1/environments` and `GET /v1/environments` to configure container templates for agent sessions

          - Explore the API reference pages listed in the navigation for the complete API reference with all endpoints, parameters, and response schemas
          - See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) to access beta features

          ### AUTHENTICATION

          All requests to the Claude API must include these headers:

          | Header              | Value                            | Required |
          | ------------------- | -------------------------------- | -------- |
          | `x-api-key`         | Your API key from Console        | Yes      |
          | `anthropic-version` | API version (e.g., `2023-06-01`) | Yes      |
          | `content-type`      | `application/json`               | Yes      |

          - [Client SDKs > Python, TypeScript, Java, Go, C#, Ruby, and PHP](https://platform.claude.com/docs/en/api/client-sdks) automatically sends these headers
          - See [API versioning > API versioning details](https://platform.claude.com/docs/en/api/versioning) for API versioning details

          ### GETTING API KEYS

          - Use [Console Web](https://platform.claude.com/) to access the API
          - Use [Workbench](https://platform.claude.com/workbench) to try out the API in the browser
          - Use [Account Settings > Generate API keys](https://platform.claude.com/settings/keys) to generate API keys
          - Use [workspaces](https://platform.claude.com/settings/workspaces) to segment your API keys
          - Use [Rate limits](https://platform.claude.com/docs/en/api/rate-limits) to control spend by use case by your API key

          ### CLIENT SDKS

          Anthropic provides official SDKs that simplify API integration by handling authentication, request formatting, error handling, and more:

          **BENEFITS**:

          - Automatic header management `(x-api-key, anthropic-version, content-type)`
          - Type-safe request and response handling
          - Built-in retry logic and error handling
          - Streaming support
          - Request timeouts and connection management

          See [CLIENT SDKS](https://platform.claude.com/docs/en/api/client-sdks) for a list of client SDKs and their respective installation instructions.

          ### AVAILABILITY ON PARTNER PLATFORMS

          - Claude is available through the direct [Claude API](https://platform.claude.com/docs/en/api/overview) and through partner platforms.
          - Choose based on your infrastructure, compliance requirements, and pricing preferences.

          ### CLAUDE API

          - **Direct access** to the latest models and features first
          - **Anthropic billing and support**
          - **Best for**: New integrations, full feature access, direct relationship with Anthropic

          ### THIRD-PARTY PLATFORM APIs

          Access Claude through AWS, Google Cloud, or Microsoft Azure:

          - **Integrated** with cloud provider billing and IAM
          - **May have feature delays** or differences from the direct API
          - **Best for**: Existing cloud commitments, specific compliance requirements, consolidated cloud billing

          | **PROVIDER**    | **DOCUMENTATION**                                                                                          |
          | --------------- | ---------------------------------------------------------------------------------------------------------- |
          | AWS             | [Claude in Amazon Bedrock](https://platform.claude.com/docs/en/build-with-claude/claude-in-amazon-bedrock) |
          | Google Cloud    | [Claude on Vertex AI](https://platform.claude.com/docs/en/build-with-claude/claude-on-vertex-ai)           |
          | Microsoft Azure | [Claude on Azure AI](https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry)    |

          > 💡 **NOTE:**
          >
          >   [Claude Managed Agents](https://platform.claude.com/docs/en/managed-agents/overview) is available only through the direct [Claude API](https://platform.claude.com/docs/en/api/overview).
          >   See [Features overview](https://platform.claude.com/docs/en/build-with-claude/overview) for feature availability across platforms.

          ### REQUEST AND RESPONSE FORMAT

          ### REQUEST SIZE LIMITS

          | **ENDPOINT**                                                                        | **MAXIMUM REQUEST SIZE** |
          | ----------------------------------------------------------------------------------- | ------------------------ |
          | Messages, Token Counting                                                            | 32 MB                    |
          | [Batch API](https://platform.claude.com/docs/en/build-with-claude/batch-processing) | 256 MB                   |
          | [Files API](https://platform.claude.com/docs/en/build-with-claude/files)            | 500 MB                   |
          | Sessions, Agents, Environments                                                      | 32 MB                    |

          If you exceed these limits, you'll receive a 413 `request_too_large` error.

          > 💡 **NOTE:**
          >
          >   - Third-party platforms have their own request size limits:
          >     - Vertex AI limits requests to 30 MB
          >     - Amazon Bedrock limits requests to 20 MB
          >   - Consult your platform's documentation for current values.

          ### RESPONSE HEADERS

          The Claude API includes the following headers in every response:

          - `request-id`: A globally unique identifier for the request
          - `anthropic-organization-id`: The organization ID associated with the API key used in the request

          ### RATE LIMITS AND AVAILABILITY

          #### RATE LIMITS

          - The API enforces rate limits and spend limits to prevent misuse and manage capacity.
          - Limits are organized into usage tiers that increase automatically as you use the API.
          - Each tier has:

              - **Spend limits**: Maximum monthly cost for API usage
              - **Rate limits**: Maximum number of requests per minute `(RPM)` and tokens per minute `(TPM)`
              - **Higher limits or Priority Tier**: contact sales through the Console.

          - Use [Console](https://platform.claude.com/settings/limits) to view your organization's current limits
          - Use [Rate limits](https://platform.claude.com/docs/en/api/rate-limits) for detailed information about limits, tiers, and the token bucket algorithm used for rate limiting.

          ### AVAILABILITY

          - Use [Supported Regions](https://platform.claude.com/docs/en/api/supported-regions) to confirm availability in your location.

          ### NEXT STEPS

          - Use [Messages API reference](https://platform.claude.com/docs/en/api/messages/create) to view the complete API specification for direct model interactions
          - Use [Claude Managed Agents reference](https://platform.claude.com/docs/en/managed-agents/sessions) to view the Agents, Sessions, and Environments endpoints
          - Use [Client SDKs](https://platform.claude.com/docs/en/api/client-sdks) to view the Python, TypeScript, Java, Go, C#, Ruby, and PHP SDKs
          - Use [Rate limits](https://platform.claude.com/docs/en/api/rate-limits) to view the Usage tiers, spend limits, and token bucket algorithm
