    notes:
      - md: |
          # CONTEXTS: finite working memory

          When packed with noise, answers get shallow or wrong; if you offload work and summarize deliberately, you keep high-signal context for the task at hand.

          ## KEY TAKEAWAYS

          - **Prompts**:
            - Concise, specific requests save tokens for code and logs
          - **Subagents**:
            - Run parallel or research tasks in isolated contexts so the main thread stays clean
          - **Tool surface**:
            - Disable unused MCP servers/tools so descriptions do not eat the window (see Lesson 10)

          ## COMMANDS

          - `/mcp`: manage MCP servers and tools; disable what you do not need
          - `/compact`: summarize context while retaining essentials
          - `/clear`: reset for a fresh feature or session
          - `/context`: inspect usage and breakdown

          > 💡 **PROTIP**: When a task balloons, spawn a **subagent** for the deep read and paste back only conclusions + file pointers.
