cheats:
  Neovim Providers:
    desc: Neovim Providers
    tags: [vim]
    notes:
      - md: |
          ## NEOVIM PROVIDERS

          ### WHAT ARE PROVIDERS?

          Providers allow Neovim to interface with external language runtimes (Python, Node.js, Ruby, Perl) to run plugins written in those languages.

          ### BENEFITS OF SETTING UP PROVIDERS

          - **Python Provider:**
            - Required for plugins like: `deoplete`, `semshi`, `vim-markdown-composer`, some LSP/completion plugins
            - Enables `:python3` and `:py3` commands in Neovim
            - Many legacy Vim plugins depend on it

          - **Node.js Provider:**
            - Required for: `coc.nvim`, `markdown-preview.nvim`, many modern LSP/completion tools
            - JavaScript/TypeScript-based plugins need it
            - Growing ecosystem due to JS popularity

          - **Ruby Provider:**
            - Less common, but needed for some legacy Vim plugins
            - Few modern Neovim plugins use it

          ### DISABLING PROVIDERS

          ```lua
          vim.g.loaded_python3_provider = 0
          vim.g.loaded_ruby_provider = 0
          vim.g.loaded_node_provider = 0
          vim.g.loaded_perl_provider = 0
          ```

          ### PROBLEMS

          1. **Plugin breakage**: Plugins requiring disabled providers will fail silently or with errors
          2. **Missing features**: Commands like `:py3` won't work
          3. **Health check warnings**: `:checkhealth` will show warnings/errors
          4. **Limited plugin ecosystem**: Can't use popular plugins (e.g., CoC requires Node.js)

          ### BENEFITS

          1. **Faster startup**: ~5-50ms faster (minimal unless you have many providers)
          2. **Fewer dependencies**: Don't need Python/Node/Ruby installed
          3. **Cleaner environment**: No need to manage `pynvim`, `neovim` npm package, etc.

          ### BEST PRACTICE RECOMMENDATION

          ### MODERN NEOVIM (0.5+) WITH NATIVE LSP

          ```lua
          -- Disable what you don't use
          vim.g.loaded_ruby_provider = 0
          vim.g.loaded_perl_provider = 0
          -- Keep Python/Node if you use plugins that need them
          -- Check with :checkhealth to see what's actually needed
          ```

          ### MINIMAL SETUP (Lua-only plugins)

          - If using only Lua-based plugins (treesitter, telescope, LSP), you can **`safely disable all providers`**
          - Modern Neovim trend is moving away from provider-dependent plugins

    links:
      - Neovim Providers: https://neovim.io/doc/user/providers.html
  VSCODE Shortcuts:
    desc: VSCode Shortcuts
    tags: [vscode]
    links: [https://code.visualstudio.com/shortcuts/keyboard-shortcuts-macos.pdf]
    notes:
      - md: | #markdown
          ## vscode keybord shortcuts macos

          ### General

          | Shortcut | Action                     |
          | -------- | -------------------------- |
          | ⌘X       | Cut line (empty selection) |
          | ⇧⌘P      | Show Command Palette       |
          | ⌘P       | Quick Open, Go to File…    |
          | ⇧⌘N      | New window/instance        |
          | ⌘W       | Close window/instance      |
          | ⌘,       | User Settings              |
          | ⌘K ⌘S    | Keyboard Shortcuts         |

          ### Basic Editing

          | Shortcut         | Action                      |
          | ---------------- | --------------------------- |
          | ⌘X               | Cut line (empty selection)  |
          | ⌘C               | Copy line (empty selection) |
          | ⌥↓ / ⌥↑          | Move line down/up           |
          | ⇧⌥↓ / ⇧⌥↑        | Copy line down/up           |
          | ⇧⌘K              | Delete line                 |
          | ⌘Enter / ⇧⌘Enter | Insert line below/above     |
          | ⇧⌘\              | Jump to matching bracket    |
          | ⌘] / ⌘[          | Indent/outdent line         |
          | Home / End       | Go to beginning/end of line |
          | ⌘↑ / ⌘↓          | Go to beginning/end of file |
          | ⌃PgUp / ⌃PgDn    | Scroll line up/down         |
          | ⌘PgUp /⌘PgDn     | Scroll page up/down         |
          | ⌥⌘[ / ⌥⌘]        | Fold/unfold region          |
          | ⌘K ⌘[ / ⌘K ⌘]    | Fold/unfold all subregions  |
          | ⌘K ⌘0 / ⌘K ⌘J    | Fold/unfold all regions     |
          | ⌘K ⌘C            | Add line comment            |
          | ⌘K ⌘U            | Remove line comment         |
          | ⌘/               | Toggle line comment         |
          | ⇧⌥A              | Toggle block comment        |
          | ⌥Z               | Toggle word wrap            |

          ### Search and Replace

          | Shortcut | Action                                 |
          | -------- | -------------------------------------- |
          | ⌘F       | Find                                   |
          | ⌥⌘F      | Replace                                |
          | ⌘G / ⇧⌘G | Find next/previous                     |
          | ⌥Enter   | Select all occurrences of Find match   |
          | ⌘D       | Add selection to next Find match       |
          | ⌘K ⌘D    | Move last selection to next Find match |

          ### Rich Languages Editing

          | Shortcut   | Action                      |
          | ---------- | --------------------------- |
          | ⌃Space, ⌘I | Trigger suggestion          |
          | ⇧⌘Space    | Trigger parameter hints     |
          | ⇧⌥F        | Format document             |
          | ⌘K ⌘F      | Format selection            |
          | F12        | Go to Definition            |
          | ⌥F12       | Peek Definition             |
          | ⌘K F12     | Open Definition to the side |
          | ⌘.         | Quick Fix                   |
          | ⇧F12       | Show References             |
          | F2         | Rename Symbol               |
          | ⌘K ⌘X      | Trim trailing whitespace    |
          | ⌘K M       | Change file language        |

          ### Navigation

          | Shortcut | Action                               |
          | -------- | ------------------------------------ |
          | ⌘T       | Show all Symbols                     |
          | ⌃G       | Go to Line...                        |
          | ⌘P       | Go to File...                        |
          | ⇧⌘O      | Go to Symbol...                      |
          | ⇧⌘M      | Show Problems panel                  |
          | F8 / ⇧F8 | Go to next/previous error or warning |
          | ⌃⇧Tab    | Navigate editor group history        |
          | ⌃- / ⌃⇧- | Go back/forward                      |
          | ⌃⇧M      | Toggle Tab moves focus               |

          ### Editor Management

          | Shortcut        | Action                                |
          | --------------- | ------------------------------------- |
          | ⌘W              | Close editor                          |
          | ⌘K F            | Close folder                          |
          | ⌘\:             | Split editor                          |
          | ⌘1 / ⌘2 / ⌘3    | Focus into 1st, 2nd, 3rd editor group |
          | ⌘K ⌘← / ⌘K ⌘→   | Focus into previous/next editor group |
          | ⌘K ⇧⌘← / ⌘K ⇧⌘→ | Move editor left/right                |
          | ⌘K ← / ⌘K →     | Move active editor group              |

          ### File Management

          | Shortcut     | Action                                  |
          | ------------ | --------------------------------------- |
          | ⌘N           | New File                                |
          | ⌘O           | Open File...                            |
          | ⌘S           | Save                                    |
          | ⇧⌘S          | Save As...                              |
          | ⌥⌘S          | Save All                                |
          | ⌘W           | Close                                   |
          | ⌘K ⌘W        | Close All                               |
          | ⇧⌘T          | Reopen closed editor                    |
          | ⌘K Enter     | Keep preview mode editor open           |
          | ⌃Tab / ⌃⇧Tab | Open next / previous                    |
          | ⌘K P         | Copy path of active file                |
          | ⌘K R         | Reveal active file in Finder            |
          | ⌘K O         | Show active file in new window/instance |

          ### Display

          | Shortcut | Action                                     |
          | -------- | ------------------------------------------ |
          | ⌃⌘F      | Toggle full screen                         |
          | ⌥⌘0      | Toggle editor layout (horizontal/vertical) |
          | ⌘= / ⇧⌘- | Zoom in/out                                |
          | ⌘B       | Toggle Sidebar visibility                  |
          | ⇧⌘E      | Show Explorer / Toggle focus               |
          | ⇧⌘F      | Show Search                                |
          | ⌃⇧G      | Show Source Control                        |
          | ⇧⌘D      | Show Debug                                 |
          | ⇧⌘X      | Show Extensions                            |
          | ⇧⌘H      | Replace in files                           |
          | ⇧⌘J      | Toggle Search details                      |
          | ⇧⌘U      | Show Output panel                          |
          | ⇧⌘V      | Open Markdown preview                      |
          | ⌘K V     | Open Markdown preview to the side          |
          | ⌘K Z     | Zen Mode (Esc Esc to exit)                 |

          ### Integrated Terminal

          | Shortcut    | Action                   |
          | ----------- | ------------------------ |
          | ⌃`          | Show integrated terminal |
          | ⌃⇧`         | Create new terminal      |
          | ⌘C          | Copy selection           |
          | ⌘↑ / ↓      | Scroll up/down           |
          | PgUp / PgDn | Scroll page up/down      |
          | ⌘Home / End | Scroll to top/bottom     |
