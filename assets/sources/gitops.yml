cheats:
  What is GitOps?:
    desc: Set of practices that use Git repositories as the source of truth for declarative infrastructure and applications deployment
    tags: [bp, gitop]
    links:
      - https://gitops.tech
      - https://opengitops.dev
      - https://weave.works/technologies/gitops
    notes:
      - md: |
          ## Brings the developer experience of Git to infrastructure and operations

          > Operational framework that takes DevOps best practices used for application development, such as version control, collaboration, compliance, and CI/CD, and applies them to infrastructure automation.
          > It enables teams to manage complex systems at scale, with improved reliability, security, and developer productivity.
          > **If it's not in Git, it doesn't exist in production**

          ### KEY POINTS

          - **Declarative infrastructure**: describe desired state, not steps
          - **Version control everything**: full audit trail and rollback capability
          - **Automated deployment**: agents pull changes and apply them
          - **Improved reliability**: reproducible, testable deployments

          ### COMMON PRACTICES

          - Store Kubernetes manifests, Terraform configs, or Helm charts in Git
          - Use tools like ArgoCD, Flux, or Jenkins X to watch repos
          - Make all changes through Git (no manual kubectl apply)
          - Separate repos for app code vs. deployment configs
          - Use PR reviews as deployment gates

          ### KEY PRINCIPLES

          1. **Declarative Descriptions**: All infrastructure and application configurations are defined declaratively, typically using YAML or JSON files. This allows for version control and easy auditing of changes.
          2. **Version Control as the Source of Truth**: Git repositories serve as the single source of truth for the desired state of the system. Any changes to infrastructure or applications are made through pull requests (PRs) to the Git repository.
          3. **Automated Reconciliation**: An automated process continuously monitors the Git repository and the actual state of the system. If discrepancies are detected, the system automatically reconciles the actual state to match the desired state defined in Git.
          4. **Continuous Deployment**: Changes merged into the main branch of the Git repository trigger automated deployment processes, ensuring that updates are rolled out consistently and reliably.
          5. **Observability and Monitoring**: Comprehensive monitoring and logging are essential to track the state of the system, detect issues, and ensure compliance with the desired state.
          6. **Security and Compliance**: GitOps practices include robust security measures, such as access controls, encryption, and audit trails, to protect sensitive information and ensure compliance with regulatory requirements.

          ### BENEFITS

          - **Improved Collaboration**: Teams can collaborate more effectively using familiar Git workflows, such as branching and pull requests.
          - **Faster Recovery**: The ability to revert to previous states quickly in case of failures enhances system reliability.
          - **Increased Transparency**: All changes are documented in Git, providing a clear audit trail for compliance and troubleshooting.
          - **Scalability**: Automated processes enable teams to manage complex systems at scale without increasing operational overhead.
          - **Consistency**: Automated reconciliation ensures that environments remain consistent with the desired state defined in Git.

          ### TOOLS

          * [ArgoCD](https://argoproj.github.io/argo-cd/): A GitOps operator for Kubernetes with a web interface
          * [Flux](https://github.com/fluxcd/flux): The GitOps Kubernetes operator by the creators of GitOps - [Weaveworks](https://weave.works/technologies/gitops/)
          * [Gitkube](https://github.com/hasura/gitkube): A tool for building and deploying docker images on Kubernetes using `git push`
          * [JenkinsX](https://jenkins-x.io/): Continuous Delivery on Kubernetes with built-in GitOps
          * [Terragrunt](https://github.com/gruntwork-io/terragrunt): A wrapper for [Terraform](https://terraform.io) for keeping configurations DRY, and managing remote state
          * [WKSctl](https://github.com/weaveworks/wksctl): A tool for Kubernetes cluster configuration management based on GitOps principles
          * [Helm Operator](https://github.com/fluxcd/helm-operator): An operator for using GitOps on K8s with Helm
          * [werf](https://werf.io/): A CLI tool to build images and deploy them to Kubernetes via push-based approach
          * [Gimlet](https://gimlet.io): Gimlet is a command line tool and a dashboard that packages a set of conventions and matching workflows to manage a gitops developer platform effectively

          ### BLOG POSTS AND SOCIAL MEDIA

          * [An Inside Look at GitOps](https://devops.com/an-inside-look-at-gitops/)
          * [GitOps - Operations by Pull Request](https://weave.works/blog/gitops-operations-by-pull-request)
          * [GitOps: What, Why, and How.](https://reddit.com/r/kubernetes/comments/dc8bfd/gitops%5Fwhat%5Fwhy%5Fand%5Fhow/)
          * [What Is GitOps and Why It Might Be The Next Big Thing for DevOps](https://thenewstack.io/what-is-gitops-and-why-it-might-be-the-next-big-thing-for-devops/)
          * [What is GitOps Really?](https://weave.works/blog/what-is-gitops-really)
          * [GitOps mit Helm und Kubernetes (German)](https://doag.org/formes/pubfiles/11761447/06%5F2019-Java%5Faktuell-Bernd%5FStuebinger%5FFlorian%5FHeubeck-GitOps%5Fmit%5FHelm%5Fund%5FKubernetes.pdf)
          * [Awesome-GitOps](https://github.com/weaveworks/awesome-gitops)

          ### TALKS

          * [GitOps - Operations by Pull Request \[B\] - Alexis Richardson, Weaveworks & William Denniss, Google](https://youtube.com/watch?v=BSqE2RqctNs)
          * [Tutorial: Hands-on Gitops - Brice Fernandes, Weaveworks](https://youtube.com/watch?v=0SFTaAuOzsI)
          * [What is GitOps? Next level delivery with Flux & Kubernetes by Rafał Lewandowski](https://youtube.com/watch?v=5zt-jzKHwX8)

          ### CONCLUSION

          All system configuration lives in Git repos. Changes happen via pull requests. Automated agents continuously sync the live environment to match what's in Git.
  transcrypt -c aes-256-cbc -p 'password':
    desc: Initialize transcrypt in a repository with AES-256-CBC cipher
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt -c aes-256-ctr -p 'password':
    desc: Initialize transcrypt in a repository with AES-256-CTR cipher
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --list-ciphers:
    desc: Display available ciphers for transcrypt
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --display:
    desc: Show current repository's settings and files under encryption
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --add-config path/to/file:
    desc: Add new file to be encrypted without re-encrypting existing files
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: |
          # Add multiple files
          transcrypt --add-config file1 file2
  transcrypt --rekey:
    desc: Re-encrypt all encrypted files with a new password
    tags: [gitop, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: |
          # First flush old credentials
          transcrypt --flush-credentials

          # Then rekey with new password
          transcrypt --rekey
  transcrypt --import path/to/keyfile:
    desc: Import encryption configuration from a file
    tags: [gitop, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --export-gpg recipient@example.com:
    desc: Export credentials encrypted with GPG for secure sharing
    tags: [gitop, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --uninstall:
    desc: Remove transcrypt configuration from repository
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: |
          # Decrypt files first
          transcrypt --flush-credentials
          transcrypt --uninstall
  transcrypt --show-raw file:
    desc: Display raw encrypted contents of a file
    tags: [gitop, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --verify:
    desc: Verify repository configuration and file consistency
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: |
          # Check specific files
          transcrypt --verify path/to/file
  age --decrypt --identity ~/.config/age/keys.txt -o /tmp/secret.out.txt /tmp/secret.txt.age:
