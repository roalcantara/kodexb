  https://blog.gitguardian.com/authentication-and-authorization:
    desc: Authentication (who you are) and Authorization (what you can do)
    tags: [bp]
    notes:
      - md: |
          > API security requires proper authentication (who you are) and authorization (what you can do) with secure implementation practices

          ### Core Authentication Methods

            - **Basic Auth**: Username/password in headers - only use with HTTPS
            - **API Keys**: Unique identifiers - transmit via Authorization headers, not URLs
            - **JWT**: Stateless tokens - eliminates database lookups, perfect for scaling
            - **OAuth 2.0**: Third-party access without sharing credentials - industry standard
            - **OpenID Connect**: OAuth 2.0 + authentication layer

            ### Authorization Models

            - **RBAC**: Role-based permissions - simple, scalable for most organizations
            - **ABAC**: Attribute-based control - fine-grained but complex
            - **PBAC**: Policy-based decisions - dynamic, context-aware access

            ### Security Essentials

            - **Always use HTTPS/TLS** - non-negotiable for any authentication method
            - **Never store credentials in plaintext** - hash, salt, use secure storage
            - **Follow least privilege** - minimal permissions only
            - **Rotate credentials regularly** - API keys and passwords
            - **Validate all inputs** - prevent injection attacks
            - **Implement rate limiting** - prevent abuse and DoS attacks

            ### Common Mistakes to Avoid

            - **API keys in URLs** - they get logged everywhere
            - **Custom auth schemes** - use established libraries instead
            - **Hardcoded credentials** - use environment variables or secret managers
            - **Default allow policies** - start with deny, explicitly grant access

            ### Bottom Line

            - **Choose methods based on your specific needs**, always encrypt communications, and follow established security practices rather than reinventing solutions.
