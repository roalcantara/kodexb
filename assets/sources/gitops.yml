    tags: [gitop, sop]

commands:
  Using Transcrypt to ecrypt files within git repositories:
    desc: Transparently encrypt files within a git repository
    tags: [gitop, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - md: |
          ## Features
          - Actually encrypts files in the repository
          - Uses OpenSSL to encrypt/decrypt files
          - Files remain encrypted in the repository but are automatically decrypted when checked out
          - Allows selective encryption of specific files
          - Best for: Storing sensitive files that need to be in version control
      - sh: |
          #!/bin/bash

          # Install transcrypt
          brew install transcrypt
      - sh: |
          #!/bin/bash

          ## QUICKSTART

          # 1. Initialize an Unconfigured Repository
          cd /tmp/demo && git init && transcrypt

          # 2. Designate a File to be Encrypted
          $ transcrypt --add sensitive_file
          $ git add .gitattributes sensitive_file
          $ git commit -m 'Add encrypted version of a sensitive file'

          # Encrypt GH_TOKEN and other credentials
          transcrypt -p 'your-password'

          # Encrypt a file
          transcrypt --add-config config/secrets.yml

          # Add to .gitattributes
          .config/credentials filter=crypt diff=crypt

          # Configure which files to encrypt
          echo "private-config.conf filter=crypt diff=crypt" >> .gitattributes
          echo ".env filter=crypt diff=crypt" >> .gitattributes
      - sh: |
          #!/bin/bash

          # Install transcrypt
          brew install transcrypt

          # Initialize in your repository
          cd ~/.dots

          # Encrypt GH_TOKEN and other credentials
          transcrypt -c aes-256-cbc -p 'your-password'

          # Encrypt a file
          transcrypt --add-config config/secrets.yml

          # Add to .gitattributes
          .config/credentials filter=crypt diff=crypt

          # Configure which files to encrypt
          echo "private-config.conf filter=crypt diff=crypt" >> .gitattributes
          echo ".env filter=crypt diff=crypt" >> .gitattributes
      - sh: |
          #!/bin/bash

          ## CONTEXTS
          ## =====================================================================
          ## Context names let you encrypt some files with different passwords for
          ## a different audience, such as super-users. The 'default' context
          ## applies unless you set a context name. Add a context by
          ## reinitialising transcrypt with a context name then add a pattern with
          ## crypt-<CONTEXTNAME> attributes to .gitattributes.
          ## =====================================================================
          ##
          ## To encrypt a file _top-secret in a "super" context
          ##

          # 0. Initialize an Unconfigured Repository
          $ git init
          $ transcrypt

          # 1. Initialise a new "super" context, and set a different password
          $ transcrypt --context=super

          # 2. Add a pattern to .gitattributes with "crypt-super" values
          $ transcrypt --context=super --add=top-secret

          # 3. Add and commit your top-secret and .gitattribute files
          $ git add .gitattributes top-secret
          $ git commit -m "Add top secret file for super-users only"

          # 4. Listing the Currently Encrypted Files
          $ transcrypt --list

          # 5. List all contexts
          $ transcrypt --list-contexts

          # 6. Display the cipher and password for the "super" context
          $ transcrypt --context=super --display
  Using SOPS/AGE to encrypt sensitive data in YAML files and store them in git:
    desc: SOPS (Secrets OPerationS) is an editor of encrypted files that supports YAML, JSON, ENV, INI and BINARY formats and encrypts with AWS KMS, GCP KMS, Azure Key Vault, PGP and age.
    tags: [gitop]
    links:
      - SOPS: https://github.com/getsops/sops
      - AGE: https://github.com/FiloSottile/age
      - Git filter: https://git-scm.com/docs/gitattributes
      - Protect secrets in Git with the clean/smudge filter: https://developers.redhat.com/articles/2022/02/02/protect-secrets-git-cleansmudge-filter
      - Using SOPS with Age and Git like a Pro: https://devops.datenkollektiv.de/using-sops-with-age-and-git-like-a-pro.html
    notes:
      - md: |
          # ONE SENTENCE SUMMARY:
          AGI and SOPS tools enable secure encryption of sensitive values in YAML files for safe storage in Git repositories.

          # MAIN POINTS:
          1. AGI encrypts files to binary format using public/private key pairs but results in non-human-readable files.
          2. SOPS works with AGI to selectively encrypt only values in files while keeping keys readable.
          3. A SOPS configuration file defines encryption rules based on file paths and which keys should be encrypted.
          4. Encrypted YAML files maintain their structure and readability while securing sensitive information.
          5. Naming conventions help prevent accidentally committing unencrypted secrets to Git repositories.
          6. Creating automation scripts simplifies batch encryption/decryption of multiple secret files.
          7. The presenter adds .secret.yaml files to .gitignore while only committing encrypted .secret.sops.yaml versions.
          8. SOPS is not idempotent, so re-encrypting the same file creates different encrypted outputs.
          9. Automation scripts compare file contents before encrypting to avoid unnecessary Git changes.
          10. Taskfile integration allows running encryption/decryption scripts from anywhere in the repository.

          # TAKEAWAYS:
          1. Use AGI and SOPS together to securely store infrastructure-as-code secrets in Git repositories.
          2. Establish consistent naming conventions to differentiate between encrypted and unencrypted files.
          3. Add plain secret files to .gitignore to prevent accidentally committing sensitive information.
          4. Automate secret management with scripts that handle batch encryption and decryption.
          5. SOPS provides a better alternative to external secret stores when simplicity is preferred.
      - md: |
          ### SOPS

          ```bash
          # MacOS
          brew install sops

          # Debian/Ubuntu
          sudo apt install sops

          # Fedora
          sudo dnf install sops

          # Arch Linux
          sudo pacman -S sops
          ```
      - sh: |
          #!/bin/bash

          # Setup SOPS + Git Filters for Automatic Encryption/Decryption
          # Run this from your dotfiles repository root

          set -e

          echo "Setting up SOPS git filters..."

          # Configure git filters
          echo "Configuring git clean filter (encrypt on commit)..."
          git config filter.sops.clean 'sops --encrypt --input-type dotenv --output-type dotenv /dev/stdin'

          echo "Configuring git smudge filter (decrypt on checkout)..."
          git config filter.sops.smudge 'sops decrypt --input-type dotenv --output-type dotenv /dev/stdin'

          echo "Configuring diff filter (show decrypted content in diffs)..."
          git config diff.sops.textconv 'sops decrypt --input-type dotenv --output-type dotenv'

          # Setup .gitattributes
          echo "Setting up .gitattributes..."
          if ! grep -q "\.config/\.env filter=sops" .gitattributes 2>/dev/null; then
              echo ".config/.env filter=sops diff=sops" >> .gitattributes
              echo "Added .config/.env to .gitattributes"
          else
              echo ".gitattributes already configured"
          fi

          # Check if .env exists and handle initial encryption
          if [ -f ".config/.env" ]; then
              echo "Found .config/.env file"

              # Check if file is already encrypted
              if head -1 .config/.env | grep -q "sops:"; then
                  echo ".env file appears to be already encrypted"
                  echo "Decrypting for local use..."
                  sops decrypt --in-place --input-type dotenv --output-type dotenv .config/.env
              else
                  echo ".env file is currently unencrypted"
                  echo "Encrypting and committing the encrypted version..."

                  # Backup current file
                  cp .config/.env .config/.env.backup

                  # Encrypt for git
                  sops --encrypt --in-place --input-type dotenv --output-type dotenv .config/.env

                  # Add and commit encrypted version
                  git add .config/.env .gitattributes
                  git commit -m "Add encrypted .env file with SOPS git filters"

                  # Restore decrypted version for local use
                  cp .config/.env.backup .config/.env
                  rm .config/.env.backup

                  echo "Encrypted version committed, decrypted version restored for local use"
              fi
          else
              echo "No .config/.env file found - you can create one normally and it will be auto-encrypted on commit"
          fi

          echo ""
          echo "✅ SOPS git filters setup complete!"
          echo ""
          echo "Test your setup:"
          echo "1. Edit .config/.env and add a test variable"
          echo "2. Run 'git status' - should show .env as modified"
          echo "3. Run 'git diff .config/.env' - should show decrypted diff"
          echo "4. Run 'git add .config/.env && git show :0:.config/.env' - should show encrypted content"
          echo ""
          echo "The file will now be automatically encrypted on commit and decrypted on checkout!"
  brew install transcrypt:
    desc: Install transcrypt
    tags: [gitop]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --flush-credentials:
    desc: Remove locally cached encryption credentials
    tags: [gitop, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  brew install age:
    desc: Install AGE
    tags: [gitop]
    links: [https://age-encryption.org]
  mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt:
    desc: Generate a new AGE key pair (private + public) and save them to ~/.config/age/
    tags: [gitop]
    links: [https://age-encryption.org]
  chmod 600 ~/.config/age/keys.txt && echo ".config/age/keys.txt" >> ~/.config/.gitignore:
    desc: Secure the IDENTITY (Private Key) and ensure it is not backed up to git
    tags: [gitop]
  mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt && chmod 600 ~/.config/age/keys.txt && echo ".config/age/keys.txt" >> ~/.config/.gitignore:
    desc: Generate a new AGE key pair (private + public), save them to ~/.config/age/, secure the IDENTITY (Private Key) and ensure it is not backed up to git
    tags: [gitop]
  grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1:
    desc: Extract the recipient from ~/.config/age/keys.txt
    tags: [gitop]
  age -r $(grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1) -o /tmp/secret.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt for yourself (using your own RECIPIENT)
    tags: [gitop]
  age -r $(cat ~/.config/age/recipient.txt) -o /tmp/secret.recipients.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt for any recipient (using the recipient file)
    tags: [gitop]
  age -p -o /tmp/secret.passbased.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt using PASSWORD (symmetric encryption)
    tags: [gitop, age]
  tar czf - /opt/app | age -R ~/.config/age/recipients.txt > /tmp/app.tar.gz.age:
    desc: Encrypt a whole directory (e.g., /opt/app) using multiple RECIPIENTS listed in a file
    tags: [gitop, age]
  age -a -R ~/.config/age/recipients.txt /tmp/secret.txt > /tmp/secret.txt.age.asc:
    desc: Use ASCII armor to protect /tmp/secret.txt.age safe for version control
    tags: [gitop]
  age-keygen -y ~/.config/age/keys.txt > ~/.config/age/recipient.txt:
    desc: Extract (REGENERATE) the recipient from ~/.config/age/keys.txt and save it to ~/.config/age/recipient.txt
    tags: [gitop]
  brew install sops:
    desc: Install SOPS
    tags: [gitop]
  sops --encrypt --in-place --age-recipient <recipient-id> <file>:
    desc: Encrypt a file with AGE
    tags: [gitop, sop]
  sops --decrypt --in-place <file>:
    desc: Decrypt a file with AGE
    tags: [gitop, sop]
