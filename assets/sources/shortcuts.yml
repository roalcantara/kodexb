          ## EDITOR

          ```yaml
          shortcuts:
            # Selection
            "⌘ a": ▤ Select all
            "⌘ l": ▤ Select the whole current line
            "⌘ r": ▤ Select all occurrences of the term under the cursor in the file
            "⇧ ←": ▤ Shirnk or Expand selection 1 character to the left
            "⇧ ↓": ▤ Shirnk or Expand selection down one line on the same column
            "⇧ →": ▤ Shirnk or Expand selection 1 character to the right
            "⇧ ↑": ▤ Shirnk or Expand selection up one line on the same column
            "⌘ ⇧ ←": ▤ Shirnk or Expand selection to start of the first word on the left
            "⌘ ⇧ →": ▤ Shirnk or Expand selection to end of the last word on the right
            "⇧ ^ ←": ▤ Expand selection and move the cursor to end of next word on the left
            "⇧ ^ →": ▤ Expand selection and move the cursor to end of next word on the right
            "⇧ ⎇ ←": ▤ Shirnk selection to start of 1 word on the left
            "⇧ ⎇ →": ▤ Expand selection to end of 1 word on the right
            "⌘ ⎇ ↑": ▤ Duplicate current line up
            "⌘ ⎇ ↓": ▤ Duplicate current line down
            "⇧ ⇥": ▤ Move backwards 2 spaces (tab) the selection or the cursor
            "⇥": ▤ Move forward 2 spaces (tab) the selection or the cursor
            # Edit/MultiCursors
            "⇧ ^ ↑": ▤ Start multi-cursor selection up
            "⇧ ^ ↓": ▤ Start multi-cursor selection down
            # Folding
            "⌘ ⎇ [": ▤ Fold
            "⌘ ⇧ ⎇ [": ▤ Fold All
            "⌘ ⎇ ]": ▤ Unfold
            "⌘ ⇧ ⎇ ]": ▤ Unfold All
            # Files
            "⌘ n": ▤ Create new file/folder
            "⌘ s": ▤ Save current file
            "⌘ ⇧ s": ▤ Save File as..
            "⌘ ⇧ ⎇ s": ▤ Save without formatting
            "⌘ ⎇ f": ▤ Format document
            # Find and open files
            "⌘ p": ▤ Find and open project files by name
            "⌘ f": ▤ Find/highlight the term in current file
            "⌘ ⇧ t": ▤ Open last visited file
            "⌘ ⇧ f": ▤ Find in all files
            "⌘ ⇧ r": ▤ Find and Replace in current file
            "⌘ ⇧ ^ r": ▤ Find/Replace (Rg) in all project files
            "^ g": ▤ Go to line
            # Edit/Movements
            "⌘ ←": ▤ Move cursor to the start of the first word in the line
            "⌘ →": ▤ Move cursor to the end of the last word in the line
            "⌘ ↑": ▤ Move cursor to the top of the file
            "⌘ ↓": ▤ Move cursor to the bottom of the file
            "^ ←": ▤ Move cursor to the end of the next word
            "^ →": ▤ Move cursor to the beginning of the previous word
            "⎇ ←": ▤ Move cursor to end of the previous word
            "⎇ →": ▤ Move cursor to the beginning of the next word
            "⎇ ↑": ▤ Move current line/selection up
            "⎇ ↓": ▤ Move current line/selection down
            # Windows/Split/Tabs/Buffers
            "⌘ ⎇ v": ▤ Split new editor vertically
            "⌘ ⎇ h": ▤ Split new editor horizontally
            "⌘ ^ →": ▤ Move focused window/file to right
            "⌘ ^ ←": ▤ Move focused window/file to left
            "⌘ b": ▤ Pick tabs/buffers
            "^ ⇥": ▤ Cycle tabs/buffers clockwise
            "⇧ ^ ⇥": ▤ Cycle tabs/buffers counterclockwise
            # Edit/Actions
            "⌘ .": ▤ Show Quick Fixes
            "⌘ /": ▤ Toggle Comment
            "⇧ ⎇ ↑": ▤ Duplicate Line Up
            "⇧ ⎇ ↓": ▤ Duplicate Line Down
            "⌘ ^ s": ▤ Pick Snippet from list for the current file
            "⌘ ^ t": ▤ Run last task
            "⌘ ⇧ .": ▤ Auto fix
            "⌘ ⎇ ⏎": ▤ Apply Quick Fix
            "⌘ ⇧ p": ▤ Run Command
            "⌘ ⇧ o": ▤ Go To Symbol
            "⇧ ^ r": ▤ Refactor
            "⌘ ^ r": ▤ Show references
            "⌘ h": ▤ Toggle Hover Docs for the current symbol
            # Terminal
            "^ l": ⊜ Clear
            "⌘ t": ⊜ Toggle
            # Treeview
            "⌦": ┇ Delete selected item
            "⏎": ┇ Open selected item
            "←": ┇ Expand selected item
            "→": ┇ Collapse selected item
          ```

