      - md: | #markdown
          # Kodexb Keyboard Shortcuts Reference

          kodexb uses platform-aware keyboard shortcuts to match native app conventions:

          - **macOS**: `Cmd+...` (⌘)
          - **Linux/Windows**: `Ctrl+...`

          This guide uses `Cmd` notation, but substitute `Ctrl` on Linux/Windows.

          ## Quick Reference

          | Action          | Shortcut       | Works From |
          | --------------- | -------------- | ---------- |
          | Focus search    | `Cmd+F` or `/` | Any state  |
          | Open filters    | `Cmd+/`        | Any state  |
          | Clear filters   | `Cmd+Shift+/`  | Any state  |
          | Command palette | `Cmd+P`        | Any state  |
          | Help screen     | `Cmd+?`        | Any state  |
          | Quit            | `Cmd+Q`        | Any state  |
          | Copy content    | `Cmd+C`        | Any state  |
          | Open/Execute    | `Cmd+O`        | Any state  |
          | Action menu     | `Cmd+K`        | Any state  |

          ## Panel Navigation (Shift+Arrows)

          Use **Shift+Arrow keys** to navigate between panels without opening/closing them:

          | From    | Key       | To      | Notes                            |
          | ------- | --------- | ------- | -------------------------------- |
          | Results | `Shift+↑` | Search  | Focus search bar                 |
          | Results | `Shift+→` | Detail  | Focus detail (if open)           |
          | Search  | `Shift+↓` | Results | Focus results list               |
          | Search  | `Shift+→` | Detail  | Focus detail (if open)           |
          | Detail  | `Shift+←` | Results | Focus results (keep detail open) |
          | Detail  | `Shift+↑` | Search  | Focus search bar                 |

          **Quick Access:**
          - `Cmd+L` — Focus search from anywhere (Chrome-style)

          **Traditional Navigation:**
          - `→` (from Results) — Open detail pane and focus it
          - `←` (from Detail) — Close detail pane and return to results
          - `Enter` (from Results) — Open full-screen modal

          ## By View State

          ### List-Only View (Default)

          The default lightweight view showing search and results.

          **Navigation:**
          - `↑` / `k` — Move selection up
          - `↓` / `j` — Move selection down
          - `Page Up` — Scroll up one page
          - `Page Down` — Scroll down one page
          - `Home` / `g` — Jump to first entry
          - `End` / `G` — Jump to last entry

          **View Transitions:**
          - `→` (Right Arrow) — Load detail pane (transitions to Split-Pane)
          - `Enter` — Open full-screen modal (transitions to Modal)

          **Search & Filtering:**
          - `Cmd+F` or `/` — Focus search input
          - `Cmd+/` — Open unified filter modal (Type + Tags)
          - `Cmd+Shift+/` — Clear all active filters
          - `Esc` — Clear search input (when focused)

          **Actions:**
          - `Cmd+C` — Copy entry content to clipboard
            - Bookmark: Copies URL
            - Command: Copies command text
            - Cheat: Copies cheat content
            - Task: Copies task title
            - ✓ Shows confirmation toast
          - `Cmd+O` — Open URL or execute command
            - Bookmark: Opens in default browser
            - Command: Executes in shell
            - Task: Shows hint (no URL to open)
            - ✓ Shows confirmation toast
          - `Cmd+K` — Show action menu for selected entry

          **Task-specific (when a Task is selected):**
          - `Cmd+Alt+Enter` — Cycle task status (pending → doing → done → cancelled → pending)
          - `Cmd+Alt+Up` — Cycle priority up (low → mid → high → urgent)
          - `Cmd+Alt+Down` — Cycle priority down (urgent → high → mid → low)
          - Command palette: "Edit Task", "New Task" (CLI or YAML for full create/edit)

          **Global:**
          - `Cmd+P` — Open command palette (action discovery)
          - `Cmd+?` — Toggle help screen
          - `Cmd+Q` — Quit application

          **Inline Feedback:**
          - ✓ Success toasts (green, 2s)
          - ✗ Error toasts (red, 4s)
          - ℹ Info toasts (blue, 2s)

          ---

          ### Split-Pane View (Detail Loaded)

          Results list on left, detail pane on right (50/50 split).

          **All List-Only shortcuts work, plus:**

          **Pane Navigation:**
          - `←` (Left Arrow) — Close detail pane (back to List-Only)
            - Cache is preserved for instant reaccess
          - `Tab` — Switch focus between list and detail pane
          - `Shift+Tab` — Switch focus (reverse)
          - `Shift+←` — Focus results pane (keep detail open)
          - `Shift+→` — Focus detail pane (from results)
          - `Shift+↑` — Focus search bar (from results or detail)
          - `Cmd+L` — Focus search bar (Chrome-style, from anywhere)

          **Detail Pane Scrolling (when focused):**
          - `↑` / `k` — Scroll detail up
          - `↓` / `j` — Scroll detail down
          - `Page Up` — Scroll detail up one page
          - `Page Down` — Scroll detail down one page
          - `Home` / `g` — Jump to top of detail
          - `End` / `G` — Jump to bottom of detail

          **View Transitions:**
          - `Enter` — Expand to full-screen modal
          - `←` — Close detail pane (back to List-Only)

          **Notes:**
          - Detail is cached after first load (instant reaccess)
          - Navigate list while viewing details
          - Cache preserved when closing pane
          - Cache cleared when search/filter changes

          ---

          ### Modal View (Full-Screen Detail)

          Centered full-screen modal with maximum focus.

          **Modal Navigation:**
          - `↑` / `k` — Scroll up
          - `↓` / `j` — Scroll down
          - `Page Up` — Scroll up one page
          - `Page Down` — Scroll down one page
          - `Home` / `g` — Jump to top
          - `End` / `G` — Jump to bottom

          **Close Modal:**
          - `Esc` — Close modal (back to previous state)
          - `←` (Left Arrow) — Close modal
          - `Enter` — Close modal
          - `q` — Close modal

          **Actions (work in modal):**
          - `Cmd+C` — Copy entry content
          - `Cmd+O` — Open URL or execute command

          **Notes:**
          - Modal uses cached detail (instant display)
          - Returns to previous view state on close
          - Markdown fully rendered with Glamour

          ---

          ## Filter Modal

          Unified modal for Type and Tag filtering (opened with `Cmd+/`).

          **Navigation:**
          - `↑` / `k` — Move selection up
          - `↓` / `j` — Move selection down
          - `/` — Focus search box and filter items (fuzzy match across types and tags)

          **Selection:**
          - `Space` / `Enter` — Toggle selected type/tag
          - `↑↓` — Navigate through filtered items

          **Applying Filters:**
          - `Enter` — Apply selected filters and close modal
            - Results update immediately
            - Detail cache cleared
            - Returns to List-Only view
            - Badge shows active filter count
          - `Shift+Enter` — Clear all filters
          - `Esc` — Cancel and close modal (no changes)

          **Filter Logic:**
          - **Types**: AND logic (must match selected type)
          - **Tags**: OR logic (matches ANY selected tag)
          - **Combined**: Type AND (Tag1 OR Tag2 OR ...)

          ## Command Palette

          Action discovery and quick access (opened with `Cmd+P`).

          **Navigation:**
          - `↑` / `k` — Move selection up
          - `↓` / `j` — Move selection down
          - Type to search/filter commands

          **Execution:**
          - `Enter` — Execute selected command
          - `Esc` — Close palette

          **Categories:**
          - **Recent**: Recently used actions
          - **Search/Filter**: Search and filtering commands
          - **Navigation**: View state transitions
          - **Global**: Application-wide actions

          **Each command shows:**
          - Name and description
          - Keyboard shortcut (if available)
          - Category

          ---

          ## Help Screen

          Comprehensive help overlay (opened with `Cmd+?`).

          **Navigation:**
          - `↑` / `k` — Scroll up
          - `↓` / `j` — Scroll down
          - `Page Up/Down` — Scroll by page

          **Close:**
          - `Esc` — Close help screen
          - `Cmd+?` — Toggle help screen
          - `q` — Close help screen

          **Content:**
          - All keyboard shortcuts organized by category
          - Platform-specific modifiers highlighted
          - Examples for each shortcut
          - Tips and tricks

          ---

          ## Platform-Specific Notes

          ### macOS
          - Uses `Cmd` (⌘) as primary modifier
          - `Cmd+Q` quits (standard macOS behavior)
          - `Cmd+C`, `Cmd+V` work as expected
          - `Cmd+P` opens command palette (like Raycast!)

          ### Linux/Windows
          - Uses `Ctrl` as primary modifier
          - `Ctrl+Q` quits
          - `Ctrl+C` copies (not interrupt)
          - `Ctrl+P` opens command palette

          ### Terminal Width Considerations
          - **Width < 120 chars**: Split-pane disabled, stays in List-Only
          - **Width ≥ 120 chars**: Split-pane available (50/50 split)
          - Layout adjusts automatically on resize

          ---

          ## Tips for Raycast Users

          If you're coming from Raycast, these shortcuts will feel familiar:

          | Raycast | kodexb  | Action            |
          | ------- | ------- | ----------------- |
          | `Cmd+K` | `Cmd+K` | Action menu       |
          | `Cmd+P` | `Cmd+P` | Command palette   |
          | `Cmd+,` | `Cmd+/` | Filters (adapted) |
          | `Enter` | `Enter` | Open/Execute      |
          | `Cmd+C` | `Cmd+C` | Copy              |
          | `Cmd+Q` | `Cmd+Q` | Quit              |

          **Muscle memory preserved!** 🎉

          ---

          ## Customizing Keybindings

          You can customize keybindings in your config file:

          ```yaml
          keybindings:
            search: "/"
            filter: "ctrl+/"
            quit: "q"
            help: "?"
            copy: "ctrl+c"
            open: "ctrl+o"
            palette: "ctrl+p"
          ```

          See [CONFIGURATION.md](CONFIGURATION.md) for details.

          ---

          ## Troubleshooting

          **Shortcuts not working?**
          1. Check if your terminal supports the key combination
          2. Some terminals intercept certain shortcuts (e.g., `Ctrl+S`)
          3. Try alternative shortcuts (e.g., `/` instead of `Cmd+F`)
          4. Check config file for custom keybindings

          **Platform detection wrong?**
          - kodexb auto-detects platform via `runtime.GOOS`
          - Override in config if needed (not recommended)

          **Terminal too narrow for split-pane?**
          - Split-pane requires width ≥ 120 characters
          - Resize terminal or use List-Only + Modal views
