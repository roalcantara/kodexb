            "R⌘ ⏎": "Swap focused window with main"
            "R⌘ ⇧ ←": "Swap with previous window"
            "R⌘ ⇧ →": "Swap with next window"
            "R⌘ ⇧ ↑": "Focus main window"
            "R⌘ ⇧ ↓": "Reevaluate windows"
            "R⌘ ⇧ ,": "Throw focused window to space left"
            "R⌘ ⇧ .": "Throw focused window to space right"
            "R⌘ ⇧ [": "Move focused window to previous screen"
            "R⌘ ⇧ ]": "Move focused window to next screen"
          ```
  Ghostty Keybinds > `unconsumed:` and `global:`:
    desc: How `unconsumed:` and `global:` works?
    tags: [ shortcuts, ghostty ]
    links:
      - Trigger Prefixes: https://ghostty.org/docs/config/keybind
    notes:
      - md: |
          # Ghostty Keybinds

          ## HOW THEY WORK

          ### unconsumed:

          - Ghostty runs the action and still forwards the keypress (its encoded input, if any) to the program running in the terminal. 
          - Use it when you want a "terminal feature" without breaking the app's own key handling.

          #### WHEN TO USE `unconsumed`

          - When Ghostty is focused and you want "do X" while still letting the terminal app also get the keypress (or not interfering with text input).

          #### WHAT `UNCONSUMED:` DOES (AND WHAT IT DOESN'T)

          - `unconsumed:` only affects whether Ghostty consumes the key event when it has a keybind match. 
          - It does not prevent the terminal app from seeing injected text: bytes, because those bytes are already "typed input".

          ### PRACTICAL EXAMPLES

          #### 1. `unconsumed`: _(good use)_

          - **WHEN:** You want Reload config but also want the app to still receive the chord (so you don't "steal" it from a TUI that uses it):

              ```yaml
              keybind = unconsumed:super+ctrl+alt+comma=reload_config
              ```

          - **WHAT HAPPENS:** Ghostty reloads config, and if the keypress has an encoding that would normally reach the app, it can still be forwarded.

          #### 2. `unconsumed`: _(good use)_

          - **WHEN:** You want Toggle Inspector but don't want to break apps that might use that chord:

              ```yaml
              keybind = unconsumed:super+ctrl+alt+i=inspector:toggle
              ```

          - **WHAT HAPPENS:** Inspector toggles, and the keypress is not swallowed by Ghostty.

          ### global:unconsumed:

          - global: makes the keybind work even when Ghostty is not focused and implies all:. 
          - Per Ghostty docs, global: keybinds always consume input regardless of unconsumed:, because they're not tied to a specific surface to encode/send input.
          - So in practice: global:unconsumed: behaves like global: (system-wide hotkey), and the unconsumed: part is effectively ignored.

          ### WHEN TO USE `global`

          - Use global: when you want a system-wide hotkey to control Ghostty from anywhere. Don't rely on unconsumed: with it—assume it will be consumed.

          ### WHEN YOU PROBABLY WANT `global` REMOVED ("unexpected behavior"):

          - **System-wide hotkey:** triggers even when Ghostty isn't focused (macOS Accessibility).
          - **It implies `all:`:** targets all Ghostty surfaces when applicable.
          - **`unconsumed:`** is ignored for `global:` binds (Ghostty docs), so `global:unconsumed:` is misleading.
          - **Conflicts:** can steal chords from other apps (browsers, IDEs, window managers), and can behave differently depending on focus/accessibility state.

          ### PRACTICAL EXAMPLES

          #### 1. `global:unconsumed`: _(what it really does)_

          - **WHEN:** You want a system-wide key to toggle Ghostty's quick terminal from any app:

              ```yaml
              keybind = global:unconsumed:super+ctrl+alt+t=toggle_quick_terminal
              ```

          - **WHAT HAPPENS:** Effective behavior: same as global:super+ctrl+alt+t=toggle_quick_terminal. It will be global and consumed.

          #### 2. `global:unconsumed`: _(what it really does)_

          - **WHEN:** You want a system-wide key to create a new Ghostty window:

              ```yaml
              keybind = global:unconsumed:super+ctrl+alt+n=new_window
              ```

          - **WHAT HAPPENS:** Effective behavior: same as global:super+ctrl+alt+n=new_window. Global + consumed.
  Ghostty and Amethyst Shortcuts (and Mental Model):
    desc: How to manage your terminal and windows
    tags: [ shortcuts, ghostty, amethyst, twm ]
    notes:
      - md: |
          ## TABLE OF SHORTCUTS

          ### GHOSTTY

          | Keys | Action | Focused | Ghostty action | Notes |
          | :--: | ------ | :-----: | ------------- | ----- |
          | `F3 ←` | Focus pane left | Pane left | `goto_split:left` | F3 is a Karabiner layer key; Ghostty actually receives `ctrl+alt+←`. |
          | `F3 →` | Focus pane right | Pane right | `goto_split:right` |  |
          | `F3 ↑` | Focus pane up | Pane up | `goto_split:up` |  |
          | `F3 ↓` | Focus pane down | Pane down | `goto_split:down` |  |
          | `F3 ⇧ ←` | Split pane left | Pane left | `new_split:left` |  |
          | `F3 ⇧ →` | Split pane right | Pane right | `new_split:right` |  |
          | `F3 ⇧ ↑` | Split pane up | Pane up | `new_split:up` |  |
          | `F3 ⇧ ↓` | Split pane down | Pane down | `new_split:down` |  |
          | `F3 [` | Focus previous pane | Pane prev | `goto_split:previous` | Cycles in Ghostty's split order. |
          | `F3 ]` | Focus next pane | Pane next | `goto_split:next` |  |
          | `F3 w` | Close current pane | Previous pane | `close_surface` |  |
          | `F3 n` | New window | New window | `new_window` |  |
          | `F3 ⏎` | Toggle fullscreen | — | `toggle_fullscreen` |  |
          | `F3 i` | Toggle inspector | — | `inspector:toggle` |  |
          | `F3 ,` | Reload config | — | `reload_config` |  |
          | `F3 t` | Toggle quick terminal | — | `toggle_quick_terminal` |  |
          | `F3 p` | Toggle command palette | — | `toggle_command_palette` |  |
          | `F3 q` | Quit Ghostty (all windows) | — | `quit` | This replaces `⌘Q` so it stays inside the F3 layer. |

          ### AMETHYST

          #### CONCEPTS

            | **CONCEPT** | **DESCRIPTION** | **NOTES** |
            | :--: | :--: | :--: |
            | **MAC** | may have 1-N SCREENS. | |
            | **SCREEN** | may have 1-N `SPACES` | Each screen has its own space set |
            | **WINDOW** | is an app window (App) assigned to a Space. | It may be TILED or FLOATING |
            | **SPACE** | has 0-N WINDOWS | Each Space spans all screens |
            | **LAYOUT** | arranges tiled windows on a screen/space | Tall/Wide/Fullscreen/Column/etc |
            | **FOCUS** | receives keyboard input | Commands act on the focused window |
            | **SWAP** | when two windows are swapped inside the current layout's window list | not "move left/right" in physical screen coordinates |
            | **THROW** | when focused window is moved to another Space | Relocates the window |

          #### SHORTCUTS

              | Keys | Action (short) | Object | Amethyst command | What it actually does |
              | :--: | -------------- | ------ | --------------- | ---------------------- |
              | `R⌘ ←` | Focus next window (clockwise in list) | `WINDOW` | `focus-cw` | Focus moves "forward" along Amethyst's window order (depends on layout/window list). |
              | `R⌘ →` | Focus previous window (counter-clockwise) | `WINDOW` | `focus-ccw` | Focus moves "backward" along that order. |
              | `R⌘ ↑` | Focus previous screen | `SCREEN` | `focus-screen-ccw` | Focus jumps to the previous screen (wraps in screen order). |
              | `R⌘ ↓` | Focus next screen | `SCREEN` | `focus-screen-cw` | Focus jumps to the next screen. |
              | `R⌘ [` | Previous layout | `LAYOUT` | `cycle-layout-backward` | Switches to the previous layout in your configured `layouts` list. |
              | `R⌘ ]` | Next layout | `LAYOUT` | `cycle-layout` | Switches to the next layout in your configured `layouts` list. |
              | `R⌘ ⏎` | Swap with main | `WINDOW` | `swap-main` | Swaps the focused window with the main window in the layout's ordering. |
              | `R⌘ ⇧ ←` | Swap with previous window in list | `WINDOW` | `swap-ccw` | Swaps with the previous window in the layout's ordering (counter-clockwise). |
              | `R⌘ ⇧ →` | Swap with next window in list | `WINDOW` | `swap-cw` | Swaps with the next window in the layout's ordering (clockwise). |
              | `R⌘ ⇧ ↑` | Focus main window | `WINDOW` | `focus-main` | Focuses the "main" window for the current layout (where that concept exists). |
              | `R⌘ ⇧ ↓` | Reevaluate windows | `LAYOUT` | `reevaluate-windows` | Reruns the current layout algorithm to re-tile/recompute frames. |
              | `R⌘ ⇧ ,` | Throw window to space left | `WINDOW` | `throw-space-left` | Moves the focused window to the space on the left. |
              | `R⌘ ⇧ .` | Throw window to space right | `WINDOW` | `throw-space-right` | Moves the focused window to the space on the right. |
              | `R⌘ ⇧ [` | Move window to previous screen | `WINDOW+SCREEN` | `swap-screen-ccw` | Moves the focused window onto the previous screen. |
              | `R⌘ ⇧ ]` | Move window to next screen | `WINDOW+SCREEN` | `swap-screen-cw` | Moves the focused window onto the next screen. |
