cheats:
  gcloud/bigquery/service_account:
    tags: [gcp]
    name: Create a service account and then create credentials you will need to authenticate as the service account
    desc: |
      In order to make requests to the BigQuery API, you need to use a Service Account.
      A Service Account belongs to your project, and it is used by the Google BigQuery Node.js client library to make BigQuery API requests.
      Like any other user account, a service account is represented by an email address.
    requirements:
      - desc: IAM permissions
        details: |
          The following IAM permissions are required to export and import data between projects:
            - datastore.databases.export
            - datastore.databases.import
    setup:
      - step: null
        desc: Set an environment variable with your PROJECT_ID which you will use
        cmds: export GOOGLE_CLOUD_PROJECT=$(gcloud config get-value core/project)
      - step: null
        desc: Create a new service account to access the BigQuery API
        cmds: gcloud iam service-accounts create bigquery-sa --display-name "BigQuery Service Account"
      - step: null
        desc: Create credentials that Node.js code will use to login as your new service account and save it as "~/bigquery-sa-key.json"
        cmds: gcloud iam service-accounts keys create ~/bigquery-sa-key.json --iam-account  bigquery-sa@prd-subscription.iam.gserviceaccount.com
      - step: null
        desc: Set the GOOGLE_APPLICATION_CREDENTIALS env var, used by the BigQuery API Node.js library to find the credentials (full path)
        cmds: gcloud projects add-iam-policy-binding prd-subscription --member "serviceAccount:bigquery-sa@prd-subscription.iam.gserviceaccount.com" --role "roles/bigquery.user"
      - step: null
        desc: Set the GOOGLE_APPLICATION_CREDENTIALS env var, used by the BigQuery API Node.js library to find the credentials (full path)
        cmds: export GOOGLE_APPLICATION_CREDENTIALS="/home/${USER}/bigquery-sa-key.json"
commands:
  gcloud info:
    desc: Display information about the current gcloud environment including the Google Cloud account, project and directory paths for logs
    tags: [gcloud]
  gcloud info --show-log:
    desc: Print the contents of the most recent log file
    tags: [gcloud]
  gcloud info --run-diagnostics:
    desc: Check network connectivity and hidden properties
    tags: [gcloud, diagnostic]

  gcloud config list:
    desc: List all properties in the active configuration
    tags: [gcloud]
  gcloud config configurations list:
    desc: Display a list of all available configurations
    tags: [gcloud]
  gcloud config configurations activate:
    desc: Switch to an existing named configuration
    tags: [gcloud]
  gcloud config set disable_prompts true:
    desc: Disable prompting for scripting
    tags: [gcloud, config]
  gcloud config get-value compute/region:
    desc: View default region
    tags: [gcloud, config]
  gcloud config get-value compute/zone:
    desc: View default zone
    tags: [gcloud, config]
  gcloud config get-value core/project:
    desc: Verify the current project
    tags: [gcloud, config]
  gcloud config set account rogerio.alcantara@gmail.com:
    desc: Change current user active account
    tags: [gcloud, config]
  gcloud config set project $PROJECT_ID:
    desc: Set the project property in the core section
    tags: [gcloud]

  gcloud components update:
    desc: Update all installed components to the latest available versions
    tags: [gcloud]
  gcloud components update --version=1.2.3:
    desc: Update all installed components to the specified version
    tags: [gcloud]
  gcloud compute regions list:
    desc: View available regions
    tags: [gcloud]
  gcloud compute zones list:
    desc: View available zones
    tags: [gcloud]

  gcloud auth list:
    desc: List all credentialed accounts
    tags: [gcloud, auth]
  gcloud auth login --brief:
    desc: Authorize Google Cloud access for the gcloud tool with Google user credentials and set current account as active
    tags: [gcloud, auth]
  gcloud auth print-access-token:
    desc: Display the current account's access token
    tags: [gcloud, auth]
  gcloud auth revoke:
    desc: Remove access credentials for an account
    tags: [gcloud, auth]
  gcloud auth activate-service-account:
    desc: Authorize Google Cloud access for the gcloud tool with service account credentials and set current account as active
    tags: [gcloud, auth]
  gcloud auth application-default login:
    desc: Set up Application Default Credentials
    links: [https://cloud.google.com/docs/authentication/provide-credentials-adc#local-dev]
    tags: [gcloud, auth]
  gcloud auth application-default login --impersonate-service-account SERVICE_ACCT_EMAIL:
    desc: Authorize Google Cloud access for the gcloud tool with impersonated service account credentials and set current account as active
    tags: [gcloud, auth]
    notes:
      - md: | #markdown
          # REQUIREMENTS

          - It requires Service Account Token Creator (roles/iam.serviceAccountTokenCreator) IAM role

  gcloud projects list:
    desc: List projects accessible by the active account
    tags: [gcloud]
  gcloud projects create:
    desc: Create a new project
    tags: [gcloud]
  gcloud projects delete:
    desc: Delete a project
    tags: [gcloud]
  gcloud projects add-iam-policy-binding:
    desc: Add an IAM policy binding to a specified project
    tags: [gcloud]
  gcloud projects get-iam-policy $PROJECT_ID_OR_NUMBER:
    desc: Get IAM policy for a project
    tags: [gcloud]
  gcloud projects describe $PROJECT_ID_OR_NUMBER:
    desc: Display metadata for a project (including its ID)
    tags: [gcloud]
  gcloud projects add-iam-policy-binding [PROJECT-ID] --member="serviceAccount:[SERVICE_ACCOUNT_NAME]@[PROJECT-ID].iam.gserviceaccount.com" --role="[ROLE]":
    desc: Grant a role to a service account to provide access to project and resources
    tags: [gcloud, iam]

  gcloud storage ls:
    desc: List the buckets in a project
    tags: [gcloud, storage]
  gcloud storage ls gs://BUCKET_NAME:
    desc: List the bucket contents
    tags: [gcloud, storage]
  gcloud storage rsync gs://BUCKET_FROM gs://BUCKET_TARGET --recursive --delete-unmatched-destination-objects:
    desc: Syncronizes all contents from bucket 1 to bucket target
    tags: [gcloud, storage]
  gcloud storage cp --recursive gs://BUCKET_SOURCE/* gs://BUCKET_TARGET:
    desc: Copy all objects from one bucket to another
    tags: [gcloud, storage]
  gcloud storage rm --recursive gs://BUCKET_TARGET:
    desc: Delete all objects from a bucket
    tags: [gcloud, storage]
  gcloud storage rm --all-versions gs://BUCKET_TARGET/**:
    desc: Delete all versions of all objects from a bucket keeping the source bucket
    tags: [gcloud, storage]
  gcloud storage ls > all.csv:
    desc: List all buckets and save to all.csv
    tags: [gcloud, storage]
  gcloud storage du gs://BUCKET_NAME --summarize:
    desc: List the bucket size
    tags: [gcloud, storage]
  gcloud storage buckets create gs://BUCKET_NAME:
    desc: Create a new bucket
    tags: [gcloud, storage]
  gcloud storage buckets create gs://BUCKET_NAME --project=PROJECT_ID --default-storage-class=STORAGE_CLASS --location=BUCKET_LOCATION --uniform-bucket-level-access:
    desc: Create a new bucket with specific configuration
    tags: [gcloud, storage]
  gcloud storage mb -l us-central1 gs://BUCKET_TARGET:
    desc: Create a Cloud Storage bucket named `my-bucket` in the same location `us-central1` as your datastore database
    tags: [gcloud]
  gcloud storage buckets describe gs://bucket-name:
    desc: Verify that the bucket exists
    tags: [gcloud, storage]
  cat buckets.txt | parallel "gcloud storage du gs://{} --summarize &>> sizes.txt":
    desc: List all bucket sizes in parallel and saves on sizes.txt
    tags: [gcloud, storage]
  gsutil cp -r gs://BUCKET_SOURCE/2023-08-23T19:32:58_12345 gs://BUCKET_TARGET:
    desc: Copy the export files from the source project`s bucket to the destination project`s bucket
    output: This command will copy the export files to a bucket named, [my-other-bucket in the destination projec]
    tags: [gcloud, datastore]
  gsutil cp index.html gs://BUCKET_NAME:
    desc: Upload a file to the bucket
    tags: [gcloud, datastore]

  gcloud alpha firestore databases describe:
    desc: Get the metadata for a Cloud Firestore database
    links: [https://cloud.google.com/datastore/docs/upgrade-to-firestore#view_your_database_type]
    tags: [gcloud]

  gcloud iam service-accounts create [SERVICE_ACCOUNT_NAME] --description="[SA-DESCRIPTION]" --display-name="[SA-DISPLAY-NAME]":
    desc: Create a service account
    tags: [gcloud, iam]
  gcloud iam service-accounts keys create [FILE-NAME].json --iam-account [SERVICE_ACCOUNT_NAME]@[PROJECT-ID].iam.gserviceaccount.com:
    desc: Create and Download a service account key file
    tags: [gcloud, iam]
  gsutil iam ch allUsers:objectViewer gs://BUCKET_NAME:
    desc: Give all users read access to the bucket
    tags: [gcloud]
  gsutil iam get gs://BUCKET_NAME:
    desc: View the bucket`s IAM policy
    tags: [gcloud, datastore]

  gcloud functions describe FUNCTION_NAME --region=southamerica-east1:
    desc: Get the metadata for a Cloud Function
    tags: [gcloud]
  gcloud functions logs read --gen2 --region=REGION --limit=10 FUNCTION_NAME:
    desc: Read logs for a Cloud Function
    tags: [gcloud]
  gcloud functions deploy FUNCTION_NAME --gen2 --runtime=nodejs20 --region=southamerica-east1 --source=. --entry-point=helloGET --trigger-http --allow-unauthenticated:
    desc: Deploy a function to Google Cloud Functions
    tags: [gcloud]

  gcloud datastore operations list:
    desc: List all operations
    tags: [gcloud, datastore]
  gcloud datastore export gs://exampleBucket --kinds='exampleKind' --format=json:
    desc: Export the datastore entities of the kind `exampleKind` to a Cloud Storage bucket named `exampleBucket` with the --kinds flag in JSON
    output:
      - This command will create a folder in your bucket with a name like 2023-08-23T19:32:58_12345.
      - This folder will contain the export files and a metadata file named 2023-08-23T19:32:58_12345.overall_export_metadata
    tags: [gcloud]
  gcloud datastore export --async --namespaces="my-namespace" gs://my-bucket:
    desc: Export the datastore entities of the namespace `my-namespace` to a Cloud Storage bucket named `my-bucket` with the --namespaces flag
    output:
      - This command will create a folder in your bucket with a name like 2023-08-23T19:32:58_12345.
      - This folder will contain the export files and a metadata file named 2023-08-23T19:32:58_12345.overall_export_metadata
    tags: [gcloud]
  gcloud datastore import --async gs://my-other-bucket/2023-08-23T19:32:58_12345/2023-08-23T19:32:58_12345.overall_export_metadata:
    desc: Import the datastore entities from the destination project`s bucket
    output: This command will import all the entities of the namespace, [`my-namespace` from the source project to the destination projec]
    tags: [gcloud]
  gcloud datastore import --async gs://clinicorp_migration_2023_08_31/2023-08-31T17:32:03_73940/2023-08-31T17:32:03_73940.overall_export_metadata:
    desc: Import the datastore entities from the destination project`s bucket
    output: This command will import all the entities of the namespace, [`my-namespace` from the source project to the destination projec]
    tags: [gcloud]

  gsutil web set -m index.html -e 404.html gs://BUCKET_NAME:
    desc: Set the main page and 404 page
    tags: [gcloud]
  gcloud services enable bigquery.googleapis.com:
    desc: Enable the BigQuery API
    tags: [gcloud]
  gcloud transfer jobs describe TRANSFER-JOB-NAME:
    desc: Verify that the transfer job exists
    tags: [gcloud, storage]
  gcloud transfer jobs create gs://BUCKET_SOURCE gs://BUCKET_TARGET --overwrite-when=different --name=TRANSFER-JOB-NAME --description='Sync buckets':
    desc: Create a transfer job to sync buckets
    tags: [gcloud, storage]
  gcloud compute project-info add-metadata --metadata google-compute-default-region=<southamerica-east1>,google-compute-default-zone=<southamerica-east1-a>:
    desc: Set the default region and zone
    tags: [gcloud]
  gcloud builds submit --tag gcr.io/<PROJECT_ID>/<image> .:
    desc: Build Docker Image and push it to Container Registry
    tags: [gcloud, docker]
  gcloud beta run deploy <app> --image gcr.io/<PROJECT_ID>/<image> --region <southamerica-east1> --platform managed --allow-unauthenticated --quiet:
    desc: Deploy Docker Image from Cloud Shell to Cloud Run
    tags: [gcloud, docker]
  gcloud services list | grep bigquery.googleapis.com:
    desc: Verify that the BigQuery API is enabled
    tags: [gcloud, datastore]
