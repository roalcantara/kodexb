  https://youtu.be/3MP8D-mdheA:
    desc: How To De-Slop A Codebase Ruined By AI (with one skill)
    tags: [ai, skills]
    notes:
      - md: | #markdown
          ## How To De-Slop A Codebase Ruined By AI (with one skill)

          Matt Pocock explains how to address AI-driven codebase entropy by refactoring with deep modules and strategic architectural oversight

          ### CORE CONCEPTS

          1. **Modules & Interfaces**
            - A module is a functional unit.
            - Its interface defines how other parts of the system interact with it, while the implementation handles the internal logic.

          2. **Deep vs. Shallow Modules**
            - Deep modules hide complex implementation behind simple interfaces, offering high leverage.
            - Shallow modules have complex interfaces with little behind them, which is generally inefficient.

          3. **Seams**
            - The boundaries between modules where they interact.
            - These are the critical points for testing and modularity.

          4. **Adapters**
            - Concrete implementations (e.g., a 'fake clock' for testing) that satisfy an interface at a specific seam.

          ### KEY POINTS

          1. **Locality**
            - A goal of deep modules is to ensure that related changes and bug fixes remain within one place, rather than being scattered across the codebase.

          2. **Leverage**
            - Deep modules provide more capability per unit of interface, making the code easier to maintain and extend.

          3. **Human-in-the-loop**
            - AI agents are excellent at tactical changes, but a human must remain the strategic architect, deciding what is best for the long-term health of the system.

          ### RECOMMENDATIONS FOR RESCUEING A CODEBASE

          1. **Adopt a Shared Vocabulary**
            - Use clear terminology (Modules, Interfaces, Seams, Adapters) to ensure precision when prompting AI

          2. **Audit for Deepening Opportunities**
            - Regularly analyze the codebase to identify areas with poor locality or parallel/redundant implementations that can be refactored into a single deep module

          3. **Build a Testing Harness**
            - Before performing significant refactoring, especially in legacy (or 'bad') codebases, establish a test harness around these new deep modules to ensure stability

          4. **Strategic Routine**
            - Run architectural improvement processes (such as the Improve Codebase Architecture skill discussed) every few days to keep entropy in check
  https://youtu.be/WNru_PFycT8:
    desc: Graphify transforms codebases into structured knowledge graphs for LLM context
    tags: [ai, tools]
    notes:
      - md: | #markdown
          # This Tool Fixes AI Coding at Scale with 70x Fewer Tokens (Graphify)

          This video introduces Graphify, a tool designed to solve the 'raw folder' problem in AI coding assistants by transforming codebases into structured knowledge graphs rather than providing LLMs with flat file dumps.

          ### CORE MECHANISM

          1. **How it works**:
            - It utilizes tree-sitter for structural understanding, LLMs for semantic extraction, and graph clustering to map connections between files, code, documents, and even diagrams.

          2. **Efficiency**:
            - By replacing raw file ingestion with a persistent knowledge graph, it can reduce token usage by over 70% after the initial setup.

          3. **Persistence**:
            - It generates an MD file that acts as a memory layer, allowing the AI to reference established relationships instead of re-learning the repo for every prompt.

          ### BENEFITS AND ADVANTAGES

          1. **Contextual Accuracy**:
            - Unlike RAG (Retrieval-Augmented Generation), which relies on similarity searches, Graphify builds real relational dependencies (e.g., function calls, module dependencies), leading to better reasoning rather than mere guessing.

          2. **Multi-Modal Support**:
            - It processes various formats, including PDFs, diagrams, and media, locally, ensuring nothing leaves the machine.

          3. **Onboarding**:
            - The visual graph and generated reports help developers understand complex, large-scale systems more quickly.

          ## WHERE GRAPHIFY WORKS BEST

          1. **Large, messy codebases**
            - 100k+ LOC
            - multiple domains
            - unclear relationships

          2. **Weak architecture**
            - inconsistent naming
            - unclear boundaries
            - hidden dependencies
