  # https://skillshare.runkids.cc
  brew install runkids/tap/skillshare:
    desc: Skillshare is a CLI for managing skills for AI agents
    tags: [ai, skills, cli]
    links: [https://skillshare.runkids.cc/docs/reference/commands#quick-reference]
    notes:
      - sh: | #shell
          # Quick Start
          curl -fsSL https://raw.githubusercontent.com/runkids/skillshare/main/install.sh | sh

          # Setup
          skillshare init
          skillshare init --remote git@github.com:you/skills.git

          # Install skills
          skillshare install anthropics/skills/skills/pdf
          skillshare install github.com/team/skills --track

          # Create skill
          skillshare new my-skill

          # Sync
          skillshare sync
          skillshare sync --dry-run

          # Cross-machine
          skillshare push -m "Add skill"
          skillshare pull

          # Status
          skillshare status
          skillshare list
          skillshare diff

          # Enable/disable skills
          skillshare disable draft-*
          skillshare enable draft-*

          # Maintenance
          skillshare update --all
          skillshare analyze
          skillshare audit
          skillshare log
          skillshare doctor
          skillshare backup

          # TUI preferences
          skillshare tui            # Show current status
          skillshare tui off        # Disable interactive TUI
          skillshare tui on         # Re-enable TUI

          # Web UI
          skillshare ui
          skillshare ui -p          # Project mode

          # Hub
          skillshare hub list
          skillshare hub add https://hub.example.com/index.json

          # Check for updates
          skillshare check

          # Trash management
          skillshare trash list
          skillshare trash restore my-skill

          # Version
          skillshare version
  skillshare init:
    desc: First-time setup. Auto-detects installed AI CLIs and configures targets
    tags: [ai, skills, cli]
    links: [https://skillshare.runkids.cc/docs/reference/commands/init]
    notes:
      - md: | #markdown
          # When to Use

          - First time setting up skillshare on a machine
          - Migrating to a new computer (with --remote to connect to existing repo)
          - Adding skillshare to a project (with --project)
          - Discovering newly installed AI CLIs (with --discover)
      - mermaid: | #mermaid
          flowchart TD
            subgraph WH["What Happens"]
              direction TB
              n0["skillshare init"] --> n1["0. Source path prompt"]
              n1 --> n2["1. Create source + agents directories"]
              n2 --> n3["2. Auto-detect AI CLIs"]
              n3 --> n4["3. Initialize git"]
              n4 --> n5["4. Set up remote"]
              n5 --> n6["5. Subdirectory prompt"]
              n6 --> n7["6. Create config.yaml"]
              n7 --> n8["7. Built-in skill"]
            end
