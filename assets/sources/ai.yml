  https://skills.sh:
    desc: Install, update, list, remove, search, and scaffold skills into agent projects | Vercel Labs
    tags: [ai, skills, cli]
    links: [https://github.com/vercel-labs/skills]
    notes:
      - md: |
          # skills.sh

          - The ecosystem anchor.
          - Unmatched discoverability and community pull, backed by the most credible sponsor. 
          - The CLI is solid but thin — it's a great install tool, not a full lifecycle manager. 
          - The absence of local audit, offline operation, and team sync must be addressed.

          ### Purpose

          - The canonical **registry and CLI** for the open agent skills ecosystem. 
          - It serves two functions: 
            - Leaderboard/directory tracking 91k+ installs across 246+ skills from orgs like Anthropic, Microsoft, Vercel, Google, etc;
            - Reference `skills` CLI used to install, update, list, remove, search, and scaffold skills into agent projects.

          ### Features

          - `skills add <owner/repo>` — install from GitHub, GitLab, any git URL, or local path
          - `--list` flag to preview skills before installing
          - `--skill` and `--agent` flags for selective targeting
          - Project-scoped vs global install (`-g`)
          - Symlink (recommended) or copy installation modes
          - `skills list` / `skills ls` — enumerate installed skills
          - `skills find [query]` — fuzzy search (fzf-style)
          - `skills check` / `skills update` — update tracking
          - `skills remove` — remove by name, agent, or all
          - `skills init` — scaffold new `SKILL.md` templates
          - Support for 38+ agents (Claude Code, Cursor, Codex, OpenCode, Roo, Windsurf, GitHub Copilot, Gemini CLI, Goose, Kiro, Expo, etc.)
          - `allowed-tools`, hooks, and `context: fork` feature flags per agent
          - Internal skills (hidden by default, enable via `INSTALL_INTERNAL_SKILLS=1`)
          - Anonymous telemetry for leaderboard ranking (opt-out via `DISABLE_TELEMETRY=1`)
          - Plugin manifest compatibility (`.claude-plugin/marketplace.json`)
          - `skills.sh` leaderboard with trending/hot rankings
          - Routine security audits at the directory level (via `security.vercel.com`)
          - CI/CD friendly (`--yes`, `--all` flags)

          ### PROS

          - **Institutional backing** — Vercel Labs is the de facto steward; Anthropic, Microsoft, Google, Supabase all publish here. This is as close to an official registry as the ecosystem has.
          - **Best discoverability** — the leaderboard with 91k+ installs and trending filters makes it the easiest place to find quality skills.
          - **Widest agent coverage** — 38+ agents with mapped install paths, the most comprehensive of the three tools.
          - **Hooks support** — only skills.sh supports hooks natively (for Claude Code and Cline); the others don't.
          - **npx-first** — zero install required; works in any environment with Node.
          - **Active community** — 80 contributors, 80 open PRs being processed, major vendors publishing skills.
          - **Security audits** — routine audits against the directory, linked directly from docs.
          - **Scaffolding** — `skills init` generates a valid SKILL.md template.

          ### CONS

          - **No offline capability** — requires npm/npx and internet for every operation.
          - **No built-in security scan** — individual developers can't audit a skill before install; the audits are done at the registry level, not locally.
          - **No web dashboard** — skills.sh is read-only; no local visual management.
          - **No bidirectional sync** — it installs skills, but can't collect them back from your agents into a central source.
          - **No cross-machine config sync** — no git-backed config, skills are per-machine.
          - **Telemetry is opt-out** — minor friction for privacy-conscious users.
          - **No team workflow** — designed for individual install; no org-level skill governance.
          - **CLI is thin** — `skills find` is useful but there's no search across installed skills by content, no local validation beyond YAML frontmatter checking.

          ### HIGHLIGHTS

          The **skills.sh leaderboard** is the unique differentiator — it's the npm registry equivalent for AI agent skills, with real usage data (91k+ installs), trending/hot views, and first-party contributions from Anthropic, Microsoft, Google, and Vercel. No other tool has this community gravity.

          ### RED FLAGS

          - Security audit coverage is described as "routine" with no public audit schedule or SLA — the disclaimer says "we cannot guarantee the quality or security of every skill."
          - Telemetry collects "skill name, skill files, and a timestamp" anonymously — the definition of "skill files" is vague; worth reviewing before CI use.
          - Dependency on Vercel Labs' continued involvement; if Vercel deprioritizes this, the registry could stagnate.
      - sh: |
          #!/bin/bash
          # =============================================================================
          # SKILLS TOOLS — QUICK REFERENCE
          # Real-world context: fullstack dev working with Firebase/GCP, DocuSign, AWS SAM
          # =============================================================================

          # --- INSTALLATION ------------------------------------------------------------
          # Optional. npx handles everything on first use.
          brew install skills

          # Verify
          skills --version

          # --- DISCOVER: Browse the leaderboard ----------------------------------------
          # Visit https://skills.sh — or use the interactive fzf-style finder in terminal.

          skills find                                      # interactive TUI search (fzf-style)
          skills find firebase                             # filter by keyword
          skills find "aws serverless"                     # multi-word search

          # --- DISCOVER: Preview skills in a repo before installing --------------------
          # See what skills a repo contains without installing anything.

          skills add anthropics/skills --list               # Anthropic's official skills
          skills add vercel-labs/agent-skills --list        # Vercel's official skills
          skills add microsoft/azure-skills --list          # Microsoft Azure skills

          # --- INSTALLING SKILLS: From a known repo (real-world examples) ------------------------

          # Install Anthropic's official PDF skill globally for all agents
          skills add anthropics/skills --skill pdf -g

          # Install Anthropic's frontend-design skill only for Claude Code
          skills add anthropics/skills --skill frontend-design -a claude-code

          # Install multiple skills at once from the same repo
          skills add anthropics/skills --skill pdf --skill docx --skill xlsx -a claude-code

          # Install an AWS skill for serverless/SAM work
          skills add microsoft/azure-skills --skill azure-cost -a claude-code

          # Install from a direct GitHub URL (a skill not on the leaderboard yet)
          skills add https://github.com/zxkane/aws-skills -a claude-code

          # Install all skills in a repo targeting all detected agents at once
          skills add vercel-labs/agent-skills --all

          # Non-interactive / CI-friendly (no prompts, no telemetry)
          DISABLE_TELEMETRY=1 skills add anthropics/skills --skill frontend-design -g -a claude-code -y

          # --- INSTALL: Project-scoped vs global ---------------------------------------
          # Project scope (default) → ./.claude/skills/    committed with your repo
          # Global scope (-g)       → ~/.claude/skills/    available across all projects

          # Install for this project only (committed to git, shared with team)
          skills add anthropics/skills --skill skill-creator

          # Install globally (personal, available everywhere)
          skills add anthropics/skills --skill skill-creator -g

          # --- LIST: See what is installed ---------------------------------------------
          skills list                         # all installed (project + global)
          skills ls -g                        # global skills only
          skills ls -a claude-code            # filter by agent
          skills ls -a claude-code -a cursor  # filter by multiple agents

          # --- UPDATE: Keep skills current ---------------------------------------------
          skills check                        # check for available updates
          skills update                       # update all skills (interactive)
          skills update frontend-design       # update a single skill by name
          skills update -g                    # update global skills only
          skills update -y                    # non-interactive, auto-confirm

          # --- REMOVE ------------------------------------------------------------------
          skills remove frontend-design                         # remove by name
          skills remove frontend-design web-design-guidelines   # remove multiple
          skills rm frontend-design -g                          # remove from global scope
          skills remove --skill '*' -a cursor                   # remove all from Cursor
          skills remove my-skill --agent '*'                    # remove from all agents
          skills remove --all                                   # remove everything, no confirm

          # --- SCAFFOLD: Generates a SKILL.md template with correct YAML frontmatter
          skills init                         # create SKILL.md in current directory
          skills init docusign-webhook        # create in a named subdirectory

          # Resulting structure:
          # docusign-webhook/
          # └── SKILL.md   ← edit name, description, and instructions

          # 💡 REAL-WORLD SCENARIO: Setting up Claude Code for a Firebase project ------
          # Goal: give Claude Code skills for PDF generation, DocuSign workflows,
          # frontend design, and general skill discovery.

          skills add anthropics/skills --skill pdf --skill docx --skill frontend-design --skill skill-creator -a claude-code -g -y

          # Verify what landed in Claude Code
          skills ls -a claude-code
  https://skillshare.runkids.cc:
    desc: Lifecycle manager for skills - one source of truth
    tags: [ai, skills, cli]
    links: [https://github.com/runkids/skillshare]
    notes:
      - md: |
          # Skillshare

          - The most complete lifecycle manager with genuinely unique features
            - Bidirectional sync, local audit, declarative model, web UI
          - Loses points for lower community adoption and the solo maintainer risk.

          ### PURPOSE

          - A **skills lifecycle manager** focused on keeping skills in sync across all your AI agents and machines from a single source of truth. 
          - Where skills.sh installs skills imperatively, skillshare takes a declarative approach: 
            - skills live in `~/.config/skillshare/skills/`
            - `skillshare sync` symlinks (or copies) them into every detected agent directory. 
            - Covers team sharing, security auditing, cross-machine sync via git, bidirectional collection, and a full web dashboard.

          ### FEATURES

          - `skillshare init` — detect agents, create config and source directory
          - `skillshare sync` — symlink/copy skills to all targets (non-destructive merge)
          - `skillshare install <source>` — from GitHub, GitLab, Bitbucket, Azure DevOps, any git host
          - `skillshare update --all` — update all tracked skills
          - `skillshare collect` — bidirectional: pull skills created inside agent dirs back to source
          - `skillshare audit` — local security scan for prompt injection, data exfiltration, destructive commands (critical threats auto-block)
          - `skillshare ui` — embedded web dashboard (single binary, no setup)
          - `skillshare target <name> --mode copy` — per-target copy mode (when symlinks unsupported)
          - `skillshare backup` / restore — snapshot and restore skill sets
          - Cross-machine sync via any git host (git push/pull)
          - Project-scoped skills (`.skillshare/` committed to repo)
          - Org-level skills via tracked repos
          - Interactive bubbletea TUI (v0.16.0+)
          - `.skillignore` — exclude patterns from sync
          - Dual-level skill scope: organization + project
          - Web UI: dashboard, skills explorer, skill detail, sync control, GitHub search, security audit
          - NTFS junction support on Windows (no admin required)
          - Single binary — no Node.js, no npm, no runtime dependency
          - No telemetry (explicitly noted as a design decision)
          - Docker support
          - Homebrew tap
          - 50+ agent targets supported
          - Mise integration (`mise.toml` in repo)

          ### PROS

          - **One source of truth** — the central differentiator. 
             - Skills are stored once, synced everywhere.
             - This solves the real pain of editing a skill in Claude and forgetting to update Cursor.
          - **Bidirectional collect** 
             - `skillshare collect` pulls skills created inside agent directories back to source; no other tool does this.
          - **Built-in security audit**
             — local scan for prompt injection, credential theft, and destructive commands. 
             - Critical threats block install.
             - This is the only tool with a local audit capability.
          - **Web dashboard** 
             — visual management is unique; the others are CLI-only.
          - **Cross-machine sync**
             — git-backed config means a new machine is one `git clone` + `sync` away from full state.
          - **No runtime dependency** — single Go binary. 
             - Works in environments without Node/npm.
          - **No telemetry** 
             — explicit design choice, respects privacy.
          - **Most releases**
             — 98 releases (vs 17 for skills.sh, 9 for openskills) signals active development.
          - **Team-ready**
             — org-level skills via tracked repos, project-scoped skills via `.skillshare/` in git, both auto-detected.

          ### CONS

          - **Solo maintainer risk** — 648 stars vs the others' thousands; much smaller community footprint.
          - **No built-in discovery/registry** — you must know a skill repo exists or use the web UI's GitHub search; there's no curated leaderboard.
          - **Not the canonical format reference** — skillshare is a sync tool, not a registry. It operates on skills from skills.sh or other sources but doesn't host them.
          - **Steeper conceptual model** — source directory → targets → sync is more to learn than `npx skills add`.
          - **No hooks surface** — hook-aware agents like Claude Code and Cline have hooks, but skillshare doesn't manage them specifically.
          - **Web UI requires running a local server** — `skillshare ui` is not a hosted service; it's a local process.
          - **Less enterprise community validation** — no Anthropic/Microsoft/Vercel-level contributors, making the skill catalog you'd import entirely third-party.

          ### HIGHLIGHTS

          - **`skillshare collect` + `skillshare audit`** together are unique in the ecosystem. 
          - The ability to pull a skill you created inside Claude Code back to your canonical source, then security-scan it before sharing with the team, is a workflow no other tool supports end-to-end.
          - The embedded Go-binary web dashboard is also a standout — visual skill management with dry-run sync controls, without installing anything extra.

          ### RED FLAGS

          - Solo maintainer (`runkids`) — despite 15 contributors in git history, the bus factor appears low.
          - 648 stars is relatively low; it's possible the project hasn't reached critical community mass yet.
          - The web UI is served locally (not a cloud product), so "web dashboard" is really a local TUI alternative — don't expect hosted SaaS.
      - sh: | #shell
          #!/bin/bash

          # =============================================================================
          # skillshare  (skillshare.runkids.cc  /  github.com/runkids/skillshare)
          #
          # A lifecycle manager for skills: one source of truth (~/.config/skillshare/),
          # synced via symlinks to every AI agent on the machine.
          # Use skills.sh to FIND and install skills; use skillshare to KEEP THEM IN SYNC.
          # Single Go binary — no Node.js, no Python, no runtime dependencies.
          # =============================================================================

          # --- INSTALLATION ------------------------------------------------------------

          # macOS (Homebrew — recommended)
          brew install runkids/tap/skillshare

          # macOS / Linux (install script)
          curl -fsSL https://raw.githubusercontent.com/runkids/skillshare/main/install.sh | sh

          # Upgrade later
          skillshare upgrade

          # Optional convenience alias — add to ~/.zshrc
          alias ss='skillshare'

          # Verify
          skillshare --version

          # --- INIT: Detect agents and create source directory -------------------------
          # Scans the machine for installed AI agents, creates config,
          # and sets up ~/.config/skillshare/skills/ as the single source of truth.
          skillshare init

          # The resulting layout:
          # ~/.config/skillshare/
          # ├── skills/     ← your single source of truth (SKILL.md files live here)
          # ├── agents/     ← agent files (CLAUDE.md, AGENTS.md, etc.)
          # └── extras/     ← rules, commands, memory, and other non-skill assets

          # To set up with git-backed sync from the start (recommended):
          skillshare init --remote git@github.com:roalcantara/skills.git

          # Project-scoped mode (skills live in .skillshare/ inside a repo)
          skillshare init -p

          # --- SYNC: Push skills from source → all agent directories -------------------
          # Creates symlinks: ~/.claude/skills/ → ~/.config/skillshare/skills/
          #                   ~/.cursor/skills/ → same source
          #                   ~/.codex/skills/  → same source, etc.

          skillshare sync                         # sync skills to all detected targets
          skillshare sync --dry-run               # preview changes without writing anything
          skillshare sync --all                   # sync skills + agents + extras together


          # --- INSTALL: Bring external skill repos into the source directory -----------
          # Downloads skills from GitHub/GitLab into your local source,
          # runs a security audit, then you sync.
          skillshare install github.com/anthropics/skills                 # Anthropic's official skills
          skillshare install github.com/vercel-labs/agent-skills          # Vercel's official agent skills
          skillshare install github.com/zxkane/aws-skills                 # AWS skills

          # Install specific skills from a repo
          skillshare install github.com/anthropics/skills -s pdf,docx,frontend-design

          # Install and track for future updates
          skillshare install github.com/anthropics/skills --track

          # Install from a specific branch
          skillshare install github.com/myorg/my-skills -b main --all

          # Install into a project (project-scoped mode)
          skillshare install github.com/anthropics/skills -s pdf -p

          # Always sync after install to push new skills to all agents
          skillshare sync

          # --- SECURITY AUDIT: Scan before anything reaches your agents ----------------
          # Detects prompt injection, credential theft, data exfiltration commands.
          # Critical threats automatically block installation.
          # NOTE: audit also runs automatically on every `skillshare install`.

          skillshare audit                        # scan all installed skills
          skillshare audit frontend-design        # scan a single skill by name
          skillshare audit --format json          # machine-readable output (CI/CD)

          # --- COLLECT: Pull skills created inside agents back to source ---------------
          # The reverse of sync. Use this after creating a skill directly in Claude Code
          # or Cursor and wanting it shared across all other agents.

          skillshare collect claude               # collect from Claude Code → source
          skillshare collect cursor               # collect from Cursor → source
          skillshare collect --all                # collect from all agents at once

          # After collecting, audit and then re-sync to push everywhere
          skillshare audit
          skillshare sync

          # --- LIST / SEARCH: Inspect what is installed --------------------------------
          skillshare list                         # list all installed skills (TUI)
          skillshare list --json                  # machine-readable
          skillshare search firebase              # search installed skills by keyword
          skillshare status                       # full sync status across all targets
          skillshare diff                         # show what would change on next sync

          # --- UPDATE: Keep installed skills current -----------------------------------
          skillshare check                        # check for available updates
          skillshare update --all                 # update all tracked skills
          skillshare update frontend-design       # update a single skill

          # Full refresh
          skillshare update --all && skillshare audit && skillshare sync

          # --- UNINSTALL ---------------------------------------------------------------
          skillshare uninstall frontend-design    # remove a skill (goes to trash first)
          skillshare trash restore frontend-design && skillshare sync   # undo if needed

          # --- TARGET MANAGEMENT: Control which agents receive skills ------------------
          skillshare target list                  # show all detected targets and their status
          skillshare target list --json           # machine-readable

          # If symlinks don't work (e.g. some Windows setups), switch a target to copy mode
          skillshare target claude --mode copy
          skillshare sync

          # Disable a specific target temporarily
          skillshare target cursor --disable
          skillshare sync                         # cursor will be skipped

          # --- EXTRAS: Sync non-skill assets (rules, commands, memory files) -----------
          # skillshare can also sync CLAUDE.md rules, slash commands, memory files, etc.

          skillshare extras init rules --target ~/.claude/rules --target ~/.cursor/rules
          skillshare extras init commands --target ~/.claude/commands --mode copy
          skillshare sync --all                   # sync skills + extras together

          # Collect rules or commands back to source
          skillshare extras collect rules

          # --- GIT SYNC: Cross-machine sync via any git host ---------------------------
          # Push local changes to remote → pull on another machine → sync there.

          skillshare push -m "add docusign-webhook skill"   # commit + push to remote
          skillshare pull                                   # pull latest on another machine
          skillshare sync                                   # apply to agents on that machine

          # --- BACKUP & RESTORE --------------------------------------------------------
          skillshare backup                       # snapshot current state
          skillshare restore                      # roll back to last backup

          # --- WEB DASHBOARD (optional visual interface) --------------------------------
          # Local web UI — no external server, no account needed.
          # Requires skillshare init first.
          skillshare ui                           # opens http://127.0.0.1:19420


          # --- DIAGNOSTICS -------------------------------------------------------------
          skillshare doctor                       # diagnose broken symlinks, config issues
          skillshare doctor --json                # exit 1 on errors (CI-friendly)

          # --- CI / GitHub Actions integration -----------------------------------------
          # skillshare has a first-party GitHub Action for CI/CD pipelines.

          # .github/workflows/validate-skills.yml
          #
          # name: Validate Skills
          # on:
          #   pull_request:
          #     paths: ['skills/**']
          # jobs:
          #   validate:
          #     runs-on: ubuntu-latest
          #     steps:
          #       - uses: actions/checkout@v4
          #       - uses: runkids/setup-skillshare@v1
          #         with:
          #           source: ./skills
          #           audit: true
          #           audit-threshold: high
          #       - run: skillshare sync --dry-run


          # 💡 REAL-WORLD SCENARIO: Full lifecycle on a new machine --------------------
          # CONTEXT: new dev machine, Firebase/DocuSign/AWS SAM project.
          # GOAL: get all skills installed, synced to Claude Code + Cursor, audited,
          #       and backed by git so any future machine takes one command to restore.

          # 1. Install skillshare
          brew install runkids/tap/skillshare

          # 2. Initialise with git-backed source
          skillshare init --remote git@github.com:roalcantara/skills.git

          # 3. Install curated skills from trusted sources
          skillshare install github.com/anthropics/skills -s pdf,docx,xlsx,frontend-design,skill-creator --track
          skillshare install github.com/vercel-labs/agent-skills -s vercel-react-best-practices --track
          skillshare install github.com/zxkane/aws-skills --all --yes

          # 4. Audit everything before it touches any agent
          skillshare audit

          # 5. Sync to Claude Code and Cursor
          skillshare sync

          # 6. Verify
          skillshare list
          skillshare status

          # 7. Create a custom skill for DocuSign webhooks (inside Claude Code)
          #    ... develop and test inside ~/.claude/skills/docusign-webhook/ ...

          # 8. Collect the new skill back to the source
          skillshare collect claude

          # 9. Audit the new custom skill
          skillshare audit docusign-webhook

          # 10. Push to git remote so other machines can pull it
          skillshare push -m "feat: add docusign-webhook skill"

          # 11. On another machine — restore in one command
          #     git clone git@github.com:roalcantara/skills.git ~/.config/skillshare
          #     skillshare sync
