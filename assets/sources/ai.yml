  ## THOUGHTWORKS
  https://martinfowler.com/articles/structured-prompt-driven:
    desc: Structured Prompt Driven Development (SPDD) | Thoughtworks
    tags: [ai, prompt]
    notes:
      - md: | #markdown
          # SUMMARY
          Wei Zhang and Jessie Xia from Thoughtworks present SPDD, a method treating AI prompts as governed, versioned, reusable delivery artifacts for team-scale development.

          ---

          # IDEAS

          - AI coding assistants improve individual speed but rarely translate to system-level delivery throughput gains.
          - Ambiguous requirements become code quickly, and misunderstandings scale proportionally with AI-assisted generation speed.
          - The real question isn't generating more code but making AI changes governable, reviewable, and reusable.
          - SPDD treats prompts as first-class delivery artifacts kept in version control alongside the code itself.
          - The REASONS Canvas forces clarity across requirements, entities, approach, structure, operations, norms, and safeguards.
          - When reality diverges from the prompt, the SPDD rule is: fix the prompt first, then update code.
          - Reviews in SPDD shift from "spot the bug" toward "check the intent" as the primary focus.
          - Structured prompts accumulate domain knowledge and design decisions that compound individual expertise across iterations.
          - SPDD enforces a closed loop where intent and implementation must evolve together, not separately.
          - The `/spdd-analysis` command extracts domain keywords and scans only relevant codebase sections, not everything.
          - Logic corrections that change observable behavior require updating the prompt before touching any code.
          - Refactoring that doesn't change observable behavior goes code-first, then syncs back to the structured prompt.
          - The REASONS Canvas output is an executable blueprint down to method signatures and parameter types.
          - Successful patterns naturally accumulate into a reusable prompt library supporting AI-First Software Delivery.
          - SPDD is rated highest for scaled standardized delivery and high compliance environments with hard constraints.
          - SPDD performs poorly for firefighting hotfixes, exploratory spikes, and context-ambiguous `"black hole"` domains.
          - The `/spdd-sync` command keeps the Canvas accurate by flowing code changes back into the specification.
          - Three core developer skills in AI era: abstraction-first, alignment, and iterative review replace raw coding speed.
          - Without abstraction-first thinking, AI sprints on implementation details while the overall structure silently falls apart.
          - Alignment means making explicit what we will and won't do before any implementation begins.
          - Iterative review turns AI assistance into an engineering process rather than a one-shot draft generation.
          - SPDD's governance overhead is too high for disposable scripts or purely aesthetic/creative visual work tasks.
          - In AI-assisted development, software quality is a contest of engineer cognitive bandwidth, not model IQ.
          - The expert-only barrier is a current limitation; future work aims to lower abstraction requirements for junior developers.
          - SPDD high-level intent alignment at ~99% was achieved in the billing engine enhancement walkthrough example.
          - Prompt assets accumulated across iterations become the governed starting context for subsequent enhancement cycles.
          - The article itself was written with assistance from Claude, Gemini, and ChatGPT as thought partners.
          - SPDD adds to spec-driven development by maintaining the prompt as a living, synchronized, governed artifact.
          - Never manually edit the structured prompt file; always maintain the SPDD iterative dialogue with the AI.
          - Engineering norms and safeguards in REASONS Canvas prevent the LLM from improvising beyond defined specification boundaries.

          ---

          # INSIGHTS

          - AI coding speed at the individual level creates new friction at the system level without structured governance methods.
          - Treating prompts as versioned artifacts transforms AI assistance from personal productivity into organizational capability that compounds.
          - The most valuable developer skill shift in the AI era is thinking abstractly before generating anything at all.
          - Aligning intent explicitly before implementation eliminates the rework cycle that consumes gains from AI generation speed.
          - A closed-loop workflow where prompt and code co-evolve prevents the silent drift that undermines long-term maintainability.
          - Logic corrections should always flow requirements → prompt → code; refactoring should flow code → prompt in reverse.
          - AI-assisted development success depends on engineer clarity and framing ability, not the intelligence of the underlying model.
          - Governance overhead that slows speed in simple cases is precisely the investment that enables safe scaling in complex ones.
          - Accumulated prompt assets function like organizational memory, reducing reinvention and variability across team members over time.
          - Engineering discipline applied to prompts achieves the same predictability and auditability as traditional specification-driven development processes.

          ---

          # QUOTES

          - "The real question isn't `How do we generate more code?` It's `how do we make AI-generated changes governable, reviewable, and reusable`." — Wei Zhang & Jessie Xia
          - "When reality diverges, fix the prompt first — then update the code." — Wei Zhang & Jessie Xia
          - "Reviews move away from `spot the bug` toward `check the intent`'" — Wei Zhang & Jessie Xia
          - "It's like buying a Ferrari and driving it on muddy roads: the engine is powerful, but your arrival time is determined by road conditions and traffic." — Wei Zhang & Jessie Xia
          - "The prompt captures the intent, and the code is the implementation of that intent." — Wei Zhang & Jessie Xia
          - "Don't worry about making mistakes, and don't stress over not catching every single detail perfectly on the first try." — Wei Zhang & Jessie Xia
          - "SPDD may not be the shortest path to `generate code quickly`, but it is one of the most reliable ways to ship the right change with confidence." — Wei Zhang & Jessie Xia
          - "In the AI era, software development isn't a contest of model IQ. It's a contest of engineer cognitive bandwidth." — Wei Zhang & Jessie Xia
          - "The real advantage comes from sharpening the meta-skills behind it: abstraction and modelling, systematic analysis, and a deep understanding of the business as a whole." — Wei Zhang & Jessie Xia
          - "In science, if you know what you are doing, you shouldn't be doing it. In engineering, if you don't know what you are doing, you shouldn't be doing it." — Richard W. Hamming
          - "A change made to the internal structure of software to make it easier to understand and cheaper to modify without changing its observable behavior." — Martin Fowler
          - "Without abstraction-first thinking, AI often sprints on implementation details while the structure falls apart." — Wei Zhang & Jessie Xia
          - "Before implementation, you need to make `what we will do / what we won't do` explicit, and agree on the standards and hard constraints up front." — Wei Zhang & Jessie Xia
          - "You want AI assistance to behave like an engineering process, not a one-shot draft." — Wei Zhang & Jessie Xia
          - "Those are the human strengths that ultimately determine how much value we can get from AI." — Wei Zhang & Jessie Xia
          - "Every meaningful change can be traced back to the structured prompt, closing the audit loop." — Wei Zhang & Jessie Xia
          - "SPDD should depend less on personal craftsmanship and more on a mature, organization-level asset system." — Wei Zhang & Jessie Xia
          - "Generated doesn't mean aligned." — Wei Zhang & Jessie Xia
          - "As domain knowledge and design decisions accumulate in each prompt, they compound individual expertise across iterations." — Wei Zhang & Jessie Xia
          - "Always keep the structured prompt synchronized with your latest codebase." — Wei Zhang & Jessie Xia

          ---

          # HABITS

          - Always design abstractions and object boundaries before generating any code with AI assistance tools.
          - Lock in explicit scope boundaries—what you will and won't do—before starting any implementation work session.
          - Review AI-generated analysis documents to confirm your understanding aligns with the AI's interpretation of requirements.
          - Never manually edit structured prompt files; always use iterative dialogue to instruct AI to update them.
          - Fix the prompt first whenever a logic mismatch is discovered, then regenerate the affected code sections.
          - Refactor code in small, incremental steps rather than large sweeping changes to maintain controlled, reviewable progress.
          - Run regression tests after every cleanup or optimization session to confirm no core functionality was inadvertently broken.
          - Treat functional API testing as an auxiliary check and require comprehensive unit tests for final sign-off.
          - Deduplicate test scenarios by cross-referencing new AI-generated tests against existing test suites before accepting them.
          - Perform targeted code diffs rather than regenerating entire codebases when making corrections to specific behaviors.
          - Keep structured prompts synchronized with the codebase continuously rather than updating them only at milestone moments.
          - Use template-driven approaches to generate structured prompts for testing before dedicated testing commands are finalized.
          - Categorize code review findings by whether they change observable behavior before deciding which workflow to apply.
          - Advance through the SPDD workflow iteratively rather than trying to perfect every artifact on the first attempt.
          - Pair business owners with developers during requirement refinement to ensure both technical and business dimensions align.
          - Use version control for prompt artifacts with the same discipline applied to production code and tests.
          - Verify core functionality first through integration tests before circling back to eliminate code smells and magic numbers.
          - Build a reusable prompt library by accumulating successful patterns from completed delivery iterations over time.

          ---

          # FACTS

          - AI coding assistants primarily improve individual developer speed but do not automatically improve system-level delivery throughput.
          - The INVEST principle for user stories means each story should be completable within one to five days of work.
          - Strategy and Factory design patterns are recommended in the article for isolating billing calculation formulas by plan type.
          - Spec-Driven Development is categorized by Birgitta Böckeler under a "spec-anchored" approach to AI-assisted development.
          - The REASONS acronym stands for Requirements, Entities, Approach, Structure, Operations, Norms, and Safeguards in SPDD.
          - SPDD is rated one star (not suitable) for purely creative or visual work tasks driven by aesthetic judgment.
          - SPDD is rated five stars for scaled standardized delivery and high compliance environments with hard architectural constraints.
          - The openspdd tool is a command-line tool implementing the SPDD workflow available as an open-source GitHub repository.
          - Functional testing via API scripts does not count toward code coverage metrics in standard software quality measurement.
          - The article itself was co-written using Claude 4.5 Sonnet, Claude 4.6 Opus, Gemini 3.1 Pro, and ChatGPT 5.4.
          - A one-way pipeline where requirements produce code causes intent drift when any later adjustment happens only in code.
          - The billing engine example achieved approximately 99% intent alignment between the structured prompt and generated implementation.
          - ISP (Interface Segregation Principle) and SRP (Single Responsibility Principle) are OOP principles referenced as architectural standards.
          - SPDD's governance overhead makes it a poor fit for exploratory spikes where the goal is rapid idea validation.
          - Larger organizations may layer a knowledge platform on top of openspdd to manage and reuse assets at scale.
          - Production risk becomes harder to reason about when the volume of AI-generated change rises without governance structures.
          - Ambiguous requirements become code quickly with AI assistance, and misunderstandings scale proportionally with generation speed increases.

          ---

          # REFERENCES

          - [openspdd](https://github.com/gszhangwei/open-spdd) — command-line tool implementing the SPDD workflow
          - [token-billing example repository](https://github.com/gszhangwei/token-billing) — GitHub repo with full SPDD example
          - [Spec-Driven Development](https://en.wikipedia.org/wiki/Spec-driven_development) — Wikipedia article on spec-driven development
          - Birgitta Böckeler's [spec-anchored categorization article](https://martinfowler.com/articles/exploring-gen-ai/sdd-3-tools.html) on martinfowler.com
          - [Abstraction First](https://martinfowler.com/articles/abstraction-first.html) — companion article on martinfowler.com
          - [Alignment](https://martinfowler.com/articles/alignment.html) — companion article on martinfowler.com
          - [Iterative Review](https://martinfowler.com/articles/iterative-review.html) — companion article on martinfowler.com
          - Richard W. Hamming — [The Art of Doing Science and Engineering](https://www.amazon.com/gp/product/9056995014/) book quoted in closing
          - Martin Fowler's definition of refactoring referenced in the logic corrections vs. refactoring section
          - Claude 4.5 Sonnet — AI model used in writing the article itself
          - Claude 4.6 Opus — AI model used in writing the article itself
          - Gemini 3.1 Pro — AI model used in writing the article itself
          - ChatGPT 5.4 — AI model used in writing the article itself
          - [spdd-story command template](https://github.com/gszhangwei/open-spdd/blob/v0.4.9/internal/templates/data/optional/spdd-story.md)
          - [spdd-analysis command template](https://github.com/gszhangwei/open-spdd/blob/v0.4.9/internal/templates/data/core/spdd-analysis.md)
          - [spdd-reasons-canvas command template](https://github.com/gszhangwei/open-spdd/blob/v0.4.9/internal/templates/data/core/spdd-reasons-canvas.md)
          - [spdd-generate command template](https://github.com/gszhangwei/open-spdd/blob/v0.4.9/internal/templates/data/core/spdd-generate.md)
          - [TEST-SCENARIOS-TEMPLATE.md](https://github.com/gszhangwei/token-billing/blob/after-enhancement/spdd/template/TEST-SCENARIOS-TEMPLATE.md)
          - [Enterprise Plan Volume-Based Tiered Billing](https://github.com/gszhangwei/token-billing/blob/after-enhancement/requirements/%5BUser-story-2%5DEnterprise-Plan-Volume-Based-Tiered-Billing.md) bonus exercise
          - AI-First Software Delivery (AIFSD) — organizational capability framework referenced in the article

          ---

          # ONE-SENTENCE TAKEAWAY
          Treat AI prompts as governed, versioned artifacts to transform individual speed into reliable organizational software delivery capability.

          ---

          # RECOMMENDATIONS

          - Version control your AI prompts alongside code to make them reviewable, reusable, and improvable over time.
          - Always clarify explicit scope boundaries—what is in and out—before generating any AI-assisted code implementation.
          - Use the REASONS Canvas structure to guide prompts from intent through design to execution and governance.
          - Adopt a "prompt first, code second" rule whenever a logic correction requires changing observable system behavior.
          - Build a reusable prompt library from successful delivery iterations to reduce team variability and reinvention costs.
          - Shift code reviews from finding bugs to verifying that implementation intent matches the structured prompt specification.
          - Practice abstraction-first thinking by defining object boundaries and collaborations before triggering any code generation.
          - Use iterative dialogue to update structured prompts rather than manually editing generated prompt files directly.
          - Apply SPDD only where governance ROI justifies overhead; skip it for hotfixes, spikes, and disposable scripts.
          - Sync code-side refactoring changes back into the structured prompt immediately to prevent prompt-code drift over time.
          - Deduplicate AI-generated test scenarios against existing tests before committing new test code to the repository.
          - Run regression tests after every round of cleanup to confirm no functional behavior changed during optimization.
          - Invest in the three meta-skills—abstraction, alignment, iterative review—as the core human value-add alongside AI.
          - Treat functional alignment early in analysis as "good enough to proceed" rather than waiting for perfect certainty.
          - Use template-driven structured prompts to generate unit tests even when dedicated testing commands aren't yet available.
          - Consider SPDD most seriously in financial core systems, multi-tenant platforms, and high-compliance regulated environments.
          - Accept that minor code smells in initial generation are fine; verify core functionality first, then optimize incrementally.
          - Frame AI-assisted development as a contest of engineer cognitive clarity, not a race to generate maximum code volume.
