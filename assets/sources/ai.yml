      - md: |
          # Top 5 OpenCode Skills That Actually 100x Your Workflow (Free)

          ## OVERVIEW

          - The video explores OpenCode, an AI coding agent, and highlights five essential 'skills' —packages of instructions, scripts, and reference materials—that significantly enhance workflow efficiency.
          - These skills allow developers to automate repetitive tasks, manage context, and standardize design outputs, ultimately saving tokens and time while improving code quality.

          ## What are OpenCode Skills?

          - Skills are modular add-ons for OpenCode that the agent loads on demand.
          - Because OpenCode is compatible with multiple directories (including Claude and Agent directories), many skills designed for other AI coding platforms work seamlessly within it without modification.

          ## The Top 5 [OpenCode](https://opencode.ai) Skills

          - These tools stack on top of each other without conflict.
          - All Skills are free, install in under five minutes, and are provider-agnostic, meaning they work regardless of whether you are running local models or cloud-based ones.
          - Consider switching to mid-tier models (like Sonnet or GPT-4o-mini) and capping 'thinking tokens' to further optimize costs while using these skills.

          ### [Graphify](https://graphifylabs.ai)

          - **Purpose:** Creates a searchable knowledge graph of any repository.
          - **Advantages:** Drastically reduces token usage (up to 71.5x) by reading the graph instead of thousands of lines of source code.
          - **Recommendation:** Essential for large monorepos or managing research notes/PDFs.

          ### [Awesome Design.md](https://github.com/VoltAgent/awesome-design)

          - **Purpose:** A collection of markdown-based design system specifications.
          - **Advantages:** Forces AI agents to follow specific brand guidelines (colors, typography, spacing), preventing design drift between different AI models (GPT, Claude, Gemini).

          ### [Get Shit Done (GSD)](https://github.com/gsd-build/get-shit-done)

          - **Purpose:** A project management and task-execution framework.
          - **Advantages:** Combines planning, execution, and verification phases to prevent 'context rot.' It uses atomic Git commits, making debugging significantly easier.
          - **Warning:** Best paired with OpenCode's read-only 'plan mode' to ensure the agent doesn't touch files during the discussion phase.

          ### [Everything Claude Code](https://github.com/affaan-m/everything-claude-code)

          - **Purpose:** A comprehensive, production-grade harness that includes 48+ specialized agents, testing (TDD), and security scanning.
          - **Advantages:** Includes 'Agent Shield,' which runs over 1,200 tests to find injection risks and leaked secrets.
          - **Recommendation:** Use this if you want an all-in-one suite rather than stitching smaller tools together.

          ### [UI UX Pro Max](https://github.com/nextlevelbuilder/ui-ux-pro-max)

          - **Purpose:** A reasoning engine that generates industry-specific design systems.
          - **Advantages:** Effectively avoids generic AI UI by applying industry-specific rules and 'anti-patterns'
            e.g., preventing neon colors in a beauty spa site
