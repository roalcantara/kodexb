# https://mise.jdx.dev
[tools]
bun = "1.3.14"
uv = "0.11.3"
usage = "latest"
hk = "1.45.0"
ast-grep = "latest"
tombi = "0.9.22"
actionlint = "latest"
hadolint = "latest"
gitleaks = "latest"
container-structure-test = "latest"
act = "latest"
gum = "latest"
biome = "latest"
shellcheck = "latest"
"npm:skills" = "1.5.10"

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"
GOVERNANCE_LEVEL="standard"
BLOCK_ON_THREAT="true"

[tasks]
"project" = { description = "Manage setup, dependencies, cleanup, icons, repository, and local maintenance", usage = '''
    cmd "setup" {}
    cmd "prepare" { flag "--ci" help="Install dependencies for CI" }
    cmd "clean" {}
    cmd "cleanup" {}
    cmd "reinstall" {}
    cmd "repo" {
        cmd "setup" {}
        cmd "prune" {}
        cmd "reset" {}
    }
    cmd "icons" {
        flag "--fix" help="Apply safe hex replacements"
    }
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    CMD="${usage_cmd:-}"
    case "$CMD" in
      setup)
        mise install --yes && mise run project prepare && mise run graph setup
        ;;
      prepare)
        bun install ${usage_ci:+--frozen-lockfile}
        if [[ "${usage_ci:-false}" == "false" ]]; then
          hk install --mise
          uv tool install --upgrade code-review-graph
          uv tool install --upgrade git+https://github.com/github/spec-kit.git
        fi
        ;;
      clean)
        rm -rf dist tmp .electrobun-cache
        ;;
      cleanup)
        mise run project clean
        rm -rf node_modules bun.lock*
        ;;
      reinstall)
        mise run project cleanup
        mise exec -- bun install
        ;;
      "repo setup")
        gh repo create kb --public --push --source=. 2>/dev/null || echo "Repo may already exist"
        ;;
      "repo prune")
        echo "WARNING: This will delete all tags, releases and the repo."
        read -rp "Type 'yes' to confirm: " c
        [[ "$c" == "yes" ]] || { echo "Aborted."; exit 0; }
        for tag in $(git tag -l); do git push origin --delete "$tag" 2>/dev/null; git tag -d "$tag"; done
        gh api repos/:owner/:name --silent && gh repo delete kb --yes || true
        ;;
      "repo reset")
        echo "DANGER: Rewrites git history."
        read -rp "Type 'yes' to confirm: " c
        [[ "$c" == "yes" ]] || { echo "Aborted."; exit 0; }
        for tag in $(git tag -l); do git push origin --delete "$tag" 2>/dev/null; git tag -d "$tag"; done
        git checkout main && git reset --hard "$(git rev-list --max-parents=0 HEAD)" && git push --force origin main
        ;;
      icons)
        if [[ "${usage_fix:-false}" == "true" ]]; then
          mise run _icons check --write-safe
        else
          mise run _icons check
        fi
        ;;
      *) echo "project: unknown action ${CMD}"; exit 2 ;;
    esac
  ''' }
"graph" = { description = "Install, configure, build, refresh, inspect, and watch the local CRG knowledge graph", usage = '''
    cmd "install" {}
    cmd "setup" {
        flag "--user-config" help="Also configure local-only Codex and Antigravity MCP files"
    }
    cmd "build" {}
    cmd "update" {}
    cmd "status" {}
    cmd "watch" {}
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail

    CMD="${usage_cmd:-}"
    REPO_ROOT="$(git rev-parse --show-toplevel)"

    install_crg() {

    }

    setup_repo_mcp() {
      local platform
      for platform in claude cursor opencode gemini-cli copilot; do
        code-review-graph install \
          --repo "$REPO_ROOT" \
          --platform "$platform" \
          --no-skills \
          --no-hooks \
          --no-instructions \
          -y
      done
    }

    setup_user_mcp() {
      local antigravity="$HOME/.gemini/antigravity/mcp_config.json"
      local backup
      local tmp

      code-review-graph install \
        --repo "$REPO_ROOT" \
        --platform codex \
        --no-skills \
        --no-hooks \
        --no-instructions \
        -y

      mkdir -p "$(dirname "$antigravity")"
      if [[ -e "$antigravity" ]]; then
        backup="$antigravity.bak.$(date +%Y%m%d%H%M%S)"
        cp "$antigravity" "$backup"
        echo "Backed up Antigravity MCP config to $backup"
      else
        printf '{"mcpServers":{}}\n' > "$antigravity"
      fi

      if ! jq empty "$antigravity"; then
        echo "graph setup: repair malformed Antigravity JSON at $antigravity, then retry" >&2
        exit 1
      fi

      tmp="$(mktemp)"
      if ! jq --arg cwd "$REPO_ROOT" '
        .mcpServers = (.mcpServers // {}) |
        .mcpServers["code-review-graph"] = {
          "command": "uvx",
          "args": ["code-review-graph", "serve"],
          "cwd": $cwd,
          "type": "stdio"
        }
      ' "$antigravity" > "$tmp"; then
        rm -f "$tmp"
        exit 1
      fi
      mv "$tmp" "$antigravity"
      jq empty "$antigravity"
    }

    case "$CMD" in
      install)
        install_crg
        ;;
      setup)
        install_crg
        setup_repo_mcp
        if [[ "${usage_user_config:-false}" == "true" ]]; then
          setup_user_mcp
        fi
        code-review-graph build
        ;;
      build)
        code-review-graph build
        ;;
      update)
        code-review-graph update --skip-flows
        ;;
      status)
        code-review-graph status
        ;;
      watch)
        exec code-review-graph watch --repo "$REPO_ROOT"
        ;;
      *)
        echo "graph: unknown action '${CMD}' (expected one of: install, setup, build, update, status, watch)" >&2
        exit 2
        ;;
    esac
  ''' }
"ci" = { description = "Run review, release, and publish CI workflows", usage = '''
    cmd "review" {
        flag "--lint" help="Run lint checks"
        flag "--test" help="Run tests"
        flag "--build" help="Run build smoke"
    }
    cmd "release" {
        flag "--check-signing" help="Check commit and tag signing"
        flag "--check-squash" help="Check HEAD is a single squash commit"
        flag "--dry-run" help="Dry run release-it"
        flag "--notes" help="Generate release notes"
    }
    cmd "publish" {
        cmd "build" {}
        cmd "package" {
            flag "--version <ver>" help="Release version"
            flag "--target <target>" help="Build target" { choices "linux-x64" "linux-arm64" "darwin-arm64" }
        }
        cmd "checksum" {}
    }
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    CMD="${usage_cmd:-}"
    if [[ -z "$CMD" ]]; then
      mise run project prepare --ci
      bun run lint
      mise run test ci
      ELECTROBUN_DEVELOPER_ID="" bun run build
      exit $?
    fi
    case "$CMD" in
      review)
        if [[ -z "${usage_lint:-}${usage_test:-}${usage_build:-}" ]]; then
          bun run lint
          mise run test ci
          ELECTROBUN_DEVELOPER_ID="" bun run build
        else
          if [[ "${usage_lint:-false}" == "true" ]]; then
            bun run lint
          fi
          if [[ "${usage_test:-false}" == "true" ]]; then
            mise run test ci
          fi
          if [[ "${usage_build:-false}" == "true" ]]; then
            ELECTROBUN_DEVELOPER_ID="" bun run build
          fi
        fi
        ;;
      release)
        if [[ "${usage_check_signing:-false}" != "true" && "${usage_check_squash:-false}" != "true" && "${usage_dry_run:-false}" != "true" && "${usage_notes:-false}" != "true" ]]; then
          echo "ci release: at least one flag required. Available: --check-signing, --check-squash, --dry-run, --notes" >&2
          exit 1
        fi
        if [[ "${usage_check_signing:-false}" == "true" ]]; then
            tmp="$(mktemp -d)"
            tag="signing-test-tag-$$"
            trap "rm -rf \"$tmp\"" EXIT
            cd "$tmp" && git init -q && git config commit.gpgsign true && git config tag.gpgsign true
            echo test > f.txt && git add f.txt && git commit -q -m "test: signing"
            git cat-file -p HEAD | grep -q "^gpgsig" || { echo "ERROR: commit not signed"; exit 1; }
            git tag -s "$tag" -m signing
            git cat-file -p "$tag" | grep -qE "BEGIN (PGP|SSH) SIGNATURE" || { echo "ERROR: tag not signed"; exit 1; }
            echo "OK: signed commit + signed tag verified."
        fi
        if [[ "${usage_check_squash:-false}" == "true" ]]; then
            bash tools/orchestration/scripts/check_squash_merge.sh
        fi
        if [[ "${usage_dry_run:-false}" == "true" ]]; then
          bunx release-it --dry-run --ci
        fi
        if [[ "${usage_notes:-false}" == "true" ]]; then
          bunx release-it --release-notes-only --dry-run --ci 2>/dev/null || true
        fi
        ;;
      "publish build")
        bun run build:prod
        ;;
      "publish package")
        : "${usage_version:?--version required}"
        target="${usage_target:-$(uname -s|tr A-Z a-z)-$(uname -m|sed -e s/x86_64/x64/ -e s/aarch64/arm64/)}"
        [[ "$target" == "darwin-x64" ]] && target=darwin-arm64
        case "$target" in
          linux-*) tar czf "kb-${usage_version}-${target}.tar.gz" -C dist . ;;
          darwin-*) DMG="$(find dist -maxdepth 3 -type f -name '*.dmg'|head -n1)"; [[ -n "$DMG" ]] || { echo "ERROR: no .dmg"; exit 1; }; suffix=""; [[ -z "${ELECTROBUN_DEVELOPER_ID:-}" ]] && suffix="-unsigned"; mv "$DMG" "kb-${usage_version}-${target}${suffix}.dmg" ;;
          *) echo "ERROR: unknown target $target"; exit 1 ;;
        esac
        ;;
      "publish checksum")
        shopt -s nullglob
        sha256sum *.tar.gz *.dmg 2>/dev/null > checksums.txt || true
        test -s checksums.txt && cat checksums.txt || echo "No artifacts"
        ;;
      *) echo "ci: unknown command $CMD"; exit 2 ;;
    esac
  ''' }
"test" = { description = "Run unit, CI, e2e preview, spec audit, style checks, and catalog tag tests", usage = '''
    cmd "unit" {}
    cmd "ci" {}
    cmd "spec-audit" {
      flag "--strict" help="Exit non-zero on findings"
    }
    cmd "spec-style" {
      flag "--strict" help="Exit non-zero on findings"
      flag "--scope <scope>" default="src" help="Limit spec-style to src, a path, or layer alias"
      flag "--format <format>" default="text" help="Spec-style output format" {
        choices "text" "markdown"
      }
      flag "--update-ledger" help="Update normalise-specs Phase 12 audit block"
    }
    cmd "e2e-preview" {}
    cmd "e2e" {
      flag "--smoke" help="P0 Gherkin smoke (@smoke) only"
      flag "--regression" help="P0+P1 Gherkin regression (@regression) only"
      flag "--debug" help="Playwright debug UI for BDD suite"
      flag "--metrics-report" help="Write tmp/bdd/e2e/metrics/latest.json from JUnit + scenario scores"
      flag "--metrics-compare" help="Compare latest metrics to tools/metrics/baselines/e2e-quality/quality-baseline.json"
      flag "--write-baseline" help="Maintainer: refresh tools/metrics/baselines/e2e-quality/quality-baseline.json"
    }
    cmd "tag" {
      flag "--list" help="List tagged executables; do not run tests"
      flag "--e2e" help="Include or run Gherkin layer only"
      flag "--unit" help="Include or run unit layer only"
      flag "--json" help="Machine-readable output (list mode)"
      arg "[key]" help="Catalog key (e.g. sync_frecency_preserve)"
      arg "[slice]" help="Optional AC slice id (e.g. sf1ac1 maps to @ac:SF-1_AC1)"
    }
  ''', run = "bun tools/bin/test.script.ts" }
"perf" = { description = "Run performance benchmark workflows (preview-server, workflow-observability)", usage = '''
    cmd "run" {
      flag "--port <port>" default="3457" help="Preview server port for run action"
    }
    cmd "baseline" {}
    cmd "compare" {}
    cmd "open" {}
    cmd "workflow-observability" {
      flag "--regression-pct <n>" default="20" help="Baseline p95 %% floor for regression delta"
      flag "--regression-min-delta-ms <n>" default="0.25" help="Min absolute p95 delta (ms) before regression"
      flag "--warmup <n>" default="10" help="Warmup iterations"
      flag "--iterations <n>" default="100" help="Sample count"
      flag "--absolute-p95-ms <label=ms>" help="Override WOBS absolute p95 cap (repeatable)"
      flag "--no-regression" help="Skip baseline comparison; still writes baseline JSON"
      flag "--no-absolute-limits" help="Skip WOBS absolute p95 caps"
      cmd "extract-dataset" {
        flag "--feature <dir>" help="Source feature directory to snapshot (required)"
        flag "--output <path>" default="tools/metrics/fixtures/perf/workflow-observability-feature.json" help="Output dataset JSON path"
      }
    }
  ''', run = "bun tools/metrics/harnesses/perf/perf.script.ts" }
"hooks" = { description = "Run tests for Cursor agent hooks (.cursor/hooks/)", usage = '''
    cmd "governance-audit" help="Governance audit threat-pattern unit tests"
  ''', run = "bun tools/bin/hooks.script.ts" }
"_icons" = { description = "Check and optionally fix SVG icon contrast", hide = true, usage = '''
    cmd "check" {}
    flag "--scope <scope>" help="Check scope" default="all" { choices "all" "brand" }
    flag "--strict" help="Exit non-zero on failure"
    flag "--write-safe" help="Apply safe hex replacements"
    flag "--min <min>" default="3" help="Minimum contrast ratio vs list shell background"
  ''', run = '''
    #!/usr/bin/env bun
    import { readdirSync } from 'node:fs'
    import path from 'node:path'

    /** Matches list.css `--theme-bg` (Andromeda Void shell). */
    const LIST_BG = '#0b0e14'
    /** WCAG 1.4.11 non-text contrast target for graphical objects (relaxed vs body text). */
    const DEFAULT_MIN_RATIO = 3
    /** Only these exact hex strings are rewritten with `--write-safe` (case-insensitive keys). */
    const SAFE_HEX_REPLACEMENTS: Record<string, string> = { '#24292f': '#e6edf3' }
    const HEX_IN_SVG = /#([0-9a-f]{3}|[0-9a-f]{6})\b/gi
    const RGB_IN_SVG = /rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)/gi
    const CHUNK = 80

    function die(msg: string, code = 1): never {
      console.error(msg)
      process.exit(code)
    }

    function chdirToGitRoot(): void {
      const r = Bun.spawnSync(['git', 'rev-parse', '--show-toplevel'])
      const root = r.stdout.toString().trim()
      if (!r.success || !root) die('icons: run from inside the app git checkout')
      process.chdir(root)
    }

    chdirToGitRoot()

    function parseArgs(argv: string[]) {
      const envScope = process.env.usage_scope
      let scope: 'brand' | 'all' = envScope === 'brand' || envScope === 'all' ? envScope : 'all'
      let writeSafe = process.env.usage_write_safe === 'true'
      let strict = process.env.usage_strict === 'true'
      let minRatio = DEFAULT_MIN_RATIO
      const envMin = process.env.usage_min
      if (envMin) {
        const n = Number(envMin)
        if (Number.isFinite(n) && n > 0) minRatio = n
      }
      for (const a of argv) {
        if (a === '--write-safe') writeSafe = true
        else if (a === '--strict') strict = true
        else if (a.startsWith('--scope=')) {
          const v = a.slice(8)
          if (v === 'brand' || v === 'all') scope = v
          else die(`Unknown --scope=${v} (use brand|all)`, 2)
        } else if (a.startsWith('--min=')) {
          minRatio = Number(a.slice(6))
          if (!Number.isFinite(minRatio) || minRatio <= 0) die(`Invalid --min=${a}`, 2)
        }
      }
      return { scope, writeSafe, strict, minRatio }
    }

    function expandShorthandHex(hex: string): string {
      const h = hex.slice(1).toLowerCase()
      if (h.length === 3) return `#${[...h].map(c => c + c).join('')}`
      if (h.length === 6) return `#${h}`
      return hex.toLowerCase()
    }

    function hexToRgb(hex: string): { r: number; g: number; b: number } | null {
      const m = /^#([0-9a-f]{6})$/.exec(expandShorthandHex(hex.startsWith('#') ? hex : `#${hex}`))
      if (!m?.[1]) return null
      const n = Number.parseInt(m[1], 16)
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }
    }

    function relativeLuminance(rgb: { r: number; g: number; b: number }): number {
      const ch = (u: number) => {
        const c = u / 255
        return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4
      }
      return 0.2126 * ch(rgb.r) + 0.7152 * ch(rgb.g) + 0.0722 * ch(rgb.b)
    }

    function contrastRatio(fgHex: string, bgHex: string): number | null {
      const fg = hexToRgb(fgHex)
      const bg = hexToRgb(bgHex)
      if (!fg || !bg) return null
      const l1 = relativeLuminance(fg)
      const l2 = relativeLuminance(bg)
      return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05)
    }

    function hasLightAndNearBlack(samples: string[]): boolean {
      let hasLight = false
      let hasNearBlack = false
      for (const raw of samples) {
        const rgb = hexToRgb(raw)
        if (!rgb) continue
        const L = relativeLuminance(rgb)
        if (L > 0.28) hasLight = true
        if (L < 0.12) hasNearBlack = true
        if (hasLight && hasNearBlack) return true
      }
      return false
    }

    function collectHexSamples(svgText: string): string[] {
      const out = new Set<string>()
      for (const m of svgText.matchAll(HEX_IN_SVG)) {
        if (m[1] !== undefined) out.add(expandShorthandHex(`#${m[1]}`))
      }
      for (const m of svgText.matchAll(RGB_IN_SVG)) {
        const r = Number(m[1])
        const g = Number(m[2])
        const b = Number(m[3])
        if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
          const clamp = (n: number) => Math.min(255, Math.max(0, Math.round(n)))
          const h = (n: number) => clamp(n).toString(16).padStart(2, '0')
          out.add(expandShorthandHex(`#${h(r)}${h(g)}${h(b)}`))
        }
      }
      return [...out]
    }

    async function loadBrandBasenames(root: string): Promise<string[]> {
      const dir = path.join(root, 'src/shell/renderer/constants')
      const [tag, ent] = await Promise.all([
        import(path.join(dir, 'tag_brand_svg_map.const.ts')),
        import(path.join(dir, 'entry_type_icon_basename.const.ts'))
      ])
      const t = tag as { TAG_BRAND_SVG_BASENAME: Record<string, string> }
      const e = ent as { ENTRY_TYPE_DEFAULT_SVG_BASENAME: Record<string, string> }
      return [
        ...new Set([...Object.values(t.TAG_BRAND_SVG_BASENAME), ...Object.values(e.ENTRY_TYPE_DEFAULT_SVG_BASENAME)])
      ].sort()
    }

    function listSvgBasenames(imagesDir: string): string[] {
      return readdirSync(imagesDir)
        .filter(n => n.endsWith('.svg'))
        .map(n => n.replace(/\.svg$/i, ''))
        .sort()
    }

    function applySafeReplacements(content: string): { next: string; hits: number } {
      let next = content
      let hits = 0
      for (const [from, to] of Object.entries(SAFE_HEX_REPLACEMENTS)) {
        next = next.replace(new RegExp(from, 'gi'), m => {
          if (m.toLowerCase() !== from.toLowerCase()) return m
          hits += 1
          return to
        })
      }
      return { next, hits }
    }

    type ScanRow =
      | { base: string; missing: true }
      | { base: string; missing: false; bad: { hex: string; ratio: number }[]; written: boolean }

    async function scanOne(imagesDir: string, base: string, writeSafe: boolean, minRatio: number): Promise<ScanRow> {
      const filePath = path.join(imagesDir, `${base}.svg`)
      const file = Bun.file(filePath)
      if (!(await file.exists())) {
        console.warn(`missing: ${base}.svg`)
        return { base, missing: true }
      }

      let text = await file.text()
      let written = false
      if (writeSafe) {
        const { next, hits } = applySafeReplacements(text)
        if (hits > 0 && next !== text) {
          await Bun.write(filePath, next)
          written = true
          console.log(`write-safe: ${base}.svg (${hits} replacement(s))`)
          text = next
        }
      }

      const samples = collectHexSamples(text)
      const dualTone = hasLightAndNearBlack(samples)
      const bad = samples.flatMap(hex => {
        const rgb = hexToRgb(hex)
        if (!rgb || (dualTone && relativeLuminance(rgb) < 0.12)) return []
        const ratio = contrastRatio(hex, LIST_BG)
        return ratio !== null && ratio < minRatio ? [{ hex, ratio }] : []
      })
      return { base, missing: false, bad, written }
    }

    async function main() {
      const root = process.cwd()
      const imagesDir = path.join(root, 'assets/images')
      const { scope, writeSafe, strict, minRatio } = parseArgs(process.argv.slice(2))
      const basenames = scope === 'brand' ? await loadBrandBasenames(root) : listSvgBasenames(imagesDir)

      const rows: ScanRow[] = []
      for (let i = 0; i < basenames.length; i += CHUNK) {
        const part = await Promise.all(
          basenames.slice(i, i + CHUNK).map(base => scanOne(imagesDir, base, writeSafe, minRatio))
        )
        rows.push(...part)
      }

      let failures = 0
      let filesWritten = 0
      for (const row of rows) {
        if (row.missing) continue
        if (row.written) filesWritten += 1
        if (row.bad.length === 0) continue
        failures += 1
        const line = row.bad
          .toSorted((a, b) => a.ratio - b.ratio)
          .map(x => `${x.hex} (${x.ratio.toFixed(2)}:1)`)
          .join(', ')
        console.log(`FAIL ${row.base}.svg  <${minRatio}:1  vs ${LIST_BG}  →  ${line}`)
      }

      console.log('')
      console.log(
        `scope=${scope}  files=${basenames.length}  failing=${failures}  minRatio=${minRatio}  writeSafe=${writeSafe}  strict=${strict}  written=${filesWritten}`
      )
      if (failures > 0) {
        console.log(
          'Hint: add targeted entries to SAFE_HEX_REPLACEMENTS and run with --write-safe; use --strict to fail CI'
        )
        if (strict) process.exit(1)
      }
    }

    await main()

  ''' }
"lint" = { description = "Run lint, strict lint, fix, report, and graph workflows", usage = '''
    cmd "check" {
      flag "--biome" help="Run Biome"
      flag "--knip" help="Run Knip"
      flag "--depcruise" help="Run dependency-cruiser"
      flag "--jscpd" help="Run jscpd"
      flag "--ls" help="Run ls-lint"
      flag "--hadolint" help="Run hadolint on Dockerfile"
      flag "--ast-grep" help="Run ast-grep"
      flag "--mise" help="Run tombi on mise.toml"
      flag "--typecheck" help="Run TypeScript check"
      flag "--ci" help="Use CI reporters and write under tmp/reports/linters"
    }
    cmd "fix" {
      flag "--biome" help="Fix Biome findings"
      flag "--ast-grep" help="Apply ast-grep rewrites"
      flag "--typecheck" help="Run TypeScript check after fixes"
      flag "--knip" help="Fail with guidance; Knip has no fixer"
    }
    cmd "graph" {}
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail

    is_true() { [[ "${1:-false}" == "true" ]]; }

    lint_flag_set=false
    is_true "${usage_biome:-false}" && lint_flag_set=true
    is_true "${usage_knip:-false}" && lint_flag_set=true
    is_true "${usage_depcruise:-false}" && lint_flag_set=true
    is_true "${usage_jscpd:-false}" && lint_flag_set=true
    is_true "${usage_ls:-false}" && lint_flag_set=true
    is_true "${usage_hadolint:-false}" && lint_flag_set=true
    is_true "${usage_ast_grep:-false}" && lint_flag_set=true
    is_true "${usage_mise:-false}" && lint_flag_set=true
    is_true "${usage_typecheck:-false}" && lint_flag_set=true
    want() {
      if [[ "$lint_flag_set" == "false" ]]; then
        return 0
      fi
      is_true "${1:-false}"
    }

    graph() {
      mkdir -p tmp/reports
      bunx depcruise . --config .dependency-cruiser.cjs --include-only '^.' --output-type mermaid --output-to tmp/reports/dependency-graph.mmd
    }

    if is_true "${usage_ci:-false}"; then
      mkdir -p tmp/reports/linters
    fi

    clear_local_jscpd_report() {
      if ! is_true "${usage_ci:-false}"; then
        rm -rf tmp/reports/linters/jscpd
      fi
    }

    run_biome() {
      if is_true "${usage_ci:-false}"; then
        bunx biome check --reporter=github
      else
        clear_local_jscpd_report
        bun run lint:biome:strict
      fi
    }

    run_knip() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:knip -- --reporter compact | tee tmp/reports/linters/knip.txt
      else
        bun run lint:knip
      fi
    }

    run_depcruise() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:depcruise -- --output-type json --output-to tmp/reports/linters/depcruise.json
      else
        bun run lint:depcruise
      fi
    }

    run_jscpd() {
      if is_true "${usage_ci:-false}"; then
        bunx jscpd . --noTips --reporters json,console --output tmp/reports/linters/jscpd
      else
        bun run lint:jscpd
      fi
    }

    run_ls() {
      if is_true "${usage_ci:-false}"; then
        bunx @ls-lint/ls-lint | tee tmp/reports/linters/ls-lint.txt
      else
        bun run lint:ls
      fi
    }

    run_hadolint() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:hadolint | tee tmp/reports/linters/hadolint.txt
      else
        bun run lint:hadolint
      fi
    }

    run_ast_grep() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:ast-grep | tee tmp/reports/linters/ast-grep.txt
      else
        bun run lint:ast-grep
      fi
    }

    run_mise() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:mise | tee tmp/reports/linters/mise.txt
      else
        bun run lint:mise
      fi
    }

    run_renderer_css_tokens() {
      bun run lint:renderer-css
    }

    run_spec_testing_guide() {
      bun run lint:spec-guide
    }

    run_tools_layout() {
      bun tools/governance/policies/layout_validate.script.ts
    }

    case "${usage_cmd:-check}" in
      check)
        e=0
        want "${usage_typecheck:-false}" && { bun run typecheck || e=1; }
        want "${usage_biome:-false}" && { run_biome || e=1; }
        want "${usage_knip:-false}" && { run_knip || e=1; }
        want "${usage_depcruise:-false}" && { run_depcruise || e=1; }
        want "${usage_mise:-false}" && { run_mise || e=1; }
        want "${usage_jscpd:-false}" && { run_jscpd || e=1; }
        want "${usage_ls:-false}" && { run_ls || e=1; }
        want "${usage_hadolint:-false}" && { run_hadolint || e=1; }
        want "${usage_ast_grep:-false}" && { run_ast_grep || e=1; }
        run_renderer_css_tokens || e=1
        run_spec_testing_guide || e=1
        run_tools_layout || e=1
        exit "$e"
        ;;
      fix)
        e=0
        fix_flag_set=false
        is_true "${usage_ast_grep:-false}" && fix_flag_set=true
        is_true "${usage_biome:-false}" && fix_flag_set=true
        is_true "${usage_typecheck:-false}" && fix_flag_set=true
        if is_true "${usage_knip:-false}"; then
          echo "lint fix: --knip has no fixer; use 'mise run lint check --knip'" >&2
          e=1
        fi
        if [[ "$fix_flag_set" == "false" && "$e" == "0" ]]; then
          bun run lint:ast-grep:fix || e=1
          bun run lint:biome:fix || e=1
        else
          is_true "${usage_ast_grep:-false}" && { bun run lint:ast-grep:fix || e=1; }
          is_true "${usage_biome:-false}" && { bun run lint:biome:fix || e=1; }
          is_true "${usage_typecheck:-false}" && { bun run typecheck || e=1; }
        fi
        exit "$e"
        ;;
      graph)
        graph
        ;;
      *)
        echo "lint: unknown command ${usage_cmd:-}" >&2
        exit 2
        ;;
    esac
  ''' }
"app" = { description = "Manage Electrobun dev lifecycle and gates", usage = '''
    flag "--stop" help="Stop the electrobun dev --watch process only"
    flag "--check" help="Print whether kb-dev or the watcher is running"
    flag "--quit" help="Quit kb-dev via AppleScript (graceful)"
    flag "--kill" help="Quit kb-dev, kill its process tree, and stop the watcher"
    cmd "styles" help="Compile Tailwind v4 renderer CSS" {
      flag "--watch" help="Rebuild when sources change (dev)"
    }
    cmd "gates" help="Run quality and/or policy gates" {
      flag "--quality" help="Run the full app quality gate"
      flag "--policy" help="Run embedded policy checks only"
      flag "--all" help="Run quality + policy gates"
    }
    cmd "start" help="Start dev (package.json dev script; includes --watch)" {
      arg "[level]" help="Log level preset" {
        choices "verbose" "debug" "trace"
      }
      flag "--cef" help="Use CEF renderer (ELECTROBUN_RENDERER=cef)"
      flag "--open-devtools" help="Print CEF DevTools URLs for kb renderer (Cmd+click; requires --cef)"
      flag "--force" help="Tear down any running kb-dev and watcher before start"
    }
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail

    APP_STYLES_INPUT="src/shell/renderer/styles/app.css"
    APP_STYLES_OUTPUT="src/shell/renderer/styles/generated/app.css"

    app_styles_once() {
      mkdir -p src/shell/renderer/styles/generated
      bunx @tailwindcss/cli -i "$APP_STYLES_INPUT" -o "$APP_STYLES_OUTPUT" --minify
    }

    app_styles_watch() {
      mkdir -p src/shell/renderer/styles/generated
      bunx @tailwindcss/cli -i "$APP_STYLES_INPUT" -o "$APP_STYLES_OUTPUT" --watch
    }

    app_stop_watcher() {
      if pkill -f "electrobun dev --watch" 2>/dev/null; then
        echo "app: stopped electrobun dev --watch"
      else
        echo "app: no electrobun dev --watch process found"
      fi
    }

    app_teardown() {
      echo "app: tearing down kb-dev and watcher..."
      osascript -e 'quit app "kb-dev"' 2>/dev/null || true
      sleep 0.5
      pkill -f 'kb-dev.app' 2>/dev/null || true
      app_stop_watcher
      echo "app: teardown complete"
    }

    app_print_devtools_link_when_ready() {
      echo "app: waiting for CEF DevTools ..."
      for _ in $(seq 1 120); do
        if curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
          # #region agent log
          bun -e "const t=await fetch('http://127.0.0.1:9222/json/list').then(r=>r.json());const fs=require('node:fs');fs.appendFileSync('/Users/roalcantara/Work/bun/kb/.cursor/debug-98e08a.log',JSON.stringify({sessionId:'98e08a',hypothesisId:'A',location:'mise.toml:app_print_devtools',message:'cef_json_list',data:{targets:t},timestamp:Date.now()})+'\n')" 2>/dev/null || true
          # #endregion
          echo "app: kb UI is the kb-dev window (Dock). DevTools below inspect the renderer only."
          echo "app: Cmd+click the kb inspector URL (not the target list) to debug views://shell in Cursor Browser:"
          inspector_url="$(curl -sf http://127.0.0.1:9222/json/list | bun -e "
            const targets = await Bun.stdin.json();
            const kb = targets.find((t) => String(t.url ?? '').includes('views://shell'));
            if (!kb?.webSocketDebuggerUrl) process.exit(1);
            const ws = String(kb.webSocketDebuggerUrl).replace(/^ws:\\/\\//, '');
            console.log('http://127.0.0.1:9222/devtools/inspector.html?ws=' + ws);
          " 2>/dev/null || true)"
          if [[ -n "${inspector_url:-}" ]]; then
            echo "${inspector_url}"
          else
            echo "http://localhost:9222"
            echo "app: open the target titled kb (views://shell/index.html), not the blank inspector chrome"
          fi
          echo "app: or use Run and Debug → Attach to kb renderer (CEF) in .vscode/launch.json"
          return 0
        fi
        sleep 1
      done
      echo "app: DevTools did not become ready within 120s" >&2
      return 1
    }

  case "${usage_cmd:-}" in
    styles)
      if [[ "${usage_watch:-false}" == "true" ]]; then
        app_styles_watch
      else
        app_styles_once
      fi
      ;;
    gates)
      ran=false
      if [[ "${usage_quality:-false}" == "true" ]]; then
        ran=true
        echo "app gates: running quality gate..."
        bash .agents/skills/app-quality-gate/scripts/gate.sh
      fi
      if [[ "${usage_policy:-false}" == "true" ]]; then
        ran=true
        echo "app gates: running policy gate..."
        GATE_EMBEDDED_POLICY=1 bash .agents/skills/app-quality-gate/scripts/gate_policy.sh
      fi
      if [[ "$ran" != "true" ]]; then
        echo "app gates: pass --quality and/or --policy" >&2
        exit 2
      fi
      ;;
    start)
      if [[ "${usage_force:-false}" == "true" ]]; then
        app_teardown
      fi
      if [[ "${usage_open_devtools:-false}" == "true" ]]; then
        if [[ "${usage_cef:-false}" != "true" ]]; then
          echo "app: --open-devtools requires --cef (DevTools listen on http://localhost:9222)" >&2
          exit 2
        fi
        app_print_devtools_link_when_ready &
      fi
      start_env=()
      start_label="bun run dev"
      if [[ "${usage_cef:-false}" == "true" ]]; then
        start_env+=(ELECTROBUN_RENDERER=cef)
        start_label="ELECTROBUN_RENDERER=cef ${start_label}"
      fi
      case "${usage_level:-}" in
        verbose|debug|trace)
          start_env+=(LOG_LEVEL="${usage_level}")
          start_label="LOG_LEVEL=${usage_level} ${start_label}"
          ;;
      esac
      echo "app: starting (${start_label})..."
      app_styles_once
      app_styles_watch &
      tw_pid=$!
      trap 'kill "$tw_pid" 2>/dev/null || true' EXIT INT TERM
      if [[ "${usage_cef:-false}" == "true" || -n "${usage_level:-}" ]]; then
        exec env "${start_env[@]}" bun run dev
      else
        exec bun run dev
      fi
      ;;
    "")
      handled=false
      if [[ "${usage_stop:-false}" == "true" ]]; then
        handled=true
        app_stop_watcher
      fi
      if [[ "${usage_check:-false}" == "true" ]]; then
        handled=true
        echo "app: process check (kb-dev | electrobun dev):"
        if pgrep -fl 'kb-dev|electrobun dev' >/dev/null; then
          pgrep -fl 'kb-dev|electrobun dev'
        else
          echo "app: nothing running"
        fi
      fi
      if [[ "${usage_quit:-false}" == "true" ]]; then
        handled=true
        echo "app: quitting kb-dev..."
        osascript -e 'quit app "kb-dev"' || exit 1
        echo "app: quit sent"
      fi
      if [[ "${usage_kill:-false}" == "true" ]]; then
        handled=true
        app_teardown
      fi
      if [[ "$handled" != "true" ]]; then
        echo "app: pass a subcommand (start, gates) or a flag (--stop, --check, --quit, --kill)" >&2
        echo "app: run 'mise run app --help' for usage" >&2
        exit 2
      fi
      ;;
    *)
      echo "app: unknown subcommand '${usage_cmd}'" >&2
      exit 2
      ;;
  esac
  ''' }
"policy" = { description = "Check Mise task policy and usage specs", quiet = true, usage = '''
    cmd "check" {
      flag "--format <format>" help="Output format" default="text" {
        choices "text" "json"
      }
      flag "--strict" help="Treat non-info findings as failures"
    }
    cmd "report" {
      flag "--format <format>" help="Output format" default="text" {
        choices "text" "json"
      }
    }
  ''', run = '''
    #!/usr/bin/env bun

    const TASK_SEPARATOR = ':'
    const COMPLEX_SCRIPT_PATTERN = /(&&|\|\||;|\||>|<|\bmkdir\b|\brm\b|\btee\b)/
    const TABLE_TASK_PATTERN = /^\[tasks\."?([^"\]]+)"?\]/gm
    const EXPECTED_PUBLIC_TASKS = [
      ['app', 'Manage Electrobun dev lifecycle and gates'],
      ['catalog', 'Shipped-feature registry (catalog.yaml metadata)'],
      ['ci', 'Run review, release, and publish CI workflows'],
      ['docker', 'Build, run, and test the Docker image'],
      ['graph', 'Install, configure, build, refresh, inspect, and watch the local CRG knowledge graph'],
      ['hooks', 'Install and manage git hooks'],
      ['lint', 'Run lint, strict lint, fix, report, and graph workflows'],
      ['perf', 'Run preview-server performance benchmark workflows'],
      ['policy', 'Check Mise task policy and usage specs'],
      ['project', 'Manage setup, dependencies, cleanup, icons, repository, and local maintenance'],
      ['skill', 'Validate, generate, install, and report skill registry artifacts'],
      ['spec', 'SDD spec hub: lint, trace, gate, test, workflow, audit, scaffold'],
      ['test', 'Run unit, CI, e2e preview, spec audit, and style checks'],
    ] as const
    const EXPECTED_PACKAGE_SCRIPTS = [
      'start', 'dev', 'dev:cef', 'dev:verbose', 'dev:debug', 'dev:trace', 'dev:kill',
      'build', 'build:prod', 'build:insecure-local', 'test', 'typecheck',
      'lint', 'lint:strict', 'lint:fix', 'lint:biome', 'lint:biome:strict',
      'lint:biome:fix', 'lint:biome:format', 'lint:mise', 'lint:knip',
      'lint:depcruise', 'lint:jscpd', 'lint:ls', 'lint:hadolint', 'lint:ast-grep',
      'lint:ast-grep:fix', 'e2e:preview:install', 'e2e:preview', 'e2e:preview:ui',
    ] as const
    const SPLIT_FAMILY_PREFIXES: string[] = []
    const ACTION = process.env.usage_cmd ?? 'check'
    const FORMAT = process.env.usage_format ?? 'text'
    const STRICT = process.env.usage_strict === 'true'

    type FindingSeverity = 'error' | 'warn' | 'info'
    type Finding = { severity: FindingSeverity; code: string; target: string; message: string }
    type TaskConfig = { description?: string; hide?: boolean; run?: string | string[]; usage?: string }
    type UsageArg = { name?: string; choices?: { choices?: string[] } }
    type UsageJson = { cmd?: { args?: UsageArg[]; flags?: Array<{ name?: string }> } }
    type PolicyContext = { miseText: string; tasks: Record<string, TaskConfig>; scripts: Record<string, string> }

    function die(msg: string, code = 1): never {
      console.error(msg)
      process.exit(code)
    }

    function chdirToGitRoot(): void {
      const r = Bun.spawnSync(['git', 'rev-parse', '--show-toplevel'])
      const root = r.stdout.toString().trim()
      if (!r.success || !root) die('policy: run from inside the app git checkout')
      process.chdir(root)
    }

    chdirToGitRoot()

    if (ACTION !== 'check' && ACTION !== 'report') {
      die(`policy: unknown action ${ACTION} (use check|report)`, 2)
    }

    function isRecord(value: unknown): value is Record<string, unknown> {
      return typeof value === 'object' && value !== null
    }

    async function readContext(): Promise<PolicyContext> {
      const [miseText, packageConfig] = await Promise.all([
        Bun.file('mise.toml').text(),
        Bun.file('package.json').json() as Promise<{ scripts?: Record<string, string> }>,
      ])
      const tasksRaw = (Bun.TOML.parse(miseText) as { tasks?: unknown }).tasks
      const tasks = isRecord(tasksRaw)
        ? Object.fromEntries(Object.entries(tasksRaw).filter((e): e is [string, TaskConfig] => isRecord(e[1])))
        : {}
      return { miseText, tasks, scripts: packageConfig.scripts ?? {} }
    }

    function runUsage(command: string[], spec: string): { ok: boolean; output: string } {
      const r = Bun.spawnSync(['usage', ...command], { stdin: new TextEncoder().encode(spec) })
      return {
        ok: r.success,
        output: `${r.stdout.toString()}${r.stderr.toString()}`.trim(),
      }
    }

    function parseUsageJson(spec: string): UsageJson | undefined {
      const result = runUsage(['generate', 'json', '-f', '-'], spec)
      if (!result.ok) return
      return JSON.parse(result.output) as UsageJson
    }

    function checkOneUsageSpec(name: string, usage: string): Finding[] {
      const spec = `name ${JSON.stringify(name)}\n${usage}`
      const findings: Finding[] = []
      const lint = runUsage(['lint', '-W', '-'], spec)
      if (!lint.ok) findings.push({ severity: 'error', code: 'usage-lint', target: name, message: lint.output })
      const usageJson = parseUsageJson(spec)
      if (usageJson === undefined) {
        findings.push({ severity: 'error', code: 'usage-json', target: name, message: 'Usage JSON generation failed.' })
        return findings
      }
      return findings
    }

    function checkUsageSpecs(tasks: Record<string, TaskConfig>): Finding[] {
      return Object.entries(tasks).flatMap(([name, task]) =>
        typeof task.usage === 'string' ? checkOneUsageSpec(name, task.usage) : [],
      )
    }

    function checkTableStyleTasks(miseText: string, tasks: Record<string, TaskConfig>): Finding[] {
      return [...miseText.matchAll(TABLE_TASK_PATTERN)].flatMap(match => {
        const name = match[1]
        if (!name) return []
        const task = tasks[name]
        if (!task || task.run || task.usage) return []
        return [
          {
            severity: 'warn' as const,
            code: 'table-task',
            target: name,
            message: 'Prefer an inline task object under [tasks].',
          },
        ]
      })
    }

    function checkDeprecatedTasks(tasks: Record<string, TaskConfig>): Finding[] {
      return Object.entries(tasks)
        .filter(([, task]) => task.description?.includes('DEPRECATED'))
        .map(([name]) => ({
          severity: 'warn' as const,
          code: 'deprecated-task',
          target: name,
          message: 'Remove deprecated task names before enforcing policy.',
        }))
    }

    function checkSplitFamilies(tasks: Record<string, TaskConfig>): Finding[] {
      const names = Object.keys(tasks)
      return SPLIT_FAMILY_PREFIXES.flatMap(prefix => {
        const members = names.filter(name => name.startsWith(`${prefix}${TASK_SEPARATOR}`))
        if (members.length === 0) return []
        return [
          {
            severity: 'info' as const,
            code: 'split-family',
            target: prefix,
            message: `Evaluate merging related tasks: ${members.sort().join(', ')}.`,
          },
        ]
      })
    }

    function checkPackageScripts(scripts: Record<string, string>): Finding[] {
      const findings: Finding[] = []
      const actual = Object.keys(scripts)
      if (JSON.stringify(actual) !== JSON.stringify(EXPECTED_PACKAGE_SCRIPTS)) {
        findings.push({
          severity: 'error',
          code: 'package-script-surface',
          target: 'package.json',
          message: `Expected package scripts ${EXPECTED_PACKAGE_SCRIPTS.join(', ')}; got ${actual.join(', ')}.`,
        })
      }
      findings.push(...Object.entries(scripts)
        .filter(([, command]) => COMPLEX_SCRIPT_PATTERN.test(command) && !command.startsWith('mise run '))
        .map(([name, command]) => ({
          severity: 'info' as const,
          code: 'complex-package-script',
          target: name,
          message: `Evaluate moving this script behind Mise: ${command}`,
        })))
      return findings
    }

    function checkPublicTaskSurface(tasks: Record<string, TaskConfig>): Finding[] {
      const actual = Object.entries(tasks)
        .filter(([, task]) => task.hide !== true)
        .map(([name, task]) => [name, task.description ?? ''] as const)
        .sort(([a], [b]) => a.localeCompare(b))
      if (JSON.stringify(actual) === JSON.stringify(EXPECTED_PUBLIC_TASKS)) return []
      return [{
        severity: 'error' as const,
        code: 'public-task-surface',
        target: 'mise.toml',
        message: `Expected public tasks ${EXPECTED_PUBLIC_TASKS.map(([name]) => name).join(', ')}; got ${actual.map(([name]) => name).join(', ')}.`,
      }]
    }

    function checkMissingPackageScriptReferences(ctx: PolicyContext): Finding[] {
      const scriptNames = new Set(Object.keys(ctx.scripts))
      const refs = [...ctx.miseText.matchAll(/\bbun run ([A-Za-z0-9:_-]+)/g)]
        .map(match => match[1])
        .filter((name): name is string => name !== undefined)
      return [...new Set(refs)]
        .filter(name => !scriptNames.has(name))
        .map(name => ({
          severity: 'error' as const,
          code: 'missing-package-script-reference',
          target: name,
          message: `mise.toml references removed package script '${name}'.`,
        }))
    }

    function checkUsageActionReferences(miseText: string): Finding[] {
      const legacyEnv = 'usage_' + 'action'
      const legacyPattern = new RegExp(`\\bprocess\\.env\\.${legacyEnv}\\b|\\$\\{${legacyEnv}\\b`)
      return legacyPattern.test(miseText)
        ? [{
            severity: 'error' as const,
            code: 'usage-action-reference',
            target: 'mise.toml',
            message: 'Use usage_cmd for task command dispatch.',
          }]
        : []
    }

    async function collectFindings(): Promise<Finding[]> {
      const ctx = await readContext()
      return [
        ...checkUsageSpecs(ctx.tasks),
        ...checkPublicTaskSurface(ctx.tasks),
        ...checkTableStyleTasks(ctx.miseText, ctx.tasks),
        ...checkDeprecatedTasks(ctx.tasks),
        ...checkSplitFamilies(ctx.tasks),
        ...checkPackageScripts(ctx.scripts),
        ...checkMissingPackageScriptReferences(ctx),
        ...checkUsageActionReferences(ctx.miseText),
      ]
    }

    function printText(findings: Finding[]) {
      if (findings.length === 0) {
        console.log('policy check: no findings')
        return
      }
      console.log(`policy check: ${findings.length} finding(s)`)
      for (const f of findings) {
        console.log(`[${f.severity}] ${f.code} ${f.target}: ${f.message}`)
      }
    }

    try {
      const findings = await collectFindings()
      if (FORMAT === 'json') {
        console.log(JSON.stringify({ findings }, null, 2))
      } else {
        printText(findings)
      }
      if (STRICT && findings.length > 0) process.exit(1)
    } catch (error) {
      die(error instanceof Error ? error.message : String(error), -1)
    }

  ''' }
"skill" = { description = "Validate, generate, install, and report skill registry artifacts", usage = '''
cmd "validate" {
  flag "--raw" help="Plain text output (no gum)"
  flag "--json" help="Machine-readable JSON output"
}
cmd "sync" {
  flag "--dry-run" help="Validate intended writes without changing files"
}
cmd "install" {
  flag "--dry-run" help="Print install plan without running Skills CLI"
}
cmd "all" {
  flag "--dry-run" help="Dry-run sync and install"
}
cmd "report" {
  flag "--json" help="Print machine-readable report output"
  flag "--raw" help="Plain text output (no gum)"
  flag "--list-skills" help="Append full skill catalog after dashboard"
}
cmd "list" {
  flag "--raw" help="Plain text output (no gum)"
  flag "--json" help="Machine-readable JSON output"
  flag "--verbose" help="Include usage summary and load triggers"
  flag "--owned" help="Include owned skills"
  flag "--project" help="Include project skills"
  flag "--include-global" help="Include global skills"
  flag "--installed" help="Only installed skills"
  flag "--missing" help="Only skills missing on disk"
}
cmd "add" {
  arg "<url>" help="Skill package URL or repo"
  flag "--type" help="Policy type: optional, reference, required, or routed"
  flag "--rationale" help="Registry rationale (required for routed)"
