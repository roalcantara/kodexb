# https://mise.jdx.dev
[tools]
bun = "1.3.13"
usage = "latest"
pre-commit = "4.4"
ast-grep = "latest"
tombi = "0.9.22"
actionlint = "latest"

[tasks]
"prepare" = { description = "Install dependencies and hooks", usage = '''
    flag "--ci" help="Install dependencies for CI"
  ''', run = '''
    #!/usr/bin/env bash
    bun install $($usage_ci && echo '--frozen-lockfile')
    $usage_ci || pre-commit install --hook-type commit-msg
  ''' }
"setup" = { description = "Install tools and dependencies", run = '''
    #!/usr/bin/env bash
    mise install --yes && mise run prepare
  ''' }
"ci:review" = { description = "Mirror review.yml end-to-end (lint + test + build smoke)", depends = [
  "prepare"
], run = '''
    #!/usr/bin/env bash
    set -e
    mise run ci:review:lint
    mise run ci:review:test
    mise run ci:review:build
  ''' }
"ci:review:lint" = { description = "Run the full Phase-1 lint chain", run = "bun run lint" }
"ci:review:test" = { description = "Run tests with JUnit + coverage (CI shape)", run = "bun run test:ci" }
"e2e:preview" = { description = "Playwright smoke against tools/preview (install browsers once: bun run e2e:preview:install)", run = "bun run e2e:preview" }
"ci:review:build" = { description = "Smoke build with macOS signing forced off", run = '''
    #!/usr/bin/env bash
    ELECTROBUN_DEVELOPER_ID="" bun run build
  ''' }
"ci:release:check-squash" = { description = "Validate HEAD is a single squash commit (no merge subject)", run = '''
    #!/usr/bin/env bash
    set -e
    subject="$(git log -1 --pretty=%s HEAD)"
    if [[ "$subject" =~ ^Merge\ (pull\ request|branch) ]]; then
      echo "ERROR: HEAD is a merge commit: $subject" >&2
      echo "Repository must use Squash and Merge only." >&2
      exit 1
    fi
    echo "OK: HEAD subject is '$subject'"
  ''' }
"ci:release:check-signing" = { description = "Signed-commit + signed-tag self-test in a temp repo", run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    tmp="$(mktemp -d)"
    tag="signing-test-tag-$$"
    trap 'rm -rf "$tmp"' EXIT
    cd "$tmp"
    git init -q
    git config commit.gpgsign true
    git config tag.gpgsign true
    echo test > f.txt
    git add f.txt
    git commit -q -m "test: signing"
    git cat-file -p HEAD | grep -q '^gpgsig' || { echo "ERROR: commit not signed"; exit 1; }
    git tag -s "$tag" -m signing
    git cat-file -p "$tag" | grep -qE 'BEGIN (PGP|SSH) SIGNATURE' || { echo "ERROR: tag not signed"; exit 1; }
    echo "OK: signed commit + signed tag verified."
  ''' }
"ci:release:dry-run" = { description = "Preview the next release without touching git/GitHub", run = "bunx release-it --dry-run --ci" }
"ci:release:notes" = { description = "Preview only the next CHANGELOG entry", run = '''
    #!/usr/bin/env bash
    bunx release-it --release-notes-only --dry-run --ci 2>/dev/null \
      || bunx release-it --dry-run --ci 2>&1 | sed -n '/^# Changelog/,$p'
  ''' }
"ci:publish" = { description = "Mirror publish.yml end-to-end for the local platform (build + package + checksum)", depends = [
  "prepare"
], usage = '''
    flag "--version <ver>" help="Release version (e.g. 0.1.0)"
    flag "--target <target>" help="Build target (linux-x64 | linux-arm64 | darwin-arm64)"
  ''', run = '''
    #!/usr/bin/env bash
    set -e
    : "${usage_version:?--version is required (e.g. --version=0.1.0)}"
    : "${usage_target:=$(uname -s | tr A-Z a-z)-$(uname -m | sed -e s/x86_64/x64/ -e s/aarch64/arm64/)}"
    case "$usage_target" in
      darwin-x64) usage_target=darwin-arm64 ;;
    esac
    mise run ci:publish:build
    mise run ci:publish:package -- --version="$usage_version" --target="$usage_target"
    mise run ci:publish:checksum
  ''' }
"ci:publish:build" = { description = "Production build for the local platform", run = "bun run build:prod" }
"ci:publish:package" = { description = "Package dist/ as .tar.gz (linux) or rename .dmg (mac)", usage = '''
    flag "--version <ver>" help="Release version" required
    flag "--target <target>" help="Build target" required
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    case "$usage_target" in
      linux-*)
        tar czf "kb-${usage_version}-${usage_target}.tar.gz" -C dist .
        ;;
      darwin-*)
        DMG="$(find dist -maxdepth 3 -type f -name '*.dmg' | head -n 1)"
        [[ -n "$DMG" ]] || { echo "ERROR: no .dmg under dist/"; exit 1; }
        suffix=""
        [[ -z "${ELECTROBUN_DEVELOPER_ID:-}" ]] && suffix="-unsigned"
        mv "$DMG" "kb-${usage_version}-${usage_target}${suffix}.dmg"
        ;;
      *)
        echo "ERROR: unknown target $usage_target"; exit 1
        ;;
    esac
  ''' }
"ci:publish:checksum" = { description = "Write checksums.txt for produced archives", run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    shopt -s nullglob
    sha256sum *.tar.gz *.dmg 2>/dev/null > checksums.txt || true
    test -s checksums.txt
    cat checksums.txt
  ''' }
"ci:reset-branch" = { description = "Reset main, delete tags, create fresh branch with CI fix, push and PR", run = '''
    #!/usr/bin/env bash
    set -e

    echo "=== CI Branch Reset & Recreate Script ==="
    echo ""

    current_branch=$(git branch --show-current)
    echo "Current branch: $current_branch"

    echo ""
    echo "=== Step 1: Delete remote tags ==="
    for tag in $(git tag -l); do
        echo "Deleting remote tag: $tag"
        git push origin --delete "$tag" 2>/dev/null || echo "  (tag may not exist remotely)"
    done

    echo ""
    echo "=== Step 2: Delete local tags ==="
    for tag in $(git tag -l); do
        echo "Deleting local tag: $tag"
        git tag -d "$tag"
    done

    echo ""
    echo "=== Step 3: Reset main to initial commit ==="
    git checkout main
    git fetch origin main
    git reset --hard 9b59223
    echo "Main reset to: $(git log --oneline -1)"

    echo ""
    echo "=== Step 4: Force push main ==="
    git push --force origin main
    echo "Main force pushed"

    echo ""
    echo "=== Step 5: Create new branch with CI fix ==="
    ci_commit=$(git log --oneline --all | grep -m1 "feat(setup): Project foundation and CI" | cut -d' ' -f1)
    echo "Using commit: $ci_commit"

    git branch -D fix/release-workflow-v2 2>/dev/null || true
    git checkout -b fix/release-workflow-v2 "$ci_commit"

    echo ""
    echo "=== Step 6: Run lint and test locally ==="
    echo "Running bun run lint..."
    bun run lint

    echo ""
    echo "Running bun test..."
    bun test

    echo ""
    echo "=== Step 7: Push new branch to origin ==="
    git push -u origin fix/release-workflow-v2

    echo ""
    echo "=== Step 8: Create PR ==="
    if command -v gh &> /dev/null; then
        pr_url=$(gh pr create \
            --title "fix: Release workflow and CI improvements" \
            --body "## Summary
    - Fix release workflow to use gh release create instead of release-it's broken GitHub release
    - Properly delete local and remote tags before creating releases
    - Ensure CI passes before merging

    ## Changes
    - Disable release-it's GitHub release (set release: false)
    - Use explicit gh release create in release.yml
    - Properly handle tag cleanup

    ## Testing
    - Lint passes locally
    - Tests pass locally" \
            --base main)

        echo "PR created: $pr_url"
    else
        echo "gh CLI not found. Please create PR manually:"
        echo "  gh pr create --base main --head fix/release-workflow-v2"
    fi

    echo ""
    echo "=== Done! ==="
    echo "Branch: fix/release-workflow-v2"
    echo "PR created with CI fix"
  ''' }
"repo:setup" = { description = "Create GitHub repo and set required secrets/vars for CI workflows", run = '''
    #!/usr/bin/env bash
    set -euo pipefail

    echo "=== Setup GitHub Repo & CI Secrets ==="
    echo ""

    echo "=== Step 1: Create GitHub repository ==="
    gh repo create kodexb --description "A knowledge base" --source=. --push --public

    echo ""
    echo "=== Step 2: Set GH_TOKEN secret ==="
    GH_TOKEN="$(gopass show -n --password tokens/sudo.github.com)"
    echo "$GH_TOKEN" | gh secret set GH_TOKEN

    echo ""
    echo "=== Step 3: Set RELEASE_SIGNING_SSH_KEY secret ==="
    SSH_KEY="$(gopass cat tokens/pvt.release.github.com)"
    echo "$SSH_KEY" | gh secret set RELEASE_SIGNING_SSH_KEY

    echo ""
    echo "=== Step 4: Set RELEASE_SIGNING_SIGNER_PUB variable ==="
    PUB_KEY="$(gopass show -n --password tokens/pub.release.github.com)"
    echo "$PUB_KEY" | gh variable set RELEASE_SIGNING_SIGNER_PUB

    echo ""
    echo "=== Done! ==="
    echo "Repository 'kodexb' created with CI secrets configured."
  ''' }
"repo:prune" = { description = "Delete all tags, releases and repo from GitHub", run = '''
    #!/usr/bin/env bash
    set -euo pipefail

    echo "=== Prune GitHub Repository ==="
    repo="kodexb"
    echo "Target: $repo"
    echo ""

    echo "=== Step 1: Delete all remote tags ==="
    for tag in $(git ls-remote --tags origin | cut -d$'\t' -f2 | grep -v '^{$'); do
        tag_name="${tag#refs/tags/}"
        echo "Deleting tag: $tag_name"
        gh repo delete "$repo" --yes 2>/dev/null || true
    done || true
    gh api repos/"$repo"/tags --method DELETE 2>/dev/null || true

    echo ""
    echo "=== Step 2: Delete all releases ==="
    for release in $(gh release list --repo "$repo" --json name -q '.[].name' 2>/dev/null); do
        echo "Deleting release: $release"
        gh release delete "$release" --yes --repo "$repo" 2>/dev/null || true
    done || true

    echo ""
    echo "=== Step 3: Delete repository ==="
    echo "Deleting repository: $repo"
    gh repo delete "$repo" --yes
    echo ""
    echo "Repository '$repo' deleted."
  ''' }
"skill" = { description = "Validate, generate, install, and report kb skill registry artifacts.", usage = '''
arg "<action>" help="Skill registry action" {
    choices "validate" "sync" "install" "all" "report"
}
flag "--json" help="Print machine-readable report output"
flag "--dry-run" help="Validate intended writes without changing files"
''', run = '''
#!/usr/bin/env bun
import { existsSync, readFileSync, writeFileSync } from "node:fs"
import { join } from "node:path"
import { pathToFileURL } from "node:url"

const ACTION = process.env.usage_action || ""
const JSON_OUT = process.env.usage_json === "true"
const DRY_RUN = process.env.usage_dry_run === "true"
const VALID_ACTIONS = ["validate", "sync", "install", "all", "report"]

if (!VALID_ACTIONS.includes(ACTION)) {
  console.error("skill: action is required: validate, sync, install, all, or report")
  process.exit(1)
}

function gitRoot() {
  const r = Bun.spawnSync(["git", "rev-parse", "--show-toplevel"])
  if (r.exitCode !== 0) { console.error("skill: run from inside the kb git checkout"); process.exit(1) }
  return new TextDecoder().decode(r.stdout).trim()
}

function isRecord(v) { return v !== null && typeof v === "object" && !Array.isArray(v) }

function loadRegistry() {
  const root = gitRoot()
  const url = pathToFileURL(join(root, "assets/guides/SKILLS.yml")).href
  return import(url, { with: { type: "yaml" } }).then(m => m.default)
}

function loadSkillLock(root) {
  const fp = join(root, "skills-lock.json")
  if (!existsSync(fp)) return new Set()
  const lock = JSON.parse(readFileSync(fp, "utf8"))
  return new Set(Object.keys(lock.skills ?? {}))
}

function loadActualProjectSkills(root) {
  const child = Bun.spawnSync(["skills", "list", "--json"], { cwd: root })
  if (child.exitCode !== 0) {
    console.error("skill validate: skills CLI unavailable — this registry requires the Skills CLI")
    return null
  }
  try {
    const list = JSON.parse(new TextDecoder().decode(child.stdout))
    return new Set(
      list
        .filter(s => s.scope === "project" && (s.path || "").includes(".agents/skills/"))
        .map(s => (s.path || "").split("/").pop() || "")
        .filter(Boolean)
    )
  } catch {
    return null
  }
}

function diffSets(actual, expected) {
  const missing = [...expected].filter(s => !actual.has(s))
  const extra = [...actual].filter(s => !expected.has(s))
  return { missing, extra }
}

let validateOk = false
let drift = null

const ALLOWED_LOCATIONS = new Set(["owned", "project", "global"])
const ALLOWED_TYPES = new Set(["required", "routed", "optional", "reference", "blocked"])
const FORBIDDEN_SKILL_FIELDS = ["source", "install", "link", "decision", "load"]
const REDUNDANT_NOTES = new Set(["owned", "project", "global only"])

let ok = true
function check(cond, msg) { if (!cond) { console.error("skill validate: " + msg); ok = false } }

async function validate() {
  ok = true
  drift = null
  const root = gitRoot()
  const registry = await loadRegistry()
  const lockedSkills = loadSkillLock(root)
  const registryProjectSkills = new Set()

  check(registry?.schema_version === 3, "schema_version must be 3")
  check(isRecord(registry?.skills), "skills must be a mapping")
  check(!Object.hasOwn(registry ?? {}, "electrobun_routing"), "top-level electrobun_routing must not exist")

  const skills = registry.skills ?? {}
  for (const [name, skill] of Object.entries(skills)) {
    check(isRecord(skill), name + " must be a mapping")
    if (!isRecord(skill)) continue

    check(ALLOWED_LOCATIONS.has(skill.location), name + ".location invalid: " + skill.location)
    check(typeof skill.rationale === "string" && skill.rationale.trim() !== "", name + ".rationale required")
    check(isRecord(skill.policy), name + ".policy must be a mapping")
    if (!isRecord(skill.policy)) continue
    check(ALLOWED_TYPES.has(skill.policy.type), name + ".policy.type invalid: " + skill.policy.type)
    if (skill.location === "project") {
      registryProjectSkills.add(name)
      check(lockedSkills.has(name), name + ": location project requires an entry in skills-lock.json")
    } else {
      check(!lockedSkills.has(name), name + ": only location project entries may appear in skills-lock.json")
    }

    for (const f of FORBIDDEN_SKILL_FIELDS) {
      check(!Object.hasOwn(skill, f), name + " must not have forbidden field: " + f)
    }

    const t = skill.policy.type
    const hasUsage = isRecord(skill.policy.usage)
    const hasRouting = isRecord(skill.policy.routing)
    const hasSurfaces = isRecord(skill.policy.surfaces)
    const hasReason = typeof skill.policy.reason === "string" && skill.policy.reason.trim() !== ""
    const hasRedirect = Array.isArray(skill.policy.redirect_to)

    if (t === "required") {
      check(hasUsage, name + ": required must have usage")
      check(!hasRouting, name + ": required must not have routing")
      check(!hasSurfaces, name + ": required must not have surfaces")
      check(!hasReason, name + ": required must not have reason")
      check(!hasRedirect, name + ": required must not have redirect_to")
    } else if (t === "routed") {
      check(hasUsage, name + ": routed must have usage")
      check(hasRouting && Object.keys(skill.policy.routing).length > 0, name + ": routed must have non-empty routing")
      check(!hasSurfaces, name + ": routed must not have surfaces")
      check(!hasReason, name + ": routed must not have reason")
      check(!hasRedirect, name + ": routed must not have redirect_to")
    } else if (t === "optional") {
      check(hasUsage, name + ": optional must have usage")
      check(!hasRouting, name + ": optional must not have routing")
      check(!hasReason, name + ": optional must not have reason")
      check(!hasRedirect, name + ": optional must not have redirect_to")
    } else if (t === "reference") {
      check(hasUsage, name + ": reference must have usage")
      check(!hasRouting, name + ": reference must not have routing")
      check(!hasSurfaces, name + ": reference must not have surfaces")
      check(!hasReason, name + ": reference must not have reason")
      check(!hasRedirect, name + ": reference must not have redirect_to")
    } else if (t === "blocked") {
      check(hasReason, name + ": blocked must have reason")
      check(!hasUsage, name + ": blocked must not have usage")
      check(!hasRouting, name + ": blocked must not have routing")
      check(!hasSurfaces, name + ": blocked must not have surfaces")
      check(skill.location === "global", name + ": blocked requires location: global")
    }

    if (hasUsage) {
      check(typeof skill.policy.usage.summary === "string" && skill.policy.usage.summary.trim() !== "", name + ".usage.summary required")
      const load = skill.policy.usage.when?.load
      check(Array.isArray(load) && load.length > 0, name + ".usage.when.load must be a non-empty list")
      if (Array.isArray(load)) {
        for (const item of load) check(typeof item === "string" && item.trim() !== "", name + ".usage.when.load entries must be non-empty strings")
      }
      const avoid = skill.policy.usage.when?.avoid
      check(Array.isArray(avoid), name + ".usage.when.avoid must be a list")
    }

    if (hasRouting) {
      for (const [surface, routes] of Object.entries(skill.policy.routing)) {
        check(Array.isArray(routes), name + ".routing." + surface + " must be a list")
        if (!Array.isArray(routes)) continue
        for (const route of routes) {
          check(isRecord(route), name + ".routing." + surface + " entries must be mappings")
          if (!isRecord(route)) continue
          check(typeof route.order === "number", name + ".routing." + surface + ".order must be numeric")
          check(Array.isArray(route.triggers) && route.triggers.length > 0, name + ".routing." + surface + ".triggers must be non-empty list")
          if (Array.isArray(route.triggers)) {
            for (const t of route.triggers) check(typeof t === "string" && t.trim() !== "", name + ".routing." + surface + ".triggers entries must be non-empty strings")
          }
          if (Object.hasOwn(route, "note")) {
            check(typeof route.note === "string" && route.note.trim() !== "", name + ".routing." + surface + ".note must be non-empty string when present")
            check(!REDUNDANT_NOTES.has(route.note?.trim()), name + ".routing." + surface + ".note must not be a redundant status note: " + route.note)
          }
        }
      }
    }
  }
  for (const lockedName of lockedSkills) {
    check(registryProjectSkills.has(lockedName), lockedName + ": skills-lock.json entry requires a matching location project registry entry")
  }

  // Actual project installs check via Skills CLI
  const actualSkills = loadActualProjectSkills(root)
  if (actualSkills === null) {
    check(false, "skills CLI unavailable — cannot validate actual project installs")
  } else {
    const expectedSkills = new Set()
    for (const [name, skill] of Object.entries(skills)) {
      if (skill.location === "owned" || skill.location === "project") expectedSkills.add(name)
    }
    const { missing, extra } = diffSets(actualSkills, expectedSkills)
    for (const m of missing) check(false, m + ": expected project skill not installed — run mise run skill install")
    for (const e of extra) check(false, e + ": installed project skill not in registry as owned or project")
    drift = { actual_skills: [...actualSkills].sort(), expected_skills: [...expectedSkills].sort(), missing, extra }
  }

  validateOk = ok
  if (!ok && !JSON_OUT) return // validation-only exits with failure below; report collects drift
}

// ── Replace Managed Block ─────────────────────────────────────────────

function replaceManaged(root, relativePath, marker, content) {
  const fp = join(root, relativePath)
  const start = "<!-- skills:" + marker + ":start -->"
  const end = "<!-- skills:" + marker + ":end -->"
  const orig = readFileSync(fp, "utf8")
  const si = orig.indexOf(start), ei = orig.indexOf(end)
  if (si === -1 || ei === -1 || ei < si) { console.error("skill sync: missing markers for " + marker + " in " + relativePath); process.exit(1) }
  const next = orig.slice(0, si + start.length) + "\n" + content.trimEnd() + "\n" + orig.slice(ei)
  if (DRY_RUN) {
    const status = next === orig ? "up to date" : "would update"
    console.log("skill sync: dry-run " + status + " " + relativePath + ":" + marker)
    return
  }
  writeFileSync(fp, next)
}

function statusNote(location) {
  if (location === "project") return "project"
  if (location === "owned") return "owned"
  return "global only"
}

// ── Sync ──────────────────────────────────────────────────────────────

async function sync() {
  await validate()
  const registry = await loadRegistry()
  const root = gitRoot()
  const skills = registry.skills ?? {}

  // Optional companions
  const optionals = Object.entries(skills)
    .filter(([, s]) => s.policy.type === "optional" && isRecord(s.policy.surfaces))
    .map(([name, s]) => ({ name, ...s }))

  const claudeList = optionals
    .map(s => "- `" + s.name + "` - " + s.policy.surfaces.claude_optional)
    .join("\n")
  replaceManaged(root, "CLAUDE.md", "optional-companions", claudeList)

  const ctxTable = [
    "| Skill | When |",
    "| --- | --- |",
    ...optionals.map(s => "| **" + s.name + "** | " + s.policy.surfaces.kb_context_optional + " |"),
  ].join("\n")
  replaceManaged(root, ".agents/skills/kb-context/SKILL.md", "optional-companions", ctxTable)

  // Electrobun routing
  const ebRoutes = []
  for (const [name, skill] of Object.entries(skills)) {
    const eb = isRecord(skill.policy?.routing) ? skill.policy.routing.electrobun : undefined
    if (!Array.isArray(eb)) continue
    for (const route of eb) ebRoutes.push({ name, ...route })
  }
  ebRoutes.sort((a, b) => a.order - b.order)

  const ebTable = [
    "| When the task involves... | Read this skill first | Note |",
    "| --- | --- | --- |",
    ...ebRoutes.map(r => {
      const skill = skills[r.name]
      let note = statusNote(skill.location)
      if (r.note) note += " - " + r.note
      const triggers = (r.triggers ?? []).join(", ")
      return "| " + triggers + " | `" + r.name + "` | " + note + " |"
    }),
  ].join("\n")
  replaceManaged(root, ".cursor/electrobun-skill-routing.md", "electrobun-routing", ebTable)
}

// ── Install ────────────────────────────────────────────────────────────

async function install() {
  await validate()
  if (DRY_RUN) {
    console.log("skill install: dry-run would run skills experimental_install")
    return
  }
  const child = Bun.spawnSync(["skills", "experimental_install"], {
    cwd: gitRoot(),
    stdout: "inherit",
    stderr: "inherit",
  })
  if (child.exitCode !== 0) process.exit(child.exitCode ?? 1)
}

// ── Report ─────────────────────────────────────────────────────────────

async function report() {
  await validate()
  const registry = await loadRegistry()
  const skills = registry.skills ?? {}
  const byLoc = {}, byType = {}
  let ebTotal = 0
  for (const [, s] of Object.entries(skills)) {
    const loc = s.location || "?"
    const t = s.policy?.type || "?"
    byLoc[loc] = (byLoc[loc] || 0) + 1
    byType[t] = (byType[t] || 0) + 1
    const eb = isRecord(s.policy?.routing) ? s.policy.routing.electrobun : undefined
    if (Array.isArray(eb)) ebTotal += eb.length
  }
  const data = {
    schema_version: registry.schema_version,
    total_skills: Object.keys(skills).length,
    by_location: byLoc,
    by_policy_type: byType,
    electrobun_routes: ebTotal,
    valid: validateOk,
    drift: drift ?? {},
  }
  if (JSON_OUT) {
    console.log(JSON.stringify(data, null, 2))
  } else {
    console.log("schema_version:", data.schema_version)
    console.log("total_skills:", data.total_skills)
    console.log("by_location:", JSON.stringify(data.by_location))
    console.log("by_policy_type:", JSON.stringify(data.by_policy_type))
    console.log("electrobun_routes:", data.electrobun_routes)
    console.log("valid:", data.valid)
    if (drift) {
      if (drift.missing.length) console.log("missing:", JSON.stringify(drift.missing))
      if (drift.extra.length) console.log("extra:", JSON.stringify(drift.extra))
      else console.log("drift: none")
    }
  }
}

// ── Dispatch ───────────────────────────────────────────────────────────

if (ACTION === "validate") { await validate(); if (!validateOk) process.exit(1) }
else if (ACTION === "sync") { await sync(); if (!validateOk) process.exit(1) }
else if (ACTION === "install") { await install(); if (!validateOk) process.exit(1) }
else if (ACTION === "all") { await sync(); await install() }
else if (ACTION === "report") { await report(); if (!validateOk) process.exit(1) }

if (!ok) process.exit(1)
''' }

# Backwards-compatible wrappers that delegate to `mise run skill <action>`
"skills:validate" = { hide = true, description = "DEPRECATED: use mise run skill validate", run = "mise run skill validate" }
"skills:sync" = { hide = true, description = "DEPRECATED: use mise run skill sync", run = "mise run skill sync" }
"link:skills" = { hide = true, description = "DEPRECATED: use mise run skill install", run = "mise run skill install" }

[tasks."perf"]
description = "Run, compare, baseline, or open preview-server performance benchmarks"
dir = "."
usage = '''
arg "<action>" help="Benchmark action" {
    choices "run" "baseline" "compare" "open"
}
flag "--port <port>" default="3457" help="Preview server port for run action"
'''
run = '''
#!/usr/bin/env bun
import { existsSync } from "node:fs"
import { copyFile, mkdir, readFile, writeFile } from "node:fs/promises"
import path from "node:path"

type BenchmarkResult = {
  timestamp: string
  git_sha: string
  bun_version: string
  thresholds: Record<string, number>
  results: Record<string, number>
  violations: Array<{ path: string; metric: string; value: number; threshold: number; delta: number }>
  summary: "PASS" | "FAIL"
}

const action = process.env.usage_action
const port = Number.parseInt(process.env.usage_port ?? "3457", 10)
if (!Number.isFinite(port) || port <= 0) {
  console.error("perf: --port must be a positive integer")
  process.exit(1)
}

function spawnText(cmd: string[], opts: Bun.SpawnOptions.OptionsObject = {}): string {
  const child = Bun.spawnSync(cmd, opts)
  if (child.exitCode !== 0) {
    const err = new TextDecoder().decode(child.stderr)
    throw new Error(err.trim() || `${cmd.join(" ")} failed`)
  }
  return new TextDecoder().decode(child.stdout).trim()
}

function repoRoot(): string {
  return spawnText(["git", "rev-parse", "--show-toplevel"])
}

const ROOT = repoRoot()
const BENCH = path.join(ROOT, "tools", "benchmarks")
const SERVER = path.join(ROOT, "tools", "preview", "server.ts")
const RESULTS = path.join(BENCH, "results")

const THRESHOLDS = {
  p1_cold_start_ms: 300,
  p2_p50_ms: 2,
  p2_p99_ms: 4,
  p3_p50_ms: 2,
  p3_p99_ms: 3,
  p4_req_per_sec: 8000,
  p5_p50_ms: 3,
  p5_p99_ms: 5,
}

async function measure(baseUrl: string, endpoint: string, body: object, n = 100) {
  const samples: number[] = []
  for (let i = 0; i < n; i++) {
    const t = performance.now()
    const r = await fetch(`${baseUrl}/api/${endpoint}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
    if (r.ok) samples.push(performance.now() - t)
  }
  if (samples.length === 0) throw new Error(`All requests to /api/${endpoint} failed`)
  samples.sort((a, b) => a - b)
  const last = samples.length - 1
  return {
    p50: samples[Math.floor(last * 0.5)]!,
    p99: samples[Math.floor(last * 0.99)]!,
  }
}

async function measureThroughput(baseUrl: string, endpoint: string, body: object, durationMs = 10_000, concurrency = 10) {
  const until = performance.now() + durationMs
  let completed = 0
  const payload = JSON.stringify(body)
  async function worker() {
    while (performance.now() < until) {
      const r = await fetch(`${baseUrl}/api/${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
      })
      if (r.ok) completed += 1
    }
  }
  await Promise.all(Array.from({ length: concurrency }, () => worker()))
  return completed / (durationMs / 1000)
}

async function runBenchmarks() {
  const baseUrl = `http://localhost:${port}`
  const gitSha = spawnText(["git", "-C", ROOT, "rev-parse", "HEAD"])
  const bunVer = spawnText(["bun", "--version"])
  const timestamp = new Date().toISOString()

  console.log("P1  cold start...")
  const t0 = performance.now()
  const srv = Bun.spawn(["bun", SERVER], {
    cwd: ROOT,
    env: { ...process.env, PORT: String(port) },
    stdout: "ignore",
    stderr: "inherit",
  })

  try {
    let ready = false
    let exited = false
    srv.exited.then(() => {
      exited = true
    })
    for (let i = 0; i < 900; i++) {
      if (exited) throw new Error("Preview server exited before readiness")
      try {
        const r = await fetch(baseUrl)
        if (r.ok) {
          ready = true
          break
        }
      } catch {}
      await Bun.sleep(100)
    }
    const p1 = performance.now() - t0
    if (!ready) throw new Error("Preview server did not start in 90 s")
    console.log(`P1  ${p1.toFixed(0)} ms`)

    console.log("P2  FTS search (100 samples)...")
    const p2 = await measure(baseUrl, "list", { query: "bun", limit: 50 })
    console.log(`P2  p50=${p2.p50.toFixed(1)} ms  p99=${p2.p99.toFixed(1)} ms`)

    console.log("P3  filter query (100 samples)...")
    const p3 = await measure(baseUrl, "list", { types: ["task"], limit: 50 })
    console.log(`P3  p50=${p3.p50.toFixed(1)} ms  p99=${p3.p99.toFixed(1)} ms`)

    console.log("P4  throughput 10 s...")
    const p4 = await measureThroughput(baseUrl, "list", { query: "bun", limit: 50 })
    console.log(`P4  ${p4.toFixed(0)} req/s`)

    console.log("P5  getStats (100 samples)...")
    const p5 = await measure(baseUrl, "getStats", {})
    console.log(`P5  p50=${p5.p50.toFixed(1)} ms  p99=${p5.p99.toFixed(1)} ms`)

    const violations: BenchmarkResult["violations"] = []
    const checkMax = (id: string, metric: string, value: number, limit: number) => {
      if (value > limit) {
        violations.push({ path: id, metric, value: +value.toFixed(1), threshold: limit, delta: +(value - limit).toFixed(1) })
      }
    }
    const checkMin = (id: string, metric: string, value: number, limit: number) => {
      if (value < limit) {
        violations.push({ path: id, metric, value: +value.toFixed(1), threshold: limit, delta: +(limit - value).toFixed(1) })
      }
    }
    checkMax("P1", "cold_start_ms", p1, THRESHOLDS.p1_cold_start_ms)
    checkMax("P2", "p50_ms", p2.p50, THRESHOLDS.p2_p50_ms)
    checkMax("P2", "p99_ms", p2.p99, THRESHOLDS.p2_p99_ms)
    checkMax("P3", "p50_ms", p3.p50, THRESHOLDS.p3_p50_ms)
    checkMax("P3", "p99_ms", p3.p99, THRESHOLDS.p3_p99_ms)
    checkMin("P4", "req_per_sec", p4, THRESHOLDS.p4_req_per_sec)
    checkMax("P5", "p50_ms", p5.p50, THRESHOLDS.p5_p50_ms)
    checkMax("P5", "p99_ms", p5.p99, THRESHOLDS.p5_p99_ms)

    const slug = timestamp.replace(/[:.]/g, "-").slice(0, 19)
    const dir = path.join(RESULTS, slug)
    await mkdir(dir, { recursive: true })
    const result: BenchmarkResult = {
      timestamp,
      git_sha: gitSha,
      bun_version: bunVer,
      thresholds: THRESHOLDS,
      results: {
        p1_cold_start_ms: +p1.toFixed(1),
        p2_p50_ms: +p2.p50.toFixed(1),
        p2_p99_ms: +p2.p99.toFixed(1),
        p3_p50_ms: +p3.p50.toFixed(1),
        p3_p99_ms: +p3.p99.toFixed(1),
        p4_req_per_sec: +p4.toFixed(0),
        p5_p50_ms: +p5.p50.toFixed(1),
        p5_p99_ms: +p5.p99.toFixed(1),
      },
      violations,
      summary: violations.length === 0 ? "PASS" : "FAIL",
    }
    const json = JSON.stringify(result, null, 2)
    await writeFile(path.join(dir, "result.json"), json)
    await writeFile(path.join(RESULTS, "latest.json"), json)

    console.log("\nPerformance Report")
    console.log(`P1 cold start  ${result.results.p1_cold_start_ms} ms`)
    console.log(`P2 FTS p50     ${result.results.p2_p50_ms} ms`)
    console.log(`P2 FTS p99     ${result.results.p2_p99_ms} ms`)
    console.log(`P3 filter p50  ${result.results.p3_p50_ms} ms`)
    console.log(`P3 filter p99  ${result.results.p3_p99_ms} ms`)
    console.log(`P4 throughput  ${result.results.p4_req_per_sec} req/s`)
    console.log(`P5 stats p50   ${result.results.p5_p50_ms} ms`)
    console.log(`P5 stats p99   ${result.results.p5_p99_ms} ms`)
    console.log(`${result.summary} ${violations.length} violation(s) -> ${dir}`)
    process.exit(violations.length > 0 ? 1 : 0)
  } finally {
    srv.kill()
  }
}

async function compareBenchmarks() {
  const [baseRaw, latestRaw] = await Promise.all([
    readFile(path.join(RESULTS, "baseline.json"), "utf-8").catch(() => null),
    readFile(path.join(RESULTS, "latest.json"), "utf-8").catch(() => null),
  ])
  if (!baseRaw) {
    console.error("No baseline.json - run `mise run perf baseline` first")
    process.exit(1)
  }
  if (!latestRaw) {
    console.error("No latest.json - run `mise run perf run` first")
    process.exit(1)
  }
  const base = JSON.parse(baseRaw) as BenchmarkResult
  const latest = JSON.parse(latestRaw) as BenchmarkResult
  const metrics = [
    { id: "P1", key: "p1_cold_start_ms", label: "cold start", dir: "lower" },
    { id: "P2", key: "p2_p50_ms", label: "FTS p50", dir: "lower" },
    { id: "P2", key: "p2_p99_ms", label: "FTS p99", dir: "lower" },
    { id: "P3", key: "p3_p50_ms", label: "filter p50", dir: "lower" },
    { id: "P3", key: "p3_p99_ms", label: "filter p99", dir: "lower" },
    { id: "P4", key: "p4_req_per_sec", label: "throughput", dir: "higher" },
    { id: "P5", key: "p5_p50_ms", label: "stats p50", dir: "lower" },
    { id: "P5", key: "p5_p99_ms", label: "stats p99", dir: "lower" },
  ] as const

  console.log(`Baseline : ${base.git_sha.slice(0, 8)} ${base.timestamp.slice(0, 10)}`)
  console.log(`Latest   : ${latest.git_sha.slice(0, 8)} ${latest.timestamp.slice(0, 10)}`)
  let regressions = 0
  for (const { id, key, label, dir } of metrics) {
    const b = base.results[key]
    const l = latest.results[key]
    const delta = l - b
    const pct = b === 0 ? 0 : (delta / b) * 100
    const regressed = dir === "lower" ? l > b && l - b >= Math.max(0.25, b * 0.2) : pct < -20
    if (regressed) regressions++
    const unit = key.includes("req") ? "r/s" : "ms"
    const status = regressed ? "REGRESSION" : Math.abs(pct) < 5 ? "stable" : delta > 0 ? "worse" : "better"
    console.log(`${id} ${label}: ${b} -> ${l} (${delta >= 0 ? "+" : ""}${delta.toFixed(1)}${unit}) ${status}`)
  }
  console.log(`${regressions} regression(s)`)
  process.exit(regressions > 0 ? 1 : 0)
}

async function baselineBenchmarks() {
  const src = path.join(RESULTS, "latest.json")
  const dst = path.join(RESULTS, "baseline.json")
  const raw = await readFile(src, "utf-8").catch(() => null)
  if (!raw) {
    console.error("No latest.json - run `mise run perf run` first")
    process.exit(1)
  }
  await copyFile(src, dst)
  const { git_sha, timestamp } = JSON.parse(raw) as BenchmarkResult
  console.log(`Baseline set -> ${git_sha.slice(0, 8)} (${timestamp.slice(0, 10)})`)
}

async function openLatest() {
  const latest = path.join(RESULTS, "latest.json")
  if (!existsSync(latest)) {
    console.error("No latest.json yet - run `mise run perf run` first")
    process.exit(1)
  }
  const raw = await Bun.file(latest).text()
  const { timestamp } = JSON.parse(raw) as BenchmarkResult
  const slug = timestamp.replace(/[:.]/g, "-").slice(0, 19)
  const dir = path.join(RESULTS, slug)
  const child = Bun.spawnSync(["open", dir])
  process.exit(child.exitCode ?? 0)
}

if (action === "run") await runBenchmarks()
else if (action === "compare") await compareBenchmarks()
else if (action === "baseline") await baselineBenchmarks()
else if (action === "open") await openLatest()
else {
  console.error("Usage: mise run perf <run|baseline|compare|open>")
  process.exit(1)
}
'''

[tasks."test:spec-audit"]
description = "Report source files under src/ that lack co-located specs, with explicit exemptions"
usage = '''
flag "--strict" help="Exit non-zero when missing specs exist"
'''
run = '''
#!/usr/bin/env bun
import { readdirSync, statSync, existsSync } from "node:fs"
import { join, relative } from "node:path"

const ROOT = process.cwd()
const STRICT = process.env.usage_strict === "true"

const EXEMPT_SUFFIXES = [".d.ts", ".types.ts", ".const.ts", ".guard.ts"]
const EXEMPT_FILES = ["index.ts", "main.ts", "registry.ts", "generated.ts"]

function hasSpec(filePath: string): boolean {
  const specTs = filePath.replace(/\\.tsx?$/, ".spec.tsx")
  const specTs2 = filePath.replace(/\\.tsx?$/, ".spec.ts")
  return existsSync(specTs) || existsSync(specTs2)
}

function isExempt(filePath: string): boolean {
  const rel = relative(ROOT, filePath)
  if (!rel.startsWith("src/")) return true
  for (const suffix of EXEMPT_SUFFIXES) {
    if (rel.endsWith(suffix)) return true
  }
  const base = rel.split("/").pop() || ""
  if (EXEMPT_FILES.some(f => base === f || base.endsWith("." + f))) return true
  // Schema-only modules
  if (base.endsWith(".schema.ts") || base.endsWith(".schemas.ts")) return true
  // Barrel exports
  if (base === "index.ts" || base === "shared.ts") return true
  // Generated / fixture data
  if (rel.includes("__tests__/fixtures") || rel.includes("generated")) return true
  return false
}

function scan(dir: string): string[] {
  const missing: string[] = []
  for (const entry of readdirSync(dir, { withFileTypes: true })) {
    const full = join(dir, entry.name)
    if (entry.isDirectory()) {
      if (entry.name === "node_modules" || entry.name.startsWith(".")) continue
      missing.push(...scan(full))
    } else if (entry.isFile() && /\\.(ts|tsx)$/.test(entry.name)) {
      if (isExempt(full)) continue
      if (!hasSpec(full)) missing.push(relative(ROOT, full))
    }
  }
  return missing
}

const missing = scan(join(ROOT, "src")).sort()
for (const m of missing) console.log(m)
if (missing.length > 0) {
  console.error("missing specs:", missing.length)
  if (STRICT) process.exit(1)
}
'''

[tasks."test:spec-style"]
description = "Report Better Specs style issues in source specs"
usage = '''
flag "--strict" help="Exit non-zero when style issues exist"
flag "--scope <scope>" default="src" help="Limit to src, a src path, or a layer alias"
flag "--format <format>" default="text" help="Output format" {
    choices "text" "markdown"
}
flag "--update-ledger" help="Update the normalise-specs Phase 12 audit block"
'''
run = '''
#!/usr/bin/env bun
import { existsSync, readFileSync, readdirSync, writeFileSync } from "node:fs"
import { join, normalize, relative } from "node:path"

const ROOT = process.cwd()
const STRICT = process.env.usage_strict === "true"
const FORMAT = process.env.usage_format || "text"
const UPDATE_LEDGER = process.env.usage_update_ledger === "true" || process.env["usage_update-ledger"] === "true"
const RAW_SCOPE = process.env.usage_scope || "src"
const LEDGER = join(ROOT, "assets/docs/specs/normalise-specs/tasks.md")
const LEDGER_START = "<!-- phase-12-style-audit:start -->"
const LEDGER_END = "<!-- phase-12-style-audit:end -->"
const SCOPE_ALIASES = {
  "test-helper": "src/__tests__",
  core: "src/core",
  shared: "src/shared",
  "shell-app": "src/shell/app",
  "shell-main": "src/shell/main",
  "shell-renderer": "src/shell/renderer"
}

function normalizeScope(raw) {
  const value = SCOPE_ALIASES[raw] || raw || "src"
  const scoped = value.startsWith("src") ? value : "src/" + value
  return normalize(scoped).replace(/\\/g, "/").replace(/\/$/, "")
}

const SCOPE = normalizeScope(RAW_SCOPE)

function findSpecs(dir) {
  const r = []
  for (const e of readdirSync(dir, { withFileTypes: true })) {
    const p = join(dir, e.name)
    if (e.isDirectory() && e.name !== "node_modules" && !e.name.startsWith(".")) r.push(...findSpecs(p))
    else if (/\.spec\.(ts|tsx)$/.test(e.name)) r.push(p)
  }
  return r
}

function scopeFilter(file) {
  const rel = relative(ROOT, file).replace(/\\/g, "/")
  return rel === SCOPE || rel.startsWith(SCOPE + "/")
}

function loadFactoryNames() {
  const p = join(ROOT, "src/__tests__/factories/factories.builder.ts")
  if (!existsSync(p)) return new Set()
  const c = readFileSync(p, "utf8")
  const start = c.indexOf("const factories = {")
  const end = c.indexOf("} as const", start)
  if (start < 0 || end < start) return new Set()
  const block = c.slice(start, end)
  return new Set([...block.matchAll(/(?:'([^']+)'|(\w+))\s*:/g)].map(x => x[1] || x[2]))
}

const factoryNames = loadFactoryNames()
const specs = findSpecs(join(ROOT, "src")).filter(scopeFilter).sort()

let issues = []

function addIssue(file, category, message) {
  issues.push({ file, category, message })
}

for (const file of specs) {
  const c = readFileSync(file, "utf8")
  const rel = relative(ROOT, file)
  const lines = c.split("\n")

  // test() imports
  if (/import\s*\{[^}]*\btest\b/.test(c)) addIssue(rel, "test usage", "imports test from bun:test (use it)")
  
  // test() calls
  if (/^\s*test\(/m.test(c)) addIssue(rel, "test usage", "uses test() (use it)")

  // No describe
  if (!c.includes("describe(")) addIssue(rel, "no describe", "no describe block")

  // No situation describes  
  if (c.includes("describe(") && !/describe\(['\"]when |describe\(['\"]with |describe\(['\"]without /.test(c))
    addIssue(rel, "no situation", "no when/with/without situation describe")

  // Long descriptions
  for (const l of lines) {
    const m = l.match(/^\s*it\('(.{41,})'\)/)
    if (m) { addIssue(rel, "long description", m[1].slice(0,60) + ": description > 40 chars"); break }
  }

  // Boolean matchers — only flag opaque expressions, not direct API assertions
  if (/expect\([^)]*===/.test(c) && /\.toBe\(true\)|\.toBe\(false\)/.test(c))
    addIssue(rel, "opaque boolean matcher", "opaque boolean matcher (use readable matcher)")

  // Global dispatch
  if (/window\.dispatchEvent/.test(c) || /document\.dispatchEvent/.test(c))
    addIssue(rel, "global dispatchEvent", "uses global dispatchEvent")

  // Mocks
  if (/\bmock\s*\(/.test(c) || /\bspyOn\s*\(/.test(c) || /\bmock\.module\s*\(/.test(c))
    addIssue(rel, "mock usage", "uses mock, spyOn, or mock.module")

  // Unknown factoryFor names
  const factoryCalls = [...c.matchAll(/factoryFor\('([^']+)'/g)]
  for (const [, name] of factoryCalls) {
    if (!factoryNames.has(name))
      addIssue(rel, "unknown factory", "factoryFor('" + name + "') not in factories.builder.ts")
  }
}

function categoryCounts() {
  const counts = new Map()
  for (const issue of issues) counts.set(issue.category, (counts.get(issue.category) || 0) + 1)
  return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]))
}

function renderText() {
  const out = []
  out.push("scope: " + SCOPE)
  out.push("specs scanned: " + specs.length)
  for (const [category, count] of categoryCounts()) out.push(category + ": " + count)
  for (const issue of issues) out.push(issue.file + ": " + issue.message)
  out.push("style issues: " + issues.length)
  return out.join("\n")
}

function renderMarkdown() {
  const out = []
  out.push("### Better Specs style audit")
  out.push("")
  out.push("- Scope: `" + SCOPE + "`")
  out.push("- Specs scanned: " + specs.length)
  out.push("- Style issues: " + issues.length)
  out.push("")
  out.push("| Category | Count |")
  out.push("| --- | ---: |")
  const counts = categoryCounts()
  if (counts.length === 0) out.push("| none | 0 |")
  for (const [category, count] of counts) out.push("| " + category + " | " + count + " |")
  out.push("")
  if (issues.length > 0) {
    out.push("<details>")
    out.push("<summary>Findings</summary>")
    out.push("")
    for (const issue of issues) out.push("- `" + issue.file + "` — " + issue.message)
    out.push("")
    out.push("</details>")
  }
  return out.join("\n")
}

function updateLedger(report) {
  if (!existsSync(LEDGER)) throw new Error("ledger not found: " + relative(ROOT, LEDGER))
  const current = readFileSync(LEDGER, "utf8")
  const start = current.lastIndexOf(LEDGER_START)
  const end = current.indexOf(LEDGER_END, start)
  if (start < 0 || end < 0) throw new Error("ledger markers not found")
  const replacement = LEDGER_START + "\n" + report + "\n" + LEDGER_END
  const next = current.slice(0, start) + replacement + current.slice(end + LEDGER_END.length)
  writeFileSync(LEDGER, next)
}

const report = FORMAT === "markdown" ? renderMarkdown() : renderText()
console.log(report)
if (UPDATE_LEDGER) updateLedger(renderMarkdown())
if (issues.length > 0) {
  if (STRICT) process.exit(1)
}
'''

[tasks."icons:svg-contrast"]
description = "Contrast-check SVG colors in assets/images vs list shell background (#0b0e14). Default scope=all (Raycast-style tag-rail). scope=brand: tag map + entry-type defaults only. Writes only with --write-safe. Exits 1 with --strict when any file fails."
usage = '''
    flag "--scope <scope>" default="all" help="all: every assets/images/*.svg; brand: tag map + entry-type basenames only" {
      choices "all" "brand"
    }
    flag "--write-safe" help="Apply curated SAFE_HEX_REPLACEMENTS (see run script SAFE_HEX_REPLACEMENTS)"
    flag "--strict" help="Fail when any file is below --min ratio vs #0b0e14"
    flag "--min <min>" default="3" help="Minimum contrast ratio (WCAG-style vs list bg)"
'''
run = '''
#!/usr/bin/env bun
import { readdir } from "node:fs/promises"
import path from "node:path"

function chdirToGitRoot(): void {
  const r = Bun.spawnSync(["git", "rev-parse", "--show-toplevel"])
  if (r.exitCode !== 0) {
    console.error("icons:svg-contrast: run from inside the kb git checkout")
    process.exit(1)
  }
  const bytes = r.stdout
  const out = typeof bytes === "string" ? bytes : new TextDecoder().decode(bytes as Uint8Array)
  const root = out.trim()
  if (!root) {
    console.error("icons:svg-contrast: run from inside the kb git checkout")
    process.exit(1)
  }
  process.chdir(root)
}

chdirToGitRoot()

/** Matches list.css `--kb-bg` (Andromeda Void shell). */
const KB_LIST_BG = "#0b0e14"

/** WCAG 1.4.11 non-text contrast target for graphical objects (relaxed vs body text). */
const DEFAULT_MIN_RATIO = 3

/** Only these exact hex strings are rewritten with `--write-safe` (case-insensitive keys). */
const SAFE_HEX_REPLACEMENTS: Record<string, string> = {
  "#24292f": "#e6edf3" // GitHub mark (dark UI) → light for void background
}

function parseArgs(argv: string[]) {
  let scope: "brand" | "all" =
    process.env.usage_scope === "brand" || process.env.usage_scope === "all" ? process.env.usage_scope : "all"
  let writeSafe = process.env.usage_write_safe === "true"
  let strict = process.env.usage_strict === "true"
  let minRatio = DEFAULT_MIN_RATIO
  const envMin = process.env.usage_min
  if (envMin !== undefined && envMin !== "") {
    const n = Number(envMin)
    if (Number.isFinite(n) && n > 0) {
      minRatio = n
    }
  }
  for (const a of argv) {
    if (a === "--write-safe") writeSafe = true
    else if (a === "--strict") strict = true
    else if (a.startsWith("--scope=")) {
      const v = a.slice("--scope=".length)
      if (v === "brand" || v === "all") scope = v
      else {
        console.error(`Unknown --scope=${v} (use brand|all)`)
        process.exit(2)
      }
    } else if (a.startsWith("--min=")) {
      minRatio = Number(a.slice("--min=".length))
      if (!Number.isFinite(minRatio) || minRatio <= 0) {
        console.error(`Invalid --min=${a}`)
        process.exit(2)
      }
    }
  }
  return { scope, writeSafe, strict, minRatio }
}

function expandShorthandHex(hex: string): string {
  const h = hex.slice(1).toLowerCase()
  if (h.length === 3) {
    return `#${h
      .split("")
      .map(c => c + c)
      .join("")}`
  }
  if (h.length === 6) return `#${h}`
  return hex.toLowerCase()
}

function hexToRgb(hex: string): { r: number; g: number; b: number } | null {
  const normalized = expandShorthandHex(hex.startsWith("#") ? hex : `#${hex}`)
  const m = /^#([0-9a-f]{6})$/.exec(normalized)
  if (!m?.[1]) return null
  const n = Number.parseInt(m[1], 16)
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }
}

function channelL(u: number): number {
  const c = u / 255
  return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4
}

function relativeLuminance(rgb: { r: number; g: number; b: number }): number {
  return 0.2126 * channelL(rgb.r) + 0.7152 * channelL(rgb.g) + 0.0722 * channelL(rgb.b)
}

function contrastRatio(fgHex: string, bgHex: string): number | null {
  const fg = hexToRgb(fgHex)
  const bg = hexToRgb(bgHex)
  if (!fg || !bg) return null
  const l1 = relativeLuminance(fg)
  const l2 = relativeLuminance(bg)
  const lighter = Math.max(l1, l2)
  const darker = Math.min(l1, l2)
  return (lighter + 0.05) / (darker + 0.05)
}

function hasLightAndNearBlack(samples: string[]): boolean {
  let hasLight = false
  let hasNearBlack = false
  for (const raw of samples) {
    const rgb = hexToRgb(raw)
    if (!rgb) continue
    const L = relativeLuminance(rgb)
    if (L > 0.28) hasLight = true
    if (L < 0.12) hasNearBlack = true
  }
  return hasLight && hasNearBlack
}

const HEX_IN_SVG = /#([0-9a-f]{3}|[0-9a-f]{6})\b/gi
const RGB_IN_SVG = /rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)/gi

function rgbTripletToHex(r: number, g: number, b: number): string {
  const clamp = (n: number) => Math.min(255, Math.max(0, Math.round(n)))
  const h = (n: number) => clamp(n).toString(16).padStart(2, "0")
  return expandShorthandHex(`#${h(r)}${h(g)}${h(b)}`)
}

function collectHexSamples(svgText: string): string[] {
  const out = new Set<string>()
  for (const m of svgText.matchAll(HEX_IN_SVG)) {
    const g1 = m[1]
    if (g1 === undefined) continue
    const full = expandShorthandHex(`#${g1}`)
    out.add(full)
  }
  for (const m of svgText.matchAll(RGB_IN_SVG)) {
    const r = Number(m[1])
    const g = Number(m[2])
    const b = Number(m[3])
    if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
      out.add(rgbTripletToHex(r, g, b))
    }
  }
  return [...out]
}

async function loadBrandBasenames(root: string): Promise<string[]> {
  const tagPath = path.join(root, "src/shell/renderer/constants/tag_brand_svg_map.const.ts")
  const entPath = path.join(root, "src/shell/renderer/constants/entry_type_icon_basename.const.ts")
  const tag = (await import(tagPath)) as { TAG_BRAND_SVG_BASENAME: Record<string, string> }
  const ent = (await import(entPath)) as { ENTRY_TYPE_DEFAULT_SVG_BASENAME: Record<string, string> }
  const fromTags = Object.values(tag.TAG_BRAND_SVG_BASENAME)
  const fromTypes = Object.values(ent.ENTRY_TYPE_DEFAULT_SVG_BASENAME)
  return [...new Set([...fromTags, ...fromTypes])].sort()
}

async function allSvgRelPaths(dir: string): Promise<string[]> {
  const names = await readdir(dir)
  return names.filter(n => n.endsWith(".svg")).sort()
}

function applySafeReplacements(content: string): { next: string; hits: number } {
  let next = content
  let total = 0
  for (const [from, to] of Object.entries(SAFE_HEX_REPLACEMENTS)) {
    const pattern = new RegExp(from.replace("#", "#"), "gi")
    next = next.replace(pattern, m => {
      if (m.toLowerCase() === from.toLowerCase()) {
        total += 1
        return to
      }
      return m
    })
  }
  return { next, hits: total }
}

type ScanRow =
  | { base: string; missing: true }
  | { base: string; missing: false; bad: { hex: string; ratio: number }[]; written: boolean }

const CHUNK = 80

async function main() {
  const root = process.cwd()
  const imagesDir = path.join(root, "assets/images")
  const { scope, writeSafe, strict, minRatio } = parseArgs(process.argv.slice(2))

  const basenames =
    scope === "brand"
      ? await loadBrandBasenames(root)
      : (await allSvgRelPaths(imagesDir)).map(f => f.replace(/\.svg$/i, ""))

  const rows: ScanRow[] = []
  for (let i = 0; i < basenames.length; i += CHUNK) {
    const slice = basenames.slice(i, i + CHUNK)
    const part = await Promise.all(
      slice.map(async (base): Promise<ScanRow> => {
        const filePath = path.join(imagesDir, `${base}.svg`)
        let content: string
        try {
          content = await Bun.file(filePath).text()
        } catch {
          console.warn(`missing: ${base}.svg`)
          return { base, missing: true }
        }

        let text = content
        let written = false
        if (writeSafe) {
          const { next, hits } = applySafeReplacements(content)
          if (hits > 0 && next !== content) {
            await Bun.write(filePath, next)
            written = true
            console.log(`write-safe: ${base}.svg (${hits} replacement(s))`)
            text = next
          }
        }

        const samples = collectHexSamples(text)
        const dualTone = hasLightAndNearBlack(samples)
        const bad: { hex: string; ratio: number }[] = []
        for (const hex of samples) {
          const rgb = hexToRgb(hex)
          if (!rgb) continue
          if (dualTone && relativeLuminance(rgb) < 0.12) {
            continue
          }
          const r = contrastRatio(hex, KB_LIST_BG)
          if (r !== null && r < minRatio) {
            bad.push({ hex, ratio: r })
          }
        }
        return { base, missing: false, bad, written }
      })
    )
    rows.push(...part)
  }

  let failures = 0
  let filesWritten = 0
  for (const row of rows) {
    if (row.missing) continue
    if (row.written) filesWritten += 1
    if (row.bad.length > 0) {
      failures += 1
      const line = row.bad
        .sort((a, b) => a.ratio - b.ratio)
        .map(x => `${x.hex} (${x.ratio.toFixed(2)}:1)`)
        .join(", ")
      console.log(`FAIL ${row.base}.svg  <${minRatio}:1  vs ${KB_LIST_BG}  →  ${line}`)
    }
  }

  console.log("")
  console.log(
    `scope=${scope}  files=${basenames.length}  failing=${failures}  minRatio=${minRatio}  writeSafe=${writeSafe}  strict=${strict}  written=${filesWritten}`
  )

  if (failures > 0) {
    console.log(
      "Hint: add targeted entries to SAFE_HEX_REPLACEMENTS and run with --write-safe; use --strict to fail CI"
    )
  }
  if (failures > 0 && strict) {
    process.exit(1)
  }
}

await main()
'''
