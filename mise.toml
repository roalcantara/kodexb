"policy" = { description = "Check Mise task policy and usage specs", quiet = true, usage = '''
    cmd "check" {
      flag "--format <format>" help="Output format" default="text" {
        choices "text" "json"
      }
      flag "--strict" help="Treat non-info findings as failures"
    }
    cmd "report" {
      flag "--format <format>" help="Output format" default="text" {
        choices "text" "json"
      }
    }
  ''', run = '''
    #!/usr/bin/env bun

    const TASK_SEPARATOR = ':'
    const COMPLEX_SCRIPT_PATTERN = /(&&|\|\||;|\||>|<|\bmkdir\b|\brm\b|\btee\b)/
    const TABLE_TASK_PATTERN = /^\[tasks\."?([^"\]]+)"?\]/gm
    const EXPECTED_PUBLIC_TASKS = [
      ['app', 'Manage Electrobun dev lifecycle and gates'],
      ['ci', 'Run review, release, and publish CI workflows'],
      ['docker', 'Build, run, and test the Docker image'],
      ['lint', 'Run lint, strict lint, fix, report, and graph workflows'],
      ['perf', 'Run preview-server performance benchmark workflows'],
      ['policy', 'Check Mise task policy and usage specs'],
      ['project', 'Manage setup, dependencies, cleanup, icons, repository, and local maintenance'],
      ['skill', 'Validate, generate, install, and report skill registry artifacts'],
      ['test', 'Run unit, CI, e2e preview, spec audit, and style checks'],
    ] as const
    const EXPECTED_PACKAGE_SCRIPTS = [
      'start', 'dev', 'dev:cef', 'dev:verbose', 'dev:debug', 'dev:trace', 'dev:kill',
      'build', 'build:prod', 'build:insecure-local', 'test', 'typecheck',
      'lint', 'lint:strict', 'lint:fix', 'lint:biome', 'lint:biome:strict',
      'lint:biome:fix', 'lint:biome:format', 'lint:mise', 'lint:knip',
      'lint:depcruise', 'lint:jscpd', 'lint:ls', 'lint:hadolint', 'lint:ast-grep',
      'lint:ast-grep:fix', 'e2e:preview:install', 'e2e:preview', 'e2e:preview:ui',
    ] as const
    const SPLIT_FAMILY_PREFIXES: string[] = []
    const ACTION = process.env.usage_cmd ?? 'check'
    const FORMAT = process.env.usage_format ?? 'text'
    const STRICT = process.env.usage_strict === 'true'

    type FindingSeverity = 'error' | 'warn' | 'info'
    type Finding = { severity: FindingSeverity; code: string; target: string; message: string }
    type TaskConfig = { description?: string; hide?: boolean; run?: string | string[]; usage?: string }
    type UsageArg = { name?: string; choices?: { choices?: string[] } }
    type UsageJson = { cmd?: { args?: UsageArg[]; flags?: Array<{ name?: string }> } }
    type PolicyContext = { miseText: string; tasks: Record<string, TaskConfig>; scripts: Record<string, string> }

    function die(msg: string, code = 1): never {
      console.error(msg)
      process.exit(code)
    }

    function chdirToGitRoot(): void {
      const r = Bun.spawnSync(['git', 'rev-parse', '--show-toplevel'])
      const root = r.stdout.toString().trim()
      if (!r.success || !root) die('policy: run from inside the app git checkout')
      process.chdir(root)
    }

    chdirToGitRoot()

    if (ACTION !== 'check' && ACTION !== 'report') {
      die(`policy: unknown action ${ACTION} (use check|report)`, 2)
    }

    function isRecord(value: unknown): value is Record<string, unknown> {
      return typeof value === 'object' && value !== null
    }

    async function readContext(): Promise<PolicyContext> {
      const [miseText, packageConfig] = await Promise.all([
        Bun.file('mise.toml').text(),
        Bun.file('package.json').json() as Promise<{ scripts?: Record<string, string> }>,
      ])
      const tasksRaw = (Bun.TOML.parse(miseText) as { tasks?: unknown }).tasks
      const tasks = isRecord(tasksRaw)
        ? Object.fromEntries(Object.entries(tasksRaw).filter((e): e is [string, TaskConfig] => isRecord(e[1])))
        : {}
      return { miseText, tasks, scripts: packageConfig.scripts ?? {} }
    }

    function runUsage(command: string[], spec: string): { ok: boolean; output: string } {
      const r = Bun.spawnSync(['usage', ...command], { stdin: new TextEncoder().encode(spec) })
      return {
        ok: r.success,
        output: `${r.stdout.toString()}${r.stderr.toString()}`.trim(),
      }
    }

    function parseUsageJson(spec: string): UsageJson | undefined {
      const result = runUsage(['generate', 'json', '-f', '-'], spec)
      if (!result.ok) return
      return JSON.parse(result.output) as UsageJson
    }

    function checkOneUsageSpec(name: string, usage: string): Finding[] {
      const spec = `name ${JSON.stringify(name)}\n${usage}`
      const findings: Finding[] = []
      const lint = runUsage(['lint', '-W', '-'], spec)
      if (!lint.ok) findings.push({ severity: 'error', code: 'usage-lint', target: name, message: lint.output })
      const usageJson = parseUsageJson(spec)
      if (usageJson === undefined) {
        findings.push({ severity: 'error', code: 'usage-json', target: name, message: 'Usage JSON generation failed.' })
        return findings
      }
      return findings
    }

    function checkUsageSpecs(tasks: Record<string, TaskConfig>): Finding[] {
      return Object.entries(tasks).flatMap(([name, task]) =>
        typeof task.usage === 'string' ? checkOneUsageSpec(name, task.usage) : [],
      )
    }

    function checkTableStyleTasks(miseText: string, tasks: Record<string, TaskConfig>): Finding[] {
      return [...miseText.matchAll(TABLE_TASK_PATTERN)].flatMap(match => {
        const name = match[1]
        if (!name) return []
        const task = tasks[name]
        if (!task || task.run || task.usage) return []
        return [
          {
            severity: 'warn' as const,
            code: 'table-task',
            target: name,
            message: 'Prefer an inline task object under [tasks].',
          },
        ]
      })
    }

    function checkDeprecatedTasks(tasks: Record<string, TaskConfig>): Finding[] {
      return Object.entries(tasks)
        .filter(([, task]) => task.description?.includes('DEPRECATED'))
        .map(([name]) => ({
          severity: 'warn' as const,
          code: 'deprecated-task',
          target: name,
          message: 'Remove deprecated task names before enforcing policy.',
        }))
    }

    function checkSplitFamilies(tasks: Record<string, TaskConfig>): Finding[] {
      const names = Object.keys(tasks)
      return SPLIT_FAMILY_PREFIXES.flatMap(prefix => {
        const members = names.filter(name => name.startsWith(`${prefix}${TASK_SEPARATOR}`))
        if (members.length === 0) return []
        return [
          {
            severity: 'info' as const,
            code: 'split-family',
            target: prefix,
            message: `Evaluate merging related tasks: ${members.sort().join(', ')}.`,
          },
        ]
      })
    }

    function checkPackageScripts(scripts: Record<string, string>): Finding[] {
      const findings: Finding[] = []
      const actual = Object.keys(scripts)
      if (JSON.stringify(actual) !== JSON.stringify(EXPECTED_PACKAGE_SCRIPTS)) {
        findings.push({
          severity: 'error',
          code: 'package-script-surface',
          target: 'package.json',
          message: `Expected package scripts ${EXPECTED_PACKAGE_SCRIPTS.join(', ')}; got ${actual.join(', ')}.`,
        })
      }
      findings.push(...Object.entries(scripts)
        .filter(([, command]) => COMPLEX_SCRIPT_PATTERN.test(command) && !command.startsWith('mise run '))
        .map(([name, command]) => ({
          severity: 'info' as const,
          code: 'complex-package-script',
          target: name,
          message: `Evaluate moving this script behind Mise: ${command}`,
        })))
      return findings
    }

    function checkPublicTaskSurface(tasks: Record<string, TaskConfig>): Finding[] {
      const actual = Object.entries(tasks)
        .filter(([, task]) => task.hide !== true)
        .map(([name, task]) => [name, task.description ?? ''] as const)
        .sort(([a], [b]) => a.localeCompare(b))
      if (JSON.stringify(actual) === JSON.stringify(EXPECTED_PUBLIC_TASKS)) return []
      return [{
        severity: 'error' as const,
        code: 'public-task-surface',
        target: 'mise.toml',
        message: `Expected public tasks ${EXPECTED_PUBLIC_TASKS.map(([name]) => name).join(', ')}; got ${actual.map(([name]) => name).join(', ')}.`,
      }]
    }

    function checkMissingPackageScriptReferences(ctx: PolicyContext): Finding[] {
      const scriptNames = new Set(Object.keys(ctx.scripts))
      const refs = [...ctx.miseText.matchAll(/\bbun run ([A-Za-z0-9:_-]+)/g)]
        .map(match => match[1])
        .filter((name): name is string => name !== undefined)
      return [...new Set(refs)]
        .filter(name => !scriptNames.has(name))
        .map(name => ({
          severity: 'error' as const,
          code: 'missing-package-script-reference',
          target: name,
          message: `mise.toml references removed package script '${name}'.`,
        }))
    }

    function checkUsageActionReferences(miseText: string): Finding[] {
      const legacyEnv = 'usage_' + 'action'
      const legacyPattern = new RegExp(`\\bprocess\\.env\\.${legacyEnv}\\b|\\$\\{${legacyEnv}\\b`)
      return legacyPattern.test(miseText)
        ? [{
            severity: 'error' as const,
            code: 'usage-action-reference',
            target: 'mise.toml',
            message: 'Use usage_cmd for task command dispatch.',
          }]
        : []
    }

    async function collectFindings(): Promise<Finding[]> {
      const ctx = await readContext()
      return [
        ...checkUsageSpecs(ctx.tasks),
        ...checkPublicTaskSurface(ctx.tasks),
        ...checkTableStyleTasks(ctx.miseText, ctx.tasks),
        ...checkDeprecatedTasks(ctx.tasks),
        ...checkSplitFamilies(ctx.tasks),
        ...checkPackageScripts(ctx.scripts),
        ...checkMissingPackageScriptReferences(ctx),
        ...checkUsageActionReferences(ctx.miseText),
      ]
    }

    function printText(findings: Finding[]) {
      if (findings.length === 0) {
        console.log('policy check: no findings')
        return
      }
      console.log(`policy check: ${findings.length} finding(s)`)
      for (const f of findings) {
        console.log(`[${f.severity}] ${f.code} ${f.target}: ${f.message}`)
      }
    }

    try {
      const findings = await collectFindings()
      if (FORMAT === 'json') {
        console.log(JSON.stringify({ findings }, null, 2))
      } else {
        printText(findings)
      }
      if (STRICT && findings.length > 0) process.exit(1)
    } catch (error) {
      die(error instanceof Error ? error.message : String(error), -1)
    }

  ''' }
"skill" = { description = "Validate, generate, install, and report skill registry artifacts", usage = '''
cmd "validate" {}
cmd "sync" {}
cmd "install" {}
cmd "all" {}
cmd "report" {
  flag "--json" help="Print machine-readable report output"
}
flag "--dry-run" help="Validate intended writes without changing files"
''', run = '''
#!/usr/bin/env bun
import { existsSync, readFileSync, writeFileSync } from "node:fs"
import { join } from "node:path"
import { pathToFileURL } from "node:url"

const ACTION = process.env.usage_cmd || ""
const JSON_OUT = process.env.usage_json === "true"
const DRY_RUN = process.env.usage_dry_run === "true"
const VALID_ACTIONS = ["validate", "sync", "install", "all", "report"]

if (!VALID_ACTIONS.includes(ACTION)) {
  console.error("skill: action is required: validate, sync, install, all, or report")
  process.exit(1)
}

function gitRoot() {
  const r = Bun.spawnSync(["git", "rev-parse", "--show-toplevel"])
  if (r.exitCode !== 0) { console.error("skill: run from inside the app git checkout"); process.exit(1) }
  return new TextDecoder().decode(r.stdout).trim()
}

function isRecord(v) { return v !== null && typeof v === "object" && !Array.isArray(v) }

function loadRegistry() {
  const root = gitRoot()
  const url = pathToFileURL(join(root, "assets/guides/SKILLS.yml")).href
  return import(url, { with: { type: "yaml" } }).then(m => m.default)
}

function loadSkillLock(root) {
  const fp = join(root, "skills-lock.json")
  if (!existsSync(fp)) return new Set()
  const lock = JSON.parse(readFileSync(fp, "utf8"))
  return new Set(Object.keys(lock.skills ?? {}))
}

function loadActualProjectSkills(root) {
  const child = Bun.spawnSync(["skills", "list", "--json"], { cwd: root })
  if (child.exitCode !== 0) {
    console.error("skill validate: skills CLI unavailable — this registry requires the Skills CLI")
    return null
  }
  try {
    const list = JSON.parse(new TextDecoder().decode(child.stdout))
    return new Set(
      list
        .filter(s => s.scope === "project" && (s.path || "").includes(".agents/skills/"))
        .map(s => (s.path || "").split("/").pop() || "")
        .filter(Boolean)
    )
  } catch {
    return null
  }
}

function diffSets(actual, expected) {
  const missing = [...expected].filter(s => !actual.has(s))
  const extra = [...actual].filter(s => !expected.has(s))
  return { missing, extra }
}

let validateOk = false
let drift = null

const ALLOWED_LOCATIONS = new Set(["owned", "project", "global"])
const ALLOWED_TYPES = new Set(["required", "routed", "optional", "reference", "blocked"])
const FORBIDDEN_SKILL_FIELDS = ["source", "install", "link", "decision", "load"]
const REDUNDANT_NOTES = new Set(["owned", "project", "global only"])

let ok = true
function check(cond, msg) { if (!cond) { console.error("skill validate: " + msg); ok = false } }

async function validate() {
  ok = true
  drift = null
  const root = gitRoot()
  const registry = await loadRegistry()
  const lockedSkills = loadSkillLock(root)
  const registryProjectSkills = new Set()

  check(registry?.schema_version === 3, "schema_version must be 3")
  check(isRecord(registry?.skills), "skills must be a mapping")
  check(!Object.hasOwn(registry ?? {}, "electrobun_routing"), "top-level electrobun_routing must not exist")

  const skills = registry.skills ?? {}
  for (const [name, skill] of Object.entries(skills)) {
    check(isRecord(skill), name + " must be a mapping")
    if (!isRecord(skill)) continue

    check(ALLOWED_LOCATIONS.has(skill.location), name + ".location invalid: " + skill.location)
    check(typeof skill.rationale === "string" && skill.rationale.trim() !== "", name + ".rationale required")
    check(isRecord(skill.policy), name + ".policy must be a mapping")
    if (!isRecord(skill.policy)) continue
    check(ALLOWED_TYPES.has(skill.policy.type), name + ".policy.type invalid: " + skill.policy.type)
    if (skill.location === "project") {
      registryProjectSkills.add(name)
      check(lockedSkills.has(name), name + ": location project requires an entry in skills-lock.json")
    } else {
      check(!lockedSkills.has(name), name + ": only location project entries may appear in skills-lock.json")
    }

    for (const f of FORBIDDEN_SKILL_FIELDS) {
      check(!Object.hasOwn(skill, f), name + " must not have forbidden field: " + f)
    }

    const t = skill.policy.type
    const hasUsage = isRecord(skill.policy.usage)
    const hasRouting = isRecord(skill.policy.routing)
    const hasSurfaces = isRecord(skill.policy.surfaces)
    const hasReason = typeof skill.policy.reason === "string" && skill.policy.reason.trim() !== ""
    const hasRedirect = Array.isArray(skill.policy.redirect_to)

    if (t === "required") {
      check(hasUsage, name + ": required must have usage")
      check(!hasRouting, name + ": required must not have routing")
      check(!hasSurfaces, name + ": required must not have surfaces")
      check(!hasReason, name + ": required must not have reason")
      check(!hasRedirect, name + ": required must not have redirect_to")
    } else if (t === "routed") {
      check(hasUsage, name + ": routed must have usage")
      check(hasRouting && Object.keys(skill.policy.routing).length > 0, name + ": routed must have non-empty routing")
      check(!hasSurfaces, name + ": routed must not have surfaces")
      check(!hasReason, name + ": routed must not have reason")
      check(!hasRedirect, name + ": routed must not have redirect_to")
    } else if (t === "optional") {
      check(hasUsage, name + ": optional must have usage")
      check(!hasRouting, name + ": optional must not have routing")
      check(!hasReason, name + ": optional must not have reason")
      check(!hasRedirect, name + ": optional must not have redirect_to")
    } else if (t === "reference") {
      check(hasUsage, name + ": reference must have usage")
      check(!hasRouting, name + ": reference must not have routing")
      check(!hasSurfaces, name + ": reference must not have surfaces")
      check(!hasReason, name + ": reference must not have reason")
      check(!hasRedirect, name + ": reference must not have redirect_to")
    } else if (t === "blocked") {
      check(hasReason, name + ": blocked must have reason")
      check(!hasUsage, name + ": blocked must not have usage")
      check(!hasRouting, name + ": blocked must not have routing")
      check(!hasSurfaces, name + ": blocked must not have surfaces")
      check(skill.location === "global", name + ": blocked requires location: global")
    }

    if (hasUsage) {
      check(typeof skill.policy.usage.summary === "string" && skill.policy.usage.summary.trim() !== "", name + ".usage.summary required")
      const load = skill.policy.usage.when?.load
      check(Array.isArray(load) && load.length > 0, name + ".usage.when.load must be a non-empty list")
      if (Array.isArray(load)) {
        for (const item of load) check(typeof item === "string" && item.trim() !== "", name + ".usage.when.load entries must be non-empty strings")
      }
      const avoid = skill.policy.usage.when?.avoid
      check(Array.isArray(avoid), name + ".usage.when.avoid must be a list")
    }

    if (hasRouting) {
      for (const [surface, routes] of Object.entries(skill.policy.routing)) {
        check(Array.isArray(routes), name + ".routing." + surface + " must be a list")
        if (!Array.isArray(routes)) continue
        for (const route of routes) {
          check(isRecord(route), name + ".routing." + surface + " entries must be mappings")
          if (!isRecord(route)) continue
          check(typeof route.order === "number", name + ".routing." + surface + ".order must be numeric")
          check(Array.isArray(route.triggers) && route.triggers.length > 0, name + ".routing." + surface + ".triggers must be non-empty list")
          if (Array.isArray(route.triggers)) {
            for (const t of route.triggers) check(typeof t === "string" && t.trim() !== "", name + ".routing." + surface + ".triggers entries must be non-empty strings")
          }
          if (Object.hasOwn(route, "note")) {
            check(typeof route.note === "string" && route.note.trim() !== "", name + ".routing." + surface + ".note must be non-empty string when present")
            check(!REDUNDANT_NOTES.has(route.note?.trim()), name + ".routing." + surface + ".note must not be a redundant status note: " + route.note)
          }
        }
      }
    }
  }
  for (const lockedName of lockedSkills) {
    check(registryProjectSkills.has(lockedName), lockedName + ": skills-lock.json entry requires a matching location project registry entry")
  }

  // Actual project installs check via Skills CLI
  const actualSkills = loadActualProjectSkills(root)
  if (actualSkills === null) {
    check(false, "skills CLI unavailable — cannot validate actual project installs")
  } else {
    const expectedSkills = new Set()
    for (const [name, skill] of Object.entries(skills)) {
      if (skill.location === "owned" || skill.location === "project") expectedSkills.add(name)
    }
    const { missing, extra } = diffSets(actualSkills, expectedSkills)
    for (const m of missing) check(false, m + ": expected project skill not installed — run mise run skill install")
    for (const e of extra) check(false, e + ": installed project skill not in registry as owned or project")
    drift = { actual_skills: [...actualSkills].sort(), expected_skills: [...expectedSkills].sort(), missing, extra }
  }

  validateOk = ok
  if (!ok && !JSON_OUT) return // validation-only exits with failure below; report collects drift
}

// ── Replace Managed Block ─────────────────────────────────────────────

function replaceManaged(root, relativePath, marker, content) {
  const fp = join(root, relativePath)
  const start = "<!-- skills:" + marker + ":start -->"
  const end = "<!-- skills:" + marker + ":end -->"
  const orig = readFileSync(fp, "utf8")
  const si = orig.indexOf(start), ei = orig.indexOf(end)
  if (si === -1 || ei === -1 || ei < si) { console.error("skill sync: missing markers for " + marker + " in " + relativePath); process.exit(1) }
  const next = orig.slice(0, si + start.length) + "\n" + content.trimEnd() + "\n" + orig.slice(ei)
  if (DRY_RUN) {
    const status = next === orig ? "up to date" : "would update"
    console.log("skill sync: dry-run " + status + " " + relativePath + ":" + marker)
    return
  }
  writeFileSync(fp, next)
}

function statusNote(location) {
  if (location === "project") return "project"
  if (location === "owned") return "owned"
  return "global only"
}

// ── Sync ──────────────────────────────────────────────────────────────

async function sync() {
  await validate()
  const registry = await loadRegistry()
  const root = gitRoot()
  const skills = registry.skills ?? {}

  // Optional companions
  const optionals = Object.entries(skills)
    .filter(([, s]) => s.policy.type === "optional" && isRecord(s.policy.surfaces))
    .map(([name, s]) => ({ name, ...s }))

  const claudeList = optionals
    .map(s => "- `" + s.name + "` - " + s.policy.surfaces.claude_optional)
    .join("\n")
  replaceManaged(root, "CLAUDE.md", "optional-companions", claudeList)

  const ctxTable = [
    "| Skill | When |",
    "| --- | --- |",
    ...optionals.map(s => "| **" + s.name + "** | " + s.policy.surfaces.app_context_optional + " |"),
  ].join("\n")
  replaceManaged(root, ".agents/skills/app-context/SKILL.md", "optional-companions", ctxTable)

  // Electrobun routing
  const ebRoutes = []
  for (const [name, skill] of Object.entries(skills)) {
    const eb = isRecord(skill.policy?.routing) ? skill.policy.routing.electrobun : undefined
    if (!Array.isArray(eb)) continue
    for (const route of eb) ebRoutes.push({ name, ...route })
  }
  ebRoutes.sort((a, b) => a.order - b.order)

  const ebTable = [
    "| When the task involves... | Read this skill first | Note |",
    "| --- | --- | --- |",
    ...ebRoutes.map(r => {
      const skill = skills[r.name]
      let note = statusNote(skill.location)
      if (r.note) note += " - " + r.note
      const triggers = (r.triggers ?? []).join(", ")
      return "| " + triggers + " | `" + r.name + "` | " + note + " |"
    }),
  ].join("\n")
  replaceManaged(root, ".cursor/electrobun-skill-routing.md", "electrobun-routing", ebTable)
}

// ── Install ────────────────────────────────────────────────────────────

async function install() {
  await validate()
  if (DRY_RUN) {
    console.log("skill install: dry-run would run skills experimental_install")
    return
  }
  const child = Bun.spawnSync(["skills", "experimental_install"], {
    cwd: gitRoot(),
    stdout: "inherit",
    stderr: "inherit",
  })
  if (child.exitCode !== 0) process.exit(child.exitCode ?? 1)
}

// ── Report ─────────────────────────────────────────────────────────────

async function report() {
  await validate()
  const registry = await loadRegistry()
  const skills = registry.skills ?? {}
  const byLoc = {}, byType = {}
  let ebTotal = 0
  for (const [, s] of Object.entries(skills)) {
    const loc = s.location || "?"
    const t = s.policy?.type || "?"
    byLoc[loc] = (byLoc[loc] || 0) + 1
    byType[t] = (byType[t] || 0) + 1
    const eb = isRecord(s.policy?.routing) ? s.policy.routing.electrobun : undefined
    if (Array.isArray(eb)) ebTotal += eb.length
  }
  const data = {
    schema_version: registry.schema_version,
    total_skills: Object.keys(skills).length,
    by_location: byLoc,
    by_policy_type: byType,
    electrobun_routes: ebTotal,
    valid: validateOk,
    drift: drift ?? {},
  }
  if (JSON_OUT) {
    console.log(JSON.stringify(data, null, 2))
  } else {
    console.log("schema_version:", data.schema_version)
    console.log("total_skills:", data.total_skills)
    console.log("by_location:", JSON.stringify(data.by_location))
    console.log("by_policy_type:", JSON.stringify(data.by_policy_type))
    console.log("electrobun_routes:", data.electrobun_routes)
    console.log("valid:", data.valid)
    if (drift) {
      if (drift.missing.length) console.log("missing:", JSON.stringify(drift.missing))
      if (drift.extra.length) console.log("extra:", JSON.stringify(drift.extra))
      else console.log("drift: none")
    }
  }
}

// ── Dispatch ───────────────────────────────────────────────────────────

if (ACTION === "validate") { await validate(); if (!validateOk) process.exit(1) }
else if (ACTION === "sync") { await sync(); if (!validateOk) process.exit(1) }
else if (ACTION === "install") { await install(); if (!validateOk) process.exit(1) }
else if (ACTION === "all") { await sync(); await install() }
else if (ACTION === "report") { await report(); if (!validateOk) process.exit(1) }

if (!ok) process.exit(1)
''' }
# mise run docker build
# mise run docker build --nocache --platform amd64
# mise run docker build --nocache --tag next
# mise run docker run
# mise run docker run --tag local
# mise run docker run --xcompile all --prod
# mise run docker test
# mise run docker test --platform amd64
# mise run docker test --skip-build           # reuse the current local image
"docker" = { description = "Build, run, and test the Docker image", usage = '''
    cmd "build" {
        flag "--nocache" help="Disable build cache"
        flag "--tag <tag>" help="Image tag suffix" default="latest"
        flag "--image <image>" help="Image name (without tag)" env="REGISTRY_IMAGE" default="roalcantara/kb"
        flag "--platform <platform>" {
            help "Target platform"
            choices "amd64" "arm64" "amd64v2"
            default "arm64"
        }
    }
    cmd "run" {
        flag "--tag <tag>" help="Image tag (use with built image)" default="latest"
        flag "--image <image>" help="Image name (without tag)" env="REGISTRY_IMAGE" default="roalcantara/kb"
        flag "--xcompile <target>" {
            help "Cross-compile dist/kb in Ubuntu (clean bun install) instead of an interactive shell"
            choices "all" "bun-linux-x64-modern" "bun-linux-arm64" "bun-darwin-arm64"
        }
        flag "--prod" help="With --xcompile: bun install --production (omit devDependencies)"
    }
    cmd "test" {
        flag "--tag <tag>" help="Image tag" default="latest"
        flag "--image <image>" help="Image name (without tag)" env="REGISTRY_IMAGE" default="roalcantara/kb"
        flag "--config <config>" help="CST config path" env="CST_CONFIG" default="tools/container-structure-test.yml"
        flag "--platform <platform>" {
            help "Target platform (forwarded to docker build)"
            choices "amd64" "arm64" "amd64v2"
            default "arm64"
        }
        flag "--nocache" help="Disable build cache (forwarded to docker build)"
        flag "--skip-build" help="Skip docker build and test the existing image"
        flag "--junit <path>" help="Write CST results as JUnit XML to <path> (for CI reporting)"
    }
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    CMD="${usage_cmd:-}"
    case "$CMD" in
      build)
        case "$usage_platform" in
          amd64)    PLATFORM_VALUE="linux/amd64" ;;
          arm64)    PLATFORM_VALUE="linux/arm64" ;;
          amd64v2)  PLATFORM_VALUE="linux/amd64/v2" ;;
        esac
        DOCKER_CMD=(DOCKER_BUILDKIT=1 docker build --build-arg=BUILDKIT_INLINE_CACHE=1 --platform="$PLATFORM_VALUE" --file="Dockerfile")
        [ "${usage_nocache:-false}" = "true" ] && DOCKER_CMD+=(--no-cache)
        DOCKER_CMD+=(--tag "$usage_image:$usage_tag" .)
        echo "  ==> ${DOCKER_CMD[*]}"
        eval "${DOCKER_CMD[*]}"
        ;;
      run)
        if [ -n "${usage_xcompile:-}" ]; then
          target="${usage_xcompile:?}"
          case "$target" in
            all) targets=(bun-linux-x64-modern bun-linux-arm64 bun-darwin-arm64) ;;
            bun-linux-x64-modern|bun-linux-arm64|bun-darwin-arm64) targets=("$target") ;;
            *) echo "unknown --xcompile: $target" >&2; exit 1 ;;
          esac
          export XCOMPILE_TARGETS="${targets[*]}"
          export XCOMPILE_PROD="${usage_prod:-false}"
          echo "  ==> docker xcompile (Ubuntu 24.04): $XCOMPILE_TARGETS prod=${XCOMPILE_PROD}"
          docker run --rm \
            -e XCOMPILE_TARGETS \
            -e XCOMPILE_PROD \
            -v "$PWD:/repo" \
            -w /repo \
            ubuntu:24.04 \
            bash -lc 'set -euo pipefail
              apt-get update -y >/dev/null
              apt-get install -y curl unzip ca-certificates rsync >/dev/null
              curl -fsSL https://bun.sh/install | bash >/dev/null
              export PATH="/root/.bun/bin:$PATH"
              bun --version
              work=/tmp/kb-work
              rm -rf "$work"
              mkdir -p "$work"
              rsync -a /repo/ "$work/" --exclude node_modules --exclude dist --exclude .git
              cd "$work"
              if [ "${XCOMPILE_PROD:-false}" = "true" ]; then
                bun install --frozen-lockfile --production
              else
                bun install --frozen-lockfile
              fi
              mkdir -p /repo/dist
              for t in $XCOMPILE_TARGETS; do
                echo "=== build:prod --target=$t ==="
                slug="${t#bun-}"
                out="/tmp/kb.$slug"
                bun build apps/kb/src/index.ts --minify --sourcemap --no-compile-autoload-dotenv --no-compile-autoload-bunfig --compile --outfile "$out" --target="$t"
                cp "$out" "/repo/dist/kb-$slug"
                rm -f "$out"
              done'
          exit 0
        fi
        echo "  ==> docker run -it --rm $usage_image:${usage_tag}"
        docker run -it --rm "$usage_image:$usage_tag"
        ;;
      test)
        image="${usage_image}:${usage_tag}"
        if [ "${usage_skip_build:-false}" != "true" ]; then
          BUILD_CMD=(mise run docker build --tag "$usage_tag" --image "$usage_image" --platform "$usage_platform")
          [ "${usage_nocache:-false}" = "true" ] && BUILD_CMD+=(--nocache)
          echo "  ==> ${BUILD_CMD[*]}"
          "${BUILD_CMD[@]}"
        fi
        case "$usage_platform" in
          amd64)    CST_PLATFORM="linux/amd64" ;;
          arm64)    CST_PLATFORM="linux/arm64" ;;
          amd64v2)  CST_PLATFORM="linux/amd64/v2" ;;
        esac
        CST_CMD=(mise exec -- container-structure-test test
          --image "$image"
          --config "$usage_config"
          --platform "$CST_PLATFORM")
        if [ -n "${usage_junit:-}" ]; then
          mkdir -p "$(dirname "$usage_junit")"
          CST_CMD+=(--output junit --test-report "$usage_junit")
        fi
        echo "  ==> ${CST_CMD[*]}"
        "${CST_CMD[@]}"
        ;;
      *) echo "docker: unknown action '${CMD}' (expected one of: build, run, test)"; exit 2 ;;
    esac
  ''' }
