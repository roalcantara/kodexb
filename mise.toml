# https://mise.jdx.dev
[tools]
bun = "1.3.14"
usage = "latest"
hk = "1.45.0"
ast-grep = "latest"
tombi = "0.9.22"
actionlint = "latest"
hadolint = "latest"
gitleaks = "latest"
container-structure-test = "latest"
act = "latest"
gum = "latest"
biome = "latest"
shellcheck = "latest"

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"

[tasks]
"project" = { description = "Manage setup, dependencies, cleanup, icons, repository, and local maintenance", usage = '''
    cmd "setup" {}
    cmd "prepare" { flag "--ci" help="Install dependencies for CI" }
    cmd "clean" {}
    cmd "cleanup" {}
    cmd "reinstall" {}
    cmd "repo" {
        cmd "setup" {}
        cmd "prune" {}
        cmd "reset" {}
    }
    cmd "icons" {
        flag "--fix" help="Apply safe hex replacements"
    }
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    CMD="${usage_cmd:-}"
    case "$CMD" in
      setup)
        mise install --yes && mise run project prepare
        ;;
      prepare)
        bun install ${usage_ci:+--frozen-lockfile}
        ${usage_ci:-false} || hk install --mise
        ;;
      clean)
        rm -rf dist tmp .electrobun-cache
        ;;
      cleanup)
        mise run project clean
        rm -rf node_modules bun.lock*
        ;;
      reinstall)
        mise run project cleanup
        mise exec -- bun install
        ;;
      "repo setup")
        gh repo create kb --public --push --source=. 2>/dev/null || echo "Repo may already exist"
        ;;
      "repo prune")
        echo "WARNING: This will delete all tags, releases and the repo."
        read -rp "Type 'yes' to confirm: " c
        [[ "$c" == "yes" ]] || { echo "Aborted."; exit 0; }
        for tag in $(git tag -l); do git push origin --delete "$tag" 2>/dev/null; git tag -d "$tag"; done
        gh api repos/:owner/:name --silent && gh repo delete kb --yes || true
        ;;
      "repo reset")
        echo "DANGER: Rewrites git history."
        read -rp "Type 'yes' to confirm: " c
        [[ "$c" == "yes" ]] || { echo "Aborted."; exit 0; }
        for tag in $(git tag -l); do git push origin --delete "$tag" 2>/dev/null; git tag -d "$tag"; done
        git checkout main && git reset --hard "$(git rev-list --max-parents=0 HEAD)" && git push --force origin main
        ;;
      icons)
        if [[ "${usage_fix:-false}" == "true" ]]; then
          mise run _icons check --write-safe
        else
          mise run _icons check
        fi
        ;;
      *) echo "project: unknown action ${CMD}"; exit 2 ;;
    esac
  ''' }
"ci" = { description = "Run review, release, and publish CI workflows", usage = '''
    cmd "review" {
        flag "--lint" help="Run lint checks"
        flag "--test" help="Run tests"
        flag "--build" help="Run build smoke"
    }
    cmd "release" {
        flag "--check-signing" help="Check commit and tag signing"
        flag "--check-squash" help="Check HEAD is a single squash commit"
        flag "--dry-run" help="Dry run release-it"
        flag "--notes" help="Generate release notes"
    }
    cmd "publish" {
        cmd "build" {}
        cmd "package" {
            flag "--version <ver>" help="Release version"
            flag "--target <target>" help="Build target" { choices "linux-x64" "linux-arm64" "darwin-arm64" }
        }
        cmd "checksum" {}
    }
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail
    CMD="${usage_cmd:-}"
    if [[ -z "$CMD" ]]; then
      mise run project prepare --ci
      bun run lint
      mise run test ci
      ELECTROBUN_DEVELOPER_ID="" bun run build
      exit $?
    fi
    case "$CMD" in
      review)
        if [[ -z "${usage_lint:-}${usage_test:-}${usage_build:-}" ]]; then
          bun run lint
          mise run test ci
          ELECTROBUN_DEVELOPER_ID="" bun run build
        else
          if [[ "${usage_lint:-false}" == "true" ]]; then
            bun run lint
          fi
          if [[ "${usage_test:-false}" == "true" ]]; then
            mise run test ci
          fi
          if [[ "${usage_build:-false}" == "true" ]]; then
            ELECTROBUN_DEVELOPER_ID="" bun run build
          fi
        fi
        ;;
      release)
        if [[ "${usage_check_signing:-false}" != "true" && "${usage_check_squash:-false}" != "true" && "${usage_dry_run:-false}" != "true" && "${usage_notes:-false}" != "true" ]]; then
          echo "ci release: at least one flag required. Available: --check-signing, --check-squash, --dry-run, --notes" >&2
          exit 1
        fi
        if [[ "${usage_check_signing:-false}" == "true" ]]; then
            tmp="$(mktemp -d)"
            tag="signing-test-tag-$$"
            trap "rm -rf \"$tmp\"" EXIT
            cd "$tmp" && git init -q && git config commit.gpgsign true && git config tag.gpgsign true
            echo test > f.txt && git add f.txt && git commit -q -m "test: signing"
            git cat-file -p HEAD | grep -q "^gpgsig" || { echo "ERROR: commit not signed"; exit 1; }
            git tag -s "$tag" -m signing
            git cat-file -p "$tag" | grep -qE "BEGIN (PGP|SSH) SIGNATURE" || { echo "ERROR: tag not signed"; exit 1; }
            echo "OK: signed commit + signed tag verified."
        fi
        if [[ "${usage_check_squash:-false}" == "true" ]]; then
            subject="$(git log -1 --pretty=%s HEAD)"
            [[ "$subject" =~ ^Merge\ (pull\ request|branch) ]] && { echo "ERROR: HEAD is a merge commit: $subject" >&2; exit 1; }
            echo "OK: HEAD subject is '$subject'"
        fi
        if [[ "${usage_dry_run:-false}" == "true" ]]; then
          bunx release-it --dry-run --ci
        fi
        if [[ "${usage_notes:-false}" == "true" ]]; then
          bunx release-it --release-notes-only --dry-run --ci 2>/dev/null || true
        fi
        ;;
      "publish build")
        bun run build:prod
        ;;
      "publish package")
        : "${usage_version:?--version required}"
        target="${usage_target:-$(uname -s|tr A-Z a-z)-$(uname -m|sed -e s/x86_64/x64/ -e s/aarch64/arm64/)}"
        [[ "$target" == "darwin-x64" ]] && target=darwin-arm64
        case "$target" in
          linux-*) tar czf "kb-${usage_version}-${target}.tar.gz" -C dist . ;;
          darwin-*) DMG="$(find dist -maxdepth 3 -type f -name '*.dmg'|head -n1)"; [[ -n "$DMG" ]] || { echo "ERROR: no .dmg"; exit 1; }; suffix=""; [[ -z "${ELECTROBUN_DEVELOPER_ID:-}" ]] && suffix="-unsigned"; mv "$DMG" "kb-${usage_version}-${target}${suffix}.dmg" ;;
          *) echo "ERROR: unknown target $target"; exit 1 ;;
        esac
        ;;
      "publish checksum")
        shopt -s nullglob
        sha256sum *.tar.gz *.dmg 2>/dev/null > checksums.txt || true
        test -s checksums.txt && cat checksums.txt || echo "No artifacts"
        ;;
      *) echo "ci: unknown command $CMD"; exit 2 ;;
    esac
  ''' }
"test" = { description = "Run unit, CI, e2e preview, spec audit, and style checks", usage = '''
    cmd "unit" {}
    cmd "ci" {}
    cmd "spec-audit" {
      flag "--strict" help="Exit non-zero on findings"
    }
    cmd "spec-style" {
      flag "--strict" help="Exit non-zero on findings"
      flag "--scope <scope>" default="src" help="Limit spec-style to src, a path, or layer alias"
      flag "--format <format>" default="text" help="Spec-style output format" {
        choices "text" "markdown"
      }
      flag "--update-ledger" help="Update normalise-specs Phase 12 audit block"
    }
    cmd "e2e-preview" {}
    cmd "e2e" {
      flag "--smoke" help="P0 Gherkin smoke (@smoke) only"
      flag "--regression" help="P0+P1 Gherkin regression (@regression) only"
      flag "--debug" help="Playwright debug UI for BDD suite"
      flag "--metrics-report" help="Write tmp/e2e/metrics/latest.json from JUnit + scenario scores"
      flag "--metrics-compare" help="Compare latest metrics to quality-baseline.json"
      flag "--write-baseline" help="Maintainer: refresh quality-baseline.json from latest run"
    }
  ''', run = '''
    #!/usr/bin/env bun
    import { existsSync, mkdirSync } from 'node:fs'
    import path from 'node:path'

    const ACTION = process.env.usage_cmd ?? 'unit'
    const STRICT = process.env.usage_strict === 'true'
    const STYLE_FORMAT = process.env.usage_format ?? 'text'
    const UPDATE_LEDGER =
      process.env.usage_update_ledger === 'true' || process.env['usage_update-ledger'] === 'true'

    function die(msg: string, code = 1): never {
      console.error(msg)
      process.exit(code)
    }

    function chdirToGitRoot(): string {
      const r = Bun.spawnSync(['git', 'rev-parse', '--show-toplevel'])
      const root = r.stdout.toString().trim()
      if (!r.success || !root) die('test: run from inside the app git checkout')
      process.chdir(root)
      return root
    }

    function runInherit(cmd: string[]): never {
      const r = Bun.spawnSync(cmd, { stdout: 'inherit', stderr: 'inherit', stdin: 'inherit' })
      process.exit(r.exitCode ?? (r.success ? 0 : 1))
    }

    const ROOT = chdirToGitRoot()
    const SRC = path.join(ROOT, 'src')

    function runSpecAudit(): void {
      const EXEMPT_SUFFIXES = ['.d.ts', '.types.ts', '.const.ts', '.guard.ts']
      const EXEMPT_FILES = ['index.ts', 'main.ts', 'registry.ts', 'generated.ts']
      const TS_EXT_RE = /\.tsx?$/
      const SOURCE_GLOB = new Bun.Glob('**/*.{ts,tsx}')

      function hasSpec(filePath: string): boolean {
        const stem = filePath.replace(TS_EXT_RE, '')
        return existsSync(`${stem}.spec.ts`) || existsSync(`${stem}.spec.tsx`)
      }

      function isExempt(rel: string): boolean {
        if (!rel.startsWith('src/')) return true
        if (EXEMPT_SUFFIXES.some(suffix => rel.endsWith(suffix))) return true
        const base = rel.split('/').pop() ?? ''
        if (EXEMPT_FILES.some(f => base === f || base.endsWith(`.${f}`))) return true
        if (base.endsWith('.schema.ts') || base.endsWith('.schemas.ts')) return true
        if (base === 'index.ts' || base === 'shared.ts') return true
        return rel.includes('__tests__/fixtures') || rel.includes('generated')
      }

      const missing = [...SOURCE_GLOB.scanSync(SRC)]
        .flatMap(name => {
          const full = path.join(SRC, name)
          const rel = path.relative(ROOT, full).replace(/\\/g, '/')
          if (isExempt(rel) || hasSpec(full)) return []
          return [rel]
        })
        .sort()

      for (const m of missing) console.log(m)
      if (missing.length > 0) {
        console.error('missing specs:', missing.length)
        if (STRICT) process.exit(1)
      }
    }

    async function runSpecStyle(): Promise<void> {
      const LEDGER_START = '<!-- phase-12-style-audit:start -->'
      const LEDGER_END = '<!-- phase-12-style-audit:end -->'
      const TRAILING_SLASH_RE = /\/$/
      const SPEC_GLOB = new Bun.Glob('**/*.spec.{ts,tsx}')
      const SCOPE_ALIASES: Record<string, string> = {
        'test-helper': 'src/__tests__',
        core: 'src/core',
        shared: 'src/shared',
        'shell-app': 'src/shell/app',
        'shell-main': 'src/shell/main',
        'shell-renderer': 'src/shell/renderer',
      }
      const LEDGER = path.join(ROOT, 'assets/docs/specs/normalise-specs/tasks.md')

      type StyleIssue = { file: string; category: string; message: string }

      function normalizeScope(raw: string): string {
        const value = SCOPE_ALIASES[raw] || raw || 'src'
        const scoped = value.startsWith('src') ? value : `src/${value}`
        return path.normalize(scoped).replace(/\\/g, '/').replace(TRAILING_SLASH_RE, '')
      }

      const scope = normalizeScope(process.env.usage_scope || 'src')
      const relPath = (full: string) => path.relative(ROOT, full).replace(/\\/g, '/')
      const inScope = (rel: string) => rel === scope || rel.startsWith(`${scope}/`)

      async function loadFactoryNames(): Promise<Set<string>> {
        const file = Bun.file(path.join(ROOT, 'src/__tests__/factories/factories.builder.ts'))
        if (!(await file.exists())) return new Set()
        const c = await file.text()
        const start = c.indexOf('const factories = {')
        const end = c.indexOf('} as const', start)
        if (start < 0 || end < start) return new Set()
        return new Set(
          [...c.slice(start, end).matchAll(/(?:'([^']+)'|(\w+))\s*:/g)]
            .map(x => x[1] ?? x[2])
            .filter((name): name is string => name !== undefined),
        )
      }

      function auditSpec(rel: string, c: string, knownFactories: Set<string>): StyleIssue[] {
        const findings: StyleIssue[] = []
        const add = (category: string, message: string) => findings.push({ file: rel, category, message })

        if (/import\s*\{[^}]*\btest\b/.test(c)) add('test usage', 'imports test from bun:test (use it)')
        if (/^\s*test\(/m.test(c)) add('test usage', 'uses test() (use it)')
        if (!c.includes('describe(')) add('no describe', 'no describe block')
        if (c.includes('describe(') && !/describe\(['"]when |describe\(['"]with |describe\(['"]without /.test(c)) {
          add('no situation', 'no when/with/without situation describe')
        }
        for (const l of c.split('\n')) {
          const m = l.match(/^\s*it\('(.{41,})'\)/)
          if (m) {
            add('long description', `${m[1]?.slice(0, 60) ?? ''}: description > 40 chars`)
            break
          }
        }
        if (/expect\([^)]*===/.test(c) && /\.toBe\(true\)|\.toBe\(false\)/.test(c)) {
          add('opaque boolean matcher', 'opaque boolean matcher (use readable matcher)')
        }
        if (/window\.dispatchEvent/.test(c) || /document\.dispatchEvent/.test(c)) {
          add('global dispatchEvent', 'uses global dispatchEvent')
        }
        if (/\bmock\s*\(/.test(c) || /\bspyOn\s*\(/.test(c) || /\bmock\.module\s*\(/.test(c)) {
          add('mock usage', 'uses mock, spyOn, or mock.module')
        }
        for (const [, name] of c.matchAll(/factoryFor\('([^']+)'/g)) {
          if (name && !knownFactories.has(name)) {
            add('unknown factory', `factoryFor('${name}') not in factories.builder.ts`)
          }
        }
        return findings
      }

      function categoryCounts(findings: StyleIssue[]): [string, number][] {
        const counts = new Map<string, number>()
        for (const { category } of findings) counts.set(category, (counts.get(category) ?? 0) + 1)
        return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]))
      }

      function render(specCount: number, findings: StyleIssue[], asMarkdown: boolean): string {
        const counts = categoryCounts(findings)
        if (!asMarkdown) {
          const lines = [`scope: ${scope}`, `specs scanned: ${specCount}`]
          for (const [category, count] of counts) lines.push(`${category}: ${count}`)
          for (const issue of findings) lines.push(`${issue.file}: ${issue.message}`)
          lines.push(`style issues: ${findings.length}`)
          return lines.join('\n')
        }
        const lines = [
          '### Better Specs style audit',
          '',
          `- Scope: \`${scope}\``,
          `- Specs scanned: ${specCount}`,
          `- Style issues: ${findings.length}`,
          '',
          '| Category | Count |',
          '| --- | ---: |',
          ...(counts.length === 0 ? ['| none | 0 |'] : counts.map(([c, n]) => `| ${c} | ${n} |`)),
          '',
        ]
        if (findings.length > 0) {
          lines.push('<details>', '<summary>Findings</summary>', '')
          for (const issue of findings) lines.push(`- \`${issue.file}\` — ${issue.message}`)
          lines.push('', '</details>')
        }
        return lines.join('\n')
      }

      async function updateLedger(ledgerBody: string): Promise<void> {
        const file = Bun.file(LEDGER)
        if (!(await file.exists())) die(`ledger not found: ${path.relative(ROOT, LEDGER)}`)
        const current = await file.text()
        const start = current.lastIndexOf(LEDGER_START)
        const end = current.indexOf(LEDGER_END, start)
        if (start < 0 || end < 0) die('ledger markers not found')
        const replacement = `${LEDGER_START}\n${ledgerBody}\n${LEDGER_END}`
        await Bun.write(LEDGER, current.slice(0, start) + replacement + current.slice(end + LEDGER_END.length))
      }

      const specPaths = [...SPEC_GLOB.scanSync(SRC)]
        .map(name => path.join(SRC, name))
        .filter(full => inScope(relPath(full)))
        .sort()

      const factoryNames = await loadFactoryNames()
      const specTexts = await Promise.all(specPaths.map(full => Bun.file(full).text()))
      const issues = specPaths.flatMap((full, index) =>
        auditSpec(relPath(full), specTexts[index] ?? '', factoryNames),
      )

      const markdown = render(specPaths.length, issues, true)
      const report = STYLE_FORMAT === 'markdown' ? markdown : render(specPaths.length, issues, false)
      console.log(report)
      if (UPDATE_LEDGER) await updateLedger(markdown)
      if (issues.length > 0 && STRICT) process.exit(1)
    }

    switch (ACTION) {
      case 'unit':
        runInherit(['bun', 'test', '--pass-with-no-tests'])
        break
      case 'ci': {
        mkdirSync(path.join(ROOT, 'tmp/reports/tests'), { recursive: true })
        runInherit([
          'bun',
          'test',
          '--pass-with-no-tests',
          '--reporter=junit',
          '--reporter-outfile=tmp/reports/tests/junit.xml',
          '--coverage',
          '--coverage-dir=tmp/reports/tests/coverage',
        ])
      }
      case 'spec-audit':
        runSpecAudit()
        break
      case 'spec-style':
        await runSpecStyle()
        break
      case 'e2e-preview':
        runInherit(['bun', 'run', 'e2e:preview'])
        break
      case 'e2e': {
        const smoke = process.env.usage_smoke === 'true'
        const regression = process.env.usage_regression === 'true'
        const debug = process.env.usage_debug === 'true'
        const metricsReport = process.env.usage_metrics_report === 'true' || process.env['usage_metrics-report'] === 'true'
        const metricsCompare = process.env.usage_metrics_compare === 'true' || process.env['usage_metrics-compare'] === 'true'
        const writeBaseline = process.env.usage_write_baseline === 'true' || process.env['usage_write-baseline'] === 'true'
        if (metricsReport) {
          runInherit(['bun', 'tools/e2e/e2e_metrics.script.ts', 'report'])
        } else if (metricsCompare) {
          runInherit(['bun', 'tools/e2e/e2e_metrics.script.ts', 'compare'])
        } else if (writeBaseline) {
          runInherit(['bun', 'tools/e2e/e2e_metrics.script.ts', 'write-baseline'])
        } else if (smoke) {
          runInherit(['bun', 'run', 'e2e:smoke'])
        } else if (regression) {
          runInherit(['bun', 'run', 'e2e:regression'])
        } else if (debug) {
          runInherit(['bun', 'run', 'e2e:bddgen'])
          runInherit(['bunx', 'playwright', 'test', '--ui'])
        } else {
          runInherit(['bun', 'run', 'e2e'])
        }
        break
      }
      default:
        die(`test: unknown action ${ACTION}`, 2)
    }

  ''' }
"perf" = { description = "Run preview-server performance benchmark workflows", usage = '''
    cmd "run" {
      flag "--port <port>" default="3457" help="Preview server port for run action"
    }
    cmd "baseline" {}
    cmd "compare" {}
    cmd "open" {}
  ''', run = '''
    #!/usr/bin/env bun
    import { mkdir } from 'node:fs/promises'
    import path from 'node:path'

    const P50_QUANTILE = 0.5
    const P99_QUANTILE = 0.99
    const MS_PER_SECOND = 1000
    const READINESS_POLL_MAX = 900
    const READINESS_POLL_MS = 100
    const DEFAULT_SAMPLE_COUNT = 100
    const THROUGHPUT_DURATION_MS = 10_000
    const THROUGHPUT_CONCURRENCY = 10
    const ISO_SLUG_LEN = 19
    const GIT_SHA_SHORT = 8
    const DATE_SHORT = 10
    const LATEST_JSON = 'latest.json'
    const BASELINE_JSON = 'baseline.json'
    const JSON_HEADERS = { 'Content-Type': 'application/json' }
    const ROOT = spawnText(['git', 'rev-parse', '--show-toplevel'])
    const BENCH = path.join(ROOT, 'tools', 'benchmarks')
    const SERVER = path.join(ROOT, 'tools', 'preview', 'server.ts')
    const RESULTS = path.join(BENCH, 'results')
    const PATH_SECTION: Record<BenchPath, string> = {
      p1: 'cold start',
      p2: 'FTS',
      p3: 'filter',
      p4: 'throughput',
      p5: 'stats'
    }
    const VIOLATION_METRICS = {
      cold_start: 'cold_start_ms',
      req_per_sec: 'req_per_sec'
    } as const
    const METRIC_SPECS = [
      { path: 'p1', stat: 'cold_start', limit: 300, kind: 'max', compareDir: 'lower', unit: 'ms', precision: 1 },
      { path: 'p2', stat: 'p50', limit: 2, kind: 'max', compareDir: 'lower', unit: 'ms', precision: 1 },
      { path: 'p2', stat: 'p99', limit: 4, kind: 'max', compareDir: 'lower', unit: 'ms', precision: 1 },
      { path: 'p3', stat: 'p50', limit: 2, kind: 'max', compareDir: 'lower', unit: 'ms', precision: 1 },
      { path: 'p3', stat: 'p99', limit: 3, kind: 'max', compareDir: 'lower', unit: 'ms', precision: 1 },
      { path: 'p4', stat: 'req_per_sec', limit: 8000, kind: 'min', compareDir: 'higher', unit: 'r/s', precision: 0 },
      { path: 'p5', stat: 'p50', limit: 3, kind: 'max', compareDir: 'lower', unit: 'ms', precision: 1 },
      { path: 'p5', stat: 'p99', limit: 5, kind: 'max', compareDir: 'lower', unit: 'ms', precision: 1 }
    ] as const
    type MetricSpec = (typeof METRIC_SPECS)[number]
    type BenchmarkResult = {
      timestamp: string
      git_sha: string
      bun_version: string
      thresholds: Record<string, number>
      results: Record<string, number>
      violations: Array<{ path: string; metric: string; value: number; threshold: number; delta: number }>
      summary: 'PASS' | 'FAIL'
    }
    type SpawnSyncOptions = NonNullable<Parameters<typeof Bun.spawnSync>[1]>
    type LatencySample = { p50: number; p99: number }
    type BenchSamples = {
      p1: number
      p2: LatencySample
      p3: LatencySample
      p4: number
      p5: LatencySample
    }
    type BenchPath = 'p1' | 'p2' | 'p3' | 'p4' | 'p5'
    type BenchStat = 'cold_start' | 'p50' | 'p99' | 'req_per_sec'
    type BenchmarkMetric = MetricSpec & {
      key: string
      id: string
      metric: string
      label: string
      reportLabel: string
      valueFrom: (samples: BenchSamples) => number
    }

    const action = process.env.usage_cmd
    const port = Number.parseInt(process.env.usage_port ?? '3457', 10)

    if (!Number.isFinite(port) || port <= 0) {
      console.error('perf: --port must be a positive integer')
      process.exit(1)
    }

    function spawnText(cmd: string[], opts: SpawnSyncOptions = {}): string {
      const child = Bun.spawnSync(cmd, opts)
      if (!child.success) {
        throw new Error((child.stderr ?? Buffer.alloc(0)).toString().trim() || `${cmd.join(' ')} failed`)
      }
      return (child.stdout ?? Buffer.alloc(0)).toString().trim()
    }
    function resultKey(benchPath: BenchPath, stat: BenchStat): string {
      if (stat === 'req_per_sec') return `${benchPath}_req_per_sec`
      if (stat === 'cold_start') return `${benchPath}_cold_start_ms`
      return `${benchPath}_${stat}_ms`
    }

    function displayLabel(benchPath: BenchPath, stat: BenchStat): string {
      const section = PATH_SECTION[benchPath]
      if (stat === 'cold_start' || stat === 'req_per_sec') return section
      return `${section} ${stat}`
    }

    function getMetric(spec: MetricSpec): BenchmarkMetric {
      const id = spec.path.toUpperCase()
      const label = displayLabel(spec.path, spec.stat)
      return {
        ...spec,
        key: resultKey(spec.path, spec.stat),
        id,
        metric: VIOLATION_METRICS[spec.stat as keyof typeof VIOLATION_METRICS] ?? `${spec.stat}_ms`,
        label,
        reportLabel: `${id} ${label}`,
        valueFrom: samples => {
          if (spec.stat === 'p50' || spec.stat === 'p99') {
            return (samples[spec.path] as LatencySample)[spec.stat]
          }
          return samples[spec.path] as number
        }
      }
    }

    const METRICS = METRIC_SPECS.map(getMetric)
    const THRESHOLDS = Object.fromEntries(METRICS.map(m => [m.key, m.limit])) as Record<string, number>

    function resultPath(fileName: string): string {
      return path.join(RESULTS, fileName)
    }

    function formatRunLabel({ git_sha, timestamp }: Pick<BenchmarkResult, 'git_sha' | 'timestamp'>): string {
      return `${git_sha.slice(0, GIT_SHA_SHORT)} (${timestamp.slice(0, DATE_SHORT)})`
    }

    function isoSlug(timestamp: string): string {
      return timestamp.replace(/[:.]/g, '-').slice(0, ISO_SLUG_LEN)
    }

    function percentile(samples: number[], quantile: number): number {
      const last = samples.length - 1
      return samples[Math.floor(last * quantile)] ?? samples.at(-1) ?? 0
    }

    function postJson(baseUrl: string, endpoint: string, body: string | object): Promise<Response> {
      return fetch(`${baseUrl}/api/${endpoint}`, {
        method: 'POST',
        headers: JSON_HEADERS,
        body: typeof body === 'string' ? body : JSON.stringify(body)
      })
    }

    async function readResultFile(fileName: string): Promise<BenchmarkResult | null> {
      const file = Bun.file(resultPath(fileName))
      if (!(await file.exists())) return null
      return (await file.json()) as BenchmarkResult
    }

    async function requireResultFile(fileName: string, missingMessage: string): Promise<BenchmarkResult> {
      const result = await readResultFile(fileName)
      if (!result) {
        console.error(missingMessage)
        process.exit(1)
      }
      return result
    }

    function requireLatest(): Promise<BenchmarkResult> {
      return requireResultFile(LATEST_JSON, 'No latest.json - run `mise run perf run` first')
    }

    /** Sequential samples measure wall-clock latency per request (not parallelizable). */
    async function measure(baseUrl: string, endpoint: string, body: object, n = DEFAULT_SAMPLE_COUNT) {
      const samples: number[] = []
      const payload = JSON.stringify(body)
      for (let i = 0; i < n; i++) {
        const t = performance.now()
        const r = await postJson(baseUrl, endpoint, payload)
        if (r.ok) samples.push(performance.now() - t)
      }
      if (samples.length === 0) throw new Error(`All requests to /api/${endpoint} failed`)
      samples.sort((a, b) => a - b)
      return {
        p50: percentile(samples, P50_QUANTILE),
        p99: percentile(samples, P99_QUANTILE)
      }
    }

    async function measureThroughput(
      baseUrl: string,
      endpoint: string,
      body: object,
      durationMs = THROUGHPUT_DURATION_MS,
      concurrency = THROUGHPUT_CONCURRENCY
    ) {
      const until = performance.now() + durationMs
      let completed = 0
      const payload = JSON.stringify(body)
      async function worker(): Promise<void> {
        async function step(): Promise<void> {
          if (performance.now() >= until) return
          try {
            const r = await postJson(baseUrl, endpoint, payload)
            if (r.ok) completed += 1
          } catch {
            // ignore transient network errors during throughput window
          }
          return step()
        }
        await step()
      }
      await Promise.all(Array.from({ length: concurrency }, () => worker()))
      return completed / (durationMs / MS_PER_SECOND)
    }

    async function waitForServer(baseUrl: string, srv: ReturnType<typeof Bun.spawn>): Promise<void> {
      let exited = false
      srv.exited.then(() => {
        exited = true
      })
      for (let i = 0; i < READINESS_POLL_MAX; i++) {
        if (exited) throw new Error('Preview server exited before readiness')
        try {
          const r = await fetch(baseUrl)
          if (r.ok) return
        } catch {
          // connection refused until preview server is ready
        }
        await Bun.sleep(READINESS_POLL_MS)
      }
      throw new Error('Preview server did not start in 90 s')
    }

    function collectViolations(samples: BenchSamples): BenchmarkResult['violations'] {
      return METRICS.reduce<BenchmarkResult['violations']>((violations, m) => {
        const value = m.valueFrom(samples)
        const failed = m.kind === 'max' ? value > m.limit : value < m.limit
        if (failed) {
          violations.push({
            path: m.id,
            metric: m.metric,
            value: +value.toFixed(1),
            threshold: m.limit,
            delta: +(m.kind === 'max' ? value - m.limit : m.limit - value).toFixed(1)
          })
        }
        return violations
      }, [])
    }

    async function writeResultArtifacts(result: BenchmarkResult, runDir: string): Promise<void> {
      const json = JSON.stringify(result, null, 2)
      await mkdir(runDir, { recursive: true })
      await Bun.write(path.join(runDir, 'result.json'), json)
      await Bun.write(resultPath(LATEST_JSON), json)
    }

    function printPerformanceReport(result: BenchmarkResult, violations: BenchmarkResult['violations'], runDir: string) {
      console.log('\nPerformance Report')
      for (const m of METRICS) {
        console.log(`${m.reportLabel}  ${result.results[m.key]} ${m.unit}`)
      }
      console.log(`${result.summary} ${violations.length} violation(s) -> ${runDir}`)
    }

    const actions = {
      run: async () => {
        const baseUrl = `http://localhost:${port}`
        const gitSha = spawnText(['git', '-C', ROOT, 'rev-parse', 'HEAD'])
        const timestamp = new Date().toISOString()
        console.log('P1  cold start...')
        const t0 = performance.now()
        const srv = Bun.spawn(['bun', SERVER], {
          cwd: ROOT,
          env: { ...process.env, PORT: String(port) },
          stdout: 'ignore',
          stderr: 'inherit'
        })
        try {
          await waitForServer(baseUrl, srv)
          const p1 = performance.now() - t0
          console.log(`P1  ${p1.toFixed(0)} ms`)

          console.log('P2  FTS search (100 samples)...')
          const p2 = await measure(baseUrl, 'list', { query: 'bun', limit: 50 })
          console.log(`P2  p50=${p2.p50.toFixed(1)} ms  p99=${p2.p99.toFixed(1)} ms`)

          console.log('P3  filter query (100 samples)...')
          const p3 = await measure(baseUrl, 'list', { types: ['task'], limit: 50 })
          console.log(`P3  p50=${p3.p50.toFixed(1)} ms  p99=${p3.p99.toFixed(1)} ms`)

          console.log('P4  throughput 10 s...')
          const p4 = await measureThroughput(baseUrl, 'list', { query: 'bun', limit: 50 })
          console.log(`P4  ${p4.toFixed(0)} req/s`)

          console.log('P5  getStats (100 samples)...')
          const p5 = await measure(baseUrl, 'getStats', {})
          console.log(`P5  p50=${p5.p50.toFixed(1)} ms  p99=${p5.p99.toFixed(1)} ms`)

          const sample = { p1, p2, p3, p4, p5 }
          const violations = collectViolations(sample)
          const runDir = path.join(RESULTS, isoSlug(timestamp))
          const result: BenchmarkResult = {
            timestamp,
            git_sha: gitSha,
            bun_version: Bun.version,
            thresholds: THRESHOLDS,
            results: Object.fromEntries(METRICS.map(m => [m.key, +m.valueFrom(sample).toFixed(m.precision)])),
            violations,
            summary: violations.length === 0 ? 'PASS' : 'FAIL'
          }
          await writeResultArtifacts(result, runDir)
          printPerformanceReport(result, violations, runDir)
          process.exit(violations.length > 0 ? 1 : 0)
        } finally {
          srv.kill()
        }
      },
      compare: async () => {
        const [base, latest] = await Promise.all([
          requireResultFile(BASELINE_JSON, 'No baseline.json - run `mise run perf baseline` first'),
          requireLatest()
        ])
        console.log(`Baseline : ${formatRunLabel(base)}`)
        console.log(`Latest   : ${formatRunLabel(latest)}`)
        let regressions = 0
        for (const m of METRICS) {
          const b = base.results[m.key]
          const l = latest.results[m.key]
          const delta = (l ?? 0) - (b ?? 0)
          const pct = (b ?? 0) === 0 ? 0 : (delta / (b ?? 0)) * 100
          const regressed =
            m.compareDir === 'lower'
              ? (l ?? 0) > (b ?? 0) && (l ?? 0) - (b ?? 0) >= Math.max(0.25, (b ?? 0) * 0.2)
              : pct < -20
          if (regressed) regressions++
          const status = regressed ? 'REGRESSION' : Math.abs(pct) < 5 ? 'stable' : delta > 0 ? 'worse' : 'better'
          console.log(`${m.id} ${m.label}: ${b} -> ${l} (${delta >= 0 ? '+' : ''}${delta.toFixed(1)}${m.unit}) ${status}`)
        }
        console.log(`${regressions} regression(s)`)
        process.exit(regressions > 0 ? 1 : 0)
      },
      baseline: async () => {
        const latest = await requireLatest()
        await Bun.write(resultPath(BASELINE_JSON), Bun.file(resultPath(LATEST_JSON)))
        console.log(`Baseline set -> ${formatRunLabel(latest)}`)
      },
      open: async () => {
        const { timestamp } = await requireLatest()
        const child = Bun.spawnSync(['open', path.join(RESULTS, isoSlug(timestamp))])
        process.exit(child.exitCode ?? 0)
      }
    } as const

    const fn = actions[action as keyof typeof actions]
    if (!fn) {
      console.error('Usage: mise run perf <run|baseline|compare|open>')
      process.exit(1)
    }
    await fn()

  ''' }
"_icons" = { description = "Check and optionally fix SVG icon contrast", hide = true, usage = '''
    cmd "check" {}
    flag "--scope <scope>" help="Check scope" default="all" { choices "all" "brand" }
    flag "--strict" help="Exit non-zero on failure"
    flag "--write-safe" help="Apply safe hex replacements"
    flag "--min <min>" default="3" help="Minimum contrast ratio vs list shell background"
  ''', run = '''
    #!/usr/bin/env bun
    import { readdirSync } from 'node:fs'
    import path from 'node:path'

    /** Matches list.css `--theme-bg` (Andromeda Void shell). */
    const LIST_BG = '#0b0e14'
    /** WCAG 1.4.11 non-text contrast target for graphical objects (relaxed vs body text). */
    const DEFAULT_MIN_RATIO = 3
    /** Only these exact hex strings are rewritten with `--write-safe` (case-insensitive keys). */
    const SAFE_HEX_REPLACEMENTS: Record<string, string> = { '#24292f': '#e6edf3' }
    const HEX_IN_SVG = /#([0-9a-f]{3}|[0-9a-f]{6})\b/gi
    const RGB_IN_SVG = /rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)/gi
    const CHUNK = 80

    function die(msg: string, code = 1): never {
      console.error(msg)
      process.exit(code)
    }

    function chdirToGitRoot(): void {
      const r = Bun.spawnSync(['git', 'rev-parse', '--show-toplevel'])
      const root = r.stdout.toString().trim()
      if (!r.success || !root) die('icons: run from inside the app git checkout')
      process.chdir(root)
    }

    chdirToGitRoot()

    function parseArgs(argv: string[]) {
      const envScope = process.env.usage_scope
      let scope: 'brand' | 'all' = envScope === 'brand' || envScope === 'all' ? envScope : 'all'
      let writeSafe = process.env.usage_write_safe === 'true'
      let strict = process.env.usage_strict === 'true'
      let minRatio = DEFAULT_MIN_RATIO
      const envMin = process.env.usage_min
      if (envMin) {
        const n = Number(envMin)
        if (Number.isFinite(n) && n > 0) minRatio = n
      }
      for (const a of argv) {
        if (a === '--write-safe') writeSafe = true
        else if (a === '--strict') strict = true
        else if (a.startsWith('--scope=')) {
          const v = a.slice(8)
          if (v === 'brand' || v === 'all') scope = v
          else die(`Unknown --scope=${v} (use brand|all)`, 2)
        } else if (a.startsWith('--min=')) {
          minRatio = Number(a.slice(6))
          if (!Number.isFinite(minRatio) || minRatio <= 0) die(`Invalid --min=${a}`, 2)
        }
      }
      return { scope, writeSafe, strict, minRatio }
    }

    function expandShorthandHex(hex: string): string {
      const h = hex.slice(1).toLowerCase()
      if (h.length === 3) return `#${[...h].map(c => c + c).join('')}`
      if (h.length === 6) return `#${h}`
      return hex.toLowerCase()
    }

    function hexToRgb(hex: string): { r: number; g: number; b: number } | null {
      const m = /^#([0-9a-f]{6})$/.exec(expandShorthandHex(hex.startsWith('#') ? hex : `#${hex}`))
      if (!m?.[1]) return null
      const n = Number.parseInt(m[1], 16)
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }
    }

    function relativeLuminance(rgb: { r: number; g: number; b: number }): number {
      const ch = (u: number) => {
        const c = u / 255
        return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4
      }
      return 0.2126 * ch(rgb.r) + 0.7152 * ch(rgb.g) + 0.0722 * ch(rgb.b)
    }

    function contrastRatio(fgHex: string, bgHex: string): number | null {
      const fg = hexToRgb(fgHex)
      const bg = hexToRgb(bgHex)
      if (!fg || !bg) return null
      const l1 = relativeLuminance(fg)
      const l2 = relativeLuminance(bg)
      return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05)
    }

    function hasLightAndNearBlack(samples: string[]): boolean {
      let hasLight = false
      let hasNearBlack = false
      for (const raw of samples) {
        const rgb = hexToRgb(raw)
        if (!rgb) continue
        const L = relativeLuminance(rgb)
        if (L > 0.28) hasLight = true
        if (L < 0.12) hasNearBlack = true
        if (hasLight && hasNearBlack) return true
      }
      return false
    }

    function collectHexSamples(svgText: string): string[] {
      const out = new Set<string>()
      for (const m of svgText.matchAll(HEX_IN_SVG)) {
        if (m[1] !== undefined) out.add(expandShorthandHex(`#${m[1]}`))
      }
      for (const m of svgText.matchAll(RGB_IN_SVG)) {
        const r = Number(m[1])
        const g = Number(m[2])
        const b = Number(m[3])
        if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
          const clamp = (n: number) => Math.min(255, Math.max(0, Math.round(n)))
          const h = (n: number) => clamp(n).toString(16).padStart(2, '0')
          out.add(expandShorthandHex(`#${h(r)}${h(g)}${h(b)}`))
        }
      }
      return [...out]
    }

    async function loadBrandBasenames(root: string): Promise<string[]> {
      const dir = path.join(root, 'src/shell/renderer/constants')
      const [tag, ent] = await Promise.all([
        import(path.join(dir, 'tag_brand_svg_map.const.ts')),
        import(path.join(dir, 'entry_type_icon_basename.const.ts'))
      ])
      const t = tag as { TAG_BRAND_SVG_BASENAME: Record<string, string> }
      const e = ent as { ENTRY_TYPE_DEFAULT_SVG_BASENAME: Record<string, string> }
      return [
        ...new Set([...Object.values(t.TAG_BRAND_SVG_BASENAME), ...Object.values(e.ENTRY_TYPE_DEFAULT_SVG_BASENAME)])
      ].sort()
    }

    function listSvgBasenames(imagesDir: string): string[] {
      return readdirSync(imagesDir)
        .filter(n => n.endsWith('.svg'))
        .map(n => n.replace(/\.svg$/i, ''))
        .sort()
    }

    function applySafeReplacements(content: string): { next: string; hits: number } {
      let next = content
      let hits = 0
      for (const [from, to] of Object.entries(SAFE_HEX_REPLACEMENTS)) {
        next = next.replace(new RegExp(from, 'gi'), m => {
          if (m.toLowerCase() !== from.toLowerCase()) return m
          hits += 1
          return to
        })
      }
      return { next, hits }
    }

    type ScanRow =
      | { base: string; missing: true }
      | { base: string; missing: false; bad: { hex: string; ratio: number }[]; written: boolean }

    async function scanOne(imagesDir: string, base: string, writeSafe: boolean, minRatio: number): Promise<ScanRow> {
      const filePath = path.join(imagesDir, `${base}.svg`)
      const file = Bun.file(filePath)
      if (!(await file.exists())) {
        console.warn(`missing: ${base}.svg`)
        return { base, missing: true }
      }

      let text = await file.text()
      let written = false
      if (writeSafe) {
        const { next, hits } = applySafeReplacements(text)
        if (hits > 0 && next !== text) {
          await Bun.write(filePath, next)
          written = true
          console.log(`write-safe: ${base}.svg (${hits} replacement(s))`)
          text = next
        }
      }

      const samples = collectHexSamples(text)
      const dualTone = hasLightAndNearBlack(samples)
      const bad = samples.flatMap(hex => {
        const rgb = hexToRgb(hex)
        if (!rgb || (dualTone && relativeLuminance(rgb) < 0.12)) return []
        const ratio = contrastRatio(hex, LIST_BG)
        return ratio !== null && ratio < minRatio ? [{ hex, ratio }] : []
      })
      return { base, missing: false, bad, written }
    }

    async function main() {
      const root = process.cwd()
      const imagesDir = path.join(root, 'assets/images')
      const { scope, writeSafe, strict, minRatio } = parseArgs(process.argv.slice(2))
      const basenames = scope === 'brand' ? await loadBrandBasenames(root) : listSvgBasenames(imagesDir)

      const rows: ScanRow[] = []
      for (let i = 0; i < basenames.length; i += CHUNK) {
        const part = await Promise.all(
          basenames.slice(i, i + CHUNK).map(base => scanOne(imagesDir, base, writeSafe, minRatio))
        )
        rows.push(...part)
      }

      let failures = 0
      let filesWritten = 0
      for (const row of rows) {
        if (row.missing) continue
        if (row.written) filesWritten += 1
        if (row.bad.length === 0) continue
        failures += 1
        const line = row.bad
          .toSorted((a, b) => a.ratio - b.ratio)
          .map(x => `${x.hex} (${x.ratio.toFixed(2)}:1)`)
          .join(', ')
        console.log(`FAIL ${row.base}.svg  <${minRatio}:1  vs ${LIST_BG}  →  ${line}`)
      }

      console.log('')
      console.log(
        `scope=${scope}  files=${basenames.length}  failing=${failures}  minRatio=${minRatio}  writeSafe=${writeSafe}  strict=${strict}  written=${filesWritten}`
      )
      if (failures > 0) {
        console.log(
          'Hint: add targeted entries to SAFE_HEX_REPLACEMENTS and run with --write-safe; use --strict to fail CI'
        )
        if (strict) process.exit(1)
      }
    }

    await main()

  ''' }
"lint" = { description = "Run lint, strict lint, fix, report, and graph workflows", usage = '''
    cmd "check" {
      flag "--biome" help="Run Biome"
      flag "--knip" help="Run Knip"
      flag "--depcruise" help="Run dependency-cruiser"
      flag "--jscpd" help="Run jscpd"
      flag "--ls" help="Run ls-lint"
      flag "--hadolint" help="Run hadolint on Dockerfile"
      flag "--ast-grep" help="Run ast-grep"
      flag "--mise" help="Run tombi on mise.toml"
      flag "--typecheck" help="Run TypeScript check"
      flag "--ci" help="Use CI reporters and write under tmp/reports/linters"
    }
    cmd "fix" {
      flag "--biome" help="Fix Biome findings"
      flag "--ast-grep" help="Apply ast-grep rewrites"
      flag "--typecheck" help="Run TypeScript check after fixes"
      flag "--knip" help="Fail with guidance; Knip has no fixer"
    }
    cmd "graph" {}
  ''', run = '''
    #!/usr/bin/env bash
    set -euo pipefail

    is_true() { [[ "${1:-false}" == "true" ]]; }

    lint_flag_set=false
    is_true "${usage_biome:-false}" && lint_flag_set=true
    is_true "${usage_knip:-false}" && lint_flag_set=true
    is_true "${usage_depcruise:-false}" && lint_flag_set=true
    is_true "${usage_jscpd:-false}" && lint_flag_set=true
    is_true "${usage_ls:-false}" && lint_flag_set=true
    is_true "${usage_hadolint:-false}" && lint_flag_set=true
    is_true "${usage_ast_grep:-false}" && lint_flag_set=true
    is_true "${usage_mise:-false}" && lint_flag_set=true
    is_true "${usage_typecheck:-false}" && lint_flag_set=true
    want() {
      if [[ "$lint_flag_set" == "false" ]]; then
        return 0
      fi
      is_true "${1:-false}"
    }

    graph() {
      mkdir -p tmp/reports
      bunx depcruise . --config .dependency-cruiser.cjs --include-only '^.' --output-type mermaid --output-to tmp/reports/dependency-graph.mmd
    }

    if is_true "${usage_ci:-false}"; then
      mkdir -p tmp/reports/linters
    fi

    clear_local_jscpd_report() {
      if ! is_true "${usage_ci:-false}"; then
        rm -rf tmp/reports/linters/jscpd
      fi
    }

    run_biome() {
      if is_true "${usage_ci:-false}"; then
        bunx biome check --reporter=github
      else
        clear_local_jscpd_report
        bun run lint:biome:strict
      fi
    }

    run_knip() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:knip -- --reporter compact | tee tmp/reports/linters/knip.txt
      else
        bun run lint:knip
      fi
    }

    run_depcruise() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:depcruise -- --output-type json --output-to tmp/reports/linters/depcruise.json
      else
        bun run lint:depcruise
      fi
    }

    run_jscpd() {
      if is_true "${usage_ci:-false}"; then
        bunx jscpd . --noTips --reporters json,console --output tmp/reports/linters/jscpd
      else
        bun run lint:jscpd
      fi
    }

    run_ls() {
      if is_true "${usage_ci:-false}"; then
        bunx @ls-lint/ls-lint | tee tmp/reports/linters/ls-lint.txt
      else
        bun run lint:ls
      fi
    }

    run_hadolint() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:hadolint | tee tmp/reports/linters/hadolint.txt
      else
        bun run lint:hadolint
      fi
    }

    run_ast_grep() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:ast-grep | tee tmp/reports/linters/ast-grep.txt
      else
        bun run lint:ast-grep
      fi
    }

    run_mise() {
      if is_true "${usage_ci:-false}"; then
        bun run lint:mise | tee tmp/reports/linters/mise.txt
      else
        bun run lint:mise
      fi
    }

    run_renderer_css_tokens() {
      bun run lint:renderer-css
    }

    run_spec_testing_guide() {
      bun run lint:spec-guide
    }

    case "${usage_cmd:-check}" in
      check)
        e=0
        want "${usage_typecheck:-false}" && { bun run typecheck || e=1; }
        want "${usage_biome:-false}" && { run_biome || e=1; }
        want "${usage_knip:-false}" && { run_knip || e=1; }
        want "${usage_depcruise:-false}" && { run_depcruise || e=1; }
        want "${usage_mise:-false}" && { run_mise || e=1; }
        want "${usage_jscpd:-false}" && { run_jscpd || e=1; }
        want "${usage_ls:-false}" && { run_ls || e=1; }
        want "${usage_hadolint:-false}" && { run_hadolint || e=1; }
