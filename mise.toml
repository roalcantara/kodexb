}
cmd "reconcile" {
  flag "--dry-run" help="Report drift without writing YAML scaffolds"
  flag "--raw" help="Plain text output (no gum)"
  flag "--json" help="Machine-readable JSON output"
}
cmd "create" {
  arg "<skill-id>" help="Owned skill id (kebab-case)"
  flag "--type" help="Policy type: required or optional"
  flag "--rationale" help="Registry rationale"
  flag "--description" help="SKILL.md frontmatter description"
  flag "--dry-run" help="Print plan without creating files"
}
cmd "prune" {
  flag "--dry-run" help="Report orphan installs without removing"
}
''', run = '''
#!/usr/bin/env bash
set -euo pipefail
REPO_ROOT="$(git rev-parse --show-toplevel)"
cd "$REPO_ROOT"
CMD="${usage_cmd:-}"
exec bun tools/bin/skill.script.ts "$CMD" "$@"
''' }
