[tasks."perf:run"]
description = "Measure all 5 critical paths against the live preview server"
run = '''
#!/usr/bin/env bun
import { $ } from "bun"
import { mkdir, writeFile } from "node:fs/promises"
import path from "node:path"

/** Repo root: set by root mise stubs via PERF_ROOT (inline Bun cwd is unreliable). */
function repoRoot(): string {
  const fromEnv = process.env.PERF_ROOT ?? process.env.MISE_PROJECT_ROOT
  if (fromEnv) return fromEnv
  const cwd = process.cwd()
  if (path.basename(cwd) === "benchmarks" && path.basename(path.dirname(cwd)) === "tools") {
    return path.resolve(cwd, "../..")
  }
  return cwd
}

const ROOT     = repoRoot()
const BENCH    = path.join(ROOT, "tools", "benchmarks")
const SERVER   = path.join(ROOT, "tools/preview/server.ts")
const RESULTS  = path.join(BENCH, "results")
const BASE_URL = "http://localhost:3457"

const THRESHOLDS = {
  p1_cold_start_ms: 300,          // 2.4× actual (126 ms) — CI headroom
  p2_p50_ms: 2,  p2_p99_ms: 4,   // 20× / 6× actual (0.1 / 0.7 ms)
  p3_p50_ms: 2,  p3_p99_ms: 3,   // 20× / 7× actual (0.1 / 0.4 ms)
  p4_req_per_sec: 8000,           // 60% of actual (13 371 r/s)
  p5_p50_ms: 3,  p5_p99_ms: 5,   // 4× / 5× baseline (0.7 / 1.0 ms) — pending index fix
}

// ── Metadata ────────────────────────────────────────────────────────────────
const gitSha    = (await $`git -C ${ROOT} rev-parse HEAD`.text()).trim()
const bunVer    = (await $`bun --version`.text()).trim()
const timestamp = new Date().toISOString()

// ── P1: Cold start ──────────────────────────────────────────────────────────
console.log("P1  cold start...")
const t0  = performance.now()
const srv = Bun.spawn(["bun", SERVER], {
  cwd: ROOT,
  env: { ...process.env, PORT: "3457" },
  stdout: "ignore",
  stderr: "ignore",
})
let ready = false
// First boot includes Bun.build(renderer); allow up to ~90 s on slow machines
for (let i = 0; i < 900; i++) {
  try { const r = await fetch(BASE_URL); if (r.ok) { ready = true; break } } catch {}
  await Bun.sleep(100)
}
const p1 = performance.now() - t0
if (!ready) { srv.kill(); throw new Error("Preview server did not start in 90 s") }
console.log(`P1  ${p1.toFixed(0)} ms`)

// ── Latency helper ──────────────────────────────────────────────────────────
async function measure(endpoint: string, body: object, n = 100) {
  const samples: number[] = []
  for (let i = 0; i < n; i++) {
    const t = performance.now()
    const r = await fetch(`${BASE_URL}/api/${endpoint}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
    if (r.ok) samples.push(performance.now() - t)
  }
  if (samples.length === 0) throw new Error(`All requests to /api/${endpoint} failed`)
  samples.sort((a, b) => a - b)
  const last = samples.length - 1
  return {
    p50: samples[Math.floor(last * 0.50)]!,
    p99: samples[Math.floor(last * 0.99)]!,
  }
}

// ── P2: FTS search ──────────────────────────────────────────────────────────
console.log("P2  FTS search (100 samples)...")
const p2 = await measure("list", { query: "bun", limit: 50 })
console.log(`P2  p50=${p2.p50.toFixed(1)} ms  p99=${p2.p99.toFixed(1)} ms`)

// ── P3: Filter query ────────────────────────────────────────────────────────
console.log("P3  filter query (100 samples)...")
const p3 = await measure("list", { types: ["task"], limit: 50 })
console.log(`P3  p50=${p3.p50.toFixed(1)} ms  p99=${p3.p99.toFixed(1)} ms`)

// ── P4: Throughput ──────────────────────────────────────────────────────────
console.log("P4  autocannon 10 s...")
const ac = await $`bunx autocannon -c 10 -d 10 --json -m POST -H "Content-Type: application/json" -b '{"query":"bun","limit":50}' ${BASE_URL}/api/list`.text()
const p4 = (JSON.parse(ac) as { requests: { average: number } }).requests.average
console.log(`P4  ${p4.toFixed(0)} req/s`)

// ── P5: Stats query ─────────────────────────────────────────────────────────
console.log("P5  getStats (100 samples)...")
const p5 = await measure("getStats", {})
console.log(`P5  p50=${p5.p50.toFixed(1)} ms  p99=${p5.p99.toFixed(1)} ms`)

// ── Shutdown ────────────────────────────────────────────────────────────────
srv.kill()

// ── Violations ──────────────────────────────────────────────────────────────
type Violation = { path: string; metric: string; value: number; threshold: number; delta: number }
const violations: Violation[] = []
// checkMax: fires when value exceeds limit (lower-is-better metrics)
const checkMax = (id: string, metric: string, value: number, limit: number) => {
  if (value > limit) violations.push({ path: id, metric, value: +value.toFixed(1), threshold: limit, delta: +(value - limit).toFixed(1) })
}
// checkMin: fires when value falls below limit (higher-is-better metrics, e.g. throughput)
const checkMin = (id: string, metric: string, value: number, limit: number) => {
  if (value < limit) violations.push({ path: id, metric, value: +value.toFixed(1), threshold: limit, delta: +(limit - value).toFixed(1) })
}
checkMax("P1", "cold_start_ms", p1, THRESHOLDS.p1_cold_start_ms)
checkMax("P2", "p50_ms", p2.p50, THRESHOLDS.p2_p50_ms)
checkMax("P2", "p99_ms", p2.p99, THRESHOLDS.p2_p99_ms)
checkMax("P3", "p50_ms", p3.p50, THRESHOLDS.p3_p50_ms)
checkMax("P3", "p99_ms", p3.p99, THRESHOLDS.p3_p99_ms)
checkMin("P4", "req_per_sec", p4, THRESHOLDS.p4_req_per_sec)
checkMax("P5", "p50_ms", p5.p50, THRESHOLDS.p5_p50_ms)
checkMax("P5", "p99_ms", p5.p99, THRESHOLDS.p5_p99_ms)

// ── Write artifact ──────────────────────────────────────────────────────────
const slug = timestamp.replace(/[:.]/g, "-").slice(0, 19)
const dir  = path.join(RESULTS, slug)
await mkdir(dir, { recursive: true })
const result = {
  timestamp, git_sha: gitSha, bun_version: bunVer,
  thresholds: THRESHOLDS,
  results: {
    p1_cold_start_ms: +p1.toFixed(1),
    p2_p50_ms: +p2.p50.toFixed(1), p2_p99_ms: +p2.p99.toFixed(1),
    p3_p50_ms: +p3.p50.toFixed(1), p3_p99_ms: +p3.p99.toFixed(1),
    p4_req_per_sec: +p4.toFixed(0),
    p5_p50_ms: +p5.p50.toFixed(1), p5_p99_ms: +p5.p99.toFixed(1),
  },
  violations,
  summary: violations.length === 0 ? "PASS" : "FAIL",
}
const json = JSON.stringify(result, null, 2)
await writeFile(path.join(dir, "result.json"), json)
await writeFile(path.join(RESULTS, "latest.json"), json)

// ── Print summary ────────────────────────────────────────────────────────────
const row = (id: string, metric: string, val: string, ok: boolean) =>
  `  ${id.padEnd(4)} ${metric.padEnd(16)} ${val.padEnd(12)} ${ok ? "✅" : "❌"}`
console.log("\n── Performance Report ─────────────────────────────────────────")
console.log(row("P1", "cold start",  `${p1.toFixed(0)} ms`,     p1     <= THRESHOLDS.p1_cold_start_ms))
console.log(row("P2", "FTS p50",     `${p2.p50.toFixed(1)} ms`, p2.p50 <= THRESHOLDS.p2_p50_ms))
console.log(row("P2", "FTS p99",     `${p2.p99.toFixed(1)} ms`, p2.p99 <= THRESHOLDS.p2_p99_ms))
console.log(row("P3", "filter p50",  `${p3.p50.toFixed(1)} ms`, p3.p50 <= THRESHOLDS.p3_p50_ms))
console.log(row("P3", "filter p99",  `${p3.p99.toFixed(1)} ms`, p3.p99 <= THRESHOLDS.p3_p99_ms))
console.log(row("P4", "throughput",  `${p4.toFixed(0)} req/s`,  p4     >= THRESHOLDS.p4_req_per_sec))
console.log(row("P5", "stats p50",   `${p5.p50.toFixed(1)} ms`, p5.p50 <= THRESHOLDS.p5_p50_ms))
console.log(row("P5", "stats p99",   `${p5.p99.toFixed(1)} ms`, p5.p99 <= THRESHOLDS.p5_p99_ms))
console.log("───────────────────────────────────────────────────────────────")
console.log(`  ${result.summary}  ${violations.length} violation(s)  ->  ${dir}`)

process.exit(violations.length > 0 ? 1 : 0)
'''

[tasks."perf:compare"]
description = "Diff latest.json against baseline.json — exit 1 on regression > 20%"
run = '''
#!/usr/bin/env bun
import { readFile } from "node:fs/promises"
import path from "node:path"

function repoRoot(): string {
  const fromEnv = process.env.PERF_ROOT ?? process.env.MISE_PROJECT_ROOT
  if (fromEnv) return fromEnv
  const cwd = process.cwd()
  if (path.basename(cwd) === "benchmarks" && path.basename(path.dirname(cwd)) === "tools") {
    return path.resolve(cwd, "../..")
  }
  return cwd
}
const RESULTS = path.join(repoRoot(), "tools", "benchmarks", "results")
const [baseRaw, latestRaw] = await Promise.all([
  readFile(path.join(RESULTS, "baseline.json"), "utf-8").catch(() => null),
  readFile(path.join(RESULTS, "latest.json"),   "utf-8").catch(() => null),
])
if (!baseRaw)   { console.error("No baseline.json — run `mise run perf:baseline` first"); process.exit(1) }
if (!latestRaw) { console.error("No latest.json — run `mise run perf:run` first");        process.exit(1) }

const base   = JSON.parse(baseRaw)
const latest = JSON.parse(latestRaw)

const metrics = [
  { id: "P1", key: "p1_cold_start_ms", label: "cold start",  dir: "lower"  },
  { id: "P2", key: "p2_p50_ms",        label: "FTS p50",     dir: "lower"  },
  { id: "P2", key: "p2_p99_ms",        label: "FTS p99",     dir: "lower"  },
  { id: "P3", key: "p3_p50_ms",        label: "filter p50",  dir: "lower"  },
  { id: "P3", key: "p3_p99_ms",        label: "filter p99",  dir: "lower"  },
  { id: "P4", key: "p4_req_per_sec",   label: "throughput",  dir: "higher" },
  { id: "P5", key: "p5_p50_ms",        label: "stats p50",   dir: "lower"  },
  { id: "P5", key: "p5_p99_ms",        label: "stats p99",   dir: "lower"  },
]

console.log(`\nBaseline : ${base.git_sha.slice(0,8)}  ${base.timestamp.slice(0,10)}`)
console.log(`Latest   : ${latest.git_sha.slice(0,8)}  ${latest.timestamp.slice(0,10)}`)
console.log("-".repeat(65))
console.log("  ID   Metric           Baseline     Latest       Delta   Status")
console.log("-".repeat(65))

let regressions = 0
for (const { id, key, label, dir } of metrics) {
  const b = base.results[key] as number
  const l = latest.results[key] as number
  const delta = l - b
  const pct   = b === 0 ? 0 : (delta / b) * 100
  // Sub-ms samples: pure % triggers false positives (e.g. 0.4→0.6 ms = +50%).
  const minAbsMs = 0.25
  const regressed =
    dir === "lower"
      ? l > b && (l - b) >= Math.max(minAbsMs, b * 0.2)
      : pct < -20
  if (regressed) regressions++
  const icon = regressed ? "❌ REGRESSION" : Math.abs(pct) < 5 ? "  ✅ stable" : delta > 0 ? "  ⚠ worse" : "  ✅ better"
  const unit = key.includes("req") ? "r/s" : "ms"
  console.log(`  ${id.padEnd(4)} ${label.padEnd(16)} ${String(b).padEnd(12)} ${String(l).padEnd(12)} ${(delta >= 0 ? "+" : "") + delta.toFixed(1) + unit}  ${icon}`)
}
console.log("-".repeat(65))
console.log(
  `  ${regressions} regression(s) (latency: Δ ≥ max(0.25 ms, 20% of baseline); throughput: Δ worse than -20%)`,
)
process.exit(regressions > 0 ? 1 : 0)
'''

[tasks."perf:baseline"]
description = "Promote latest.json to baseline.json"
run = '''
#!/usr/bin/env bun
import { copyFile, readFile } from "node:fs/promises"
import path from "node:path"

function repoRoot(): string {
  const fromEnv = process.env.PERF_ROOT ?? process.env.MISE_PROJECT_ROOT
  if (fromEnv) return fromEnv
  const cwd = process.cwd()
  if (path.basename(cwd) === "benchmarks" && path.basename(path.dirname(cwd)) === "tools") {
    return path.resolve(cwd, "../..")
  }
  return cwd
}
const RESULTS = path.join(repoRoot(), "tools", "benchmarks", "results")
const src = path.join(RESULTS, "latest.json")
const dst = path.join(RESULTS, "baseline.json")
const raw = await readFile(src, "utf-8").catch(() => null)
if (!raw) { console.error("No latest.json — run `mise run perf:run` first"); process.exit(1) }
await copyFile(src, dst)
const { git_sha, timestamp } = JSON.parse(raw)
console.log(`Baseline set -> ${git_sha.slice(0,8)} (${timestamp.slice(0,10)})`)
'''

[tasks."perf:open"]
description = "Open latest benchmark result folder in Finder"
run = '''
#!/usr/bin/env bun
import { $ } from "bun"
import path from "node:path"

function repoRoot(): string {
  const fromEnv = process.env.PERF_ROOT ?? process.env.MISE_PROJECT_ROOT
  if (fromEnv) return fromEnv
  const cwd = process.cwd()
  if (path.basename(cwd) === "benchmarks" && path.basename(path.dirname(cwd)) === "tools") {
    return path.resolve(cwd, "../..")
  }
  return cwd
}
const RESULTS = path.join(repoRoot(), "tools", "benchmarks", "results")
const latest = path.join(RESULTS, "latest.json")
const raw = await Bun.file(latest).text().catch(() => null)
if (!raw) { console.error("No latest.json yet — run perf:run first"); process.exit(1) }
const { timestamp } = JSON.parse(raw)
const slug = timestamp.replace(/[:.]/g, "-").slice(0, 19)
const dir  = path.join(RESULTS, slug)
await $`open ${dir}`
'''
