schema_version: 009.1.0
name: fixture-test
execution_policy:
  allowed_prefixes:
    - "bun run"
    - "echo"
    - "mkdir"
stages:
  - id: specify
    worker: primary
  - id: plan
    worker: primary
    sandbox:
      tool_allowlist: ["bun run", "echo", "mkdir"]
      fs_scope:
        allow_roots: ["/tmp", "${WORKSPACE_ROOT}"]
        deny: ["${WORKSPACE_ROOT}/.env", "${WORKSPACE_ROOT}/.git"]
      secret_handling: "redacted"
      network: "offline"
      acknowledged_unsafe: false
  - id: pr-prep
    worker: primary
    triggers:
      post: "echo pr-prep-done"
transitions:
  - from: specify
    to: plan
    on: DONE
  - from: plan
    to: pr-prep
    on: DONE
terminal:
  - gate
default_retry:
  max_attempts: 3
  backoff: exponential
  base_ms: 500
  cap_ms: 30000
  jitter: full
  reset_on_new_cause: true
  escalation_event: stage.escalated
memory:
  conflict: prompt_user
  retention:
    tmp_days: 30
    durable_days: 365
providers:
  pr_open: "echo pr-created"
  pr_update: "echo pr-updated"
  ci_status: "echo ci-green"
shutdown:
  grace_ms: 10000
  signals:
    - SIGINT
    - SIGTERM
