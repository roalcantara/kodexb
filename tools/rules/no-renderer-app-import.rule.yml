# Renderer files must never import directly from src/shell/app/.
# All communication goes through the Eden Treaty client (@rpc/client).
# dependency-cruiser enforces this at the module graph level;
# this rule catches literal string patterns at the AST level.
id: no-renderer-app-import
language: TypeScript
files:
  - "src/shell/renderer/**/*.ts"
  - "src/shell/renderer/**/*.tsx"
severity: error
rule:
  any:
    - pattern: import $$$NAMES from '$$$PATH/shell/app/$$$REST'
    - pattern: import $$$NAMES from "$$$PATH/shell/app/$$$REST"
    - pattern: import { $$$NAMES } from '$$$PATH/shell/app/$$$REST'
    - pattern: import { $$$NAMES } from "$$$PATH/shell/app/$$$REST"
message: >
  Renderer files must not import from src/shell/app/ directly.
  Use the Eden Treaty RPC client: import { rpc } from '@rpc/client'.
note: See assets/guides/FCIS.guide.md — FCIS layer rules and Eden Treaty RPC.
