# String literals in TS/JS must not reference assets/docs/* outside allowlisted tools.
id: no-inbound-assets-docs-ts
language: TypeScript
severity: error
ignores:
  - "**/assets/docs/**"
  - "**/graphify-out/**"
  - "**/.opencode/**"
  - "tools/e2e/**"
  - "tools/spec/library_manifest.script.ts"
  - "tools/spec/library_manifest.script.spec.ts"
  - "tools/spec/import_legacy.script.ts"
  - "tools/mise/test.script.ts"
  - "tools/rules/no-inbound-assets-docs-*.rule.yml"
rule:
  all:
    - kind: string
    - regex: assets/docs/
message: >
  Do not embed assets/docs/* paths in source or tooling (except allowlisted manifest/e2e tools).
  Hard rules belong in assets/guides/ only.
note: See assets/guides/DOC_AUTHORITY.md
