# ast-grep rule definitions under tools/rules/ must use the .rule.yml suffix.
id: tools-rules-must-use-rule-suffix
language: Yaml
files:
  - 'tools/rules/*.yml'
ignores:
  - 'tools/rules/*.rule.yml'
severity: error
rule:
  kind: document
message: >
  ast-grep rules must be named <id>.rule.yml under tools/rules/.
note: See assets/guides/CODESTYLE_GUIDE.md — Tools directory naming.
