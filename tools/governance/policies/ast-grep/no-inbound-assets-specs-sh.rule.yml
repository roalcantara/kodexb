# SH scalars must not reference assets/specs/* outside allowlisted paths.
id: no-inbound-assets-specs-sh
language: bash
severity: error
ignores:
  - "**/assets/specs/**"
  - "**/assets/guides/**"
  - "**/.specify/**"
  - "**/tmp/**"
  - "**/graphify-out/**"
  - "tools/governance/policies/ast-grep/*.rule.yml"
rule:
  all:
    - kind: program
    - regex: assets/specs/
message: >
  SH scripts must not reference assets/specs/* outside allowlisted temporary/governance areas.
  Hard-rule policy belongs in assets/guides/.
note: See assets/guides/DOC_AUTHORITY.md
