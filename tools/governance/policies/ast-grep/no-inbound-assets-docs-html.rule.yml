# Markdown / MDC prose must not reference assets/docs/* (feature-dev scratchpad).
# .md / .mdc are parsed as Html via sgconfig.yml languageGlobs.
id: no-inbound-assets-docs-html
language: Html
severity: error
ignores:
  - "**/assets/docs/**"
  - "**/graphify-out/**"
  - "**/.opencode/**"
  - "tools/governance/policies/ast-grep/no-inbound-assets-docs-*.rule.yml"
rule:
  all:
    - kind: text
    - regex: assets/docs/
message: >
  Permanent docs must not reference assets/docs/* (feature-dev scratchpad only).
  Put hard rules in assets/guides/; open NNN-<slug>/ only when the task names that slug.
note: See assets/guides/DOC_AUTHORITY.md
