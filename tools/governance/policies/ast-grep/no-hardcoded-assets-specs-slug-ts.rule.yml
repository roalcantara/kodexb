# TS/JS code must not hardcode specific in-flight slug paths under assets/specs.
id: no-hardcoded-assets-specs-slug-ts
language: TypeScript
severity: error
ignores:
  - "**/assets/specs/**"
  - "**/assets/guides/**"
  - "**/.specify/**"
  - "**/tmp/**"
  - "**/graphify-out/**"
  - "packages/ops/src/governance/policies/ast-grep/**"
  - "packages/ops/src/**/migrations/**"
  - "packages/ops/src/**/migration/**"
  - "packages/ops/src/**/*migrate*.script.ts"
rule:
  all:
    - kind: string
    - regex: assets/specs/\d{3,}-[\w-]+(?:/|$)
message: >
  Do not hardcode assets/specs/<NNN>-<slug> paths in code.
  Treat assets/specs as ephemeral in-flight state; use feature-dir inputs,
  catalog path loaders, or test fixtures instead.
note: See assets/guides/DOC_AUTHORITY.md#in-flight-specs-are-ephemeral
