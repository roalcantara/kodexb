# Every TypeScript module under tools/ must declare the .script.ts artifact suffix.
# Exceptions: co-located tests (*.script.spec.ts), type-only modules (*.types.ts),
# and type-only schema modules (*.schema.ts).
id: tools-must-use-script-suffix
language: TypeScript
files:
  - 'packages/ops/**/*.ts'
  - 'packages/dev/**/*.ts'
ignores:
  - 'packages/ops/src/**/*.script.ts'
  - 'packages/ops/src/**/*.script.spec.ts'
  - 'packages/ops/src/**/*.types.ts'
  - 'packages/ops/src/**/*.schema.ts'
  - 'packages/ops/src/**/*.schema.spec.ts'
  - 'packages/dev/src/**/*.script.ts'
  - 'packages/dev/src/**/*.script.spec.ts'
severity: error
rule:
  kind: program
message: >
  Tools TypeScript must use the .script.ts suffix (e.g. packages/ops/src/governance/registries/catalog/catalog.script.ts).
  Co-located tests use .script.spec.ts; type-only modules use .types.ts.
note: See assets/guides/CODESTYLE_GUIDE.md — Tools directory naming.
