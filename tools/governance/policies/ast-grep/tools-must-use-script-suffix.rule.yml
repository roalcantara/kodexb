# Every TypeScript module under tools/ must declare the .script.ts artifact suffix.
# Exceptions: co-located tests (*.script.spec.ts), type-only modules (*.types.ts),
# and L1 pure engine modules (machine.ts, machine.spec.ts per 009 architecture).
id: tools-must-use-script-suffix
language: TypeScript
files:
  - 'tools/**/*.ts'
ignores:
  - 'tools/**/*.script.ts'
  - 'tools/**/*.script.spec.ts'
  - 'tools/**/*.types.ts'
  - 'tools/**/*.schema.ts'
  - 'tools/**/*.schema.spec.ts'
  - 'tools/**/machine.ts'
  - 'tools/**/machine.spec.ts'
severity: error
rule:
  kind: program
message: >
  Tools TypeScript must use the .script.ts suffix (e.g. tools/governance/registries/catalog/catalog.script.ts).
  Co-located tests use .script.spec.ts; type-only modules use .types.ts.
note: See assets/guides/CODESTYLE_GUIDE.md — Tools directory naming.
