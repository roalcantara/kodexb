# ast-grep rule definitions under tools/governance/policies/ast-grep/ must use the .rule.yml suffix.
id: tools-rules-must-use-rule-suffix
language: Yaml
files:
  - 'tools/governance/policies/ast-grep/*.yml'
ignores:
  - 'tools/governance/policies/ast-grep/*.rule.yml'
severity: error
rule:
  kind: document
message: >
  ast-grep rules must be named <id>.rule.yml under tools/governance/policies/ast-grep/.
note: See assets/guides/CODESTYLE_GUIDE.md — Tools directory naming.
