# src/ must use TypeBox-based validation; Zod is forbidden.
id: no-zod-in-src
language: TypeScript
files:
  - 'src/**/*.ts'
  - 'src/**/*.tsx'
severity: error
rule:
  any:
    - pattern: import { $$$NAMES } from 'zod'
    - pattern: import { $$$NAMES } from "zod"
    - pattern: import * as z from 'zod'
    - pattern: import * as z from "zod"
    - pattern: import z from 'zod'
    - pattern: import z from "zod"
message: >
  Do not import Zod in src/. Use TypeBox (@sinclair/typebox) and Value.Check/Value.Errors instead.
note: See assets/guides/CODESTYLE_GUIDE.md — TypeBox validation in Elysia routes.
